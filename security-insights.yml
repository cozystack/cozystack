      social: https://github.com/kvaps
      affiliation: Ænix
      primary: true
    - name: Kingdon Barrett
      social: https://github.com/kingdonb
      affiliation: Urmanac
      primary: false
    - name: Timofei Larkin
      social: https://github.com/lllamnyp
      affiliation: Ænix
      primary: false
    - name: Timur Tukaev
      social: https://github.com/tym83
      affiliation: Ænix
      primary: false
    - name: Matthieu Robin
      social: https://github.com/matthieu-robin
      affiliation: Hidora
      primary: false
    - name: Mattia Eleuteri
      social: https://github.com/mattia-eleuteri
      affiliation: Hidora
      primary: false
    - name: Aleksei Sviridkin
      social: https://github.com/lexfrei
      affiliation: Ænix
      primary: false
    - name: Daniil Miasnikov
      social: https://github.com/myasnikovdaniil
      affiliation: Ænix
      primary: false
    - name: Ivan Okhotnikov
      social: https://github.com/IvanHunters
      affiliation: Ænix
      primary: false
  license:
    expression: Apache-2.0
    url: https://github.com/cozystack/cozystack/blob/main/LICENSE
  documentation:
    contributing-guide: https://github.com/cozystack/cozystack/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/cozystack/cozystack/blob/main/GENERAL_TECHNICAL_REVIEW.md#dependencies
    governance: https://github.com/cozystack/cozystack/blob/main/GOVERNANCE.md
    security-policy: https://github.com/cozystack/cozystack/blob/main/SECURITY.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/cozystack/cozystack/releases
        comment: Operator manifests, CRDs, cozypkg binaries and Talos images are attached to each release.
      - uri: ghcr.io/cozystack/cozystack
        comment: Container images and the packages OCI artifact.
    changelog: https://github.com/cozystack/cozystack/blob/main/docs/changelogs/v{version}.md
  security:
    assessments:
      self:
        name: Cozystack Self-assessment
        comment: Security self-assessment prepared by the maintainers for the CNCF Incubation application.
        evidence: https://github.com/cozystack/cozystack/blob/main/docs/security/self-assessment.md
    champions:
      - name: Timur Tukaev
        social: https://github.com/tym83
        primary: true
    tools:
      - name: CodeQL
        type: SAST
        rulesets: [default]
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: Runs on every pull request to main, on push to main, and weekly.
      - name: zizmor
        type: SAST
        rulesets: [default]
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: Audits the GitHub Actions workflows; part of the required pre-commit check, scoped by .github/zizmor.yml.
      - name: OpenSSF Scorecard
        type: other
        rulesets: [default]
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: Runs weekly and publishes to https://scorecard.dev/viewer/?uri=github.com/cozystack/cozystack.
      - name: Trivy
        type: SCA
        rulesets: [default]
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: Organization-wide scan of Go modules, base images and packaged container images; CRITICAL every 6 hours, the rest weekly. Aggregate reports are published under docs/security/reports/.
