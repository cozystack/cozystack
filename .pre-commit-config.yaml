repos:
- repo: local
  hooks:
    - id: run-make-generate-root
      name: Run 'make generate' at repo root
      entry: |
        sh -c 'exec flock -x "$(git rev-parse --git-common-dir)/pre-commit.lock" "$@"' -- sh -c '
          echo "Running make generate at repo root"
          make generate || exit $?
          git diff --color=always | cat
        '
      language: system
      files: ^(api/|pkg/apis/|pkg/generated/|internal/crdinstall/manifests/|packages/system/cozystack-controller/definitions/|packages/system/application-definition-crd/definition/|packages/system/backup-controller/definitions/|packages/system/backupstrategy-controller/definitions/|hack/update-codegen\.sh$|hack/boilerplate\.go\.txt$|Makefile$)
      pass_filenames: false
    - id: run-make-generate
      name: Run 'make generate' in all app directories
      entry: |
        sh -c 'exec flock -x "$(git rev-parse --git-common-dir)/pre-commit.lock" "$@"' -- sh -c '
          for dir in ./packages/apps/*/ ./packages/extra/*/; do
            if [ -d "$dir" ]; then
              echo "Running make generate in $dir"
              make generate -C "$dir" || exit $?
            fi
          done
          git diff --color=always | cat
        '
      language: system
      files: ^.*$
    # The hack/*.bats unit suite, hermetic and parallel-safe (#3453). Measured
    # on this tree: 367s of work, 151s wall on 8 cores under bats -j, against
    # 312s serial under the runner it replaces. Not cheap for a commit hook,
    # and honestly so -- but the wall time is one file, not the runner:
    # hack/run-kubernetes-node-join_test.bats spends 138s of it in real sleeps,
    # so the floor moves when that file does rather than when the machine gets
    # bigger. `SKIP=bats-unit-tests git commit` is the escape hatch; the CI
    # `checks` job runs the suite either way.
    #
    # Requires bats-core on PATH; the make target says so explicitly when it is
    # missing.
    #
    # The path filter is the union of what the suite reads, not just the
    # scripts under test: several tests assert cross-tree consistency
    # (image-pin-consistency over packages/, downstream-trigger-map over
    # workflows, md-no-hardwrap over .claude/hooks/), so narrowing this to
    # hack/ would let exactly the regressions they exist to catch through.
    - id: bats-unit-tests
      name: Run hack/*.bats unit tests
      entry: make bats-unit-tests
      language: system
      files: ^(hack/|Makefile$|\.github/workflows/|packages/|\.claude/hooks/)
      pass_filenames: false
# Lints changed GitHub Actions workflows for unpinned actions and excessive token
# permissions (audit scope is set in .github/zizmor.yml). Runs offline so it needs
# no GitHub token locally. The same gate runs tree-wide in .github/workflows/zizmor.yml.
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.26.1
  hooks:
    - id: zizmor
      args: [--offline]
