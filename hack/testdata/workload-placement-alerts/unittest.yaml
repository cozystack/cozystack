      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="kv-2", phase="Running", node="node-a"}'
        values: '1x150'
    alert_rule_test:
      - eval_time: 61m
        groupname: workload-placement
        alertname: PodReplicasColocated
      - eval_time: 120m
        groupname: workload-placement
        alertname: PodReplicasColocated

