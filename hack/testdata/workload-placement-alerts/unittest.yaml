rule_files:
  - rules.yaml

evaluation_interval: 15s

tests:
  - name: two of three StatefulSet pods on one node
    interval: 1m
    input_series:
      - series: 'kube_node_info{job="kube-state-metrics", cluster="cozystack", node="node-a"}'
        values: '1x150'
      - series: 'kube_node_info{job="kube-state-metrics", cluster="cozystack", node="node-b"}'
        values: '1x150'
      - series: 'kube_node_info{job="kube-state-metrics", cluster="cozystack", node="node-c"}'
        values: '1x150'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-0", node="node-a", created_by_kind="StatefulSet", created_by_name="db"}'
        values: '1x150'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-1", node="node-a", created_by_kind="StatefulSet", created_by_name="db"}'
        values: '1x150'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-2", node="node-b", created_by_kind="StatefulSet", created_by_name="db"}'
        values: '1x150'
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-0", phase="Running", node="node-c"}'
        values: '1x150'
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-1", phase="Running", node="node-c"}'
        values: '1x150'
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-2", phase="Running", node="node-c"}'
        values: '1x150'
    alert_rule_test:
      - eval_time: 59m
        groupname: workload-placement
        alertname: PodReplicasColocated
      - eval_time: 61m
        groupname: workload-placement
        alertname: PodReplicasColocated
        exp_alerts:
          - exp_labels:
              cluster: cozystack
              namespace: tenant-a
              owner_kind: StatefulSet
              owner_name: db
              node: node-a
              severity: warning
              exported_instance: tenant-a/db
              service: workload-placement
            exp_annotations:
              summary: Pods of one workload share a node.
              description: >-
                2 running pods of StatefulSet tenant-a/db are on node node-a in cluster cozystack,
                although the cluster has a schedulable node for each of its pods. Losing this node
                stops these pods together, which can cost a quorum-based workload its quorum. The
                scheduler does not move running pods, so they stay together until they are recreated.

  - name: StatefulSet pods spread over three nodes
    interval: 1m
    input_series:
      - series: 'kube_node_info{job="kube-state-metrics", cluster="cozystack", node="node-a"}'
        values: '1x150'
      - series: 'kube_node_info{job="kube-state-metrics", cluster="cozystack", node="node-b"}'
        values: '1x150'
      - series: 'kube_node_info{job="kube-state-metrics", cluster="cozystack", node="node-c"}'
        values: '1x150'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-0", node="node-a", created_by_kind="StatefulSet", created_by_name="db"}'
        values: '1x150'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-1", node="node-b", created_by_kind="StatefulSet", created_by_name="db"}'
        values: '1x150'
      - series: 'kube_pod_info{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-2", node="node-c", created_by_kind="StatefulSet", created_by_name="db"}'
        values: '1x150'
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-0", phase="Running", node="node-c"}'
        values: '1x150'
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-1", phase="Running", node="node-c"}'
        values: '1x150'
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster="cozystack", namespace="tenant-a", pod="db-2", phase="Running", node="node-c"}'
        values: '1x150'
    alert_rule_test:
      - eval_time: 61m
        groupname: workload-placement
        alertname: PodReplicasColocated
      - eval_time: 120m
        groupname: workload-placement
        alertname: PodReplicasColocated

