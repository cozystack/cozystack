# Remote-site B — a second VyOS VM standing in for the external site. It is a
# PLAIN VM (NOT a site-router): the product forbids remoteCIDRs that overlap the
# cluster networks (deny-set), but B must route the cluster-side backend address
# into the tunnel toward A, so B cannot be a managed SiteRouter. A plain VM
# carries a free-form static config instead.
#
# B's role in the topology:
#   - IPsec INITIATOR: dials in to A's tunnel LB VIP on UDP 500 / NAT-T 4500 with
#     the shared PSK, forced UDP encapsulation.
#   - Source of the remote site: dummy dum0 in 192.0.2.0/24 (one of A's
#     remoteCIDRs) is the declared client source; dum1 in 198.51.100.0/24 is the
#     UNDECLARED source for negative case 1 (source outside remoteCIDRs — rejected
#     at A's IPsec SA traffic-selector, never decrypted).
#   - Probe host: the reachability/MSS/negative-security scripts SSH into B
#     (vyos / ${REMOTE_B_PASS:-e2edrive}) via the probe-driver pod and drive
#     ping/curl/nc sourced from the dummies.
#
# DELIVERY: B boots the same appliance image as A, and that image has no
# cloud-init at all. The Stream-derived appliance replaced it with
# packages/system/vyos-router-image/overlay/vyos-appliance-seed.sh, a systemd unit
# that copies `user-data` off the NoCloud disk VERBATIM to
# /opt/vyatta/etc/config/config.boot. So `userdata` below is a raw config.boot,
# exactly as the chart renders A's — a `#cloud-config` document here would be
# installed as the configuration itself and rejected on commit, and B would come
# up with no management API for establish-tunnel to talk to.
#
# The diagnostics ride a SECOND Secret volume named `cozydiag`, because the seed
# looks for them by volume label rather than in the configuration. A's chart does
# the same thing in templates/vm.yaml; keeping the two identical is the point,
# since B exists to be the far end of A.
#
# The config.boot is > the 2048-byte inline cloudInit limit, so it goes through a
# Secret (secretRef) on a raw KubeVirt VirtualMachine — the cozystack
# VMInstance/instanceProfile path did not reliably apply a config of this size on
# first boot in validation, and the raw VM (mirroring
# packages/apps/site-router/templates/vm.yaml) boots the image cleanly.
#
# The trailing `vyos-config-version` line MUST match the golden image's schema
# revision (copied verbatim from the chart-rendered A config.boot); an empty or
# stale version triggers a boot-time config-migration pass that can drop nodes.
#
# B's base config.boot (this manifest) sets: eth0 dhcp; both dummy sources
# (dum0/dum1); the HTTPS mgmt API (service https api rest + key, listen 0.0.0.0)
# so the establish-tunnel step can push IPsec over the API; ssh + a break-glass
# vyos password (${REMOTE_B_PASS:-e2edrive}) for the probe SSH. The IKEv2/ESP peer
# config is NOT baked — it needs A's runtime VIP + peer id, so establish-tunnel
# pushes it live over B's mgmt API (below).
---
apiVersion: v1
kind: Secret
metadata:
  name: remote-site-b-cloudinit
stringData:
  userdata: |
    interfaces {
        ethernet eth0 {
            address "dhcp"
        }
        dummy dum0 {
            address "192.0.2.1/24"
        }
        dummy dum1 {
            address "198.51.100.7/24"
        }
        loopback lo {
        }
    }
    service {
        https {
            api {
                keys {
                    id remote-b {
                        key "REMOTEB0000000000000000000000000000000B"
                    }
                }
                rest {
                }
            }
            listen-address "0.0.0.0"
        }
        ssh {
            port "22"
        }
    }
    system {
        config-management {
            commit-revisions "100"
        }
        console {
            device ttyS0 {
                speed "115200"
            }
        }
        host-name "remote-site-b"
        login {
            user vyos {
                authentication {
                    plaintext-password "e2edrive"
                }
            }
        }
    }

    // Warning: Do not remove the following line.
    // vyos-config-version: "bgp@6:cluster@2:config-management@1:conntrack@6:conntrack-sync@2:container@3:dhcp-relay@2:dhcp-server@11:dhcpv6-server@6:dns-dynamic@4:dns-forwarding@4:firewall@20:flow-accounting@3:https@7:ids@2:interfaces@34:ipoe-server@4:ipsec@14:isis@3:l2tp@9:lldp@3:monitoring@2:nat@8:nat66@3:nhrp@1:ntp@3:openconnect@3:openvpn@5:ospf@2:pim@1:policy@8:pppoe-server@12:pptp@5:qos@2:quagga@12:reverse-proxy@3:rip@1:rpki@2:salt@1:snmp@3:ssh@3:sstp@6:system@31:vpp@6:vrf@4:vrrp@4:wanloadbalance@4:webproxy@2"
    // Release version: 2026.03
          # Bring-up diagnostics, the same emitter A gets from the chart
          # (packages/apps/site-router/templates/_helpers.tpl gates it on
          # values._logSerialConsole). B is a raw manifest with no templating, so the
          # script body is injected by the bring-up step from the ONE copy in the
          # tree, packages/apps/site-router/files/guest-diag.sh — B and A must report
          # in the same format or the symmetry that made the last diagnosis credible
          # is gone, and two hand-maintained copies would drift.
          #
          # B matters more than A here, not less: the loop that actually times out
          # ("timeout committing B IPsec") is talking to B's management API.
---
apiVersion: v1
kind: Secret
metadata:
  name: remote-site-b-diag
stringData:
  guest-diag.sh: |
    __GUEST_DIAG_SCRIPT__
  guest-diag.cron: |
    SHELL=/bin/sh
    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    * * * * * root /config/scripts/cozy-guest-diag.sh
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: remote-site-b
spec:
  # 'running' is deprecated upstream but matches the suite's other VMs; the
  # engine/site-router VM template uses the same shape.
  running: true
  dataVolumeTemplates:
    - metadata:
        name: remote-site-b-boot
      spec:
        storage:
          resources:
            requests:
              storage: 12Gi
          # No storageClassName on purpose. The suite has to render on whatever
          # substrate it runs on, and the container lane has no DRBD and so no
          # `replicated` class; pinning one made this PVC unsatisfiable and CDI
          # reported it as ErrClaimNotValid with an empty DataVolume status.
          # Omitting the key selects the cluster default — an empty value would
          # instead mean "bind only a pre-provisioned PV" and never provision.
          # B is a fixture peer, so it has no live-migration property to keep.
        source:
          registry:
            # The same digest-pinned appliance containerDisk the site-router boot
            # disk imports. B is a plain KubeVirt VM, not a HelmRelease projection,
            # so it cannot read the chart's images/vyos-router-disk.tag itself: the
            # bring-up step substitutes __VYOS_DISK_REF__ from that same file before
            # applying, so B and A can never boot different appliances. Do not
            # hardcode a digest here — CI restamps the .tag on every image build.
            # What lands here is <repo>@sha256:<digest>, NOT the committed
            # <repo>:<tag>@sha256:<digest> stamp: the bring-up step drops the tag
            # because CDI's docker:// transport refuses a reference carrying both,
            # exactly as the chart does for A (site-router.applianceDiskUrl).
            url: docker://__VYOS_DISK_REF__
  template:
    metadata:
      labels:
        kubevirt.io/vm: remote-site-b
        # Not lineage-labelled: B is deliberately NOT a managed SiteRouter, so the
        # controller must not reconcile it.
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
            - name: boot
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
            # The appliance seed finds this by volume label (`blkid -L cozydiag`),
            # and KubeVirt labels a Secret-backed iso9660 with the VOLUME NAME, so
            # the name below is load-bearing. Same shape as A's, in vm.yaml.
            - name: cozydiag
              disk: {}
          interfaces:
            - name: default
              bridge: {}
          # Guest-side diagnostics, matching A (site-router-a.yaml). B's HTTPS
          # management API is what establish-tunnel pushes the initiator IPsec
          # config through, so a B that boots but never serves 443 fails the step
          # with nothing to attribute it to. KubeVirt puts the guest console in a
          # guest-console-log container beside virt-launcher, whose log
          # crust-gather already collects. Overrides the platform's cluster-wide
          # disableSerialConsoleLog, which is why it is opt-in rather than the
          # default.
          logSerialConsole: true
      networks:
        - name: default
          pod: {}
      volumes:
        - name: boot
          dataVolume:
            name: remote-site-b-boot
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: remote-site-b-cloudinit
        - name: cozydiag
          secret:
            secretName: remote-site-b-diag
