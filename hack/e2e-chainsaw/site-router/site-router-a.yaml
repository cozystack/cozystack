# SiteRouter A — the tenant gateway under test (the site-router product). This
# is the instance whose HelmRelease, VM, LB, kube-ovn mediation and guest guards
# the suite asserts end to end.
#
# A SiteRouter instance is NOT a CRD: it is a Flux HelmRelease projection labeled
# apps.cozystack.io/application.kind=SiteRouter with release name
# site-router-<instance> (see internal/controller/siterouter). The controller
# watches HelmReleases carrying that label, reads the authoritative tenant inputs
# from spec.values (D7), and mediates (deny-set validate -> namespace routes ->
# VyOS config push -> source-filter confirm -> port_security relax). It is the HR
# projection — not an aggregated-API SiteRouter kind — that the controller
# consumes, so the suite exercises the controller path directly by applying the
# HelmRelease. (On a platform build that registers the SiteRouter app kind in the
# aggregated API, an equivalent `kind: SiteRouter` CR would render to exactly this
# HelmRelease; the suite targets the projection so it does not depend on that
# translation layer being present.)
#
# chartRef points at the ExternalArtifact the platform already installs for this
# app in cozy-system, which is the same source every real SiteRouter release
# resolves (packages/system/site-router-rd/cozyrds/site-router.yaml names it
# verbatim). It serves the packages/apps/site-router chart; spec.values below
# stays the authoritative input, because an ExternalArtifact supplies the chart
# and not the values -- packages/extra/external-dns consumes its own the same
# way. Nothing in this suite has to provision a source: the e2e install runs
# variant isp-full, whose naas bundle carries site-router-application, so the
# artifact is present before the suite starts. It is named rather than
# discovered, so a rename in the cozyrd is a rename here too.
#
# peer.address is a placeholder: A is the IPsec responder ("the remote peer dials
# in", per the schema), and B's pod-network address is only known at runtime, so
# the establish-tunnel step patches spec.values.peer.address with B's discovered
# VMI IP before the tunnel is asserted up.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: site-router-a
  labels:
    apps.cozystack.io/application.group: apps.cozystack.io
    apps.cozystack.io/application.kind: SiteRouter
    apps.cozystack.io/application.name: a
spec:
  interval: 5m
  chartRef:
    kind: ExternalArtifact
    name: cozystack-site-router-application-default-site-router
    namespace: cozy-system
  values:
    tunnel:
      type: ipsec
    peer:
      # Patched to B's VMI IP at runtime (see the establish-tunnel step).
      address: "0.0.0.0"
      auth:
        # A fixed, deterministic e2e value shared with B's runtime config — NOT a
        # real credential. Pinned (rather than autogenerated) so B's initiator
        # config can match it without reading A's generated Secret.
        psk: "cozystack-e2e-site-router-psk"
    # B's simulated external site network. RFC 5737 TEST-NET-1 (192.0.2.0/24) is a
    # documentation range disjoint from the cluster pod/service/join networks, so
    # the controller deny-set admits it (an overlapping range is rejected at
    # admission — covered by the Go admission tests, not here).
    remoteCIDRs:
      - 192.0.2.0/24
    # Source CIDR allowed to reach the VyOS management API. Must equal the
    # controller --management-cidr (both default to the kube-ovn pod CIDR).
    managementCIDR: 10.244.0.0/16
    image:
      name: vyos-router
    resources:
      cpu: 2
      memory: 2Gi
    # Guest-side diagnostics. Every gate up to and including the tunnel steps
    # depends on the VyOS guest reaching userspace and answering on 443, and the
    # cluster can see none of that: a VMI that reports Running with an address
    # says only that qemu started. With this on, KubeVirt runs a
    # guest-console-log container beside virt-launcher whose log crust-gather
    # already collects, so a boot that stalls arrives in the artifact with VyOS's
    # own output attached instead of leaving the failure unattributable. Off by
    # default in the chart because it overrides the platform's cluster-wide
    # disableSerialConsoleLog (see the value's own doc); on here because a failed
    # e2e run that cannot say what the guest was doing costs a whole run.
    logSerialConsole: true
