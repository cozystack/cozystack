# Tenant B. Tenant A is the Test's own namespace (spec.namespace), which
# Chainsaw creates and deletes the same way.
#
# Plain namespaces rather than Tenant applications: the controller and the
# admission policies key on the namespace alone, and a Tenant would add its
# own release to install and tear down. The names keep the tenant- prefix
# because the vpc chart's RBAC helper (cozy-lib.rbac.allParentTenantsAndThis)
# refuses to render in any other namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-e2epxb
