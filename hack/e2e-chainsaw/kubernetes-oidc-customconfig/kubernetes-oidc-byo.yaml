# nodeGroups (and storageClass) intentionally omitted — this test asserts on the
# KamajiControlPlane and the tenant-supplied issuer AuthenticationConfiguration
# Secret and needs no worker node for either. It does need a serving tenant
# control plane, because its last step waits for the release to finish
# installing; see the kubernetes-oidc-system suite header.
#
# With the schema default `{}`, the chart helper emits the default `md0` group
# with `minReplicas: 0` —
# exactly one MachineDeployment renders (API-surface completeness) but the
# chart no longer manages `spec.replicas`, so CAPI's defaulting webhook seeds
# it to 0 from the autoscaler min-size annotation.
#
# 0 is the starting value, not the steady one: the chart's own
# cluster-autoscaler scales md0 to 1 in response to the in-tenant addon Pods
# having no node, so a worker Machine and its DataVolume-backed disk are
# provisioned here too. The CI evidence for that, and why it is left alone, is
# written out once in the kubernetes-oidc-system fixture beside this one, and
# tracked in #3739; both suites behave identically here.
# No talos.imageFactoryURL block is injected here, for the reason given in the
# kubernetes-oidc-system manifest.
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: oidc-byo
spec:
  addons:
    ingressNginx:
      enabled: false
      hosts: []
      valuesOverride: {}
  controlPlane:
    apiServer:
      resources: {}
      resourcesPreset: small
    replicas: 1
  version: v1.35
  oidc:
    mode: CustomConfig
    customConfig:
      config: |
        apiVersion: apiserver.config.k8s.io/v1beta1
        kind: AuthenticationConfiguration
        jwt:
        - issuer:
            url: https://idp.byo.example.test
            audiences:
            - cozystack-byo-oidc-byo
          claimMappings:
            username:
              claim: preferred_username
              prefix: ""
            groups:
              claim: groups
              prefix: ""
    users:
    - email: byo-admin@example.test
      role: admin
