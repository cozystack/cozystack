# Chainsaw port of hack/e2e-apps/foundationdb.bats ("Create DB FoundationDB").
#
# The dense block of `until kubectl get ... jsonpath | grep` status probes
# collapses into one assert on the FoundationDBCluster status tree. Pod-count
# (by process class + phase) and PVC-size checks stay as polling scripts —
# they count List results, which an assert cannot express.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: foundationdb
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: foundationdb-test
  - describe:
      apiVersion: apps.foundationdb.org/v1beta2
      kind: FoundationDBCluster
      name: foundationdb-test
  - podLogs:
      selector: foundationdb.org/fdb-cluster-name=foundationdb-test
      tail: 50
  steps:
  - name: create-foundationdb
    try:
    - apply:
        file: foundationdb.yaml

  - name: wait-helmrelease-ready
    try:
    # 11m: above the 600s install timeout cozystack-api gives this release;
    # see "Sizing an HR-Ready budget" in docs/agents/e2e-testing.md.
    - assert:
        timeout: 11m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: foundationdb-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: assert-cluster-status
    try:
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps.foundationdb.org/v1beta2
          kind: FoundationDBCluster
          metadata:
            name: foundationdb-test
          status:
            configured: true
            hasListenIPsForAllPods: true
            databaseConfiguration:
              logs: 3
              proxies: 3
              redundancy_mode: double
              resolvers: 1
              storage_engine: ssd-2
              usable_regions: 1
            health:
              available: true
              fullReplication: true
    # volumeClaimTemplate size is pinned on the CR spec.
    - assert:
        resource:
          apiVersion: apps.foundationdb.org/v1beta2
          kind: FoundationDBCluster
          metadata:
            name: foundationdb-test
          spec:
            processes:
              general:
                volumeClaimTemplate:
                  spec:
                    resources:
                      requests:
                        storage: 1Gi

  - name: verify-processes-and-security-context
    try:
    - script:
        # Three sequential inner deadlines -- 240s for the process counts, then
        # 120s for connectionString and 120s for generations.reconciled -- sum to
        # 480s. Pre-existing overrun, found by applying the same .chainsaw.yaml
        # rule to the step next door: at 5m the op fired first and took the whole
        # script out by SIGKILL, so a slow-but-recovering cluster reported
        # `signal: killed` instead of naming the stage that was still waiting.
        timeout: 9m
        content: |
          set -eu
          ns="$NAMESPACE"
          cl=foundationdb-test
          sel="foundationdb.org/fdb-cluster-name=$cl"
          count_running() {
            kubectl -n "$ns" get pods -l "$sel,foundationdb.org/fdb-process-class=$1" \
              --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l
          }
          deadline=$(( $(date +%s) + 240 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            s=$(count_running storage); l=$(count_running log); c=$(count_running cluster_controller)
            echo "storage=$s log=$l cluster_controller=$c"
            if [ "$s" -eq 3 ] && [ "$l" -ge 1 ] && [ "$c" -eq 1 ]; then break; fi
            sleep 10
          done
          test "$(count_running storage)" -eq 3
          test "$(count_running log)" -ge 1
          test "$(count_running cluster_controller)" -eq 1
          # securityContext: storage pod must run as the non-root 4059 uid/gid.
          pod=$(kubectl -n "$ns" get pods -l "$sel,foundationdb.org/fdb-process-class=storage" \
            --no-headers | head -n1 | awk '{print $1}')
          kubectl -n "$ns" get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.runAsUser}' | grep -qx 4059
          kubectl -n "$ns" get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.runAsGroup}' | grep -qx 4059
          # Status fields that are nil early on (so they live here, not in the
          # assert, where contains()/numeric-compare on nil hard-errors).
          fdb() { kubectl -n "$ns" get foundationdbclusters.apps.foundationdb.org "$cl" -o jsonpath="$1"; }
          deadline=$(( $(date +%s) + 120 ))
          until fdb '{.status.connectionString}' | grep -qE '@.*\.svc\.cozy\.local'; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "connectionString not set" >&2; fdb '{.status.connectionString}' >&2; exit 1; }
            sleep 5
          done
          fdb '{.status.desiredProcessGroups}' | grep -qE '^[0-9]+$'
          # generations.reconciled is stamped by the operator after the
          # post-bounce uptime gate and can trail the fdbcli-derived health
          # fields the previous assert converged on; retry briefly instead of
          # a one-shot read (mirrors main's widened budgets, a79f8009f).
          deadline=$(( $(date +%s) + 120 ))
          until fdb '{.status.generations.reconciled}' | grep -qE '^[0-9]+$'; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "generations.reconciled not stamped" >&2; fdb '{.status.generations}' >&2; exit 1; }
            sleep 5
          done
        check:
          ($error == null): true

  - name: refresh-and-assert-full-health
    try:
    - script:
        # 270s poll deadline + one 25s in-loop read that may start just under it
        # + one 25s diagnostic read on the failure branch = 320s of inner bounds.
        # Keep the op above that sum, per .chainsaw.yaml: at 5m Chainsaw SIGKILLs
        # the script instead, and the diagnostic that the failure branch exists
        # to print is exactly what gets lost.
        timeout: 6m
        content: |
          set -eu
          ns="$NAMESPACE"
          cl=foundationdb-test
          pod=$(kubectl -n "$ns" get pods \
            -l "foundationdb.org/fdb-cluster-name=$cl,foundationdb.org/fdb-process-class=storage" \
            -o jsonpath='{.items[0].metadata.name}')
          status_json() {
            timeout -k 5 20 kubectl -n "$ns" exec "$pod" -c foundationdb -- \
              fdbcli -C /var/fdb/data/fdb.cluster --exec 'status json' 2>/dev/null
          }
          database_healthy() {
            status_json | jq -e '.client.database_status.healthy == true' >/dev/null
          }
          # The v2.30 operator can finish its initial reconciliation from a
          # transient status_incomplete response, then never requeue solely to
          # refresh health. Wait on the authoritative machine-readable status
          # before asking the operator for exactly one fresh read.
          deadline=$(( $(date +%s) + 270 ))
          until database_healthy; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "FoundationDB machine status did not become fully healthy" >&2
              status_json | jq '{databaseStatus: .client.database_status, messages: .cluster.messages}' >&2 || true
              exit 1
            fi
            # TODO(e2e-replace-fixed-timeouts): fdbcli health has no watchable
            # Kubernetes object; replace this poll when the operator exposes one.
            sleep 5
          done
          kubectl -n "$ns" annotate foundationdbclusters.apps.foundationdb.org "$cl" \
            "e2e.cozystack.io/health-refresh=$(date +%s)" --overwrite >/dev/null
        check:
          ($error == null): true
    - assert:
        timeout: 3m
        resource:
          apiVersion: apps.foundationdb.org/v1beta2
          kind: FoundationDBCluster
          metadata:
            name: foundationdb-test
          status:
            health:
              healthy: true

  - name: verify-monitoring-and-storage
    try:
    # Dashboard resource map ConfigMap is created by the controller.
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: foundationdb-test-resourcemap
    - script:
        timeout: 2m
        content: |
          set -eu
          ns="$NAMESPACE"
          cl=foundationdb-test
          # WorkloadMonitor is created and configured with replicas=3.
          kubectl -n "$ns" get workloadmonitor "$cl"
          kubectl -n "$ns" get workloadmonitor "$cl" -o jsonpath='{.spec.replicas}' | grep -qx 3
          # PVCs: at least 3, all requesting and reporting 1Gi.
          count=$(kubectl -n "$ns" get pvc -l "foundationdb.org/fdb-cluster-name=$cl" --no-headers | wc -l)
          test "$count" -ge 3
          kubectl -n "$ns" get pvc -l "foundationdb.org/fdb-cluster-name=$cl" \
            -o jsonpath='{.items[*].spec.resources.requests.storage}' | grep -q '1Gi'
          kubectl -n "$ns" get pvc -l "foundationdb.org/fdb-cluster-name=$cl" \
            -o jsonpath='{.items[*].status.capacity.storage}' | grep -q '1Gi'
        check:
          ($error == null): true

  - name: verify-cleanup
    try:
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: FoundationDB
          name: test
    - error:
        timeout: 2m
        resource:
          apiVersion: apps.foundationdb.org/v1beta2
          kind: FoundationDBCluster
          metadata:
            name: foundationdb-test
---
# Backup contracts of the platform path, run in CI. A BackupJob on the
# cozy-default BackupClass drives the backupstrategy-controller to create the
# operator-side FoundationDBBackup and the operator to start its backup_agent;
# this checks what each side hands the next on a live cluster: the CR names the
# job's own directory and an "@host" account, runs the agent at an SNI-capable
# version, carries the credentials and CA in spec.podTemplateSpec (the field
# the operator reads), the agent pod gets them, and the operator pod has the
# platform credentials projected into its namespace. Whether the bytes reach
# S3 is left to foundationdb-3-backup-roundtrip: the kind sandbox has no
# endpoint the backup can reach (see there), so the backup itself never turns
# restorable here and is torn down by hand at the end.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: foundationdb-2-backup-contracts
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: foundationdb-backup-contract
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: BackupJob
      name: fdb-contract
  - describe:
      apiVersion: apps.foundationdb.org/v1beta2
      kind: FoundationDBBackup
  - podLogs:
      namespace: cozy-backup-controller
      selector: app=backupstrategy-controller
      tail: 100
  steps:
  - name: create-foundationdb
    try:
    - apply:
        file: backup-contract.yaml
    # 11m: above the 600s install timeout cozystack-api gives this release;
    # see "Sizing an HR-Ready budget" in docs/agents/e2e-testing.md.
    - assert:
        timeout: 11m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: foundationdb-backup-contract
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    # The driver creates no FoundationDBBackup until the cluster is available.
    - assert:
        timeout: 10m
        resource:
          apiVersion: apps.foundationdb.org/v1beta2
          kind: FoundationDBCluster
          metadata:
            name: foundationdb-backup-contract
          status:
            health:
              available: true

  - name: backup-wiring
    try:
    - apply:
        file: backup-contract-job.yaml
    - script:
        # Three sequential inner deadlines of 180s each (the operator CR, the
        # agent Deployment, its pod) sum to 540s; the op sits above them.
        timeout: 10m
        content: |
          set -eu
          ns="$NAMESPACE"
          label="backups.cozystack.io/owned-by.BackupJobName=fdb-contract"
          fdbb() { kubectl -n "$ns" get foundationdbbackups.apps.foundationdb.org -l "$label" -o json; }
          deadline=$(( $(date +%s) + 180 ))
          until [ "$(fdbb | jq '.items | length')" -ge 1 ]; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "no FoundationDBBackup for BackupJob fdb-contract" >&2; kubectl -n "$ns" get backupjob fdb-contract -o yaml >&2; exit 1; }
            sleep 5
          done
          cr=$(fdbb | jq -c '.items[0]')
          name=$(echo "$cr" | jq -r .metadata.name)
          echo "$cr" | jq -e --arg dir "$ns/fdb-contract" '.spec.blobStoreConfiguration.backupName == $dir' >/dev/null \
            || { echo "backupName is not the job's own <namespace>/<job> directory" >&2; echo "$cr" | jq .spec.blobStoreConfiguration >&2; exit 1; }
          echo "$cr" | jq -e '.spec.blobStoreConfiguration.accountName | startswith("@")' >/dev/null \
            || { echo "accountName lacks the @ the operator requires" >&2; exit 1; }
          echo "$cr" | jq -e '.spec.version == "7.3.79"' >/dev/null \
            || { echo "agent version not raised to the SNI-capable patch" >&2; echo "$cr" | jq .spec.version >&2; exit 1; }
          echo "$cr" | jq -e '[.spec.customParameters[]? | startswith("--")] | any | not' >/dev/null \
            || { echo "a customParameters entry carries a -- prefix the operator would double" >&2; exit 1; }
          echo "$cr" | jq -e '[.spec.podTemplateSpec.spec.containers[] | select(.name == "foundationdb") | .env[]?.name] | index("FDB_BLOB_CREDENTIALS") != null' >/dev/null \
            || { echo "spec.podTemplateSpec does not carry the credentials env" >&2; echo "$cr" | jq .spec.podTemplateSpec >&2; exit 1; }

          deploy="$name-backup-agents"
          deadline=$(( $(date +%s) + 180 ))
          until kubectl -n "$ns" get deploy "$deploy" >/dev/null 2>&1; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "operator created no agent Deployment $deploy" >&2; exit 1; }
            sleep 5
          done
          pod_spec=$(kubectl -n "$ns" get deploy "$deploy" -o json | jq -c .spec.template.spec)
          echo "$pod_spec" | jq -e '[.containers[] | select(.name == "foundationdb") | .env[]?.name] | (index("FDB_BLOB_CREDENTIALS") != null)' >/dev/null \
            || { echo "agent container lacks FDB_BLOB_CREDENTIALS" >&2; exit 1; }
          echo "$pod_spec" | jq -e '[.volumes[]?.secret.secretName] | index("cozy-backups-creds") != null' >/dev/null \
            || { echo "agent pod does not mount cozy-backups-creds" >&2; exit 1; }
          echo "$pod_spec" | jq -e '.containers[] | select(.name == "foundationdb") | .image | endswith(":7.3.79")' >/dev/null \
            || { echo "agent image is not the 7.3.79 patch" >&2; exit 1; }
          deadline=$(( $(date +%s) + 180 ))
          until kubectl -n "$ns" get secret cozy-backups-creds >/dev/null 2>&1; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "cozy-backups-creds not projected into $ns" >&2; exit 1; }
            sleep 5
          done

          op=cozy-foundationdb-operator
          kubectl -n "$op" get secret cozy-backups-creds -o jsonpath='{.data.blob_credentials\.json}' | base64 -d \
            | jq -e '.accounts | keys | length > 0 and all(startswith("@"))' >/dev/null \
            || { echo "operator namespace lacks the @host-keyed credentials file" >&2; exit 1; }
          kubectl -n "$op" get deploy -l app.kubernetes.io/name=fdb-operator -o json \
            | jq -e '[.items[0].spec.template.spec.containers[] | select(.name == "manager") | .env[]?.name] | (index("FDB_BLOB_CREDENTIALS") != null and index("FDB_TLS_CA_FILE") != null)' >/dev/null \
            || { echo "operator manager lacks FDB_BLOB_CREDENTIALS / FDB_TLS_CA_FILE" >&2; exit 1; }
        check:
          ($error == null): true
    finally:
    # The BackupJob never succeeds here, so it goes first: a running job
    # would recreate the operator CR deleted after it. The CR is the
    # controller's, not Chainsaw's, and is pruned explicitly.
    - description: backup-wiring teardown
      script:
        timeout: 6m
        content: |
          set -eu
          ns="$NAMESPACE"
          kubectl -n "$ns" delete backupjob fdb-contract --ignore-not-found --wait=true --timeout=2m
          kubectl -n "$ns" delete foundationdbbackups.apps.foundationdb.org \
            -l backups.cozystack.io/owned-by.BackupJobName=fdb-contract --ignore-not-found --wait=true --timeout=3m
---
# Full backup -> restore -> delete round-trip through cozy-default, driven by
# backup-roundtrip.sh in this directory: two consecutive BackupJobs each land
# in their own directory, the second restores into an empty copy with the
# sentinel intact, and deleting the first Backup removes only its directory.
#
# GATED OUT OF CI (opt in with FDB_E2E_S3_ROUNDTRIP=1), for the same reason
# as etcd-2-backup-roundtrip. cozy-default points at the bucket's EXTERNAL
# ingress endpoint, which in kind is the unroutable s3.example.org
# placeholder. The in-cluster seaweedfs-s3.<ns>.svc:8333 endpoint serves TLS
# behind a self-signed CA, and two of the S3 clients here cannot be pointed
# at it: fdbbackup and fdbrestore run inside the cluster-wide FoundationDB
# operator pod, whose credentials file and CA bundle come from the operator
# package values, so a test cannot swap them for the in-cluster endpoint's
# without reconfiguring the platform. The round-trip therefore runs only
# against a publicly-trusted endpoint (a real cluster). Chainsaw v0.2.15 has
# no conditional Test-level skip, so the gate is an in-script exit 0 with the
# reason in the log.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: foundationdb-3-backup-roundtrip
spec:
  # tenant-root: on a real cluster the isolated e2e tenant cannot reach the
  # S3 ingress, as for the other backup round-trips.
  namespace: tenant-root
  skipDelete: true
  catch:
  - events: {}
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: BackupJob
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: RestoreJob
  - describe:
      apiVersion: apps.foundationdb.org/v1beta2
      kind: FoundationDBBackup
  - describe:
      apiVersion: apps.foundationdb.org/v1beta2
      kind: FoundationDBRestore
  - podLogs:
      namespace: cozy-foundationdb-operator
      selector: app.kubernetes.io/name=fdb-operator
      tail: 200
  - podLogs:
      namespace: cozy-backup-controller
      selector: app=backupstrategy-controller
      tail: 200
  steps:
  - name: run
    try:
    - script:
        # Inner budgets in backup-roundtrip.sh: two 660s HR waits, two 600s
        # availability waits, three 900s job waits, a 600s Backup deletion and
        # two 120s describes sum to 6060s; the op sits above them.
        timeout: 105m
        content: |
          set -eu
          if [ "${FDB_E2E_S3_ROUNDTRIP:-0}" != "1" ]; then
            echo "# FoundationDB S3 backup/restore round-trip gated out of CI: no"
            echo "# publicly-trusted S3 endpoint in kind (see comment in this file)."
            echo "# Set FDB_E2E_S3_ROUNDTRIP=1 on a real cluster to run it."
            exit 0
          fi
          NAMESPACE="$NAMESPACE" ./backup-roundtrip.sh run
        check:
          ($error == null): true
    finally:
    # Idempotent, and a quick no-op when the round-trip was gated out. Backup
    # deletion runs the driver's delete Jobs, so the bucket is left as found.
    - description: round-trip teardown
      script:
        # Four 600s deletion waits.
        timeout: 41m
        content: |
          set -eu
          NAMESPACE="$NAMESPACE" ./backup-roundtrip.sh cleanup
