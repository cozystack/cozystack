# Chainsaw port of hack/e2e-apps/kubernetes-latest.bats.
#
# Spinning up a tenant Kubernetes control plane (Kamaji) + worker nodes + the
# LB/NFS/ouroboros checks is deeply imperative (port-forwards, a tenant
# kubeconfig, curl probes), so the battle-tuned logic in
# _lib/run-kubernetes.sh is reused verbatim from a single script step rather
# than rewritten as asserts. The script cd's to the repo root (the test dir is
# hack/e2e-chainsaw/kubernetes-latest, so repo root is ../../..) where the
# helper's `helm template` and versions.yaml paths resolve.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kubernetes-latest
spec:
  catch:
  - events: {}
  - podLogs:
      namespace: tenant-test
      selector: app.kubernetes.io/name=etcd-client-probe
  - podLogs:
      namespace: tenant-root
      selector: app.kubernetes.io/name=etcd-client-probe
  steps:
  - name: tenant-kubernetes-latest-version
    try:
    - script:
        # ~25m Kamaji bringup + worker join + LB/NFS/ouroboros assertions on a
        # passing run. The ceiling below is sized for the failing one instead,
        # where the node-join wait spends its whole deadline and the diagnostics
        # phase and the tenant snapshot still have to fit behind it.
        # hack/run-kubernetes-node-join_test.bats holds that inequality: it reads
        # the deadline off the wait and the operation off the constant that
        # restates this `timeout:`.
        #
        # The on-failure diagnostics phase carries its own 8m wall-clock budget
        # (COZY_DIAG_PHASE_BUDGET in _lib/run-kubernetes.sh): once it is spent, the
        # collectors that have not started are declined out loud rather than
        # attempted, so the in-process tenant crust-gather snapshot, the one the exit
        # off the node-join path triggers and the largest artifact this path produces,
        # still has its time. Why that budget and not another is derived beside it and
        # not repeated here, because a number kept in two places is a number that
        # drifts.
        #
        # What this ceiling covers, in the order the phase spends it, cheapest first
        # so that a budget running out drops the collectors that cost minutes rather
        # than the reads that discriminate between failure modes:
        #   node-join diagnostics reads
        #   worker network counters
        #   worker block IO counters
        #   serial-console family (~6m25s at worst, ~4m05s at the pool's minimum)
        #   HelmRelease remediation footprint (a 90s budget of its own on starting reads, not a ceiling; below the console because the console alone covers a worker that never reached apid, while these releases stay readable after the run)
        #   worker CPU usage and throttling counters, two samples
        #   sandbox node CPU time, two samples
        #   worker per-thread CPU time inside virt-launcher, two samples
        #     (those alternate rather than run to completion in turn: each takes
        #     its first reading, one wait passes, each takes its second)
        #   guest Talos capture
        #   talos-image-cache diagnosis
        # The four collectors that bracket the node-join wait -- the sandbox
        # kernel KVM counters, the runner kernel CPU time, the sandbox QEMU
        # thread time and the runner fixed-work canary -- sit outside this order
        # on purpose: each is ungated and taken before the wait and right after
        # it on both paths, and their cost arms live in the budget guard rather
        # than in this list. Three of the four are reads: the KVM counters and
        # the runner kernel CPU time are one bounded read a side, and the QEMU
        # thread time is a bounded probe walk plus a bounded read of each
        # sandbox pid file. The canary is two arms of fixed work under a ceiling
        # of its own apiece, and it is the one of the four that costs a core
        # rather than a read, which is why it runs outside the brackets of the
        # other three rather than among them.
        # and then, after the phase rather than inside it, the in-process tenant
        # crust-gather snapshot.
        #
        # Those do not fit what is left of this op once the bringup ahead of them and
        # the snapshot behind them are counted, which is why the phase is bounded as a
        # phase rather than this ceiling raised. None of it is a worst case and none is
        # claimed: several of those collectors carry no wall-clock bound at all, and
        # the bringup's own waits already exceed this op on ceilings before a single
        # diagnostic runs, and the pre-wait halves of the four readings above spend
        # inside that bringup rather than inside this phase. Those residuals are
        # tracked in cozystack/cozystack#3666.
        #
        # The OIDC lifecycle folded onto this cluster by the 5th argument joins
        # that list rather than being priced into the ceiling: it adds up to 1m
        # of job wait, a 600s cozy_wait_helmrelease_upgrade and another 1m of job
        # wait, all on the passing path. Raising the ceiling to cover them is not
        # available -- the guard in hack/run-kubernetes-serial-console_test.bats
        # holds COZY_OP_CEILING equal to BOTH suites' `timeout:`, and two suites
        # at 79m plus their 25m teardowns take 208m, which with the install and
        # the rest of a full run does not fit the job's own 265-minute cap.
        # What is available is a measurement: on the green run of this branch
        # (33724179053) the whole Test took 569.72s against this 4020s op, with
        # kubernetes-previous, which carries no OIDC fold, at 470.19s. The
        # ceilings only bind when something is already hung.
        timeout: 67m
        # Co-locate the tenant crust-gather snapshot (captured by
        # run-kubernetes.sh on failure) under the same snapshots/<test>/ dir as
        # the global .chainsaw.yaml catch's host snapshot.
        env:
        - name: COZY_SNAPSHOT_NAME
          value: ($test.metadata.name)
        content: |
          set -eu
          cd ../../..
          . hack/e2e-chainsaw/_lib/run-kubernetes.sh
          # 4th arg folds the ouroboros hairpin-NAT assertions onto this cluster;
          # the 5th folds the System -> CustomConfig OIDC lifecycle onto the same
          # ready workers. Neither feature needs another tenant-cluster bringup.
          run_kubernetes_test 'keys | sort_by(.) | .[-1]' 'test-latest-version' '59991' 'true' 'true'
        check:
          ($error == null): true
    # A worker VM has no ownerReference; the lineage webhook attributes it, and
    # through it its virt-launcher Pod, to the release the chart names in the
    # VM's helm.toolkit.fluxcd.io/name label. Without these labels the Pod
    # falls out of the tenant's SecurityGroups. The workers have joined by
    # now, so the objects exist and these only read admission-time labels.
    - assert:
        timeout: 1m
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            namespace: tenant-test
            labels:
              cluster.x-k8s.io/cluster-name: kubernetes-test-latest-version
              helm.toolkit.fluxcd.io/name: kubernetes-test-latest-version
    - assert:
        timeout: 1m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: tenant-test
            labels:
              kubevirt.io: virt-launcher
              cluster.x-k8s.io/cluster-name: kubernetes-test-latest-version
              internal.cozystack.io/managed-by-cozystack: "true"
              apps.cozystack.io/application.group: apps.cozystack.io
              apps.cozystack.io/application.kind: Kubernetes
              apps.cozystack.io/application.name: test-latest-version
    - script:
        timeout: 1m
        content: |
          set -eu
          kubectl --namespace tenant-test delete job guest-etcd-defrag-e2e --ignore-not-found --timeout=30s
          kubectl --namespace tenant-test create job guest-etcd-defrag-e2e --from=cronjob/kubernetes-test-latest-version-etcd-defrag
        check:
          ($error == null): true
    - assert:
        timeout: 3m
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            namespace: tenant-test
            name: guest-etcd-defrag-e2e
          status:
            (conditions[?type == 'Complete']):
            - status: "True"
    # Who reaches the guest etcd's client port: a labelled Pod in tenant-test
    # does, an unlabelled one and a Pod in tenant-root do not. Each Pod checks
    # its own verdict and ends Succeeded only when it matches, see
    # etcd-client-probes.yaml. 3m covers a cold pull of the probe image plus
    # the control's 60s poll.
    - apply:
        file: etcd-client-probes.yaml
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: tenant-test
            name: etcd-probe-allowed
          status:
            phase: Succeeded
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: tenant-test
            name: etcd-probe-unlabelled
          status:
            phase: Succeeded
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: tenant-root
            name: etcd-probe-other-tenant
          status:
            phase: Succeeded
    finally:
    - description: reclaim the guest etcd maintenance job
      script:
        timeout: 1m
        content: |
          kubectl --namespace tenant-test delete job guest-etcd-defrag-e2e --ignore-not-found --timeout=30s
    # Always runs after try/catch — i.e. after the crust-gather snapshots on a
    # failed run. Reclaims the tenant Kubernetes cluster, which run_kubernetes_test
    # applies imperatively (kubectl), so Chainsaw's auto-cleanup does not track it.
    # This is the single authoritative child -> parent teardown on both success
    # and failure, followed by the compute/storage reclamation barriers.
    - description: tear down the tenant Kubernetes cluster
      script:
        # 30s diagnostic Certificate + 5m child + 5m parent + 3m etcd
        # reclamation + 5m compute/PVC drain + 5m LINSTOR reclamation = 23m30s
        # of inner bounds. Keep the op above that sum so an inner timeout
        # reports its stage instead of a Chainsaw SIGKILL hiding it; normal
        # cleanup returns immediately.
        timeout: 25m
        content: |
          set -eu
          cd ../../..
          . hack/e2e-chainsaw/_lib/run-kubernetes.sh
          cozy_cleanup test-latest-version
---
# Version-independent regression guard for PR #2872 B1 (runs once, here, not
# in kubernetes-previous): with the `replicated` StorageClass absent on the
# management cluster, the chart's fallback default must be a real management
# SC (nvme/ssd probes) and never the `kubevirt` alias. A separate Test doc,
# not a step of the bringup Test above, because it provisions no tenant
# cluster and must run regardless of that heavy test's outcome (Chainsaw
# skips a Test's remaining steps after a failure).
#
# The helper temporarily deletes the cluster-scoped `replicated` SC and
# restores it inline before any assertion exit; safe only because the global
# .chainsaw.yaml runs suites sequentially (execution.parallel: 1) — nothing
# else can schedule against the mutated SC set mid-probe.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kubernetes-sc-fallback-default
spec:
  catch:
  - events: {}
  steps:
  - name: fallback-default-storageclass
    try:
    - script:
        timeout: 15m
        content: |
          set -eu
          cd ../../..
          . hack/e2e-chainsaw/_lib/run-kubernetes.sh
          verify_storageclass_fallback_default
        check:
          ($error == null): true
