# Chainsaw port of hack/e2e-apps/kafka.bats ("Create Kafka"), KRaft edition.
#
# The chart deploys Kafka in KRaft mode (no ZooKeeper): a combined-free layout
# of separate broker + controller KafkaNodePools. This test asserts the KRaft
# topology renders and converges (both node pools present, the Strimzi Kafka CR
# reaches kafkaMetadataState=KRaft) and that no ZooKeeper resources remain.
# Chainsaw's built-in cleanup deletes the applied Kafka CR and fails the test if
# the teardown hangs, so no explicit delete step is needed.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kafka
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kafka-test
  - podLogs:
      selector: app.kubernetes.io/instance=kafka-test
      tail: 50
  steps:
  - name: create-kafka
    try:
    - apply:
        file: kafka.yaml

  - name: wait-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: kafka-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Kafka
          metadata:
            name: test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-kraft
    try:
    - assert:
        timeout: 2m
        resource:
          apiVersion: kafka.strimzi.io/v1beta2
          kind: KafkaNodePool
          metadata:
            name: kafka-test-broker
          spec:
            roles:
            - broker
    - assert:
        timeout: 2m
        resource:
          apiVersion: kafka.strimzi.io/v1beta2
          kind: KafkaNodePool
          metadata:
            name: kafka-test-controller
          spec:
            roles:
            - controller
    - assert:
        timeout: 5m
        resource:
          apiVersion: kafka.strimzi.io/v1beta2
          kind: Kafka
          metadata:
            name: kafka-test
            annotations:
              strimzi.io/kraft: enabled
              strimzi.io/node-pools: enabled
          status:
            kafkaMetadataState: KRaft
    # KRaft mode ships no ZooKeeper: the client Service must never exist.
    - error:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: kafka-test-zookeeper-client
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: kafka-test-kafka-bootstrap
          (subsets[0].addresses[0].ip != null): true
