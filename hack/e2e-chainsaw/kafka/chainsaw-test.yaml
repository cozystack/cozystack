# Chainsaw port of hack/e2e-apps/kafka.bats ("Create Kafka"), KRaft edition.
#
# The chart deploys Kafka in KRaft mode (no ZooKeeper): a combined-free layout
# of separate broker + controller KafkaNodePools. This test asserts the KRaft
# topology renders and converges (both node pools present, the Strimzi Kafka CR
# is Ready) and that no ZooKeeper resources remain, and that a tenant sees a
# user's password and the two CA certificates but no Strimzi private key.
# The last step deletes the app itself and checks that no node pool or Strimzi
# pod of this cluster survives the uninstall.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kafka
spec:
  # A KRaft teardown (broker + controller pools, entity operator, their PVCs)
  # has more to drain than the shared 5m cleanup default allows once a CI run
  # is contended, so give this suite a wider cleanup budget — teardown latency,
  # not the assertions, was deciding the verdict.
  timeouts:
    cleanup: 8m
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kafka-test
  - podLogs:
      selector: app.kubernetes.io/instance=kafka-test
      tail: 50
  steps:
  - name: create-kafka
    try:
    - apply:
        file: kafka.yaml
    # Both node pools set deleteClaim: false, so the volumes outlive the app
    # and would hold their LINSTOR space for every later suite. Chainsaw runs
    # a step's cleanup ops after this step's cleaner has deleted the app, on a
    # failed run as well. A volume a terminating broker still mounts finishes
    # deleting once that pod is gone, and the delete waits for that.
    cleanup:
    - delete:
        ref:
          apiVersion: v1
          kind: PersistentVolumeClaim
          labels:
            strimzi.io/cluster: kafka-test

  - name: wait-ready
    try:
    # Deliberately under the floor, kafka-rd's default 10m install timeout: a
    # healthy cluster is Ready in a few minutes, so a failed install ends the
    # run early as a bare assert timeout, and the catch block's describe of the
    # HelmRelease is where its state is read.
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: kafka-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Kafka
          metadata:
            name: test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaTopic
          metadata:
            name: kafka-test-test-results
          spec:
            topicName: testResults
            (config == null): true
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-kraft
    try:
    # Fresh pools use short release-hashed names (b-<hash>/c-<hash>), so match by
    # the cluster label + role rather than a hard-coded name.
    - assert:
        timeout: 2m
        resource:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaNodePool
          metadata:
            labels:
              strimzi.io/cluster: kafka-test
          spec:
            roles:
            - broker
    - assert:
        timeout: 2m
        resource:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaNodePool
          metadata:
            labels:
              strimzi.io/cluster: kafka-test
          spec:
            roles:
            - controller
    - assert:
        timeout: 5m
        resource:
          apiVersion: kafka.strimzi.io/v1
          kind: Kafka
          metadata:
            name: kafka-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    # KRaft mode ships no ZooKeeper: the client Service must never exist.
    - error:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: kafka-test-zookeeper-client
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: kafka-test-kafka-bootstrap
          (subsets[0].addresses[0].ip != null): true

  # A tenant reads the Secrets the lineage webhook stamped tenantresource=true
  # from the kafka ApplicationDefinition's selectors. Strimzi writes every
  # Secret of this cluster, so what it labels them with only exists here.
  - name: verify-tenant-secrets
    try:
    # Positive controls first: the private-key check below is also satisfied
    # by a webhook that stamped nothing at all.
    - assert:
        timeout: 2m
        resource:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaUser
          metadata:
            name: kafka-test.e2e
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kafka-test.e2e
            labels:
              internal.cozystack.io/tenantresource: "true"
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kafka-test-clients-ca-cert
            labels:
              internal.cozystack.io/tenantresource: "true"
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kafka-test-cluster-ca-cert
            labels:
              internal.cozystack.io/tenantresource: "true"
    # Strimzi writes every private key under a data key ending in .key: the
    # CA keys and one key-bearing Secret per node, named after the node pools.
    # No Secret of this cluster holding one may be tenant-visible, whatever
    # Strimzi names it. Which certificate Secrets are labelled is left open.
    - script:
        timeout: 1m
        content: |
          set -eu
          data_keys() {
            kubectl -n "$NAMESPACE" --request-timeout=15s get secret -l "$1" \
              -o go-template='{{range .items}}{{$n := .metadata.name}}{{range $k, $v := .data}}{{$n}} {{$k}}{{"\n"}}{{end}}{{end}}'
          }
          all=$(data_keys strimzi.io/cluster=kafka-test)
          # Positive control for the predicate: without it, a Strimzi that
          # stopped naming keys *.key would pass the check below vacuously.
          if ! printf '%s\n' "$all" | grep -q '\.key$'; then
            echo "no Secret of kafka-test holds a *.key entry; the private-key predicate no longer matches what Strimzi writes" >&2
            exit 1
          fi
          visible=$(data_keys strimzi.io/cluster=kafka-test,internal.cozystack.io/tenantresource=true)
          leaked=$(printf '%s\n' "$visible" | grep '\.key$' || true)
          if [ -n "$leaked" ]; then
            echo "tenant-visible Secrets of kafka-test hold private keys:" >&2
            printf '%s\n' "$leaked" >&2
            exit 1
          fi
        check:
          ($error == null): true

  # The node pools are created by the migration hook, outside the release
  # manifest, and each owns the StrimziPodSet running its brokers, so only the
  # chart's pre-delete hook removes them. Deleting the app explicitly here,
  # rather than leaving it to Chainsaw's cleanup, is what lets the test look at
  # the namespace afterwards. The pod check selects on strimzi.io/cluster on
  # purpose, so it covers every pod Strimzi runs for this cluster (brokers,
  # controllers, entity operator), not only the brokers.
  - name: verify-uninstall-removes-node-pools
    try:
    # Waits for the app, and so the HelmRelease uninstall behind it, to finish.
    # 8m, the same budget and for the same reason as timeouts.cleanup above:
    # this delete is the teardown that cleanup used to perform.
    - delete:
        timeout: 8m
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Kafka
          name: test
    # The pre-delete hook deleted the pools before the delete above returned;
    # the pods then go through garbage collection and their termination grace
    # period, which the default error timeout covers.
    - error:
        resource:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaNodePool
          metadata:
            labels:
              strimzi.io/cluster: kafka-test
    - error:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            labels:
              strimzi.io/cluster: kafka-test
    catch:
    # A failed error op already names each object still matching. This adds
    # the StrimziPodSets between the pools and the pods, and the pods' phase.
    - script:
        timeout: 1m
        content: |
          kubectl -n "$NAMESPACE" --request-timeout=15s \
            get kafkanodepools.kafka.strimzi.io,strimzipodsets.core.strimzi.io,pods \
            -l strimzi.io/cluster=kafka-test -o wide || true
