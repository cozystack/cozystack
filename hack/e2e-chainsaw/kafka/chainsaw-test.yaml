# Chainsaw port of hack/e2e-apps/kafka.bats ("Create Kafka").
#
# The cluster runs KRaft: the controller and broker pools are KafkaNodePools,
# so the pods and their PVCs are named <cluster>-<pool>-<node id>. Broker ids
# start at 0 and controller ids at 1000 (pinned in the chart).
#
# The final step replaces the BATS check that Strimzi reclaims the PVCs on
# delete: instead of a manual kubectl delete, an explicit delete of the Kafka
# CR followed by `error` ops asserts the PVCs disappear (a regression in the
# operator's deleteClaim handling would leave them behind).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kafka
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kafka-test
  - podLogs:
      selector: app.kubernetes.io/instance=kafka-test
      tail: 50
  steps:
  - name: create-kafka
    try:
    - apply:
        file: kafka.yaml

  - name: wait-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: kafka-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Kafka
          metadata:
            name: test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-kraft-pools
    try:
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: data-0-kafka-test-kafka-test-controller-1000
          status:
            phase: Bound
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: data-0-kafka-test-kafka-test-broker-0
          status:
            phase: Bound
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: data-0-kafka-test-kafka-test-broker-1
          status:
            phase: Bound
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: kafka-test-kafka-bootstrap
          spec:
            (contains(ports[].port, `9092`)): true
    - error:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: kafka-test-zookeeper-client

  - name: verify-user
    try:
    # The user operator turns the KafkaUser into a Secret of the same name
    # holding the SCRAM password; a missing Secret means users never reconcile.
    - assert:
        timeout: 3m
        resource:
          apiVersion: kafka.strimzi.io/v1beta2
          kind: KafkaUser
          metadata:
            name: kafka-test-app
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 1m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kafka-test-app
          (data.password != null): true

  - name: verify-pvc-reclaim-on-delete
    try:
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Kafka
          name: test
    - error:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: data-0-kafka-test-kafka-test-controller-1000
    - error:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: data-0-kafka-test-kafka-test-broker-0
    - error:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: data-0-kafka-test-kafka-test-broker-1
