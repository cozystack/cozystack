apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-gateway-label-lockstep
spec:
  catch:
  - events: {}
  steps:
  - name: create-child-tenant-with-gateway
    try:
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: gwprop
          spec:
            gateway: true
  - name: assert-label-and-values
    try:
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tenant-test-gwprop
            labels:
              namespace.cozystack.io/gateway: tenant-test-gwprop
    - script:
        timeout: 2m
        content: |
          set -eu
          deadline=$(( $(date +%s) + 60 ))
          until kubectl -n tenant-test-gwprop get secret cozystack-values >/dev/null 2>&1; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "cozystack-values not created" >&2; exit 1; }
            sleep 2
          done
          v=$(kubectl -n tenant-test-gwprop get secret cozystack-values -o jsonpath='{.data.values\.yaml}' | base64 -d)
          echo "$v" | grep -E '^\s*gateway:\s*"tenant-test-gwprop"\s*$'
        check:
          ($error == null): true
    finally:
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          name: gwprop
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-gateway-inheritance
spec:
  catch:
  - events: {}
  steps:
  - name: create-parent-tenant
    try:
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: gwparent
          spec:
            gateway: true
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tenant-test-gwparent
            labels:
              namespace.cozystack.io/gateway: tenant-test-gwparent
  - name: create-child-tenant
    try:
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: gwchild
            namespace: tenant-test-gwparent
          spec: {}
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tenant-test-gwparent-gwchild
            labels:
              namespace.cozystack.io/gateway: tenant-test-gwparent
  - name: assert-inheritance-values
    try:
    - script:
        timeout: 2m
        content: |
          set -eu
          deadline=$(( $(date +%s) + 60 ))
          until kubectl -n tenant-test-gwparent-gwchild get secret cozystack-values >/dev/null 2>&1; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "child cozystack-values not created" >&2; exit 1; }
            sleep 2
          done
          v=$(kubectl -n tenant-test-gwparent-gwchild get secret cozystack-values -o jsonpath='{.data.values\.yaml}' | base64 -d)
          echo "$v" | grep -E '^\s*gateway:\s*"tenant-test-gwparent"\s*$'
        check:
          ($error == null): true
    # The child must NOT own a gateway HelmRelease — inheritance, not its own.
    - error:
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: gateway
            namespace: tenant-test-gwparent-gwchild
    finally:
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          name: gwchild
          namespace: tenant-test-gwparent
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          name: gwparent
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-gateway-route-listener
spec:
  catch:
  - events: {}
  steps:
  - name: parent-child-and-route-drive-listener-set
    try:
    - script:
        timeout: 6m
        content: |
          set -eu
          ns="$NAMESPACE"

          cleanup() {
            kubectl -n tenant-test-rparent-rchild delete httproute inherit-probe --ignore-not-found >/dev/null 2>&1 || true
            kubectl -n tenant-test-rparent delete tenant rchild --ignore-not-found >/dev/null 2>&1 || true
            kubectl -n "$ns" delete tenant rparent --ignore-not-found >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Parent tenant owns the Gateway.
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: rparent
          spec:
            gateway: true
          EOF
          timeout 180 sh -ec 'until kubectl get ns tenant-test-rparent >/dev/null 2>&1; do sleep 3; done'
          timeout 120 sh -ec 'until kubectl -n tenant-test-rparent get gateway cozystack >/dev/null 2>&1; do sleep 3; done'

          # Child tenant inherits the parent Gateway.
          kubectl apply -n tenant-test-rparent -f - <<EOF
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: rchild
          spec: {}
          EOF
          timeout 180 sh -ec 'until kubectl get ns tenant-test-rparent-rchild >/dev/null 2>&1; do sleep 3; done'

          child_apex=$(kubectl get ns tenant-test-rparent-rchild -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$child_apex" ]
          route_host="harbor.${child_apex}"

          # An HTTPRoute in the child, attached to the parent Gateway.
          kubectl apply -n tenant-test-rparent-rchild -f - <<EOF
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: inherit-probe
          spec:
            parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: cozystack
              namespace: tenant-test-rparent
            hostnames:
            - "${route_host}"
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /
              backendRefs:
              - name: kubernetes
                namespace: default
                port: 443
          EOF

          # cozystack-controller collects the route across the inheritance label
          # and grows a per-listener HTTPS entry on the parent Gateway.
          timeout 120 sh -ec '
            until kubectl -n tenant-test-rparent get gateway cozystack \
              -o jsonpath="{range .spec.listeners[?(@.protocol==\"HTTPS\")]}{.hostname}{\"\n\"}{end}" 2>/dev/null \
              | grep -qx "'"$route_host"'"; do sleep 3; done'

          # ...and a matching per-listener Certificate.
          timeout 60 sh -ec '
            until kubectl -n tenant-test-rparent get certificate \
              -l cozystack.io/per-listener-cert=true \
              -o jsonpath="{range .items[*]}{.spec.dnsNames[0]}{\"\n\"}{end}" 2>/dev/null \
              | grep -qx "'"$route_host"'"; do sleep 3; done'
        check:
          ($error == null): true
---
# Legacy-Ingress counterpart of the gateway/route hostname VAPs (bats: the 12
# cozystack-ingress-hostname-policy cases). Gateway API is off by default, so
# tenant apps publish through a legacy networking.k8s.io/Ingress; the VAP
# constrains tenant Ingress hostnames on the shared ingress-nginx. The VAP
# matches on the tenant-* namespace, not the caller, so plain applies as the
# runner's identity exercise it — no impersonation needed. Hostnames are
# derived at runtime: the tenant apex from this namespace's
# namespace.cozystack.io/host label (as elsewhere in this suite) and the
# platform ROOT apex from the same label on tenant-root, so the
# under-root-but-outside-own-apex cases stay host-independent where the bats
# hardcoded test.example.org / example.org.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ingress-hostname-policy
spec:
  catch:
  - events: {}
  steps:
  # If these resources are missing, admission cannot constrain tenant Ingress
  # hostnames — make that loud instead of letting it fall through as a silent
  # pass.
  - name: vap-and-binding-installed
    try:
    - assert:
        resource:
          apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingAdmissionPolicy
          metadata:
            name: cozystack-ingress-hostname-policy
    - assert:
        resource:
          apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingAdmissionPolicyBinding
          metadata:
            name: cozystack-ingress-hostname-policy
          spec:
            (contains(validationActions, 'Deny')): true
  # Apex-derived rejects:
  #   foreign-apex-host    dashboard.<root> — under the platform root apex but
  #                        outside the tenant's own apex
  #   prefix-adjacent      evil<apex> — dot-boundary guard: a naive suffix
  #                        check without the leading dot would match "<apex>"
  #                        inside "evil<apex>"; the CEL uses endsWith("." + apex)
  #   foreign-tls-host     in-apex rule host, but a spec.tls[].hosts[] entry
  #                        under the root apex — the tls branch denies on its own
  #   wildcard-matches-apex *.<root-parent> is "outside" the root apex by a
  #                        plain string test, but at ingress-nginx it also
  #                        matches the bare root apex; the outside-root path is
  #                        gated on the host not being a wildcard
  - name: foreign-and-adjacent-hosts-denied
    try:
    - script:
        content: |
          set -eu
          ns="$NAMESPACE"
          apex=$(kubectl get namespace "$ns" -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          root=$(kubectl get namespace tenant-root -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$apex" ] || { echo "SETUP FAILURE: $ns lacks the namespace.cozystack.io/host label" >&2; exit 1; }
          [ -n "$root" ] || { echo "SETUP FAILURE: tenant-root lacks the namespace.cozystack.io/host label" >&2; exit 1; }
          [ "$apex" != "$root" ] || { echo "SETUP FAILURE: tenant apex equals root apex; under-root-outside-own cases are undefined" >&2; exit 1; }
          # deny <case> <ingress-name> <extra-grep|""> reads a manifest on
          # stdin and expects admission to reject it with a VAP message.
          deny() {
            kubectl -n "$ns" delete ingress "$2" --ignore-not-found >/dev/null
            out=$(kubectl apply -n "$ns" -f - 2>&1) && rc=0 || rc=$?
            echo "case=$1 rc=$rc"
            if [ "$rc" -eq 0 ]; then
              kubectl -n "$ns" delete ingress "$2" --ignore-not-found
              echo "BUG: admission accepted $1: $out" >&2
              exit 1
            fi
            echo "$out" | grep -qi "ValidatingAdmissionPolicy"
            [ -z "$3" ] || echo "$out" | grep -qi "$3"
          }
          deny foreign-apex-host ingress-out-of-apex-host-probe "must be within" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-out-of-apex-host-probe
          spec:
            rules:
            - host: "dashboard.${root}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          deny prefix-adjacent ingress-prefix-adjacent-probe "" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-prefix-adjacent-probe
          spec:
            rules:
            - host: "evil${apex}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          deny foreign-tls-host ingress-tls-out-of-apex-probe "must be within" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-tls-out-of-apex-probe
          spec:
            tls:
            - hosts:
              - "harbor.${root}"
              secretName: noop-tls
            rules:
            - host: "harbor.${apex}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          case "$root" in
            *.*) w="*.${root#*.}" ;;
            *)   w="*.${root}" ;;
          esac
          deny wildcard-matches-apex ingress-wildcard-host-probe "" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-wildcard-host-probe
          spec:
            rules:
            - host: "${w}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
        check:
          ($error == null): true
  # Static rejects — catch-all shapes on the shared ingress-nginx:
  #   hostless        a rule with no .host matches all inbound HTTP
  #   empty-host      host: "" is the same catch-all; the CEL denies it via
  #                   r.host != "" (or has(r.host) if the apiserver drops it)
  #   defaultBackend  catch-all for otherwise-unmatched traffic
  - name: catch-all-shapes-denied
    try:
    - script:
        content: |
          set -eu
          ns="$NAMESPACE"
          deny() {
            kubectl -n "$ns" delete ingress "$2" --ignore-not-found >/dev/null
            out=$(kubectl apply -n "$ns" -f - 2>&1) && rc=0 || rc=$?
            echo "case=$1 rc=$rc"
            if [ "$rc" -eq 0 ]; then
              kubectl -n "$ns" delete ingress "$2" --ignore-not-found
              echo "BUG: admission accepted $1: $out" >&2
              exit 1
            fi
            echo "$out" | grep -qi "ValidatingAdmissionPolicy"
          }
          deny hostless-rule ingress-hostless-probe <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-hostless-probe
          spec:
            rules:
            - http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          deny empty-host ingress-empty-host-probe <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-empty-host-probe
          spec:
            rules:
            - host: ""
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          deny default-backend ingress-defaultbackend-probe <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-defaultbackend-probe
          spec:
            defaultBackend:
              service:
                name: noop
                port:
                  number: 80
          EOF
        check:
          ($error == null): true
  # Inverse sanity checks under the tenant's own apex: an in-apex rule+tls
  # Ingress and a wildcard under the own apex (*.<apex>) must NOT be rejected
  # — the anti-wildcard gate applies only to the outside-root path. Created
  # inside the script (they need ${apex} interpolation), so also deleted here.
  - name: own-apex-allowed
    try:
    - script:
        content: |
          set -eu
          ns="$NAMESPACE"
          apex=$(kubectl get namespace "$ns" -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$apex" ] || { echo "SETUP FAILURE: $ns lacks the namespace.cozystack.io/host label" >&2; exit 1; }
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-hostname-allow-probe
          spec:
            tls:
            - hosts:
              - "harbor.${apex}"
              secretName: noop-tls
            rules:
            - host: "harbor.${apex}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          kubectl -n "$ns" delete ingress ingress-hostname-allow-probe --ignore-not-found
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-ownapex-wildcard-probe
          spec:
            rules:
            - host: "*.${apex}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          kubectl -n "$ns" delete ingress ingress-ownapex-wildcard-probe --ignore-not-found
        check:
          ($error == null): true
  # Static accepts — concrete external domains outside the platform root apex
  # on both spec.rules[].host and spec.tls[].hosts. Declarative apply; Chainsaw
  # auto-cleanup deletes the probes.
  - name: external-domain-allowed
    try:
    - apply:
        file: ingress-external-allow.yaml
---
# Regression for #3983, which reported fail-closed admission webhooks becoming
# unreachable from the API server while an unrelated namespace was deleted. The
# mechanism is NOT confirmed: the errno in that report cannot come from a policy
# denial, and namespace deletion churns service backends as well as Cilium
# identities. So this case asserts the property the issue is about -- both
# webhooks still admit across a namespace deletion -- rather than claiming to
# reproduce a cause. Both affected paths are exercised immediately after the
# deletion, with no retry to hide a window.
#
# Every apply in this test passes through both fail-closed webhooks, so a
# cluster whose webhooks were ALREADY down fails here in a way that reads
# exactly like the outage under test. The first run of this case did precisely
# that: the ingress-nginx controller was crash-looping, the admission Service
# had no ready backend, and the setup apply died with "dial tcp ...: no route to
# host" before any churn happened. So availability is asserted before the churn
# as a precondition with its own message, and the churn verdict is only reached
# once both webhooks are known to have been up to begin with.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: admission-webhooks-survive-namespace-churn
spec:
  catch:
  - events: {}
  steps:
  - name: ingress-and-pod-admission-remain-available-after-deletion
    try:
    - script:
        # Above the sum of the inner budgets, per the rule in
        # hack/e2e-chainsaw/.chainsaw.yaml: 2x90s of webhook preconditions, 60s
        # of pre-clean delete, 90s waiting for the churn pod, 180s for the
        # namespace delete = 510s, and timeouts.exec would otherwise cap the
        # whole script at 5m and SIGKILL it with no verdict.
        timeout: 12m
        content: |
          set -eu
          ns="$NAMESPACE"
          churn_ns=tenant-admission-churn-probe
          apex=$(kubectl get namespace "$ns" -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$apex" ] || { echo "SETUP FAILURE: $ns lacks the namespace.cozystack.io/host label" >&2; exit 1; }

          # Coordinates come from the webhook registrations themselves, which is
          # what the API server dials, rather than from a guessed release name or
          # namespace. A webhook that is not registered at all is a setup
          # failure: nothing below could then prove anything about it.
          webhook_services() {
            kubectl get "$1" \
              -o jsonpath='{range .items[*]}{range .webhooks[*]}{.name}{" "}{.clientConfig.service.namespace}{" "}{.clientConfig.service.name}{"\n"}{end}{end}'
          }

          # Ready endpoint addresses behind a Service. Counted from
          # EndpointSlice .endpoints[].conditions.ready rather than from pod
          # readiness, because that is the state the API server routes on, and
          # because a `kubectl wait --for=condition=Ready` is satisfied
          # transiently by a pod that is flapping.
          ready_backends() {
            n=$(kubectl -n "$1" get endpointslice -l "kubernetes.io/service-name=$2" \
              -o jsonpath='{range .items[*]}{range .endpoints[*]}{.conditions.ready}{"\n"}{end}{end}' \
              2>/dev/null | grep -c '^true$' || true)
            [ -n "$n" ] || n=0
            echo "$n"
          }

          # Distinct variable names from require_webhook_up below, deliberately:
          # POSIX shell functions share one scope, so reusing `label` here
          # appended each iteration's suffix to the caller's own copy and the
          # second registration reported itself as "(1/2) (2/2)".
          require_service_up() {
            svclabel="$1"; svcns="$2"; svcname="$3"; svcbudget="$4"
            svcdeadline=$(( $(date +%s) + svcbudget ))
            while :; do
              n=$(ready_backends "$svcns" "$svcname")
              if [ "$n" -gt 0 ]; then
                echo "PRECONDITION OK  $svclabel ($svcns/$svcname) has $n ready backend(s)"
                return 0
              fi
              [ "$(date +%s)" -lt "$svcdeadline" ] || break
              sleep 5
            done
            echo "SETUP FAILURE: $svclabel ($svcns/$svcname) has no ready backend after ${svcbudget}s." >&2
            echo "  This test cannot tell a churn-induced outage from a webhook that was" >&2
            echo "  already down, and every apply below goes through it, so it stops here" >&2
            echo "  rather than reporting the wrong cause." >&2
            kubectl -n "$svcns" get endpointslice -l "kubernetes.io/service-name=$svcname" -o yaml >&2 2>&1 || true
            kubectl -n "$svcns" get pods -o wide >&2 2>&1 || true
            return 1
          }

          # EVERY registration of the named webhook, not just the first. All of
          # them fire on the applies below, so one being down aborts the apply
          # and the failure would be reported as a churn-induced outage. The
          # loop indexes with sed rather than piping into `while read`, because
          # a pipeline's body runs in a subshell under dash and a `return` from
          # it would not reach this function.
          require_webhook_up() {
            label="$1"; kind="$2"; hook="$3"; budget="$4"
            coords=$(webhook_services "$kind" | awk -v h="$hook" '$1 == h { print $2, $3 }')
            [ -n "$coords" ] || {
              echo "SETUP FAILURE: no $kind registers webhook $hook, so its availability cannot be asserted" >&2
              return 1
            }
            total=$(printf '%s\n' "$coords" | grep -c . || true)
            [ -n "$total" ] || total=0
            i=0
            while [ "$i" -lt "$total" ]; do
              i=$(( i + 1 ))
              line=$(printf '%s\n' "$coords" | sed -n "${i}p")
              require_service_up "$label ($i/$total)" "${line% *}" "${line#* }" "$budget" || return 1
            done
            return 0
          }

          require_webhook_up "ingress admission" validatingwebhookconfigurations \
            validate.nginx.ingress.kubernetes.io 90
          require_webhook_up "pod admission" mutatingwebhookconfigurations \
            kube-ovn-webhook.cozystack.io 90

          # Reproduce the incident shape: an ordinary tenant namespace carrying
          # an admitted Ingress AND a running pod, deleted synchronously, with
          # the fail-closed webhooks invoked while Cilium processes the removal.
          #
          # The pod is what makes this a churn test rather than a smoke test. A
          # Cilium identity is the set of an endpoint's identity-relevant
          # labels, and k8s:io.kubernetes.pod.namespace is one of them, so a pod
          # in a brand-new namespace allocates a NEW identity, and deleting the
          # namespace releases it. An empty namespace has no endpoint, allocates
          # no identity, and its deletion drives no identity churn at all, so
          # without the pod this case would exercise nothing it names.
          kubectl delete namespace "$churn_ns" --ignore-not-found --wait=true --timeout=60s
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${churn_ns}
            labels:
              namespace.cozystack.io/host: churn.${apex}
          EOF
          kubectl apply -n "$churn_ns" -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: admission-churn-source
          spec:
            rules:
            - host: probe.churn.${apex}
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          # busybox:musl is staged onto every node by hack/e2e-prepull-images.sh,
          # so this adds no image pull. The securityContext satisfies the
          # restricted PodSecurity profile, so it runs whatever level the tenant
          # namespace enforces.
          kubectl apply -n "$churn_ns" -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: admission-churn-identity
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: hold
              image: busybox:musl
              command: ["sleep", "600"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          EOF
          kubectl -n "$churn_ns" wait --for=condition=Ready pod/admission-churn-identity --timeout=90s || {
            echo "SETUP FAILURE: the churn pod never became Ready, so deleting $churn_ns releases no Cilium identity and this test would assert nothing" >&2
            kubectl -n "$churn_ns" describe pod admission-churn-identity >&2 2>&1 || true
            exit 1
          }

          kubectl delete namespace "$churn_ns" --wait=true --timeout=180s

          # No retry on either call: a retry would paper over exactly the window
          # this test exists to catch.
          #
          # ingress-nginx validating admission
          kubectl apply --dry-run=server -n "$ns" -o name -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: admission-after-churn
          spec:
            rules:
            - host: admission-after-churn.${apex}
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF

          # kubeovn-webhook mutating admission. The securityContext is carried
          # even though a server dry-run Pod is never scheduled: if the tenant
          # namespace ever enforces restricted PodSecurity, a non-compliant Pod
          # is rejected in the validating phase and `set -eu` would abort this
          # check, which reads as the webhook being down.
          kubectl apply --dry-run=server -n "$ns" -o name -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: admission-after-churn
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: pause
              image: registry.k8s.io/pause:3.10
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          EOF
          echo "OK   both fail-closed webhooks admitted after $churn_ns was deleted"
        check:
          ($error == null): true
    finally:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: tenant-admission-churn-probe
---
# Companion to admission-webhooks-survive-namespace-churn above. That case
# proves the pod admission webhook stays AVAILABLE; this one proves it is still
# UNREACHABLE from pods, which is the property the policy exists for, and that
# the deny is scoped to that one destination rather than to its port everywhere.
#
# The port-scoping half is the assertion that earns this case. The policy
# previously expressed the Service-frontend deny with `toServices`, which Cilium
# resolves only inside ALLOW rules -- leaving the deny rule with an empty L3
# selector that Cilium reads as a WILDCARD when the rule carries toPorts, so
# "deny this Service on 8443" became "deny EVERY destination on 8443" for every
# pod in the cluster. Every rendered-YAML assertion in
# packages/system/kubeovn-webhook passed on that policy, and so would this case
# without a second destination on the same port. So it stands up its own
# listener on the denied port and requires that to stay reachable.
#
# It runs from a namespace it creates and labels cozystack.io/system=true, and
# that choice is load-bearing rather than tidiness. Measured on a live
# kube-ovn+cilium cluster carrying no webhook policy at all: from tenant-root,
# both kube-ovn-webhook:443 and an unrelated kube-ovn-controller:10660 in
# cozy-kubeovn are unreachable, because packages/apps/tenant ships a
# default-deny egress CiliumClusterwideNetworkPolicy per tenant that permits
# only namespaces carrying tenant.cozystack.io/<tenant> -- which no cozy-*
# namespace does. A deny verdict measured from there would hold with the policy
# uninstalled. From a cozystack.io/system namespace, on the same cluster with no
# policy, all four destinations below were reachable, so the deny under test is
# the only thing that can refuse the connect. That label also takes the
# namespace out of this webhook's own namespaceSelector, so creating the probe
# pods does not depend on the webhook whose reachability is being denied.
#
# And "for the wrong reason" is the whole difficulty, because a refused connect
# does not say why it was refused. "Denied by policy" and "no backend to route
# to" are the same observation from inside the probe, so both deny assertions
# would report success against a cluster with no policy installed at all, as
# long as the backend was dead. So the deny verdicts are gated on the webhook
# Service having ready backends before the probe, on every sample while it runs,
# and after it finishes, and on the webhook pods not having restarted or been
# replaced across that window. The reachable verdicts are gated the same way on
# the listener. The probe itself only reports reachable/unreachable per
# destination and always exits 0; this script attributes the cause, because it
# is the half that holds the endpoint evidence. Anything that leaves the
# question undecidable fails as a setup failure rather than as a verdict.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-admission-webhook-deny-still-enforced
spec:
  catch:
  - events: {}
  steps:
  - name: pods-cannot-reach-the-pod-webhook-but-keep-unrelated-egress-on-its-port
    try:
    - script:
        # Above the sum of the inner budgets, per the rule in
        # hack/e2e-chainsaw/.chainsaw.yaml: 60s to clear a leftover probe
        # namespace, 120s of webhook endpoint precondition, 90s for the
        # listener, 30s of stability sampling and 180s of phase polling = 480s,
        # and timeouts.exec would otherwise cap the whole script at 5m and
        # SIGKILL it with no verdict.
        timeout: 12m
        content: |
          set -eu
          probe_ns=e2e-pod-admission-deny-probe
          registration=kube-ovn-webhook.cozystack.io

          # Coordinates come from the webhook registration itself, which is what
          # the API server dials, rather than from a guessed release name or
          # namespace. Not registered at all is a setup failure: nothing below
          # could then prove anything about it.
          coords=$(kubectl get mutatingwebhookconfigurations \
            -o jsonpath='{range .items[*]}{range .webhooks[*]}{.name}{" "}{.clientConfig.service.namespace}{" "}{.clientConfig.service.name}{"\n"}{end}{end}' \
            | awk -v h="$registration" '$1 == h { print $2, $3; exit }')
          [ -n "$coords" ] || {
            echo "SETUP FAILURE: no MutatingWebhookConfiguration registers $registration, so its reachability cannot be asserted" >&2
            exit 1
          }
          hook_ns=${coords% *}
          hook_svc=${coords#* }

          # The pod selector is read off the Service rather than written out
          # here, so a chart that relabels its pods does not leave this case
          # silently selecting nothing.
          sel=$(kubectl -n "$hook_ns" get svc "$hook_svc" \
            -o go-template='{{range $k, $v := .spec.selector}}{{$k}}={{$v}},{{end}}' | sed 's/,$//')
          [ -n "$sel" ] || { echo "SETUP FAILURE: $hook_ns/$hook_svc has no pod selector" >&2; exit 1; }

          hook_fe=$(kubectl -n "$hook_ns" get svc "$hook_svc" -o jsonpath='{.spec.ports[0].port}')
          [ -n "$hook_fe" ] || { echo "SETUP FAILURE: $hook_ns/$hook_svc exposes no port" >&2; exit 1; }

          # Ready endpoint addresses behind a Service, from EndpointSlice rather
          # than from pod readiness: this is the state the API server and the
          # service load balancer route on, and a
          # `kubectl wait --for=condition=Ready` is satisfied transiently by a
          # pod that is flapping.
          ready_backends() {
            n=$(kubectl -n "$1" get endpointslice -l "kubernetes.io/service-name=$2" \
              -o jsonpath='{range .items[*]}{range .endpoints[*]}{.conditions.ready}{"\n"}{end}{end}' \
              2>/dev/null | grep -c '^true$' || true)
            [ -n "$n" ] || n=0
            echo "$n"
          }

          # Pod identity plus restart count, as one string. Compared for
          # equality across the probe window, so a restart AND a replacement
          # both show up -- a crash-looping webhook can satisfy a readiness
          # check at both ends of a window it spent dying in the middle of.
          webhook_generation() {
            kubectl -n "$hook_ns" get pod -l "$sel" \
              -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount}{" "}{end}'
          }

          # Precondition on the destination under test.
          deadline=$(( $(date +%s) + 120 ))
          while :; do
            hook_ready=$(ready_backends "$hook_ns" "$hook_svc")
            if [ "$hook_ready" -gt 0 ]; then break; fi
            [ "$(date +%s)" -lt "$deadline" ] || {
              echo "SETUP FAILURE: $hook_ns/$hook_svc has no ready backend after 120s." >&2
              echo "  A refused connect cannot be attributed to policy while the destination" >&2
              echo "  has nothing listening, so this test stops instead of reporting a deny" >&2
              echo "  it did not observe." >&2
              kubectl -n "$hook_ns" get endpointslice -l "kubernetes.io/service-name=$hook_svc" -o yaml >&2 2>&1 || true
              kubectl -n "$hook_ns" get pod -l "$sel" -o wide >&2 2>&1 || true
              exit 1
            }
            sleep 5
          done
          # The backend address and port come from the EndpointSlice, not from
          # the pod spec: that is the pair the service load balancer actually
          # DNATs to, so a chart that grew a sidecar, reordered its container
          # ports or renamed a targetPort cannot leave this case probing a port
          # nothing serves and reporting the resulting refusal as a deny. Only a
          # ready endpoint is taken, for the same reason. The port taken here is
          # also the port the listener below binds, so the two destinations are
          # compared on one value rather than on two that could drift apart.
          hook_ep=$(kubectl -n "$hook_ns" get endpointslice -l "kubernetes.io/service-name=$hook_svc" \
            -o go-template='{{range .items}}{{if .ports}}{{$port := (index .ports 0).port}}{{range .endpoints}}{{if .conditions.ready}}{{range .addresses}}{{.}} {{$port}}{{"\n"}}{{end}}{{end}}{{end}}{{end}}{{end}}' \
            | awk 'NF == 2 { print; exit }')
          [ -n "$hook_ep" ] || { echo "SETUP FAILURE: $hook_ns/$hook_svc has no ready endpoint address yet" >&2; exit 1; }
          hook_ip=${hook_ep% *}
          hook_port=${hook_ep#* }

          gen_before=$(webhook_generation)

          kubectl delete namespace "$probe_ns" --ignore-not-found --wait=true --timeout=60s
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${probe_ns}
            labels:
              # See the header: a tenant namespace is behind a default-deny
              # egress that would make the deny verdicts vacuous, and this label
              # also keeps pod creation here out of the webhook under test.
              cozystack.io/system: "true"
          EOF

          # The positive control, on the DENIED port and in the probe's own
          # namespace so no cross-namespace policy is in play. busybox:musl is
          # staged onto every node by hack/e2e-prepull-images.sh, so this adds no
          # image pull; httpd rather than `nc -l` because it keeps listening
          # across connections instead of exiting after the first. The
          # securityContext satisfies the restricted PodSecurity profile, so it
          # runs whatever level is enforced.
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: deny-probe-sink
            namespace: ${probe_ns}
            labels:
              app: deny-probe-sink
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: sink
              image: busybox:musl
              command: ["httpd", "-f", "-p", "${hook_port}", "-h", "/tmp"]
              ports:
              - name: sink
                containerPort: ${hook_port}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              readinessProbe:
                tcpSocket:
                  port: ${hook_port}
                periodSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: deny-probe-sink
            namespace: ${probe_ns}
          spec:
            selector:
              app: deny-probe-sink
            ports:
            - port: ${hook_port}
              targetPort: ${hook_port}
              protocol: TCP
          EOF

          deadline=$(( $(date +%s) + 90 ))
          while :; do
            sink_ready=$(ready_backends "$probe_ns" deny-probe-sink)
            if [ "$sink_ready" -gt 0 ]; then break; fi
            [ "$(date +%s)" -lt "$deadline" ] || {
              echo "SETUP FAILURE: the listener never got a ready backend, so a denied connect to it would prove nothing about scope" >&2
              kubectl -n "$probe_ns" describe pod deny-probe-sink >&2 2>&1 || true
              exit 1
            }
            sleep 5
          done
          sink_ip=$(kubectl -n "$probe_ns" get pod deny-probe-sink -o jsonpath='{.status.podIP}')
          [ -n "$sink_ip" ] || { echo "SETUP FAILURE: the listener has no address" >&2; exit 1; }

          # Stability: the same evidence held across a window, not at one
          # instant. Six samples over 30s, all of which must show both
          # destinations live and the webhook neither restarted nor replaced.
          i=0
          while [ "$i" -lt 6 ]; do
            sleep 5
            i=$(( i + 1 ))
            n=$(ready_backends "$hook_ns" "$hook_svc")
            m=$(ready_backends "$probe_ns" deny-probe-sink)
            [ "$n" -gt 0 ] && [ "$m" -gt 0 ] || {
              echo "SETUP FAILURE: a destination lost its ready backend during the stability window (sample $i: webhook=$n listener=$m)" >&2
              kubectl -n "$hook_ns" get pod -l "$sel" -o wide >&2 2>&1 || true
              exit 1
            }
          done
          gen_stable=$(webhook_generation)
          [ "$gen_stable" = "$gen_before" ] || {
            echo "SETUP FAILURE: the webhook restarted or was replaced during the stability window" >&2
            echo "  before: $gen_before" >&2
            echo "  after:  $gen_stable" >&2
            exit 1
          }

          echo "probing from $probe_ns: expect reachable deny-probe-sink:${hook_port} and ${sink_ip}:${hook_port}, denied ${hook_svc}.${hook_ns}.svc:${hook_fe} and ${hook_ip}:${hook_port}"

          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: deny-probe
            namespace: ${probe_ns}
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: probe
              image: busybox:musl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
              - name: SINK_SVC_HOST
                value: "deny-probe-sink.${probe_ns}.svc"
              - name: SINK_POD_HOST
                value: "${sink_ip}"
              - name: SINK_PORT
                value: "${hook_port}"
              - name: HOOK_SVC_HOST
                value: "${hook_svc}.${hook_ns}.svc"
              - name: HOOK_SVC_PORT
                value: "${hook_fe}"
              - name: HOOK_POD_HOST
                value: "${hook_ip}"
              - name: HOOK_POD_PORT
                value: "${hook_port}"
              command: ["sh", "-c"]
              args:
              # Measurement only, and always exit 0. The pod reports what it
              # observed per destination; the script that started it holds the
              # endpoint evidence and is the only place that can say why a
              # connect was refused. Keeping the verdict out of here is also
              # what stops "the probe could not run" from being read as "the
              # assertion failed".
              - |
                set -u
                reach() { nc -w 5 "\$1" "\$2" </dev/null >/dev/null 2>&1; }
                report() {
                  if reach "\$2" "\$3"; then
                    echo "\$1 reachable \$2:\$3"
                  else
                    echo "\$1 unreachable \$2:\$3"
                  fi
                }
                report SINK_SVC "\$SINK_SVC_HOST" "\$SINK_PORT"
                report SINK_POD "\$SINK_POD_HOST" "\$SINK_PORT"
                report HOOK_SVC "\$HOOK_SVC_HOST" "\$HOOK_SVC_PORT"
                report HOOK_POD "\$HOOK_POD_HOST" "\$HOOK_POD_PORT"
          EOF

          # Wait for a terminal phase rather than a condition, and re-check both
          # backends on every poll: a destination that dies mid-probe invalidates
          # the verdicts, and this is the window it would die in.
          deadline=$(( $(date +%s) + 180 ))
          phase=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$(ready_backends "$hook_ns" "$hook_svc")
            m=$(ready_backends "$probe_ns" deny-probe-sink)
            [ "$n" -gt 0 ] && [ "$m" -gt 0 ] || {
              echo "SETUP FAILURE: a destination lost its ready backend while the probe was running (webhook=$n listener=$m), so its result proves nothing" >&2
              kubectl -n "$hook_ns" get pod -l "$sel" -o wide >&2 2>&1 || true
              kubectl -n "$probe_ns" logs deny-probe >&2 2>&1 || true
              exit 1
            }
            phase=$(kubectl -n "$probe_ns" get pod deny-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 3
          done

          log=$(kubectl -n "$probe_ns" logs deny-probe 2>&1 || true)
          printf '%s\n' "$log"

          # Postconditions, before the log is interpreted at all.
          [ "$phase" = "Succeeded" ] || {
            echo "SETUP FAILURE: the probe did not run to completion (phase=${phase:-unknown})" >&2
            kubectl -n "$probe_ns" describe pod deny-probe >&2 2>&1 || true
            exit 1
          }
          gen_after=$(webhook_generation)
          [ "$gen_after" = "$gen_before" ] || {
            echo "SETUP FAILURE: the webhook restarted or was replaced during the probe" >&2
            echo "  before: $gen_before" >&2
            echo "  after:  $gen_after" >&2
            exit 1
          }
          n=$(ready_backends "$hook_ns" "$hook_svc")
          m=$(ready_backends "$probe_ns" deny-probe-sink)
          [ "$n" -gt 0 ] && [ "$m" -gt 0 ] || {
            echo "SETUP FAILURE: a destination has no ready backend after the probe (webhook=$n listener=$m), so its result proves nothing" >&2
            exit 1
          }

          verdict() { printf '%s\n' "$log" | awk -v k="$1" '$1 == k { print $2; exit }'; }
          sink_svc_seen=$(verdict SINK_SVC)
          sink_pod_seen=$(verdict SINK_POD)
          hook_svc_seen=$(verdict HOOK_SVC)
          hook_pod_seen=$(verdict HOOK_POD)
          for v in "$sink_svc_seen" "$sink_pod_seen" "$hook_svc_seen" "$hook_pod_seen"; do
            [ -n "$v" ] || {
              echo "SETUP FAILURE: the probe did not report all four destinations" >&2
              exit 1
            }
          done

          # From here every branch is a real verdict: each destination had a live
          # backend before, throughout and after, on pods that neither restarted
          # nor were replaced.
          rc=0
          if [ "$sink_svc_seen" = reachable ]; then
            echo "OK   unrelated ClusterIP egress on port ${hook_port} works"
          else
            echo "BUG  unrelated ClusterIP egress on port ${hook_port} DENIED to a live backend -- the webhook deny is not scoped to the webhook" >&2
            rc=1
          fi
          if [ "$sink_pod_seen" = reachable ]; then
            echo "OK   unrelated pod-IP egress on port ${hook_port} works"
          else
            echo "BUG  unrelated pod-IP egress on port ${hook_port} DENIED to a live backend -- the webhook deny is not scoped to the webhook" >&2
            rc=1
          fi
          if [ "$hook_svc_seen" = unreachable ]; then
            echo "OK   webhook denied through its Service ClusterIP"
          else
            echo "BUG  webhook reachable through its Service ClusterIP (${hook_svc}.${hook_ns}.svc:${hook_fe})" >&2
            rc=1
          fi
          if [ "$hook_pod_seen" = unreachable ]; then
            echo "OK   webhook denied on its backend port"
          else
            echo "BUG  webhook reachable directly on its backend port (${hook_ip}:${hook_port})" >&2
            rc=1
          fi
          exit "$rc"
        check:
          ($error == null): true
    finally:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: e2e-pod-admission-deny-probe
