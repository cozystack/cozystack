        check:
          ($error == null): true
  - name: assert-gateway-issuer-status
    try:
    - assert:
        timeout: 2m
        resource:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: tg-e2e-probe
    - assert:
        timeout: 2m
        resource:
          apiVersion: cert-manager.io/v1
