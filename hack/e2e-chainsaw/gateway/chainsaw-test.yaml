apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-gateway-label-lockstep
spec:
  catch:
  - events: {}
  steps:
  - name: create-child-tenant-with-gateway
    try:
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: gwprop
          spec:
            gateway: true
  - name: assert-label-and-values
    try:
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tenant-test-gwprop
            labels:
              namespace.cozystack.io/gateway: tenant-test-gwprop
    - script:
        timeout: 2m
        content: |
          set -eu
          deadline=$(( $(date +%s) + 60 ))
          until kubectl -n tenant-test-gwprop get secret cozystack-values >/dev/null 2>&1; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "cozystack-values not created" >&2; exit 1; }
            sleep 2
          done
          v=$(kubectl -n tenant-test-gwprop get secret cozystack-values -o jsonpath='{.data.values\.yaml}' | base64 -d)
          echo "$v" | grep -E '^\s*gateway:\s*"tenant-test-gwprop"\s*$'
        check:
          ($error == null): true
    finally:
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          name: gwprop
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-gateway-inheritance
spec:
  catch:
  - events: {}
  steps:
  - name: create-parent-tenant
    try:
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: gwparent
          spec:
            gateway: true
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tenant-test-gwparent
            labels:
              namespace.cozystack.io/gateway: tenant-test-gwparent
  - name: create-child-tenant
    try:
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: gwchild
            namespace: tenant-test-gwparent
          spec: {}
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tenant-test-gwparent-gwchild
            labels:
              namespace.cozystack.io/gateway: tenant-test-gwparent
  - name: assert-inheritance-values
    try:
    - script:
        timeout: 2m
        content: |
          set -eu
          deadline=$(( $(date +%s) + 60 ))
          until kubectl -n tenant-test-gwparent-gwchild get secret cozystack-values >/dev/null 2>&1; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "child cozystack-values not created" >&2; exit 1; }
            sleep 2
          done
          v=$(kubectl -n tenant-test-gwparent-gwchild get secret cozystack-values -o jsonpath='{.data.values\.yaml}' | base64 -d)
          echo "$v" | grep -E '^\s*gateway:\s*"tenant-test-gwparent"\s*$'
        check:
          ($error == null): true
    # The child must NOT own a gateway HelmRelease — inheritance, not its own.
    - error:
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: gateway
            namespace: tenant-test-gwparent-gwchild
    finally:
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          name: gwchild
          namespace: tenant-test-gwparent
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          name: gwparent
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-gateway-route-listener
spec:
  catch:
  - events: {}
  steps:
  - name: parent-child-and-route-drive-listener-set
    try:
    - script:
        timeout: 6m
        content: |
          set -eu
          ns="$NAMESPACE"

          cleanup() {
            kubectl -n tenant-test-rparent-rchild delete httproute inherit-probe --ignore-not-found >/dev/null 2>&1 || true
            kubectl -n tenant-test-rparent delete tenant rchild --ignore-not-found >/dev/null 2>&1 || true
            kubectl -n "$ns" delete tenant rparent --ignore-not-found >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Parent tenant owns the Gateway.
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: rparent
          spec:
            gateway: true
          EOF
          timeout 180 sh -ec 'until kubectl get ns tenant-test-rparent >/dev/null 2>&1; do sleep 3; done'
          timeout 120 sh -ec 'until kubectl -n tenant-test-rparent get gateway cozystack >/dev/null 2>&1; do sleep 3; done'

          # Child tenant inherits the parent Gateway.
          kubectl apply -n tenant-test-rparent -f - <<EOF
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: rchild
          spec: {}
          EOF
          timeout 180 sh -ec 'until kubectl get ns tenant-test-rparent-rchild >/dev/null 2>&1; do sleep 3; done'

          child_apex=$(kubectl get ns tenant-test-rparent-rchild -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$child_apex" ]
          route_host="harbor.${child_apex}"

          # An HTTPRoute in the child, attached to the parent Gateway.
          kubectl apply -n tenant-test-rparent-rchild -f - <<EOF
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: inherit-probe
          spec:
            parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: cozystack
              namespace: tenant-test-rparent
            hostnames:
            - "${route_host}"
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /
              backendRefs:
              - name: kubernetes
                namespace: default
                port: 443
          EOF

          # cozystack-controller collects the route across the inheritance label
          # and grows a per-listener HTTPS entry on the parent Gateway.
          timeout 120 sh -ec '
            until kubectl -n tenant-test-rparent get gateway cozystack \
              -o jsonpath="{range .spec.listeners[?(@.protocol==\"HTTPS\")]}{.hostname}{\"\n\"}{end}" 2>/dev/null \
              | grep -qx "'"$route_host"'"; do sleep 3; done'

          # ...and a matching per-listener Certificate.
          timeout 60 sh -ec '
            until kubectl -n tenant-test-rparent get certificate \
              -l cozystack.io/per-listener-cert=true \
              -o jsonpath="{range .items[*]}{.spec.dnsNames[0]}{\"\n\"}{end}" 2>/dev/null \
              | grep -qx "'"$route_host"'"; do sleep 3; done'
        check:
          ($error == null): true
---
# What a tlsPassthroughServices name costs an HTTPRoute that publishes it,
# measured on the objects rather than on the renderer. The chart ships api,
# vm-exportproxy and cdi-uploadproxy on every tenant Gateway while the platform
# TLSRoutes for them exist once cluster-wide and name one tenant's Gateway, so
# a tenant that is not that one renders all three listeners with a route on
# none. Both halves of the rule live in that gap: a declared listener nothing
# attaches to contributes no Envoy filter chain, so the terminate listener is
# what answers the name and keeps it; once a TLSRoute can be served on the
# listener the two chains carry one server name and the terminate listener goes.
#
# The two phases are one measurement on purpose. Asserting the terminate
# listener is present proves nothing on its own — a withdrawal that is merely
# slow looks the same — so the second phase withdraws it on demand, which dates
# the first phase's presence to a state the controller had settled.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-gateway-passthrough-withdrawal
spec:
  catch:
  - events: {}
  steps:
  - name: routeless-passthrough-keeps-the-terminate-listener
    try:
    # Above the sum of the poll budgets below (1140s), so a poll is what
    # fires and the trap still runs: a SIGKILL at the op ceiling would skip
    # cleanup and leave the tenant behind for every later suite.
    - script:
        timeout: 25m
        content: |
          set -eu
          ns="$NAMESPACE"
          tenant_ns="${ns}-pw"

          # --wait=false because the trap runs inside the op ceiling, and a
          # tenant delete blocks until its child namespaces drain. Waiting
          # here would spend the headroom the budgets leave and let the
          # SIGKILL land mid-trap, which is the leak the ceiling is sized
          # to avoid.
          cleanup() {
            kubectl -n "$tenant_ns" delete tlsroute api-passthrough --ignore-not-found --wait=false >/dev/null 2>&1 || true
            kubectl -n "$tenant_ns" delete httproute api-probe --ignore-not-found --wait=false >/dev/null 2>&1 || true
            kubectl -n "$ns" delete tenant pw --ignore-not-found --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # kubectl's stdout is the measurement, so a call that failed must not
          # be read as one. An empty read satisfies "absent", which would end a
          # wait-until-withdrawn poll on a transient API error having measured
          # nothing at all.
          poll() {
            want=$1; budget=$2; match=$3; shift 3
            deadline=$(( $(date +%s) + budget ))
            while :; do
              if out=$("$@" 2>/dev/null); then
                if printf '%s\n' "$out" | grep -qxF "$match"; then
                  found=present
                else
                  found=absent
                fi
                if [ "$found" = "$want" ]; then
                  return 0
                fi
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "timed out after ${budget}s waiting for '$match' to be $want" >&2
                return 1
              fi
              sleep 3
            done
          }

          poll_exists() {
            budget=$1; shift
            deadline=$(( $(date +%s) + budget ))
            while :; do
              if "$@" >/dev/null 2>&1; then
                return 0
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "timed out after ${budget}s waiting for: $*" >&2
                return 1
              fi
              sleep 3
            done
          }

          tls_names='jsonpath={range .spec.listeners[?(@.protocol=="TLS")]}{.name}{"\n"}{end}'
          https_hosts='jsonpath={range .spec.listeners[?(@.protocol=="HTTPS")]}{.hostname}{"\n"}{end}'
          cert_hosts='jsonpath={range .items[*]}{.spec.dnsNames[0]}{"\n"}{end}'
          accepted='jsonpath={range .status.parents[?(@.controllerName=="gateway.cozystack.io/tenantgateway-controller")]}{range .conditions[?(@.type=="Accepted")]}{.status}{"\n"}{end}{end}'
          accepted_reason='jsonpath={range .status.parents[?(@.controllerName=="gateway.cozystack.io/tenantgateway-controller")]}{range .conditions[?(@.type=="Accepted")]}{.reason}{"\n"}{end}{end}'
          tgw_ready='jsonpath={range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}'
          tgw_listener='jsonpath={range .status.listeners[?(@.name=="tls-pgprobe")]}{.ready}{"\n"}{end}'

          # A tenant owning its own Gateway, which is where the shipped
          # tlsPassthroughServices entries land with nothing routed to them.
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: pw
          spec:
            gateway: true
          EOF
          poll_exists 180 kubectl get ns "$tenant_ns"
          poll_exists 120 kubectl -n "$tenant_ns" get gateway cozystack

          apex=$(kubectl get ns "$tenant_ns" -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$apex" ]
          route_host="api.${apex}"

          # Without the passthrough listener the rest measures an ordinary
          # HTTPRoute and says nothing about the withdrawal.
          poll present 60 tls-api kubectl -n "$tenant_ns" get gateway cozystack -o "$tls_names"

          # ...and with a TLSRoute already on it the first phase would be
          # measuring the withdrawal rather than its absence. Counted off a
          # captured result rather than through a pipe: a pipeline reports
          # its last command's status, so a failed kubectl reaches wc and
          # answers zero, and the guard passes having measured nothing.
          attached=$(kubectl -n "$tenant_ns" get tlsroute -o name)
          [ -z "$attached" ]

          kubectl apply -n "$tenant_ns" -f - <<EOF
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: api-probe
          spec:
            parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: cozystack
              namespace: ${tenant_ns}
            hostnames:
            - "${route_host}"
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /
              backendRefs:
              - name: kubernetes
                namespace: default
                port: 443
          EOF

          # The name is served by the terminate listener, which is the whole
          # claim: the passthrough listener declared above answers no
          # ClientHello while nothing routes to it.
          poll present 120 "$route_host" kubectl -n "$tenant_ns" get gateway cozystack -o "$https_hosts"
          poll present 60 "$route_host" kubectl -n "$tenant_ns" get certificate -l cozystack.io/per-listener-cert=true -o "$cert_hosts"
          poll present 60 True kubectl -n "$tenant_ns" get httproute api-probe -o "$accepted"

          # Phase 2: a TLSRoute the passthrough listener can serve. Now both
          # chains carry one server name, and the terminate listener is the one
          # that has to go.
          #
          # The backend is a Service in the tenant's own namespace, and that
          # is the half of "can serve" this step would otherwise skip: the
          # withdrawal fires only for a route that forwards somewhere, and a
          # cross-namespace backendRef with no ReferenceGrant resolves to no
          # Service at all. Selectorless is enough — resolution asks whether
          # the Service exists and never reads its ports or its endpoints —
          # and it goes with the tenant namespace, so nothing outlives the
          # test in a namespace the test does not own.
          kubectl apply -n "$tenant_ns" -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: api-passthrough-backend
          spec:
            ports:
            - port: 443
          EOF

          kubectl apply -n "$tenant_ns" -f - <<EOF
          apiVersion: gateway.networking.k8s.io/v1alpha2
          kind: TLSRoute
          metadata:
            name: api-passthrough
          spec:
            parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: cozystack
              namespace: ${tenant_ns}
              sectionName: tls-api
            hostnames:
            - "${route_host}"
            rules:
            - backendRefs:
              - name: api-passthrough-backend
                port: 443
          EOF

          poll absent 120 "$route_host" kubectl -n "$tenant_ns" get gateway cozystack -o "$https_hosts"
          poll absent 60 "$route_host" kubectl -n "$tenant_ns" get certificate -l cozystack.io/per-listener-cert=true -o "$cert_hosts"

          # The passthrough listener survives the withdrawal — without it the
          # hostname would be served by nothing, which is the failure the first
          # phase exists to rule out.
          kubectl -n "$tenant_ns" get gateway cozystack -o "$tls_names" | grep -qxF tls-api

          # ...and the HTTPRoute hears why its hostname went away.
          poll present 60 NoMatchingListenerHostname kubectl -n "$tenant_ns" get httproute api-probe -o "$accepted_reason"

          # Phase 3: the native-port form, which nothing above reaches. The
          # entry renders a listener on its own port with no TLSRoute behind
          # it, which is the shape the package README rests a claim on: the
          # pinned Cilium judges a listener on its protocol, its allowed
          # kinds and its certificate refs and never on its route set, so a
          # routeless passthrough listener is Accepted and Programmed and
          # tenant readiness is untouched. The unit tests run against a fake
          # client and cannot measure that; only a cluster can.
          #
          # Patched onto the TenantGateway because no chart value reaches
          # this field yet. It survives the patch because helm-controller
          # runs here with drift detection off, the same fact the README
          # documents.
          patch=$(printf '{"spec":{"tlsPassthroughListeners":[{"name":"pgprobe","port":5432,"hostname":"pgprobe.%s"}]}}' "$apex")
          kubectl -n "$tenant_ns" patch tenantgateway cozystack --type=merge -p "$patch"

          # The per-listener entry is the measurement, and it is read before
          # the aggregate because the aggregate cannot carry one. The
          # TenantGateway is already Ready when this phase starts, so a poll
          # for Ready alone is answered by the state that preceded the patch
          # unless the transient False happens to land first, which is a
          # race rather than a guarantee. This entry does not exist until
          # the controller has re-evaluated readiness against the new
          # listener, and its own flag folds that listener's Accepted and
          # Programmed, which is the claim being made. The aggregate after
          # it says the tenant as a whole did not regress.
          poll present 60 tls-pgprobe kubectl -n "$tenant_ns" get gateway cozystack -o "$tls_names"
          poll present 120 true kubectl -n "$tenant_ns" get tenantgateway cozystack -o "$tgw_listener"
          poll present 60 True kubectl -n "$tenant_ns" get tenantgateway cozystack -o "$tgw_ready"

          kubectl -n "$tenant_ns" patch tenantgateway cozystack --type=merge -p '{"spec":{"tlsPassthroughListeners":null}}'
          poll absent 60 tls-pgprobe kubectl -n "$tenant_ns" get gateway cozystack -o "$tls_names"
        check:
          ($error == null): true
---
# Legacy-Ingress counterpart of the gateway/route hostname VAPs (bats: the 12
# cozystack-ingress-hostname-policy cases). Gateway API is off by default, so
# tenant apps publish through a legacy networking.k8s.io/Ingress; the VAP
# constrains tenant Ingress hostnames on the shared ingress-nginx. The VAP
# matches on the tenant-* namespace, not the caller, so plain applies as the
# runner's identity exercise it — no impersonation needed. Hostnames are
# derived at runtime: the tenant apex from this namespace's
# namespace.cozystack.io/host label (as elsewhere in this suite) and the
# platform ROOT apex from the same label on tenant-root, so the
# under-root-but-outside-own-apex cases stay host-independent where the bats
# hardcoded test.example.org / example.org.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ingress-hostname-policy
spec:
  catch:
  - events: {}
  steps:
  # If these resources are missing, admission cannot constrain tenant Ingress
  # hostnames — make that loud instead of letting it fall through as a silent
  # pass.
  - name: vap-and-binding-installed
    try:
    - assert:
        resource:
          apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingAdmissionPolicy
          metadata:
            name: cozystack-ingress-hostname-policy
    - assert:
        resource:
          apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingAdmissionPolicyBinding
          metadata:
            name: cozystack-ingress-hostname-policy
          spec:
            (contains(validationActions, 'Deny')): true
  # Apex-derived rejects:
  #   foreign-apex-host    dashboard.<root> — under the platform root apex but
  #                        outside the tenant's own apex
  #   prefix-adjacent      evil<apex> — dot-boundary guard: a naive suffix
  #                        check without the leading dot would match "<apex>"
  #                        inside "evil<apex>"; the CEL uses endsWith("." + apex)
  #   foreign-tls-host     in-apex rule host, but a spec.tls[].hosts[] entry
  #                        under the root apex — the tls branch denies on its own
  #   wildcard-matches-apex *.<root-parent> is "outside" the root apex by a
  #                        plain string test, but at ingress-nginx it also
  #                        matches the bare root apex; the outside-root path is
  #                        gated on the host not being a wildcard
  - name: foreign-and-adjacent-hosts-denied
    try:
    - script:
        content: |
          set -eu
          ns="$NAMESPACE"
          apex=$(kubectl get namespace "$ns" -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          root=$(kubectl get namespace tenant-root -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$apex" ] || { echo "SETUP FAILURE: $ns lacks the namespace.cozystack.io/host label" >&2; exit 1; }
          [ -n "$root" ] || { echo "SETUP FAILURE: tenant-root lacks the namespace.cozystack.io/host label" >&2; exit 1; }
          [ "$apex" != "$root" ] || { echo "SETUP FAILURE: tenant apex equals root apex; under-root-outside-own cases are undefined" >&2; exit 1; }
          # deny <case> <ingress-name> <extra-grep|""> reads a manifest on
          # stdin and expects admission to reject it with a VAP message.
          deny() {
            kubectl -n "$ns" delete ingress "$2" --ignore-not-found >/dev/null
            out=$(kubectl apply -n "$ns" -f - 2>&1) && rc=0 || rc=$?
            echo "case=$1 rc=$rc"
            if [ "$rc" -eq 0 ]; then
              kubectl -n "$ns" delete ingress "$2" --ignore-not-found
              echo "BUG: admission accepted $1: $out" >&2
              exit 1
            fi
            echo "$out" | grep -qi "ValidatingAdmissionPolicy"
            [ -z "$3" ] || echo "$out" | grep -qi "$3"
          }
          deny foreign-apex-host ingress-out-of-apex-host-probe "must be within" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-out-of-apex-host-probe
          spec:
            rules:
            - host: "dashboard.${root}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          deny prefix-adjacent ingress-prefix-adjacent-probe "" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-prefix-adjacent-probe
          spec:
            rules:
            - host: "evil${apex}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          deny foreign-tls-host ingress-tls-out-of-apex-probe "must be within" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-tls-out-of-apex-probe
          spec:
            tls:
            - hosts:
              - "harbor.${root}"
              secretName: noop-tls
            rules:
            - host: "harbor.${apex}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          case "$root" in
            *.*) w="*.${root#*.}" ;;
            *)   w="*.${root}" ;;
          esac
          deny wildcard-matches-apex ingress-wildcard-host-probe "" <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-wildcard-host-probe
          spec:
            rules:
            - host: "${w}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
        check:
          ($error == null): true
  # Static rejects — catch-all shapes on the shared ingress-nginx:
  #   hostless        a rule with no .host matches all inbound HTTP
  #   empty-host      host: "" is the same catch-all; the CEL denies it via
  #                   r.host != "" (or has(r.host) if the apiserver drops it)
  #   defaultBackend  catch-all for otherwise-unmatched traffic
  - name: catch-all-shapes-denied
    try:
    - script:
        content: |
          set -eu
          ns="$NAMESPACE"
          deny() {
            kubectl -n "$ns" delete ingress "$2" --ignore-not-found >/dev/null
            out=$(kubectl apply -n "$ns" -f - 2>&1) && rc=0 || rc=$?
            echo "case=$1 rc=$rc"
            if [ "$rc" -eq 0 ]; then
              kubectl -n "$ns" delete ingress "$2" --ignore-not-found
              echo "BUG: admission accepted $1: $out" >&2
              exit 1
            fi
            echo "$out" | grep -qi "ValidatingAdmissionPolicy"
          }
          deny hostless-rule ingress-hostless-probe <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-hostless-probe
          spec:
            rules:
            - http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          deny empty-host ingress-empty-host-probe <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-empty-host-probe
          spec:
            rules:
            - host: ""
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          deny default-backend ingress-defaultbackend-probe <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-defaultbackend-probe
          spec:
            defaultBackend:
              service:
                name: noop
                port:
                  number: 80
          EOF
        check:
          ($error == null): true
  # Inverse sanity checks under the tenant's own apex: an in-apex rule+tls
  # Ingress and a wildcard under the own apex (*.<apex>) must NOT be rejected
  # — the anti-wildcard gate applies only to the outside-root path. Created
  # inside the script (they need ${apex} interpolation), so also deleted here.
  - name: own-apex-allowed
    try:
    - script:
        content: |
          set -eu
          ns="$NAMESPACE"
          apex=$(kubectl get namespace "$ns" -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$apex" ] || { echo "SETUP FAILURE: $ns lacks the namespace.cozystack.io/host label" >&2; exit 1; }
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-hostname-allow-probe
          spec:
            tls:
            - hosts:
              - "harbor.${apex}"
              secretName: noop-tls
            rules:
            - host: "harbor.${apex}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          kubectl -n "$ns" delete ingress ingress-hostname-allow-probe --ignore-not-found
          kubectl apply -n "$ns" -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-ownapex-wildcard-probe
          spec:
            rules:
            - host: "*.${apex}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          kubectl -n "$ns" delete ingress ingress-ownapex-wildcard-probe --ignore-not-found
        check:
          ($error == null): true
  # Case-insensitivity. spec.rules[].host and spec.tls[].hosts[] are always
  # lowercase — the apiserver's host validation permits only lowercase, so an
  # uppercase host is rejected before the VAP runs — but the apex operand is the
  # namespace.cozystack.io/host label VALUE, and Kubernetes permits uppercase in
  # a label value. Under a mixed-case apex a lowercase in-apex Ingress must
  # still be admitted, so the VAP normalizes both operands with .lowerAscii().
  # Ingress is the default publish path and carries the most complex CEL (a
  # rule-host and a tls-host branch), so it gets its own runtime guard beside
  # the route one; both branches are exercised at once because the tls branch
  # denies on its own.
  #
  # The probe apex is derived as Case-Probe.<root> rather than hardcoded, and it
  # has to sit UNDER the platform root to mean anything: the outside-root branch
  # admits any non-wildcard host outside the root apex whatever the tenant apex
  # says, so a probe on an unrelated domain would be admitted pre-fix and prove
  # nothing. Under the root that escape is closed — pre-fix the own-apex branch
  # misses on case and the outside-root branch is excluded, so admission denies
  # and this step is red; post-fix the own-apex branch matches and it is green.
  #
  # The mixed-case apex goes on a throwaway tenant-* namespace rather than on
  # tenant-test, for the same reason as the route case. Built in a script since
  # it needs ${root} interpolation, so the namespace is torn down in finally
  # rather than by Chainsaw auto-cleanup. That teardown is also why the allow and
  # deny halves share ONE step here while the route case splits them in two:
  # finally runs at step scope, so a second step would find the namespace gone.
  # The route namespace is applied declaratively and reclaimed at test scope, so
  # it survives into its own deny step.
  - name: mixed-case-apex-allowed-and-denied
    try:
    - script:
        content: |
          set -eu
          root=$(kubectl get namespace tenant-root -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$root" ] || { echo "SETUP FAILURE: tenant-root lacks the namespace.cozystack.io/host label" >&2; exit 1; }
          apex="Case-Probe.${root}"
          host="probe.case-probe.${root}"
          # Guard against a vacuous pass: the probe apex must really be
          # mixed-case. An all-lowercase apex would admit the Ingress with or
          # without the fix — this catches a later edit that lowercases the
          # literal above, which the persisted-label check below cannot see.
          [ "$apex" != "$(echo "$apex" | tr '[:upper:]' '[:lower:]')" ] || { echo "SETUP FAILURE: probe apex '$apex' is not mixed-case" >&2; exit 1; }
          # Pre-clean a namespace left behind by an interrupted prior run.
          kubectl delete namespace tenant-ingress-case-probe --ignore-not-found --wait=true --timeout=60s
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tenant-ingress-case-probe
            labels:
              namespace.cozystack.io/host: ${apex}
          EOF
          # Second vacuous-pass guard: re-read the persisted label, in case
          # anything normalized the value on the way in.
          got=$(kubectl get namespace tenant-ingress-case-probe -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ "$got" = "$apex" ] || { echo "SETUP FAILURE: apex label persisted as '$got', want '$apex'" >&2; exit 1; }
          kubectl apply -n tenant-ingress-case-probe -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-hostname-case-probe
          spec:
            tls:
            - hosts:
              - "${host}"
              secretName: noop-tls
            rules:
            - host: "${host}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          # The deny half, pairing with the allow above the way
          # foreign-and-adjacent-hosts-denied pairs with own-apex-allowed. The
          # allow half alone only proves the normalized match does not
          # UNDER-admit; over-admission is what hijacks a hostname, and
          # normalizing both operands is exactly the edit that can widen a match
          # by accident.
          deny() {
            kubectl -n tenant-ingress-case-probe delete ingress "$2" --ignore-not-found >/dev/null
            out=$(kubectl apply -n tenant-ingress-case-probe -f - 2>&1) && rc=0 || rc=$?
            echo "case=$1 rc=$rc"
            if [ "$rc" -eq 0 ]; then
              kubectl -n tenant-ingress-case-probe delete ingress "$2" --ignore-not-found
              echo "BUG: admission accepted $1: $out" >&2
              exit 1
            fi
            echo "$out" | grep -qi "ValidatingAdmissionPolicy"
          }
          # Under the platform root but outside the probe's own apex: the
          # own-apex branch must miss on more than case, and the outside-root
          # branch must stay closed under the root.
          deny foreign-apex-host ingress-case-foreign-probe <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-case-foreign-probe
          spec:
            rules:
            - host: "dashboard.${root}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          # Dot-boundary guard on the normalized path: "evilcase-probe.<root>"
          # ends with the lowercased apex "case-probe.<root>" without being a
          # subdomain of it. Only endsWith("." + apex) denies it; drop that
          # leading dot and the apex is hijackable.
          deny prefix-adjacent ingress-case-adjacent-probe <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ingress-case-adjacent-probe
          spec:
            rules:
            - host: "evilcase-probe.${root}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
        check:
          ($error == null): true
    finally:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: tenant-ingress-case-probe
  # Static accepts — concrete external domains outside the platform root apex
  # on both spec.rules[].host and spec.tls[].hosts. Declarative apply; Chainsaw
  # auto-cleanup deletes the probes.
  - name: external-domain-allowed
    try:
    - apply:
        file: ingress-external-allow.yaml
---
# Regression for #3983, which reported fail-closed admission webhooks becoming
# unreachable from the API server while an unrelated namespace was deleted. The
# mechanism is NOT confirmed: the errno in that report cannot come from a policy
# denial, and namespace deletion churns service backends as well as Cilium
# identities. So this case asserts the property the issue is about -- both
# webhooks still admit across a namespace deletion -- rather than claiming to
# reproduce a cause. Both affected paths are exercised immediately after the
# deletion, with no retry to hide a window.
#
# Every apply in this test passes through both fail-closed webhooks, so a
# cluster whose webhooks were ALREADY down fails here in a way that reads
# exactly like the outage under test. The first run of this case did precisely
# that: the ingress-nginx controller was crash-looping, the admission Service
# had no ready backend, and the setup apply died with "dial tcp ...: no route to
# host" before any churn happened. So availability is asserted before the churn
# as a precondition with its own message, and the churn verdict is only reached
# once both webhooks are known to have been up to begin with.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: admission-webhooks-survive-namespace-churn
spec:
  catch:
  - events: {}
  steps:
  - name: ingress-and-pod-admission-remain-available-after-deletion
    try:
    - script:
        # Above the sum of the inner budgets, per the rule in
        # hack/e2e-chainsaw/.chainsaw.yaml: 2x90s of webhook preconditions, 60s
        # of pre-clean delete, 90s waiting for the churn pod, 180s for the
        # namespace delete = 510s, and timeouts.exec would otherwise cap the
        # whole script at 5m and SIGKILL it with no verdict.
        timeout: 12m
        content: |
          set -eu
          ns="$NAMESPACE"
          churn_ns=tenant-admission-churn-probe
          apex=$(kubectl get namespace "$ns" -o jsonpath='{.metadata.labels.namespace\.cozystack\.io/host}')
          [ -n "$apex" ] || { echo "SETUP FAILURE: $ns lacks the namespace.cozystack.io/host label" >&2; exit 1; }

          # Coordinates come from the webhook registrations themselves, which is
          # what the API server dials, rather than from a guessed release name or
          # namespace. A webhook that is not registered at all is a setup
          # failure: nothing below could then prove anything about it.
          webhook_services() {
            kubectl get "$1" \
              -o jsonpath='{range .items[*]}{range .webhooks[*]}{.name}{" "}{.clientConfig.service.namespace}{" "}{.clientConfig.service.name}{"\n"}{end}{end}'
          }

          # Ready endpoint addresses behind a Service. Counted from
          # EndpointSlice .endpoints[].conditions.ready rather than from pod
          # readiness, because that is the state the API server routes on, and
          # because a `kubectl wait --for=condition=Ready` is satisfied
          # transiently by a pod that is flapping.
          ready_backends() {
            n=$(kubectl -n "$1" get endpointslice -l "kubernetes.io/service-name=$2" \
              -o jsonpath='{range .items[*]}{range .endpoints[*]}{.conditions.ready}{"\n"}{end}{end}' \
              2>/dev/null | grep -c '^true$' || true)
            [ -n "$n" ] || n=0
            echo "$n"
          }

          # Distinct variable names from require_webhook_up below, deliberately:
          # POSIX shell functions share one scope, so reusing `label` here
          # appended each iteration's suffix to the caller's own copy and the
          # second registration reported itself as "(1/2) (2/2)".
          require_service_up() {
            svclabel="$1"; svcns="$2"; svcname="$3"; svcbudget="$4"
            svcdeadline=$(( $(date +%s) + svcbudget ))
            while :; do
              n=$(ready_backends "$svcns" "$svcname")
              if [ "$n" -gt 0 ]; then
                echo "PRECONDITION OK  $svclabel ($svcns/$svcname) has $n ready backend(s)"
                return 0
              fi
              [ "$(date +%s)" -lt "$svcdeadline" ] || break
              sleep 5
            done
            echo "SETUP FAILURE: $svclabel ($svcns/$svcname) has no ready backend after ${svcbudget}s." >&2
            echo "  This test cannot tell a churn-induced outage from a webhook that was" >&2
            echo "  already down, and every apply below goes through it, so it stops here" >&2
            echo "  rather than reporting the wrong cause." >&2
            kubectl -n "$svcns" get endpointslice -l "kubernetes.io/service-name=$svcname" -o yaml >&2 2>&1 || true
            kubectl -n "$svcns" get pods -o wide >&2 2>&1 || true
            return 1
          }

          # EVERY registration of the named webhook, not just the first. All of
          # them fire on the applies below, so one being down aborts the apply
          # and the failure would be reported as a churn-induced outage. The
          # loop indexes with sed rather than piping into `while read`, because
          # a pipeline's body runs in a subshell under dash and a `return` from
          # it would not reach this function.
          require_webhook_up() {
            label="$1"; kind="$2"; hook="$3"; budget="$4"
            coords=$(webhook_services "$kind" | awk -v h="$hook" '$1 == h { print $2, $3 }')
            [ -n "$coords" ] || {
              echo "SETUP FAILURE: no $kind registers webhook $hook, so its availability cannot be asserted" >&2
              return 1
            }
            total=$(printf '%s\n' "$coords" | grep -c . || true)
            [ -n "$total" ] || total=0
            i=0
            while [ "$i" -lt "$total" ]; do
              i=$(( i + 1 ))
              line=$(printf '%s\n' "$coords" | sed -n "${i}p")
              require_service_up "$label ($i/$total)" "${line% *}" "${line#* }" "$budget" || return 1
            done
            return 0
          }

          require_webhook_up "ingress admission" validatingwebhookconfigurations \
            validate.nginx.ingress.kubernetes.io 90
          require_webhook_up "pod admission" mutatingwebhookconfigurations \
            kube-ovn-webhook.cozystack.io 90

          # Reproduce the incident shape: an ordinary tenant namespace carrying
          # an admitted Ingress AND a running pod, deleted synchronously, with
          # the fail-closed webhooks invoked while Cilium processes the removal.
          #
          # The pod is what makes this a churn test rather than a smoke test. A
          # Cilium identity is the set of an endpoint's identity-relevant
          # labels, and k8s:io.kubernetes.pod.namespace is one of them, so a pod
          # in a brand-new namespace allocates a NEW identity, and deleting the
          # namespace releases it. An empty namespace has no endpoint, allocates
          # no identity, and its deletion drives no identity churn at all, so
          # without the pod this case would exercise nothing it names.
          kubectl delete namespace "$churn_ns" --ignore-not-found --wait=true --timeout=60s
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${churn_ns}
            labels:
              namespace.cozystack.io/host: churn.${apex}
          EOF
          kubectl apply -n "$churn_ns" -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: admission-churn-source
          spec:
            rules:
            - host: probe.churn.${apex}
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF
          # busybox:musl is staged onto every node by hack/e2e-prepull-images.sh,
          # so this adds no image pull. The securityContext satisfies the
          # restricted PodSecurity profile, so it runs whatever level the tenant
          # namespace enforces.
          kubectl apply -n "$churn_ns" -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: admission-churn-identity
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: hold
              image: busybox:musl
              command: ["sleep", "600"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          EOF
          kubectl -n "$churn_ns" wait --for=condition=Ready pod/admission-churn-identity --timeout=90s || {
            echo "SETUP FAILURE: the churn pod never became Ready, so deleting $churn_ns releases no Cilium identity and this test would assert nothing" >&2
            kubectl -n "$churn_ns" describe pod admission-churn-identity >&2 2>&1 || true
            exit 1
          }

          kubectl delete namespace "$churn_ns" --wait=true --timeout=180s

          # No retry on either call: a retry would paper over exactly the window
          # this test exists to catch.
          #
          # ingress-nginx validating admission
          kubectl apply --dry-run=server -n "$ns" -o name -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: admission-after-churn
          spec:
            rules:
            - host: admission-after-churn.${apex}
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        number: 80
          EOF

          # kubeovn-webhook mutating admission. The securityContext is carried
          # even though a server dry-run Pod is never scheduled: if the tenant
          # namespace ever enforces restricted PodSecurity, a non-compliant Pod
          # is rejected in the validating phase and `set -eu` would abort this
          # check, which reads as the webhook being down.
          kubectl apply --dry-run=server -n "$ns" -o name -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: admission-after-churn
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: pause
              image: registry.k8s.io/pause:3.10
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          EOF
          echo "OK   both fail-closed webhooks admitted after $churn_ns was deleted"
        check:
          ($error == null): true
    finally:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: tenant-admission-churn-probe
---
# Companion to admission-webhooks-survive-namespace-churn above. That test
# proves the webhooks stay AVAILABLE; this one proves they are still
# UNREACHABLE from pods, which is the property the policies exist for, and that
# the deny is scoped to the webhook port alone.
#
# The third assertion is the one that earns this test. The policies previously
# expressed the Service-frontend deny with `toServices`, which Cilium resolves
# only inside ALLOW rules -- leaving the deny rule with an empty L3 selector
# that Cilium reads as a wildcard, so "deny this Service on 443" became "deny
# EVERY destination on 443" for every selected pod. Every rendered-YAML
# assertion in the package suites passed on that policy. Only a probe that
# checks an unrelated 443 destination still works can tell the two apart, and
# the ingress controller's own HTTPS port is exactly that: the same pods, the
# same tenant egress allowances, a different port.
#
# Runs in tenant-root because that is where the host cluster's ingress-nginx
# lives and where pods are permitted to reach it (allow-internal-communication),
# so the deny is the only thing that can block the webhook port. From the
# isolated tenant-test the probe would pass for the wrong reason.
#
# And "for the wrong reason" is the whole difficulty, because a refused connect
# does not say why it was refused. "Denied by policy" and "no backend to route
# to" are the same observation from inside the probe, so both deny assertions
# would report success against a cluster with no policy installed at all, as
# long as the backend was dead. That is what the first run of this case did:
# the controller was crash-looping on a ~100s cycle, `kubectl wait` caught it
# during a Ready window, the probe then measured a corpse, and the port-scoping
# assertion reported a policy bug that did not exist.
#
# So the deny verdicts here are gated on the admission Service having ready
# backends before the probe, on every sample while it runs, and after it
# finishes, and on the controller pods not having restarted or been replaced
# across that window. The probe itself only reports reachable/unreachable per
# destination and always exits 0; this script attributes the cause, because it
# is the half that holds the endpoint evidence. Anything that leaves the
# question undecidable fails as a setup failure rather than as a verdict.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: admission-webhook-deny-still-enforced
spec:
  namespace: tenant-root
  catch:
  - events: {}
  steps:
  - name: pods-cannot-reach-the-webhook-but-keep-unrelated-443-egress
    try:
    - script:
        # Above the sum of the inner budgets, per the rule in
        # hack/e2e-chainsaw/.chainsaw.yaml: 120s of endpoint precondition, 30s
        # of stability sampling, 60s to clear a leftover probe and 180s of
        # phase polling = 390s. The previous 6m sat BELOW its own sum, so a
        # slow-but-healthy cluster was killed before the diagnostics ran.
        timeout: 10m
        content: |
          set -eu
          ns="$NAMESPACE"
          probe=admission-deny-probe
          sel=app.kubernetes.io/name=ingress-nginx,app.kubernetes.io/component=controller

          svcs=$(kubectl -n "$ns" get svc -l "$sel" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          adm=$(printf '%s\n' "$svcs" | grep -- '-admission$' | head -1 || true)
          # -metrics is excluded explicitly rather than relying on
          # ingress-nginx-controller sorting before ingress-nginx-controller-metrics
          # under head -1: the positive control has to be the Service that
          # actually exposes the controller's https port.
          ctl=$(printf '%s\n' "$svcs" | grep -v -- '-admission$' | grep -v -- '-metrics$' | grep . | head -1 || true)
          [ -n "$adm" ] || { echo "SETUP FAILURE: no ingress-nginx admission Service in $ns" >&2; exit 1; }
          [ -n "$ctl" ] || { echo "SETUP FAILURE: no ingress-nginx controller Service in $ns" >&2; exit 1; }

          adm_port=$(kubectl -n "$ns" get svc "$adm" -o jsonpath='{.spec.ports[0].port}')
          ctl_port=$(kubectl -n "$ns" get svc "$ctl" -o jsonpath='{.spec.ports[?(@.name=="https")].port}')
          [ -n "$ctl_port" ] || { echo "SETUP FAILURE: $ctl exposes no https port" >&2; exit 1; }

          # Ready endpoint addresses behind a Service, from EndpointSlice rather
          # than from pod readiness: this is the state the API server and the
          # service load balancer route on.
          ready_backends() {
            n=$(kubectl -n "$ns" get endpointslice -l "kubernetes.io/service-name=$1" \
              -o jsonpath='{range .items[*]}{range .endpoints[*]}{.conditions.ready}{"\n"}{end}{end}' \
              2>/dev/null | grep -c '^true$' || true)
            [ -n "$n" ] || n=0
            echo "$n"
          }

          # Pod identity plus restart count, as one string. Compared for
          # equality across the probe window, so a restart AND a replacement
          # both show up -- a crash-looping controller can satisfy a readiness
          # check at both ends of a window it spent dying in the middle of.
          controller_generation() {
            kubectl -n "$ns" get pod -l "$sel" \
              -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount}{" "}{end}'
          }

          # Precondition. Both Services are backed by the same controller pods,
          # so requiring the admission Service to be live also establishes that
          # the controller Service -- the positive control below -- has a
          # backend to answer.
          deadline=$(( $(date +%s) + 120 ))
          while :; do
            adm_ready=$(ready_backends "$adm")
            ctl_ready=$(ready_backends "$ctl")
            if [ "$adm_ready" -gt 0 ] && [ "$ctl_ready" -gt 0 ]; then break; fi
            [ "$(date +%s)" -lt "$deadline" ] || {
              echo "SETUP FAILURE: no ready backend for $adm ($adm_ready) or $ctl ($ctl_ready) after 120s." >&2
              echo "  A refused connect cannot be attributed to policy while the destination" >&2
              echo "  has nothing listening, so this test stops instead of reporting a deny" >&2
              echo "  it did not observe." >&2
              kubectl -n "$ns" get endpointslice -l "kubernetes.io/service-name=$adm" -o yaml >&2 2>&1 || true
              kubectl -n "$ns" get pod -l "$sel" -o wide >&2 2>&1 || true
              exit 1
            }
            sleep 5
          done

          # Stability: the same evidence held across a window, not at one
          # instant. Six samples over 30s, all of which must be live and show no
          # restart or replacement.
          gen_before=$(controller_generation)
          i=0
          while [ "$i" -lt 6 ]; do
            sleep 5
            i=$(( i + 1 ))
            n=$(ready_backends "$adm")
            [ "$n" -gt 0 ] || {
              echo "SETUP FAILURE: $adm lost its ready backend during the stability window (sample $i)" >&2
              kubectl -n "$ns" get pod -l "$sel" -o wide >&2 2>&1 || true
              exit 1
            }
          done
          gen_stable=$(controller_generation)
          [ "$gen_stable" = "$gen_before" ] || {
            echo "SETUP FAILURE: the ingress-nginx controller restarted or was replaced during the stability window" >&2
            echo "  before: $gen_before" >&2
            echo "  after:  $gen_stable" >&2
            kubectl -n "$ns" get pod -l "$sel" -o wide >&2 2>&1 || true
            exit 1
          }

          pod_ip=$(kubectl -n "$ns" get pod -l "$sel" \
            -o jsonpath='{.items[0].status.podIP}')
          hook_port=$(kubectl -n "$ns" get pod -l "$sel" \
            -o jsonpath='{.items[0].spec.containers[0].ports[?(@.name=="webhook")].containerPort}')
          [ -n "$pod_ip" ] || { echo "SETUP FAILURE: no controller Pod IP in $ns" >&2; exit 1; }
          [ -n "$hook_port" ] || { echo "SETUP FAILURE: controller declares no webhook port" >&2; exit 1; }

          echo "probing from $ns: expect reachable ${ctl}:${ctl_port}, denied ${adm}:${adm_port}, denied ${pod_ip}:${hook_port}"

          kubectl -n "$ns" delete pod "$probe" --ignore-not-found --wait=true --timeout=60s
          # busybox:musl is staged onto every node by hack/e2e-prepull-images.sh,
          # so this adds no image pull. The securityContext satisfies the
          # restricted PodSecurity profile, so the probe runs in a tenant
          # namespace whatever level is enforced there.
          kubectl -n "$ns" apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${probe}
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: probe
              image: busybox:musl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
              - name: CTL_HOST
                value: "${ctl}.${ns}.svc"
              - name: CTL_PORT
                value: "${ctl_port}"
              - name: ADM_HOST
                value: "${adm}.${ns}.svc"
              - name: ADM_PORT
                value: "${adm_port}"
              - name: POD_IP
                value: "${pod_ip}"
              - name: HOOK_PORT
                value: "${hook_port}"
              command: ["sh", "-c"]
              args:
              # Measurement only, and always exit 0. The pod reports what it
              # observed per destination; the script that started it holds the
              # endpoint evidence and is the only place that can say why a
              # connect was refused. Keeping the verdict out of here is also
              # what stops "the probe could not run" from being read as "the
              # assertion failed".
              - |
                set -u
                reach() { nc -w 5 "\$1" "\$2" </dev/null >/dev/null 2>&1; }
                report() {
                  if reach "\$2" "\$3"; then
                    echo "\$1 reachable \$2:\$3"
                  else
                    echo "\$1 unreachable \$2:\$3"
                  fi
                }
                report CTL "\$CTL_HOST" "\$CTL_PORT"
                report ADM "\$ADM_HOST" "\$ADM_PORT"
                report HOOK "\$POD_IP" "\$HOOK_PORT"
          EOF

          # Wait for a terminal phase rather than a condition, and re-check the
          # backend on every poll: a controller that dies mid-probe invalidates
          # the deny verdicts, and this is the window it would die in.
          deadline=$(( $(date +%s) + 180 ))
          phase=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$(ready_backends "$adm")
            [ "$n" -gt 0 ] || {
              echo "SETUP FAILURE: $adm lost its ready backend while the probe was running, so an unreachable webhook proves nothing" >&2
              kubectl -n "$ns" get pod -l "$sel" -o wide >&2 2>&1 || true
              kubectl -n "$ns" logs "$probe" >&2 2>&1 || true
              exit 1
            }
            phase=$(kubectl -n "$ns" get pod "$probe" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 3
          done

          log=$(kubectl -n "$ns" logs "$probe" 2>&1 || true)
          printf '%s\n' "$log"

          # Postcondition, before the log is interpreted at all.
          [ "$phase" = "Succeeded" ] || {
            echo "SETUP FAILURE: the probe did not run to completion (phase=${phase:-unknown})" >&2
            kubectl -n "$ns" describe pod "$probe" >&2 2>&1 || true
            exit 1
          }
          gen_after=$(controller_generation)
          [ "$gen_after" = "$gen_before" ] || {
            echo "SETUP FAILURE: the ingress-nginx controller restarted or was replaced during the probe" >&2
            echo "  before: $gen_before" >&2
            echo "  after:  $gen_after" >&2
            kubectl -n "$ns" get pod -l "$sel" -o wide >&2 2>&1 || true
            exit 1
          }
          n=$(ready_backends "$adm")
          [ "$n" -gt 0 ] || {
            echo "SETUP FAILURE: $adm has no ready backend after the probe, so its unreachability proves nothing" >&2
            exit 1
          }

          verdict() { printf '%s\n' "$log" | awk -v k="$1" '$1 == k { print $2; exit }'; }
          ctl_seen=$(verdict CTL)
          adm_seen=$(verdict ADM)
          hook_seen=$(verdict HOOK)
          for v in "$ctl_seen" "$adm_seen" "$hook_seen"; do
            [ -n "$v" ] || {
              echo "SETUP FAILURE: the probe did not report all three destinations" >&2
              exit 1
            }
          done

          # From here every branch is a real verdict: the destination had a live
          # backend before, throughout and after, on pods that neither restarted
          # nor were replaced.
          rc=0
          if [ "$ctl_seen" = reachable ]; then
            echo "OK   unrelated 443 egress works (${ctl}:${ctl_port})"
          else
            echo "BUG  unrelated 443 egress DENIED to a live backend (${ctl}:${ctl_port}) -- the webhook deny is not scoped to the webhook port" >&2
            rc=1
          fi
          if [ "$adm_seen" = unreachable ]; then
            echo "OK   webhook denied through its Service ClusterIP"
          else
            echo "BUG  webhook reachable through its Service ClusterIP (${adm}:${adm_port})" >&2
            rc=1
          fi
          if [ "$hook_seen" = unreachable ]; then
            echo "OK   webhook denied on its backend port"
          else
            echo "BUG  webhook reachable directly on its backend port (${pod_ip}:${hook_port})" >&2
            rc=1
          fi
          exit "$rc"
        check:
          ($error == null): true
    finally:
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: admission-deny-probe
