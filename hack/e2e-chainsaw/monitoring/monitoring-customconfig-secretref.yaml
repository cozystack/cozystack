# Chainsaw applies to an existing object as a JSON merge patch, so a key left
# out of this file keeps the value the inline step gave it. The inline config
# and the users list therefore have to be cleared explicitly: the chart fails
# the render on config together with secretRef (assertCustomConfigXor), and on
# users together with secretRef (assertCustomSecretRefUsersEmpty). null deletes
# the map; an empty map would merge into it and change nothing.
apiVersion: v1
kind: Secret
metadata:
  name: mon-oidc-byo-oauth
stringData:
  auth.ini: |
    [auth.generic_oauth]
    enabled = true
    name = ByoIdp
    client_id = byo-monitoring
    client_secret = byo-secret
---
apiVersion: apps.cozystack.io/v1alpha1
kind: Monitoring
metadata:
  name: monitoring
spec:
  host: ""
  metricsStorages:
  - name: shortterm
    retentionPeriod: "3d"
    deduplicationInterval: "15s"
    storage: 10Gi
    storageClassName: ""
  vmagent:
    remoteWrite:
      urls:
      - http://vminsert-shortterm:8480/insert/0/prometheus
  logsStorages:
  - name: generic
    retentionPeriod: "1"
    storage: 10Gi
    storageClassName: ""
  oidc:
    mode: CustomConfig
    customConfig:
      config: null
      secretRef:
        name: mon-oidc-byo-oauth
    users: []
