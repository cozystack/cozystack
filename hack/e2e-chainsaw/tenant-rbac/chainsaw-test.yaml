# A tenant super-admin must not be able to write the raw kubevirt.io
# VirtualMachine object. A tenant's VM size, and the ResourceQuota it counts
# against, are set and enforced only on the apps.cozystack.io wrapper
# (vm-instance); VM power runs through the subresources.kubevirt.io verbs at
# cozy:tenant:use:base. A write grant on the raw object let a super-admin create
# an unsized VM, or resize a chart-rendered one, straight past that wrapper and
# unseen by every gate and quota. Such a '*' arrived with helmreleases in #516,
# outlived the helmreleases removal, and was dropped from
# cozy:tenant:super-admin:base; this is its end-to-end guard.
#
# The checks are pure SelfSubjectAccessReviews (`kubectl auth can-i` under
# impersonation): no object is applied, so there is nothing to converge on and
# nothing for the leak guard to charge to this suite. The helm-unittest in
# packages/system/cozystack-basics pins the rendered rule; this asserts the
# effective, aggregated permission a real tenant super-admin resolves to on a
# live cluster, which no template test can reach.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-super-admin-raw-vm-rbac
spec:
  steps:
  - name: raw-vm-write-denied-app-vm-allowed
    try:
    - script:
        timeout: 2m
        content: |
          set -eu
          ns=tenant-test
          # Impersonate the tenant's own super-admin group. kubectl requires
          # --as with --as-group, so the user is an arbitrary unbound name; only
          # the group carries the grant. system:authenticated mirrors a real
          # authenticated request, as the computeplane suite does.
          as="--as=e2e-tenant-rbac-probe --as-group=system:authenticated --as-group=${ns}-super-admin"
          rc=0
          # can-i exits 1 when it answers "no", so the answer is read from its
          # output under `|| true`; anything but the exact expected word fails,
          # an error string included.
          want() {
            verb=$1; res=$2; expect=$3
            got=$(timeout -k 5 30 kubectl -n "$ns" auth can-i "$verb" "$res" $as 2>/dev/null) || true
            echo "can-i $verb $res as ${ns}-super-admin: ${got:-<empty>} (want $expect)"
            if [ "$got" != "$expect" ]; then
              echo "  UNEXPECTED: $verb $res = '${got:-<empty>}', want '$expect'" >&2
              rc=1
            fi
          }
          # The hole: raw kubevirt VM writes must be denied. create is the
          # unsized VM; update/patch are resizing a chart-rendered one; delete
          # rounds out write.
          want create virtualmachines.kubevirt.io no
          want update virtualmachines.kubevirt.io no
          want patch  virtualmachines.kubevirt.io no
          want delete virtualmachines.kubevirt.io no
          # Read of raw VMs stays (cozy:tenant:admin:base get/list): the
          # dashboard renders VM status from it.
          want get  virtualmachines.kubevirt.io yes
          want list virtualmachines.kubevirt.io yes
          # The supported path is unaffected: the apps.cozystack.io wrapper the
          # gates and quota actually see.
          want create virtualmachines.apps.cozystack.io yes
          exit "$rc"
        check:
          ($error == null): true
