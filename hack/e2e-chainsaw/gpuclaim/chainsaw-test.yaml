# GPUClaim ordering, budgets, VM attachment, usage records and teardown,
# against a fake extended resource: CI has no GPUs. hack/e2e-platform-packages.sh
# enables gpu-operator, which turns on cozystack-controller's GPU paths, and
# permits nvidia.com/E2E_FAKE_GPU in KubeVirt as an external provider. This
# suite advertises two units of it on one node and points a class at them.
#
# No device plugin serves the fake name, so virt-handler finds no device to
# hand the guest and the VMI never syncs. The VM checks therefore stop at what
# admission, the controller and the scheduler decide: the claims attached to
# the VMI, its gpus entries, and the launcher pod held at its scheduling gate
# while a claim waits, then released onto the claims' node. Guest state is
# not asserted.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gpuclaim
spec:
  catch:
  - events: {}
  - events:
      namespace: tenant-test-gpua
  - events:
      namespace: tenant-test-gpub
  - describe:
      apiVersion: gpu.cozystack.io/v1alpha1
      kind: GPUClass
      name: e2e-fake
  - describe:
      apiVersion: gpu.cozystack.io/v1alpha1
      kind: GPUClaim
      namespace: tenant-test-gpua
  - describe:
      apiVersion: gpu.cozystack.io/v1alpha1
      kind: GPUClaim
      namespace: tenant-test-gpub
  - describe:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachineInstance
      namespace: tenant-test-gpua
  - describe:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachineInstance
      namespace: tenant-test-gpub
  - describe:
      apiVersion: v1
      kind: Pod
      namespace: tenant-test-gpua
      selector: kubevirt.io=virt-launcher
  - describe:
      apiVersion: v1
      kind: Pod
      namespace: tenant-test-gpub
      selector: kubevirt.io=virt-launcher
  - podLogs:
      namespace: cozy-system
      selector: app=cozystack-controller
      tail: 200
  steps:
  - name: gpu-paths-are-on
    try:
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cozystack-controller
            namespace: cozy-system
          spec:
            template:
              spec:
                (containers[?name == 'cozystack-controller']):
                - (contains(args, '--enable-gpu')): true
    - assert:
        timeout: 5m
        resource:
          apiVersion: kubevirt.io/v1
          kind: KubeVirt
          metadata:
            name: kubevirt
            namespace: cozy-kubevirt
          spec:
            configuration:
              (contains(permittedHostDevices.pciHostDevices[*].resourceName, 'nvidia.com/E2E_FAKE_GPU')): true

  - name: advertise-fake-gpus
    try:
    - script:
        content: |
          set -eu
          node=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          kubectl label node "$node" e2e.cozystack.io/fake-gpu=true --overwrite
          kubectl patch node "$node" --subresource=status --type=json \
            -p '[{"op":"add","path":"/status/capacity/nvidia.com~1E2E_FAKE_GPU","value":"2"}]'
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Node
          metadata:
            labels:
              e2e.cozystack.io/fake-gpu: "true"
          status:
            allocatable:
              nvidia.com/E2E_FAKE_GPU: "2"
    # Nothing owns the node patch, so Chainsaw cannot reclaim it. The label
    # goes on first, so cleanup finds the node even if the patch failed.
    cleanup:
    - script:
        content: |
          set -eu
          # Not inside the for list, where set -e ignores a failed read.
          nodes=$(kubectl get nodes -l e2e.cozystack.io/fake-gpu=true -o jsonpath='{.items[*].metadata.name}')
          for node in $nodes; do
            if [ -n "$(kubectl get node "$node" -o jsonpath='{.status.capacity.nvidia\.com/E2E_FAKE_GPU}')" ]; then
              kubectl patch node "$node" --subresource=status --type=json \
                -p '[{"op":"remove","path":"/status/capacity/nvidia.com~1E2E_FAKE_GPU"}]'
            fi
            kubectl label node "$node" e2e.cozystack.io/fake-gpu-
          done

  - name: create-class
    try:
    - apply:
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClass
          metadata:
            name: e2e-fake
          spec:
            displayName: E2E fake GPU
            vendor: nvidia
            model: FAKE
            mode: passthrough
            maxCount: 2
            nodeSelector:
              e2e.cozystack.io/fake-gpu: "true"
            source:
              devicePlugin:
                resourceName: nvidia.com/E2E_FAKE_GPU
    - assert:
        timeout: 2m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClass
          metadata:
            name: e2e-fake
          status:
            free: 2
            (conditions[?type == 'ResourceNameNotPermitted']):
            - status: "False"

  # gpua runs two VMs at once. gpub may hold two units, so its second order
  # below is limited by capacity alone.
  - name: create-tenants
    try:
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: gpua
          spec:
            resourceQuotas:
              cpu: "4"
              memory: 16Gi
              storage: 10Gi
              gpu.cozystack.io/e2e-fake: "1"
              gpu.cozystack.io/total: "1"
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          metadata:
            name: gpub
          spec:
            resourceQuotas:
              cpu: "4"
              memory: 8Gi
              storage: 10Gi
              gpu.cozystack.io/e2e-fake: "2"
              gpu.cozystack.io/total: "2"
    # 17m: above the 15m install timeout tenant-rd gives these releases; see
    # "Sizing an HR-Ready budget" in docs/agents/e2e-testing.md.
    - assert:
        timeout: 17m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: tenant-gpua
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 17m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: tenant-gpub
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: order-binds
    try:
    - apply:
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: held
            namespace: tenant-test-gpua
          spec:
            className: e2e-fake
            count: 1
    - assert:
        timeout: 2m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: held
            namespace: tenant-test-gpua
          status:
            phase: Bound
            (nodeName != null): true

  # held is Bound in the API, and the webhook reads claims uncached.
  - name: over-budget-order-is-refused
    try:
    - script:
        content: |
          set -eu
          if out=$(kubectl create -f - 2>&1 <<EOF
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: over
            namespace: tenant-test-gpua
          spec:
            className: e2e-fake
            count: 1
          EOF
          ); then
            echo "FAIL: an order over the budget was admitted: $out"
            false
          fi
          echo "$out"
          echo "$out" | grep -F 'budget gpu.cozystack.io/e2e-fake of tenant tenant-test-gpua is 1 and 1 is in use'

  - name: vm-attaches-held-claim
    try:
    # A blank VMDisk because vm-instance renders `disks: []` as null, which
    # KubeVirt refuses.
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: blank
            namespace: tenant-test-gpua
          spec:
            source: {}
            storage: 1Gi
            storageClass: ($values.storageClass)
    # vm-instance refuses to render until the disk's DataVolume exists.
    - assert:
        timeout: 2m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-blank
            namespace: tenant-test-gpua
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMInstance
          metadata:
            name: vmheld
            namespace: tenant-test-gpua
          spec:
            runStrategy: Always
            instanceType: u1.medium
            disks:
            - name: blank
            gpus:
            - claim: held
    - assert:
        timeout: 5m
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachineInstance
          metadata:
            name: vm-instance-vmheld
            namespace: tenant-test-gpua
            labels:
              gpu.cozystack.io/claim-reference: "true"
          spec:
            domain:
              devices:
                gpus:
                - name: gpuclaim-0-0
                  deviceName: nvidia.com/E2E_FAKE_GPU
    - assert:
        timeout: 2m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: held
            namespace: tenant-test-gpua
          status:
            phase: Attached
            attachedTo:
              vmi: vm-instance-vmheld
    # The pod webhook gates the launcher and the controller pins and ungates
    # it in one update, so a node name means the gate has been lifted. The
    # temporary pod KubeVirt creates to bind a WaitForFirstConsumer disk
    # carries the same labels and is gated the same way, so it is told apart
    # by its annotation.
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: tenant-test-gpua
            labels:
              kubevirt.io: virt-launcher
              vm.kubevirt.io/name: vm-instance-vmheld
              gpu.cozystack.io/claim-reference: "true"
            (annotations."kubevirt.io/ephemeral-provisioning" == null): true
          spec:
            (nodeName != null): true
    - script:
        content: |
          set -eu
          node=$(kubectl -n tenant-test-gpua get gpuclaim held -o jsonpath='{.status.nodeName}')
          pods=$(kubectl -n tenant-test-gpua get pod -l kubevirt.io=virt-launcher,vm.kubevirt.io/name=vm-instance-vmheld -o json |
            jq '.items |= map(select(.metadata.annotations["kubevirt.io/ephemeral-provisioning"] == null))')
          echo "claim node: $node"
          printf '%s\n' "$pods" | jq '.items[] | {name: .metadata.name, nodeName: .spec.nodeName, schedulingGates: .spec.schedulingGates, required: .spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution}'
          [ -n "$node" ]
          # Every required term ends in the pin: a pin on only some of them
          # would let the scheduler pick another node through the rest.
          printf '%s\n' "$pods" | jq -e --arg node "$node" '
            (.items | length) == 1 and
            (.items[0] | .spec.nodeName == $node
              and (any(.spec.schedulingGates[]?; .name == "gpu.cozystack.io/claims") | not)
              and (.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms as $terms
                | ($terms | length) > 0
                  and all($terms[]; (.matchFields // []) | last == {key: "metadata.name", operator: "In", values: [$node]})))'

  - name: other-tenant-cannot-take-held-unit
    try:
    - apply:
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: b1
            namespace: tenant-test-gpub
          spec:
            className: e2e-fake
            count: 1
    - assert:
        timeout: 2m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: b1
            namespace: tenant-test-gpub
          status:
            phase: Bound
    # The webhook refuses on the free count the binder publishes on the
    # class, which follows the bind.
    - assert:
        timeout: 2m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClass
          metadata:
            name: e2e-fake
          status:
            free: 0
    - script:
        content: |
          set -eu
          if out=$(kubectl create -f - 2>&1 <<EOF
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: b2
            namespace: tenant-test-gpub
          spec:
            className: e2e-fake
            count: 1
          EOF
          ); then
            echo "FAIL: an order was admitted with every unit held: $out"
            false
          fi
          echo "$out"
          echo "$out" | grep -F 'cannot order 1 of GPUClass e2e-fake: the class has 0 free units'
    - assert:
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: held
            namespace: tenant-test-gpua
          status:
            phase: Attached
            attachedTo:
              vmi: vm-instance-vmheld

  # The VMI webhook leaves budgets to the controller, so a claimTemplate the
  # budget cannot cover yet is admitted and its pod waits at the gate. gpua's
  # budget of one is spent on held until the next step deletes it.
  - name: template-claim-waits-for-the-budget
    try:
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: blank-tmpl
            namespace: tenant-test-gpua
          spec:
            source: {}
            storage: 1Gi
            storageClass: ($values.storageClass)
    # vm-instance refuses to render until the disk's DataVolume exists.
    - assert:
        timeout: 2m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-blank-tmpl
            namespace: tenant-test-gpua
    - apply:
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMInstance
          metadata:
            name: vmtmpl
            namespace: tenant-test-gpua
          spec:
            runStrategy: Always
            instanceType: u1.medium
            disks:
            - name: blank-tmpl
            gpus:
            - claimTemplate:
                className: e2e-fake
                count: 1
    - assert:
        timeout: 5m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: vm-instance-vmtmpl-gpu-0
            namespace: tenant-test-gpua
            labels:
              gpu.cozystack.io/template-claim: "true"
            (ownerReferences[?kind == 'VirtualMachineInstance']):
            - apiVersion: kubevirt.io/v1
              name: vm-instance-vmtmpl
          status:
            phase: Pending
            attachedTo:
              vmi: vm-instance-vmtmpl
            (conditions[?type == 'Waiting']):
            - status: "True"
              reason: Budget
    - assert:
        timeout: 2m
        resource:
          apiVersion: events.k8s.io/v1
          kind: Event
          metadata:
            namespace: tenant-test-gpua
          regarding:
            kind: VirtualMachineInstance
            name: vm-instance-vmtmpl
          type: Warning
          reason: Budget
          action: Start
    # The launcher, or on a WaitForFirstConsumer disk the temporary pod that
    # binds it first; the webhook gates both.
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: tenant-test-gpua
            labels:
              kubevirt.io: virt-launcher
              vm.kubevirt.io/name: vm-instance-vmtmpl
          spec:
            schedulingGates:
            - name: gpu.cozystack.io/claims
            (nodeName == null): true

  - name: usage-record-is-owned-by-the-claim
    try:
    - assert:
        timeout: 2m
        resource:
          apiVersion: cozystack.io/v1alpha1
          kind: Workload
          metadata:
            name: gpu-held
            namespace: tenant-test-gpua
            (ownerReferences[?kind == 'GPUClaim']):
            - apiVersion: gpu.cozystack.io/v1alpha1
              name: held
          status:
            kind: gpu-claim
            resources:
              gpu.cozystack.io/e2e-fake: "1"
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMInstance
          name: vmheld
          namespace: tenant-test-gpua
    - assert:
        timeout: 5m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: held
            namespace: tenant-test-gpua
          status:
            phase: Bound
            (attachedTo == null): true
    - delete:
        ref:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          name: held
          namespace: tenant-test-gpua
    - error:
        timeout: 2m
        resource:
          apiVersion: cozystack.io/v1alpha1
          kind: Workload
          metadata:
            name: gpu-held
            namespace: tenant-test-gpua

  # held is gone, so the budget covers the waiting template claim: the
  # controller binds it and releases the pod.
  - name: template-claim-starts-when-the-budget-frees
    try:
    - assert:
        timeout: 5m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: vm-instance-vmtmpl-gpu-0
            namespace: tenant-test-gpua
          status:
            phase: Attached
            attachedTo:
              vmi: vm-instance-vmtmpl
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: tenant-test-gpua
            labels:
              kubevirt.io: virt-launcher
              vm.kubevirt.io/name: vm-instance-vmtmpl
            (annotations."kubevirt.io/ephemeral-provisioning" == null): true
          spec:
            (nodeName != null): true
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMInstance
          name: vmtmpl
          namespace: tenant-test-gpua
    - error:
        timeout: 5m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: vm-instance-vmtmpl-gpu-0
            namespace: tenant-test-gpua

  - name: tenant-with-held-claim-deletes
    try:
    - apply:
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: last
            namespace: tenant-test-gpua
          spec:
            className: e2e-fake
            count: 1
    - assert:
        timeout: 2m
        resource:
          apiVersion: gpu.cozystack.io/v1alpha1
          kind: GPUClaim
          metadata:
            name: last
            namespace: tenant-test-gpua
          status:
            phase: Bound
    - delete:
        ref:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: Tenant
          name: gpua
    # 10m: the tenant's helm uninstall runs first, then the namespace waits
    # for its disk PVC and the GPUClaim protection finalizer.
    - error:
        timeout: 10m
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: tenant-test-gpua
