apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rabbitmq
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: rabbitmq-test
  - describe:
      apiVersion: rabbitmq.com/v1beta1
      kind: RabbitmqCluster
      name: rabbitmq-test
  - describe:
      apiVersion: rabbitmq.com/v1beta1
      kind: User
      name: rabbitmq-test-app
  - podLogs:
      selector: app.kubernetes.io/instance=rabbitmq-test
      tail: 50
  - podLogs:
      namespace: cozy-rabbitmq-operator
      selector: app.kubernetes.io/name=messaging-topology-operator
      tail: 100
  steps:
  - name: create-rabbitmq
    try:
    - apply:
        file: rabbitmq.yaml
  - name: wait-ready
    try:
    # 11m: above the 600s install timeout cozystack-api gives this release;
    # see "Sizing an HR-Ready budget" in docs/agents/e2e-testing.md.
    - assert:
        timeout: 11m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: rabbitmq-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: RabbitMQ
          metadata:
            name: test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: rabbitmq.com/v1beta1
          kind: RabbitmqCluster
          metadata:
            name: rabbitmq-test
          status:
            (conditions[?type == 'AllReplicasReady']):
            - status: "True"
  - name: verify-workload
    try:
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: rabbitmq-test-server
          status:
            readyReplicas: 2
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: rabbitmq-test
  - name: verify-user
    try:
    # messaging-topology-operator >= 1.20 only sees credentials Secrets labelled
    # rabbitmq.com/topology-operator=true: the User reaching Ready is what
    # proves the chart's Secret passed the admission webhook and the cache.
    - assert:
        timeout: 3m
        resource:
          apiVersion: rabbitmq.com/v1beta1
          kind: User
          metadata:
            name: rabbitmq-test-app
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
