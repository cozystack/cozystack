# Honest S3 Bucket backup/restore round-trip. It drives
# examples/backups/bucket/run-all.sh as the harness so the test and the
# documented flow can never drift - the same pattern the clickhouse / mariadb /
# postgres round-trips use.
#
# The example provisions its OWN destination bucket and binds a test-scoped
# BackupClass rather than the platform cozy-default / cozy-backups, which the CI
# cluster does not provision. It runs in tenant-root (the S3 clients are the
# mirror Job and a port-forwarded sentinel client, both of which reach
# tenant-root's seaweedfs over same-tenant egress) and talks to the in-cluster
# endpoint with TLS verification skipped, because the COSI BucketInfo advertises
# the external ingress host that CI cannot route.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bucket-backup-roundtrip
spec:
  namespace: tenant-root
  # The round-trip creates its resources through the example scripts, not
  # Chainsaw `apply`, and produces controller-owned artifacts (the Backup CR,
  # the cluster-scoped Bucket strategy + BackupClass, driver-provisioned
  # BucketAccesses). Chainsaw has nothing of its own to auto-delete, so teardown
  # is the run step's finally (cleanup.sh), which is idempotent.
  skipDelete: true
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: bucket-bktsrc-system
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: bucket-bktdst-system
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: BackupJob
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: RestoreJob
  - describe:
      apiVersion: strategy.backups.cozystack.io/v1alpha1
      kind: Bucket
  - describe:
      apiVersion: objectstorage.k8s.io/v1alpha1
      kind: BucketAccess
  steps:
  - name: run
    try:
    # Pre-clean: tenant-root is a shared, persistent namespace with fixed
    # resource names, so a run killed before the finally below leaves stale
    # state. A leftover BackupJob still carrying phase=Succeeded would satisfy
    # the harness's Succeeded wait instantly and pass without a real backup.
    # cleanup.sh is idempotent (--ignore-not-found), so this is a no-op on a
    # clean namespace.
    - script:
        timeout: 5m
        content: |
          set -eu
          cd ../../..
          NAMESPACE=tenant-root examples/backups/bucket/cleanup.sh
        check:
          ($error == null): true
    # Op timeout strictly above the sum of run-all.sh's inner waits (per
    # docs/agents/e2e-testing.md): buckets ready (~300+180+120) + BackupJob 480
    # + in-place 480 + target ready (~300+180) + to-copy 480, plus the mc /
    # port-forward interleaves. 40m leaves comfortable headroom while every
    # inner wait still fails fast on a terminal phase=Failed / Stalled.
    - script:
        timeout: 40m
        content: |
          set -eu
          cd ../../..
          [ -x examples/backups/bucket/run-all.sh ] || { echo "bucket backup example scripts not found at examples/backups/bucket" >&2; exit 1; }
          NAMESPACE=tenant-root examples/backups/bucket/run-all.sh
        check:
          ($error == null): true
    finally:
    - description: backup-flow cleanup
      script:
        timeout: 5m
        content: |
          set -eu
          cd ../../..
          NAMESPACE=tenant-root examples/backups/bucket/cleanup.sh
