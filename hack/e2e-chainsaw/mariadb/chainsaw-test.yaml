# Chainsaw port of hack/e2e-apps/mariadb.bats
# ("Create DB MariaDB" + "Create single-replica MariaDB").
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mariadb
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-test
  - podLogs:
      selector: app.kubernetes.io/instance=mariadb-test
      tail: 50
  steps:
  - name: create-mariadb
    try:
    - apply:
        file: mariadb.yaml

  - name: wait-helmrelease-ready
    try:
    # 11m rather than the usual 5-6m, because this wait is not the cheap one it
    # looks like: helm-controller defaults spec.waitStrategy to `poller`, so the
    # install action waits through kstatus, and kstatus maps the operator CR's
    # Ready=False onto InProgress. Readiness here may therefore span a first
    # boot, whose startup probe alone may spend 310s -- see
    # packages/apps/mariadb/templates/mariadb.yaml -- with the artifact fetch,
    # the operator reconcile, the PVC bind and the image pull ahead of it and
    # the readiness probe behind it. 11m leaves about 350s for all of that once
    # a boot has spent its 310s. "May", because the wait can also end early:
    # see the condition-less-CR window described under the endpoint assert
    # below.
    #
    # 11m and not 10m so this assert outlives the release's own install timeout,
    # which cozystack-api sets to 10m. At equal budgets the assert expires first
    # and the failure reads as a chainsaw timeout; a minute later and the
    # HelmRelease has already recorded why its install failed.
    # hack/mariadb-first-boot-waits.bats holds this above the LARGER of the
    # startup budget and the release's own install timeout, which today is the
    # install timeout at 600s.
    #
    # The minute is headroom, not a guarantee: this assert's clock starts when
    # the step runs, the install's 600s when helm-controller begins installing,
    # after the Application is reconciled and the chart artifact fetched. A cold
    # cache can spend the margin there, and the assert then expires mid-install
    # as before -- no worse than the old number, just not always better.
    - assert:
        timeout: 11m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: mariadb-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-service-and-statefulset
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb-test
          spec:
            (ports[0].port): 3306
    # The chart hands the operator a MariaDB CR and ships no built-in workload,
    # so the release holds nothing helm itself knows how to wait for -- but the
    # wait above is not free of pods either. helm-controller leaves
    # spec.waitStrategy unset and defaults it to `poller`, so the install action
    # waits through kstatus, and kstatus maps the CR's Ready=False (reason
    # StatefulSetNotReady) onto InProgress. HelmRelease readiness may therefore
    # already span a first boot, whose startup probe alone may spend 310s (see
    # packages/apps/mariadb/templates/mariadb.yaml for why it is 310s). One
    # window covers both replicas -- mariadb-operator sets
    # PodManagementPolicy: Parallel, so they boot concurrently.
    #
    # What is left for this assert is the window kstatus cannot see. A CR that
    # has only just been applied carries no conditions at all, and kstatus reads
    # a condition-less custom resource as current, so a poll landing ahead of
    # the operator's first status write would end the wait early. An endpoint
    # address appears only once a replica has passed its startup probe and then
    # its readiness probe, which closes that window. One ready address satisfies
    # this assert, and the replicas boot concurrently anyway, so it clears one
    # startup budget plus the operator reconcile, PVC bind and image pull that
    # precede it. 10m leaves room for all of that.
    - assert:
        timeout: 10m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mariadb-test
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: mariadb-test
          status:
            replicas: 2

  - name: verify-metrics
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb-test-metrics
          spec:
            (ports[0].port): 9104
    - assert:
        timeout: 1m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mariadb-test-metrics
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mariadb-test-metrics
          status:
            replicas: 1
---
# Guard for the operator-webhook regression fixed in c7e8f4d97: replication is
# guarded on replicas>1, so replicas=1 must render a CR the mariadb-operator's
# validating webhook admits. With one replica the operator provisions the bare
# <name> Service (no -primary/-secondary split).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mariadb-single
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-single
  # The rendered operator CR makes a webhook rejection (the regression this
  # guards against) legible in the log.
  - describe:
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      name: mariadb-single
  - podLogs:
      selector: app.kubernetes.io/instance=mariadb-single
      tail: 50
  steps:
  - name: create-mariadb-single
    try:
    - apply:
        file: mariadb-single.yaml

  - name: wait-helmrelease-ready
    try:
    # Same 11m and the same reasons as the replicated suite above.
    - assert:
        timeout: 11m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: mariadb-single
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-service-and-statefulset
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb-single
          spec:
            (ports[0].port): 3306
    # Same gate as the replicated case above, and for the same reason: the
    # HelmRelease wait already spans first boot through kstatus, and this assert
    # covers the window where a CR with no conditions yet reads as current. One
    # replica means one 310s startup budget, plus the operator reconcile, PVC
    # bind and image pull ahead of it.
    - assert:
        timeout: 10m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mariadb-single
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: mariadb-single
          status:
            replicas: 1

  - name: verify-metrics
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb-single-metrics
          spec:
            (ports[0].port): 9104
    - assert:
        timeout: 1m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mariadb-single-metrics
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mariadb-single-metrics
          status:
            replicas: 1
---
# Full logical-dump backup -> to-copy RestoreJob round-trip, driving the
# validated example scripts (examples/backups/mariadb) as the harness so the
# test and the documented flow can never drift. run-all.sh runs Bucket ->
# source MariaDB + sentinel row -> MariaDB strategy + BackupClass -> ad-hoc
# BackupJob (waits Succeeded) -> empty target MariaDB + to-copy RestoreJob
# (waits Succeeded) and asserts the sentinel round-tripped through S3 into the
# restored copy while the source stays untouched — the in-cluster witness that
# a mariadb-operator backup is both taken and restorable end to end. It follows
# the same harness-driving shape as etcd-2-backup-roundtrip
# (hack/e2e-chainsaw/etcd/chainsaw-test.yaml): a single run step pre-cleans any
# leftover state, drives run-all.sh, and drains in an always-reached finally.
#
# Runs in tenant-root, not the default tenant-test: the S3 client here is the
# mariadb-operator Backup/Restore Job INSIDE the tenant, and the e2e tenant is
# created isolated (hack/e2e-install-cozystack.bats) — its Cilium egress
# allowlist blocks a tenant-test Pod from reaching tenant-root's seaweedfs,
# while a tenant-root Pod reaches it over same-tenant egress. The harness
# targets the in-cluster endpoint (S3_ENDPOINT below) instead of the BucketInfo
# external ingress URL, which in CI is an unroutable placeholder, and trusts
# its self-signed cert by copying the seaweedfs CA secret (seaweedfs-ca-cert,
# auto-discovered from the cert-manager Certificate) into the per-app CA
# Secret. (The bucket suite's mc checks lean on the same tenant-root seaweedfs,
# just from the test runner via port-forward.)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mariadb-2-backup-roundtrip
spec:
  namespace: tenant-root
  skipDelete: true
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-mariadb-src
  - describe:
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      name: mariadb-mariadb-src
  - describe:
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: Backup
  - describe:
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: Restore
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: BackupJob
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: RestoreJob
  # The dump/import runs in mariadb-operator-created Jobs; a failed upload or
  # TLS handshake leaves its error in those Pods' logs. Capture the source
  # instance's Pods too (operator Jobs are short-lived and TTL-reaped).
  - podLogs:
      selector: app.kubernetes.io/instance=mariadb-mariadb-src
      tail: 200
  steps:
  - name: run
    try:
    # Pre-clean: tenant-root is a shared, persistent namespace with fixed
    # resource names, so a run killed before the finally below leaves stale
    # state behind. A leftover BackupJob still carrying status.phase=Succeeded
    # from a prior run would satisfy `wait_for_field ... Succeeded` instantly
    # and pass without a real backup ever running. cleanup.sh is idempotent
    # (--ignore-not-found), so this is a no-op on a clean namespace.
    - script:
        timeout: 8m
        content: |
          set -eu
          cd ../../..
          NAMESPACE="$NAMESPACE" examples/backups/mariadb/cleanup.sh
        check:
          ($error == null): true
    # 42m runs the whole documented flow: bucket provisioning, a 2-replica
    # source MariaDB, the logical dump to S3, an empty 2-replica target, and
    # the to-copy restore + verify (convention 6: justified in-line). An
    # instance costs one first-boot budget, not one per replica: the operator
    # sets PodManagementPolicy: Parallel, so its replicas start together.
    #
    # 42m is what the two 660s HelmRelease waits in run-all.sh leave room for.
    # Whether a failure is reported or SIGKILLed depends on how much time has
    # elapsed when the failing wait starts: a target-side install failure is
    # reported for any prefix up to 1860s, and each minute taken off this op
    # takes a minute off that band, so a range of prefixes stops producing a
    # diagnosis and starts producing a killed process group.
    #
    # Three quantities live on this number and they are easy to read as one,
    # so name which is which. Op minus both mariadb waits is 1200s: what the
    # flow has for the applies, the dump, the restore and the verifies once
    # the two waits have taken their ceilings. The reported-prefix band is
    # 1860s: how slow the run may already be and still get a diagnosis rather
    # than a kill. The remainder this suite's own contract pins, op minus the
    # ceilings ahead of the source wait, is 960s.
    #
    # What 42m bounds is narrower than it looks, so read it as covering one
    # case rather than the flow. It covers a failure at the source HelmRelease
    # wait -- the mode this suite has hit -- because only the bucket stage runs
    # ahead of that wait, and those four ceilings together stay inside it.
    # Note what that sum does not count: the applies and the secret
    # materialisation draw on the same 42m, and after the four ceilings (300 +
    # 300 + 300 + 660 = 1560s) about sixteen minutes are left for them on
    # paper -- and the bucket provisioning is not among those stages, since
    # three of those four ceilings are its own waits. Less in practice: the
    # wait helpers advance their own counter by the sleep alone while each
    # iteration also pays two kubectl round-trips, so a ceiling of N seconds
    # costs more than N of wall clock. The figure is a ratchet on what the
    # flow has today, not a budget anything is measured against.
    #
    # A run that is slow at every stage and then fails at a later wait does not
    # fit: `set -e` drops the ceilings AFTER the wait that expires, never the
    # ones before it, and each of those may burn its budget and still succeed.
    # Such a run is SIGKILLed process-group-wide, losing the script's own error
    # and the diagnostics behind it.
    #
    # Raising this literal does not BOUND that, and the 42m above is not an
    # attempt to: the ceilings sum to several times it and grow with every wait
    # added, so a complete bound needs a phase budget of the kind
    # docs/agents/e2e-testing.md describes. The two are separate questions, and
    # conflating them is how the slack gets spent quietly -- "no number fixes
    # the general case" is not a reason to let a specific change consume the
    # margin the number already had.
    #
    # The fail-fast in run-all.sh does not cover the case that matters most
    # here. `wait_hr_ready` returns early on Stalled=True, but a release whose
    # install is still running is neither Ready nor Stalled, and stays that way
    # until its own 10m install timeout fires -- which is the state the source
    # instance was in when this suite last failed.
    - script:
        timeout: 42m
        content: |
          set -eu
          cd ../../..
          [ -x examples/backups/mariadb/run-all.sh ] || { echo "mariadb backup example scripts not found at examples/backups/mariadb" >&2; exit 1; }
          NAMESPACE="$NAMESPACE" S3_ENDPOINT="https://seaweedfs-s3.tenant-root:8333" \
            examples/backups/mariadb/run-all.sh
        check:
          ($error == null): true
    finally:
    # Removes every resource the harness created (chainsaw did not apply them,
    # so they are not part of automatic cleanup) — including the operator-side
    # k8s.mariadb.com Backup/Restore CRs the Cozystack jobs own only by label.
    - description: backup-flow cleanup
      script:
        timeout: 8m
        content: |
          set -eu
          cd ../../..
          NAMESPACE="$NAMESPACE" examples/backups/mariadb/cleanup.sh
