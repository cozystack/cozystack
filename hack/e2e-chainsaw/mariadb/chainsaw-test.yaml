# Chainsaw port of hack/e2e-apps/mariadb.bats
# ("Create DB MariaDB" + "Create single-replica MariaDB").
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mariadb
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-test
  - podLogs:
      selector: app.kubernetes.io/instance=mariadb-test
      tail: 50
  steps:
  - name: create-mariadb
    try:
    - apply:
        file: mariadb.yaml

  - name: wait-helmrelease-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: mariadb-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-service-and-statefulset
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb-test
          spec:
            (ports[0].port): 3306
    # The chart hands the operator a MariaDB CR and ships no built-in workload,
    # so the HelmRelease above goes Ready as soon as helm applies the manifests
    # -- it never waits for a pod. This assert is the first gate that does: an
    # endpoint address appears only once a replica has passed its startup and
    # then its readiness probe. The startup probe grants each replica 310s of
    # first-boot budget (see packages/apps/mariadb/templates/mariadb.yaml for
    # why), so a ceiling under that would fail runs the probe was still willing
    # to wait for. One ready address satisfies this assert, so it has to clear
    # one budget, not two, plus the operator reconcile, PVC bind and image pull
    # that precede it. 10m leaves room for all of that.
    - assert:
        timeout: 10m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mariadb-test
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: mariadb-test
          status:
            replicas: 2

  - name: verify-metrics
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb-test-metrics
          spec:
            (ports[0].port): 9104
    - assert:
        timeout: 1m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mariadb-test-metrics
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mariadb-test-metrics
          status:
            replicas: 1

  # The trust anchor a client verifies against, read off the live operator
  # rather than off this repo's beliefs about it. The unit suite pins what the
  # chart renders — the sentinel, its source name and its key — from the same
  # assumptions the chart encodes, so the two agree by construction and cannot
  # catch each other being wrong. Only a real mariadb-operator can say whether
  # <release>-ca-bundle is the right name and ca.crt the right key, and only a
  # real apiserver can say whether the lineage webhook promotes the projection
  # to something a tenant can read.
  #
  # This fixture sets no tls.issuer, and that is the interesting case rather
  # than a gap: TLS is always served and tenant-projection.yaml is ungated, so
  # the operator reconciles the source and the projection is expected here.
  - name: verify-tenant-ca-projection
    try:
    # Positive control, and it must come first. Every negative below is
    # satisfied by an ABSENT label, which is also exactly what you observe if
    # the lineage webhook stamped nothing in this run at all — a renamed field,
    # a kind that never reconciled. Without a witness that the mechanism is
    # live, they would all pass while asserting nothing.
    #
    # The credentials Secret is the witness: the chart renders it, its lineage
    # resolves to this instance, and the ApplicationDefinition grants it by
    # name, so it MUST be stamped.
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-test-credentials
            labels:
              internal.cozystack.io/tenantresource: "true"
    # tenant-ca is stamped by the CA-extraction controller; tenantresource is
    # the LINEAGE WEBHOOK's verdict, computed from the ApplicationDefinition's
    # secrets.include matchLabels. It reads "true" only if the whole chain held:
    # the sentinel converged, the controller lifted the certificate, the
    # definition selected the label and the webhook admitted the object.
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-test.tenant-ca
            labels:
              internal.cozystack.io/tenant-ca: "true"
              internal.cozystack.io/tenantresource: "true"
          type: Opaque
    # Deterministic once the asserts above pass, so no retry.
    - script:
        content: |
          set -eu

          NS="$NAMESPACE"
          PROJ=mariadb-test.tenant-ca
          SRC=mariadb-test-ca-bundle

          # Reads one key of a Secret. `index` takes the key as a string, so a
          # key with dots in it needs no jsonpath escaping.
          secret_value() {
            kubectl -n "$NS" get secret "$1" \
              -o go-template="{{if .data}}{{index .data \"$2\"}}{{end}}" | base64 -d
          }
          secret_keys() {
            kubectl -n "$NS" get secret "$1" \
              -o go-template='{{if .data}}{{range $k, $v := .data}}{{$k}}{{"\n"}}{{end}}{{end}}'
          }
          # True when any value in the Secret is PEM private key material.
          # Key-agnostic on purpose: which key the operator stores it under is
          # its business, and naming one here would go quietly vacuous the day
          # it changes.
          has_private_key() {
            for k in $(secret_keys "$1"); do
              if secret_value "$1" "$k" | grep -qi 'BEGIN .*PRIVATE KEY'; then
                return 0
              fi
            done
            return 1
          }

          # Exactly one key, and it is ca.crt. The sources this was lifted
          # alongside carry private keys, so any second key is a leak in the
          # making.
          keys=$(secret_keys "$PROJ" | sort | tr '\n' ' ')
          if [ "$keys" != "ca.crt " ]; then
            echo "projection must hold exactly ca.crt, holds: $keys" >&2
            exit 1
          fi

          # It lifted the right certificate. This is what pins the declared
          # source to reality: if the operator renames the bundle or its key,
          # the controller finds nothing and this fails.
          #
          # Compared by fingerprint rather than raw PEM — the controller
          # re-encodes ca.crt from the DER it parsed, so a header or
          # column-width change at the source would redden a byte comparison of
          # a correct projection.
          src=$(secret_value "$SRC" "ca.crt")
          if [ -z "$src" ]; then
            echo "$SRC has no ca.crt — the declared source name or key is wrong" >&2
            exit 1
          fi
          proj=$(secret_value "$PROJ" "ca.crt")
          src_fp=$(echo "$src" | openssl x509 -noout -fingerprint -sha256)
          proj_fp=$(echo "$proj" | openssl x509 -noout -fingerprint -sha256)
          if [ "$src_fp" != "$proj_fp" ]; then
            echo "projection does not carry the operator's CA certificate" >&2
            exit 1
          fi

          # The source is key-free by design, which is why it is the source. If
          # the operator ever starts storing a key in it, the projection stops
          # being a copy of something safe.
          if has_private_key "$SRC"; then
            echo "$SRC now carries private key material — it is no longer a safe source" >&2
            exit 1
          fi
          if echo "$proj" | grep -qi 'BEGIN .*PRIVATE KEY'; then
            echo "projection carries PEM private key material" >&2
            exit 1
          fi

          # The delivery path the README tells a tenant to use, run as the
          # command the README prints. Everything above reads raw Secrets, which
          # only an admin can do, and so proves the projection's shape and
          # nothing about whether a tenant can reach it.
          anchor=$(kubectl -n "$NS" get tenantsecret "$PROJ" \
            -o jsonpath='{.data.ca\.crt}' | base64 -d)
          if ! echo "$anchor" | grep -q 'BEGIN CERTIFICATE'; then
            echo "the trust anchor is not served through core.cozystack.io/tenantsecrets" >&2
            exit 1
          fi

          # And the negative that gives the positive its meaning: the registry
          # must not serve a Secret that holds a private key. Promotion is
          # driven by a label selector with no name constraint, so any one of
          # these acquiring the label leaks a key.
          #
          # The candidates are the names the ApplicationDefinition excludes, and
          # each is checked for private key material before its absence from the
          # registry is required. A name that does not exist under this fixture
          # would otherwise 404 for the wrong reason and pass while proving
          # nothing — which is most of this list, since the cert-manager leg
          # renders no Secrets when tls.issuer is unset. Counting what was
          # actually discriminated on, and failing when that is zero, is what
          # keeps the whole block from going vacuous if the operator renames
          # everything at once.
          checked=0
          for s in mariadb-test-ca mariadb-test-server-cert mariadb-test-client-cert \
                   mariadb-test.ca-tls mariadb-test.tls; do
            if ! kubectl -n "$NS" get secret "$s" >/dev/null 2>&1; then
              echo "skip $s: no such Secret under this fixture"
              continue
            fi
            if ! has_private_key "$s"; then
              echo "skip $s: holds no private key material"
              continue
            fi
            checked=$((checked + 1))
            # NotFound is the only acceptable failure. An RBAC denial or an
            # unavailable aggregated apiserver also makes the read fail, and
            # reading that as "safely absent" is how this check would stop
            # discriminating without going red.
            if err=$(kubectl -n "$NS" get tenantsecret "$s" 2>&1 >/dev/null); then
              echo "key-bearing $s is being served as a tenant secret" >&2
              exit 1
            fi
            case "$err" in
              *NotFound*) echo "ok $s: key-bearing and not served" ;;
              *)
                echo "tenantsecret $s did not answer NotFound, so this check proved nothing: $err" >&2
                exit 1
                ;;
            esac
          done
          if [ "$checked" -eq 0 ]; then
            echo "no key-bearing Secret was found to check, so the negative above is vacuous" >&2
            exit 1
          fi
        check:
          ($error == null): true
---
# Guard for the operator-webhook regression fixed in c7e8f4d97: replication is
# guarded on replicas>1, so replicas=1 must render a CR the mariadb-operator's
# validating webhook admits. With one replica the operator provisions the bare
# <name> Service (no -primary/-secondary split).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mariadb-single
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-single
  # The rendered operator CR makes a webhook rejection (the regression this
  # guards against) legible in the log.
  - describe:
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      name: mariadb-single
  - podLogs:
      selector: app.kubernetes.io/instance=mariadb-single
      tail: 50
  steps:
  - name: create-mariadb-single
    try:
    - apply:
        file: mariadb-single.yaml

  - name: wait-helmrelease-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: mariadb-single
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-service-and-statefulset
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb-single
          spec:
            (ports[0].port): 3306
    # Same gate as the replicated case above -- the HelmRelease does not wait
    # for a pod, so this is where first boot is actually covered. One replica
    # means one 310s startup budget, plus the operator reconcile, PVC bind and
    # image pull ahead of it.
    - assert:
        timeout: 10m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mariadb-single
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: mariadb-single
          status:
            replicas: 1

  - name: verify-metrics
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb-single-metrics
          spec:
            (ports[0].port): 9104
    - assert:
        timeout: 1m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mariadb-single-metrics
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mariadb-single-metrics
          status:
            replicas: 1
---
# Full logical-dump backup -> to-copy RestoreJob round-trip, driving the
# validated example scripts (examples/backups/mariadb) as the harness so the
# test and the documented flow can never drift. run-all.sh runs Bucket ->
# source MariaDB + sentinel row -> MariaDB strategy + BackupClass -> ad-hoc
# BackupJob (waits Succeeded) -> empty target MariaDB + to-copy RestoreJob
# (waits Succeeded) and asserts the sentinel round-tripped through S3 into the
# restored copy while the source stays untouched — the in-cluster witness that
# a mariadb-operator backup is both taken and restorable end to end. It follows
# the same harness-driving shape as etcd-2-backup-roundtrip
# (hack/e2e-chainsaw/etcd/chainsaw-test.yaml): a single run step pre-cleans any
# leftover state, drives run-all.sh, and drains in an always-reached finally.
#
# Runs in tenant-root, not the default tenant-test: the S3 client here is the
# mariadb-operator Backup/Restore Job INSIDE the tenant, and the e2e tenant is
# created isolated (hack/e2e-install-cozystack.bats) — its Cilium egress
# allowlist blocks a tenant-test Pod from reaching tenant-root's seaweedfs,
# while a tenant-root Pod reaches it over same-tenant egress. The harness
# targets the in-cluster endpoint (S3_ENDPOINT below) instead of the BucketInfo
# external ingress URL, which in CI is an unroutable placeholder, and trusts
# its self-signed cert by copying the seaweedfs CA secret (seaweedfs-ca-cert,
# auto-discovered from the cert-manager Certificate) into the per-app CA
# Secret. (The bucket suite's mc checks lean on the same tenant-root seaweedfs,
# just from the test runner via port-forward.)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mariadb-2-backup-roundtrip
spec:
  namespace: tenant-root
  skipDelete: true
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-mariadb-src
  - describe:
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      name: mariadb-mariadb-src
  - describe:
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: Backup
  - describe:
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: Restore
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: BackupJob
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: RestoreJob
  # The dump/import runs in mariadb-operator-created Jobs; a failed upload or
  # TLS handshake leaves its error in those Pods' logs. Capture the source
  # instance's Pods too (operator Jobs are short-lived and TTL-reaped).
  - podLogs:
      selector: app.kubernetes.io/instance=mariadb-mariadb-src
      tail: 200
  steps:
  - name: run
    try:
    # Pre-clean: tenant-root is a shared, persistent namespace with fixed
    # resource names, so a run killed before the finally below leaves stale
    # state behind. A leftover BackupJob still carrying status.phase=Succeeded
    # from a prior run would satisfy `wait_for_field ... Succeeded` instantly
    # and pass without a real backup ever running. cleanup.sh is idempotent
    # (--ignore-not-found), so this is a no-op on a clean namespace.
    - script:
        timeout: 8m
        content: |
          set -eu
          cd ../../..
          NAMESPACE="$NAMESPACE" examples/backups/mariadb/cleanup.sh
        check:
          ($error == null): true
    # The 30m budget is the whole documented flow: bucket provisioning, a
    # 2-replica source MariaDB (each replica's operator startup probe grants
    # 310s of first-boot budget — see the mariadb app suite above), the logical
    # dump to S3, an empty 2-replica target, and the to-copy restore + verify
    # (convention 6: justified in-line). run-all.sh fails fast on terminal
    # BackupJob/RestoreJob phases and stalled HelmReleases rather than polling
    # out the budget.
    - script:
        timeout: 30m
        content: |
          set -eu
          cd ../../..
          [ -x examples/backups/mariadb/run-all.sh ] || { echo "mariadb backup example scripts not found at examples/backups/mariadb" >&2; exit 1; }
          COZY_E2E_BACKUP_PREFLIGHT=1 NAMESPACE="$NAMESPACE" S3_ENDPOINT="https://seaweedfs-s3.tenant-root:8333" \
            examples/backups/mariadb/run-all.sh
        check:
          ($error == null): true
    finally:
    # Removes every resource the harness created (chainsaw did not apply them,
    # so they are not part of automatic cleanup) — including the operator-side
    # k8s.mariadb.com Backup/Restore CRs the Cozystack jobs own only by label.
    - description: backup-flow cleanup
      script:
        timeout: 8m
        content: |
          set -eu
          cd ../../..
          NAMESPACE="$NAMESPACE" examples/backups/mariadb/cleanup.sh
