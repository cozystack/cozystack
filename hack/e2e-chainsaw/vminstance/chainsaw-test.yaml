# Chainsaw port of hack/e2e-apps/vminstance.bats. Scenarios: a standalone
# VMDisk, a VMDisk whose import can never finish, VMDisks cloned from a golden
# image and from another disk, and a VMInstance booting from its own VMDisk. The
# first and the last download the Ubuntu noble cloud image, so the readiness
# timeouts are generous. Chainsaw deletes the CRs it applied at cleanup.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vmdisk
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vm-disk-test
  steps:
  - name: create-vmdisk
    try:
    - apply:
        file: vmdisk.yaml
  - name: wait-vmdisk-ready
    try:
    - assert:
        timeout: 11m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
            (conditions[?type == 'WorkloadsReady']):
            - status: "True"
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vmdisk-unreachable
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      name: vm-disk-unreachable
  steps:
  - name: create-vmdisk
    try:
    - apply:
        file: vmdisk-unreachable.yaml
  # Checks that a disk whose import cannot complete has a Ready release and
  # is reported not operational. A DataVolume that has not started yet is not
  # operational either, so the VMDisk assert follows the importer's first
  # failure: CDI reports it as Running=False with the terminated container's
  # reason, Error.
  - name: wait-workloads-not-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-unreachable
          status:
            (conditions[?type == 'Running']):
            - status: "False"
              reason: Error
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: unreachable
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
            (conditions[?type == 'WorkloadsReady']):
            - status: "False"
              reason: DataVolumeNotReady
---
# VMDisk clone paths: source.image clones a golden image from cozy-public, and
# source.disk clones that disk in turn, so only the golden image downloads.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vmdisk-clone
spec:
  catch:
  - events: {}
  - events:
      namespace: cozy-public
  - describe:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
  - describe:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      namespace: cozy-public
      name: vm-default-images-e2e-alpine-3.21
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
  steps:
  - name: create-golden-image
    try:
    - apply:
        file: golden-image.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-default-images-e2e-alpine-3.21
            namespace: cozy-public
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  - name: clone-from-image
    try:
    - apply:
        file: vmdisk-image-clone.yaml
    # The vm-disk release goes Ready as soon as the DataVolume exists, so this
    # assert is the one that waits for the clone itself.
    - assert:
        timeout: 10m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-image-clone
          spec:
            source:
              pvc:
                name: vm-default-images-e2e-alpine-3.21
                namespace: cozy-public
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    # CDI derives Ready from the DataVolume phase alone, and can reach
    # Succeeded from the PVC's annotations before the claim itself binds.
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: vm-disk-image-clone
          status:
            phase: Bound
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: image-clone
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
            (conditions[?type == 'WorkloadsReady']):
            - status: "True"
  - name: clone-from-disk
    try:
    - apply:
        file: vmdisk-disk-clone.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-disk-clone
          spec:
            source:
              pvc:
                name: vm-disk-image-clone
                namespace: ($namespace)
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: vm-disk-disk-clone
          status:
            phase: Bound
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: disk-clone
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
            (conditions[?type == 'WorkloadsReady']):
            - status: "True"
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vminstance
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vm-instance-test
  - describe:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachineInstance
      name: vm-instance-test
  steps:
  - name: create-vmdisk
    try:
    - apply:
        file: vmdisk-vmi.yaml
    - assert:
        timeout: 11m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-vmi-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: vmi-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
            (conditions[?type == 'WorkloadsReady']):
            - status: "True"
  - name: create-vminstance
    try:
    - apply:
        file: vminstance.yaml
    # No install-timeout floor to clear: vm-instance-rd disables the install
    # wait, so this release goes Ready once helm has applied.
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: vm-instance-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  - name: wait-vm-running
    try:
    # Nested KubeVirt startup (virt-launcher + libvirt + cloud-init DHCP) takes
    # 30-60s; allow a generous bound for the IP to appear, then VM Ready.
    - assert:
        timeout: 5m
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachineInstance
          metadata:
            name: vm-instance-test
          (status.interfaces[0].ipAddress != null): true
    - assert:
        timeout: 5m
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: vm-instance-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  - name: dry-run-evict-launcher
    try:
    # virt-api stamps the cluster evictionStrategy into the VMI spec at
    # creation, and the eviction webhook reads it from there. virt-handler
    # publishes LiveMigratable once it has synced the domain; under
    # LiveMigrateIfPossible that condition is what splits the webhook's answer.
    - assert:
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachineInstance
          metadata:
            name: vm-instance-test
          spec:
            evictionStrategy: LiveMigrateIfPossible
          status:
            (conditions[?type == 'LiveMigratable']):
            - type: LiveMigratable
    # dryRun=All still runs the eviction webhook (sideEffects NoneOnDryRun) and
    # deletes nothing. Under LiveMigrateIfPossible a migratable VMI is refused
    # with 429 and the webhook's evacuation message, which a drain retries while
    # the VM migrates away; a non-migratable one is let through. On the PR
    # lane post-install prep pins StorageProfile/local to RWO, so there the
    # VMI is not migratable.
    - script:
        timeout: 1m
        content: |
          set -eu
          vmi=vm-instance-test
          vmi_json=$(kubectl -n "$NAMESPACE" get vmi "$vmi" -o json)
          uid=$(printf '%s\n' "$vmi_json" | jq -r '.metadata.uid')
          migratable=$(printf '%s\n' "$vmi_json" | jq -r '[.status.conditions[] | select(.type == "LiveMigratable") | .status] | if length == 1 then .[0] else "ambiguous" end')
          pods=$(kubectl -n "$NAMESPACE" get pods -l "kubevirt.io=virt-launcher,kubevirt.io/created-by=$uid" --field-selector status.phase=Running -o json)
          if [ "$(printf '%s\n' "$pods" | jq '.items | length')" != 1 ]; then
            echo "FAIL: expected exactly one Running launcher pod for VMI $vmi" >&2
            printf '%s\n' "$pods" | jq -r '.items[] | .metadata.name + " " + .status.phase' >&2
            exit 1
          fi
          pod=$(printf '%s\n' "$pods" | jq -r '.items[0].metadata.name')
          pod_uid=$(printf '%s\n' "$pods" | jq -r '.items[0].metadata.uid')

          eviction=$(jq -cn --arg name "$pod" --arg ns "$NAMESPACE" \
            '{apiVersion: "policy/v1", kind: "Eviction", metadata: {name: $name, namespace: $ns}}')
          err_file=$(mktemp)
          trap 'rm -f "$err_file"' EXIT
          if out=$(printf '%s\n' "$eviction" | kubectl create --raw "/api/v1/namespaces/$NAMESPACE/pods/$pod/eviction?dryRun=All" -f - 2>"$err_file"); then
            allowed=true
          else
            allowed=false
          fi
          err=$(cat "$err_file")
          echo "LiveMigratable=$migratable eviction-allowed=$allowed"
          printf '%s\n' "response: $out"
          printf '%s\n' "stderr: $err"

          case "$migratable" in
          True)
            if [ "$allowed" = true ]; then
              echo "FAIL: dry-run eviction of migratable VMI $vmi was allowed; the webhook should refuse it and start an evacuation" >&2
              exit 1
            fi
            if ! printf '%s\n' "$err" | grep -Fq "Eviction triggered evacuation of VMI \"$NAMESPACE/$vmi\""; then
              echo "FAIL: the refusal did not come from the KubeVirt evacuation path" >&2
              exit 1
            fi
            ;;
          False)
            if [ "$allowed" != true ]; then
              echo "FAIL: dry-run eviction of non-migratable VMI $vmi was refused; LiveMigrateIfPossible should let it through" >&2
              exit 1
            fi
            if ! printf '%s\n' "$out" | jq -e '.kind == "Status" and .status == "Success"' >/dev/null 2>&1; then
              echo "FAIL: the eviction returned without a Success status" >&2
              exit 1
            fi
            ;;
          *)
            echo "FAIL: VMI $vmi LiveMigratable condition is '$migratable', expected True or False" >&2
            exit 1
            ;;
          esac

          if ! kubectl -n "$NAMESPACE" get pod "$pod" -o json |
            jq -e --arg uid "$pod_uid" '.metadata.uid == $uid and .metadata.deletionTimestamp == null' >/dev/null; then
            echo "FAIL: launcher pod $pod was deleted or replaced by a dry-run eviction" >&2
            exit 1
          fi
          if ! kubectl -n "$NAMESPACE" get vmi "$vmi" -o json |
            jq -e '(.status.evacuationNodeName // "") == ""' >/dev/null; then
            echo "FAIL: a dry-run eviction recorded an evacuation on VMI $vmi" >&2
            exit 1
          fi
---
# A tenant super-admin must not write raw kubevirt.io/virtualmachines: that
# bypasses the apps.cozystack.io wrapper's size/quota enforcement. Pure can-i
# checks, no objects created. In this suite because every suite dir must map to
# a PackageSource (hack/select-install.sh).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-super-admin-raw-vm-rbac
spec:
  steps:
  - name: raw-vm-write-denied-app-vm-allowed
    try:
    - script:
        timeout: 2m
        content: |
          set -eu
          ns="$NAMESPACE"
          # kubectl needs --as with --as-group; the user is unbound, the group carries the grant.
          as="--as=e2e-tenant-rbac-probe --as-group=system:authenticated --as-group=${ns}-super-admin"
          rc=0
          # can-i exits 1 on "no", so read the answer from stdout, not the exit
          # code; stderr is left to the step log so a kubectl error is visible.
          want() {
            verb=$1; res=$2; expect=$3
            got=$(kubectl -n "$ns" auth can-i "$verb" "$res" $as) || true
            echo "can-i $verb $res as ${ns}-super-admin: ${got:-<empty>} (want $expect)"
            if [ "$got" != "$expect" ]; then
              echo "  UNEXPECTED: $verb $res = '${got:-<empty>}', want '$expect'" >&2
              rc=1
            fi
          }
          # raw kubevirt VM writes denied (the hole); reads kept; apps.cozystack.io wrapper allowed.
          want create virtualmachines.kubevirt.io no
          want update virtualmachines.kubevirt.io no
          want patch  virtualmachines.kubevirt.io no
          want delete virtualmachines.kubevirt.io no
          want get  virtualmachines.kubevirt.io yes
          want list virtualmachines.kubevirt.io yes
          want create virtualmachines.apps.cozystack.io yes
          exit "$rc"
        check:
          ($error == null): true
