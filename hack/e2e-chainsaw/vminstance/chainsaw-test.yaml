# Chainsaw port of hack/e2e-apps/vminstance.bats. Scenarios: a standalone
# VMDisk, a VMDisk whose import can never finish, and a VMInstance booting from
# its own VMDisk. The first and the last download the Ubuntu noble cloud image,
# so the readiness timeouts are generous. Chainsaw deletes the VMDisk/VMInstance
# CRs it applied at cleanup.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vmdisk
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vm-disk-test
  steps:
  - name: create-vmdisk
    try:
    - apply:
        file: vmdisk.yaml
  - name: wait-vmdisk-ready
    try:
    - assert:
        timeout: 11m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
            (conditions[?type == 'WorkloadsReady']):
            - status: "True"
    - assert:
        timeout: 4m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: vm-disk-test
          status:
            phase: Bound
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vmdisk-unreachable
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      name: vm-disk-unreachable
  steps:
  - name: create-vmdisk
    try:
    - apply:
        file: vmdisk-unreachable.yaml
  # Checks that a disk whose import cannot complete has a Ready release and
  # is reported not operational. A DataVolume that has not started yet is not
  # operational either, so the VMDisk assert follows the importer's first
  # failure: CDI reports it as Running=False with the terminated container's
  # reason, Error.
  - name: wait-workloads-not-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-unreachable
          status:
            (conditions[?type == 'Running']):
            - status: "False"
              reason: Error
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: unreachable
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
            (conditions[?type == 'WorkloadsReady']):
            - status: "False"
              reason: DataVolumeNotReady
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vminstance
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vm-instance-test
  - describe:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachineInstance
      name: vm-instance-test
  steps:
  - name: create-vmdisk
    try:
    - apply:
        file: vmdisk-vmi.yaml
    - assert:
        timeout: 11m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-vmi-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps.cozystack.io/v1alpha1
          kind: VMDisk
          metadata:
            name: vmi-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
            (conditions[?type == 'WorkloadsReady']):
            - status: "True"
    - assert:
        timeout: 4m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: vm-disk-vmi-test
          status:
            phase: Bound
  - name: create-vminstance
    try:
    - apply:
        file: vminstance.yaml
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: vm-instance-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  - name: wait-vm-running
    try:
    # Nested KubeVirt startup (virt-launcher + libvirt + cloud-init DHCP) takes
    # 30-60s; allow a generous bound for the IP to appear, then VM Ready.
    - assert:
        timeout: 5m
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachineInstance
          metadata:
            name: vm-instance-test
          (status.interfaces[0].ipAddress != null): true
    - assert:
        timeout: 5m
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: vm-instance-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
