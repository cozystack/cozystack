# Chainsaw port of hack/e2e-apps/bucket.bats ("Create and Verify Seeweedfs Bucket").
#
# The declarative half (resource readiness) becomes assert operations; the
# imperative half (S3 access checks with mc through a port-forward) stays a
# single script step, since a port-forward cannot span chainsaw operations.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bucket
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: bucket-test
  - describe:
      apiVersion: objectstorage.k8s.io/v1alpha1
      kind: BucketClaim
      name: bucket-test
  # The backend view: cluster-scoped Buckets plus the COSI controller pods,
  # where a frozen-claim readiness propagation failure actually surfaces.
  - get:
      apiVersion: objectstorage.k8s.io/v1alpha1
      kind: Bucket
      format: yaml
  - script:
      content: kubectl -n cozy-objectstorage-controller get pods
  steps:
  - name: create-bucket
    try:
    - apply:
        file: bucket.yaml

  - name: wait-bucket-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: bucket-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    # Replaces `until kubectl get ...` + `kubectl wait --for=jsonpath=...`
    # pairs: one assert handles both existence and the status field.
    # 2m, not the default 5m: the objectstorage-controller requeues the
    # BucketClaim until the backend Bucket is ready, so readiness converges
    # within tens of seconds; a claim still not ready after 2m is frozen
    # (readiness-propagation regression), and the tight bound surfaces that
    # instead of masking it (mirrors the bats 120s budget from 63d14e748).
    - assert:
        timeout: 2m
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketClaim
          metadata:
            name: bucket-test
          status:
            bucketReady: true
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: bucket-test-admin
          status:
            accessGranted: true
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: bucket-test-viewer
          status:
            accessGranted: true

  - name: verify-s3-access
    try:
    - script:
        timeout: 5m
        content: |
          set -eu
          workdir=$(mktemp -d)
          trap '[ -n "${pf_pid:-}" ] && kill "$pf_pid" 2>/dev/null || true; rm -rf "$workdir"' EXIT

          # Extract credentials for both users
          kubectl -n "$NAMESPACE" get secret bucket-test-admin \
            -o jsonpath='{.data.BucketInfo}' | base64 -d > "$workdir/admin.json"
          kubectl -n "$NAMESPACE" get secret bucket-test-viewer \
            -o jsonpath='{.data.BucketInfo}' | base64 -d > "$workdir/viewer.json"
          ADMIN_ACCESS_KEY=$(jq -r '.spec.secretS3.accessKeyID' "$workdir/admin.json")
          ADMIN_SECRET_KEY=$(jq -r '.spec.secretS3.accessSecretKey' "$workdir/admin.json")
          VIEWER_ACCESS_KEY=$(jq -r '.spec.secretS3.accessKeyID' "$workdir/viewer.json")
          VIEWER_SECRET_KEY=$(jq -r '.spec.secretS3.accessSecretKey' "$workdir/viewer.json")
          BUCKET_NAME=$(jq -r '.spec.bucketName' "$workdir/admin.json")

          # Port-forward to the S3 endpoint; cleaned up by the trap
          kubectl port-forward service/seaweedfs-s3 -n tenant-root 8333:8333 >/dev/null 2>&1 &
          pf_pid=$!
          timeout 30 sh -ec 'until nc -z localhost 8333; do sleep 1; done'

          mc alias set rw-user https://localhost:8333 "$ADMIN_ACCESS_KEY" "$ADMIN_SECRET_KEY" --insecure
          mc alias set ro-user https://localhost:8333 "$VIEWER_ACCESS_KEY" "$VIEWER_SECRET_KEY" --insecure

          # Admin (readwrite) can upload, list, download
          echo "readwrite test" > "$workdir/rw-test.txt"
          mc cp --insecure "$workdir/rw-test.txt" "rw-user/$BUCKET_NAME/rw-test.txt"
          mc ls --insecure "rw-user/$BUCKET_NAME/rw-test.txt"
          mc cp --insecure "rw-user/$BUCKET_NAME/rw-test.txt" "$workdir/rw-test-download.txt"

          # Viewer (readonly) can list and download
          mc ls --insecure "ro-user/$BUCKET_NAME/rw-test.txt"
          mc cp --insecure "ro-user/$BUCKET_NAME/rw-test.txt" "$workdir/ro-test-download.txt"

          # Viewer (readonly) upload must be DENIED. accessPolicy=readonly
          # enforcement landed with seaweedfs-cosi-driver v0.3.1 (#1921,
          # eab9b034f), so a successful upload is a regression, not a known
          # gap — fail hard.
          echo "readonly test" > "$workdir/ro-test.txt"
          if mc cp --insecure "$workdir/ro-test.txt" "ro-user/$BUCKET_NAME/ro-test.txt"; then
            echo "FAIL: read-only user must NOT be able to upload (accessPolicy=readonly regression; enforced since cosi-driver v0.3.1, #1921)" >&2
            # Drop the object the viewer should not have been able to create
            # (via the admin user, which is unambiguously allowed to delete).
            mc rm --insecure "rw-user/$BUCKET_NAME/ro-test.txt" || true
            exit 1
          fi

          # Remove the test object so bucket cleanup is not blocked
          mc rm --insecure "rw-user/$BUCKET_NAME/rw-test.txt"
        check:
          ($error == null): true
# The Bucket CR was applied by chainsaw and is deleted automatically during
# cleanup — no explicit teardown step needed.
---
# Slot exhaustion leaves every COSI object green and fails only the write, so
# readiness alone cannot see it: the master answers `assign` with a grow that
# returns no volume, and the S3 gateway times the PUT out. Each bucket here
# therefore has to take an object, not just report ready.
#
# Three buckets, because the count has to exceed what a 10Gi volume serves at
# a 1000 MB size limit and six volumes per grow, nine slots per server,
# whether or not the platform's cozy-backups collection and the unnamed
# default one have grown yet, and this suite can observe neither. With either
# of them grown, the second bucket is already refused. With neither, the first
# bucket takes six slots and the second the remaining three, since a grow keeps
# what it gets, so the third is refused.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bucket-1-capacity
spec:
  catch:
  - events: {}
  - get:
      apiVersion: objectstorage.k8s.io/v1alpha1
      kind: Bucket
      format: yaml
  - podLogs:
      namespace: tenant-root
      selector: app.kubernetes.io/component=master
      tail: 200
  # The master logs a grow failure without the slot accounting behind it, so a
  # log alone reads the same whether the shipped limit is too coarse for the
  # PVC or an earlier collection in this run is still holding the budget. Max
  # against Volumes per server separates those two.
  # Read from inside the master rather than through a port-forward: the image
  # ships curl, so this needs nothing on the host and adds no second fixed
  # port to the reason this suite cannot run in parallel.
  - description: master slot accounting
    script:
      timeout: 2m
      content: |
        set -u
        echo "» master /dir/status (Max is the slot count per server, Volumes what is held):"
        timeout 60 kubectl -n tenant-root exec statefulset/seaweedfs-master -- \
          curl -s --max-time 20 http://localhost:9333/dir/status \
          || echo "» /dir/status read failed"
        echo
        exit 0
  steps:
  - name: create-buckets
    try:
    - apply:
        file: buckets-capacity.yaml

  - name: wait-buckets-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: bucket-cap1
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: bucket-cap2
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: bucket-cap3
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 2m
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketClaim
          metadata:
            name: bucket-cap1
          status:
            bucketReady: true
    - assert:
        timeout: 2m
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketClaim
          metadata:
            name: bucket-cap2
          status:
            bucketReady: true
    - assert:
        timeout: 2m
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketClaim
          metadata:
            name: bucket-cap3
          status:
            bucketReady: true
    # BucketAccess reconciles separately from the claim, and the write step
    # reads the Secret it produces. Without these the step can fail on a
    # missing Secret rather than on the capacity it is here to measure.
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: bucket-cap1-admin
          status:
            accessGranted: true
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: bucket-cap2-admin
          status:
            accessGranted: true
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: bucket-cap3-admin
          status:
            accessGranted: true

  - name: verify-every-bucket-takes-a-write
    try:
    - script:
        timeout: 5m
        content: |
          set -eu
          workdir=$(mktemp -d)
          trap '[ -n "${pf_pid:-}" ] && kill "$pf_pid" 2>/dev/null || true; rm -rf "$workdir"' EXIT

          kubectl port-forward service/seaweedfs-s3 -n tenant-root 8333:8333 >/dev/null 2>&1 &
          pf_pid=$!
          timeout 30 sh -ec 'until nc -z localhost 8333; do sleep 1; done'

          echo "capacity probe" > "$workdir/probe.txt"

          for name in cap1 cap2 cap3; do
            # Keep the read and the decode as separate commands. This runs under
            # /bin/sh, where pipefail is unavailable, and a pipeline would let a
            # failed Secret read look successful when base64 exits zero on empty
            # input — surfacing at mc as the credentials error this case exists
            # to rule out.
            if ! kubectl -n "$NAMESPACE" get secret "bucket-${name}-admin" \
                -o jsonpath='{.data.BucketInfo}' > "$workdir/${name}.b64"; then
              echo "failed to read BucketInfo Secret $NAMESPACE/bucket-${name}-admin" >&2
              exit 1
            fi
            if ! base64 -d < "$workdir/${name}.b64" > "$workdir/${name}.json"; then
              echo "BucketInfo Secret $NAMESPACE/bucket-${name}-admin is not valid base64" >&2
              exit 1
            fi
            ACCESS_KEY=$(jq -r '.spec.secretS3.accessKeyID // ""' "$workdir/${name}.json")
            SECRET_KEY=$(jq -r '.spec.secretS3.accessSecretKey // ""' "$workdir/${name}.json")
            BUCKET_NAME=$(jq -r '.spec.bucketName // ""' "$workdir/${name}.json")
            if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ] || [ -z "$BUCKET_NAME" ]; then
              echo "BucketInfo Secret $NAMESPACE/bucket-${name}-admin lacks access key, secret key, or bucket name" >&2
              exit 1
            fi

            # Each mc call carries its own limit, because the step timeout only
            # kills this shell and a hung PUT, the failure this case exists for,
            # would keep the step waiting on mc's pipes. That PUT never fails on
            # its own: the gateway answers 5xx and mc retries without a word, so
            # the limit is what ends it and the catch block is what shows why.
            # The PUT gets the longest because a working one can still wait up
            # to ten seconds while the master grows a volume for the bucket.
            # With the port-forward wait the sum stays under the step's five
            # minutes.
            timeout 15 mc alias set "$name" https://localhost:8333 "$ACCESS_KEY" "$SECRET_KEY" --insecure
            timeout 45 mc cp --insecure "$workdir/probe.txt" "$name/$BUCKET_NAME/probe.txt"
            timeout 15 mc rm --insecure "$name/$BUCKET_NAME/probe.txt"
          done
        check:
          ($error == null): true
