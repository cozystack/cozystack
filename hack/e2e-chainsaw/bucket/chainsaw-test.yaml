# Chainsaw port of hack/e2e-apps/bucket.bats ("Create and Verify Seeweedfs Bucket").
#
# The declarative half (resource readiness) becomes assert operations; the
# imperative half (S3 access checks with mc through a port-forward) stays a
# single script step, since a port-forward cannot span chainsaw operations.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bucket
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: bucket-test
  - describe:
      apiVersion: objectstorage.k8s.io/v1alpha1
      kind: BucketClaim
      name: bucket-test
  # The backend view: cluster-scoped Buckets plus the COSI controller pods,
  # where a frozen-claim readiness propagation failure actually surfaces.
  - get:
      apiVersion: objectstorage.k8s.io/v1alpha1
      kind: Bucket
      format: yaml
  - script:
      content: kubectl -n cozy-objectstorage-controller get pods
  steps:
  - name: create-bucket
    try:
    - apply:
        file: bucket.yaml

  - name: wait-bucket-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: bucket-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    # Replaces `until kubectl get ...` + `kubectl wait --for=jsonpath=...`
    # pairs: one assert handles both existence and the status field.
    # 2m, not the default 5m: the objectstorage-controller requeues the
    # BucketClaim until the backend Bucket is ready, so readiness converges
    # within tens of seconds; a claim still not ready after 2m is frozen
    # (readiness-propagation regression), and the tight bound surfaces that
    # instead of masking it (mirrors the bats 120s budget from 63d14e748).
    - assert:
        timeout: 2m
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketClaim
          metadata:
            name: bucket-test
          status:
            bucketReady: true
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: bucket-test-admin
          status:
            accessGranted: true
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: bucket-test-viewer
          status:
            accessGranted: true

  - name: verify-s3-access
    try:
    - script:
        timeout: 5m
        content: |
          set -eu
          workdir=$(mktemp -d)
          trap '[ -n "${pf_pid:-}" ] && kill "$pf_pid" 2>/dev/null || true; rm -rf "$workdir"' EXIT

          # Cap every S3 and apiserver call at its own deadline. A chainsaw
          # `script` op runs the shell under exec.CommandContext with stdout and
          # stderr wired to in-process buffers
          # (pkg/engine/operations/script/operation.go): when the op `timeout`
          # fires it SIGKILLs the shell alone — not its descendants — and
          # cmd.Wait() does not return until every process that inherited those
          # pipe fds has closed them. An mc left retrying a slow S3 call after
          # the shell is gone keeps that pipe open, so the op runs past its
          # declared ceiling instead of being cut at it. In #4268 a sibling
          # script step of exactly this shape — `verify-every-bucket-takes-a-write`
          # in the `bucket-1-capacity` Test, on the branch that carries it — ran
          # 606s under a 300s ceiling for this reason; this step is capped because
          # it shares that shape, not because it produced that number. Per-command
          # caps stop any single call outliving its budget, so a hang fails fast
          # and legibly and the op `timeout` stays a backstop whose inner budgets
          # sit under its 5m ceiling: 2×30 for the two `k` reads + at most 9×15
          # for the `mc` calls (ten call sites, but the two cleanup `mc rm` are
          # mutually exclusive) + the 30s port-forward readiness wait = at most
          # 225s. mc and kubectl both exit on SIGTERM, matching the caps already
          # carried by the redis suite (`k`) and _lib/backup-access-preflight.sh
          # (`mc`). timeout execs its argument directly, so these wrappers do not
          # recurse.
          k()  { timeout 30 kubectl "$@"; }
          mc() { timeout 15 mc "$@"; }

          # Extract credentials for both users. Land the encoded value in a file
          # before decoding it: piping `k … | base64 -d` (no pipefail here) would
          # take base64's exit status and mask a timed-out `k` (exit 124), which
          # would then surface three lines down as an empty-credential `mc alias
          # set` instead of at the read. As two statements, `set -e` stops on the
          # `k` read itself.
          k -n "$NAMESPACE" get secret bucket-test-admin \
            -o jsonpath='{.data.BucketInfo}' > "$workdir/admin.b64"
          base64 -d "$workdir/admin.b64" > "$workdir/admin.json"
          k -n "$NAMESPACE" get secret bucket-test-viewer \
            -o jsonpath='{.data.BucketInfo}' > "$workdir/viewer.b64"
          base64 -d "$workdir/viewer.b64" > "$workdir/viewer.json"
          ADMIN_ACCESS_KEY=$(jq -r '.spec.secretS3.accessKeyID' "$workdir/admin.json")
          ADMIN_SECRET_KEY=$(jq -r '.spec.secretS3.accessSecretKey' "$workdir/admin.json")
          VIEWER_ACCESS_KEY=$(jq -r '.spec.secretS3.accessKeyID' "$workdir/viewer.json")
          VIEWER_SECRET_KEY=$(jq -r '.spec.secretS3.accessSecretKey' "$workdir/viewer.json")
          BUCKET_NAME=$(jq -r '.spec.bucketName' "$workdir/admin.json")

          # Port-forward to the S3 endpoint; cleaned up by the trap. This 30s is
          # a readiness deadline for the forward coming up (distinct from the 30s
          # apiserver-read cap in k()); if it never listens, timeout exits 124 and
          # `set -e` fails the step.
          kubectl port-forward service/seaweedfs-s3 -n tenant-root 8333:8333 >/dev/null 2>&1 &
          pf_pid=$!
          timeout 30 sh -ec 'until nc -z localhost 8333; do sleep 1; done'

          mc alias set rw-user https://localhost:8333 "$ADMIN_ACCESS_KEY" "$ADMIN_SECRET_KEY" --insecure
          mc alias set ro-user https://localhost:8333 "$VIEWER_ACCESS_KEY" "$VIEWER_SECRET_KEY" --insecure

          # Admin (readwrite) can upload, list, download
          echo "readwrite test" > "$workdir/rw-test.txt"
          mc cp --insecure "$workdir/rw-test.txt" "rw-user/$BUCKET_NAME/rw-test.txt"
          mc ls --insecure "rw-user/$BUCKET_NAME/rw-test.txt"
          mc cp --insecure "rw-user/$BUCKET_NAME/rw-test.txt" "$workdir/rw-test-download.txt"

          # Viewer (readonly) can list and download
          mc ls --insecure "ro-user/$BUCKET_NAME/rw-test.txt"
          mc cp --insecure "ro-user/$BUCKET_NAME/rw-test.txt" "$workdir/ro-test-download.txt"

          # Viewer (readonly) upload must be DENIED. accessPolicy=readonly
          # enforcement landed with seaweedfs-cosi-driver v0.3.1 (#1921,
          # eab9b034f), so a successful upload is a regression, not a known
          # gap — fail hard.
          # Capture the status rather than branching on `mc` directly: an `if`
          # suspends `set -e`, so a `timeout` firing here (exit 124) would be
          # indistinguishable from the access-denied non-zero this probe expects,
          # and a 15s hang on the deny path would read as a passed check. This is
          # the first `ro-user` write in the step — no earlier call exercised it —
          # so its health is not established elsewhere. Success (exit 0) is the
          # readonly regression; 124 is a timed-out probe; both fail. Any other
          # non-zero is the expected denial.
          echo "readonly test" > "$workdir/ro-test.txt"
          ro_status=0
          mc cp --insecure "$workdir/ro-test.txt" "ro-user/$BUCKET_NAME/ro-test.txt" || ro_status=$?
          if [ "$ro_status" -eq 0 ]; then
            echo "FAIL: read-only user must NOT be able to upload (accessPolicy=readonly regression; enforced since cosi-driver v0.3.1, #1921)" >&2
            # Drop the object the viewer should not have been able to create
            # (via the admin user, which is unambiguously allowed to delete).
            mc rm --insecure "rw-user/$BUCKET_NAME/ro-test.txt" || true
            exit 1
          fi
          if [ "$ro_status" -eq 124 ]; then
            echo "FAIL: read-only upload probe timed out at its 15s cap; the deny path is not proven healthy, so it cannot pass" >&2
            exit 1
          fi

          # Remove the test object so bucket cleanup is not blocked
          mc rm --insecure "rw-user/$BUCKET_NAME/rw-test.txt"
        check:
          ($error == null): true
# The Bucket CR was applied by chainsaw and is deleted automatically during
# cleanup — no explicit teardown step needed.
