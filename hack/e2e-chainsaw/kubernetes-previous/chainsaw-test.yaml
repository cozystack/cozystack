# Chainsaw port of hack/e2e-apps/kubernetes-previous.bats. See the sibling
# kubernetes-latest test for why the logic stays a script wrapping
# _lib/run-kubernetes.sh. This one targets the previous K8s version and skips
# the ouroboros addon (no 4th arg).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kubernetes-previous
spec:
  catch:
  - events: {}
  steps:
  - name: tenant-kubernetes-previous-version
    try:
    - script:
        # The on-failure diagnostics phase carries its own 7m wall-clock budget
        # (COZY_DIAG_PHASE_BUDGET in _lib/run-kubernetes.sh): once it is spent, the
        # collectors that have not started are declined out loud rather than
        # attempted, so the in-process tenant crust-gather snapshot, the one the
        # failing exit triggers and the largest artifact this path produces, still
        # has its time. Why that budget and not another is derived beside it, from
        # the op ceiling here minus the bringup and the snapshot; it is not repeated
        # here, because a number kept in two places is a number that drifts.
        #
        # What this ceiling covers, in the order the phase spends it, cheapest first
        # so that a budget running out drops the collectors that cost minutes rather
        # than the reads that discriminate between failure modes:
        #   node-join diagnostics reads
        #   worker network counters
        #   worker block IO counters
        #   serial-console family (~6m25s at worst, ~4m05s at the pool's minimum)
        #   worker CPU usage and throttling counters, two samples
        #   sandbox node CPU time, two samples
        #   worker per-thread CPU time inside virt-launcher, two samples
        #     (those alternate rather than run to completion in turn: each takes
        #     its first reading, one wait passes, each takes its second)
        #   guest Talos capture
        #   ghcr-mirror state, access log and warm-up Job
        #   talos-image-cache diagnosis
        # The four collectors that bracket the node-join wait -- the sandbox
        # kernel KVM counters, the runner kernel CPU time, the sandbox QEMU
        # thread time and the runner fixed-work canary -- sit outside this order
        # on purpose: each is ungated and taken before the wait and right after
        # it on both paths, and their cost arms live in the budget guard rather
        # than in this list. Three of the four are reads: the KVM counters and
        # the runner kernel CPU time are one bounded read a side, and the QEMU
        # thread time is a bounded probe walk plus a bounded read of each
        # sandbox pid file. The canary is two arms of fixed work under a ceiling
        # of its own apiece, and it is the one of the four that costs a core
        # rather than a read, which is why it runs outside the brackets of the
        # other three rather than among them.
        # and then, after the phase rather than inside it, the in-process tenant
        # crust-gather snapshot.
        #
        # Those do not fit what is left of this op once the bringup ahead of them and
        # the snapshot behind them are counted, which is why the phase is bounded as a
        # phase rather than this ceiling raised. None of it is a worst case and none is
        # claimed: several of those collectors carry no wall-clock bound at all, and
        # the bringup's own waits already exceed this op on ceilings before a single
        # diagnostic runs, and the pre-wait halves of the four readings above spend
        # inside that bringup rather than inside this phase. Those residuals are
        # tracked in cozystack/cozystack#3666.
        timeout: 50m
        # Co-locate the tenant crust-gather snapshot (captured by
        # run-kubernetes.sh on failure) under the same snapshots/<test>/ dir as
        # the global .chainsaw.yaml catch's host snapshot.
        env:
        - name: COZY_SNAPSHOT_NAME
          value: ($test.metadata.name)
        content: |
          set -eu
          cd ../../..
          . hack/e2e-chainsaw/_lib/run-kubernetes.sh
          run_kubernetes_test 'keys | sort_by(.) | .[-2]' 'test-previous-version' '59992'
        check:
          ($error == null): true
    finally:
    # Always runs after try/catch — i.e. after the crust-gather snapshots on a
    # failed run. Reclaims the tenant Kubernetes cluster, which run_kubernetes_test
    # applies imperatively (kubectl), so Chainsaw's auto-cleanup does not track it.
    # On success run_kubernetes_test already tore it down, so this is a no-op then.
    - description: tear down the tenant Kubernetes cluster
      script:
        timeout: 10m
        content: |
          set -eu
          cd ../../..
          . hack/e2e-chainsaw/_lib/run-kubernetes.sh
          cozy_cleanup
