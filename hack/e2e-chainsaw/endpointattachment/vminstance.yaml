# external stays false: the attachment is the only external Service on this
# VM. Current cozy-proxy holds one 1:1 slot per pod, so a chart-rendered
# external Service beside an attachment would steal it back and forth.
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: ea-vm
spec:
  external: false
  running: true
  instanceType: "u1.medium"
  instanceProfile: ubuntu
  disks:
    - name: ea-vm
  gpus: []
  sshKeys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPht0dPk5qQ+54g1hSX7A6AUxXJW5T6n/3d7Ga2F8gTF
    test@test
  cloudInit: |
    #cloud-config
    users:
      - name: test
        shell: /bin/bash
        sudo: ['ALL=(ALL) NOPASSWD: ALL']
        groups: sudo
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPht0dPk5qQ+54g1hSX7A6AUxXJW5T6n/3d7Ga2F8gTF test@test
  cloudInitSeed: ""
