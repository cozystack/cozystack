# To-copy restore. Targets the empty mongodb-target MongoDB app from
# 20-mongodb-target.yaml; the driver creates a PerconaServerMongoDBRestore CR
# with clusterName=mongodb-mongodb-target and a backupSource pointing at the
# source backup's S3 destination, so the operator replays the logical dump into
# the target while mongodb-src stays running and untouched.
#
# The restore is selective. It copies the databases mongodb-target declares
# under spec.databases (demo) and leaves the target's own system users and
# Secrets as they are, and the RestoreJob reports Succeeded once the target
# cluster reports ready again after it.
#
# Driven for the same-namespace happy path by run-all.sh in this directory and
# the mongodb-2-backup-roundtrip Chainsaw suite, also applicable manually with
# kubectl apply -f. The cross-tenant variant stays manual, see the README for
# the network-policy reason.
---
apiVersion: backups.cozystack.io/v1alpha1
kind: RestoreJob
metadata:
  name: mongodb-src-to-mongodb-target
spec:
  backupRef:
    name: mongodb-src-adhoc
  targetApplicationRef:
    apiGroup: apps.cozystack.io
    kind: MongoDB
    name: mongodb-target
