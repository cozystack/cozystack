# Ad-hoc BackupJob routed to this demo's kafka-metadata BackupClass, which maps
# apps.cozystack.io/Kafka to the demo kafka-strategy-default (derived from the
# shipped cozy-default-kafka by run-all.sh, targeting an in-cluster S3 endpoint).
# The produced Backup is named after this BackupJob.
apiVersion: backups.cozystack.io/v1alpha1
kind: BackupJob
metadata:
  name: kafka-meta-src-adhoc
  namespace: tenant-root
spec:
  applicationRef:
    apiGroup: apps.cozystack.io
    kind: Kafka
    name: kafka-meta-src
  backupClassName: kafka-metadata
