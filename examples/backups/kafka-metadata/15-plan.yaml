# A scheduled Plan: the Plan controller stamps a BackupJob per cron tick against
# the cozy-default BackupClass. Shown for completeness; run-all.sh drives the
# ad-hoc BackupJob above instead, so it does not wait on the cron.
apiVersion: backups.cozystack.io/v1alpha1
kind: Plan
metadata:
  name: kafka-meta-src-daily
  namespace: tenant-root
spec:
  applicationRef:
    apiGroup: apps.cozystack.io
    kind: Kafka
    name: kafka-meta-src
  backupClassName: cozy-default
  schedule:
    cron: "0 3 * * *"
