# Ad-hoc backup of the source RabbitMQ, routed through this demo's rabbitmq-default
# BackupClass. The driver renders the rabbitmq-strategy-default strategy, which
# exports broker definitions to this demo's Bucket. On success the BackupJob
# reports status.backupRef.name — the Backup this demo restores from.
apiVersion: backups.cozystack.io/v1alpha1
kind: BackupJob
metadata:
  name: rabbitmq-src-adhoc
spec:
  applicationRef:
    apiGroup: apps.cozystack.io
    kind: RabbitMQ
    name: rabbitmq-src
  backupClassName: rabbitmq-default
