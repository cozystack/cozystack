# Source RabbitMQ application. Note there is no `backup:` block: the S3
# coordinates live on the Rabbitmq strategy (03-rabbitmq-strategy.yaml), whose
# Pod does the definitions export, not on the application. The application chart
# is unmodified.
apiVersion: apps.cozystack.io/v1alpha1
kind: RabbitMQ
metadata:
  name: rabbitmq-src
spec:
  replicas: 1
  size: 1Gi
  resourcesPreset: c1.small
  version: v4.2
