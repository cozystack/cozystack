# Maps Kind=Redis to this demo's Redis strategy. BackupClass is cluster-scoped,
# so a single instance covers every namespace. Named redis-default so it does
# not collide with the platform cozy-default class, which routes Redis to the
# shipped cozy-default-redis strategy.
---
apiVersion: backups.cozystack.io/v1alpha1
kind: BackupClass
metadata:
  name: redis-default
spec:
  strategies:
    - application:
        apiGroup: apps.cozystack.io
        kind: Redis
      strategyRef:
        apiGroup: strategy.backups.cozystack.io
        kind: Redis
        name: redis-strategy-default
