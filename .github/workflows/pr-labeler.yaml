name: PR Auto-Label

on:
  pull_request_target:
    # Note: 'edited' is intentionally omitted. It fires on every PR body edit,
    # which causes long-lived bot PRs (e.g. Renovate) to re-run this job dozens
    # of times on an unchanged commit. Labels are re-applied on the next push
    # (synchronize) or reopen instead.
    types: [opened, reopened, synchronize]

# Top-level token defaults to read-only. A job-level block replaces this one
# rather than adding to it, so each job restates every scope it needs.
permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Apply labels from PR title
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Conventional Commits types accepted by Cozystack (per docs/agents/contributing.md):
            //   feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
            // Mapping below maps a subset to kind/* — types not listed do not produce a kind/*.
            const typeToKind = {
              feat:     'kind/feature',
              fix:      'kind/bug',
              docs:     'kind/documentation',
              chore:    'kind/cleanup',
              refactor: 'kind/cleanup',
              // style, perf, test, build, ci, revert — no kind mapping
            };

            // scope -> area/* mapping. Keys are the scopes observed in cozystack issues
            // and PRs. Add new entries when a scope recurs (3+ times).
            const scopeToArea = {
              // area/api
              'api':                 'area/api',
              'cozystack-api':       'area/api',

              // area/ai
              'agents':              'area/ai',
              'ai':                  'area/ai',

              // area/build
              'build':               'area/build',

              // area/ci
              'ci':                  'area/ci',

              // area/dependencies — Renovate uses scope `deps` (see .github/renovate.json)
              'deps':                'area/dependencies',

              // area/dashboard
              'dashboard':           'area/dashboard',
              'cozystack-ui':        'area/dashboard',
              'console':             'area/dashboard',

              // area/database
              'postgres':            'area/database',
              'postgres-operator':   'area/database',
              'mariadb':             'area/database',
              'mariadb-operator':    'area/database',
              'redis':               'area/database',
              'etcd':                'area/database',
              'kafka':               'area/database',
              'clickhouse':          'area/database',
              'mongodb':             'area/database',

              // area/extra
              'extra':               'area/extra',

              // area/kamaji
              'kamaji':              'area/kamaji',

              // area/keycloak
              'keycloak':            'area/keycloak',

              // area/kubernetes
              'kubernetes':          'area/kubernetes',
              'apps/kubernetes':     'area/kubernetes',

              // area/monitoring
              'monitoring':          'area/monitoring',
              'metrics-server':      'area/monitoring',
              'vlogs':               'area/monitoring',
              'vmstack':             'area/monitoring',
              'grafana':             'area/monitoring',
              'workloadmonitor':     'area/monitoring',

              // area/networking
              'ingress':             'area/networking',
              'ingress-nginx':       'area/networking',
              'gateway':             'area/networking',
              'vpn':                 'area/networking',
              'metallb':             'area/networking',
              'kube-ovn':            'area/networking',
              'tcp-balancer':        'area/networking',
              'securitygroups':      'area/networking',
              'cozy-proxy':          'area/networking',

              // area/cilium
              'cilium':              'area/cilium',

              // area/platform
              'platform':            'area/platform',
              'cert-manager':        'area/platform',
              'external-secrets':    'area/platform',
              'bundle':              'area/platform',
              'flux':                'area/platform',
              'fluxcd':              'area/platform',
              'cluster-api':         'area/platform',
              'talos':               'area/platform',
              'installer':           'area/platform',
              'cozyctl':             'area/platform',
              'cozystack-engine':    'area/platform',
              'cozy-lib':            'area/platform',

              // area/release
              'backport':            'area/release',
              'release':             'area/release',

              // area/storage
              'seaweedfs':           'area/storage',
              'seaweedfs-cosi-driver': 'area/storage',
              'objectstorage-controller': 'area/storage',
              'bucket':              'area/storage',
              'linstor':             'area/storage',
              'velero':              'area/storage',
              'harbor':              'area/storage',
              'backups':             'area/storage',
              'csi':                 'area/storage',

              // area/tenant
              'tenant':              'area/tenant',

              // area/testing
              'tests':               'area/testing',
              'e2e':                 'area/testing',

              // area/virtualization
              'kubevirt':            'area/virtualization',
              'cdi':                 'area/virtualization',
              'vmi':                 'area/virtualization',
              'vm-import':           'area/virtualization',
              'virtual-machine':     'area/virtualization',
              'hami':                'area/virtualization',
              'gpu-operator':        'area/virtualization',
            };

            const pr = context.payload.pull_request;
            const title = pr.title || '';
            const body  = pr.body  || '';
            const existing = new Set((pr.labels || []).map(l => l.name));
            const toAdd = new Set();

            // 1. Strip "[Backport release-1.x]" prefix if present.
            const backportMatch = title.match(/^\[Backport ([^\]]+)\]\s+(.+)$/);
            const cleanTitle = backportMatch ? backportMatch[2] : title;
            if (backportMatch) {
              toAdd.add('area/release');
            }

            // 2. Try Conventional Commits form: type(scope)?(!)?: description
            const conv = cleanTitle.match(/^([a-z]+)(?:\(([^)]+)\))?(!)?:\s*.+$/);
            // 3. Fall back to bracket form: [scope] description
            const bracket = !conv && cleanTitle.match(/^\[([^\]]+)\]\s+.+$/);

            let type = null, scopeStr = null, breaking = false;
            if (conv) {
              type = conv[1];
              scopeStr = conv[2] || null;
              breaking = !!conv[3];
            } else if (bracket) {
              scopeStr = bracket[1];
            }

            // 4. Detect BREAKING CHANGE: or BREAKING-CHANGE: footer in body.
            // Conventional Commits 1.0 spec item 16 treats them as synonymous.
            if (/^BREAKING[ -]CHANGE:/m.test(body)) {
              breaking = true;
            }

            // 5. Apply kind/* from type.
            if (type) {
              if (typeToKind[type]) {
                toAdd.add(typeToKind[type]);
              } else {
                core.warning(`type "${type}" has no kind/* mapping — typo or new type? See .github/workflows/pr-labeler.yaml typeToKind`);
              }
            }

            // 6. Apply area/* from scope. Composite scopes split on comma.
            const scopes = (scopeStr || '')
              .split(/,\s*/)
              .map(s => s.trim())
              .filter(Boolean);
            for (const s of scopes) {
              if (scopeToArea[s]) {
                toAdd.add(scopeToArea[s]);
              } else {
                core.warning(`scope "${s}" has no area/* mapping — consider extending scopeToArea in .github/workflows/pr-labeler.yaml if it recurs`);
              }
            }

            // 7. kind/breaking-change.
            if (breaking) {
              toAdd.add('kind/breaking-change');
            }

            // 8. Fallback: no area/* applied -> area/uncategorized.
            const hasArea = [...toAdd].some(l => l.startsWith('area/'));
            if (!hasArea) {
              toAdd.add('area/uncategorized');
            }

            // 9. `backport` on a fix — seeded ONCE, on `opened`, and never again.
            //
            // Every label above is a DERIVATION from the title: it re-applies on
            // every run, and that is correct, because a human removing kind/bug
            // from a `fix(...)` PR is removing a fact. `backport` is a different
            // kind of label — a human DECISION with a default. Forgetting it costs
            // a release-branch fix, so the default is "yes"; removing it during
            // review is cheap, so the escape hatch is removal.
            //
            // That only works if removal sticks, which is why the action is part
            // of the condition. This workflow runs on `opened`, `reopened` and
            // `synchronize`, so re-applying `backport` on the derivation path would
            // bring it back with the next push and make removal fiction — worse
            // than no default at all, because it would look like it works.
            // `opened` fires exactly once per PR and is the one moment when nobody
            // has had the chance to decide yet.
            //
            // `reopened` is excluded on purpose: a reopen follows a close, by which
            // point the label has usually already been considered, and a decision
            // must survive close/reopen.
            //
            // Seeding once has a price, and it is one-sided: a PR that becomes a
            // `fix` only AFTER it is opened never gets the default. Retitled from
            // `feat` to `fix`, rescoped out of an excluded scope, opened before this
            // workflow existed, or opened while its own run failed — each of those
            // gets the derivations re-applied on the next push and no `backport`.
            // A maintainer adds the label by hand, exactly as today. Every one of
            // those is a missing default, never a resurrected label, which is the
            // direction this has to fail in.
            //
            // So do NOT "fix the inconsistency" by moving this in with kind/* and
            // area/* above. The asymmetry is the feature.
            const NO_BACKPORT_SCOPES = new Set([
              // Main-only or meta: CI, test suites, build plumbing, dependency
              // bumps (`deps` is what Renovate emits, see .github/renovate.json),
              // agent instructions, and release/backport tooling. A release branch
              // does not run this code, and a cherry-pick of it is noise at best.
              'ci', 'e2e', 'tests', 'build', 'deps', 'agents', 'release', 'backport',
              // Preventive, not observed: `migrations` appears in no recent PR
              // title and has no area/* mapping. It is listed because a migration
              // backported without diffing the version slot across branches makes
              // the NEWER branch silently skip its own migration at that slot — see
              // "Backporting code that touches monotonic counters" in
              // docs/release.md. That needs a human who has read the slot state on
              // both branches, never a default.
              'migrations',
            ]);
            // ANY excluded scope suppresses, rather than requiring all of them to
            // be excluded. `fix(platform,ci): ...` is precisely the shape that
            // drags main-only content into a release branch, and a composite scope
            // is the labeler's weakest signal about what the diff really touches.
            // Suppressing costs a maintainer one click to add the label back;
            // defaulting costs a wrong backport that reads as reviewed.
            const excludedScope = scopes.some(s => NO_BACKPORT_SCOPES.has(s));
            if (
              context.payload.action === 'opened' &&
              type === 'fix' &&
              // Not on a backport PR itself — reusing the detector from step 1
              // rather than adding a second one. Auto-labeling these is what
              // caused recursive backports (see docs/release.md).
              !backportMatch &&
              // A breaking fix must never default into a patch release line.
              !breaking &&
              !excludedScope
            ) {
              toAdd.add('backport');
            }
            // What the default buys: a fix no longer misses a release branch
            // because nobody remembered a label, and backport.yaml fires only on
            // merge (`pull_request.merged == true`), so the whole review window is
            // available to remove it.
            //
            // What it does not buy, and what a reviewer still owns: whether this
            // change BELONGS on the release line, and whether the backport PR the
            // merge produces contains only this change. backport.yaml's
            // `conflict_resolution: draft_commit_conflicts` covers a conflict — it
            // cannot cover a backport that applies CLEANLY and wrongly, because
            // korthout/backport-action imports whole files the target branch lacks.
            // A fix to code that does not exist on the release branch can land and
            // drag unrelated content in with it; that is how the #3282 backport to
            // release-1.5 pulled in a breaking change. The exclusion list narrows
            // that window and does not close it.

            // 10. Additive only — never remove existing labels.
            const newLabels = [...toAdd].filter(l => !existing.has(l));
            if (newLabels.length === 0) {
              core.info('No new labels to apply');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: newLabels,
            });
            core.info(`Applied labels: ${newLabels.join(', ')}`);
