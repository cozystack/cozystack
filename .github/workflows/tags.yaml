name: Versioned Tag

on:
  push:
    tags:
      - 'v*.*.*'          # vX.Y.Z
      - 'v*.*.*-rc.*'     # vX.Y.Z-rc.N
      - 'v*.*.*-beta.*'   # vX.Y.Z-beta.N
      - 'v*.*.*-alpha.*'  # vX.Y.Z-alpha.N

concurrency:
  group: tags-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Top-level token defaults to read-only. A job-level block replaces this one
# rather than adding to it, so each job restates every scope it needs.
permissions:
  contents: read

jobs:
  # The pre-release's images built natively for arm64 and pushed as
  # <tag>-arm64, beside build-amd64, for prepare-release to stitch the two. A
  # stable tag is never built (promotion copies the rc's indexes), so it skips
  # this job. The packages artifact and the installer chart carry no
  # architecture, so this job builds neither; build-amd64 pushes them pinned
  # on amd64 digests and prepare-release republishes them repinned. The talos
  # installer and matchbox are built for both arches in build-amd64, and the
  # e2e sandbox is amd64 only, so none of them has an arm64 half here.
  build-arm64:
    name: Build arm64 images
    if: contains(github.ref_name, '-')
    runs-on: oracle-vm-24cpu-96gb-arm64
    # Starts from build-amd64's budget; re-measure after the first runs.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      # The same no-op build-amd64 makes on a re-run of an rc whose release
      # already exists, so the re-run does not rebuild arm64 for nothing. This
      # token cannot see a draft, but an rc's release is published by the time
      # it has been prepared; a draft left by a run that failed before that is
      # rebuilt, which is the safe direction.
      - name: Check if release already exists
        id: check_release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 100
            });
            const exists = releases.some(r => r.tag_name === tag);
            core.setOutput('release_exists', exists);
            console.log(exists ? `Release ${tag} already exists, nothing to build` : `No release ${tag} yet`);

      - name: Checkout code
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up build toolchain
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          command -V docker jq yq
          yq --version | grep -q mikefarah

      - name: Login to GHCR
        if: steps.check_release.outputs.release_exists == 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      - name: Login to OCIR (build cache)
        if: steps.check_release.outputs.release_exists == 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.OCIR_USER }}
          password: ${{ secrets.OCIR_TOKEN }}
          registry: iad.ocir.io
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      # docker.io pulls go through the mirror in hack/buildkitd.toml, as the
      # PR builds' do: anonymous Docker Hub pulls from these runners are rate
      # limited.
      - name: Set up Buildx (docker-container driver, docker.io mirror)
        if: steps.check_release.outputs.release_exists == 'false'
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          buildkitd-config: hack/buildkitd.toml
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      - name: Build arm64 images
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          # Assigned and checked before the loop: a build-matrix.sh failure
          # inside `for unit in $(...)` would run no iteration and leave a
          # green job that built nothing.
          units="$(MATRIX_ARCH=arm64 hack/build-matrix.sh | jq -r '.[]')"
          [ -n "$units" ]
          for unit in $units; do
            make -C "$unit" image
          done
          make -C packages/core/installer image-operator
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
          BUILDER: ${{ steps.buildx.outputs.name }}
          PLATFORM: linux/arm64
          CACHE_REGISTRY: iad.ocir.io/idyksih5sir9/cozystack
          # Read the arm64 cache build-arm64-nightly.yaml keeps warm; a release
          # build never writes one.
          CACHE_TAG: buildcache-arm64
          WRITE_CACHE: '0'
          IMAGE_TAG: ${{ github.ref_name }}-arm64
          PUBLISH_VERSIONED: '0'
          PUBLISH_FLOATING: '0'

  # The amd64 half of a pre-release build, run beside build-arm64 rather than
  # after it: the images, the stamped tree and the release assets. Its make
  # build also pushes the packages artifact and the installer chart pinned on
  # amd64 digests. The stitch, the gate, the republish of both and the release
  # itself happen in prepare-release once both halves are built, so the tree,
  # the log of pushed tags and the assets travel there as artifacts.
  # It runs for every tag, since the release-exists no-op and the rejection of
  # a hand-pushed stable tag live here.
  build-amd64:
    name: Build amd64 images and assets
    # Ephemeral pool, not the dedicated self-hosted runner (#2937 decommission).
    # Serial `make build` + `make assets` is CPU-bound, so use the large shape —
    # same as the main cache warmer (build-main.yaml).
    runs-on: oracle-vm-24cpu-96gb-x86-64
    # The budget prepare-release had while it also built; the stitch and the
    # uploads it no longer runs moved to prepare-release with their own.
    timeout-minutes: 120
    outputs:
      # A release (draft or published) already exists for this tag, so the
      # build/draft/branch/PR steps are no-ops. Downstream jobs that still need
      # to run on an existing release (changelog, website docs) must NOT gate on
      # this — it means "skip the rebuild", not "skip everything".
      release_exists: ${{ steps.check_release.outputs.release_exists }}
      tag: ${{ steps.tag.outputs.tag }}
      is_rc: ${{ steps.tag.outputs.is_rc }}
    permissions:
      # contents: write only so the release listing includes drafts.
      contents: write
      packages: write

    steps:
      # Skip the build when a release (draft OR published) already exists for
      # this tag:
      #   - re-runs of the same rc/nightly tag become idempotent no-ops;
      #   - a stable tag prepared by the promote flow must NOT be rebuilt here.
      #     promote-rc.yaml creates the draft vX.Y.Z from the already-built,
      #     already-tested rc artifacts; promotion ships those exact bits, never
      #     a fresh build. When finalize pushes the stable tag, this guard sees
      #     the draft and skips straight to changelog/website.
      - name: Check if release already exists
        id: check_release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Paginate: a promote-created stable draft (or an accreting backlog
            // of rc releases) can sit past the default first 30, and a missed
            // draft here would wrongly rebuild instead of no-op.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 100
            });
            const exists = releases.some(r => r.tag_name === tag);
            core.setOutput('release_exists', exists);
            console.log(exists ? `Release ${tag} already exists (draft or published)` : `No release ${tag} yet`);

      # If a published release already exists, skip the rest of the workflow
      - name: Skip if release already exists
        if: steps.check_release.outputs.release_exists == 'true'
        run: echo "Release already exists, skipping workflow."

      # Parse tag meta-data (rc?, maintenance line, etc.)
      - name: Parse tag
        if: steps.check_release.outputs.release_exists == 'false'
        id: tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const ref = context.ref.replace('refs/tags/', '');           // e.g. v0.31.5-rc.1
            const m = ref.match(/^v(\d+\.\d+\.\d+)(-(?:alpha|beta|rc)\.\d+)?$/);        // ['0.31.5', '-rc.1' | '-beta.1' | …]
            if (!m) {
              core.setFailed(`❌ tag '${ref}' must match 'vX.Y.Z' or 'vX.Y.Z-(alpha|beta|rc).N'`);
              return;
            }
            const version = m[1] + (m[2] ?? '');                         // 0.31.5-rc.1
            const isRc    = Boolean(m[2]);
            const [maj, min] = m[1].split('.');
            core.setOutput('tag',     ref);                              // v0.31.5-rc.1
            core.setOutput('version', version);                          // 0.31.5-rc.1
            core.setOutput('is_rc',   isRc);                             // true
            core.setOutput('is_stable', !isRc);                          // true only for a plain vX.Y.Z
            core.setOutput('line',    `${maj}.${min}`);                  // 0.31

      # A stable vX.Y.Z tag must never build here. Stable tags are cut by
      # finalize (pull-requests-release.yaml) at a promote PR's merge commit, by
      # which point a draft release already exists (release_exists=true) and the
      # build/draft/branch steps below are skipped. So a stable tag with NO
      # pre-existing draft is a hand-push down the legacy full-rebuild path:
      # fail fast rather than rebuild with release semantics, move :latest, and
      # open a rogue release PR — silently violating the promotion invariant.
      - name: Reject hand-pushed stable tags
        if: steps.check_release.outputs.release_exists == 'false' && steps.tag.outputs.is_stable == 'true'
        run: |
          echo "::error::Stable tag ${GITHUB_REF#refs/tags/} has no pre-existing draft release. Stable tags are finalized by the promote flow at the merge commit — cut a pre-release (vX.Y.Z-rc.N) with the 'Cut Pre-release Tag' workflow and promote it; do not push vX.Y.Z by hand."
          exit 1

      # Detect base branch (main or release-X.Y) the tag was pushed from
      - name: Get base branch
        if: steps.check_release.outputs.release_exists == 'false'
        id: get_base
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const baseRef = context.payload.base_ref;
            if (!baseRef) {
              core.setFailed(`❌ base_ref is empty — the tag was not pushed at a branch tip. Cut pre-release tags with the 'Cut Pre-release Tag' workflow (workflow_dispatch), which pushes the tag correctly.`);
              return;
            }
            const branch = baseRef.replace('refs/heads/', '');
            const ok     = branch === 'main' || /^release-\d+\.\d+$/.test(branch);
            if (!ok) {
              core.setFailed(`❌ Tagged commit must belong to 'main' or 'release-X.Y'. Got '${branch}'`);
              return;
            }
            core.setOutput('branch', branch);

      - name: Checkout code
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags:  true
          persist-credentials: false

      # Ephemeral runners lack the flux CLI the installer's image-packages step
      # shells out to.
      - name: Set up flux
        if: steps.check_release.outputs.release_exists == 'false'
        uses: fluxcd/flux2/action@04acaec6161ac4fb1a82ffafa88901c03271d34f # v2.8.6
        with:
          version: "2.8.6"

      - name: Login to GHCR
        if: steps.check_release.outputs.release_exists == 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      # Read-only access to the shared mode=max build cache that build-main.yaml
      # writes to OCIR. Release builds push images to GHCR but warm-start from
      # that cache — without it every tag build on an ephemeral runner is 100%
      # cold (the persistent runner used to warm-start from local buildkit state).
      - name: Login to OCIR (build cache)
        if: steps.check_release.outputs.release_exists == 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.OCIR_USER }}
          password: ${{ secrets.OCIR_TOKEN }}
          registry: iad.ocir.io
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      # Only for the matchbox rebuild below: the default docker driver cannot
      # build an index, and `use: false` keeps make build on that driver.
      - name: Set up Buildx for matchbox (docker-container driver)
        if: steps.check_release.outputs.release_exists == 'false'
        id: matchbox_buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          buildkitd-config: hack/buildkitd.toml
          use: false
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      # Build project artifacts
      - name: Build
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          mkdir -p "${PUSHED_TAGS_LOG%/*}"
          make build
          # The arm64 assets published below install this image, and building
          # its arm64 half needs no QEMU, so it is pushed again as both arches.
          make -C packages/core/talos image-talos PLATFORM=linux/amd64,linux/arm64
          # The arm64 leg skips the talos package, so matchbox gets no arm64
          # half to stitch. Its Dockerfile only copies files, so both arches
          # build here without QEMU and the stamped ref pins the index.
          make -C packages/core/talos image-matchbox PLATFORM=linux/amd64,linux/arm64 BUILDER="$MATCHBOX_BUILDER"
        env:
          MATCHBOX_BUILDER: ${{ steps.matchbox_buildx.outputs.name }}
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
          # Cache manifests are registry-portable (oci-mediatypes=true) — read
          # them from OCIR while pushing images to GHCR. A missing :buildcache
          # ref 404s harmlessly into a cold build.
          CACHE_REGISTRY: iad.ocir.io/idyksih5sir9/cozystack
          # amd64 here; build-arm64 builds arm64 natively. This job also
          # builds on the default docker driver, which handles a
          # multi-platform image only on the containerd image store.
          PLATFORM: linux/amd64
          # Push the release tag as :IMAGE_TAG (vX.Y.Z-rc.N) and the component
          # versions as :<component-ver>. Deliberately NO PUBLISH_FLOATING: this
          # job only ever runs for a prerelease (a stable tag is rejected or
          # skips), so moving :latest here would point it at the newest rc — and
          # an rc on an old line would drag it backwards. :latest belongs to
          # promotion, which moves it only for the newest stable (finalize).
          IMAGE_TAG: ${{ github.ref_name }}
          PUBLISH_VERSIONED: '1'
          # Every tag the build pushes, for the stitch to move onto the
          # multi-arch indexes.
          PUSHED_TAGS_LOG: ${{ runner.temp }}/release-tree/pushed-tags

      # Built here rather than in prepare-release: the Talos assets reuse the
      # kernel, initramfs and installer make build already produced for the
      # images, and they build while the arm64 half is still running.
      - name: Build assets
        if: steps.check_release.outputs.release_exists == 'false'
        run: make assets

      # --cached after adding everything, so a file the build created travels
      # too, not only the ones it changed.
      - name: Capture the stamped tree
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          git add --all
          git diff --cached --binary HEAD >"${{ runner.temp }}/release-tree/stamped-tree.patch"

      - name: Upload the stamped tree and the pushed tags
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tree
          path: ${{ runner.temp }}/release-tree/
          if-no-files-found: error
          # The same window as release-assets: a re-run of prepare-release
          # needs both.
          retention-days: 7

      # The installer tarballs, one per arch, are what the build pushed as the
      # talos image and are not release assets.
      - name: Upload the assets
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            _out/assets/
            !_out/assets/installer-*.tar
          if-no-files-found: error
          # Long enough to re-run failed jobs; the assets are several GB.
          retention-days: 7

  prepare-release:
    name: Prepare Release
    needs: [build-amd64, build-arm64]
    # build-arm64 is skipped only for a stable tag, which never builds. On a
    # pre-release, either half failing or being cancelled leaves this job
    # skipped and the run red: an rc ships multi-arch or not at all.
    if: ${{ !cancelled() && needs.build-amd64.result == 'success' && (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped') }}
    runs-on: oracle-vm-24cpu-96gb-x86-64
    # The stitch reads and writes every first-party image once, then the
    # packages artifact, the chart and the assets are pushed; start there and
    # re-measure after the first runs.
    timeout-minutes: 60
    outputs:
      release_exists: ${{ needs.build-amd64.outputs.release_exists }}
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: write

    steps:
      - name: Generate GitHub App token
        if: needs.build-amd64.outputs.release_exists == 'false'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.COZYSTACK_CI_APP_ID }}
          private-key: ${{ secrets.COZYSTACK_CI_PRIVATE_KEY }}
          owner: cozystack

      - name: Checkout code
        if: needs.build-amd64.outputs.release_exists == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags:  true

      # The stitch and the multi-arch gate read the registry with skopeo and
      # the tree with mikefarah yq; the republish needs flux and helm.
      - name: Set up flux
        if: needs.build-amd64.outputs.release_exists == 'false'
        uses: fluxcd/flux2/action@04acaec6161ac4fb1a82ffafa88901c03271d34f # v2.8.6
        with:
          version: "2.8.6"
      - name: Set up build toolchain
        if: needs.build-amd64.outputs.release_exists == 'false'
        run: |
          command -v skopeo >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          command -V skopeo jq yq helm
          yq --version | grep -q mikefarah

      - name: Login to GHCR
        if: needs.build-amd64.outputs.release_exists == 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      - name: Download the amd64 build
        if: needs.build-amd64.outputs.release_exists == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-tree
          path: ${{ runner.temp }}/release-tree

      - name: Download the assets
        if: needs.build-amd64.outputs.release_exists == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: _out/assets

      - name: Apply the stamped tree
        if: needs.build-amd64.outputs.release_exists == 'false'
        run: git apply --binary "${{ runner.temp }}/release-tree/stamped-tree.patch"

      # Join each image with its arm64 twin, moving every tag the amd64 build
      # pushed for it, and gate on the result, then republish the packages
      # artifact and the installer chart from the repinned tree: the amd64
      # build pushed both pinned on amd64-only digests, and the chart's values
      # pin the operator image and the artifact digest.
      - name: Stitch multi-arch indexes and republish
        if: needs.build-amd64.outputs.release_exists == 'false'
        run: |
          set -eu
          hack/stitch-multiarch.sh packages "$REGISTRY" "$IMAGE_TAG"
          hack/verify-multiarch.sh packages
          make -C packages/core/installer image-packages chart
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/.docker/config.json
          REGISTRY: ghcr.io/cozystack/cozystack
          IMAGE_TAG: ${{ github.ref_name }}
          PUSHED_TAGS_LOG: ${{ runner.temp }}/release-tree/pushed-tags

      # Commit built artifacts
      - name: Commit release artifacts
        if: needs.build-amd64.outputs.release_exists == 'false'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name  "cozystack-ci[bot]"
          git config user.email "274107086+cozystack-ci[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}
          git config --unset-all http.https://github.com/.extraheader || true
          git add .
          git commit -m "Prepare release ${GITHUB_REF#refs/tags/}" -s || echo "No changes to commit"

      # NB: the api/apps/v1alpha1/vX.Y.Z Go-module tag is NOT cut here. Under the
      # promote flow this job only ever runs for an rc (a stable tag always finds
      # its draft and skips, and a stable tag WITHOUT a draft is rejected above),
      # and an rc must never get an immutable Go-module tag. The stable submodule
      # tag is cut by pull-requests-release.yaml finalize, at the stable tag's
      # merge commit (#2677 goal 3).

      # Create or reuse draft release
      - name: Create / reuse draft release
        if: needs.build-amd64.outputs.release_exists == 'false'
        id: release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tag      = '${{ needs.build-amd64.outputs.tag }}';
            const isRc     = ${{ needs.build-amd64.outputs.is_rc }};
            // Paginate: the default page is 30, and promote-created stable drafts
            // plus accreting rc releases can push an in-flight draft off it.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 100
            });

            let rel = releases.find(r => r.tag_name === tag);
            if (!rel) {
              rel = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                tag_name:   tag,
                name:       tag,
                draft:      true,
                prerelease: isRc               // no make_latest for drafts
              });
              console.log(`Draft release created for ${tag}`);
            } else {
              console.log(`Re-using existing release ${tag}`);
            }

            core.setOutput('upload_url', rel.upload_url);

      # The assets were built by build-amd64; the operator manifests are
      # rendered here, from the tree pinned on the index digests.
      - name: Upload assets
        if: needs.build-amd64.outputs.release_exists == 'false'
        run: make upload_assets VERSION=${{ needs.build-amd64.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the rc release once its assets are uploaded. The draft above is
      # created draft; a stable draft stays draft for finalize to publish, but an
      # rc has no later publish step — and the whole point of an rc is to be
      # publicly visible so the community can download nocloud-amd64.raw.xz and
      # validate it. rc tags are write-once, so there is nothing to protect with
      # draft status. prerelease:true keeps it off the "Latest release" pointer.
      - name: Publish rc release
        if: needs.build-amd64.outputs.release_exists == 'false' && needs.build-amd64.outputs.is_rc == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const tag = '${{ needs.build-amd64.outputs.tag }}';
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const rel = releases.find(r => r.tag_name === tag);
            if (!rel) { core.setFailed(`rc release ${tag} not found to publish`); return; }
            if (!rel.draft) { console.log(`${tag} already published`); return; }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, draft: false, prerelease: true, make_latest: 'false'
            });
            console.log(`Published rc release ${tag} (prerelease)`);

      # Create the release-X.Y.Z staging branch (holds the digest-bake commit for
      # this version's release PR).
      #
      # Compare-before-force: this is a mutable staging branch, not an immutable
      # artifact — a re-run produces a fresh, non-reproducible bake commit. Skip
      # the push when nothing changed; force-update (and log it) only when the
      # branch genuinely moves. Unlike the tags above, force here is legitimate.
      - name: Create release branch
        if: needs.build-amd64.outputs.release_exists == 'false'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name  "cozystack-ci[bot]"
          git config user.email "274107086+cozystack-ci[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}
          BRANCH="release-${GITHUB_REF#refs/tags/v}"
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')"
          if [ -z "$REMOTE" ]; then
            git push origin "HEAD:refs/heads/${BRANCH}"
            echo "✅ Created staging branch ${BRANCH} at ${LOCAL}."
          elif [ "$REMOTE" = "$LOCAL" ]; then
            echo "✅ ${BRANCH} already at ${LOCAL}; nothing to do."
          else
            echo "::notice::Force-updating staging branch ${BRANCH}: ${REMOTE} -> ${LOCAL}."
            git push -f origin "HEAD:refs/heads/${BRANCH}"
          fi

      # NB: no release PR is opened here. rc tags never get one, and the stable
      # promote PR is opened by promote-rc.yaml. The old "Create pull request if
      # not exists" step was gated on `is_stable && release_exists==false` —
      # unreachable now that a hand-pushed stable tag is rejected above.

  # Mandatory only for vX.Y.Z-rc.N tags. Alpha/beta tags deliberately skip this
  # job and use e2e-tag.yaml's manual dispatch when validation is wanted.
  #
  # Deliberately not gated on release_exists: validating an already-published rc
  # again is an idempotent re-tag-run check, while prepare-release still provides
  # the ordering guarantee for a fresh rc. Its "Publish rc release" and "Create
  # release branch" steps finish before this reusable workflow can start.
  rc-e2e:
    name: E2E Release Candidate
    needs: prepare-release
    # !cancelled(): every job below build-arm64 carries a status function,
    # since a stable tag skips build-arm64. This one only runs for an rc,
    # where build-arm64 always runs, so here it just follows that rule.
    if: ${{ !cancelled() && needs.prepare-release.result == 'success' && contains(github.ref_name, '-rc.') }}
    # A caller's permissions are the ceiling for every job in the called
    # workflow, and GitHub validates that ceiling STATICALLY, when it creates the
    # run — before this job's `if:` is evaluated, let alone before a step runs.
    # e2e-tag.yaml's e2e job declares `checks: write` for its
    # workflow_dispatch-only breakpoint, so even though workflow_call can never
    # take that branch, omitting the grant here fails the whole tags.yaml run with
    # "requesting 'checks: write', but is only allowed 'checks: none'". Not just
    # rc cuts: the `if:` cannot gate a startup failure, so EVERY tag push — rc and
    # stable, including the one finalize pushes to publish a release — would build
    # nothing at all. hack/promote-gate-contract.bats pins the pair, because no CI
    # lane exercises this file (it runs only on tag pushes).
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/e2e-tag.yaml
    with:
      tag: ${{ github.ref_name }}

  # BACKSTOP, and since the rc freeze also the normal route a published changelog
  # takes to main. It is authored by promote-rc.yaml, which commits it onto the
  # release-X.Y.Z branch so it rides the promote PR and is on the base branch the
  # moment finalize publishes the release. That is the whole point of
  # generating it there: at the time THIS job runs the stable tag has already been
  # pushed by finalize, which means the release is already public — too late for a
  # changelog PR to be of any use to a reader.
  #
  # What the freeze changed: promote-rc.yaml bases its promote PR on release-X.Y
  # whenever that branch exists, and cutting vX.Y.0-rc.1 now creates it. So EVERY
  # release, minor and patch alike, merges its changelog onto the maintenance line
  # and none of them reach main on the way. Porting the reviewed file here is the
  # normal path — it used to be the corner case, back when only a patch release
  # targeted a line.
  #
  # The two paths that remain:
  #   1. the file is at the tag but not on main (the usual state): port it
  #      verbatim, no AI;
  #   2. changelog generation failed during promotion (it is non-blocking there)
  #      and the promote PR merged without one: nothing at the tag either, so the
  #      AI runs.
  # Either way this opens the changelog PR against main after the fact. The
  # self-skip on `exists` survives, but it now means the file reached main some
  # other way — a hand-commit, or an earlier run of this job.
  generate-changelog:
    name: Generate Changelog (backstop)
    # git + node + copilot CLI only — no docker, no repo toolchain: GitHub-hosted.
    runs-on: ubuntu-latest
    needs: [prepare-release]
    permissions:
      contents: write
      pull-requests: write
    # Stable tags only. A prerelease tag has a '-' in ref_name (vX.Y.Z-rc.N);
    # firing on every rc would open a changelog-vX.Y.Z-rc.N PR that never merges
    # (no docs/changelogs/v*-rc*.md is a real file). Cumulative rc notes are
    # finalized at the stable release, so the changelog is generated then.
    # !cancelled(): this job runs on stable tags only, which skip build-arm64,
    # and a skipped ancestor makes the implicit success() false.
    if: ${{ !cancelled() && needs.prepare-release.result == 'success' && !contains(github.ref_name, '-') }}
    # Non-blocking: this is a best-effort backfill of an already-published
    # release, never a gate on one.
    continue-on-error: true
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.COZYSTACK_CI_APP_ID }}
          private-key: ${{ secrets.COZYSTACK_CI_PRIVATE_KEY }}
          owner: cozystack

      # Read-only token for the AI step. Minting a separate scoped token
      # means the Generate changelog using AI step cannot push branches,
      # open PRs, or mutate any repository even with --allow-all-tools,
      # regardless of whether the agent follows the prompt's instructions.
      - name: Generate read-only GitHub App token
        id: app-token-read
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.COZYSTACK_CI_APP_ID }}
          private-key: ${{ secrets.COZYSTACK_CI_PRIVATE_KEY }}
          owner: cozystack
          permission-contents: read
          permission-pull-requests: read
          permission-metadata: read

      - name: Parse tag
        id: tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const ref = context.ref.replace('refs/tags/', '');
            const m = ref.match(/^v(\d+\.\d+\.\d+)(-(?:alpha|beta|rc)\.\d+)?$/);
            if (!m) {
              core.setFailed(`❌ tag '${ref}' must match 'vX.Y.Z' or 'vX.Y.Z-(alpha|beta|rc).N'`);
              return;
            }
            const version = m[1] + (m[2] ?? '');

            core.setOutput('version', version);
            core.setOutput('tag', ref);

      # Check out the tag commit, not main. Patch releases are cut from
      # release-X.Y branches, so HEAD-on-main contains commits that are
      # NOT in the release tag. Running the AI against the tag commit
      # makes `git log v<prev>..HEAD` correspond to the actual release
      # contents. The Create changelog branch step below resets the file
      # onto a fresh branch from origin/main for the PR.
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      # Two independent questions, and the answers select between three paths.
      #
      # `exists` — is the changelog already on origin/main? Then this whole job
      # is a no-op. Since the freeze that is the EXCEPTION: the promote PR merges
      # into release-X.Y, so the file it carried never touched main, and this is
      # true only if something else put it there.
      #
      # `at_tag` — is it present in THIS checkout (the tag commit)? Under the
      # promote flow it normally is, because the promote PR carried it onto
      # release-X.Y and the stable tag sits on that merge commit. Since the freeze
      # that PR always targets the line, so this is the usual state on arrival:
      # `exists` false, `at_tag` true, a reviewed and already-published changelog
      # sitting right here — port it rather than regenerate.
      #
      # Only when both are false is there genuinely no changelog to publish, and
      # only then does the AI run.
      - name: Check if changelog already exists
        id: check_changelog
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          CHANGELOG_FILE="docs/changelogs/v${VERSION}.md"
          git fetch origin main --depth=1
          if git cat-file -e "origin/main:${CHANGELOG_FILE}" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Changelog file $CHANGELOG_FILE already exists on origin/main"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Changelog file $CHANGELOG_FILE does not exist on origin/main"
          fi
          # Is the changelog present at the TAG (this checkout)? Under the promote
          # flow it normally is: promote-rc.yaml commits it onto release-X.Y.Z and
          # it reaches the tag via the merge commit. That PR targets the maintenance
          # line for every release since the freeze, so the file lands on
          # release-X.Y and never reaches main — `exists` above is false even though
          # a reviewed, already-PUBLISHED changelog exists right here.
          #
          # Regenerating in that case would spend a second AI run and, once the
          # backstop PR merged, update-releasenotes.yaml would overwrite the
          # published release body with text nobody approved. Port the reviewed
          # file verbatim instead; the AI is only for the genuinely-absent case.
          if [ -s "$CHANGELOG_FILE" ]; then
            echo "at_tag=true" >> $GITHUB_OUTPUT
            echo "Changelog present at the tag — will port it to main verbatim, no regeneration."
          else
            echo "at_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_changelog.outputs.exists == 'false' && steps.check_changelog.outputs.at_tag == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        if: steps.check_changelog.outputs.exists == 'false' && steps.check_changelog.outputs.at_tag == 'false'
        run: npm i -g @github/copilot

      - name: Generate changelog using AI
        if: steps.check_changelog.outputs.exists == 'false' && steps.check_changelog.outputs.at_tag == 'false'
        timeout-minutes: 30
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token-read.outputs.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          copilot \
            --prompt "Generate the release changelog for tag v${VERSION}. The repository is checked out at the v${VERSION} tag commit. Use v${VERSION} as the upper bound when comparing against the previous version — never use HEAD, because if the tag is missing locally HEAD may diverge from the release commit. Follow the instructions in @docs/agents/changelog.md exactly, including the 'Scope and boundaries' section at the top. Your deliverable is the single file docs/changelogs/v${VERSION}.md — write it and exit; this workflow handles branching, committing, pushing, and opening the PR." \
            --allow-all-tools --allow-all-paths < /dev/null

      - name: Create changelog branch and commit
        if: steps.check_changelog.outputs.exists == 'false'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          CHANGELOG_FILE="docs/changelogs/v${VERSION}.md"
          CHANGELOG_BRANCH="changelog-v${VERSION}"

          # Two ways the file can be here: ported verbatim from the tag commit
          # (at_tag=true — the reviewed, already-published changelog reaching main
          # for the first time), or freshly generated above. Either is valid.
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::error::Changelog file $CHANGELOG_FILE is absent — it was neither present at the tag nor produced by the Generate changelog using AI step"
            exit 1
          fi
          # Same validator promote-rc uses: a ported file came from the tag and a
          # generated one from a step allowed to fail, so neither has been checked
          # here. update-releasenotes.yaml will push whatever this PR merges into
          # the published release body, so a fragment must not get that far.
          if ! REASON="$(hack/validate-changelog.sh "$CHANGELOG_FILE" "${VERSION}" 2>&1)"; then
            echo "::error::Changelog file $CHANGELOG_FILE is not usable: ${REASON}"
            exit 1
          fi

          # Snapshot the file across the branch switch — the checkout below
          # resets tracked files to match origin/main.
          TEMP_FILE="$(mktemp)"
          trap 'rm -f "$TEMP_FILE"' EXIT
          cp "$CHANGELOG_FILE" "$TEMP_FILE"

          git config user.name  "cozystack-ci[bot]"
          git config user.email "274107086+cozystack-ci[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}"

          git fetch origin main
          git branch -D "$CHANGELOG_BRANCH" 2>/dev/null || true
          git checkout -b "$CHANGELOG_BRANCH" origin/main

          mkdir -p "$(dirname "$CHANGELOG_FILE")"
          cp "$TEMP_FILE" "$CHANGELOG_FILE"

          # The `check_changelog` step gated this job on the file being absent
          # from origin/main, so `git add` + `git commit` must produce a diff.
          # If they don't, something is wrong (e.g. empty file) — fail loud.
          git add "$CHANGELOG_FILE"
          git commit -m "docs: add changelog for v${VERSION}" -s
          git push -f origin "$CHANGELOG_BRANCH"

      - name: Create PR for changelog
        if: steps.check_changelog.outputs.exists == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const version = '${{ steps.tag.outputs.version }}';
            const changelogBranch = `changelog-v${version}`;
            const baseBranch = 'main';
            
            // Check if PR already exists
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              head:  `${context.repo.owner}:${changelogBranch}`,
              base:   baseBranch,
              state: 'open'
            });
            
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              console.log(`PR #${pr.number} already exists for changelog branch ${changelogBranch}`);
              
              // Update PR body with latest info
              const body = `This PR adds the changelog for release \`v${version}\`.\n\n✅ Changelog has been automatically generated in \`docs/changelogs/v${version}.md\`.`;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                pull_number: pr.number,
                body: body
              });
              console.log(`Updated existing PR #${pr.number}`);
            } else {
              // Create new PR
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                head:  changelogBranch,
                base:  baseBranch,
                title: `docs(release): add changelog for v${version}`,
                body:  `This PR adds the changelog for release \`v${version}\`.\n\n✅ Changelog has been automatically generated in \`docs/changelogs/v${version}.md\`.`,
                draft: false
              });
              
              // Add label if needed
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr.data.number,
                labels: ['kind/documentation', 'automated']
              });
              
              console.log(`Created PR #${pr.data.number} for changelog`);
            }


  # BACKSTOP ONLY. The cozystack/website "update managed apps reference" PR is now
  # normally opened earlier, at PROMOTE time, by promote-rc.yaml::website-docs —
  # which fetches README content from the release-X.Y.Z staging branch (via the
  # website Makefile's FETCH_REF) so the docs are reviewable alongside the promote
  # PR while the stable tag is still unborn. This tag-time job stays as the
  # backstop for the degraded paths (promote's website-docs failed or ran against
  # a pre-FETCH_REF website): it fires on the stable tag push, force-pushes the
  # SAME update-docs-vX.Y.Z branch, and no-ops into "No changes to commit" when
  # promote already did the work. Behaviour is deliberately unchanged — at tag time
  # the stable tag exists, so its BRANCH=RELEASE_TAG fetch resolves.
  update-website-docs:
    name: Update Website Docs
    # bash + git + yq + gh against the website repo — no docker: GitHub-hosted.
    runs-on: ubuntu-latest
    needs: [generate-changelog, prepare-release]
    # generate-changelog is non-blocking — run as long as prepare-release succeeded.
    # `!cancelled()` lets this job run if generate-changelog failed/skipped,
    # while still stopping it when the workflow is cancelled.
    # Not gated on release_exists: a promoted stable tag already has a draft
    # release (so prepare-release skips the rebuild), but its website docs still
    # need publishing. Gating on release_exists here skipped docs for every
    # promoted stable.
    # Stable tags only — a prerelease (ref_name contains '-') would otherwise open
    # an "update managed apps for vX.Y.Z-rc.N" website PR on every rc.
    if: ${{ !cancelled() && needs.prepare-release.result == 'success' && !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.COZYSTACK_CI_APP_ID }}
          private-key: ${{ secrets.COZYSTACK_CI_PRIVATE_KEY }}
          owner: cozystack

      - name: Parse tag
        id: tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const ref = context.ref.replace('refs/tags/', '');
            const m = ref.match(/^v(\d+\.\d+\.\d+)(-(?:alpha|beta|rc)\.\d+)?$/);
            if (!m) {
              core.setFailed(`❌ tag '${ref}' must match 'vX.Y.Z' or 'vX.Y.Z-(alpha|beta|rc).N'`);
              return;
            }
            const version = m[1] + (m[2] ?? '');
            core.setOutput('tag',     ref);      // v0.22.0
            core.setOutput('version', version);  // 0.22.0

      - name: Checkout website repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cozystack/website
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      # Decide whether this release promotes the `next/` trunk to a new released
      # version directory. Per the website repo's contract (see website#495):
      #   - `make release-next` runs only for new minor/major final releases
      #     (tag matches `vX.Y.Z` with no prerelease suffix AND `vX.Y/` does
      #     not yet exist on disk).
      #   - Prereleases and patch releases skip this step and let
      #     `make update-all` handle routing on its own.
      - name: Determine if this release promotes next/
        id: promote
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "Prerelease tag '$TAG' — skipping release-next."
            exit 0
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          if [[ "$MAJOR" == "0" ]]; then
            DOC_VERSION="v0"
          else
            DOC_VERSION="v${MAJOR}.${MINOR}"
          fi
          if [[ -d "content/en/docs/${DOC_VERSION}" ]]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "content/en/docs/${DOC_VERSION}/ already exists — patch release, skipping release-next."
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "New minor/major release ${DOC_VERSION} — will promote next/ → ${DOC_VERSION}/."
          fi

      - name: Promote next/ to released version
        if: steps.promote.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: make release-next RELEASE_TAG="$TAG"

      - name: Update docs from release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: make update-all BRANCH="release-$VERSION" RELEASE_TAG="$TAG"

      - name: Commit and push
        id: commit
        run: |
          git config user.name  "cozystack-ci[bot]"
          git config user.email "274107086+cozystack-ci[bot]@users.noreply.github.com"
          git add content hugo.yaml data/versions
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          BRANCH="update-docs-v${{ steps.tag.outputs.version }}"
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git commit --signoff -m "[docs] Update managed apps reference for v${{ steps.tag.outputs.version }}"
          git push --force --set-upstream origin "$BRANCH"
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="update-docs-v${{ steps.tag.outputs.version }}"
          pr_state=$(gh pr view "$BRANCH" --repo cozystack/website --json state --jq .state 2>/dev/null || echo "")
          if [[ "$pr_state" == "OPEN" ]]; then
            echo "PR already open, skipping creation."
          else
            gh pr create \
              --repo cozystack/website \
              --title "[docs] Update managed apps reference for v${{ steps.tag.outputs.version }}" \
              --body "Automated docs update for release \`v${{ steps.tag.outputs.version }}\`." \
              --head "update-docs-v${{ steps.tag.outputs.version }}" \
              --base main
          fi
