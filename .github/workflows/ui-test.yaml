name: UI Test

# Typecheck, lint and unit tests for the in-tree console SPA
# (packages/system/dashboard/images/console, vendored from cozystack-ui).
# The container image itself is built by `make build` in the main build job.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/system/dashboard/images/console/**'
  pull_request:
    paths:
      - 'packages/system/dashboard/images/console/**'

defaults:
  run:
    working-directory: packages/system/dashboard/images/console

# Read-only token; this workflow only checks out code and runs typecheck/lint/tests.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git pushes from this workflow; don't leave the token in .git/config
          # where a later `pnpm install` step could read it.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The monorepo root has no package.json; read the pnpm version from
          # the console workspace manifest (packageManager field).
          package_json_file: packages/system/dashboard/images/console/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/system/dashboard/images/console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
