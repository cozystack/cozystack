name: "E2E sandbox prepare"
description: >-
  Provision the Talos e2e sandbox (make prepare-env with the sanctioned 3x infra
  retry — the one retry justified by docs/agents/e2e-testing.md #1). Runs in
  $GITHUB_WORKSPACE: the job is a single job on an ephemeral runner, so there is
  no cross-job rendezvous and the checkout is never reused. Shared by the e2e and
  upgrade-e2e jobs. The caller must set SANDBOX_NAME first (a one-liner kept in
  the job, not here, because a `>> $GITHUB_ENV` write inside a composite action
  trips zizmor's github-env audit).

runs:
  using: composite
  steps:
    - name: Prepare environment
      shell: bash
      run: |
        attempt=0
        until make SANDBOX_NAME=$SANDBOX_NAME prepare-env; do
          attempt=$((attempt + 1))
          if [ $attempt -ge 3 ]; then
            echo "Attempt $attempt failed, exiting..."
            exit 1
          fi
          echo "Attempt $attempt failed, retrying..."
        done
        echo "Prepare environment completed after $((attempt + 1)) attempts"
