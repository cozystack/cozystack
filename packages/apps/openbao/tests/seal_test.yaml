suite: seal and apiserver egress

# Guards two fixes:
#
# - issue #2793: Cozystack's CiliumNetworkPolicy allow-to-apiserver only admits
#   egress to kube-apiserver for pods labelled
#   policy.cozystack.io/allow-to-apiserver=true. The upstream chart renders
#   server.extraLabels onto the StatefulSet pods, so the wrapper must always
#   pass the label through or service_registration "kubernetes" hangs.
#
# - issue #2787: optional auto-unseal with OpenBAO's `seal "static"`. The key
#   lives in an operator-owned Secret mounted via server.extraVolumes (the
#   upstream chart mounts each entry at /openbao/userconfig/<name>/).

templates:
  - templates/openbao.yaml

release:
  name: openbao-test
  namespace: tenant-test

tests:
  - it: "always labels the server pods for apiserver egress"
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - equal:
          path: spec.values.openbao.server.extraLabels["policy.cozystack.io/allow-to-apiserver"]
          value: "true"

  - it: "keeps shamir by default: no seal stanza and no extra volumes"
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - notExists:
          path: spec.values.openbao.server.extraVolumes
      - notMatchRegex:
          path: spec.values.openbao.server.standalone.config
          pattern: 'seal "static"'

  - it: "keeps shamir by default in HA mode: no seal stanza in the raft config either"
    set:
      replicas: 3
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - notExists:
          path: spec.values.openbao.server.extraVolumes
      - notMatchRegex:
          path: spec.values.openbao.server.ha.raft.config
          pattern: 'seal "'

  - it: "renders the static seal stanza and the key volume in HA mode"
    set:
      replicas: 3
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-1
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - equal:
          path: spec.values.openbao.server.extraVolumes
          value:
            - type: secret
              name: openbao-unseal
      - matchRegex:
          path: spec.values.openbao.server.ha.raft.config
          pattern: 'seal "static" \{\n\s+current_key_id = "key-1"\n\s+current_key = "file:///openbao/userconfig/openbao-unseal/key"\n\s*\}'
      - notMatchRegex:
          path: spec.values.openbao.server.ha.raft.config
          pattern: previous_key

  - it: "renders the static seal stanza in standalone mode too"
    set:
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-1
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - matchRegex:
          path: spec.values.openbao.server.standalone.config
          pattern: 'seal "static" \{\n\s+current_key_id = "key-1"\n\s+current_key = "file:///openbao/userconfig/openbao-unseal/key"\n\s*\}'

  - it: "mounts the previous key and renders previous_key_* during rotation"
    set:
      replicas: 3
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-2
        previousSecretName: openbao-unseal-old
        previousKeyId: key-1
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - equal:
          path: spec.values.openbao.server.extraVolumes
          value:
            - type: secret
              name: openbao-unseal
            - type: secret
              name: openbao-unseal-old
      - matchRegex:
          path: spec.values.openbao.server.ha.raft.config
          pattern: 'previous_key_id = "key-1"\n\s+previous_key = "file:///openbao/userconfig/openbao-unseal-old/key"'

  - it: "rejects static without secretName"
    set:
      seal:
        type: static
        keyId: key-1
    asserts:
      - failedTemplate:
          errorMessage: 'seal.secretName is required when seal.type is "static"'

  - it: "rejects static without keyId"
    set:
      seal:
        type: static
        secretName: openbao-unseal
    asserts:
      - failedTemplate:
          errorMessage: 'seal.keyId is required when seal.type is "static"'

  - it: "rejects previousSecretName without previousKeyId"
    set:
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-2
        previousSecretName: openbao-unseal-old
    asserts:
      - failedTemplate:
          errorMessage: "seal.previousKeyId is required when seal.previousSecretName is set"

  - it: "rejects previousKeyId without previousSecretName"
    set:
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-2
        previousKeyId: key-1
    asserts:
      - failedTemplate:
          errorMessage: "seal.previousSecretName is required when seal.previousKeyId is set"

  - it: "rejects a previous Secret that is the current one, because both would mount as the same volume"
    set:
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-2
        previousSecretName: openbao-unseal
        previousKeyId: key-1
    asserts:
      - failedTemplate:
          errorMessage: "seal.previousSecretName must name a different Secret than seal.secretName"

  - it: "rejects a previous key identifier that is the current one"
    set:
      seal:
        type: static
        secretName: openbao-unseal-2
        keyId: key-1
        previousSecretName: openbao-unseal-1
        previousKeyId: key-1
    asserts:
      - failedTemplate:
          errorMessage: "seal.previousKeyId must differ from seal.keyId"

  - it: "rejects previousSecretName with seal.type shamir"
    set:
      seal:
        type: shamir
        previousSecretName: openbao-unseal-old
        previousKeyId: key-1
    asserts:
      - failedTemplate:
          errorMessage: 'seal.previousSecretName only applies to seal.type "static"'

  # The seal in use is read from the config ConfigMap the previous release
  # rendered (<release>-config, key extraconfig-from-values.hcl). A ConfigMap
  # without a seal stanza means Shamir.
  - it: "refuses to switch an existing Shamir instance to static without allowMigration"
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - kind: ConfigMap
          apiVersion: v1
          metadata:
            name: openbao-test-config
            namespace: tenant-test
          data:
            extraconfig-from-values.hcl: |-
              ui = true
              storage "raft" {
                path = "/openbao/data"
              }
              service_registration "kubernetes" {}
    set:
      replicas: 3
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-1
    asserts:
      - failedTemplate:
          errorPattern: 'seal.type "static" differs from the seal in use \("shamir"\)'

  - it: "refuses to switch an existing static instance back to shamir"
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - kind: ConfigMap
          apiVersion: v1
          metadata:
            name: openbao-test-config
            namespace: tenant-test
          data:
            extraconfig-from-values.hcl: |-
              storage "raft" {
                path = "/openbao/data"
              }
              seal "static" {
                current_key_id = "key-1"
                current_key = "file:///openbao/userconfig/openbao-unseal/key"
              }
    set:
      replicas: 3
    asserts:
      - failedTemplate:
          errorMessage: 'migration from seal.type "static" to "shamir" is not supported by this chart'

  - it: "refuses static to shamir even with allowMigration: the chart cannot render the disabled legacy stanza"
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - kind: ConfigMap
          apiVersion: v1
          metadata:
            name: openbao-test-config
            namespace: tenant-test
          data:
            extraconfig-from-values.hcl: |-
              seal "static" {
                current_key_id = "key-1"
                current_key = "file:///openbao/userconfig/openbao-unseal/key"
              }
    set:
      replicas: 3
      seal:
        allowMigration: true
    asserts:
      - failedTemplate:
          errorMessage: 'migration from seal.type "static" to "shamir" is not supported by this chart'

  - it: "renders when the requested seal matches the seal in use"
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - kind: ConfigMap
          apiVersion: v1
          metadata:
            name: openbao-test-config
            namespace: tenant-test
          data:
            extraconfig-from-values.hcl: |-
              seal "static" {
                current_key_id = "key-1"
                current_key = "file:///openbao/userconfig/openbao-unseal/key"
              }
    set:
      replicas: 3
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-2
        previousSecretName: openbao-unseal-old
        previousKeyId: key-1
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - matchRegex:
          path: spec.values.openbao.server.ha.raft.config
          pattern: 'current_key_id = "key-2"'

  - it: "renders a seal change when allowMigration acknowledges the migration"
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - kind: ConfigMap
          apiVersion: v1
          metadata:
            name: openbao-test-config
            namespace: tenant-test
          data:
            extraconfig-from-values.hcl: |-
              storage "raft" {
                path = "/openbao/data"
              }
    set:
      replicas: 3
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-1
        allowMigration: true
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - matchRegex:
          path: spec.values.openbao.server.ha.raft.config
          pattern: 'seal "static"'

  - it: "renders hyphenated Secret names as plain strings in the volumes and in the key paths"
    set:
      seal:
        type: static
        secretName: openbao-unseal-2
        keyId: key-2
        previousSecretName: openbao-unseal-1
        previousKeyId: key-1
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - equal:
          path: spec.values.openbao.server.extraVolumes
          value:
            - type: secret
              name: openbao-unseal-2
            - type: secret
              name: openbao-unseal-1
      - matchRegex:
          path: spec.values.openbao.server.standalone.config
          pattern: 'current_key = "file:///openbao/userconfig/openbao-unseal-2/key"\n\s+previous_key_id = "key-1"\n\s+previous_key = "file:///openbao/userconfig/openbao-unseal-1/key"'

  - it: "rejects a Secret name with a dot, because the pod volume userconfig-<name> must be a DNS label"
    set:
      seal:
        type: static
        secretName: openbao.unseal
        keyId: key-1
    asserts:
      - failedTemplate:
          errorPattern: 'seal[./]secretName.*(?i:does not match pattern)'

  - it: "rejects a Secret name longer than 52 characters, because userconfig-<name> must fit 63"
    set:
      seal:
        type: static
        secretName: a123456789b123456789c123456789d123456789e123456789fgh
        keyId: key-1
    asserts:
      - failedTemplate:
          errorPattern: 'seal[./]secretName.*(?i:length)'

  - it: "rejects a previous Secret name with a quote"
    set:
      seal:
        type: static
        secretName: openbao-unseal
        keyId: key-1
        previousSecretName: 'openbao"unseal'
        previousKeyId: key-0
    asserts:
      - failedTemplate:
          errorPattern: 'seal[./]previousSecretName.*(?i:does not match pattern)'

  - it: "accepts a 52 character Secret name and key identifiers in the form OpenBAO documents"
    set:
      seal:
        type: static
        secretName: a123456789b123456789c123456789d123456789e123456789fg
        keyId: 20250606-1
        previousSecretName: openbao-unseal-1
        previousKeyId: key_2025.03
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - equal:
          path: spec.values.openbao.server.extraVolumes[0].name
          value: a123456789b123456789c123456789d123456789e123456789fg
      - matchRegex:
          path: spec.values.openbao.server.standalone.config
          pattern: 'current_key_id = "20250606-1"\n\s+current_key = "file:///openbao/userconfig/a123456789b123456789c123456789d123456789e123456789fg/key"\n\s+previous_key_id = "key_2025\.03"'

  # The upstream chart renders the server config through tpl, so braces in a
  # key identifier would run as a template under the helm-controller identity.
  # Its start script also replaces HOSTNAME, POD_IP and similar upper case
  # placeholders anywhere in the config before the server reads it.
  - it: "rejects a key identifier that the upstream chart would evaluate as a template"
    set:
      seal:
        type: static
        secretName: openbao-unseal
        keyId: '{{ .Release.Name }}'
    asserts:
      - failedTemplate:
          errorPattern: 'seal[./]keyId.*(?i:does not match pattern)'

  - it: "rejects an upper case key identifier that the start script would rewrite"
    set:
      seal:
        type: static
        secretName: openbao-unseal
        keyId: HOSTNAME
    asserts:
      - failedTemplate:
          errorPattern: 'seal[./]keyId.*(?i:does not match pattern)'

  - it: "rejects a previous key identifier that the upstream chart would evaluate as a template"
    set:
      seal:
        type: static
        secretName: openbao-unseal-2
        keyId: key-2
        previousSecretName: openbao-unseal-1
        previousKeyId: '{{ .Values }}'
    asserts:
      - failedTemplate:
          errorPattern: 'seal[./]previousKeyId.*(?i:does not match pattern)'
