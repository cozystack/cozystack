##
## @section Seal
##

## @enum {string} SealType - How the OpenBAO barrier is unsealed.
## @value shamir - Shamir key shares. An operator has to unseal every replica after each pod restart.
## @value static - OpenBAO `seal "static"`: the barrier unseals itself from a 32-byte key read from a Secret you manage.

## @typedef {struct} Seal - Seal configuration. With `static`, the key is read from a Secret you create in the release namespace; the chart never generates or rotates it.
## @field {SealType} type - Seal type. `shamir` keeps the current behaviour; `static` enables auto-unseal from `secretName`.
## @field {string} secretName - Existing Secret in the release namespace whose key `key` holds the base64 text of 32 random bytes (for example `openssl rand -base64 32`). Required when `type` is `static`.
## @field {string} keyId - Permanent identifier of the current key. Change it whenever the key material changes; OpenBAO refuses a key whose identifier it has already seen with different material. Required when `type` is `static`.
## @field {string} [previousSecretName] - Secret holding the previous key during an n-1 key rotation.
## @field {string} [previousKeyId] - Identifier of the previous key. Required when `previousSecretName` is set.
## @field {bool} [allowMigration] - Acknowledge a seal migration. The chart refuses to change `type` on an existing instance unless this is `true`; set it only while running `bao operator unseal -migrate`, then remove it.

## @param {Seal} seal - Seal configuration. Defaults to Shamir key shares; set `type: static` for auto-unseal.
seal:
  type: shamir
  secretName: ""
  keyId: ""
  previousSecretName: ""
  previousKeyId: ""
  allowMigration: false
