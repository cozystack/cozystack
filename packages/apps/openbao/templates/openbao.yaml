{{- $seal := .Values.seal }}
{{- $static := eq $seal.type "static" }}
{{- if and $static (not $seal.secretName) }}
{{- fail "seal.secretName is required when seal.type is \"static\"" }}
{{- end }}
{{- if and $static (not $seal.keyId) }}
{{- fail "seal.keyId is required when seal.type is \"static\"" }}
{{- end }}
{{- if and $seal.previousSecretName (not $seal.previousKeyId) }}
{{- fail "seal.previousKeyId is required when seal.previousSecretName is set" }}
{{- end }}
{{- if and $seal.previousKeyId (not $seal.previousSecretName) }}
{{- fail "seal.previousSecretName is required when seal.previousKeyId is set" }}
{{- end }}
{{- if and $seal.previousSecretName (not $static) }}
{{- fail "seal.previousSecretName only applies to seal.type \"static\"" }}
{{- end }}
{{- /*
Refuse a silent seal change on an existing instance. Changing the seal of an
initialized OpenBAO is a seal migration (`bao operator unseal -migrate`); a
plain config change instead leaves a barrier nobody can decrypt. The seal in
use is visible in the config ConfigMap the previous release rendered. `lookup`
returns nothing on first install and on dry-run, so the check is a no-op there.
*/}}
{{- $cm := lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-config" .Release.Name) }}
{{- if $cm }}
{{- $hcl := index ($cm.data | default dict) "extraconfig-from-values.hcl" | default "" }}
{{- $stanza := regexFind `seal "[a-z]+"` $hcl }}
{{- $liveSeal := ternary (trimAll "\"" (trimPrefix "seal " $stanza)) "shamir" (ne $stanza "") }}
{{- /*
Migrating away from static needs the old stanza kept with disabled = "true"
and its key still mounted, which this chart does not render. Refuse the
direction rather than emit a config the migration cannot run against.
*/}}
{{- if and (eq $liveSeal "static") (eq $seal.type "shamir") }}
{{- fail "migration from seal.type \"static\" to \"shamir\" is not supported by this chart" }}
{{- end }}
{{- if and (ne $liveSeal $seal.type) (not $seal.allowMigration) }}
{{- fail (printf "seal.type %q differs from the seal in use (%q). Changing the seal of an existing instance is a seal migration (bao operator unseal -migrate); set seal.allowMigration: true only while performing it." $seal.type $liveSeal) }}
{{- end }}
{{- end }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-system
  labels:
    sharding.fluxcd.io/key: tenants
spec:
  chartRef:
    kind: ExternalArtifact
    name: cozystack-openbao-application-default-openbao-system
    namespace: cozy-system
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
  - kind: Secret
    name: cozystack-values
  values:
    openbao:
      fullnameOverride: {{ .Release.Name }}
      global:
        tlsDisable: true
      server:
        podManagementPolicy: Parallel
        # Cozystack's CiliumNetworkPolicy allow-to-apiserver only admits egress
        # to kube-apiserver for pods carrying this label. Without it,
        # service_registration "kubernetes" cannot reach the API server and
        # the HA pods hang on startup. See issue #2793.
        extraLabels:
          policy.cozystack.io/allow-to-apiserver: "true"
        resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.resourcesPreset .Values.resources $) | nindent 10 }}
        # Ensure the StatefulSet's data PVC is removed when the release is
        # deleted. Without this, the upstream chart leaves the PVC orphaned
        # (StatefulSet volumeClaimTemplates are never garbage-collected by
        # default). Rendered onto the StatefulSet by the upstream chart from
        # server.persistentVolumeClaimRetentionPolicy. See issue #3058.
        persistentVolumeClaimRetentionPolicy:
          whenDeleted: Delete
          whenScaled: Retain
        dataStorage:
          enabled: true
          size: {{ .Values.size }}
          {{- with .Values.storageClass }}
          storageClass: {{ . }}
          {{- end }}
        {{- if $static }}
        # The upstream chart mounts each Secret at /openbao/userconfig/<name>/.
        extraVolumes:
          - type: secret
            name: {{ $seal.secretName }}
          {{- with $seal.previousSecretName }}
          - type: secret
            name: {{ . }}
          {{- end }}
        {{- end }}
        {{- if gt (int .Values.replicas) 1 }}
        standalone:
          enabled: false
        ha:
          enabled: true
          replicas: {{ .Values.replicas }}
          raft:
            enabled: true
            setNodeId: true
            config: |
              ui = {{ .Values.ui }}

              listener "tcp" {
                address = "[::]:8200"
                cluster_address = "[::]:8201"
                tls_disable = true
              }

              storage "raft" {
                path = "/openbao/data"
              {{- range $i := until (int $.Values.replicas) }}
                retry_join {
                  leader_api_addr = "http://{{ $.Release.Name }}-{{ $i }}.{{ $.Release.Name }}-internal:8200"
                }
              {{- end }}
              }
              {{- if $static }}

              seal "static" {
                current_key_id = {{ $seal.keyId | quote }}
                current_key = "file:///openbao/userconfig/{{ $seal.secretName }}/key"
                {{- if $seal.previousSecretName }}
                previous_key_id = {{ $seal.previousKeyId | quote }}
                previous_key = "file:///openbao/userconfig/{{ $seal.previousSecretName }}/key"
                {{- end }}
              }
              {{- end }}

              service_registration "kubernetes" {}
        {{- else }}
        standalone:
          enabled: true
          config: |
            ui = {{ .Values.ui }}

            listener "tcp" {
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_disable = true
            }

            storage "file" {
              path = "/openbao/data"
            }
            {{- if $static }}

            seal "static" {
              current_key_id = {{ $seal.keyId | quote }}
              current_key = "file:///openbao/userconfig/{{ $seal.secretName }}/key"
              {{- if $seal.previousSecretName }}
              previous_key_id = {{ $seal.previousKeyId | quote }}
              previous_key = "file:///openbao/userconfig/{{ $seal.previousSecretName }}/key"
              {{- end }}
            }
            {{- end }}
            # Note: service_registration "kubernetes" {} is intentionally omitted
            # in standalone mode — it requires an HA-capable storage backend and
            # causes a fatal error with storage "file".
        ha:
          enabled: false
        {{- end }}
        {{- if .Values.external }}
        service:
          type: LoadBalancer
        {{- end }}
      ui:
        enabled: {{ .Values.ui }}
        {{- if .Values.external }}
        serviceType: LoadBalancer
        {{- end }}
      injector:
        enabled: false
      csi:
        enabled: false
