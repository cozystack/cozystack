{{/*
  Skip the post-install/post-upgrade init Job entirely while the chart
  renders bootstrap.recovery. Helm waits up to 5m for hooks to succeed,
  but the Job's pg_isready loop can't drain that budget while CNPG is
  still streaming the restore from S3 - the hook then times out and
  Helm rolls the upgrade back to the previous bootstrap.initdb spec,
  which makes every subsequent recovery pod panic in CNPG's
  InitInfo.loadBackup (Recovery == nil after the rollback).
  Recovered postgres carries source's roles/databases at the on-disk
  level, so the chart's role/db management can re-converge on the next
  user-driven helm upgrade after recovery completes.
*/}}
{{- if not .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init-job
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  {{- /*
    This Job is a post-install,post-upgrade Helm hook Helm blocks on. Bound it under
    the 10m hook budget so its own DeadlineExceeded surfaces first, instead of Helm's
    generic 10m timeout that says nothing about why. The script reads the value back
    as JOB_DEADLINE and bounds its collation-rebuild waits by what is left of it.
    On UPGRADE the Cluster is already up and the readiness loop answers in seconds,
    so 540s leaves the grant and rebuild passes ~9m. On INSTALL the same release is
    still provisioning the Cluster (PVC, image pull, initdb) and Helm's wait does not
    cover a CR, so the cold start gets 570s. Do not retry the pod either way: the
    collation pass bounds lock_timeout and the in-place statement_timeout by
    JOB_DEADLINE minus $SECONDS, and $SECONDS counts from the pod's start while
    activeDeadlineSeconds counts from the Job's. A retried pod would hand the server
    a bound longer than the Job has left, so a rebuild or lock wait would outlive it.
  */}}
  {{- $deadline := ternary 570 540 .Release.IsInstall }}
  activeDeadlineSeconds: {{ $deadline }}
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      name: {{ .Release.Name }}-init-job
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/init-script.yaml") . | sha256sum }}
    spec:
      restartPolicy: Never
      containers:
      - name: postgres
        image: {{ include "postgres.imageName" $ }}
        command:
        - bash
        - /scripts/init.sh
        env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-superuser
              key: password
        - name: PGHOST
          value: {{ .Release.Name }}-rw
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: postgres
        - name: JOB_DEADLINE
          value: {{ $deadline | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /etc/secret
          name: secret
        - mountPath: /scripts
          name: scripts
        {{- include "postgresjobs.resources" . | nindent 8 }}
      securityContext:
        fsGroup: 26
        runAsGroup: 26
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: secret
        secret:
          secretName: {{ .Release.Name }}-superuser
      - name: scripts
        secret:
          secretName: {{ .Release.Name }}-init-script
{{- end }}
