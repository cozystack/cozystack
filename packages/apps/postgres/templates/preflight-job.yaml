{{- /*
  Pre-upgrade refusal to adopt a role the chart did not mark. A CREATEROLE
  holder can create a role under a name values will declare later, and CNPG
  adopts a managed role by name within seconds of the spec reaching it,
  keeping what the planter left: its ADMIN OPTION and the role's settings. The
  init-job is a post-upgrade hook and would find the role adopted already, so
  the check runs here, before the new Cluster reaches CNPG, with the
  init-script's query for every declared user and for the roles of every
  declared database, against the flag the init-job records once any user has
  held createRole. It reads the flag first and then sets it if the new values
  grant createRole, so the upgrade that first grants it still adopts, since no
  one has held the attribute before, and the flag is on before CNPG applies it.
  The check fails closed, since no catalog query tells a planted role from an
  administrator's. Skipped while bootstrap.recovery renders, for the reason
  init-job.yaml gives, and on install, where there is no cluster to ask.
*/ -}}
{{- if and .Release.IsUpgrade (not .Values.bootstrap.enabled) (or .Values.users .Values.databases) }}
{{- $pgMajor := atoi (trimPrefix "v" .Values.version) }}
{{- $grantsCreateRole := false }}
{{- range $user, $u := .Values.users }}
{{- if default false $u.createRole }}
{{- $grantsCreateRole = true }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-preflight-script
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  preflight.sh: |
    #!/bin/bash
    set -e
    until pg_isready ; do
      if [ "$SECONDS" -ge 250 ]; then
        echo "postgres did not become ready in time; failing the preflight hook rather than blocking the upgrade" >&2
        exit 1
      fi
      sleep 5
    done

    echo "== refuse to adopt unmarked roles"
    psql -v ON_ERROR_STOP=1 --echo-all <<\EOT
    {{- range $user, $u := .Values.users }}
    SELECT format('DO $$BEGIN RAISE EXCEPTION %L; END$$', 'role "{{ $user }}" already exists and this chart did not create it; a user of this instance has held createRole, so the role may be controlled by that user and users.{{ $user }} will not adopt it. A platform administrator must inspect the role and drop it as the superuser, or declare the user under another name')
    FROM pg_catalog.pg_roles r
    WHERE r.rolname = '{{ $user }}'
      AND current_setting('cozystack.createrole_granted', true) = 'on'
      AND NOT EXISTS (SELECT FROM pg_catalog.pg_auth_members m JOIN pg_catalog.pg_roles g ON g.oid = m.roleid WHERE g.rolname = 'cozystack:managed' AND m.member = r.oid)\gexec
    {{- end }}
    {{- range $database, $d := .Values.databases }}
    SELECT format('DO $$BEGIN RAISE EXCEPTION %L; END$$', format('role "%s" already exists and this chart did not create it; a user of this instance has held createRole, so the role may be controlled by that user and databases.{{ $database }} will not adopt it. A platform administrator must inspect the role and drop it as the superuser, or declare the database under another name', r.rolname))
    FROM pg_catalog.pg_roles r
    WHERE r.rolname IN ('{{ $database }}_admin', '{{ $database }}_readonly')
      AND current_setting('cozystack.createrole_granted', true) = 'on'
      AND NOT EXISTS (SELECT FROM pg_catalog.pg_auth_members m JOIN pg_catalog.pg_roles g ON g.oid = m.roleid WHERE g.rolname = 'cozystack:managed' AND m.member = r.oid)\gexec
    {{- end }}
    EOT
    {{- if $grantsCreateRole }}
    psql -v ON_ERROR_STOP=1 --echo-all -c "ALTER DATABASE postgres SET cozystack.createrole_granted = 'on';"
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-preflight
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      name: {{ .Release.Name }}-preflight
    spec:
      restartPolicy: Never
      containers:
      - name: postgres
        image: {{ include "postgres.imageName" $ }}
        command:
        - bash
        - /scripts/preflight.sh
        env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-superuser
              key: password
        - name: PGHOST
          value: {{ .Release.Name }}-rw
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: postgres
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /scripts
          name: scripts
        {{- include "postgresjobs.resources" . | nindent 8 }}
      securityContext:
        fsGroup: 26
        runAsGroup: 26
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: scripts
        configMap:
          name: {{ .Release.Name }}-preflight-script
{{- end }}
