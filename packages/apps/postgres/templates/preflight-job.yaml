{{- /*
  Refuses to adopt a role the chart did not mark, which a CREATEROLE holder
  can have planted under a name values declare later. It runs pre-upgrade
  because CNPG adopts a managed role within seconds of the spec reaching it,
  so the post-upgrade init-job would find it adopted. The flag is read before
  it is set, so the upgrade that first grants createRole still adopts and the
  flag is on before CNPG applies it. Fails closed: no catalog query tells a
  planted role from an administrator's. Skipped under bootstrap.recovery, for
  the reason init-job.yaml gives, and on install, where there is no cluster.
*/ -}}
{{- if and .Release.IsUpgrade (not .Values.bootstrap.enabled) (or .Values.users .Values.databases) }}
{{- $pgMajor := atoi (trimPrefix "v" .Values.version) }}
{{- $grantsCreateRole := false }}
{{- range $user, $u := .Values.users }}
{{- if default false $u.createRole }}
{{- $grantsCreateRole = true }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-preflight-script
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  preflight.sh: |
    #!/bin/bash
    set -e
    until pg_isready ; do
      if [ "$SECONDS" -ge 250 ]; then
        echo "postgres did not become ready in time; failing the preflight hook rather than blocking the upgrade" >&2
        exit 1
      fi
      sleep 5
    done

    echo "== refuse to adopt unmarked roles"
    psql -v ON_ERROR_STOP=1 --echo-all <<\EOT
    {{- range $user, $u := .Values.users }}
    SELECT format('DO $$BEGIN RAISE EXCEPTION %L; END$$', 'role "{{ $user }}" already exists and this chart did not create it; a user of this instance has held createRole, so the role may be controlled by that user and users.{{ $user }} will not adopt it. A platform administrator must inspect the role and drop it as the superuser, or declare the user under another name')
    FROM pg_catalog.pg_roles r
    WHERE r.rolname = '{{ $user }}'
      AND current_setting('cozystack.createrole_granted', true) = 'on'
      AND NOT EXISTS (SELECT FROM pg_catalog.pg_auth_members m JOIN pg_catalog.pg_roles g ON g.oid = m.roleid WHERE g.rolname = 'cozystack:managed' AND m.member = r.oid)\gexec
    {{- end }}
    {{- range $database, $d := .Values.databases }}
    SELECT format('DO $$BEGIN RAISE EXCEPTION %L; END$$', format('role "%s" already exists and this chart did not create it; a user of this instance has held createRole, so the role may be controlled by that user and databases.{{ $database }} will not adopt it. A platform administrator must inspect the role and drop it as the superuser, or declare the database under another name', r.rolname))
    FROM pg_catalog.pg_roles r
    WHERE r.rolname IN ('{{ $database }}_admin', '{{ $database }}_readonly')
      AND current_setting('cozystack.createrole_granted', true) = 'on'
      AND NOT EXISTS (SELECT FROM pg_catalog.pg_auth_members m JOIN pg_catalog.pg_roles g ON g.oid = m.roleid WHERE g.rolname = 'cozystack:managed' AND m.member = r.oid)\gexec
    {{- end }}
    EOT
    {{- if $grantsCreateRole }}
    psql -v ON_ERROR_STOP=1 --echo-all -c "ALTER DATABASE postgres SET cozystack.createrole_granted = 'on';"
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-preflight
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      name: {{ .Release.Name }}-preflight
    spec:
      restartPolicy: Never
      containers:
      - name: postgres
        image: {{ include "postgres.imageName" $ }}
        command:
        - bash
        - /scripts/preflight.sh
        env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-superuser
              key: password
        - name: PGHOST
          value: {{ .Release.Name }}-rw
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: postgres
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /scripts
          name: scripts
        {{- include "postgresjobs.resources" . | nindent 8 }}
      securityContext:
        fsGroup: 26
        runAsGroup: 26
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: scripts
        configMap:
          name: {{ .Release.Name }}-preflight-script
{{- end }}
