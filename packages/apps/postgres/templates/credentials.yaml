{{- /*
  One CredentialTemplate per user: the account the Cozystack credentials API
  mints and revokes through. cozystack-controller keeps its account Secret,
  <release>.<account>.account, which managed.roles[].passwordSecret names in
  db.yaml, and CloudNativePG applies a changed Secret live through the reload
  label. The chart renders no password: a user exists in the database once its
  Secret does, and nobody can log in until a mint.
*/ -}}
{{- include "postgres.accountsGuard" $ }}
{{- range $user, $_ := .Values.users }}
---
apiVersion: cozystack.io/v1alpha1
kind: CredentialTemplate
metadata:
  name: {{ printf "%s.%s" $.Release.Name (include "postgres.accountName" $user) | quote }}
spec:
  username: {{ $user | quote }}
  format:
    name: scram-sha-256
  secret:
    labels:
      cnpg.io/reload: "true"
{{- end }}
