suite: NOTES.txt restore warning is gated on both bootstrap and users
templates:
  - templates/NOTES.txt
release:
  name: pg-test
  namespace: tenant-test
tests:
  - it: warns during a restore when the release defines users
    set:
      bootstrap:
        enabled: true
      users:
        testuser: {}
    asserts:
      - matchRegexRaw:
          pattern: 'provisioned as a restore'
      # The passwords of a restored application come from its account Secrets,
      # applied by CloudNativePG once the primary is up, and a seeded account
      # has none issued until a mint. The note must say that, and must not
      # describe a chart-rendered Secret or a pending-credentials flag, which
      # the conversion removed.
      - matchRegexRaw:
          pattern: 'mint'
      - notMatchRegexRaw:
          pattern: 'credentials-pending'
      - notMatchRegexRaw:
          pattern: 'pg-test-credentials'

  - it: stays quiet during a restore when there are no users
    set:
      bootstrap:
        enabled: true
      users: {}
    asserts:
      - notMatchRegexRaw:
          pattern: 'provisioned as a restore'

  - it: stays quiet for a normal install
    set:
      bootstrap:
        enabled: false
      users:
        testuser: {}
    asserts:
      - notMatchRegexRaw:
          pattern: 'provisioned as a restore'
