suite: init-script trusts only roles it marked itself

# On PostgreSQL 16 a CREATEROLE holder may COMMENT ON ROLE every role it created,
# and by creating a role through an intermediate role it then drops, it leaves no
# pg_auth_members row that tells who did. Two passes trusted what it can forge:
# the delete passes picked roles by their comment, so a forged comment had the
# chart drop a role it never created; and the create passes adopted any role that
# already existed under a declared name, so a role squatted before an admin
# declared it stayed under the squatter's control. Membership in
# "cozystack:managed", which only the superuser can grant, replaces the comment as
# the record. The behaviour is proven against live PostgreSQL 13, 15, 16 and 17;
# these tests pin the render.

templates:
  - templates/init-script.yaml

release:
  name: pg-test
  namespace: tenant-test

set:
  _cluster:
    scheduling: {}

tests:
  - it: creates the marker once and marks the roles the chart had commented before it existed
    set:
      users:
        app: {}
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "IF NOT EXISTS \\(SELECT FROM pg_catalog.pg_roles WHERE rolname = 'cozystack:managed'\\) THEN\\n\\s+CREATE ROLE \"cozystack:managed\" NOLOGIN;\\n\\s+FOR managed IN SELECT r.rolname FROM pg_roles r JOIN pg_shdescription s ON s.objoid = r.oid AND s.classoid = 'pg_authid'::regclass WHERE s.description IN \\('user managed by helm', 'role managed by helm'\\) LOOP\\n\\s+EXECUTE format\\('GRANT %I TO %I WITH INHERIT FALSE, SET FALSE', 'cozystack:managed', managed.rolname\\);"

  - it: selects the users and roles to delete by the marker, not by the comment alone
    set:
      users:
        app: {}
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "WHERE s.description = 'user managed by helm' AND r.oid IN \\(SELECT m.member FROM pg_auth_members m JOIN pg_roles g ON g.oid = m.roleid WHERE g.rolname = 'cozystack:managed'\\)"
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "WHERE s.description = 'role managed by helm' AND r.oid IN \\(SELECT m.member FROM pg_auth_members m JOIN pg_roles g ON g.oid = m.roleid WHERE g.rolname = 'cozystack:managed'\\)"

  - it: marks every user and database role it creates, as a record that carries no privilege
    set:
      users:
        app: {}
      databases:
        shop: {}
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'GRANT "cozystack:managed" TO "app" WITH INHERIT FALSE, SET FALSE;'
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'GRANT "cozystack:managed" TO "shop_admin" WITH INHERIT FALSE, SET FALSE;'
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'GRANT "cozystack:managed" TO "shop_readonly" WITH INHERIT FALSE, SET FALSE;'

  # INHERIT and SET membership options arrived in PostgreSQL 16.
  - it: marks with a plain GRANT before PostgreSQL 16
    set:
      version: v15
      users:
        app: {}
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'GRANT "cozystack:managed" TO "app";'
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: 'INHERIT FALSE'

  # The refusal to adopt an unmarked role moved to the pre-upgrade hook
  # (preflight_test.yaml): CloudNativePG adopts a managed role within seconds of
  # the spec reaching it, so a post-upgrade check would find it adopted. The
  # init-script creates no account any more and marks only a role that exists.
  - it: no longer refuses or creates user roles itself
    set:
      users:
        debezium:
          replication: true
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: 'already exists and this chart did not create it'
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: 'CREATE ROLE "debezium"'
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "SELECT 'GRANT \"cozystack:managed\" TO \"debezium\" WITH INHERIT FALSE, SET FALSE;'\nWHERE EXISTS \\(SELECT FROM pg_catalog.pg_roles WHERE rolname = 'debezium'\\)\\\\gexec"

  # The flag is recorded after the marking pass, so an install that grants
  # createRole records it once every user is marked, and the pre-upgrade hook
  # reads it on the next upgrade.
  - it: records createRole after marking the users
    set:
      users:
        app: {}
        migrator:
          createRole: true
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "(?s)WHERE EXISTS \\(SELECT FROM pg_catalog.pg_roles WHERE rolname = 'migrator'\\)\\\\gexec\nEOT\npsql -v ON_ERROR_STOP=1 --echo-all -c \"ALTER DATABASE postgres SET cozystack.createrole_granted = 'on';\""

  - it: does not record createRole when no user holds it
    set:
      users:
        app: {}
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: 'SET cozystack.createrole_granted'
