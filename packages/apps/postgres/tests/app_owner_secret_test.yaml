suite: users.app keeps its password across pod restarts

# "app" is the owner CNPG bootstraps, and CNPG's instance manager re-applies the
# owner's password from the bootstrap secret on every pod restart. A declared
# users.app must therefore hand CNPG a secret holding the very password stored
# in <release>-credentials, or the role reverts to CNPG's generated one.

release:
  name: pg-test
  namespace: tenant-test

set:
  _cluster:
    scheduling: {}

tests:
  - it: gives CNPG the password users.app has in the credentials Secret
    templates:
      - templates/init-script.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: pg-test-credentials
            namespace: tenant-test
          data:
            app: Y29uc29sZS1wYXNzd29yZA==
    set:
      users:
        app: {}
    asserts:
      - equal:
          path: stringData.app
          value: console-password
        documentSelector:
          path: metadata.name
          value: pg-test-credentials
      - equal:
          path: stringData.password
          value: console-password
        documentSelector:
          path: metadata.name
          value: pg-test-app-owner
      - equal:
          path: stringData.username
          value: app
        documentSelector:
          path: metadata.name
          value: pg-test-app-owner
      - equal:
          path: type
          value: kubernetes.io/basic-auth
        documentSelector:
          path: metadata.name
          value: pg-test-app-owner

  - it: gives a freshly generated users.app password to both Secrets
    templates:
      - templates/init-script.yaml
    set:
      users:
        app: {}
    asserts:
      - matchRegex:
          path: stringData.password
          pattern: ^[a-zA-Z0-9]{16}$
        documentSelector:
          path: metadata.name
          value: pg-test-app-owner

  - it: renders no owner secret when no user is named app
    templates:
      - templates/init-script.yaml
    set:
      users:
        other: {}
    asserts:
      # pg-test-credentials and pg-test-init-script only
      - hasDocuments:
          count: 2

  - it: points a new Cluster's initdb at the owner secret
    templates:
      - templates/db.yaml
    set:
      users:
        app: {}
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap
          value:
            initdb:
              secret:
                name: pg-test-app-owner

  - it: points a live initdb Cluster at the owner secret
    templates:
      - templates/db.yaml
    kubernetesProvider:
      scheme:
        "postgresql.cnpg.io/v1/Cluster":
          gvr:
            group: postgresql.cnpg.io
            version: v1
            resource: clusters
          namespaced: true
      objects:
        - apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: pg-test
            namespace: tenant-test
          spec:
            bootstrap:
              initdb:
                database: app
                owner: app
    set:
      users:
        app: {}
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: pg-test-app-owner
      - notExists:
          path: spec.bootstrap.recovery

  - it: keeps a restored Cluster on its recovery method
    # CNPG rejects a Cluster with two bootstrap methods, and a Cluster restored
    # from a backup keeps bootstrap.recovery in its live spec.
    templates:
      - templates/db.yaml
    kubernetesProvider:
      scheme:
        "postgresql.cnpg.io/v1/Cluster":
          gvr:
            group: postgresql.cnpg.io
            version: v1
            resource: clusters
          namespaced: true
      objects:
        - apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: pg-test
            namespace: tenant-test
          spec:
            bootstrap:
              recovery:
                database: app
                owner: app
                source: pg-old
    set:
      users:
        app: {}
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap.recovery.secret.name
          value: pg-test-app-owner
      - notExists:
          path: spec.bootstrap.initdb

  - it: leaves bootstrap unrendered when no user is named app
    templates:
      - templates/db.yaml
    set:
      users:
        other: {}
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - notExists:
          path: spec.bootstrap

  - it: leaves an in-progress restore's recovery block untouched
    # While bootstrap.enabled is on the init-job is skipped and the credentials
    # are flagged pending, so the owner password is not taken over mid-restore.
    templates:
      - templates/db.yaml
    set:
      users:
        app: {}
      backup:
        enabled: true
        useSystemBucket: false
        s3AccessKey: AKIAEXAMPLE
        s3SecretKey: s3cr3t
        destinationPath: s3://bucket/pg-test/
        endpointURL: https://s3.example:9000
      bootstrap:
        enabled: true
        oldName: pg-old
        serverName: pg-old
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap.recovery.source
          value: pg-old
      - notExists:
          path: spec.bootstrap.recovery.secret
