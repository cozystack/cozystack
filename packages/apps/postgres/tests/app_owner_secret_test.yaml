suite: users.app keeps its password across pod restarts

# "app" is the owner CNPG bootstraps, and CNPG's instance manager re-applies the
# owner's password from the bootstrap secret on every pod restart. A declared
# users.app must therefore hand CNPG its account Secret, the one its managed
# role reads, or the role reverts to CNPG's generated password.

release:
  name: pg-test
  namespace: tenant-test

set:
  _cluster:
    scheduling: {}

tests:
  - it: renders no owner secret of its own
    templates:
      - templates/init-script.yaml
    set:
      users:
        app: {}
    asserts:
      # pg-test-init-script only
      - hasDocuments:
          count: 1

  - it: points a new Cluster's initdb at the account Secret
    templates:
      - templates/db.yaml
    set:
      users:
        app: {}
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap
          value:
            initdb:
              secret:
                name: pg-test.app.account

  - it: points a live initdb Cluster at the account Secret
    templates:
      - templates/db.yaml
    kubernetesProvider:
      scheme:
        "postgresql.cnpg.io/v1/Cluster":
          gvr:
            group: postgresql.cnpg.io
            version: v1
            resource: clusters
          namespaced: true
      objects:
        - apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: pg-test
            namespace: tenant-test
          spec:
            bootstrap:
              initdb:
                database: app
                owner: app
    set:
      users:
        app: {}
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: pg-test.app.account
      - notExists:
          path: spec.bootstrap.recovery

  - it: keeps a restored Cluster on its recovery method
    # CNPG rejects a Cluster with two bootstrap methods, and a Cluster restored
    # from a backup keeps bootstrap.recovery in its live spec.
    templates:
      - templates/db.yaml
    kubernetesProvider:
      scheme:
        "postgresql.cnpg.io/v1/Cluster":
          gvr:
            group: postgresql.cnpg.io
            version: v1
            resource: clusters
          namespaced: true
      objects:
        - apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: pg-test
            namespace: tenant-test
          spec:
            bootstrap:
              recovery:
                database: app
                owner: app
                source: pg-old
    set:
      users:
        app: {}
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap.recovery.secret.name
          value: pg-test.app.account
      - notExists:
          path: spec.bootstrap.initdb

  - it: leaves bootstrap unrendered when no user is named app
    templates:
      - templates/db.yaml
    set:
      users:
        other: {}
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - notExists:
          path: spec.bootstrap

  - it: leaves an in-progress restore's recovery block untouched
    # While bootstrap.enabled is on the init-job is skipped, so the owner
    # password is not taken over mid-restore.
    templates:
      - templates/db.yaml
    set:
      users:
        app: {}
      backup:
        enabled: true
        useSystemBucket: false
        s3AccessKey: AKIAEXAMPLE
        s3SecretKey: s3cr3t
        destinationPath: s3://bucket/pg-test/
        endpointURL: https://s3.example:9000
      bootstrap:
        enabled: true
        oldName: pg-old
        serverName: pg-old
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap.recovery.source
          value: pg-old
      - notExists:
          path: spec.bootstrap.recovery.secret

  - it: drops recovery.source with its external cluster once bootstrap.enabled is off
    # A source naming an absent externalClusters entry is rejected by CNPG's
    # webhook, and both are read only at bootstrap.
    templates:
      - templates/db.yaml
    kubernetesProvider:
      scheme:
        "postgresql.cnpg.io/v1/Cluster":
          gvr:
            group: postgresql.cnpg.io
            version: v1
            resource: clusters
          namespaced: true
      objects:
        - apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: pg-test
            namespace: tenant-test
          spec:
            bootstrap:
              recovery:
                database: app
                owner: app
                source: pg-old
                recoveryTarget:
                  backupID: 20261019T000000
            externalClusters:
              - name: pg-old
    set:
      users:
        app: {}
      bootstrap:
        enabled: false
        oldName: pg-old
        backupID: 20261019T000000
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.bootstrap
          value:
            recovery:
              secret:
                name: pg-test.app.account
      - notExists:
          path: spec.externalClusters
