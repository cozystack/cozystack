suite: postgres credentials lookup-backed preservation
release:
  name: pg-test
  namespace: tenant-test
templates:
  - templates/init-script.yaml
tests:
  - it: preserves an existing password across renders
    # The lookup in init-script.yaml reads back the current Secret, so a user
    # keeps the password already stored rather than getting a fresh one on every
    # reconcile. kubernetesProvider mocks that existing Secret.
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: pg-test-credentials
            namespace: tenant-test
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
    set:
      users:
        testuser: {}
    documentSelector:
      path: metadata.name
      value: pg-test-credentials
    asserts:
      - equal:
          path: stringData.testuser
          value: existingpassword
