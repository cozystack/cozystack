suite: postgres credentials lookup-backed rotation paths
release:
  name: pg-test
  namespace: tenant-test
templates:
  - templates/init-script.yaml
tests:
  - it: preserves an existing password when the counter is unchanged
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: pg-test-credentials
            namespace: tenant-test
            annotations:
              postgres.cozystack.io/password-rotation: "0"
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
    set:
      users:
        testuser: {}
      passwordRotation: 0
    documentSelector:
      path: metadata.name
      value: pg-test-credentials
    asserts:
      - equal:
          path: stringData.testuser
          value: existingpassword
  - it: regenerates the password when the counter is bumped
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: pg-test-credentials
            namespace: tenant-test
            annotations:
              postgres.cozystack.io/password-rotation: "0"
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
    set:
      users:
        testuser: {}
      passwordRotation: 1
    documentSelector:
      path: metadata.name
      value: pg-test-credentials
    asserts:
      - notEqual:
          path: stringData.testuser
          value: existingpassword
      - matchRegex:
          path: stringData.testuser
          pattern: ^[a-zA-Z0-9]{16}$
      - equal:
          path: metadata.annotations["postgres.cozystack.io/password-rotation"]
          value: "1"
  - it: legacy secret without marker adopts baseline even when the counter is bumped
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: pg-test-credentials
            namespace: tenant-test
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
    set:
      users:
        testuser: {}
      passwordRotation: 1
    documentSelector:
      path: metadata.name
      value: pg-test-credentials
    asserts:
      - equal:
          path: stringData.testuser
          value: existingpassword
      - equal:
          path: metadata.annotations["postgres.cozystack.io/password-rotation"]
          value: "1"
