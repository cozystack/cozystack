suite: init-script applies user passwords at run time, never in cleartext SQL

# The generated password must NOT be rendered into the init-script SQL. That Secret
# is stored verbatim in the Helm release manifest and retained for MaxHistory
# revisions, so a password baked into `ALTER ROLE ... WITH PASSWORD '<literal>'`
# lingers in cleartext history that a tenant cannot scrub. The init Job must read
# each password from the <release>-credentials Secret at run time instead.
#
# A known password is seeded through kubernetesProvider so the assertions can prove
# that exact value never appears in the rendered init.sh, while the SQL still
# applies it through a psql variable (:'pw'), which psql quotes and escapes safely.

templates:
  - templates/init-script.yaml
  - templates/init-job.yaml

release:
  name: pg-test
  namespace: tenant-test

set:
  _cluster:
    scheduling: {}

tests:
  - it: does not write the seeded user password into the init-script SQL
    template: templates/init-script.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: pg-test-credentials
            namespace: tenant-test
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
    set:
      users:
        testuser: {}
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: existingpassword
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: "WITH PASSWORD '"

  - it: applies the password through a psql variable read from the mounted Secret
    template: templates/init-script.yaml
    set:
      users:
        testuser: {}
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "WITH PASSWORD :'pw'"
      - matchRegex:
          path: stringData["init.sh"]
          pattern: /credentials/testuser

  - it: reads every user's password at run time and keeps their replication flag
    # Each user gets its own run-time read and psql call; prove the per-user
    # wiring holds for more than one user and that the replication attribute still
    # rides alongside the run-time password (not lost in the rewrite).
    template: templates/init-script.yaml
    set:
      users:
        alice:
          replication: true
        bob: {}
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'pw=\$\(cat "/credentials/alice"\)'
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'pw=\$\(cat "/credentials/bob"\)'
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'ALTER ROLE "alice" WITH PASSWORD :''pw'' LOGIN INHERIT REPLICATION'
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'ALTER ROLE "bob" WITH PASSWORD :''pw'' LOGIN INHERIT NOREPLICATION'
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: "WITH PASSWORD '"

  - it: still stores each password in the credentials Secret, the single place it lives
    # The point of the change is to remove the password from the init-script, NOT
    # from the credentials Secret the tenant reads. Pin that it still lands there.
    template: templates/init-script.yaml
    set:
      users:
        alice: {}
    documentSelector:
      path: metadata.name
      value: pg-test-credentials
    asserts:
      - matchRegex:
          path: stringData.alice
          pattern: ^[a-zA-Z0-9]{16}$

  - it: mounts the credentials Secret into the init Job read-only at run time
    template: templates/init-job.yaml
    set:
      users:
        testuser: {}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credentials
            secret:
              secretName: pg-test-credentials
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: credentials
            mountPath: /credentials
            readOnly: true

  - it: does not mount the credentials Secret when no users are defined
    # The <release>-credentials Secret is rendered only when .Values.users is
    # non-empty (init-script.yaml). A userless release (the default users: {}, or
    # a databases-only deployment) must therefore NOT mount it, or the init Job
    # FailedMounts on a Secret that does not exist and the post-upgrade hook times
    # out, failing the release. The create-users loop is already empty here, so
    # nothing reads /credentials.
    template: templates/init-job.yaml
    set:
      users: {}
    asserts:
      - hasDocuments:
          count: 1
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: credentials
            secret:
              secretName: pg-test-credentials
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: credentials
            mountPath: /credentials
            readOnly: true
