suite: one CredentialTemplate per user, naming the account Secret the Cluster reads

# The template is the account the credentials API mints through; its name plus
# ".account" must be the passwordSecret db.yaml gives the managed role, or
# CloudNativePG reads a Secret nobody writes.

templates:
  - templates/credentials.yaml

release:
  name: pg-test
  namespace: tenant-test

set:
  _cluster:
    scheduling: {}

tests:
  - it: renders nothing without users
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a template per user, named for the account Secret's mapping
    set:
      users:
        web: {}
        Bob.Smith: {}
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: CredentialTemplate
      - equal:
          path: apiVersion
          value: cozystack.io/v1alpha1
      - equal:
          path: metadata.name
          value: pg-test.bob-smith
        documentIndex: 0
      - equal:
          path: spec.username
          value: Bob.Smith
        documentIndex: 0
      - equal:
          path: metadata.name
          value: pg-test.web
        documentIndex: 1

  - it: stores SCRAM verifiers and asks for the reload label
    set:
      users:
        web: {}
    asserts:
      - equal:
          path: spec.format.name
          value: scram-sha-256
      - equal:
          path: spec.secret.labels
          value:
            cnpg.io/reload: "true"
      - notExists:
          path: spec.valuesPath

  - it: refuses two users that map to one account
    set:
      users:
        web: {}
        Web: {}
    asserts:
      - failedTemplate:
          errorPattern: map to
