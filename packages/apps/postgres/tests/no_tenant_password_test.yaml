suite: no tenant password in any rendered object

# After the conversion the chart renders only references to the account Secrets
# the Cozystack API writes: no <release>-credentials Secret, no password in the
# init-script, no Role granting a credentials Secret, and the init-job mounts
# none. A tenant obtains a password by a mint on the account's Credential, once.

release:
  name: pg-test
  namespace: tenant-test

set:
  _cluster:
    scheduling: {}
  users:
    app: {}
    reporter:
      replication: true
  databases:
    shop:
      roles:
        admin: [app]
        readonly: [reporter]

tests:
  - it: renders only the init-script Secret from the template that rendered the credentials Secret
    template: templates/init-script.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: pg-test-init-script

  - it: writes no password statement into the init-script
    template: templates/init-script.yaml
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: 'PASSWORD'
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: '/credentials/'

  - it: grants no Secret to the dashboard role
    template: templates/dashboard-resourcemap.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - notContains:
          path: rules
          content:
            resources:
              - secrets
          any: true

  - it: mounts no credentials into the init-job
    template: templates/init-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: credentials
          any: true
