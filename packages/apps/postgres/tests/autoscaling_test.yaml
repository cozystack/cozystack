suite: postgres read-replica autoscaling (KEDA)

# Covers the autoscaling.enabled path: under active autoscaling the chart stops
# declaring spec.instances (so Flux/KEDA no longer contend) and renders a KEDA
# ScaledObject whose bounds encode the synchronous-quorum floor. dryRun keeps the
# static count and pauses the ScaledObject.

release:
  name: postgres-db
  namespace: tenant-acme

set:
  _cluster:
    scheduling: {}
    cluster-domain: cozy.local
  _namespace:
    monitoring: tenant-root

# The ScaledObject template guards on the KEDA CRD being present; make it available
# to every rendering test (individual guard tests override this).
capabilities:
  apiVersions:
    - keda.sh/v1alpha1

templates:
  - templates/db.yaml
  - templates/scaledobject.yaml

tests:
  - it: keeps a static spec.instances and renders no ScaledObject when autoscaling is off (default)
    templates:
      - templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.instances
          value: 2

  - it: renders no ScaledObject when autoscaling is off (default)
    templates:
      - templates/scaledobject.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: seeds spec.instances at the quorum floor and floors the WorkloadMonitor under active autoscaling
    templates:
      - templates/db.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 2
    asserts:
      # The field is seeded (not omitted) to effectiveMin = max(minReplicas=2,
      # maxSyncReplicas+1=3, 2) = 3 so a fresh Cluster is admitted at a valid,
      # quorum-satisfying count; KEDA then owns the runtime value via /scale and
      # the constant render keeps three-way merge from reverting it.
      - equal:
          path: spec.instances
          value: 3
        documentSelector:
          path: kind
          value: Cluster
      # WorkloadMonitor tracks the quorum-floored minimum instead of a stale static value
      - equal:
          path: spec.replicas
          value: 3
        documentSelector:
          path: kind
          value: WorkloadMonitor

  - it: seeds a quorum-valid instance count on a fresh autoscaled cluster with synchronous replication
    templates:
      - templates/db.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 1
    asserts:
      # Regression guard for the CNPG admission webhook: an absent .spec.instances
      # defaults to 1, and "maxSyncReplicas must be lower than the number of
      # instances" rejects the Cluster when maxSyncReplicas>=1. effectiveMin here is
      # max(2, 1+1, 2) = 2 > maxSyncReplicas=1, so the fresh Cluster is admitted.
      - equal:
          path: spec.instances
          value: 2
        documentSelector:
          path: kind
          value: Cluster

  - it: seeds spec.instances at the floor under active autoscaling without synchronous quorum
    templates:
      - templates/db.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 0
    asserts:
      # Non-quorum path also SEEDS effectiveMin (=2) rather than omitting the field.
      # Omitting would delete spec.instances on an existing cluster's enable-upgrade,
      # collapsing it to CNPG's default of 1 and decommissioning every replica PVC.
      # The constant seed is a three-way-merge no-op, so KEDA still owns the runtime
      # count via /scale while the enable dip is capped at the floor (>=2), not 1.
      - equal:
          path: spec.instances
          value: 2
        documentSelector:
          path: kind
          value: Cluster

  - it: renders a KEDA ScaledObject with quorum-floored bounds under active autoscaling
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledObject
      - equal:
          path: metadata.name
          value: postgres-db
      - equal:
          path: spec.scaleTargetRef.kind
          value: Cluster
      - equal:
          path: spec.scaleTargetRef.name
          value: postgres-db
      # minReplicaCount = max(minReplicas=2, maxSyncReplicas+1=3, 2) = 3
      - equal:
          path: spec.minReplicaCount
          value: 3
      - equal:
          path: spec.maxReplicaCount
          value: 6
      - equal:
          path: spec.triggers[0].type
          value: prometheus
      - equal:
          path: spec.triggers[0].metadata.threshold
          value: "150"
      # fail-safe: empty result must error (HPA holds), not read as 0 (scale to floor)
      - equal:
          path: spec.triggers[0].metadata.ignoreNullValues
          value: "false"
      - matchRegex:
          path: spec.triggers[0].metadata.serverAddress
          pattern: ^http://vmselect-.*:8481/select/0/prometheus$
      # the query is scoped to the tenant namespace and folds the target in as +150
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: tenant-acme
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: \+ 150
      # read load is restricted to standby pods via the exact kube_pod_labels key
      # kube-state-metrics exposes for CNPG's cnpg.io/instance_role (verified live:
      # label_cnpg_io_instance_role, snake_case, not camelCase). A wrong key matches
      # no series; the floor below is gated on replica-pod existence so that fails
      # safe (empty → HPA holds) rather than reading no-series as idle.
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: label_cnpg_io_instance_role="replica"
      # ...and scoped to THIS cluster by release name, so a namespace with multiple
      # postgres clusters does not cross-count. The dashboard read-load panel mirrors
      # this per-cluster scoping (label_cnpg_io_cluster).
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: label_cnpg_io_cluster="postgres-db"
      # Fail-safe floor (design proposal: "must not read a missing sample as zero").
      # The `or vector(0)` is gated on `count(...replica) > 0`, so a broken metrics
      # pipeline (empty join) leaves the term empty → KEDA FailedGetExternalMetric →
      # HPA holds, instead of collapsing a loaded cluster to the floor.
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: or \(vector\(0\) and on\(\) \(count\(kube_pod_labels

  - it: honors an explicit autoscaling.serverAddress override (own-monitoring tenants)
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        serverAddress: http://custom-vmselect.example.svc:8481/select/0/prometheus
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 2
    asserts:
      # A tenant whose derived vmselect lacks kube_pod_labels (monitoring: true) points
      # serverAddress at one that holds both series; the override wins over the derived
      # per-tenant address.
      - equal:
          path: spec.triggers[0].metadata.serverAddress
          value: http://custom-vmselect.example.svc:8481/select/0/prometheus

  - it: fails closed when the quorum floor exceeds maxReplicas rather than silently running an unbounded count
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 6
    asserts:
      # floor = maxSyncReplicas+1 = 7 > maxReplicas 6. Previously effectiveMax silently
      # raised BOTH bounds to 7 (a maxReplicas cost ceiling quietly defeated, unbounded
      # for a large maxSyncReplicas). Now the render fails closed and tells the operator
      # to raise maxReplicas.
      - failedTemplate:
          errorMessage: "postgres: the effective minimum instance count (7 = max(minReplicas 2, maxSyncReplicas+1 7, 2)) exceeds autoscaling.maxReplicas (6); raise maxReplicas to at least the quorum floor."

  - it: rejects a stray maxReplicas of 0 (effective floor > max) rather than coercing or clamping it
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 0
        target: 150
      quorum:
        maxSyncReplicas: 0
    asserts:
      # maxReplicas: 0 is neither silently coerced to the values default (6) nor
      # clamped to the floor: the effective minimum (2, the read floor) exceeds
      # maxReplicas (0), a contradiction that fails at render with a clear message.
      - failedTemplate:
          errorMessage: "postgres: the effective minimum instance count (2 = max(minReplicas 2, maxSyncReplicas+1 1, 2)) exceeds autoscaling.maxReplicas (0); raise maxReplicas to at least the quorum floor."

  - it: holds instances at the staged count and pauses the ScaledObject in migration phase 1 (transition)
    set:
      replicas: 5                    # operator stages this to the live instance count
      autoscaling:
        enabled: true
        transition: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 2
    asserts:
      # phase 1: the static field is kept (as a floor) so three-way merge cannot
      # delete it and collapse CNPG to 1 while KEDA stands up
      - equal:
          path: spec.instances
          value: 5
        documentSelector:
          path: kind
          value: Cluster
        template: templates/db.yaml
      # ...and the ScaledObject is present but paused in BOTH directions (no writer
      # contention yet). Deliberately not the full paused annotation, which would
      # delete the HPA; the unidirectional pair keeps the HPA warm for phase 2.
      - equal:
          path: metadata.annotations["autoscaling.keda.sh/paused-scale-in"]
          value: "true"
        template: templates/scaledobject.yaml
      - equal:
          path: metadata.annotations["autoscaling.keda.sh/paused-scale-out"]
          value: "true"
        template: templates/scaledobject.yaml
      # the HPA-deleting full pause must NOT be set
      - notExists:
          path: metadata.annotations["autoscaling.keda.sh/paused"]
        template: templates/scaledobject.yaml

  - it: does not dip instances when transition flips to active (phase 1 -> phase 2, staged replicas)
    templates:
      - templates/db.yaml
    set:
      replicas: 5                    # staged to the live count in phase 1
      autoscaling:
        enabled: true
        transition: false            # phase 2: active autoscaling
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 2
    asserts:
      # Phase 1 (transition:true, tested above) renders instances: replicas = 5. Phase 2
      # (active) must render the SAME 5 so the three-way merge is a no-op and the live
      # cluster does not shed replicas. activeSeed = max(replicas 5, effectiveMin 3) = 5.
      # Seeding effectiveMin alone would render 3 here and drop 5->3 at the flip.
      - equal:
          path: spec.instances
          value: 5
        documentSelector:
          path: kind
          value: Cluster

  - it: seeds the quorum floor (not the smaller staged replicas) when replicas is below the floor
    templates:
      - templates/db.yaml
    set:
      replicas: 2
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 4             # floor = 5 > replicas 2
    asserts:
      # activeSeed = max(replicas 2, effectiveMin 5) = 5 — the floor still wins, so the
      # constant never undercuts synchronous quorum even with a small replicas.
      - equal:
          path: spec.instances
          value: 5
        documentSelector:
          path: kind
          value: Cluster

  - it: builds a CPU query when metric is ReadCPUUtilization
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        metric: ReadCPUUtilization
        minReplicas: 2
        maxReplicas: 6
        target: 500
      quorum:
        maxSyncReplicas: 2
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: container_cpu_usage_seconds_total
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: \+ 500
      # same standby-only selector on the CPU path
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: label_cnpg_io_instance_role="replica"

  - it: folds the replication-lag brake into the query when maxReplicationLagSeconds > 0
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
        maxReplicationLagSeconds: 30
      quorum:
        maxSyncReplicas: 2
    asserts:
      # lag term (with hysteresis via max_over_time) at the configured threshold,
      # individually floored so an absent lag metric resolves to 0 (fail-open)
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: max_over_time\(cnpg_pg_replication_lag.*> bool 30\) or vector\(0\)
      # write gate so an idle primary does not trip the brake, likewise floored
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: rate\(cnpg_collector_wal_records.*> bool 0\) or vector\(0\)
      # frozen branch pins desired to the current instance count under lag, counting
      # only instance pods (role-scoped) so lingering CNPG join/bootstrap Job pods
      # (which carry cnpg.io/cluster but jobRole, not instanceRole) don't inflate it
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: count\(kube_pod_labels\{namespace="tenant-acme",label_cnpg_io_cluster="postgres-db",label_cnpg_io_instance_role=~".\+"\}\) \* 150
      # the frozen summand is floored with `or vector(0)` so a kube-state-metrics
      # scrape gap (empty count) cannot empty the whole `+` sum and defeat the
      # base term's own floor
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: count\(kube_pod_labels.*\* 150\).*or vector\(0\)\)$

  - it: fails closed when the monitoring namespace is not set
    templates:
      - templates/scaledobject.yaml
    set:
      _namespace:
        monitoring: ""
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 0
    asserts:
      - failedTemplate:
          errorMessage: "postgres: autoscaling requires a monitoring namespace to reach vmselect, but none is set (_namespace.monitoring is empty). The platform normally injects it; ensure the tenant has monitoring enabled."

  - it: omits the replication-lag brake when maxReplicationLagSeconds is 0
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
        maxReplicationLagSeconds: 0
      quorum:
        maxSyncReplicas: 2
    asserts:
      - notMatchRegex:
          path: spec.triggers[0].metadata.query
          pattern: cnpg_pg_replication_lag

  - it: keeps the static count and pauses the ScaledObject in dry-run mode
    set:
      autoscaling:
        enabled: true
        dryRun: true
        minReplicas: 2
        maxReplicas: 6
        target: 150
      quorum:
        maxSyncReplicas: 1
    asserts:
      - equal:
          path: spec.instances
          value: 2
        documentSelector:
          path: kind
          value: Cluster
        template: templates/db.yaml
      # dry-run pauses both directions (HPA kept + metric still served; desired freezes
      # to current, so the recommendation is read from the metric), never the
      # HPA-deleting full pause that would blind the recommendation entirely.
      - equal:
          path: metadata.annotations["autoscaling.keda.sh/paused-scale-in"]
          value: "true"
        template: templates/scaledobject.yaml
      - equal:
          path: metadata.annotations["autoscaling.keda.sh/paused-scale-out"]
          value: "true"
        template: templates/scaledobject.yaml
      - notExists:
          path: metadata.annotations["autoscaling.keda.sh/paused"]
        template: templates/scaledobject.yaml

  - it: fails closed when the static instance count would violate synchronous quorum (disable-wedge guard)
    templates:
      - templates/db.yaml
    set:
      # autoscaling off: the chart renders the static instances: <replicas>. With
      # replicas at its default 2 and maxSyncReplicas 2, CNPG would reject the
      # Cluster (maxSyncReplicas must be < instances). This is exactly the wedge a
      # tenant hits when DISABLING autoscaling on a quorum cluster whose replicas
      # was never raised off the default. Must fail closed at render, not at the webhook.
      autoscaling:
        enabled: false
      quorum:
        maxSyncReplicas: 2
    asserts:
      - failedTemplate:
          errorMessage: "postgres: replicas (2) must be greater than quorum.maxSyncReplicas (2) - CNPG rejects a Cluster whose maxSyncReplicas is not lower than its instance count. Raise replicas above maxSyncReplicas. (If you are disabling autoscaling on a synchronous-quorum cluster, first set replicas to at least the live instance count: kubectl scale cluster.postgresql.cnpg.io/postgres-db --replicas=<live count>, with the HelmRelease suspended.)"

  - it: fires the disable-wedge guard in dryRun too (else branch, not only when disabled)
    templates:
      - templates/db.yaml
    set:
      # dryRun takes the same static-count else branch as disable, so the wedge must
      # fire here as well: flipping a quorum cluster whose replicas is still the default
      # into dryRun would otherwise render an invalid instances: 2 with maxSyncReplicas 2.
      autoscaling:
        enabled: true
        dryRun: true
      quorum:
        maxSyncReplicas: 2
    asserts:
      - failedTemplate:
          errorMessage: "postgres: replicas (2) must be greater than quorum.maxSyncReplicas (2) - CNPG rejects a Cluster whose maxSyncReplicas is not lower than its instance count. Raise replicas above maxSyncReplicas. (If you are disabling autoscaling on a synchronous-quorum cluster, first set replicas to at least the live instance count: kubectl scale cluster.postgresql.cnpg.io/postgres-db --replicas=<live count>, with the HelmRelease suspended.)"

  - it: rejects a non-positive autoscaling target
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
        target: 0
      quorum:
        maxSyncReplicas: 2
    asserts:
      - failedTemplate:
          errorMessage: "postgres: autoscaling.target must be a positive integer (the desired-replica formula divides the read load by it)."

  - it: rejects minReplicas greater than maxReplicas instead of silently clamping
    templates:
      - templates/scaledobject.yaml
    set:
      autoscaling:
        enabled: true
        minReplicas: 10
        maxReplicas: 3
        target: 150
      quorum:
        maxSyncReplicas: 0
    asserts:
      - failedTemplate:
          errorMessage: "postgres: the effective minimum instance count (10 = max(minReplicas 10, maxSyncReplicas+1 1, 2)) exceeds autoscaling.maxReplicas (3); raise maxReplicas to at least the quorum floor."
