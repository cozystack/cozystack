suite: per-user CREATEROLE attribute

# users.<name>.createRole is refused while users are CloudNativePG managed
# roles. A role a CREATEROLE user creates makes that user a member of it;
# CloudNativePG revokes every membership a managed role is not declared to hold,
# and the revoke fails on the dependent self-grant, which leaves the user stuck
# in cannotReconcile on ordinary use. CloudNativePG has no per-role switch to
# leave memberships alone. The refusal renders with the Cluster, on every path,
# recovery included, so an existing release that grants it keeps its previous
# chart version until the flag is set to false.

templates:
  - templates/init-script.yaml
  - templates/db.yaml

release:
  name: pg-test
  namespace: tenant-test

set:
  _cluster:
    scheduling: {}

tests:
  - it: "user is NOCREATEROLE by default"
    set:
      users:
        app: {}
    template: templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: app
            login: true
            inherit: true
            replication: false
            createrole: false
            bypassrls: false
            comment: user managed by helm
            inRoles:
              - "cozystack:managed"
            passwordSecret:
              name: pg-test.app.account

  - it: "createRole=true is refused while users are managed roles"
    set:
      version: v18
      users:
        app:
          createRole: true
    template: templates/db.yaml
    asserts:
      - failedTemplate:
          errorMessage: "users.app.createRole is not supported: users are CloudNativePG managed roles, which revoke the membership PostgreSQL gives a CREATEROLE user in each role it creates. Set createRole to false; an existing release with it keeps its previous chart version until then"

  - it: "createRole=false renders createrole false, so a role that held it loses it"
    set:
      version: v18
      users:
        app:
          createRole: false
    template: templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: app
            createrole: false
          any: true

  - it: "createRole on PostgreSQL 15 is refused"
    set:
      version: v15
      users:
        app:
          createRole: true
    template: templates/db.yaml
    asserts:
      - failedTemplate:
          errorMessage: "users.app.createRole is not supported: users are CloudNativePG managed roles, which revoke the membership PostgreSQL gives a CREATEROLE user in each role it creates. Set createRole to false; an existing release with it keeps its previous chart version until then"

  - it: "createRole on PostgreSQL 13 is refused"
    set:
      version: v13
      users:
        app:
          createRole: true
    template: templates/db.yaml
    asserts:
      - failedTemplate:
          errorMessage: "users.app.createRole is not supported: users are CloudNativePG managed roles, which revoke the membership PostgreSQL gives a CREATEROLE user in each role it creates. Set createRole to false; an existing release with it keeps its previous chart version until then"

  # The refusal renders with the Cluster, so a restore cannot get past it.
  # roles do, so the guard sits with them.
  - it: "createRole on PostgreSQL 15 is refused on recovery too"
    set:
      version: v15
      bootstrap:
        enabled: true
        oldName: pg-old
      backup:
        s3AccessKey: a
        s3SecretKey: b
      users:
        migrator:
          createRole: true
    template: templates/db.yaml
    asserts:
      - failedTemplate:
          errorMessage: "users.migrator.createRole is not supported: users are CloudNativePG managed roles, which revoke the membership PostgreSQL gives a CREATEROLE user in each role it creates. Set createRole to false; an existing release with it keeps its previous chart version until then"

  - it: "createRole on PostgreSQL 13 is refused on recovery too"
    set:
      version: v13
      bootstrap:
        enabled: true
        oldName: pg-old
      backup:
        s3AccessKey: a
        s3SecretKey: b
      users:
        migrator:
          createRole: true
    template: templates/db.yaml
    asserts:
      - failedTemplate:
          errorMessage: "users.migrator.createRole is not supported: users are CloudNativePG managed roles, which revoke the membership PostgreSQL gives a CREATEROLE user in each role it creates. Set createRole to false; an existing release with it keeps its previous chart version until then"

  - it: "PostgreSQL 15 renders fine as long as createRole is not requested"
    set:
      version: v15
      users:
        app: {}
    template: templates/init-script.yaml
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'GRANT "cozystack:managed" TO "app";'

  - it: "bypassRls is allowed on PostgreSQL 15, it carries no escalation path of its own"
    set:
      version: v15
      users:
        app:
          bypassRls: true
    template: templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: app
            bypassrls: true
          any: true

  # still sets it, once the role exists, since the hook may run before the
  # operator has created it.
  - it: "withdrawing createRole resets createrole_self_grant"
    set:
      version: v18
      users:
        app:
          createRole: false
    template: templates/init-script.yaml
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "SELECT 'ALTER ROLE \"app\" RESET createrole_self_grant;'\\nWHERE EXISTS \\(SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app'\\)\\\\gexec"

  - it: "does not fail the wait when no user holds createRole"
    set:
      version: v18
      users:
        app: {}
    template: templates/init-script.yaml
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - notMatchRegex:
          path: stringData["init.sh"]
          pattern: "createRole users still absent"
