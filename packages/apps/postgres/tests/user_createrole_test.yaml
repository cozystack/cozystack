suite: per-user CREATEROLE attribute

# users.<name>.createRole grants the CREATEROLE role attribute to a managed login
# user, so a tenant can create and manage its own roles without the postgres
# superuser. Role attributes are not inherited through role membership, so the
# attribute cannot be carried by the generated <db>_admin group role and has to be
# set on the login user itself.
#
# The attribute is declared on the Cluster's managed role, which CloudNativePG
# reconciles on every change: flipping createRole back to false renders
# createrole: false and the operator revokes it.
#
# The guard on PostgreSQL 16 is a security boundary, not a cosmetic check. Before
# PostgreSQL 16, CREATEROLE allowed granting membership in any non-superuser role,
# so a user holding it could grant itself pg_execute_server_program and reach
# command execution on the instance. PostgreSQL 16 restricted CREATEROLE to roles
# the grantee administers, which is what makes the attribute safe to expose.

templates:
  - templates/init-script.yaml
  - templates/db.yaml

release:
  name: pg-test
  namespace: tenant-test

set:
  _cluster:
    scheduling: {}

tests:
  - it: "user is NOCREATEROLE by default"
    set:
      users:
        app: {}
    template: templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: app
            login: true
            inherit: true
            replication: false
            createrole: false
            bypassrls: false
            comment: user managed by helm
            inRoles:
              - "cozystack:managed"
            passwordSecret:
              name: pg-test.app.account

  - it: "createRole=true renders createrole on the managed role"
    set:
      version: v18
      users:
        app:
          createRole: true
    template: templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: app
            createrole: true
          any: true

  - it: "createRole=false renders createrole false so the attribute is revoked"
    set:
      version: v18
      users:
        app:
          createRole: false
    template: templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: app
            createrole: false
          any: true

  - it: "createRole composes with replication and bypassRls"
    set:
      version: v18
      users:
        app:
          replication: true
          createRole: true
          bypassRls: true
    template: templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: app
            replication: true
            createrole: true
            bypassrls: true
          any: true

  - it: "createRole on PostgreSQL 15 fails fast"
    set:
      version: v15
      users:
        app:
          createRole: true
    template: templates/init-script.yaml
    asserts:
      - failedTemplate:
          errorMessage: "SECURITY: users.app.createRole requires PostgreSQL 16 or newer. On PostgreSQL 15 and older, a role holding CREATEROLE can grant itself any non-superuser role, including pg_execute_server_program, which escalates to command execution on the instance."

  - it: "createRole on PostgreSQL 13 fails fast"
    set:
      version: v13
      users:
        app:
          createRole: true
    template: templates/init-script.yaml
    asserts:
      - failedTemplate:
          errorMessage: "SECURITY: users.app.createRole requires PostgreSQL 16 or newer. On PostgreSQL 15 and older, a role holding CREATEROLE can grant itself any non-superuser role, including pg_execute_server_program, which escalates to command execution on the instance."

  - it: "PostgreSQL 15 renders fine as long as createRole is not requested"
    set:
      version: v15
      users:
        app: {}
    template: templates/init-script.yaml
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: 'GRANT "cozystack:managed" TO "app";'

  - it: "bypassRls is allowed on PostgreSQL 15, it carries no escalation path of its own"
    set:
      version: v15
      users:
        app:
          bypassRls: true
    template: templates/db.yaml
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: app
            bypassrls: true
          any: true

  # CloudNativePG has no field for createrole_self_grant, so the init-script
  # still sets it, once the role exists, since the hook may run before the
  # operator has created it.
  - it: "createRole sets createrole_self_grant so the attribute is usable"
    set:
      version: v18
      users:
        app:
          createRole: true
    template: templates/init-script.yaml
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "SELECT 'ALTER ROLE \"app\" SET createrole_self_grant = ''set, inherit'';'\\nWHERE EXISTS \\(SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app'\\)\\\\gexec"

  - it: "withdrawing createRole resets createrole_self_grant"
    set:
      version: v18
      users:
        app:
          createRole: false
    template: templates/init-script.yaml
    documentSelector:
      path: metadata.name
      value: pg-test-init-script
    asserts:
      - matchRegex:
          path: stringData["init.sh"]
          pattern: "SELECT 'ALTER ROLE \"app\" RESET createrole_self_grant;'\\nWHERE EXISTS \\(SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app'\\)\\\\gexec"
