## @section Quorum-based synchronous replication
##

## @typedef {struct} Quorum - Quorum configuration for synchronous replication.
## @field {int} minSyncReplicas - Minimum number of synchronous replicas required for commit.
## @field {int} maxSyncReplicas - Maximum number of synchronous replicas allowed (must be less than total replicas).

## @param {Quorum} quorum - Quorum configuration for synchronous replication.
quorum:
  minSyncReplicas: 0
  maxSyncReplicas: 0

##
## @section Autoscaling
##

## @typedef {struct} Autoscaling - Horizontal autoscaling of read replicas via KEDA. When active, `replicas` is no longer declared statically — a KEDA ScaledObject drives the CNPG instance count from read load.
## @field {bool} enabled - Enable horizontal autoscaling of read replicas. Requires the platform `keda` package to be enabled by an administrator first; the chart fails to render (rather than break the release) if KEDA is not installed.
## @field {int} minReplicas - Minimum total instances; raised to the synchronous-quorum floor (`maxSyncReplicas + 1`) and to 2 when either is higher.
## @field {int} maxReplicas - Maximum total instances. Must be >= minReplicas and >= the synchronous-quorum floor (maxSyncReplicas+1); the chart fails to render (rather than silently run an unbounded instance count) if the effective floor exceeds it - raise maxReplicas.
## @field {ReadMetric} metric - Read-load signal to scale on.
## @field {int} target - Target read load per read-serving replica (unit depends on `metric`: active connections, or CPU millicores). Dimensionless integer - a resource.Quantity here would accept `150m`, which PromQL reads as 150 minutes and KEDA cannot use as a threshold.
## @field {int} maxReplicationLagSeconds - Freeze scaling while replication lag exceeds this (seconds) and the primary is writing. 0 disables the brake. Default 0: the freeze branch has only been validated on a live cluster in its non-braking (pass-through) form, so the lag brake is opt-in until the braking path is exercised under load; set a positive value (e.g. 30) to enable it.
## @field {bool} dryRun - Recommendation mode: keep the static count and render the ScaledObject with both scaling directions paused, so KEDA keeps the HPA and keeps serving its trigger metric but actuates neither way. Note both scaling policies are disabled, so the HPA's desiredReplicas is frozen to the current count - read the recommendation from the matching read-load dashboard panel for your metric (connections or CPU): desired = 1 + ceil(read load / target), clamped to [effectiveMin..maxReplicas] where effectiveMin = max(minReplicas, maxSyncReplicas+1, 2), not from the desired-replicas line. Like disabling, flipping a LIVE autoscaled cluster into dryRun re-renders instances from `replicas`; if `replicas` is below the live count, stage it to the live count first (see the enablement note) or the cluster sheds replicas down to max(replicas, floor). Permanent, unlike `transition`.
## @field {bool} transition - Migration phase 1: render `.spec.instances` from `replicas` (which the operator stages to the current live count) AND pause the ScaledObject in both directions, so KEDA stands up with its HPA present but not actuating. Flip to false (phase 2) to hand the runtime count to KEDA. Because the both-direction pause keeps the HPA (not the HPA-deleting full pause), KEDA is genuinely warm at phase 2 — no HPA recreate — and because the active seed is max(replicas, effectiveMin), phase 2 re-renders the same instance count phase 1 did (when `replicas` is staged at/above the floor), so the flip is a merge no-op with no dip. The HPA's scaleUp stabilization window still smooths the first actuation.

## @enum {string} ReadMetric - Read-load metric type.
## @value ReadConnections - Active read connections on the standby pods.
## @value ReadCPUUtilization - CPU (millicores) of the postgres container on the standby pods.

## Under active autoscaling the KEDA HPA owns the runtime count via the /scale
## subresource, and the chart SEEDS `.spec.instances` at a CONSTANT =
## max(.Values.replicas, effectiveMin), where effectiveMin = max(minReplicas,
## maxSyncReplicas+1, 2). It re-renders that same constant every reconcile, so
## helm-controller's client-side three-way merge (not SSA — confirmed:
## internal/operator/package_reconciler.go buildHelmReleaseSpec sets no Upgrade.Force
## and leaves driftDetection off) is a no-op on the field and never reverts KEDA's higher
## live value written through /scale. Seeding (rather than omitting) is deliberate: an
## omitted field defaults to 1, which the CNPG webhook rejects under quorum, and — worse
## — deleting the field on an existing cluster's enable-upgrade collapses it to 1 and
## decommissions every replica PVC before KEDA re-clones.
## Seeding max(replicas, effectiveMin) — rather than effectiveMin alone — keeps the active
## branch equal to the disabled/dryRun/transition branch (which renders `instances:
## replicas`) whenever `replicas` sits at or above the floor, so enabling, dry-running, or
## completing a transition is a merge no-op and the live count does NOT dip.
## The merge writes `instances` (rebasing the live count) only when the newly-rendered
## SEED differs from the previously-rendered one — KEDA's live count is never compared —
## so the residual drop cases are narrow:
##   (1) LOWERING `.Values.replicas` below the live count (or enabling with `replicas`
##       left at its default 2 while the live cluster is larger): the seed becomes
##       max(replicas, floor) and the live count rebases down to it (never below the
##       quorum floor, never a collapse to 1), decommissioning the surplus replicas+PVCs.
##       Stage `replicas` to the live count first to avoid this.
##   (2) RAISING `minReplicas`/`quorum.maxSyncReplicas` so the floor exceeds both the live
##       count and `replicas`: the seed rises and the live count is raised to it. Lowering
##       the floor is a no-op while `replicas` >= the new floor.
## To rebase deliberately with no transient: suspend the HelmRelease, pin the live count
## with `kubectl scale cluster.postgresql.cnpg.io/<name> --replicas=<live count>` and set
## `.Values.replicas` to match (or use the two-phase `transition` flow), apply, then
## resume. The `transition` flag additionally lets KEDA come up warm so it actuates at
## phase 2 without recreating the HPA.
## Keep `.Values.replicas` greater than `quorum.maxSyncReplicas` even under autoscaling:
## the active path floors the seed up to effectiveMin so it admits a too-small `replicas`,
## but the static path (disable / dryRun / transition phase 1) renders `instances:
## replicas` and fails closed when `replicas <= maxSyncReplicas` — so a too-small
## `replicas` only surfaces when you later disable or dry-run, not at enable.
## Likewise `autoscaling.maxReplicas` must be >= effectiveMin = max(minReplicas,
## maxSyncReplicas+1, 2) or the chart fails to render (it will not silently run an
## unbounded instance count) — e.g. with the default read floor, maxReplicas must be >= 2.
## @param {Autoscaling} autoscaling - Read-replica autoscaling configuration.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  metric: ReadConnections
  target: 150
  maxReplicationLagSeconds: 0
  dryRun: false
  transition: false

