suite: vpn default render

# Both templates are loaded so the Deployment's checksum/config annotation can
# resolve its include of secret.yaml; template: pins assertions to the
# Deployment document alone.
templates:
  - templates/deployment.yaml
  - templates/secret.yaml

release:
  name: vpn-test
  namespace: tenant-test

set:
  _namespace:
    host: example.com

tests:
  - it: renders a Deployment with the default replicas and image
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: vpn-test-vpn
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: "quay.io/outline/shadowbox:stable"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 40000
