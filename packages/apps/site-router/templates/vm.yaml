{{- /*
  Gateway VyOS VirtualMachine, rendered directly (not via the vm-instance chart)
  so we control blockSize (DRBD 4Kn), the cloud-init NoCloud seed and the stable
  firmware UUID. Single-homed on the tenant default pod network (Phase-1 routed
  mode): the tunnel endpoint and the routed forwarding both ride the pod NIC.
*/ -}}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "site-router.labels" . | nindent 4 }}
spec:
  runStrategy: Always
  template:
    metadata:
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
        # A router forwards packets whose source IP is not its own pod IP, so
        # OVN per-port anti-spoof (port_security) must be OFF on the gateway port.
        # kube-ovn v1.15.10 only reconciles the logical-switch-port port_security
        # field at pod CREATE — flipping the annotation on a live virt-launcher pod
        # does NOT take effect (validated live) — so it is baked here on the pod
        # template and the virt-launcher pod is born with it. The controller
        # VERIFIES this annotation (it no longer patches live) and gates its Ready
        # progression on the guest tunnel-ingress source filter, which is the
        # sole compensating control (see docs/security-model.md, D8-ordering).
        ovn.kubernetes.io/port_security: "false"
      labels:
        {{- include "site-router.selectorLabels" . | nindent 8 }}
    spec:
      domain:
        cpu:
          cores: {{ .Values.resources.cpu | int64 }}
          sockets: 1
          threads: 1
        memory:
          guest: {{ .Values.resources.memory }}
        firmware:
          uuid: {{ include "site-router.stableUuid" . }}
        devices:
          disks:
          - name: boot
            disk:
              bus: virtio
            blockSize:
              custom:
                logical: 512
                physical: 4096
            bootOrder: 1
          - name: cloudinitdisk
            disk: {}
{{- if .Values._logSerialConsole }}
          - name: cozydiag
            disk: {}
{{- end }}
          interfaces:
          - name: default
            bridge: {}
          {{- /* Platform-and-suite-only, and rendered only when true. The
                underscore is the access control, not a naming style: the
                aggregated API reserves top-level `_`-prefixed values keys and
                rejects them from a tenant on both Create and Update
                (validateNoInternalKeys in pkg/registry/apps/application/rest.go),
                so the only key that switches the console on cannot come from a
                tenant. Nothing reads the un-prefixed `logSerialConsole`, so a
                tenant who sets that renders exactly this nothing. See the block
                in values.yaml for the whole boundary.

                Rendered only when true because this key overrides the platform's
                cluster-wide disableSerialConsoleLog, which exists because the
                guest-console-log container has held virt-launcher in
                PodInitializing (kubevirt/kubevirt#15989). An explicit false
                therefore renders the same nothing as an absent field rather than
                KubeVirt's tri-state false. */}}
          {{- if .Values._logSerialConsole }}
          logSerialConsole: true
          {{- end }}
        machine:
          type: ""
      terminationGracePeriodSeconds: 30
      volumes:
      - name: boot
        dataVolume:
          name: {{ .Release.Name }}-boot
      - name: cloudinitdisk
        cloudInitNoCloud:
          secretRef:
            name: {{ .Release.Name }}-cloud-init
{{- if .Values._logSerialConsole }}
      {{- /*
        A plain Secret volume, which KubeVirt renders as an iso9660 disk. The
        appliance seed finds it with `blkid -L cozydiag`, and volumeLabel is what
        puts that label on the filesystem: KubeVirt takes it from
        Secret.VolumeLabel and NOT from the volume name (kubevirt
        pkg/config/secret.go getLabel). An earlier revision of this comment said
        the volume name was the label; it is not, the label was empty, and the
        seed silently installed no diagnostics on every run — which is how the
        one channel that could have explained a failing guest was itself missing.

        Separate from the NoCloud disk on purpose: the configuration seed and the
        diagnostics must not be able to break each other (see
        site-router.diagFiles).
      */}}
      - name: cozydiag
        secret:
          secretName: {{ .Release.Name }}-diag
          volumeLabel: cozydiag
{{- end }}
      networks:
      - name: default
        pod: {}
