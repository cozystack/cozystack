{{- /*
  VyOS HTTPS-API token + first-boot cloud-init, rendered in ONE file so the
  token is resolved exactly once and shared. The api-key Secret is RBAC-isolated
  (NOT in the AppDef secrets.include list, NOT in the dashboard Role): only the
  controller reads it (D6). The cloud-init Secret seeds the token into first boot
  so the API is authenticated before it is reachable.

  Fail-closed management binding: an empty managementCIDR requires an explicit
  allowOpenManagement=true, mirroring the controller's --management-cidr flag.
*/ -}}
{{- if and (not (include "site-router.managementCIDR" .)) (not .Values._allowOpenManagement) }}
{{- fail "_managementCIDR is required (fail-closed); it is a platform value, and an empty one needs an explicit _allowOpenManagement=true to expose the VyOS API unrestricted" }}
{{- end }}
{{- $token := include "site-router.apiToken" . }}
{{- $tls := include "site-router.apiTLS" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api-key
  labels:
    {{- include "site-router.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
  {{- /*
    The certificate the appliance presents on its HTTPS API, and the name it is
    issued for. They ride in this Secret rather than a new one because it is
    already the RBAC-isolated, controller-only object, and because the
    controller reads it on the same path it reads the token — the credential and
    the means of checking who receives it belong together.

    tls.key is here because the config.boot seed is rendered from this same
    render, and lookup-preserve needs somewhere to read it back from on the next
    one. It never leaves the controller's RBAC scope.
  */}}
  tls.crt: {{ $tls.cert | quote }}
  tls.key: {{ $tls.key | quote }}
  tls.servername: {{ $tls.serverName | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cloud-init
  labels:
    {{- include "site-router.labels" . | nindent 4 }}
type: Opaque
stringData:
  userdata: |
    {{- include "site-router.cloudInitUserData" (dict "ctx" . "token" $token "tls" $tls) | nindent 4 }}
{{- if .Values._logSerialConsole }}
---
{{- /*
  Bring-up diagnostics, on their own disk so nothing here can reach the
  configuration seed above. Rendered only when the platform or the e2e suite
  asked for the serial console (`_logSerialConsole`, which the aggregated API
  refuses from a tenant; see the block in values.yaml) — the emitter is useless
  without something capturing what it prints, and the capture is much weaker
  without it, so the two share one switch.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-diag
  labels:
    {{- include "site-router.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "site-router.diagFiles" (dict "ctx" .) | nindent 2 }}
{{- end }}
