##
## @section Tunnel configuration
##

## @enum {string} TunnelType - Site-to-site tunnel protocol. Phase 1 implements only `ipsec`; the enum is kept single-value for forward-compatibility.
## @value ipsec

## @typedef {struct} Tunnel - Site-to-site tunnel configuration.
## @field {TunnelType} type - Tunnel protocol used to connect to the remote peer.

## @param {Tunnel} tunnel - Site-to-site tunnel configuration.
tunnel:
  type: ipsec

## @typedef {struct} PeerAuth - Authentication material for the tunnel (IPsec pre-shared key).
## @field {string} [psk] - IPsec pre-shared key. Autogenerated and stored in a Secret when omitted. Mutually exclusive with `existingSecret`.
## @field {string} [existingSecret] - Name of an existing Secret in the tenant namespace holding the pre-shared key (key `psk`). Takes precedence over `psk` when set.

## @typedef {struct} Peer - Remote peer the tunnel connects to. A single peer per instance (one tunnel); reach a second site with a second instance.
## @field {string} address - Public address (IP or hostname) of the remote peer. Responder model: the remote peer dials in.
## @pattern ^[A-Za-z0-9.:-]*$
## @field {PeerAuth} [auth] - IPsec authentication material for the tunnel.

## @param {Peer} peer - Remote peer this router builds a tunnel to.
peer:
  address: ""
  auth: {}

##
## @section Routing configuration
##

## @param {[]string} remoteCIDRs - Remote networks reachable over the tunnel. Must be disjoint from cluster pod/service/join networks, live node addresses, and allocated LoadBalancer/external service addresses (validated at admission and by the controller).
remoteCIDRs: []

## @typedef {struct} StaticRoute - Static route programmed on the router.
## @field {string} destination - Destination network in CIDR notation.
## @pattern ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$
## @field {string} nextHop - Next-hop IP address for the destination.
## @pattern ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$

## @param {[]StaticRoute} staticRoutes - Optional extra static routes programmed on the router.
staticRoutes: []

## @typedef {struct} BGPNeighbor - BGP neighbor.
## @field {string} address - Neighbor IP address.
## @pattern ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$
## @field {int} remoteASN - Remote autonomous system number of the neighbor. Must be a valid ASN (1..4294967295).
## @minimum 1
## @maximum 4294967295

## @typedef {struct} BGP - Optional BGP peering over the tunnel.
## @field {bool} enabled - Enable BGP peering.
## @field {int} [localASN] - Local autonomous system number. Required when `enabled` is true; must be a valid ASN (1..4294967295).
## @minimum 1
## @maximum 4294967295
## @field {[]BGPNeighbor} [neighbors] - BGP neighbors to peer with.

## @param {BGP} bgp - Optional BGP peering over the tunnel. Disabled by default.
bgp:
  enabled: false

##
## @section Security
##

## @typedef {struct} Security - Platform-owned network security guards for the gateway VM.
## @field {[]string} [egressDenyCIDRs] - Extra destination CIDRs the gateway is denied egress to, on top of the built-in link-local `169.254.0.0/16` deny (which always applies and covers the cloud metadata endpoint `169.254.169.254`). Use for management or node ranges that do not overlap tenant workloads; do NOT list the cluster pod/service/join ranges (the gateway must reach tenant workloads). Empty by default.

## @param {Security} security - Platform-owned network security guards for the gateway VM.
security:
  egressDenyCIDRs: []

##
## @section Common parameters
##

## @typedef {struct} Resources - Explicit CPU and memory allocated to the router VM.
## @field {int} cpu - CPU topology cores allocated to the router VM. Whole cores only; a fractional quantity (e.g. "1500m", "0.5") is rejected at admission rather than silently truncated to zero. At least one core: `cpu: 0` and negative values otherwise pass admission and render an unusable KubeVirt CPU topology.
## @minimum 1
## @field {quantity} memory - Memory (RAM) allocated to the router VM.

## @param {Resources} resources - Explicit CPU and memory sizing for the router VM.
resources:
  cpu: 2
  memory: 2Gi

##
## @section Low-level materialization
##

## @param {string} managementCIDR - Source CIDR allowed to reach the VyOS management API (HTTPS 443) through the first-boot firewall. This value and the controller's --management-cidr flag (T05/T06) must agree: both default to the cluster pod CIDR (10.244.0.0/16, the kube-ovn default) and must be kept consistent. On a cluster with a non-default `networking.podCIDR`, set this (and the controller's managementCidr) to that pod CIDR, or the firewall will reject the real controller source. An empty value requires `allowOpenManagement=true` (fail-closed). Constrained to a strict IPv4 CIDR (or empty) so a tenant value cannot inject arbitrary text into the VyOS first-boot config.
## The pattern validates octet RANGE and prefix length, not merely digit shape: a
## loose `[0-9]{1,3}` accepted `999.999.999.999/99`, which contradicts the strict-CIDR
## contract this field documents and reaches the VyOS first-boot config as a firewall
## source that can never match. Empty stays permitted for allowOpenManagement.
## @pattern ^(((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9]))?$
managementCIDR: 10.244.0.0/16

## @param {bool} allowOpenManagement - Permit an empty `managementCIDR`, leaving the VyOS management API unrestricted (no first-boot firewall). Fail-closed by default: an empty `managementCIDR` with this false aborts rendering.
allowOpenManagement: false

## @param {string} [cloudInitSeed] - Opaque seed mixed into the VM firmware UUID. Change it to force a first-boot cloud-init re-run; clear it to preserve an existing VM's UUID across re-renders.
cloudInitSeed: ""

## @param {bool} logSerialConsole - Stream the gateway VM's guest serial console into a `guest-console-log` container beside virt-launcher, readable with `kubectl logs`, and install the bring-up diagnostics that print into it. The only view of a router that stalls inside the guest before the VyOS management API answers, when the VMI reports Running with an address but nothing in the cluster can say how far the boot got. The console alone carries kernel and boot output; the emitter (`files/guest-diag.sh`, run once a minute from `/etc/cron.d` and silent after the first 20 minutes of uptime) adds cloud-init status, failed units, whether the seeded config committed, whether nginx — the `:443` listener — is up, the IPsec state, and the load, which is what separates a guest that is still working from one that is wedged. The two are one switch because the emitter is pointless without the capture and the capture is far weaker without the emitter. Off by default, and three costs are why. It overrides the platform's cluster-wide `disableSerialConsoleLog` (packages/system/kubevirt), which is set because that container has been seen holding virt-launcher in `PodInitializing` (kubevirt/kubevirt#15989) — that would take the gateway down rather than explain it, so check the virt-launcher Pod reaches Running after enabling it. It is part of the VM's device list, so changing it on a live gateway restarts the VM and drops the tunnel with it. And the emitter half rides the cloud-init seed, which re-runs only when the firmware UUID changes, so enabling this on an already-booted gateway gets you the console but not the extra fields until the VM's next first boot (change `cloudInitSeed` to force one). It buys visibility into the next boot, not the current one.
logSerialConsole: false
