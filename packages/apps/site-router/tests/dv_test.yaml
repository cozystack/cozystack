suite: site-router boot DataVolume

# The boot disk is a CDI DataVolume importing the digest-pinned KubeVirt
# disk of a barerouter release, whose reference this chart carries in
# images/barerouter-disk.tag. The source is not tenant-overridable because the
# guest firewall is the sole compensating control for the relaxed OVN port.
#
# The guard in site-router.applianceDiskUrl (no digest, malformed digest) is
# exercised in hack/site-router-appliance-ref.bats, which renders a copy of the
# chart against references the committed pin does not have; helm-unittest cannot
# inject chart files. This suite asserts what the committed pin renders.

templates:
  - templates/dv.yaml

release:
  name: site-router-test
  namespace: tenant-test

set:
  _cluster: {}

tests:
  # CDI's docker:// transport refuses a reference carrying both a tag and a
  # digest ("Docker references with both a tag and digest are currently not
  # supported"), and used to fail minutes later as an importer that restarts
  # forever. The committed pin carries both, so the rendered source must carry
  # the digest alone. Matched by shape rather than by value, so a pin bump does
  # not have to touch this suite.
  - it: imports the pinned barerouter disk by digest, with the tag dropped
    asserts:
      - isKind:
          of: DataVolume
      - matchRegex:
          path: spec.source.registry.url
          pattern: '^docker://ghcr\.io/aenix-io/barerouter/kubevirt-disk@sha256:[0-9a-f]{64}$'

  - it: keeps the live-validated boot disk shape
    asserts:
      - equal:
          path: metadata.name
          value: site-router-test-boot
      - equal:
          path: spec.contentType
          value: kubevirt
      - equal:
          path: spec.storage.storageClassName
          value: replicated
      - equal:
          path: spec.storage.resources.requests.storage
          value: 12Gi
      - notExists:
          path: spec.source.http
      - notExists:
          path: spec.source.pvc

  # DataVolume.spec is immutable in CDI, and the appliance digest moves with every
  # barerouter bump. So the ordinary upgrade path is "the rendered source no
  # longer matches the live one", and re-rendering it turns every bump into a
  # failed upgrade for every installed instance. These three pin the
  # preserve-and-fail-loudly contract.
  - it: keeps the live DataVolume spec when the appliance digest has moved
    kubernetesProvider:
      scheme: &dvscheme
        "cdi.kubevirt.io/v1beta1/DataVolume":
          gvr:
            group: "cdi.kubevirt.io"
            version: "v1beta1"
            resource: "datavolumes"
          namespaced: true
      objects: &installedDV
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata:
            name: site-router-test-boot
            namespace: tenant-test
            annotations:
              site-router.cozystack.io/storage-class: "replicated"
          spec:
            contentType: kubevirt
            source:
              # Deliberately not a ghcr.io/cozystack/cozystack ref. What this
              # fixture stands for is "whatever the live disk was created with",
              # and the registry host plays no part in that — while a first-party
              # ref here would be picked up by the image-ref enumeration oracle
              # (hack/promote-rewrite-tags_test.bats) as an unenumerated shipped
              # reference, which it is not.
              registry:
                url: "docker://registry.invalid/installed-appliance@sha256:1111111111111111111111111111111111111111111111111111111111111111"
            storage:
              resources:
                requests:
                  storage: 12Gi
              storageClassName: replicated
    asserts:
      # The disk the gateway is actually running keeps its own source. Rendering
      # the new digest here is the failed upgrade this test exists to prevent.
      - equal:
          path: spec.source.registry.url
          value: "docker://registry.invalid/installed-appliance@sha256:1111111111111111111111111111111111111111111111111111111111111111"
      - equal:
          path: spec.storage.storageClassName
          value: replicated

  - it: carries the recorded storage class forward instead of restamping it
    kubernetesProvider:
      scheme: *dvscheme
      objects: *installedDV
    asserts:
      - equal:
          path: metadata.annotations["site-router.cozystack.io/storage-class"]
          value: "replicated"

  - it: refuses a storageClass change on an existing instance rather than ignoring it
    # The opposite treatment from the digest, and deliberately so: this one is
    # operator input, so silently not applying it diverges the CR from the
    # cluster. Same contract as vm-disk (#2985, docs/storage-immutability.md).
    set:
      storageClass: local
    kubernetesProvider:
      scheme: *dvscheme
      objects: *installedDV
    asserts:
      - failedTemplate:
          errorPattern: "storageClass is immutable after creation"
