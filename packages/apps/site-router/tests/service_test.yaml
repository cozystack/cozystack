suite: site-router tunnel LoadBalancer Service

# T04/T11 — the tunnel endpoint is a native Service type: LoadBalancer with
# spec.loadBalancerClass driven by the engine-injected _cluster."load-balancer-class"
# (post PR #3218 native model; see packages/extra/ingress/templates/nginx-ingress.yaml).
# This is the IPsec responder entry point: the remote peer dials in on IKE (UDP 500)
# and NAT-T (UDP 4500). The selector targets the gateway virt-launcher pod via the
# KubeVirt-managed vm.kubevirt.io/name label.

templates:
  - templates/service.yaml

release:
  name: site-router-test
  namespace: tenant-test

set:
  _cluster:
    load-balancer-class: metallb.io/metallb

tests:
  - it: renders a LoadBalancer Service named <release>-tunnel
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: site-router-test-tunnel
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: takes loadBalancerClass from _cluster."load-balancer-class"
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.loadBalancerClass
          value: metallb.io/metallb

  - it: omits loadBalancerClass when the platform sets no class (default LB handles it)
    set:
      _cluster:
        load-balancer-class: ""
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - notExists:
          path: spec.loadBalancerClass

  - it: exposes the IPsec UDP tunnel ports (IKE 500, NAT-T 4500)
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 500
      - equal:
          path: spec.ports[0].protocol
          value: UDP
      - equal:
          path: spec.ports[0].targetPort
          value: 500
      - equal:
          path: spec.ports[1].port
          value: 4500
      - equal:
          path: spec.ports[1].protocol
          value: UDP
      - equal:
          path: spec.ports[1].targetPort
          value: 4500

  - it: selector targets the gateway virt-launcher pod
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.selector["vm.kubevirt.io/name"]
          value: site-router-test

  # spec.loadBalancerClass is immutable once the Service is type LoadBalancer, so
  # setting, changing or clearing it on an installed instance must fail early with
  # the recreate command instead of wedging the upgrade on the API's rejection.
  - it: fails when the class is set on an installed tunnel Service that has none
    kubernetesProvider:
      scheme: &svcscheme
        "v1/Service":
          gvr:
            version: v1
            resource: services
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Service
          metadata:
            name: site-router-test-tunnel
            namespace: tenant-test
          spec:
            type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "spec\\.loadBalancerClass is immutable once the Service is type LoadBalancer"
      - failedTemplate:
          errorPattern: "kubectl -n tenant-test delete service site-router-test-tunnel"

  - it: fails when the class changes on an installed tunnel Service
    kubernetesProvider:
      scheme: *svcscheme
      objects:
        - apiVersion: v1
          kind: Service
          metadata:
            name: site-router-test-tunnel
            namespace: tenant-test
          spec:
            type: LoadBalancer
            loadBalancerClass: cilium.io/l2-announcer
    asserts:
      - failedTemplate:
          errorPattern: 'existing: "cilium.io/l2-announcer", requested: "metallb.io/metallb"'

  - it: fails when the class is cleared on an installed tunnel Service that carries one
    set:
      _cluster:
        load-balancer-class: ""
    kubernetesProvider:
      scheme: *svcscheme
      objects:
        - apiVersion: v1
          kind: Service
          metadata:
            name: site-router-test-tunnel
            namespace: tenant-test
          spec:
            type: LoadBalancer
            loadBalancerClass: metallb.io/metallb
    asserts:
      - failedTemplate:
          errorPattern: 'existing: "metallb.io/metallb", requested: ""'

  - it: renders when the installed tunnel Service already has the requested class
    kubernetesProvider:
      scheme: *svcscheme
      objects:
        - apiVersion: v1
          kind: Service
          metadata:
            name: site-router-test-tunnel
            namespace: tenant-test
          spec:
            type: LoadBalancer
            loadBalancerClass: metallb.io/metallb
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.loadBalancerClass
          value: metallb.io/metallb
