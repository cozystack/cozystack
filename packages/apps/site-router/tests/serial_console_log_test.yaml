suite: gateway guest serial console logging

# Every gate from the tunnel coming up onwards depends on the VyOS guest
# reaching userspace and answering its HTTPS management API, and the cluster can
# observe none of that: a VMI reporting Running with an address says only that
# qemu started. KubeVirt exposes the guest console when the VMI asks for it —
# virt-launcher gains a guest-console-log container whose log is readable from
# the management cluster with no in-guest cooperation at all — which is the only
# surface that shows the window where a router boots but never serves 443.
#
# NOT TENANT-REACHABLE. The switch is `_logSerialConsole`, underscore-prefixed
# because the aggregated apps.cozystack.io API reserves every top-level values key
# beginning with `_` and rejects it from a tenant with a 400 on both Create and
# Update (validateNoInternalKeys in pkg/registry/apps/application/rest.go). The
# un-prefixed `logSerialConsole` a tenant might reasonably try is read by no
# template, so it renders nothing: the key that works cannot be submitted, and the
# key that can be submitted does not work. Both halves are asserted below, because
# only asserting that the suite can still enable it proves the half that was never
# in doubt.
#
# The field must stay absent unless asked for. It OVERRIDES the platform's
# cluster-wide virtualMachineOptions.disableSerialConsoleLog
# (packages/system/kubevirt/templates/kubevirt-cr.yaml), which is set because the
# guest-console-log container has been seen holding virt-launcher in
# PodInitializing (kubevirt/kubevirt#15989). So an explicit false must render the
# same nothing as an unset field: KubeVirt's tri-state false would opt a gateway
# that asked for nothing back into the container the platform switched off.
#
# Mirrors packages/apps/kubernetes/tests/serial_console_log_test.yaml, which pins
# the same three cases for the worker VM template.

templates:
  - templates/vm.yaml
  - templates/secret-cloudinit.yaml

release:
  name: site-router-test
  namespace: tenant-test

set:
  _cluster: {}
  managementCIDR: 10.244.0.0/16
  peer:
    address: 203.0.113.10

tests:
  - it: omits the field by default, leaving the platform-wide disable in force
    template: templates/vm.yaml
    documentSelector:
      path: kind
      value: VirtualMachine
    asserts:
      - notExists:
          path: spec.template.spec.domain.devices.logSerialConsole

  - it: omits the field when explicitly disabled, rather than rendering a tri-state false
    set:
      _logSerialConsole: false
    template: templates/vm.yaml
    documentSelector:
      path: kind
      value: VirtualMachine
    asserts:
      - notExists:
          path: spec.template.spec.domain.devices.logSerialConsole

  - it: asks KubeVirt for the guest console log when the platform enables it
    set:
      _logSerialConsole: true
    template: templates/vm.yaml
    documentSelector:
      path: kind
      value: VirtualMachine
    asserts:
      - equal:
          path: spec.template.spec.domain.devices.logSerialConsole
          value: true

  # THE BOUNDARY. A tenant cannot submit `_logSerialConsole` at all, so the only
  # thing they can actually put in spec.values is the un-prefixed name. Supplying
  # it exactly as a tenant would must leave the VM untouched and install no
  # emitter. If this ever goes green with the console on, the rename has been
  # undone somewhere and the switch is tenant-reachable again.
  - it: a tenant-supplied logSerialConsole does not turn the console on
    set:
      logSerialConsole: true
    template: templates/vm.yaml
    documentSelector:
      path: kind
      value: VirtualMachine
    asserts:
      - notExists:
          path: spec.template.spec.domain.devices.logSerialConsole

  - it: a tenant-supplied logSerialConsole installs no guest emitter either
    set:
      logSerialConsole: true
    template: templates/secret-cloudinit.yaml
    documentSelector:
      path: metadata.name
      value: site-router-test-cloud-init
    asserts:
      - notMatchRegex:
          path: stringData.userdata
          pattern: cozy-guest-diag

  - it: the platform switch installs the guest emitter, on its own disk
    set:
      _logSerialConsole: true
    template: templates/secret-cloudinit.yaml
    documentSelector:
      path: metadata.name
      value: site-router-test-diag
    # The emitter travels separately from the configuration seed so that a
    # diagnostics change cannot break the config.boot the gateway boots on. The
    # appliance seed installs guest-diag.cron as /etc/cron.d/cozy-guest-diag —
    # a name with no dot, which Debian cron would otherwise skip in silence.
    asserts:
      - matchRegex:
          path: stringData["guest-diag.cron"]
          pattern: /config/scripts/cozy-guest-diag\.sh
      - matchRegex:
          path: stringData["guest-diag.sh"]
          pattern: (?m)^#!/bin/sh
