## @typedef {struct} Kafka - Kafka configuration.
## @field {int} replicas - Number of Kafka replicas.
## @field {Resources} [resources] - Explicit CPU and memory configuration. When omitted, the preset defined in `resourcesPreset` is applied.
## @field {ResourcesPreset} resourcesPreset - Default sizing preset used when `resources` is omitted.
## @field {quantity} size - Persistent Volume size for Kafka.
## @field {string} storageClass - StorageClass used to store the Kafka data.
## @immutable
## @x-cozystack-options {source: storageclass}

## @param {Kafka} kafka - Kafka configuration.
kafka:
  replicas: 3
  resources: {}
  resourcesPreset: "c1.small"
  size: 10Gi
  storageClass: ""

##
## @section Controller configuration
##

## @typedef {struct} Controller - KRaft controller configuration.
## @field {int} replicas - Number of KRaft controllers. Use an odd number: the metadata quorum needs a majority of them.
## @field {Resources} [resources] - Explicit CPU and memory configuration. When omitted, the preset defined in `resourcesPreset` is applied.
## @field {ResourcesPreset} resourcesPreset - Default sizing preset used when `resources` is omitted.
## @field {quantity} size - Persistent Volume size for the metadata log of each controller.
## @field {string} storageClass - StorageClass used to store the controller metadata.
## @immutable
## @x-cozystack-options {source: storageclass}

## @param {Controller} controller - KRaft controller configuration. The controllers hold the cluster metadata that ZooKeeper used to hold; the brokers are configured under `kafka`.
controller:
  replicas: 3
  resources: {}
  resourcesPreset: "c1.small"
  size: 5Gi
  storageClass: ""
