{{- /*
  Tri-state TLS logic for the external listener (port 9094):
  - .Values.external is the sole gate for the external LoadBalancer listener.
    The listener is rendered if and only if external is true.
  - tls.enabled controls TLS *on the external listener* (independent of whether
    the listener exists):
    - If tls.enabled is explicitly set (true or false), that value wins.
    - If tls.enabled is unset (nil / absent), TLS inherits from .Values.external
      (auto-on when external is true, off otherwise).
  - tls.enabled does NOT control whether the external listener is created.
    Setting tls.enabled=true with external=false has no effect on listeners.
  Internal TLS listener (port 9093) is always on; Strimzi manages the PKI.
  Null detection uses `kindIs "invalid"` (canonical pattern) — see _tls.tpl.
*/ -}}
{{- $tlsEnabled := include "kafka.tls.enabled" . | trim -}}
{{- $showExternal := .Values.external -}}
{{- /* Strimzi publishes one bootstrap Service plus one Service per broker, and
     Kafka advertises each broker's own address, so every one of them is an
     endpoint a tenant may want to hold. The broker targets follow the replica
     count: a claim for a broker that does not exist is a typo, not a
     reservation for future growth. Validated unconditionally so externalIPs
     without external: true is reported rather than ignored. */ -}}
{{- $brokerTargets := list -}}
{{- range $i := until (int .Values.kafka.replicas) -}}
{{- $brokerTargets = append $brokerTargets (printf "broker-%d" $i) -}}
{{- end -}}
{{- $externalIPs := include "cozy-lib.externalIP.claims" (list .Values.externalIPs .Values.external "bootstrap" (concat (list "bootstrap") $brokerTargets) $) | fromYaml -}}
{{- /* Declaring a user switches the cluster to authenticated mode: every
     listener asks for SCRAM-SHA-512 credentials and the simple (ACL)
     authorizer decides what each principal may do. Without users the
     listeners stay open, as they always were, because an authorizer with no
     ACLs would deny the anonymous clients of every existing release. */ -}}
{{- $authEnabled := not (empty .Values.users) -}}
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # KRaft with node pools: the brokers and controllers are the KafkaNodePools
    # in nodepools.yaml, so this CR carries neither replicas nor storage.
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    # Both pins must stay within what the Strimzi shipped by
    # packages/system/kafka-operator supports (0.45.x: Kafka 3.8.0 to 3.9.1).
    # metadataVersion is the KRaft metadata format; bump it after a Kafka
    # version bump, never before.
    version: {{ .Chart.AppVersion }}
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        {{- if $authEnabled }}
        authentication:
          type: scram-sha-512
        {{- end }}
      - name: tls
        port: 9093
        type: internal
        tls: true
        {{- if $authEnabled }}
        authentication:
          type: scram-sha-512
        {{- end }}
      {{- if $showExternal }}
      - name: external
        port: 9094
        type: loadbalancer
        tls: {{ $tlsEnabled }}
        {{- if $authEnabled }}
        authentication:
          type: scram-sha-512
        {{- end }}
        {{- if $externalIPs }}
        configuration:
          {{- with (include "cozy-lib.externalIP.annotations" (list $externalIPs "bootstrap" $)) }}
          bootstrap:
            annotations:
              {{- . | nindent 14 }}
          {{- end }}
          {{- $brokers := list }}
          {{- range $i := until (int $.Values.kafka.replicas) }}
          {{- with (include "cozy-lib.externalIP.annotations" (list $externalIPs (printf "broker-%d" $i) $)) }}
          {{- $brokers = append $brokers (dict "broker" $i "annotations" .) }}
          {{- end }}
          {{- end }}
          {{- if $brokers }}
          brokers:
            {{- range $brokers }}
          - broker: {{ .broker }}
            annotations:
              {{- .annotations | nindent 14 }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- if $authEnabled }}
    authorization:
      type: simple
      # Strimzi adds its own operators here by itself; the cluster operator is
      # named explicitly so the guarantee is visible in the rendered CR.
      superUsers:
        - CN=cluster-operator,O=io.strimzi
    {{- end }}
    config:
      {{- if eq (int .Values.kafka.replicas) 1 }}
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      {{- else if eq (int .Values.kafka.replicas) 2 }}
      offsets.topic.replication.factor: 2
      transaction.state.log.replication.factor: 2
      transaction.state.log.min.isr: 2
      default.replication.factor: 2
      min.insync.replicas: 2
      {{- else }}
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      {{- end }}
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: {{ .Release.Name }}-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    # Tenant namespaces ship a LimitRange that defaults containers to 128Mi.
    # The topic-operator and user-operator are JVM processes and OOMKill at
    # that default, leaving the entity-operator in CrashLoopBackOff so
    # KafkaTopics/KafkaUsers never reconcile. Set explicit resources so they
    # don't inherit the namespace default.
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    userOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    template:
      # `pod` accepts metadata + a flat set of pod-spec fields
      # (enableServiceLinks, securityContext, affinity, …) directly.
      # The previous file nested enableServiceLinks under a phantom
      # `template.spec` key — Flux v2.7 dropped it silently, v2.8 SSA
      # rejects it with "field not declared in schema".
      pod:
        metadata:
          labels:
            policy.cozystack.io/allow-to-apiserver: "true"
        enableServiceLinks: false
  # Consumer-group lag (kafka_consumergroup_lag and friends) is only published
  # by the Kafka Exporter, never by the brokers' JMX rules. Its pod carries the
  # same app.kubernetes.io/instance label and tcp-prometheus port as the
  # brokers, so the release's VMPodScrape picks it up without a second scrape.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    # Explicit resources for the same reason as the entity operator above: the
    # tenant LimitRange would otherwise cap the container at 128Mi.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    template:
      pod:
        enableServiceLinks: false
