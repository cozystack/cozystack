---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ $.Release.Name }}
  labels:
    workloads.cozystack.io/resource-preset: {{ .Values.kafka.resourcesPreset | quote }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  minReplicas: 1
  kind: kafka
  type: kafka
  # Every KRaft pod carries app.kubernetes.io/name=kafka; the pool label is
  # what tells brokers and controllers apart.
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    strimzi.io/pool-name: {{ $.Release.Name }}-broker
  version: {{ $.Chart.Version }}

---

apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ $.Release.Name }}-controller
  labels:
    workloads.cozystack.io/resource-preset: {{ .Values.controller.resourcesPreset | quote }}
spec:
  replicas: {{ .Values.controller.replicas }}
  minReplicas: 1
  kind: kafka
  type: controller
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    strimzi.io/pool-name: {{ $.Release.Name }}-controller
  version: {{ $.Chart.Version }}
