{{- /*
  Topic configs Kafka 3.x accepted and Kafka 4.2/4.3 reject. A KafkaTopic
  carrying one stays NotReady while the release reports Ready, and a broker
  whose log holds a segment.bytes below the floor does not start. The same
  limits are in packages/core/platform/templates/_helpers.tpl,
  packages/core/platform/images/migrations/migrations/61 and
  the kafka-backup.sh of the Kafka backup strategy chart in
  github.com/cozystack/backup-strategies.
*/}}
{{- $segmentBytesMin := 1048576 }}
{{- range $topic := .Values.topics }}
{{- $config := $topic.config | default dict }}
{{- range $key := list "message.downconversion.enable" "message.format.version" "message.timestamp.difference.max.ms" }}
{{- if hasKey $config $key }}
{{- fail (printf "topic %q sets %s, which Kafka 4 removed: delete it from the topic's config" $topic.name $key) }}
{{- end }}
{{- end }}
{{- $segmentBytes := get $config "segment.bytes" }}
{{- if or (kindIs "float64" $segmentBytes) (kindIs "int64" $segmentBytes) (kindIs "int" $segmentBytes) }}
{{- $segmentBytes = printf "%d" (int64 $segmentBytes) }}
{{- end }}
{{- /*
  Kafka trims characters up to U+0020 and reads the rest with
  Integer.parseInt: a sign is allowed and leading zeros are decimal, where
  int64 would read them as octal. The digits are compared as text, so a
  string too long for int64 is not misread either.
*/}}
{{- $integer := `^[\x00-\x20]*(?:\+|(-))?0*([0-9]+)[\x00-\x20]*$` }}
{{- if and (kindIs "string" $segmentBytes) (regexMatch $integer $segmentBytes) }}
{{- $value := regexReplaceAll $integer $segmentBytes "${1}${2}" }}
{{- $min := toString $segmentBytesMin }}
{{- if or (hasPrefix "-" $value) (lt (len $value) (len $min)) (and (eq (len $value) (len $min)) (lt $value $min)) }}
{{- fail (printf "topic %q sets segment.bytes=%s, below the Kafka 4 minimum of %d: raise it" $topic.name $value $segmentBytesMin) }}
{{- end }}
{{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: "{{ $.Release.Name }}-{{ kebabcase $topic.name }}"
  labels:
    strimzi.io/cluster: "{{ $.Release.Name }}"
spec:
  topicName: "{{ $topic.name }}"
  {{- with $topic.partitions }}
  partitions: {{ . }}
  {{- end }}
  {{- with $topic.replicas }}
  replicas: {{ . }}
  {{- end }}
  {{- with $topic.config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
