{{- include "kafka.assertNameLength" . }}
{{- $controllerReplicas := include "kafka.controllerReplicas" . }}
{{- $brokerPool := include "kafka.brokerPoolName" . }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  # "b-<hash>" (short release hash) for fresh installs, so several Kafka clusters
  # coexist in one namespace; or exactly "kafka" for a cluster migrated from
  # ZooKeeper — that name adopts the existing <cluster>-kafka-N brokers and data
  # in place. See kafka.brokerPoolName.
  name: {{ $brokerPool }}
  labels:
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - broker
  resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.kafka.resourcesPreset .Values.kafka.resources $) | nindent 4 }}
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      {{- with .Values.kafka.size }}
      size: {{ . }}
      {{- end }}
      {{- with .Values.kafka.storageClass }}
      class: {{ . }}
      {{- end }}
      deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: {{ include "kafka.controllerPoolName" . }}
  labels:
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: {{ $controllerReplicas }}
  roles:
    - controller
  resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.kafka.resourcesPreset .Values.kafka.resources $) | nindent 4 }}
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      size: {{ .Values.kafka.controllerStorageSize | default "5Gi" }}
      {{- with .Values.kafka.storageClass }}
      class: {{ . }}
      {{- end }}
      kraftMetadata: shared
      deleteClaim: false
