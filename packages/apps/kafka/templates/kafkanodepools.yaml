{{- $controllerReplicas := include "kafka.controllerReplicas" . }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  # Must be "kafka": Strimzi derives broker/PVC names as <cluster>-<pool>-<id>,
  # so this name adopts an existing ZooKeeper cluster's <cluster>-kafka-N brokers
  # and data in place during migration. Safe as a fixed (namespace-unique) name
  # because the chart enforces one Kafka per namespace (see kafka.assertSingleInstance).
  name: kafka
  labels:
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - broker
  resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.kafka.resourcesPreset .Values.kafka.resources $) | nindent 4 }}
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      {{- with .Values.kafka.size }}
      size: {{ . }}
      {{- end }}
      {{- with .Values.kafka.storageClass }}
      class: {{ . }}
      {{- end }}
      deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: {{ $controllerReplicas }}
  roles:
    - controller
  resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.kafka.resourcesPreset .Values.kafka.resources $) | nindent 4 }}
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      size: {{ .Values.kafka.controllerStorageSize | default "5Gi" }}
      {{- with .Values.kafka.storageClass }}
      class: {{ . }}
      {{- end }}
      kraftMetadata: shared
      deleteClaim: false
