suite: Kafka JVMs are sized from their container limits

templates:
  - templates/migration-hook.yaml
  - templates/kafka.yaml

release:
  name: test-kafka
  namespace: tenant-test

tests:
  - it: passes the default preset limits to every node pool JVM
    template: templates/migration-hook.yaml
    documentIndex: 3
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "release-namespace: \\$\\{ns\\}\\s+spec:\\s+replicas: \\d+\\s+roles:\\s+- broker\\s+resources:\\s+limits:(\\s+\\S+: \\S+)+\\s+requests:(\\s+\\S+: \\S+)+(\\s+#[^\\n]*)*\\s+template:\\s+kafkaContainer:\\s+env:\\s+- name: JAVA_TOOL_OPTIONS\\s+value: \"-XX:MaxRAM=1073741824 -XX:ActiveProcessorCount=1\"\\s+storage:"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "roles:\\s+- controller\\s+resources:\\s+limits:(\\s+\\S+: \\S+)+\\s+requests:(\\s+\\S+: \\S+)+(\\s+#[^\\n]*)*\\s+template:\\s+kafkaContainer:\\s+env:\\s+- name: JAVA_TOOL_OPTIONS\\s+value: \"-XX:MaxRAM=1073741824 -XX:ActiveProcessorCount=1\"\\s+storage:"

  # Strimzi moves jvmOptions -XX into KAFKA_JVM_PERFORMANCE_OPTS, and
  # kafka-run-class.sh then drops its G1 settings.
  - it: leaves the node pool JVM options to Strimzi and Kafka
    template: templates/migration-hook.yaml
    documentIndex: 3
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "jvmOptions"

  - it: rounds a fractional CPU limit up
    template: templates/migration-hook.yaml
    documentIndex: 3
    set:
      kafka.resources:
        cpu: 2500m
        memory: 3Gi
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "roles:\\s+- controller\\s+resources:\\s+limits:(\\s+\\S+: \\S+)+\\s+requests:(\\s+\\S+: \\S+)+(\\s+#[^\\n]*)*\\s+template:\\s+kafkaContainer:\\s+env:\\s+- name: JAVA_TOOL_OPTIONS\\s+value: \"-XX:MaxRAM=3221225472 -XX:ActiveProcessorCount=3\"\\s+storage:"

  - it: takes the limits, not the requests, when the allocation ratios shrink the requests
    template: templates/migration-hook.yaml
    documentIndex: 3
    set:
      _cluster:
        cpu-allocation-ratio: "4"
        memory-allocation-ratio: "2"
      kafka.resources:
        cpu: "2"
        memory: 2Gi
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "release-namespace: \\$\\{ns\\}\\s+spec:\\s+replicas: \\d+\\s+roles:\\s+- broker\\s+resources:\\s+limits:(\\s+\\S+: \\S+)+\\s+requests:(\\s+\\S+: \\S+)+(\\s+#[^\\n]*)*\\s+template:\\s+kafkaContainer:\\s+env:\\s+- name: JAVA_TOOL_OPTIONS\\s+value: \"-XX:MaxRAM=2147483648 -XX:ActiveProcessorCount=2\"\\s+storage:"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "roles:\\s+- controller\\s+resources:\\s+limits:(\\s+\\S+: \\S+)+\\s+requests:(\\s+\\S+: \\S+)+(\\s+#[^\\n]*)*\\s+template:\\s+kafkaContainer:\\s+env:\\s+- name: JAVA_TOOL_OPTIONS\\s+value: \"-XX:MaxRAM=2147483648 -XX:ActiveProcessorCount=2\"\\s+storage:"

  - it: passes the entity operator memory limit to its JVMs
    template: templates/kafka.yaml
    asserts:
      - equal:
          path: spec.entityOperator.topicOperator.resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.entityOperator.template.topicOperatorContainer.env
          value:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAM=536870912
      - equal:
          path: spec.entityOperator.userOperator.resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.entityOperator.template.userOperatorContainer.env
          value:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAM=536870912
