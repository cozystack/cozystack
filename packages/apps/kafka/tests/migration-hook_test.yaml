suite: Migration pre-upgrade hook tests

templates:
  - templates/migration-hook.yaml

tests:
  - it: renders SA + Role + RoleBinding + Job when no version ConfigMap exists
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 2
      - isKind:
          of: Job
        documentIndex: 3

  - it: tags all resources as helm pre-upgrade hooks
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
        documentIndex: 2
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
        documentIndex: 3

  - it: names all resources with the release prefix
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - equal:
          path: metadata.name
          value: test-kafka-kafka-migration
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-kafka-kafka-migration
        documentIndex: 3

  - it: grants permission to patch kafkas and kafkanodepools
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - contains:
          path: rules[0].apiGroups
          content: kafka.strimzi.io
        documentIndex: 1
      - contains:
          path: rules[0].resources
          content: kafkas
        documentIndex: 1
      - contains:
          path: rules[0].resources
          content: kafkanodepools
        documentIndex: 1
      - contains:
          path: rules[0].verbs
          content: patch
        documentIndex: 1

  # The migration Job must never apply strimzi.io/kraft=enabled unless the
  # cluster actually reached KRaftPostMigration — flipping it earlier is
  # unsafe and irreversible. Guard the finalize step behind an explicit
  # readiness flag that aborts (exit 1) on timeout, leaving the deployed-version
  # ConfigMap unstamped so Helm retries.
  - it: guards the KRaft finalize step behind a reached-safe-state check
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "migration_ready=false"
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'if \[ "\$migration_ready" != "true" \]; then'
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "Refusing to apply strimzi.io/kraft=enabled in an unsafe state"
        documentIndex: 3

  # CRITICAL: the adopting broker pool must be named exactly "kafka" so Strimzi
  # reuses the existing <cluster>-kafka-N brokers and their PVCs on migration.
  - it: creates the broker node pool named kafka for adoption
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'name: kafka\n'
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "roles:\\n +- broker"
        documentIndex: 3

  # Fail closed: only a genuine NotFound is a legitimate skip; any other kubectl
  # error must abort rather than be mistaken for a fresh install.
  - it: fails closed on non-NotFound errors reading the Kafka CR
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "not\\[\\[:space:\\]\\]\\?found"
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "reading Kafka CR failed \\(not a NotFound\\)"
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "jq -r '\\.status\\.kafkaMetadataState"
        documentIndex: 3

  # Idempotent: on a retry the cluster may already be past ZooKeeper; do not
  # re-issue kraft=migration (an invalid backward transition Strimzi rejects).
  - it: does not re-issue kraft=migration once past the ZooKeeper phase
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "KRaftMigration\\|KRaftDualWriting\\|KRaftPostMigration\\|PreKRaft\\|KRaft\\)"
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "not re-issuing kraft=migration"
        documentIndex: 3

  # Namespace-unique pool name: refuse to hijack a "kafka" pool owned by another
  # cluster (a second Kafka mid-migration in the same namespace).
  - it: fails closed when a kafka pool belongs to another cluster
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "already belongs to cluster"
        documentIndex: 3

  # The hook-created pools govern the Kafka pods for the whole migration window
  # (Helm applies the resourced steady-state pools only after this hook finishes).
  # They must carry resources or a tenant LimitRange defaults the JVMs to 128Mi
  # and they OOM, stalling the migration.
  - it: sets resources on both migration node pools
    release:
      name: test-kafka
      namespace: tenant-test
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "roles:\\s+- broker[\\s\\S]*?resources:\\s+limits:"
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "roles:\\s+- controller[\\s\\S]*?resources:\\s+limits:"
        documentIndex: 3
