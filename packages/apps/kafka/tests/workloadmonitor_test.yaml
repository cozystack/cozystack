suite: Kafka WorkloadMonitor replica paths

# The two monitors read their own replica counts: the brokers from
# `.Values.kafka.replicas`, the KRaft controllers from
# `.Values.controller.replicas`. Every KRaft pod carries
# app.kubernetes.io/name=kafka, so the monitors tell the two pools apart by
# the strimzi.io/pool-name label the operator puts on node-pool pods.

templates:
  - templates/workloadmonitor.yaml

tests:
  - it: broker and controller monitors read their own replica counts
    release:
      name: test-kafka
      namespace: tenant-test
    set:
      kafka:
        replicas: 5
      controller:
        replicas: 3
    asserts:
      - hasDocuments:
          count: 2
      # doc 0: broker monitor
      - documentIndex: 0
        equal:
          path: metadata.name
          value: test-kafka
      - documentIndex: 0
        equal:
          path: spec.type
          value: kafka
      - documentIndex: 0
        equal:
          path: spec.replicas
          value: 5
      - documentIndex: 0
        equal:
          path: spec.selector
          value:
            app.kubernetes.io/instance: test-kafka
            strimzi.io/pool-name: test-kafka-broker
      # doc 1: controller monitor
      - documentIndex: 1
        equal:
          path: metadata.name
          value: test-kafka-controller
      - documentIndex: 1
        equal:
          path: spec.type
          value: controller
      - documentIndex: 1
        equal:
          path: spec.replicas
          value: 3
      - documentIndex: 1
        equal:
          path: spec.selector
          value:
            app.kubernetes.io/instance: test-kafka
            strimzi.io/pool-name: test-kafka-controller
      - documentIndex: 1
        equal:
          path: metadata.labels["workloads.cozystack.io/resource-preset"]
          value: c1.small

  - it: replica counts stay independent (kafka != controller)
    release:
      name: test-kafka
      namespace: tenant-test
    set:
      kafka:
        replicas: 7
      controller:
        replicas: 1
    asserts:
      - documentIndex: 0
        equal:
          path: spec.replicas
          value: 7
      - documentIndex: 1
        equal:
          path: spec.replicas
          value: 1
