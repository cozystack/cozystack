suite: Kafka topic tests

templates:
  - templates/topics.yaml

tests:
  - it: accepts a topic without config and omits spec.config
    release:
      name: test-kafka
      namespace: tenant-test
    set:
      topics:
        - name: test-topic
          partitions: 1
          replicas: 1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: KafkaTopic
      - equal:
          path: metadata.name
          value: test-kafka-test-topic
      - equal:
          path: spec.topicName
          value: test-topic
      - notExists:
          path: spec.config
