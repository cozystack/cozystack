suite: Kafka pre-delete cleanup

templates:
  - templates/hooks/delete.yaml

release:
  name: kafka-test
  namespace: tenant-test

tests:
  - it: deletes release-scoped KafkaTopics before removing the topic-operator
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Job
        documentIndex: 0
      - equal:
          path: metadata.name
          value: kafka-test-pre-delete
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
        documentIndex: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 270
        documentIndex: 0
      - equal:
          path: spec.backoffLimit
          value: 0
        documentIndex: 0
      # The hook exits 0 on the degraded path as well as the clean one, so
      # hook-succeeded would delete the Job holding the only account of a
      # finalizer that outlived the wait. Pinned here because the difference is
      # invisible until someone is debugging a namespace that will not finalize.
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
        documentIndex: 0
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 3600
        documentIndex: 0
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "strimzi\\.io/cluster=kafka-test"
        documentIndex: 0
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "--wait=true"
        documentIndex: 0
      # Digest-agnostic on purpose: Renovate rewrites the digest under
      # packages/.+/templates/hooks/.+\.yaml and nothing rewrites tests/, so a
      # literal here turns the next bump red for no defect. What matters is that
      # the ref stays pinned by digest at all. Same shape as
      # packages/system/etcd-operator/tests/selector-fix-hook_test.yaml.
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^clastix/kubectl:v1\.32@sha256:[0-9a-f]{64}$
        documentIndex: 0
      - isKind:
          of: ServiceAccount
        documentIndex: 1
      - isKind:
          of: Role
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["kafka.strimzi.io"]
            resources: ["kafkatopics"]
            verbs: ["get", "list", "watch", "delete"]
        documentIndex: 2
      - isKind:
          of: RoleBinding
        documentIndex: 3
      - equal:
          path: roleRef.name
          value: kafka-test-pre-delete
        documentIndex: 3
      - equal:
          path: subjects[0].name
          value: kafka-test-pre-delete
        documentIndex: 3
