suite: Kafka pre-delete cleanup

templates:
  - templates/hooks/delete.yaml

release:
  name: kafka-test
  namespace: tenant-test

tests:
  - it: deletes release-scoped KafkaTopics before removing the topic-operator
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Job
        documentIndex: 0
      - equal:
          path: metadata.name
          value: kafka-test-pre-delete
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
        documentIndex: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 270
        documentIndex: 0
      - equal:
          path: spec.backoffLimit
          value: 0
        documentIndex: 0
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "strimzi\\.io/cluster=kafka-test"
        documentIndex: 0
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "--wait=true"
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].image
          value: clastix/kubectl:v1.32@sha256:b9ef7d8dbe65bcc81a46c09b8dc7543103055021c4f43287bf59e92a8f4fe05c
        documentIndex: 0
      - isKind:
          of: ServiceAccount
        documentIndex: 1
      - isKind:
          of: Role
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["kafka.strimzi.io"]
            resources: ["kafkatopics"]
            verbs: ["get", "list", "watch", "delete"]
        documentIndex: 2
      - isKind:
          of: RoleBinding
        documentIndex: 3
      - equal:
          path: roleRef.name
          value: kafka-test-pre-delete
        documentIndex: 3
      - equal:
          path: subjects[0].name
          value: kafka-test-pre-delete
        documentIndex: 3
