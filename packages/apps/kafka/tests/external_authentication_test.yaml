suite: external listener requires SCRAM-SHA-512 credentials

# With external: true the chart opens port 9094 on a public LoadBalancer
# address. It used to render that listener without an authentication block, so
# any client that reached the address could produce and consume.

templates:
  - templates/kafka.yaml
  - templates/users.yaml

release:
  name: kafka-test
  namespace: tenant-test

tests:
  - it: requires SCRAM-SHA-512 on the external listener
    template: templates/kafka.yaml
    set:
      external: true
    asserts:
      - contains:
          path: spec.kafka.listeners
          content:
            name: external
            port: 9094
            type: loadbalancer
            tls: true
            authentication:
              type: scram-sha-512

  - it: keeps requiring credentials when TLS is turned off on the external listener
    template: templates/kafka.yaml
    set:
      external: true
      tls:
        enabled: false
    asserts:
      - contains:
          path: spec.kafka.listeners
          content:
            name: external
            port: 9094
            type: loadbalancer
            tls: false
            authentication:
              type: scram-sha-512

  - it: leaves the internal listeners as they are
    template: templates/kafka.yaml
    set:
      external: true
    asserts:
      - contains:
          path: spec.kafka.listeners
          content:
            name: plain
            port: 9092
            type: internal
            tls: false
      - contains:
          path: spec.kafka.listeners
          content:
            name: tls
            port: 9093
            type: internal
            tls: true

  - it: renders no external listener without external access
    template: templates/kafka.yaml
    asserts:
      - lengthEqual:
          path: spec.kafka.listeners
          count: 2

  - it: renders no KafkaUser by default
    template: templates/users.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: declares one SCRAM-SHA-512 KafkaUser per user, named after the release
    template: templates/users.yaml
    set:
      users:
        app: {}
        analytics: {}
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: KafkaUser
      - equal:
          path: spec.authentication.type
          value: scram-sha-512
      - equal:
          path: metadata.labels["strimzi.io/cluster"]
          value: kafka-test
      - matchRegex:
          path: metadata.name
          pattern: ^kafka-test\.(analytics|app)$

  - it: refuses a user name that is not a valid object name
    template: templates/users.yaml
    set:
      users:
        App_1: {}
    asserts:
      - failedTemplate:
          errorPattern: 'invalid Kafka user name "App_1"'

  # Under a hyphen join these keys spelled Secrets Strimzi owns: this
  # release's cluster CA certificate, broker 0's certificate of a migrated
  # cluster, and the cluster CA key of a release named kafka-test-other.
  - it: names no user's credentials after a Secret Strimzi owns
    template: templates/users.yaml
    set:
      users:
        cluster-ca-cert: {}
        kafka-0: {}
        other-cluster-ca: {}
    asserts:
      - hasDocuments:
          count: 3
      - matchRegex:
          path: metadata.name
          pattern: ^kafka-test\.(cluster-ca-cert|kafka-0|other-cluster-ca)$

  - it: refuses a user whose KafkaUser name would pass 253 characters
    template: templates/users.yaml
    set:
      users:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {}
    asserts:
      - failedTemplate:
          errorPattern: 'is too long: kafka-test\.a+, its KafkaUser and Secret name, must fit in 253 characters'

  - it: accepts a user whose KafkaUser name is exactly 253 characters
    template: templates/users.yaml
    set:
      users:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {}
    asserts:
      - hasDocuments:
          count: 1
