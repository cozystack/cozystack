suite: kafka migration Job name budget

# The API server copies a Job's name into the job-name label of its pods, and a
# label value takes 63 characters at most. The Kafka name cap leaves a release
# name of up to 50 characters, and the migration hook runs on install, so an
# overlong Job name would fail every install of the longest names. The
# ServiceAccount, Role and RoleBinding have no such limit and keep the full
# name, so the ones an earlier attempt left behind are replaced, not orphaned.

templates:
  - templates/migration-hook.yaml

tests:
  - it: keeps <release>-kafka-migration for a short release name
    release:
      name: test-kafka
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: test-kafka-kafka-migration

  - it: keeps the name when it lands exactly on 63 characters
    release:
      name: kafka-abcdefghijklmnopqrstuvwxyz0123456789abcde
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: kafka-abcdefghijklmnopqrstuvwxyz0123456789abcde-kafka-migration

  - it: cuts the name to 63 characters for the longest release name the cap admits
    release:
      name: kafka-abcdefghijklmnopqrstuvwxyz0123456789abcdefgh
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: kafka-abcdefghijklmnopqrstuvwxyz0123456789abcdefgh-kafka-migrat
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kafka-abcdefghijklmnopqrstuvwxyz0123456789abcdefgh-kafka-migration

  - it: leaves the ServiceAccount on the full name for the longest release name
    release:
      name: kafka-abcdefghijklmnopqrstuvwxyz0123456789abcdefgh
      namespace: tenant-test
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: kafka-abcdefghijklmnopqrstuvwxyz0123456789abcdefgh-kafka-migration
