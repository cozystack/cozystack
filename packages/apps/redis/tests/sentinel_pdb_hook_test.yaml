suite: stale Sentinel PDB removed on scale-down to one Redis pod

# The operator only stops ensuring the Sentinel PDB once
# disablePodDisruptionBudget is set; it never deletes the one it created while
# three Sentinels ran. Left in place, its minAvailable 1 refuses every eviction
# of the single Sentinel and blocks node drains.

templates:
  - templates/hooks/sentinel-pdb.yaml

release:
  name: my-redis
  namespace: tenant-test

set:
  _cluster:
    cluster-domain: cluster.local
  _namespace:
    host: example.com

tests:
  - it: deletes the operator's Sentinel PDB on an upgrade to one replica
    release:
      upgrade: true
    set:
      replicas: 1
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - kubectl
            - --namespace=tenant-test
            - delete
            - poddisruptionbudget
            - rfs-my-redis
            - --ignore-not-found=true
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[4]
          pattern: request-timeout

  - it: lets the hook delete only that PDB
    release:
      upgrade: true
    set:
      replicas: 1
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: ["policy"]
              resources: ["poddisruptionbudgets"]
              resourceNames: ["rfs-my-redis"]
              verbs: ["get", "delete"]

  - it: renders nothing on install, where no such PDB exists
    set:
      replicas: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing while three Sentinels run
    release:
      upgrade: true
    set:
      replicas: 2
    asserts:
      - hasDocuments:
          count: 0

  # The operator runs three Redis pods for a zero or negative count, so their
  # Sentinel PDB stays.
  - it: renders nothing for a zero replica count
    release:
      upgrade: true
    set:
      replicas: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing for a negative replica count
    release:
      upgrade: true
    set:
      replicas: -1
    asserts:
      - hasDocuments:
          count: 0

  # The pods' job-name label takes 63 characters at most; a 53-character
  # release name plus -sentinel-pdb would pass it and Kubernetes would refuse
  # the Job, leaving the stale PDB in place.
  - it: keeps the Job name within 63 characters for the longest release name
    release:
      name: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      upgrade: true
    set:
      replicas: 1
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,63}$
      - matchRegex:
          path: metadata.name
          pattern: '[a-z0-9]$'
      # The full release name stays in the Job name, so the hooks of two
      # releases in one namespace never replace each other's Job.
      - matchRegex:
          path: metadata.name
          pattern: ^redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-
      - equal:
          path: spec.template.spec.containers[0].command[4]
          value: rfs-redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: lets the hook delete the Sentinel PDB of the longest release name
    release:
      name: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      upgrade: true
    set:
      replicas: 1
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules[0].resourceNames
          value:
            - rfs-redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: keeps the full Job name for a short release name
    release:
      upgrade: true
    set:
      replicas: 1
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: my-redis-sentinel-pdb
