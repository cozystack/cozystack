suite: reserved external addresses (externalIPs)

# The chart's only job here is to turn an externalIPs entry into the address
# substrate's consumption annotation on the object that carries the external
# endpoint's Service annotations, and to refuse a value that would otherwise be
# silently ignored. Nothing about the address itself is chart business: the
# annotation is inert until a per-class driver acts on it.

templates:
  - templates/service.yaml

release:
  name: redis-test
  namespace: tenant-test

tests:
  - it: "external without externalIPs: no annotation, so the load balancer keeps auto-assigning"
    set:
      external: true
    asserts:
      - notExists:
          path: metadata.annotations

  - it: "an entry pins the endpoint to its claim"
    set:
      external: true
      externalIPs:
        - claim: reserved-address
    asserts:
      - equal:
          path: metadata.annotations["local.sdn.cozystack.io/ip-address-claim"]
          value: reserved-address

  - it: "an explicit target: master is the same as omitting it"
    set:
      external: true
      externalIPs:
        - claim: reserved-address
          target: master
    asserts:
      - equal:
          path: metadata.annotations["local.sdn.cozystack.io/ip-address-claim"]
          value: reserved-address

  - it: "externalIPs without external is refused rather than ignored"
    set:
      external: false
      externalIPs:
        - claim: reserved-address
    asserts:
      - failedTemplate:
          errorMessage: "externalIPs requires external: true — there is no external endpoint to pin an address to otherwise"

  - it: "a target this chart does not publish is refused, and the message names the ones it does"
    set:
      external: true
      externalIPs:
        - claim: reserved-address
          target: nosuch
    asserts:
      - failedTemplate:
          errorMessage: 'externalIPs[0] targets "nosuch", which this application does not publish; valid targets: master'

  - it: "two entries for the same endpoint are refused"
    set:
      external: true
      externalIPs:
        - claim: first
        - claim: second
          target: master
    asserts:
      - failedTemplate:
          errorMessage: 'externalIPs[1] targets "master" a second time: one endpoint wears one address, so use one entry per target'
