{{- /*
  The one account of this kind: the default user, whose password the
  Cozystack credentials API mints and revokes. cozystack-controller keeps its
  account Secret, <release>.default.account, which auth.secretPath names, and
  the operator applies a changed password with CONFIG SET, restarting
  nothing. The chart renders no password, and nobody can log in until a mint.

  Replication, the Sentinels, the probes and the metrics exporter do not use
  it: the operator gives them an internal account of their own. The backup
  Job does, reading it when the Job starts.
*/ -}}
{{- if .Values.authEnabled }}
apiVersion: cozystack.io/v1alpha1
kind: CredentialTemplate
metadata:
  name: {{ printf "%s.default" .Release.Name | quote }}
spec:
  username: default
  format:
    name: plaintext
{{- end }}
