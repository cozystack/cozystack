{{- /*
  The one account of this kind: the default user, whose password the
  Cozystack credentials API mints and revokes. cozystack-controller keeps its
  account Secret, <release>.default.account, which auth.secretPath names, and
  the operator applies a changed password live. The chart renders no
  password, and nobody can log in until a mint.

  The same password is the one replication, the Sentinels, the metrics
  exporter and the backup Job authenticate with, so a mint rotates theirs too.
*/ -}}
{{- if .Values.authEnabled }}
apiVersion: cozystack.io/v1alpha1
kind: CredentialTemplate
metadata:
  name: {{ printf "%s.default" .Release.Name | quote }}
spec:
  username: default
  format:
    name: plaintext
{{- end }}
