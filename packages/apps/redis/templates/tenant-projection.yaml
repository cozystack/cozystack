{{- /* Gated on the same condition as certmanager.yaml: the source Secret only exists when TLS is on. */}}
{{- /*
The source is the chart's own CA Secret, not the CA-only Secret the operator
publishes at spec.tls.caCertSecretName. Both carry the same certificate, but
<release>.ca-tls is written by cert-manager the moment the CA Certificate is
issued, so the anchor reaches the tenant without also depending on the operator
having reconciled the RedisFailover and published its copy. cert-manager writes
the certificate of a selfSigned isCA Certificate to ca.crt as well as to
tls.crt, and ca.crt is the key the trust-anchor contract names.

Sourcing a key-bearing Secret is the intended shape: the controller copies the
single named key and refuses to publish PEM private key material at all
(internal/controller/cacert/reconciler.go, errPrivateKey), so the CA private key
sitting beside ca.crt in this Secret is never what gets projected.
*/}}
{{- if eq (include "redis.tls.enabled" .) "true" }}
---
apiVersion: internal.cozystack.io/v1alpha1
kind: TenantProjection
metadata:
  name: {{ .Release.Name }}-ca
spec:
  projections:
    - type: CACert
      sourceSecretName: {{ .Release.Name }}.ca-tls
      sourceKey: ca.crt
{{- end }}
