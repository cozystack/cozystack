{{- /* Validated unconditionally: externalIPs without external: true is a
     configuration mistake worth reporting, and this file is the only place in
     the chart that consumes the value. */}}
{{- $externalIPs := include "cozy-lib.externalIP.claims" (list .Values.externalIPs .Values.external "master" (list "master") $) | fromYaml }}
{{- if .Values.external }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-external-lb
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with (include "cozy-lib.externalIP.annotations" (list $externalIPs "master" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ ternary "LoadBalancer" "ClusterIP" .Values.external }}
  {{- if .Values.external }}
  externalTrafficPolicy: Local
    {{- if (include "cozy-lib.network.disableLoadBalancerNodePorts" $ | fromYaml) }}
  allocateLoadBalancerNodePorts: false
    {{- end }}
  {{- end }}
  selector:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: redis-failover
    redisfailovers-role: master
  ports:
  - name: redis
    port: 6379
    targetPort: redis
{{- end }}
