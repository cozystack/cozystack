{{- $tlsEnabled := (include "redis.tls.enabled" .) | eq "true" -}}
{{- /*
  A Sentinel holds only its configuration and failover state, so the Redis
  sizing over-provisions it. An empty sentinel block still falls back to the
  Redis sizing, so existing instances render unchanged on upgrade.
  An empty sentinel.resources map counts as unset, mirroring how an empty
  top-level resources falls back to resourcesPreset.
*/}}
{{- $sentinel := .Values.sentinel | default dict -}}
{{- $sentinelPreset := $sentinel.resourcesPreset | default .Values.resourcesPreset -}}
{{- $sentinelResources := .Values.resources -}}
{{- if or $sentinel.resources $sentinel.resourcesPreset -}}
{{-   $sentinelResources = $sentinel.resources | default dict -}}
{{- end -}}
{{- if .Values.authEnabled }}
  {{- $existingPassword := lookup "v1" "Secret" .Release.Namespace (printf "%s-auth" .Release.Name) }}
  {{- $password := randAlphaNum 32 | b64enc }}
  {{- if $existingPassword }}
    {{- $password = index $existingPassword.data "password" }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
data:
  password: {{ $password }}
{{- end }}

---

apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    # The freshworks-oss operator reconciles only RedisFailovers whose
    # operator-group label matches its OPERATOR_GROUP_ID (see
    # packages/system/redis-operator/values.yaml); without it the CR is
    # silently ignored. Keep both sides in sync.
    redis-failover.freshworks.com/operator-group: cozystack
spec:
  {{- if $tlsEnabled }}
  tls:
    enabled: true
    authClients: {{ include "redis.tls.authClients" . | quote }}
    # When TLS is on the operator always publishes an Opaque Secret holding just
    # ca.crt; this only chooses its name, which otherwise defaults to
    # "<tls-secret>-ca" — a name that reads as though it belonged to the leaf.
    # Nothing in the tenant read path consumes it: the trust anchor reaches the
    # tenant as the <release>.tenant-ca projection declared in
    # templates/tenant-projection.yaml, sourced from the chart's own CA Secret.
    caCertSecretName: {{ .Release.Name }}.ca-cert
    certificateSecret:
      secretName: {{ .Release.Name }}.tls
  {{- end }}
  sentinel:
    # Pin the sentinel engine. The freshworks-oss operator's compiled-in default
    # moved 6.2.6→7.2.4; the data pods run a deliberate versionMap image below,
    # but the sentinels were on the old 6.2.6 default and must not silently jump
    # on upgrade. Bump as a deliberate, separate change.
    image: redis:6.2.6-alpine
    replicas: 3
    resources: {{- include "cozy-lib.resources.defaultingSanitize" (list $sentinelPreset $sentinelResources $) | nindent 6 }}
  redis:
    image: "redis:{{ include "redis.versionMap" $ }}"
    resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.resourcesPreset .Values.resources $) | nindent 6 }}
    replicas: {{ .Values.replicas }}
    {{- with .Values.size }}
    storage:
      persistentVolumeClaim:
        metadata:
          name: redisfailover-persistent-data
          labels:
            app.kubernetes.io/component: redis
            app.kubernetes.io/instance: {{ $.Release.Name }}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ . }}
          {{- with $.Values.storageClass }}
          storageClassName: {{ . }}
          {{- end }}
    {{- end }}
    exporter:
      enabled: true
      image: oliver006/redis_exporter:v1.55.0@sha256:d82625bda93823fb40de881ffbb45b65aca772a39c30141387f92314c258da5d
      args:
        - --web.telemetry-path
        - /metrics
      env:
        - name: REDIS_EXPORTER_LOG_FORMAT
          value: txt
    customConfig:
      - tcp-keepalive 0
      - loglevel notice
      {{- if not .Values.size }}
      - appendonly no
      - save ""
      {{- end }}
  {{- if .Values.authEnabled }}
  auth:
    secretPath: {{ .Release.Name }}-auth
  {{- end }}

---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ $.Release.Name }}-redis
  namespace: {{ $.Release.Namespace }}
  labels:
    workloads.cozystack.io/resource-preset: {{ .Values.resourcesPreset | quote }}
spec:
  minReplicas: 1
  replicas: {{ .Values.replicas }}
  kind: redis
  type: redis
  selector:
    app.kubernetes.io/component: redis
    app.kubernetes.io/instance: {{ $.Release.Name }}
  version: {{ $.Chart.Version }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ $.Release.Name }}-sentinel
  namespace: {{ $.Release.Namespace }}
  labels:
    workloads.cozystack.io/resource-preset: {{ $sentinelPreset | quote }}
spec:
  minReplicas: 2
  replicas: 3
  kind: redis
  type: sentinel
  selector:
    app.kubernetes.io/component: sentinel
    app.kubernetes.io/instance: {{ $.Release.Name }}
  version: {{ $.Chart.Version }}
