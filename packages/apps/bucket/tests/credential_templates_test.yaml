suite: bucket credential templates

templates:
  - templates/credentials.yaml
  - templates/bucketclaim.yaml
  - templates/dashboard-resourcemap.yaml

release:
  name: bucket-photos
  namespace: tenant-foo

set:
  _namespace:
    seaweedfs: tenant-root

tests:
  - it: renders one engine-issued template per tenant user, naming the BucketAccess the controller creates
    template: templates/credentials.yaml
    set:
      users:
        web: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CredentialTemplate
      - equal:
          path: metadata.name
          value: bucket-photos.web
      - equal:
          path: spec
          value:
            username: web
            format:
              name: plaintext
            bucketAccess:
              name: bucket-photos-web
              bucketClaimName: bucket-photos
              bucketAccessClassName: tenant-root

  - it: takes the read-only class of the storage pool for a read-only user
    template: templates/credentials.yaml
    set:
      storagePool: fast
      users:
        reader:
          readonly: true
    asserts:
      - equal:
          path: spec.bucketAccess.bucketAccessClassName
          value: tenant-root-fast-readonly

  - it: renders no BucketAccess for a tenant user
    template: templates/bucketclaim.yaml
    set:
      users:
        web: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: BucketClaim

  - it: keeps a platform user's BucketAccess in the chart and gives it no template
    set:
      users:
        system:
          platform: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/credentials.yaml
      - hasDocuments:
          count: 2
        template: templates/bucketclaim.yaml
      - equal:
          path: spec
          value:
            bucketAccessClassName: tenant-root
            bucketClaimName: bucket-photos
            credentialsSecretName: bucket-photos-system
            protocol: s3
        template: templates/bucketclaim.yaml
        documentSelector:
          path: kind
          value: BucketAccess

  - it: grants the dashboard only the tenant users' Secrets
    template: templates/dashboard-resourcemap.yaml
    documentSelector:
      path: kind
      value: Role
    set:
      ui: false
      users:
        web: {}
        system:
          platform: true
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["bucket-photos-web-credentials"]
              verbs: ["get", "list", "watch"]

  - it: grants no Secret at all when every user is a platform user
    template: templates/dashboard-resourcemap.yaml
    documentSelector:
      path: kind
      value: Role
    set:
      ui: false
      users:
        system:
          platform: true
    asserts:
      - isNullOrEmpty:
          path: rules

  # The pre-conversion chart named a user's BucketAccess <release>-<user>,
  # and migration 71 hands that one over by name, so a user name that is a
  # valid object name keeps it. Any other one never had a BucketAccess and
  # takes the account name.
  - it: names the BucketAccess as the pre-conversion chart did when that name is valid
    template: templates/credentials.yaml
    set:
      users:
        archive.v2: {}
    asserts:
      - equal:
          path: metadata.name
          value: bucket-photos.archive-v2
      - equal:
          path: spec.bucketAccess.name
          value: bucket-photos-archive.v2

  - it: names the BucketAccess after the account when the user name is not a valid object name
    template: templates/credentials.yaml
    set:
      users:
        Web_Uploads: {}
    asserts:
      - equal:
          path: metadata.name
          value: bucket-photos.web-uploads
      - equal:
          path: spec.bucketAccess.name
          value: bucket-photos-web-uploads

  - it: refuses a user whose account name is not a valid name
    template: templates/credentials.yaml
    set:
      users:
        "-web": {}
    asserts:
      - failedTemplate:
          errorPattern: start and end with a letter or a digit

  - it: refuses a user whose account name is longer than a DNS label
    template: templates/credentials.yaml
    set:
      users:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {}
    asserts:
      - failedTemplate:
          errorPattern: at most 63 characters

  - it: refuses two users that map to one account
    template: templates/credentials.yaml
    set:
      users:
        Web: {}
        web: {}
    asserts:
      - failedTemplate:
          errorPattern: both map to the account name "web"
