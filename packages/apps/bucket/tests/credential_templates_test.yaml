suite: bucket credential templates

templates:
  - templates/credentials.yaml
  - templates/bucketclaim.yaml
  - templates/dashboard-resourcemap.yaml

release:
  name: bucket-photos
  namespace: tenant-foo

set:
  _namespace:
    seaweedfs: tenant-root

tests:
  - it: renders one cosi template per tenant user, naming the BucketAccess the controller creates
    template: templates/credentials.yaml
    set:
      users:
        web: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CredentialTemplate
      - equal:
          path: metadata.name
          value: bucket-photos.web
      - equal:
          path: spec
          value:
            username: web
            format:
              name: cosi
            bucketAccess:
              name: bucket-photos-web
              bucketClaimName: bucket-photos
              bucketAccessClassName: tenant-root

  - it: takes the read-only class of the storage pool for a read-only user
    template: templates/credentials.yaml
    set:
      storagePool: fast
      users:
        reader:
          readonly: true
    asserts:
      - equal:
          path: spec.bucketAccess.bucketAccessClassName
          value: tenant-root-fast-readonly

  - it: renders no BucketAccess for a tenant user
    template: templates/bucketclaim.yaml
    set:
      users:
        web: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: BucketClaim

  - it: keeps a platform user's BucketAccess in the chart and gives it no template
    set:
      users:
        system:
          platform: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/credentials.yaml
      - hasDocuments:
          count: 2
        template: templates/bucketclaim.yaml
      - equal:
          path: spec
          value:
            bucketAccessClassName: tenant-root
            bucketClaimName: bucket-photos
            credentialsSecretName: bucket-photos-system
            protocol: s3
        template: templates/bucketclaim.yaml
        documentIndex: 1

  - it: grants the dashboard only the tenant users' Secrets
    template: templates/dashboard-resourcemap.yaml
    documentIndex: 0
    set:
      ui: false
      users:
        web: {}
        system:
          platform: true
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["bucket-photos-web-credentials"]
              verbs: ["get", "list", "watch"]

  - it: grants no Secret at all when every user is a platform user
    template: templates/dashboard-resourcemap.yaml
    documentIndex: 0
    set:
      ui: false
      users:
        system:
          platform: true
    asserts:
      - isNullOrEmpty:
          path: rules

  - it: refuses a user whose account name is not a valid name
    template: templates/credentials.yaml
    set:
      users:
        "-web": {}
    asserts:
      - failedTemplate:
          errorPattern: must start and end with a letter or a digit

  - it: refuses two users that map to one account
    template: templates/credentials.yaml
    set:
      users:
        Web: {}
        web: {}
    asserts:
      - failedTemplate:
          errorPattern: both map to the account name "web"
