suite: bucket ui flag
templates:
  - templates/helmrelease.yaml
  - templates/dashboard-resourcemap.yaml

release:
  name: bucket-my-bucket
  namespace: tenant-root

tests:
  - it: passes ui through to the bucket-system release, enabled by default
    template: templates/helmrelease.yaml
    asserts:
      - equal:
          path: spec.values.ui
          value: true

  - it: passes ui=false through to the bucket-system release
    template: templates/helmrelease.yaml
    set:
      ui: false
    asserts:
      - equal:
          path: spec.values.ui
          value: false

  - it: grants dashboard read access to the UI Ingress by default
    template: templates/dashboard-resourcemap.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["ingresses"]
            resourceNames: ["bucket-my-bucket-ui"]
            verbs: ["get", "list", "watch"]

  - it: drops the Ingress rule when ui is false
    template: templates/dashboard-resourcemap.yaml
    documentIndex: 0
    set:
      ui: false
    asserts:
      - lengthEqual:
          path: rules
          count: 1
      - notContains:
          path: rules[0].resources
          content: ingresses
