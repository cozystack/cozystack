## @param {bool} locking=false - Provisions bucket from the `-lock` BucketClass (with object lock enabled).
locking: false

## @param {bool} lockingDefaultRetention=true - With `locking`, keeps the default retention of the `-lock` BucketClass (COMPLIANCE, 365 days). Set to `false` to provision from the `-lock-noretention` BucketClass instead: Object Lock is enabled with no default retention, and retention is then set on the bucket or per object through the S3 API. Read at creation only.
lockingDefaultRetention: true

## @param {string} [storagePool] - Selects a specific BucketClass by storage pool name.
## @x-cozystack-options {source: storagepool}
storagePool: ""

## @param {bool} ui=true - Deploys the web UI (s3manager) with its Service and its Ingress or HTTPRoute at `<bucket>.<tenant host>`. Set to `false` to run the bucket without them.
ui: true

## @typedef {struct} User - Bucket user configuration.
## @field {bool} [readonly] - Whether the user has read-only access.

## @param {map[string]User} users - Users configuration map.
users: {}
