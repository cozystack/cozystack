{{- $sharedTLS := eq (printf "%s-ui-tls" .Release.Name) (index (.Values._cluster | default dict) "wildcard-secret-name" | default "") -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup-acme
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Bound the whole cleanup: never let a stuck finalizer or a hung API call
  # leave this post-delete hook running indefinitely and block the uninstall.
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup-acme
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: docker.io/clastix/kubectl:v1.32
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              echo "Cleaning up orphaned cert-manager ACME resources for {{ .Release.Name }}..."
              # bucket-system uses this hostname for its UI Certificate.
              HOST="{{ .Release.Name }}.{{ .Values._namespace.host }}"
              # The Job deadline bounds API calls; key cleanup failures fail the hook.
              key_left=0
{{- if not $sharedTLS }}
{{ include "cozy-lib.hooks.deleteIngressTLS" (dict "key" (printf "%s-ui-tls" .Release.Name) "host" (printf "%s.%s" .Release.Name .Values._namespace.host) "namespace" .Release.Namespace) | indent 14 }}
              cleanup_ingress_tls || key_left=1
{{- end }}
              # Delete only solvers for this host, preserving other apps.
              challenges="$(kubectl get challenge -n {{ .Release.Namespace }} -o jsonpath="{range .items[?(@.spec.dnsName=='$HOST')]}{.metadata.name} {end}")" \
                || { echo "WARNING: failed to list challenges for {{ .Release.Name }}; orphaned ACME resources may remain" >&2; challenges=""; }
              for ch in $challenges; do
                kubectl delete challenge -n {{ .Release.Namespace }} "$ch" --ignore-not-found --wait=false \
                  || echo "WARNING: failed to delete challenge $ch for {{ .Release.Name }}; orphaned ACME resources may remain" >&2
              done
              # Remaining solver Pods and Services are owned by their Challenge.
              ingresses="$(kubectl get ingress -n {{ .Release.Namespace }} -l acme.cert-manager.io/http01-solver=true -o jsonpath="{range .items[?(@.spec.rules[0].host=='$HOST')]}{.metadata.name} {end}")" \
                || { echo "WARNING: failed to list solver ingresses for {{ .Release.Name }}; orphaned ACME resources may remain" >&2; ingresses=""; }
              for ing in $ingresses; do
                kubectl delete ingress -n {{ .Release.Namespace }} "$ing" --ignore-not-found --wait=false \
                  || echo "WARNING: failed to delete solver ingress $ing for {{ .Release.Name }}; orphaned ACME resources may remain" >&2
              done
              if [ "$key_left" -ne 0 ]; then
                echo "ACME cleanup FAILED for {{ .Release.Name }}, Secret {{ .Release.Name }}-ui-tls may still hold its private key." >&2
                exit 1
              fi
              echo "ACME cleanup complete."
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup-acme
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cleanup-acme
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
{{- if not $sharedTLS }}
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "delete"]
  # The TLS Secret of the UI Certificate, by name only, so the hook cannot reach
  # any other Secret in the tenant namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Release.Name }}-ui-tls"]
    verbs: ["get", "delete"]
{{- end }}
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["orders", "challenges"]
    verbs: ["get", "list", "delete"]
  # Needed to list+delete this release's orphaned http01 solver Ingress objects
  # by host. Services/Pods are intentionally omitted: the solver Service/Pod are
  # owned by their Challenge and cascade-delete with it, so we never delete them
  # directly (and thus never sweep them namespace-wide).
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup-acme
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cleanup-acme
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cleanup-acme
