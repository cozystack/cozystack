{{- /*
  One CredentialTemplate per tenant user: the account the Cozystack
  credentials API mints and revokes through. The COSI driver issues a user's
  keys, so the template names the BucketAccess whose grant issues them, and
  cozystack-controller creates that BucketAccess, copies its keys into the
  account Secret <release>.<account>.account, and re-creates it on a mint or a
  revoke. The chart renders no BucketAccess and no key for these users. A
  platform user keeps its chart-rendered BucketAccess in bucketclaim.yaml.
*/ -}}
{{- include "bucket.accountsGuard" $ }}
{{- range $user, $u := .Values.users }}
{{- if not (default false $u.platform) }}
---
apiVersion: cozystack.io/v1alpha1
kind: CredentialTemplate
metadata:
  name: {{ printf "%s.%s" $.Release.Name (include "bucket.accountName" $user) | quote }}
spec:
  username: {{ $user | quote }}
  format:
    name: cosi
  bucketAccess:
    name: {{ printf "%s-%s" $.Release.Name $user | quote }}
    bucketClaimName: {{ $.Release.Name | quote }}
    bucketAccessClassName: {{ include "bucket.accessClass" (list $ $u) | quote }}
{{- end }}
{{- end }}
