{{- $seaweedfs := .Values._namespace.seaweedfs }}
{{- $pool := .Values.storagePool }}
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  bucketClassName: {{ $seaweedfs }}{{- if $pool }}-{{ $pool }}{{- end }}{{- if .Values.locking }}-lock{{- if eq (toString .Values.lockingDefaultRetention) "false" }}-noretention{{- end }}{{- end }}
  protocols:
    - s3
{{- /*
  Only a platform user's BucketAccess is rendered here. A tenant user's is
  created by cozystack-controller from its CredentialTemplate
  (credentials.yaml), so that a mint can re-create it and a revoke delete it.
*/}}
{{- range $name, $user := .Values.users }}
{{- if default false $user.platform }}
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  bucketAccessClassName: {{ include "bucket.accessClass" (list $ $user) }}
  bucketClaimName: {{ $.Release.Name }}
  credentialsSecretName: {{ $.Release.Name }}-{{ $name }}
  protocol: s3
{{- end }}
{{- end }}
{{- if .Values.publicRead }}
{{- if hasKey .Values.users "public-read" }}
{{- fail "publicRead creates the BucketAccess <bucket>-public-read, which the user \"public-read\" already owns: rename that user" }}
{{- end }}
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: {{ .Release.Name }}-public-read
spec:
  bucketAccessClassName: {{ $seaweedfs }}{{- if $pool }}-{{ $pool }}{{- end }}-public
  bucketClaimName: {{ .Release.Name }}
  credentialsSecretName: {{ .Release.Name }}-public-read
  protocol: s3
{{- end }}
