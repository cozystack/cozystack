{{- /*
  Worker node pool for a managed Kubernetes cluster.

  This chart is the second half of the Kubernetes-app split (cozystack/community#8):
  the control plane (Cluster / KamajiControlPlane / KubevirtCluster / PKI) lives in
  the `kubernetes` chart, and each worker pool is a separate `kubernetes-nodes`
  release. The pool objects (KubevirtMachineTemplate, MachineDeployment,
  MachineHealthCheck, worker WorkloadMonitor) and the talos-reconcile Job that
  produces the pool's TalosConfigTemplate are rendered here, wired to the parent
  cluster `kubernetes-<cluster>` by name convention (see _helpers.tpl). Every
  reference the monolithic chart made through $.Release.Name is reconstructed here
  as the parent clusterName so the objects are byte-identical to what the parent
  rendered for the same group — the KubevirtMachineTemplate is content-hash-named,
  so any drift would roll every live worker VM.

  Talos -> Kubernetes support matrix, against the pool default. The pool can also
  reach a different Talos release through image.builtin.version /
  image.factory.version, and that override is checked against the same matrix at
  the point it is resolved, below. Both call sites share one table, in
  templates/_helpers.tpl.
*/}}
{{- include "kubernetes-nodes.assertTalosSupportsKubernetes" (dict
      "talosVersion" .Values.talos.version
      "kubernetesVersion" .Values.version
      "remedy" "Bump 'version' or set talos.version explicitly.") }}
{{- $clusterName := include "kubernetes-nodes.clusterName" . }}
{{- $groupName := include "kubernetes-nodes.groupName" . }}
{{- include "kubernetes-nodes.assertNoForeignPool" . }}
{{- include "kubernetes-nodes.assertParentVersion" . }}
{{- $kubevirtmachinetemplateNames := list }}
{{- $group := dict
      "minReplicas" .Values.minReplicas
      "maxReplicas" .Values.maxReplicas
      "instanceType" .Values.instanceType
      "diskSize" .Values.diskSize
      "storageClass" .Values.storageClass
      "image" .Values.image
      "roles" .Values.roles
      "resources" .Values.resources
      "gpus" .Values.gpus
      "kubelet" .Values.kubelet
      "logSerialConsole" .Values.logSerialConsole
      "podCpuLimit" .Values.podCpuLimit
      "podCpuRequest" .Values.podCpuRequest
}}
{{- define "kubevirtmachinetemplate" -}}
spec:
  {{- /* Talos has no SSH; use 'none' so CAPK does not block Machine.Ready
        on an SSH probe that will never succeed. The Machine reaches Ready
        once kubelet registers with the tenant apiserver via standard CSR. */}}
  virtualMachineBootstrapCheck:
    checkStrategy: none
  virtualMachineTemplate:
    metadata:
      namespace: {{ $.Release.Namespace }}
      labels:
        {{- range .group.roles }}
        node-role.kubernetes.io/{{ . }}: ""
        {{- end }}
    spec:
      {{- /* Explicit resources take precedence over instanceType. When a node
             group is sized by resources (both cpu and memory set), the
             instancetype is omitted from the VM: KubeVirt rejects a
             VirtualMachine that references an instancetype and also overrides
             either domain.cpu or domain.memory. */}}
      {{- $sizedByResources := and .group.resources .group.resources.cpu .group.resources.memory }}
      {{- if and .group.instanceType (not $sizedByResources) }}
      instancetype:
        kind: VirtualMachineClusterInstancetype
        name: {{ .group.instanceType }}
      {{- end }}
      runStrategy: Always
      dataVolumeTemplates:
      {{- /* This pool selects its worker OS image source via .Values.image (the
             WorkerImage union in values.yaml); every field defaults to the pool's
             talos.*:
               * image omitted / image.factory — import the raw image over HTTP from
                 the Talos Image Factory (or a mirror): one download per worker.
               * image.builtin — CDI storage-layer clone of a golden image in the
                 opt-in worker image catalog (packages/system/kubernetes-worker-image)
                 in cozy-public, named talos-worker-<schematicID>-<version>. A clone
                 is a CSI copy, so N workers no longer each stream the OS image across
                 the pod network — the source of the kubernetes-* e2e node-join flake
                 (cozystack/cozystack#3231) and a per-worker Factory dependency.

             The disk-system source is derived purely from .Values.image, so it is
             deterministic across re-renders: with image omitted a pool renders
             byte-identically to the pre-feature chart (its workers do not roll on
             upgrade), and there is no cluster-state-driven flip to guard against.
             Because the source is content-hashed into the KubevirtMachineTemplate
             name (see the KMT block below), intentionally changing .Values.image on an
             existing pool reimages that pool — expected, like editing any
             workload's image. lookup() is empty under `helm template`, so a builtin
             pool's golden must be mocked in unit tests. */}}
      {{- /* Use hasKey, not truthiness: builtin/factory may be present but empty
             ({} means "clone / import with the pool's talos.* defaults"), and Go
             templates treat an empty map as false. */}}
      {{- $img := .group.image | default dict }}
      {{- if and (hasKey $img "builtin") (hasKey $img "factory") }}{{- fail (printf "nodeGroup %q: set only one of image.builtin or image.factory" .groupName) }}{{- end }}
      {{- $reqSchematicID := $.Values.talos.schematicID }}
      {{- $reqVersion := $.Values.talos.version }}
      {{- $reqFactoryURL := $.Values.talos.imageFactoryURL }}
      {{- $useClone := false }}
      {{- if hasKey $img "builtin" }}
      {{-   $builtin := $img.builtin | default dict }}
      {{-   $useClone = true }}
      {{-   $reqSchematicID = $builtin.schematicID | default $.Values.talos.schematicID }}
      {{-   $reqVersion = $builtin.version | default $.Values.talos.version }}
      {{- else if hasKey $img "factory" }}
      {{-   $factory := $img.factory | default dict }}
      {{-   $reqSchematicID = $factory.schematicID | default $.Values.talos.schematicID }}
      {{-   $reqVersion = $factory.version | default $.Values.talos.version }}
      {{-   $reqFactoryURL = $factory.imageFactoryURL | default $.Values.talos.imageFactoryURL }}
      {{- end }}
      {{- /* Tenant-controlled strings, validated before they are interpolated.
             Reviewed as [MINOR] on cozystack/cozystack#3294: schematicID, version
             and imageFactoryURL land unquoted in the KubevirtMachineTemplate
             below, so a value carrying a newline or a YAML metacharacter injects
             keys into this pool's own KMT; nindent keeps the blast radius inside
             the pool, but the value should never get that far. The schema types
             all three as a bare string and cannot narrow them -- the pinned
             cozyvalues-gen derives `pattern` from the value TYPE (quantity) and
             has no annotation for a custom one -- so the check lives here, which
             is where this chart already validates the kubelet reservation fields
             for the same class of hazard (see the INVARIANT note in
             templates/talos-reconcile-job.yaml).

             The resolved values are checked, not just the overridden ones: an
             override and the pool default reach the same interpolation, and a
             guard on one of the two paths is the asymmetry this file just removed
             from the support matrix. The patterns accept every form the chart
             ships and every form a Talos Image Factory produces -- a 64-character
             hex schematic, a vN.N.N release, an http(s) URL -- and reject the
             bytes that would break out of a YAML scalar. */}}
      {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" ($reqSchematicID | toString)) }}
      {{-   fail (printf "nodeGroup %q: Talos schematicID %q is not a plain lowercase alphanumeric identifier. It is interpolated into the worker DataVolume name and the image URL, so it must carry no whitespace, path separators or YAML metacharacters." .groupName ($reqSchematicID | toString)) }}
      {{- end }}
      {{- if not (regexMatch "^v[0-9]+\\.[0-9]+(\\.[0-9]+)?(-[0-9a-z.]+)?$" ($reqVersion | toString)) }}
      {{-   fail (printf "nodeGroup %q: Talos version %q is not a vMAJOR.MINOR.PATCH release. It is interpolated into the worker DataVolume name and the image URL, so it must carry no whitespace or YAML metacharacters." .groupName ($reqVersion | toString)) }}
      {{- end }}
      {{- if not (regexMatch "^https?://[A-Za-z0-9._~:/?#\\[\\]@!&'()*+,;=%-]+$" ($reqFactoryURL | toString)) }}
      {{-   fail (printf "nodeGroup %q: imageFactoryURL %q is not a plain http(s) URL. It is interpolated into the worker DataVolume source URL, so it must carry no whitespace, backtick, dollar sign or YAML metacharacters." .groupName ($reqFactoryURL | toString)) }}
      {{- end }}
      {{- /* The guard at the top of this file keys on .Values.talos.version. An
             image override moves the Talos release this pool actually boots and
             installs, so re-run the same matrix against the resolved version;
             without this a pool could keep a supported talos.version and still
             boot a Talos minor whose kubelet window excludes .Values.version,
             which is exactly the silently-broken pairing the guard exists to
             refuse. No-op when image pins nothing, since the resolved version is
             then the one already checked above. */}}
      {{- if ne ($reqVersion | toString) ($.Values.talos.version | toString) }}
      {{-   include "kubernetes-nodes.assertTalosSupportsKubernetes" (dict
              "talosVersion" $reqVersion
              "kubernetesVersion" $.Values.version
              "remedy" (printf "nodeGroup %s reaches this Talos release through its image override, not through talos.version. Bump 'version', change the image version, or drop the override so the pool follows talos.version." .groupName)) }}
      {{- end }}
      {{- $httpURL := printf "%s/image/%s/%s/openstack-amd64.raw.xz" ($reqFactoryURL | trimSuffix "/") $reqSchematicID $reqVersion }}
      {{- $goldenName := printf "talos-worker-%s-%s" $reqSchematicID $reqVersion }}
      {{- /* A builtin pool whose golden is absent, failed to import, or on a
             StorageClass the worker disk cannot CSI-clone from fails loudly here
             rather than degrading silently. And because a CDI clone target must be
             at least as large as its source, a worker diskSize below the golden's
             storage would fail the clone at runtime — reject it at render when the
             golden's size is known.

             What `lookup` returning nothing means differs by guard, and the
             difference is worth knowing before running any of this offline. The
             phase, StorageClass and size guards read fields of a golden that was
             found, so an empty lookup makes them no-ops. The absence guard below is
             the opposite: an empty lookup IS its failure condition. So a pool on
             image.builtin cannot be rendered by anything that has no cluster to
             read -- `helm template`, `helm lint`, a dashboard preview -- and its
             unit tests have to mock the golden through kubernetesProvider. That is
             the price of failing loudly instead of degrading into an HTTP import
             nobody asked for. */}}
      {{- if $useClone }}
      {{-   $goldenDV := lookup "cdi.kubevirt.io/v1beta1" "DataVolume" "cozy-public" $goldenName }}
      {{-   if not $goldenDV }}
      {{-     fail (printf "nodeGroup %q: image.builtin requested golden DataVolume %q not found in cozy-public — enable the cozystack.kubernetes-worker-image catalog via bundles.enabledPackages with a matching (schematicID, version) entry, or switch this pool to image.factory." .groupName $goldenName) }}
      {{-   end }}
      {{- /* Fail only on the golden's terminal failure phase, not on "not yet
             Succeeded". A golden mid-import is transient: CDI holds the worker
             DataVolume until the source is populated, which is the correct
             behaviour and recovers unattended. Hard-failing the render there would
             abort the ENTIRE KubernetesNodes HelmRelease — every resource, not just
             this disk — for every pool pinned to that golden, blocking unrelated
             scale operations for the length of an import. Only Failed, which
             never recovers without operator action, justifies that blast radius.
             Falling back to the HTTP import is deliberately not an option either: it
             would make disk-system's source depend on cluster state, so the source —
             and with it the content-hashed KubevirtMachineTemplate name — would flip
             once the golden went Ready and roll every worker in the pool. */}}
      {{-   $goldenPhase := dig "status" "phase" "" $goldenDV | toString }}
      {{-   if eq $goldenPhase "Failed" }}
      {{-     fail (printf "nodeGroup %q: golden DataVolume %q in cozy-public failed to import (phase Failed) — cloning it would block this pool's workers indefinitely. Check the importer pod in cozy-public, then delete the DataVolume to retry the import." .groupName $goldenName) }}
      {{-   end }}
      {{- /* CDI takes the storage-layer CSI-clone path only when source and target
             share a StorageClass; across classes it silently falls back to a
             host-assisted copy over the pod network — exactly the per-worker
             network transfer image.builtin exists to avoid (#3231). Reject the
             case we can prove. Either side empty means "cluster default", which is
             not resolvable at render time, so skip rather than guess. This rules
             out the guaranteed-host-assisted case, not every one: a matching
             StorageClass still leaves the strategy to the CDI StorageProfile,
             which the worker DataVolume inherits. */}}
      {{-   $workerSC := .group.storageClass | default $.Values.storageClass | toString }}
      {{-   $goldenSC := dig "spec" "storage" "storageClassName" "" $goldenDV | toString }}
      {{-   if and $workerSC $goldenSC (ne $workerSC $goldenSC) }}
      {{-     fail (printf "nodeGroup %q: storageClass %q differs from golden image %q storageClass %q — CDI cannot CSI-clone across StorageClasses and would fall back to a host-assisted copy over the pod network. Set the kubernetes-worker-image catalog entry's storageClass to %q, or point this pool at %q, or switch this pool to image.factory." .groupName $workerSC $goldenName $goldenSC $workerSC $goldenSC) }}
      {{-   end }}
      {{-   $goldenStorage := dig "spec" "storage" "resources" "requests" "storage" "" $goldenDV }}
      {{-   if $goldenStorage }}
      {{-     $workerDisk := .group.diskSize | default "20Gi" | toString }}
      {{-     $workerBytes := include "cozy-lib.resources.toFloat" $workerDisk | float64 }}
      {{-     $goldenBytes := include "cozy-lib.resources.toFloat" ($goldenStorage | toString) | float64 }}
      {{-     if lt $workerBytes $goldenBytes }}
      {{-       fail (printf "nodeGroup %q: diskSize %s is smaller than golden image %q storage %s — a CDI clone target must be at least the source size. Raise diskSize to %s or larger." .groupName $workerDisk $goldenName ($goldenStorage | toString) ($goldenStorage | toString)) }}
      {{-     end }}
      {{-   end }}
      {{- end }}
      - metadata:
          name: disk-system
          {{- /* usePopulator=false stays ONLY on the HTTP/import path: it preserves
                 the legacy import behaviour and keeps an image-omitted DV — hence the
                 KMT hash — byte-identical to the pre-feature render, so those workers
                 never roll on upgrade. The clone path omits it so CDI's populator
                 performs a storage-layer CSI clone of the golden (verified on dev10:
                 temp PVC CSI-cloned + resized, no host-assisted upload pod) instead
                 of a slower pod-network copy. */}}
          {{- if $useClone }}
          {{- /* Names the golden this disk was cloned from. Reviewed as [MINOR] on
                 cozystack/cozystack#3294: a golden is referenced only from inside a
                 VM dataVolumeTemplates source, so before this there was no query
                 that told an operator which pools still pin `talos-worker-<id>-<ver>`
                 -- and a pool on `builtin: {}` does not name it in its own CR either,
                 because the schematic and version come from talos.* defaults. With
                 this the answer is one read:

                   kubectl get datavolume -A -o jsonpath=\
                     '{range .items[?(@.metadata.annotations.kubernetes-worker-image\
                     \.cozystack\.io/golden=="talos-worker-<id>-<ver>")]}\
                     {.metadata.namespace}/{.metadata.name}{"\n"}{end}'

                 An annotation rather than a label because a schematic ID is 64
                 characters and a label value stops at 63. */}}
          annotations:
            kubernetes-worker-image.cozystack.io/golden: {{ $goldenName | quote }}
          {{- else }}
          annotations:
            cdi.kubevirt.io/storage.usePopulator: "false"
          {{- end }}
        spec:
          {{- /* Use the openstack/configdrive Talos image: KubeVirt CAPK
                injects bootstrap data via cloudInitConfigDrive (OpenStack
                metadata service shape), and the openstack platform image
                is the one that reads it. The nocloud-amd64 image silently
                ignores configdrive and never applies the machineconfig. */}}
          source:
          {{- if $useClone }}
            pvc:
              namespace: cozy-public
              name: {{ $goldenName | quote }}
          {{- else }}
            http:
              {{- /* Deliberately unquoted. This is the pre-feature render for a pool
                     with `image` omitted, and the KubevirtMachineTemplate is named by
                     a hash of its own content -- quoting the scalar changes those
                     bytes and rolls every live worker on upgrade. The components are
                     validated above instead, which is what makes an unquoted scalar
                     safe here. The clone path's name below is quoted because no
                     existing worker renders it. */}}
              url: {{ $httpURL }}
          {{- end }}
          storage:
            resources:
              requests:
                storage: {{ .group.diskSize | default "20Gi" | quote }}
            {{- /*
              Worker VMs live-migrate, so their disks need ReadWriteMany. The
              RWX access mode is supplied by the chosen StorageClass's CDI
              StorageProfile — it is not set on the DataVolume here. linstor-csi
              rejects RWX volumes that are not on a DRBD-backed StorageClass, so
              an empty nodeGroup storageClass falls back to the application-level
              storageClass (a replicated/DRBD class) instead of the cluster
              default, which may be a non-DRBD class that the CSI driver would
              reject. Both empty still omits the field so the cluster default
              applies.
            */}}
            {{- with .group.storageClass | default $.Values.storageClass }}
            storageClassName: {{ . | quote }}
            {{- end }}
      template:
        metadata:
          annotations:
            kubevirt.io/allow-pod-bridge-network-live-migration: "true"
          labels:
            {{- /* The VM pod is intentionally attributed to the parent Kubernetes
                   application (kind Kubernetes, name <cluster>), not to this
                   KubernetesNodes release: these labels are part of the byte-identical
                   render the adoption migration relies on, and lineage/quota accounting
                   for worker VMs stays under the cluster they belong to. */}}
            apps.cozystack.io/application.group: apps.cozystack.io
            apps.cozystack.io/application.kind: Kubernetes
            apps.cozystack.io/application.name: {{ .clusterName | trimPrefix "kubernetes-" | quote }}
            {{- range .group.roles }}
            node-role.kubernetes.io/{{ . }}: ""
            {{- end }}
            cluster.x-k8s.io/deployment-name: {{ .clusterName }}-{{ .groupName }}
        spec:
          {{- if .Values._cluster.scheduling }}
          {{- $rawConstraints := get .Values._cluster.scheduling "globalAppTopologySpreadConstraints" }}
          {{- if $rawConstraints }}
          {{- $rawConstraints | fromYaml | toYaml | nindent 10 }}
            labelSelector:
              matchLabels:
                cluster.x-k8s.io/cluster-name: {{ .clusterName }}
          {{- end }}
          {{- end }}
          domain:
            {{- if and .group.resources .group.resources.cpu }}
            cpu:
              threads: 1
              cores: {{ .group.resources.cpu }}
              sockets: 1
            {{- end }}
            devices:
              {{- if .group.gpus }}
              gpus:
              {{- range $i, $gpu := .group.gpus }}
              - name: gpu{{ add $i 1 }}
                deviceName: {{ $gpu.name }}
              {{- end }}
              {{- end }}
              disks:
              - name: system
                disk:
                  bus: virtio
                  pciAddress: 0000:07:00.0
                blockSize:
                  custom:
                    logical: 512
                    physical: 4096
              interfaces:
              - name: default
                bridge: {}
              {{- /* Opt-in, and rendered only when true. The enclosing
                    KubevirtMachineTemplate is content-hash named, so emitting
                    this key for a pool that did not ask for it renames the
                    template and rolls every live worker VM. An explicit false
                    therefore renders the same nothing as an absent field
                    rather than KubeVirt's tri-state false. */}}
              {{- if .group.logSerialConsole }}
              logSerialConsole: true
              {{- end }}
            {{- if and .group.resources .group.resources.memory }}
            memory:
              guest: {{ .group.resources.memory }}
            {{- end }}
            resources:
              {{/* 2Gi is enough: persistent DataVolumes are not counted as pod ephemeral storage */}}
              {{- $podResources := include "cozy-lib.resources.sanitize" (list (dict "ephemeral-storage" "2Gi") $) }}
              {{- /* Either side of the pair, and only for a pool that asked
                    for it. KubeVirt derives both from the guest vCPU count, and
                    each key declared here displaces one derivation: the limit
                    stops it deriving a ceiling, the request stops its VMI
                    defaulter (setDefaultResourceRequests) copying that declared
                    ceiling into the request. A pool declaring only the limit
                    therefore moves both. The enclosing KubevirtMachineTemplate
                    is content-hash named, so a pool that sets neither has to
                    render the same bytes it did before these fields existed,
                    down to the whitespace.

                    Presence, not truth: zero is a quantity the schema accepts
                    and a pool can mean it, so `with` would drop a deliberate
                    choice as though nothing had been set. Which zeroes are
                    coherent is settled by the guards further down, not here. */}}
              {{- if not (kindIs "invalid" .group.podCpuLimit) }}
              {{- $limited := $podResources | fromYaml }}
              {{- $_ := set $limited.limits "cpu" (toString .group.podCpuLimit) }}
              {{- $podResources = toYaml $limited }}
              {{- end }}
              {{- if not (kindIs "invalid" .group.podCpuRequest) }}
              {{- $requested := $podResources | fromYaml }}
              {{- $_ := set $requested.requests "cpu" (toString .group.podCpuRequest) }}
              {{- $podResources = toYaml $requested }}
              {{- end }}
              {{- $podResources | nindent 14 }}
          evictionStrategy: External
          volumes:
          - name: system
            dataVolume:
              name: disk-system
          networks:
          - name: default
            pod: {}
{{- end }}
{{- /* instanceType and explicit resources are alternative sizing sources, and
       explicit resources win. KubeVirt rejects a VirtualMachine that references
       an instancetype while also overriding either domain.cpu or domain.memory,
       so when a group is sized by resources (both cpu and memory set) the
       instancetype is omitted from the VM (see the VM spec above) and the lookup
       below is skipped — a stale instancetype name cannot fail an otherwise
       valid, resource-sized group. Explicit resources are all-or-nothing: a
       partial spec (only one of cpu/memory) would emit one domain override
       alongside the instancetype, which KubeVirt rejects, so it fails here with
       a clear render-time error instead of a late admission rejection. */}}
{{- $hasCpu := and $group.resources $group.resources.cpu }}
{{- $hasMem := and $group.resources $group.resources.memory }}
{{- if and $group.instanceType (or (and $hasCpu (not $hasMem)) (and $hasMem (not $hasCpu))) }}
{{-   fail (printf "nodeGroup %s: set both resources.cpu and resources.memory, or neither" $groupName) }}
{{- end }}
{{- /* Presence, not truth, for both fields below: zero is a quantity the
       schema accepts, and a guard keyed on truthiness would wave through
       exactly the value it exists to catch. */}}
{{- $hasPodCpuLimit := not (kindIs "invalid" $group.podCpuLimit) }}
{{- $hasPodCpuRequest := not (kindIs "invalid" $group.podCpuRequest) }}
{{- /* Same conflict class, other field: podCpuLimit renders
       domain.resources.limits.cpu, and a VM that carries an instancetype and
       that key is refused by KubeVirt's instancetype applier, which reports it
       as a conflict rather than resolving it. The pool has to be sized by
       resources for the limit to be usable at all, since that is what drops
       the instancetype from the VM. */}}
{{- if and $hasPodCpuLimit $group.instanceType (not (and $hasCpu $hasMem)) }}
{{-   fail (printf "nodeGroup %s: podCpuLimit cannot be combined with instanceType sizing, because KubeVirt rejects a VirtualMachine that references an instancetype and also sets domain.resources.limits.cpu. Set both resources.cpu and resources.memory, which drops the instancetype from the VM, or drop podCpuLimit." $groupName) }}
{{- end }}
{{- /* Other side of the pair, same conflict and the same check upstream: the
       instancetype applier reports domain.resources.requests.cpu alongside the
       limit rather than resolving either. */}}
{{- if and $hasPodCpuRequest $group.instanceType (not (and $hasCpu $hasMem)) }}
{{-   fail (printf "nodeGroup %s: podCpuRequest cannot be combined with instanceType sizing, because KubeVirt rejects a VirtualMachine that references an instancetype and also sets domain.resources.requests.cpu. Set both resources.cpu and resources.memory, which drops the instancetype from the VM, or drop podCpuRequest." $groupName) }}
{{- end }}
{{- /* The rest of the value domain, decided in one place rather than one edge
       at a time. Both fields are quantities and the generated schema admits a
       leading minus and a zero as readily as a sane value, so what each class
       does has to be settled here:

       negative -- never reaches a running Pod, the API server rejects the
       quantity outright;

       zero limit -- removes the ceiling rather than being the tightest one:
       the kubelet turns a zero CPU limit into no CFS quota at all, and
       declaring the key stops KubeVirt deriving one. But it only reaches a
       Pod paired with a zero request, and that is not a style preference.
       API server validation refuses a request above a limit that exists, and
       zero is a limit that exists, while KubeVirt keeps deriving a request
       from the vCPU count whenever the VM declares none -- the defaulter that
       would have copied the limit across does not fire, because the limit is
       itself zero. So a lone zero limit renders a Pod that is rejected on
       creation, and is refused here instead;

       zero request beside a non-zero limit -- looks like "reserve nothing
       under this ceiling" and does the opposite. KubeVirt's defaulter tests
       the request with IsZero, which an explicit zero satisfies exactly as an
       absent key does, so it overwrites the zero with the limit and the worker
       asks for the whole ceiling. That is the failure this pair exists to
       avoid, so it is refused rather than documented;

       zero request alone -- the defaulter does not fire without a limit, so it
       survives and means what it says. Allowed.

       Comparisons are on the converted numbers, not on the strings that spell
       them: 1500m against 2 is not a string comparison. */}}
{{- if and $hasPodCpuLimit (lt (include "cozy-lib.resources.toFloat" $group.podCpuLimit | float64) 0.0) }}
{{-   fail (printf "nodeGroup %s: podCpuLimit (%v) must not be negative" $groupName $group.podCpuLimit) }}
{{- end }}
{{- if and $hasPodCpuRequest (lt (include "cozy-lib.resources.toFloat" $group.podCpuRequest | float64) 0.0) }}
{{-   fail (printf "nodeGroup %s: podCpuRequest (%v) must not be negative" $groupName $group.podCpuRequest) }}
{{- end }}
{{- if and $hasPodCpuLimit (not $hasPodCpuRequest) (eq (include "cozy-lib.resources.toFloat" $group.podCpuLimit | float64) 0.0) }}
{{-   fail (printf "nodeGroup %s: podCpuLimit 0 needs podCpuRequest 0 beside it. A zero limit removes the ceiling, but KubeVirt still derives a CPU request from the guest vCPU count when the VM declares none, and a request above a declared limit of zero is rejected when the worker's Pod is created." $groupName) }}
{{- end }}
{{- if and $hasPodCpuRequest $hasPodCpuLimit }}
{{-   $requestF := include "cozy-lib.resources.toFloat" $group.podCpuRequest | float64 }}
{{-   $limitF := include "cozy-lib.resources.toFloat" $group.podCpuLimit | float64 }}
{{-   if and (eq $requestF 0.0) (ne $limitF 0.0) }}
{{-     fail (printf "nodeGroup %s: podCpuRequest 0 beside a podCpuLimit does not reserve nothing. KubeVirt replaces a zero CPU request with the declared limit (%v), so the worker would ask the scheduler for its whole ceiling, which is what podCpuRequest exists to prevent. Give podCpuRequest a non-zero value, or drop it and accept the same outcome deliberately." $groupName $group.podCpuLimit) }}
{{-   end }}
{{-   if gt $requestF $limitF }}
{{-     fail (printf "nodeGroup %s: podCpuRequest (%v) exceeds podCpuLimit (%v), and a container cannot request more CPU than its limit" $groupName $group.podCpuRequest $group.podCpuLimit) }}
{{-   end }}
{{- end }}
{{/* Resolve instanceType once per group — reused for kubelet reservations and capacity annotations. */}}
{{- $instanceType := dict }}
{{- if and $group.instanceType (not (and $hasCpu $hasMem)) }}
{{-   $instanceType = (lookup "instancetype.kubevirt.io/v1beta1" "VirtualMachineClusterInstancetype" "" $group.instanceType) }}
{{-   if not $instanceType }}
{{-     fail (printf "nodeGroup %s: specified instanceType %q not found in cluster" $groupName $group.instanceType) }}
{{-   end }}
{{- end }}
{{/* Compute kubelet reservations: explicit resources.memory/cpu wins over instanceType spec.
     Auto-computed system/kube reserved memory = 5% of effective memory, clamped to [256Mi, 1Gi].
     Auto-computed system/kube reserved CPU = 5% of effective CPU, clamped to [50m, 500m]. */}}
{{- $effectiveMemory := "" }}
{{- if and $group.resources $group.resources.memory }}
{{-   $effectiveMemory = $group.resources.memory | toString }}
{{- else if and $instanceType $instanceType.spec $instanceType.spec.memory $instanceType.spec.memory.guest }}
{{-   $effectiveMemory = $instanceType.spec.memory.guest | toString }}
{{- end }}
{{- $effectiveCpu := "" }}
{{- if and $group.resources $group.resources.cpu }}
{{-   $effectiveCpu = $group.resources.cpu | toString }}
{{- else if and $instanceType $instanceType.spec $instanceType.spec.cpu $instanceType.spec.cpu.guest }}
{{-   $effectiveCpu = $instanceType.spec.cpu.guest | toString }}
{{- end }}
{{- $autoReservedMi := 256 }}
{{- if $effectiveMemory }}
{{-   $effectiveMemMi := divf (include "cozy-lib.resources.toFloat" $effectiveMemory | float64) 1048576.0 | int }}
{{-   $fivePercentMi := mulf ($effectiveMemMi | float64) 0.05 | int }}
{{-   $autoReservedMi = min (max $fivePercentMi 256) 1024 }}
{{- end }}
{{- $autoReservedMillicores := 50 }}
{{- if $effectiveCpu }}
{{-   $effectiveCpuMillicores := include "kubernetes.cpuToMillicores" $effectiveCpu | int }}
{{-   $fivePercentMillis := mulf ($effectiveCpuMillicores | float64) 0.05 | int }}
{{-   $autoReservedMillicores = min (max $fivePercentMillis 50) 500 }}
{{- end }}
{{- $kubeletOverride := $group.kubelet | default dict }}
{{- $systemReservedMemory := $kubeletOverride.systemReservedMemory | default (printf "%dMi" $autoReservedMi) }}
{{- $kubeReservedMemory := $kubeletOverride.kubeReservedMemory | default (printf "%dMi" $autoReservedMi) }}
{{- $systemReservedCpu := $kubeletOverride.systemReservedCpu | default (printf "%dm" $autoReservedMillicores) }}
{{- $kubeReservedCpu := $kubeletOverride.kubeReservedCpu | default (printf "%dm" $autoReservedMillicores) }}
{{- $evictionHardMemory := $kubeletOverride.evictionHardMemory | default "7%" }}
{{- $evictionSoftMemory := $kubeletOverride.evictionSoftMemory | default "10%" }}
{{/* Validate reservation field formats (user-supplied values only; computed defaults are valid by construction). */}}
{{- $validations := list
      (dict "key" "systemReservedMemory" "value" $kubeletOverride.systemReservedMemory "pattern" `^[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$` "hint" "a valid Kubernetes memory quantity (e.g. 128Mi, 1Gi, 1e9, 500e6)")
      (dict "key" "kubeReservedMemory"   "value" $kubeletOverride.kubeReservedMemory   "pattern" `^[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$` "hint" "a valid Kubernetes memory quantity (e.g. 128Mi, 1Gi, 1e9, 500e6)")
      (dict "key" "systemReservedCpu"    "value" $kubeletOverride.systemReservedCpu    "pattern" `^([0-9]+m|[0-9]+(\.[0-9]+)?)$`                                                              "hint" "a valid Kubernetes CPU quantity (integer millicores like 100m, or decimal cores like 0.5, 1)")
      (dict "key" "kubeReservedCpu"      "value" $kubeletOverride.kubeReservedCpu      "pattern" `^([0-9]+m|[0-9]+(\.[0-9]+)?)$`                                                              "hint" "a valid Kubernetes CPU quantity (integer millicores like 100m, or decimal cores like 0.5, 1)")
}}
{{- range $validations }}
{{-   if and .value (not (regexMatch .pattern (.value | toString))) }}
{{-     fail (printf "nodeGroup %s: invalid %s value %q — must be %s" $groupName .key (.value | toString) .hint) }}
{{-   end }}
{{- end }}
{{/* Validate that user-supplied reservation values are positive (non-zero) */}}
{{- range $_, $entry := list (dict "key" "systemReservedMemory" "value" $kubeletOverride.systemReservedMemory) (dict "key" "kubeReservedMemory" "value" $kubeletOverride.kubeReservedMemory) }}
{{-   if $entry.value }}
{{-     $bytes := include "cozy-lib.resources.toFloat" ($entry.value | toString) | float64 }}
{{-     if le $bytes 0.0 }}
{{-       fail (printf "nodeGroup %s: %s must be a positive value, got %s" $groupName $entry.key ($entry.value | toString)) }}
{{-     end }}
{{-   end }}
{{- end }}
{{- range $_, $entry := list (dict "key" "systemReservedCpu" "value" $kubeletOverride.systemReservedCpu) (dict "key" "kubeReservedCpu" "value" $kubeletOverride.kubeReservedCpu) }}
{{-   if $entry.value }}
{{-     $cpuMillis := include "kubernetes.cpuToMillicores" $entry.value | float64 }}
{{-     if le $cpuMillis 0.0 }}
{{-       fail (printf "nodeGroup %s: %s must be a positive value, got %s" $groupName $entry.key ($entry.value | toString)) }}
{{-     end }}
{{-   end }}
{{- end }}
{{/* Validate absolute eviction threshold formats before converting */}}
{{- if not (hasSuffix "%" $evictionHardMemory) }}
{{-   if not (regexMatch `^[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$` $evictionHardMemory) }}
{{-     fail (printf "nodeGroup %s: invalid evictionHardMemory value %q — must be a percentage (e.g. 7%%) or a valid Kubernetes memory quantity (e.g. 500Mi, 1Gi, 1e9)" $groupName $evictionHardMemory) }}
{{-   end }}
{{- end }}
{{- if not (hasSuffix "%" $evictionSoftMemory) }}
{{-   if not (regexMatch `^[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$` $evictionSoftMemory) }}
{{-     fail (printf "nodeGroup %s: invalid evictionSoftMemory value %q — must be a percentage (e.g. 10%%) or a valid Kubernetes memory quantity (e.g. 500Mi, 1Gi, 1e9)" $groupName $evictionSoftMemory) }}
{{-   end }}
{{- end }}
{{- if and (hasSuffix "%" $evictionHardMemory) (hasSuffix "%" $evictionSoftMemory) }}
{{-   $hardPctStr := trimSuffix "%" $evictionHardMemory }}
{{-   $softPctStr := trimSuffix "%" $evictionSoftMemory }}
{{-   if not (regexMatch `^[0-9]+(\.[0-9]+)?$` $hardPctStr) }}
{{-     fail (printf "nodeGroup %s: evictionHardMemory percentage value %q is not a valid number" $groupName $hardPctStr) }}
{{-   end }}
{{-   if not (regexMatch `^[0-9]+(\.[0-9]+)?$` $softPctStr) }}
{{-     fail (printf "nodeGroup %s: evictionSoftMemory percentage value %q is not a valid number" $groupName $softPctStr) }}
{{-   end }}
{{-   $hardPct := $hardPctStr | float64 }}
{{-   $softPct := $softPctStr | float64 }}
{{-   if le $hardPct 0.0 }}
{{-     fail (printf "nodeGroup %s: evictionHardMemory percentage must be greater than 0 and at most 100, got %s%%" $groupName $hardPctStr) }}
{{-   end }}
{{-   if gt $hardPct 100.0 }}
{{-     fail (printf "nodeGroup %s: evictionHardMemory percentage must be greater than 0 and at most 100, got %s%%" $groupName $hardPctStr) }}
{{-   end }}
{{-   if le $softPct 0.0 }}
{{-     fail (printf "nodeGroup %s: evictionSoftMemory percentage must be greater than 0 and at most 100, got %s%%" $groupName $softPctStr) }}
{{-   end }}
{{-   if gt $softPct 100.0 }}
{{-     fail (printf "nodeGroup %s: evictionSoftMemory percentage must be greater than 0 and at most 100, got %s%%" $groupName $softPctStr) }}
{{-   end }}
{{-   if ge $hardPct $softPct }}
{{-     fail (printf "nodeGroup %s: evictionHardMemory (%s) must be strictly less than evictionSoftMemory (%s)" $groupName $evictionHardMemory $evictionSoftMemory) }}
{{-   end }}
{{- else if and (not (hasSuffix "%" $evictionHardMemory)) (not (hasSuffix "%" $evictionSoftMemory)) }}
{{-   $hardBytes := include "cozy-lib.resources.toFloat" $evictionHardMemory | float64 }}
{{-   $softBytes := include "cozy-lib.resources.toFloat" $evictionSoftMemory | float64 }}
{{-   if ge $hardBytes $softBytes }}
{{-     fail (printf "nodeGroup %s: evictionHardMemory (%s) must be strictly less than evictionSoftMemory (%s)" $groupName $evictionHardMemory $evictionSoftMemory) }}
{{-   end }}
{{- else }}
{{-   fail (printf "nodeGroup %s: evictionHardMemory (%s) and evictionSoftMemory (%s) must use the same unit type (both percentage or both absolute)" $groupName $evictionHardMemory $evictionSoftMemory) }}
{{- end }}
{{/* Resolve eviction hard threshold to bytes for arithmetic.
     Percentage is relative to effective node memory; absolute values are used as-is. */}}
{{- $evictionHardBytes := 0.0 }}
{{- if $effectiveMemory }}
{{-   if hasSuffix "%" $evictionHardMemory }}
{{-     $evictionPct := trimSuffix "%" $evictionHardMemory | float64 }}
{{-     $evictionHardBytes = mulf (include "cozy-lib.resources.toFloat" $effectiveMemory | float64) (divf $evictionPct 100.0) }}
{{-   else }}
{{-     $evictionHardBytes = include "cozy-lib.resources.toFloat" $evictionHardMemory | float64 }}
{{-   end }}
{{- end }}
{{/* Validate that total reserved memory (system + kube + eviction) does not exceed effective node memory */}}
{{- if $effectiveMemory }}
{{-   $sysBytes := include "cozy-lib.resources.toFloat" $systemReservedMemory | float64 }}
{{-   $kubeBytes := include "cozy-lib.resources.toFloat" $kubeReservedMemory | float64 }}
{{-   $totalReservedBytes := addf (addf $sysBytes $kubeBytes) $evictionHardBytes }}
{{-   $effectiveMemBytes := include "cozy-lib.resources.toFloat" $effectiveMemory | float64 }}
{{-   if ge $totalReservedBytes $effectiveMemBytes }}
{{-     fail (printf "nodeGroup %s: total reserved memory (systemReservedMemory=%s + kubeReservedMemory=%s + evictionHardMemory=%s) must be less than effective node memory (%s)" $groupName $systemReservedMemory $kubeReservedMemory $evictionHardMemory $effectiveMemory) }}
{{-   end }}
{{- end }}
{{/* Validate that total reserved CPU does not exceed effective node CPU */}}
{{- if $effectiveCpu }}
{{-   $sysCpuMillis := include "kubernetes.cpuToMillicores" $systemReservedCpu | float64 }}
{{-   $kubeCpuMillis := include "kubernetes.cpuToMillicores" $kubeReservedCpu | float64 }}
{{-   $totalCpuMillis := addf $sysCpuMillis $kubeCpuMillis }}
{{-   $effectiveCpuMillicoresV := include "kubernetes.cpuToMillicores" $effectiveCpu | int }}
{{-   $effectiveCpuMillis := float64 $effectiveCpuMillicoresV }}
{{-   if ge $totalCpuMillis $effectiveCpuMillis }}
{{-     fail (printf "nodeGroup %s: total reserved CPU (systemReservedCpu=%s + kubeReservedCpu=%s) must be less than effective node CPU (%s cores)" $groupName $systemReservedCpu $kubeReservedCpu $effectiveCpu) }}
{{-   end }}
{{- end }}
{{/* Guard: explicit kubelet overrides require effective memory for validation */}}
{{- if not $effectiveMemory }}
{{-   $hasOverride := or $kubeletOverride.systemReservedMemory $kubeletOverride.kubeReservedMemory $kubeletOverride.evictionHardMemory $kubeletOverride.evictionSoftMemory }}
{{-   if $hasOverride }}
{{-     fail (printf "nodeGroup %s: kubelet memory reservations require effective memory to validate — set resources.memory or instanceType" $groupName) }}
{{-   end }}
{{- end }}
{{/* Guard: explicit kubelet CPU overrides require effective CPU for validation */}}
{{- if not $effectiveCpu }}
{{-   $hasCpuOverride := or $kubeletOverride.systemReservedCpu $kubeletOverride.kubeReservedCpu }}
{{-   if $hasCpuOverride }}
{{-     fail (printf "nodeGroup %s: cannot validate kubelet CPU reservations without effective CPU — set resources.cpu or a valid instanceType" $groupName) }}
{{-   end }}
{{- end }}
---
{{- /* TalosConfigTemplate is not rendered here — the chart cannot produce a
       valid Talos worker machineconfig at Helm template time because three of
       the inputs (apiserver Service ClusterIP, Talos CA, Kamaji-issued tenant
       CA) are created asynchronously. The main-phase Job in
       templates/talos-reconcile-job.yaml waits for those inputs and produces
       the TalosConfigTemplate with a KamajiControlPlane ownerReference for
       natural GC. The MachineDeployment below references the TCT name; CAPI's
       Machine controller blocks on its absence and unblocks the moment the Job
       applies it. */}}
---
{{- $context := deepCopy $ }}
{{- $_ := set $context "group" $group }}
{{- $_ := set $context "groupName" $groupName }}
{{- $_ := set $context "clusterName" $clusterName }}
{{- $kubevirtmachinetemplate := include "kubevirtmachinetemplate" $context }}
{{- $kubevirtmachinetemplateHash := $kubevirtmachinetemplate | sha256sum | trunc 6 }}
{{- $kubevirtmachinetemplateName := printf "%s-%s-%s" $clusterName $groupName $kubevirtmachinetemplateHash }}
{{- $kubevirtmachinetemplateNames = append $kubevirtmachinetemplateNames $kubevirtmachinetemplateName }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: {{ $clusterName }}-{{ $groupName }}-{{ $kubevirtmachinetemplateHash }}
  namespace: {{ $.Release.Namespace }}
spec:
  template:
    {{- $kubevirtmachinetemplate | nindent 4 }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: {{ $clusterName }}-{{ $groupName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "{{ $group.minReplicas }}"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "{{ $group.maxReplicas }}"
    cluster.x-k8s.io/autoscaling-options-maxnodeprovisiontime: {{ include "kubernetes.positiveDuration" (dict "field" "maxNodeProvisionTime" "value" $.Values.maxNodeProvisionTime) | quote }}
    {{- if $effectiveMemory }}
    {{-   $sysBytes := include "cozy-lib.resources.toFloat" $systemReservedMemory | float64 }}
    {{-   $kubeBytes := include "cozy-lib.resources.toFloat" $kubeReservedMemory | float64 }}
    {{-   $totalReservedBytes := addf (addf $sysBytes $kubeBytes) $evictionHardBytes }}
    {{-   $allocatableBytes := subf (include "cozy-lib.resources.toFloat" $effectiveMemory | float64) $totalReservedBytes }}
    {{-   $allocatableMi := divf $allocatableBytes 1048576.0 | floor }}
    capacity.cluster-autoscaler.kubernetes.io/memory: "{{ $allocatableMi }}Mi"
    {{- end }}
    {{- if $effectiveCpu }}
    {{-   $sysCpuMillisA := include "kubernetes.cpuToMillicores" $systemReservedCpu | float64 }}
    {{-   $kubeCpuMillisA := include "kubernetes.cpuToMillicores" $kubeReservedCpu | float64 }}
    {{-   $effectiveCpuMillicoresA := include "kubernetes.cpuToMillicores" $effectiveCpu | int }}
    {{-   $effectiveCpuMillisA := float64 $effectiveCpuMillicoresA }}
    {{-   $allocatableCpuMillis := subf $effectiveCpuMillisA (addf $sysCpuMillisA $kubeCpuMillisA) }}
    {{-   $allocatableCpuMillisInt := $allocatableCpuMillis | ceil | int }}
    capacity.cluster-autoscaler.kubernetes.io/cpu: "{{ $allocatableCpuMillisInt }}m"
    {{- end }}
spec:
  clusterName: {{ $clusterName }}
  # `spec.replicas` is intentionally omitted so the field is owned by
  # the cluster-autoscaler alone. Two independent CAPI mechanisms —
  # not Server-Side-Apply field managers — carry the guarantee:
  #   1. Create: the MachineDeployment defaulting webhook seeds
  #      `spec.replicas` from the `cluster-api-autoscaler-node-group-
  #      min-size` annotation (see
  #      https://cluster-api.sigs.k8s.io/tasks/automated-machine-management/autoscaling).
  #   2. Update: `calculateMachineDeploymentReplicas` preserves the
  #      existing live value (`oldMD.Spec.Replicas`) whenever the
  #      incoming spec has `replicas: nil`, clamping into
  #      `[min, max]` if it drifts outside — so a cluster the
  #      autoscaler holds above min-size is not drained by a
  #      `helm upgrade` that would otherwise re-render this field.
  # Flux helm-controller applies this chart through the Helm SDK
  # three-way merge (not SSA), so field-manager ownership is not the
  # mechanism at play. The chart guarantee reduces to "leave the
  # field out of the rendered manifest and let CAPI's update-time
  # defaulting keep the live value stable". Emitting a chart-managed
  # `replicas: N` here (as this chart did before
  # cozystack/cozystack#3231) drains workers on every `helm upgrade`
  # action until the autoscaler notices unschedulable Pods and
  # scales back up — a real disruption window on every routine
  # platform bump.
  strategy:
    rollingUpdate:
      maxSurge: {{ $group.maxReplicas }}
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $clusterName }}
      cluster.x-k8s.io/deployment-name: {{ $clusterName }}-{{ $groupName }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $clusterName }}
        cluster.x-k8s.io/deployment-name: {{ $clusterName }}-{{ $groupName }}
        {{- range $group.roles }}
        node-role.kubernetes.io/{{ . }}: ""
        {{- end }}
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: {{ $clusterName }}-{{ $groupName }}
          namespace: {{ $.Release.Namespace }}
      clusterName: {{ $clusterName }}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KubevirtMachineTemplate
        name: {{ $clusterName }}-{{ $groupName }}-{{ $kubevirtmachinetemplateHash }}
        namespace: {{ $.Release.Namespace }}
      version: {{ include "kubernetes.versionMap" $}}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: {{ $clusterName }}-{{ $groupName }}
  namespace: {{ $.Release.Namespace }}
spec:
  clusterName: {{ $clusterName }}
  {{- /* MHC spec.maxUnhealthy is an IntOrString. CAPI admission accepts a
         bare integer (0, 1, ...) or a percentage string ("0%", "50%"), but
         rejects a quoted plain integer ("0"). Quote only when the operator
         supplied a percentage; otherwise render the value as a bare int so
         the admission webhook is happy with the chart-default "0". */}}
  {{- $maxUnhealthy := toString $.Values.maxUnhealthy }}
  {{- $muSource := "maxUnhealthy" }}
  {{- if hasSuffix "%" $maxUnhealthy }}
  {{-   if not (regexMatch "^[0-9]+%$" $maxUnhealthy) }}
  {{-     fail (printf "%s must be a bare integer (e.g. 0, 1) or an integer percentage (e.g. 50%%), got %q" $muSource $maxUnhealthy) }}
  {{-   end }}
  maxUnhealthy: {{ $maxUnhealthy | quote }}
  {{- else if regexMatch "^[0-9]+$" $maxUnhealthy }}
  maxUnhealthy: {{ $maxUnhealthy | int }}
  {{- else }}
  {{-   fail (printf "%s must be a bare integer (e.g. 0, 1) or an integer percentage (e.g. 50%%), got %q" $muSource $maxUnhealthy) }}
  {{- end }}
  nodeStartupTimeout: {{ $.Values.nodeStartupTimeout }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $clusterName }}
      cluster.x-k8s.io/deployment-name: {{ $clusterName }}-{{ $groupName }}
  unhealthyConditions:
  - type: Ready
    status: Unknown
    timeout: {{ include "kubernetes.positiveDuration" (dict "field" "readyUnknownTimeout" "value" $.Values.readyUnknownTimeout) | quote }}
  - type: Ready
    status: "False"
    timeout: {{ include "kubernetes.positiveDuration" (dict "field" "readyFalseTimeout" "value" $.Values.readyFalseTimeout) | quote }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ $clusterName }}-{{ $groupName }}
  namespace: {{ $.Release.Namespace }}
spec:
  minReplicas: {{ $group.minReplicas }}
  kind: kubernetes
  type: worker
  selector:
    cluster.x-k8s.io/cluster-name: {{ $clusterName }}
    cluster.x-k8s.io/deployment-name: {{ $clusterName }}-{{ $groupName }}
    cluster.x-k8s.io/role: worker
  version: {{ $.Chart.Version }}
---
{{- /*
We must preserve all previous KubevirtMachineTemplates for THIS pool until a
MachineSet stops referencing them. Scoped by the meta.helm.sh/release-name
annotation to this pool's own release, so sibling kubernetes-nodes releases in
the same namespace never re-emit and fight over each other's templates. A bare
name prefix is unsafe here: pool "gpu" would match sibling "gpu-large"'s
hash-named KMTs; the release-name annotation is exact.
*/ -}}
{{- $mss := (lookup "cluster.x-k8s.io/v1beta1" "MachineSet" $.Release.Namespace "").items }}
{{- $oldKubevirtmachinetemplates := dict }}
{{- range $kmt := (lookup "infrastructure.cluster.x-k8s.io/v1alpha1" "KubevirtMachineTemplate" $.Release.Namespace "").items }}
{{- range $or := $kmt.metadata.ownerReferences }}
{{- if and (eq $or.kind "Cluster") (eq $or.name $clusterName) (eq (dig "annotations" "meta.helm.sh/release-name" "" $kmt.metadata) $.Release.Name) }}
{{- range $ms := $mss }}
{{- if and (eq $ms.spec.template.spec.infrastructureRef.kind "KubevirtMachineTemplate") (eq $ms.spec.template.spec.infrastructureRef.name $kmt.metadata.name) }}
{{- if not (has $kmt.metadata.name $kubevirtmachinetemplateNames) }}
{{- $oldKubevirtmachinetemplates = merge $oldKubevirtmachinetemplates (dict $kmt.metadata.name $kmt) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- range $oldKubevirtmachinetemplates }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: {{ .metadata.name }}
  namespace: {{ .metadata.namespace }}
spec:
  {{- .spec | toYaml | nindent 2 }}
{{- end }}
