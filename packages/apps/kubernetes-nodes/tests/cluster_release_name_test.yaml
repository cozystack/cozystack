suite: clusterReleaseName override wires the pool to a non-conventional parent

# The pool chart normally derives the parent cluster as kubernetes-<cluster>,
# the aggregated API's HelmRelease naming convention, and every rendered object
# (KMT/MD/MHC names, MachineDeployment spec.clusterName, the WorkloadMonitor
# selector) is keyed off it. A wrapper whose cluster release name is off that
# convention — the ComputePlane module fixes its cluster release to
# computeplane-cluster for the admin-kubeconfig Secret contract — cannot be
# reached by that derivation, so it sets clusterReleaseName explicitly. These
# cases pin both directions: the override retargets every reference, and the
# default (no override) stays byte-identical to what the API produces.
#
# instanceType is "" with explicit resources for the same reason as the snapshot
# suite: the instancetype-sized branch resolves via lookup, which returns nil
# under helm unittest.

templates:
  - templates/nodegroup.yaml

set:
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  minReplicas: 0
  maxReplicas: 3
  instanceType: ""
  diskSize: 20Gi
  storageClass: replicated
  roles:
    - ingress-nginx
  resources:
    cpu: "2"
    memory: 4Gi

tests:
  - it: retargets every object name and CAPI reference when clusterReleaseName is set
    release:
      name: kubernetes-nodes-computeplane-cluster-md0
      namespace: tenant-alice
    set:
      cluster: computeplane-cluster
      clusterReleaseName: computeplane-cluster
    asserts:
      # MachineDeployment: object name and the CAPI cluster it attaches to
      - equal:
          path: metadata.name
          value: computeplane-cluster-md0
        documentSelector:
          path: kind
          value: MachineDeployment
      - equal:
          path: spec.clusterName
          value: computeplane-cluster
        documentSelector:
          path: kind
          value: MachineDeployment
      # KubevirtMachineTemplate name is content-hash-suffixed; assert the prefix
      - matchRegex:
          path: metadata.name
          pattern: ^computeplane-cluster-md0-[0-9a-f]{6}$
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      # MachineHealthCheck object name
      - equal:
          path: metadata.name
          value: computeplane-cluster-md0
        documentSelector:
          path: kind
          value: MachineHealthCheck
      # No object retains the derived kubernetes-<cluster> name
      - notMatchRegex:
          path: metadata.name
          pattern: ^kubernetes-computeplane-cluster
        documentSelector:
          path: kind
          value: MachineDeployment

  - it: derives kubernetes-<cluster> when clusterReleaseName is unset (API path unchanged)
    release:
      name: kubernetes-nodes-myk8s-md0
      namespace: tenant-test
    set:
      cluster: myk8s
    asserts:
      - equal:
          path: metadata.name
          value: kubernetes-myk8s-md0
        documentSelector:
          path: kind
          value: MachineDeployment
      - equal:
          path: spec.clusterName
          value: kubernetes-myk8s
        documentSelector:
          path: kind
          value: MachineDeployment
