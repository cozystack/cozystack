suite: talos-reconcile Job memory floor

# The kubectl container of this Job runs `kubectl apply` against the MANAGEMENT
# cluster, not the tenant one, so it loads that apiserver's full discovery plus
# its aggregated OpenAPI document before it can compute a patch — several hundred
# CRDs on Cozystack. At 256Mi it was OOMKilled at exit 137 part-way through the
# script, after the KamajiControlPlane certSANs patch and before the
# TalosConfigTemplate apply, so machine-config changes never propagated. The
# failure was silent: restartPolicy OnFailure with backoffLimit 30 respawns the
# container while the Job-level status stays `active`, so the only symptom is a
# growing restart count. See cozystack/cozystack#3519.
#
# Pinned so a later edit cannot quietly lower it back under the floor. The
# request is pinned with it: raising the limit alone would be free in scheduling
# terms, and a future change that lifts the request to match would silently make
# every pool's Job harder to schedule.

templates:
  - templates/talos-reconcile-job.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  minReplicas: 0
  maxReplicas: 3
  instanceType: ""
  diskSize: 20Gi
  storageClass: replicated
  roles:
    - ingress-nginx
  resources:
    cpu: "2"
    memory: 4Gi

tests:
  - it: pins the kubectl container above the OOMKill floor
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 64Mi
        documentSelector:
          path: kind
          value: Job
