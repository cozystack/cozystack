suite: worker pool guest serial console logging

# A worker that stalls inside the guest before Talos apid answers leaves no
# trace anywhere the platform can reach: no Node, no certificate request, and
# talosctl itself needs the apid that never came up. The guest serial console
# is the only surface that shows that window, and KubeVirt exposes it only when
# the VMI asks for it: with logSerialConsole set, virt-launcher gains a
# guest-console-log container whose log is readable from the management cluster
# with no in-guest cooperation at all.
#
# The field must stay absent unless asked for. The KubevirtMachineTemplate is
# content-hash named, so a byte that appears unconditionally renames the
# template and rolls every live worker VM on upgrade; an explicit false must
# render the same nothing as an unset field for the same reason.

templates:
  - templates/nodegroup.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  minReplicas: 0
  maxReplicas: 3
  instanceType: ""
  diskSize: 20Gi
  storageClass: replicated
  roles:
    - ingress-nginx
  resources:
    cpu: "2"
    memory: 4Gi
tests:
  - it: omits the field by default so the template hash is unchanged
    documentSelector:
      path: kind
      value: KubevirtMachineTemplate
    asserts:
      - notExists:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.devices.logSerialConsole

  - it: omits the field when explicitly disabled
    set:
      logSerialConsole: false
    documentSelector:
      path: kind
      value: KubevirtMachineTemplate
    asserts:
      - notExists:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.devices.logSerialConsole

  - it: asks KubeVirt for the guest console log when enabled
    set:
      logSerialConsole: true
    documentSelector:
      path: kind
      value: KubevirtMachineTemplate
    asserts:
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.devices.logSerialConsole
          value: true
