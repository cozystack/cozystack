suite: per-pool Talos schematic tests

# Mirror of packages/apps/kubernetes/tests/schematic_per_nodegroup_test.yaml. Both
# charts render the worker boot disk image and the Talos installer image, so both
# need the override and both need it pinned; tests/render-parity.sh additionally
# compares the two charts' output against each other.
#
# A Talos schematic is a fixed set of system extensions baked into one image, and
# Talos refuses to finish booting when an extension service in it cannot start.
# `ext-nvidia-persistenced` and `ext-nvidia-cdi-gen` need an NVIDIA card, so a node
# with no GPU that boots the NVIDIA schematic fails `startAllServices` and reboots —
# observed in production as a ~70 minute cycle on every node of a non-GPU pool, in a
# cluster whose GPU pool had forced the cluster-wide `talos.schematicID` to an NVIDIA
# one. The nodes report `Ready` throughout, because kubelet starts before the failing
# phase, so nothing surfaces in `kubectl get nodes`.
#
# Assertions are scoped with `template:` because helm-unittest evaluates every
# assertion against every template in the suite, so a `kind`-based selector fails on
# whichever template does not contain that kind.

templates:
  - templates/nodegroup.yaml
  - templates/talos-reconcile-job.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  minReplicas: 0
  maxReplicas: 3
  instanceType: ""
  diskSize: 20Gi
  storageClass: replicated
  roles: []
  resources:
    cpu: "4"
    memory: 8Gi
  gpus: []

tests:
  - it: applies a per-pool schematic to both the boot image and the installer
    set:
      schematicID: "aaaabbbbccccddddeeeeffff0000111122223333444455556666777788889999"
    asserts:
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.dataVolumeTemplates[0].spec.source.http.url
          value: https://factory.talos.dev/image/aaaabbbbccccddddeeeeffff0000111122223333444455556666777788889999/v1.13.6/openstack-amd64.raw.xz
        template: templates/nodegroup.yaml
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      # The installer must match the boot image. A mismatch is worse than a wrong
      # value: the node boots one extension set and upgrades into another.
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'image: factory\.talos\.dev/installer/aaaabbbbccccddddeeeeffff0000111122223333444455556666777788889999:v1\.13\.6'
        template: templates/talos-reconcile-job.yaml
        documentSelector:
          path: kind
          value: Job

  - it: falls back to the cluster-wide schematic when the pool does not set one
    set:
      talos:
        schematicID: "1111111111111111111111111111111111111111111111111111111111111111"
    asserts:
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.dataVolumeTemplates[0].spec.source.http.url
          value: https://factory.talos.dev/image/1111111111111111111111111111111111111111111111111111111111111111/v1.13.6/openstack-amd64.raw.xz
        template: templates/nodegroup.yaml
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'image: factory\.talos\.dev/installer/1111111111111111111111111111111111111111111111111111111111111111:v1\.13\.6'
        template: templates/talos-reconcile-job.yaml
        documentSelector:
          path: kind
          value: Job

  - it: treats an empty per-pool schematic as unset
    set:
      talos:
        schematicID: "1111111111111111111111111111111111111111111111111111111111111111"
      schematicID: ""
    asserts:
      # An empty string inherits rather than rendering an image URL with an empty
      # schematic path segment, which would 404 at the factory and leave the VM
      # stuck importing forever. This is also the chart default, so it is the path
      # every existing pool takes.
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.dataVolumeTemplates[0].spec.source.http.url
          value: https://factory.talos.dev/image/1111111111111111111111111111111111111111111111111111111111111111/v1.13.6/openstack-amd64.raw.xz
        template: templates/nodegroup.yaml
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate

  # Same injection sink as kernelModules: schematicID is interpolated into
  # `install.image` inside the unquoted heredoc. Validating the effective value also
  # closes the pre-existing path through the cluster-wide talos.schematicID.
  - it: rejects a schematicID that could inject shell into the reconcile Job
    set:
      schematicID: "$(id)"
    asserts:
      # The guard lives in a shared helper reached from both this suite's templates,
      # and Helm aborts the whole render on the first one to hit it, so the assert
      # names the template that reports the failure rather than the only one able to.
      - failedTemplate:
          errorPattern: 'invalid schematicID'
        template: templates/talos-reconcile-job.yaml

  - it: rejects a schematicID that is not a 64-character hex digest
    set:
      schematicID: "not-a-schematic"
    asserts:
      - failedTemplate:
          errorPattern: 'must be a Talos image-factory schematic ID, 64 lowercase hex characters'
        template: templates/talos-reconcile-job.yaml
