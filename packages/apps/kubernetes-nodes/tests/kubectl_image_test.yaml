suite: kubectl image of the pool Jobs

# Both Jobs run in the management cluster under service accounts that read the
# pool's Talos secrets and patch its CAPI objects, so the image they run comes
# from images/kubectl.tag and nothing in the values can replace it.

templates:
  - templates/talos-reconcile-job.yaml
  - templates/pre-delete-unpin.yaml

release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test

set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  minReplicas: 0
  maxReplicas: 3
  instanceType: ""
  diskSize: 20Gi
  storageClass: replicated
  roles: []
  resources:
    cpu: "2"
    memory: 4Gi
  images:
    kubectl: registry.example.test/kubectl:6.6.6

tests:
  - it: keeps the bundled kubectl image in the talos-reconcile Job when values carry an image override
    template: templates/talos-reconcile-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^docker\.io/alpine/k8s:[^@]+@sha256:[0-9a-f]{64}$'

  - it: keeps the bundled kubectl image in the pre-delete unpin Job when values carry an image override
    template: templates/pre-delete-unpin.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^docker\.io/alpine/k8s:[^@]+@sha256:[0-9a-f]{64}$'

  - it: moves the talos-reconcile Job's kubectl image to the platform registry
    template: templates/talos-reconcile-job.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      _cluster:
        images-registry: registry.airgap.example.test
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^registry\.airgap\.example\.test/docker\.io/alpine/k8s:'

  - it: moves the pre-delete unpin Job's kubectl image to the platform registry
    template: templates/pre-delete-unpin.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      _cluster:
        images-registry: registry.airgap.example.test
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^registry\.airgap\.example\.test/docker\.io/alpine/k8s:'
