suite: TalosConfigTemplate replacement on an immutable spec
# The CRD marks spec immutable, so the Job's kubectl apply fails the moment any
# input the render depends on genuinely changes — the apiserver address being
# the one that moves in practice. What is pinned here is that the Job replaces
# it, that it only does so for that specific failure, and that it may delete
# nothing else.
templates:
  - templates/talos-reconcile-job.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
tests:
  - it: replaces the template when the apiserver reports it immutable
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'is immutable'
      # The target in full: a delete naming anything but this pool's own template
      # would take out a sibling pool's, and a prefix match would not see it.
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl delete talosconfigtemplate "\$\{RELEASE\}-\$\{GROUP_NAME\}" -n "\$NS"'

  # Deleting on an unrecognised error would turn an unrelated fault — an expired
  # token, a webhook outage — into worker churn, so the branch must re-raise.
  - it: still fails the Job on any other apply error
    documentSelector:
      path: kind
      value: Job
    asserts:
      # Anchored to the `*)` branch. A bare `exit 1` pattern passes on the one
      # the input-timeout path already has near the top of the script, so it
      # stays green with this branch's `exit 1` deleted.
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)\*\)\s*\n\s*echo "\$APPLY_OUT" >&2\s*\n\s*exit 1'

  - it: may delete only this pool's own template
    documentSelector:
      path: kind
      value: Role
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["bootstrap.cluster.x-k8s.io"]
            resources: ["talosconfigtemplates"]
            resourceNames: ["kubernetes-myk8s-md0"]
            verbs: ["delete"]

  # Several clusters can share a tenant namespace, so an unnamed get/patch/update
  # would let this Job rewrite a sibling pool's machineconfig. create cannot be
  # narrowed by RBAC and stays unnamed.
  - it: may read and write only this pool's own template
    documentSelector:
      path: kind
      value: Role
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["bootstrap.cluster.x-k8s.io"]
            resources: ["talosconfigtemplates"]
            resourceNames: ["kubernetes-myk8s-md0"]
            verbs: ["get", "patch", "update"]
      - notContains:
          path: rules
          content:
            apiGroups: ["bootstrap.cluster.x-k8s.io"]
            resources: ["talosconfigtemplates"]
            verbs: ["get", "create", "patch", "update"]
