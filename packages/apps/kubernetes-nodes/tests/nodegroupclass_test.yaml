suite: NodeGroupClass resolution
templates:
  - templates/nodegroup.yaml
  - templates/kairos-reconcile-job.yaml
  - templates/talos-reconcile-job.yaml
  - templates/image-factory-ca.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  instanceType: ""
  resources:
    cpu: "2"
    memory: 4Gi
tests:
  # The names below are the default Talos render. A pool without a class must
  # keep them, or every existing pool rolls on the upgrade that adds classes.
  - it: renders a pool without a class as the Talos pool it was
    template: templates/nodegroup.yaml
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef
          value:
            apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
            kind: TalosConfigTemplate
            name: kubernetes-myk8s-md0-ffdbe1
            namespace: tenant-test
      - equal:
          path: spec.template.spec.infrastructureRef.name
          value: kubernetes-myk8s-md0-2d362e
      - equal:
          path: spec.template.spec.version
          value: v1.35.6

  - it: renders an operator Talos class exactly as the built-in talos class
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: acme-talos
    kubernetesProvider:
      scheme: &scheme
        "cozystack.io/v1alpha1/NodeGroupClass":
          gvr: {group: "cozystack.io", version: "v1alpha1", resource: "nodegroupclasses"}
          namespaced: false
        "controlplane.cluster.x-k8s.io/v1alpha1/KamajiControlPlane":
          gvr: {group: "controlplane.cluster.x-k8s.io", version: "v1alpha1", resource: "kamajicontrolplanes"}
          namespaced: true
        "cluster.x-k8s.io/v1beta1/MachineDeployment":
          gvr: {group: "cluster.x-k8s.io", version: "v1beta1", resource: "machinedeployments"}
          namespaced: true
        "cluster.x-k8s.io/v1beta1/Cluster":
          gvr: {group: "cluster.x-k8s.io", version: "v1beta1", resource: "clusters"}
          namespaced: true
        "cluster.x-k8s.io/v1beta1/MachineSet":
          gvr: {group: "cluster.x-k8s.io", version: "v1beta1", resource: "machinesets"}
          namespaced: true
        "infrastructure.cluster.x-k8s.io/v1alpha1/KubevirtMachineTemplate":
          gvr: {group: "infrastructure.cluster.x-k8s.io", version: "v1alpha1", resource: "kubevirtmachinetemplates"}
          namespaced: true
      objects:
        - &acmeTalos
          kind: NodeGroupClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-talos
          spec:
            os: talos
        # The fake client lists only kinds it holds an object of, and the
        # chart lists MachineSets and machine templates on every render.
        - &schemeOnlyMs
          kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec:
            template:
              spec:
                infrastructureRef: {kind: KubevirtMachineTemplate, name: none}
        - &schemeOnlyKmt
          kind: KubevirtMachineTemplate
          apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.name
          value: kubernetes-myk8s-md0-ffdbe1
      - equal:
          path: spec.template.spec.infrastructureRef.name
          value: kubernetes-myk8s-md0-2d362e

  - it: resolves the built-in kairos class without reading any object
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.kind
          value: KairosConfigTemplate
      - equal:
          path: spec.template.spec.version
          value: v1.35.6

  - it: takes the Machine version from an operator Kairos class
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: acme-kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
        - &acmeKairos
          kind: NodeGroupClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-kairos
          spec:
            os: kairos
            image:
              kubernetesVersion: v1.35.2
              reference: registry.example.com:5000/kairos/worker:v1.35.2@sha256:1111111111111111111111111111111111111111111111111111111111111111
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.version
          value: v1.35.2

  - it: passes the class's Kubernetes version to kubeadm
    template: templates/kairos-reconcile-job.yaml
    set:
      nodeGroupClassName: acme-kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
        - *acmeKairos
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["spec.yaml"]
          pattern: 'kubernetesVersion: "v1\.35\.2"'
      - notMatchRegex:
          path: data["spec.yaml"]
          pattern: 'v1\.35\.6'

  - it: imports the class's disk, dropping the tag the CDI registry import refuses next to a digest
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: acme-kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
        - *acmeKairos
    documentSelector:
      path: kind
      value: KubevirtMachineTemplate
    asserts:
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.dataVolumeTemplates[0].spec.source.registry.url
          value: docker://registry.example.com:5000/kairos/worker@sha256:1111111111111111111111111111111111111111111111111111111111111111

  - it: keeps a tag-only class disk as given
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: acme-kairos-tag
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
        - kind: NodeGroupClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-kairos-tag
          spec:
            os: kairos
            image:
              kubernetesVersion: v1.35.2
              reference: registry.example.com:5000/kairos/worker:v1.35.2
    documentSelector:
      path: kind
      value: KubevirtMachineTemplate
    asserts:
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.dataVolumeTemplates[0].spec.source.registry.url
          value: docker://registry.example.com:5000/kairos/worker:v1.35.2

  - it: boots the platform disk and patch for an operator Kairos class without an image
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: acme-kairos-platform
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
        - kind: NodeGroupClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-kairos-platform
          spec:
            os: kairos
    asserts:
      - matchRegex:
          path: spec.template.spec.virtualMachineTemplate.spec.dataVolumeTemplates[0].spec.source.registry.url
          pattern: ^docker://[^ @]+/kairos-worker-v1\.35@sha256:[0-9a-f]{64}$
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      - equal:
          path: spec.template.spec.version
          value: v1.35.6
        documentSelector:
          path: kind
          value: MachineDeployment

  - it: refuses a pool on an operator class that is ahead of its control plane
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: acme-kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
        - kind: NodeGroupClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-kairos
          spec:
            os: kairos
            image:
              kubernetesVersion: v1.35.2
              reference: registry.example.com/kairos/worker:v1.35.2
        - kind: KamajiControlPlane
          apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
          metadata:
            name: kubernetes-myk8s
            namespace: tenant-test
          spec:
            version: v1.34.9
    asserts:
      - failedTemplate:
          errorPattern: 'is ahead of parent cluster'

  # A Kairos pool ignores talos.*: those fields carry non-empty defaults that
  # the API writes into every stored spec, so a value there cannot be told
  # from a default. The names pinned here are the render with default talos.*.
  - it: names the Kairos templates the same with default talos values
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: acme-kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
        - *acmeKairos
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.name
          value: kubernetes-myk8s-md0-kairos-bd33c8
      - equal:
          path: spec.template.spec.infrastructureRef.name
          value: kubernetes-myk8s-md0-5f0e21

  - it: does not let talos values change a Kairos pool's render
    template: templates/nodegroup.yaml
    set:
      nodeGroupClassName: acme-kairos
      talos:
        version: not-a-version
        schematicID: NOT_A_SCHEMATIC
        imageFactoryURL: not a url
        installerRepository: "bad repo"
        registryMirrors:
          docker.io:
            endpoints: ["https://mirror.example.com"]
        imageFactoryCA: not a certificate
    kubernetesProvider:
      scheme: *scheme
      objects:
        - *schemeOnlyMs
        - *schemeOnlyKmt
        - *acmeKairos
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.name
          value: kubernetes-myk8s-md0-kairos-bd33c8
      - equal:
          path: spec.template.spec.infrastructureRef.name
          value: kubernetes-myk8s-md0-5f0e21

  - it: renders no Image Factory CA for a Kairos pool
    template: templates/image-factory-ca.yaml
    set:
      nodeGroupClassName: kairos
      talos:
        imageFactoryCA: not a certificate
    asserts:
      - hasDocuments:
          count: 0
