suite: talos-reconcile Job TalosConfigTemplate name

# TalosConfigTemplate.spec is immutable (webhook
# vtalosconfigtemplate.cluster.x-k8s.io), so the object can only ever be created,
# never updated: applied under a fixed name it freezes this pool's worker machine
# config at first creation and every later change is rejected server-side
# (cozystack/cozystack#3515). The name therefore carries a content hash of the
# rendered spec.
#
# The literal below must stay identical to the MachineDeployment
# bootstrap.configRef assertion in nodegroup_test.yaml — helm-unittest cannot
# compare two templates in one assertion, and a divergence leaves CAPI blocked on
# "templates do not exist" with no worker ever created.

templates:
  - templates/talos-reconcile-job.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  minReplicas: 0
  maxReplicas: 3
  instanceType: ""
  diskSize: 20Gi
  storageClass: replicated
  roles:
    - ingress-nginx
  resources:
    cpu: "2"
    memory: 4Gi
  gpus: []
  kubelet: {}

tests:
  - it: applies the TalosConfigTemplate under that same hashed name
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="TCT_NAME")].value
          value: kubernetes-myk8s-md0-ffdbe1
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'name: \$\{TCT_NAME\}'
