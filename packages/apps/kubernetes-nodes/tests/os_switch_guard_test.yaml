suite: os switch guard (assertOsMatches)

# Moving a running pool between a Talos and a Kairos NodeGroupClass would roll
# every worker onto the other OS, so the chart refuses it against the live
# MachineDeployment, in both directions and for operator classes as well as
# the built-in ones. Offline the check is inert.
templates:
  - templates/nodegroup.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  minReplicas: 0
  maxReplicas: 3
  instanceType: ""
  diskSize: 20Gi
  storageClass: replicated
  resources:
    cpu: "2"
    memory: 4Gi
tests:
  - it: refuses to turn a running Talos pool into a Kairos one
    set:
      nodeGroupClassName: kairos
    kubernetesProvider:
      scheme: &scheme
        "cluster.x-k8s.io/v1beta1/MachineDeployment":
          gvr: {group: "cluster.x-k8s.io", version: "v1beta1", resource: "machinedeployments"}
          namespaced: true
        "cluster.x-k8s.io/v1beta1/Cluster":
          gvr: {group: "cluster.x-k8s.io", version: "v1beta1", resource: "clusters"}
          namespaced: true
        "cluster.x-k8s.io/v1beta1/MachineSet":
          gvr: {group: "cluster.x-k8s.io", version: "v1beta1", resource: "machinesets"}
          namespaced: true
        "infrastructure.cluster.x-k8s.io/v1alpha1/KubevirtMachineTemplate":
          gvr: {group: "infrastructure.cluster.x-k8s.io", version: "v1alpha1", resource: "kubevirtmachinetemplates"}
          namespaced: true
        "cozystack.io/v1alpha1/NodeGroupClass":
          gvr: {group: "cozystack.io", version: "v1alpha1", resource: "nodegroupclasses"}
          namespaced: false
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: TalosConfigTemplate
    asserts:
      - failedTemplate:
          errorPattern: 'pool "md0" already runs workers bootstrapped by a TalosConfigTemplate, and NodeGroupClass "kairos" selects kairos workers'

  - it: refuses to turn a running Kairos pool into a Talos one
    set:
      nodeGroupClassName: talos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: KairosConfigTemplate
    asserts:
      - failedTemplate:
          errorPattern: 'pool "md0" already runs workers bootstrapped by a KairosConfigTemplate, and NodeGroupClass "talos" selects talos workers'

  - it: renders a running Kairos pool that stays on Kairos
    set:
      nodeGroupClassName: kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: KairosConfigTemplate
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec:
            template:
              spec:
                infrastructureRef: {kind: KubevirtMachineTemplate, name: none}
        - kind: KubevirtMachineTemplate
          apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
        - kind: Cluster
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.kind
          value: KairosConfigTemplate

  - it: moves a pool still on the kubeadm bootstrap onto Talos, as the Talos worker migration expects
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: KubeadmConfigTemplate
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec:
            template:
              spec:
                infrastructureRef: {kind: KubevirtMachineTemplate, name: none}
        - kind: KubevirtMachineTemplate
          apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
        - kind: Cluster
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.kind
          value: TalosConfigTemplate

  - it: renders a running Talos pool that stays on Talos
    set:
      nodeGroupClassName: talos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: TalosConfigTemplate
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec:
            template:
              spec:
                infrastructureRef: {kind: KubevirtMachineTemplate, name: none}
        - kind: KubevirtMachineTemplate
          apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
        - kind: Cluster
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.kind
          value: TalosConfigTemplate

  - it: moves a pool still on the kubeadm bootstrap onto Kairos when it asks for Kairos
    set:
      nodeGroupClassName: kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: KubeadmConfigTemplate
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec:
            template:
              spec:
                infrastructureRef: {kind: KubevirtMachineTemplate, name: none}
        - kind: KubevirtMachineTemplate
          apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
        - kind: Cluster
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.kind
          value: KairosConfigTemplate

  - it: refuses to move a running Talos pool onto an operator Kairos class
    set:
      nodeGroupClassName: acme-kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: TalosConfigTemplate
        - &acmeKairos
          kind: NodeGroupClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-kairos
          spec:
            os: kairos
            image:
              kubernetesVersion: v1.35.2
              reference: registry.example.com/kairos/worker:v1.35.2@sha256:2222222222222222222222222222222222222222222222222222222222222222
    asserts:
      - failedTemplate:
          errorPattern: 'already runs workers bootstrapped by a TalosConfigTemplate, and NodeGroupClass "acme-kairos" selects kairos workers'

  - it: refuses to move a running Kairos pool onto an operator Talos class
    set:
      nodeGroupClassName: acme-talos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: KairosConfigTemplate
        - kind: NodeGroupClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-talos
          spec:
            os: talos
    asserts:
      - failedTemplate:
          errorPattern: 'already runs workers bootstrapped by a KairosConfigTemplate, and NodeGroupClass "acme-talos" selects talos workers'

  - it: moves a running Kairos pool between two Kairos classes
    set:
      nodeGroupClassName: acme-kairos
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
          spec:
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: KairosConfigTemplate
        - *acmeKairos
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec:
            template:
              spec:
                infrastructureRef: {kind: KubevirtMachineTemplate, name: none}
        - kind: KubevirtMachineTemplate
          apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
        - kind: Cluster
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: scheme-registration-only, namespace: scheme-registration-only}
          spec: {}
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.kind
          value: KairosConfigTemplate
      - equal:
          path: spec.template.spec.version
          value: v1.35.2
