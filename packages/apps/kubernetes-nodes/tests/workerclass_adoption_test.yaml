---
suite: adopting a class cannot reimage a legacy pool
templates: [templates/nodegroup.yaml]
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  version: v1.35
  instanceType: ""
  resources: {cpu: "2", memory: 4Gi}
  workerClassName: talos
  _cluster: {cluster-domain: cozy.local}
tests:
  - it: preserves the existing infrastructure and bootstrap references
    kubernetesProvider: &provider
      scheme: &scheme
        cluster.x-k8s.io/v1beta1/MachineDeployment:
          gvr:
            group: cluster.x-k8s.io
            version: v1beta1
            resource: machinedeployments
          namespaced: true
        cluster.x-k8s.io/v1beta1/MachineSet:
          gvr:
            group: cluster.x-k8s.io
            version: v1beta1
            resource: machinesets
          namespaced: true
        infrastructure.cluster.x-k8s.io/v1alpha1/KubevirtMachineTemplate:
          gvr:
            group: infrastructure.cluster.x-k8s.io
            version: v1alpha1
            resource: kubevirtmachinetemplates
          namespaced: true
      objects:
        - apiVersion: cluster.x-k8s.io/v1beta1
          kind: MachineDeployment
          metadata: {name: kubernetes-myk8s-md0, namespace: tenant-test}
          spec:
            clusterName: kubernetes-myk8s
            template:
              spec:
                bootstrap:
                  configRef:
                    kind: TalosConfigTemplate
                    name: kubernetes-myk8s-md0-a9467e
                infrastructureRef:
                  kind: KubevirtMachineTemplate
                  name: kubernetes-myk8s-md0-9375f9
        - apiVersion: cluster.x-k8s.io/v1beta1
          kind: MachineSet
          metadata: {name: scheme-only, namespace: scheme-only}
          spec: {}
        - apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          kind: KubevirtMachineTemplate
          metadata: {name: scheme-only, namespace: scheme-only}
          spec: {}
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: metadata.annotations["workerclasses.cozystack.io/class"]
          value: talos
      - equal:
          path: spec.template.spec.bootstrap.configRef.name
          value: kubernetes-myk8s-md0-a9467e
  - it: preserves identities when a factory pin overrides an unused fallback
    kubernetesProvider: *provider
    set:
      talos.version: v1.13.5
      osImage.factory.version: v1.13.12
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: spec.template.spec.bootstrap.configRef.name
          value: kubernetes-myk8s-md0-a9467e
      - equal:
          path: spec.template.spec.infrastructureRef.name
          value: kubernetes-myk8s-md0-9375f9
      - equal:
          path: spec.template.spec.version
          value: v1.35.6
  - it: refuses adoption whose effective image changes
    kubernetesProvider: *provider
    set:
      talos.version: v1.13.7
    asserts:
      - failedTemplate:
          errorPattern: 'adopting WorkerClass.*changes the legacy pool.*adopt the class in an update that changes nothing else'
  - it: refuses adoption that changes only the bootstrap configuration
    kubernetesProvider: *provider
    set:
      talos.registryMirrors:
        ghcr.io:
          endpoints: ["https://mirror.example.com"]
    asserts:
      - failedTemplate:
          errorPattern: 'adopting WorkerClass.*changes the legacy pool'
  - it: refuses adoption that changes only the machine template
    kubernetesProvider: *provider
    set:
      diskSize: 50Gi
    asserts:
      - failedTemplate:
          errorPattern: 'adopting WorkerClass.*changes the legacy pool'
  - it: tells a pool still on the kubeadm bootstrap to finish its Talos migration before adopting a class
    kubernetesProvider:
      scheme: *scheme
      objects:
        - apiVersion: cluster.x-k8s.io/v1beta1
          kind: MachineDeployment
          metadata: {name: kubernetes-myk8s-md0, namespace: tenant-test}
          spec:
            template:
              spec:
                bootstrap:
                  configRef: {kind: KubeadmConfigTemplate, name: kubernetes-myk8s-md0-kubeadm}
                infrastructureRef: {kind: KubevirtMachineTemplate, name: kubernetes-myk8s-md0-old}
        - apiVersion: cluster.x-k8s.io/v1beta1
          kind: MachineSet
          metadata: {name: scheme-only, namespace: scheme-only}
          spec: {}
        - apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          kind: KubevirtMachineTemplate
          metadata: {name: scheme-only, namespace: scheme-only}
          spec: {}
    asserts:
      - failedTemplate:
          errorPattern: 'pool "md0" still runs workers bootstrapped by a KubeadmConfigTemplate; finish its move to Talos before adopting WorkerClass "talos"'
