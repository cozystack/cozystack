suite: WorkerClass resolution failures
# Only nodegroup.yaml: every template that resolves the class does it through
# the same helper, and the render stops at whichever fails first.
templates:
  - templates/nodegroup.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  instanceType: ""
  resources:
    cpu: "2"
    memory: 4Gi
tests:
  - it: fails the render naming a class that does not exist
    set:
      workerClassName: acme-missing
    kubernetesProvider:
      scheme: &scheme
        "cozystack.io/v1alpha1/WorkerClass":
          gvr: {group: "cozystack.io", version: "v1alpha1", resource: "workerclasses"}
          namespaced: false
      objects: []
    asserts:
      - failedTemplate:
          errorPattern: 'workerClassName "acme-missing": no WorkerClass of that name exists'

  - it: refuses a class whose Kubernetes minor differs from the pool's version
    set:
      workerClassName: acme-kairos
      version: "v1.34"
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: WorkerClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-kairos
          spec:
            bootstrap: kairos
            image:
              kubernetesVersion: v1.35.2
              reference: registry.example.com/kairos/worker:v1.35.2@sha256:2222222222222222222222222222222222222222222222222222222222222222
    asserts:
      - failedTemplate:
          errorPattern: 'WorkerClass "acme-kairos" carries Kubernetes v1\.35\.2, whose minor differs from the pool''s version v1\.34'


  - it: refuses a class whose bootstrap the chart does not support
    set:
      workerClassName: acme-flatcar
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: WorkerClass
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: acme-flatcar
          spec:
            bootstrap: flatcar
    asserts:
      - failedTemplate:
          errorPattern: 'WorkerClass "acme-flatcar" has bootstrap "flatcar"; this chart supports talos and kairos'
