{{- /*
Cloud-init network-data for netplan guests.

Two defaults leave a netplan guest worse off than the DHCP already on the wire.
virt-launcher runs a DHCP server on every bridge-bound interface, secondary
ones included (kubevirt pkg/network/setup/launcher/configurator.go gates only on
iface.Bridge), yet cloud-init's fallback configuration covers a single
interface, so a VM joined to a VPC subnet never asks for the address reserved
for it. That server also advertises the launcher pod's search domains as option
119, while systemd-networkd defaults UseDomains= to no (systemd.network(5)), so
the guest discards them and a cluster domain under .local falls through to the
mDNS exclusion in resolved and answers REFUSED.

Matching en* and eth* rather than naming interfaces keeps this correct whatever
the guest calls its NICs, and is the shape Debian's own cloud images ship.
networkDataSecretRef replaces the fallback configuration instead of adding to
it, so every interface has to be described here, not just the secondary ones.
*/}}
{{- if include "virtual-machine.netplanGuest" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "virtual-machine.fullname" . }}-network-config
  labels:
    {{- include "virtual-machine.labels" . | nindent 4 }}
stringData:
  networkdata: |
    network:
      version: 2
      ethernets:
        cozy-en:
          match:
            name: "en*"
          dhcp4: true
          dhcp4-overrides:
            use-domains: true
        cozy-eth:
          match:
            name: "eth*"
          dhcp4: true
          dhcp4-overrides:
            use-domains: true
{{- end }}
