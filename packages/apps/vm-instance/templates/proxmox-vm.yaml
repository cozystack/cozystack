{{- if eq (include "virtual-machine.substrate" .) "proxmox" }}
{{- $catalog := include "virtual-machine.proxmoxCatalog" . | fromJson }}
{{- $name := include "virtual-machine.fullname" . }}
{{- /* Any values that work on kubevirt work here: what has no 1:1 on Proxmox
       maps to the nearest thing and says so in NOTES.txt, never silently. */}}
{{- /* subnets is the deprecated spelling of networks, as on kubevirt. */}}
{{- $networks := concat (.Values.networks | default list) (.Values.subnets | default list) }}
{{- if not $networks }}
{{- /* A kubevirt machine without networks sits in the pod network; the
       platform names the tenant network that stands in for it. */}}
{{-   if not $catalog.defaultNetwork }}
{{-     fail "networks is empty and the platform's Proxmox catalog has no defaultNetwork: a machine without networks gets the pod network on kubevirt, and the platform has to name the network that stands in for it here (catalog.defaultNetwork in the proxmox-vm package)" }}
{{-   end }}
{{-   $networks = list (dict "name" $catalog.defaultNetwork) }}
{{- end }}
{{- $runStrategy := .Values.runStrategy | default "Always" }}
{{- /* kubemox has one power switch plus startOnce. RerunOnFailure starts
       the machine like Always (no restart on a guest crash without PVE HA,
       which NOTES.txt says); Once starts it a single time. */}}
{{- $autoStart := has $runStrategy (list "Always" "RerunOnFailure" "Once") }}
{{- $profile := include "virtual-machine.proxmoxProfile" (list $catalog .) | fromJson }}
{{- $gpus := include "virtual-machine.proxmoxGPUs" (list $catalog .) | fromJsonArray }}
{{- $disks := include "virtual-machine.proxmoxDisks" . | fromJson }}
{{- $node := .Values.proxmox.node | default $disks.node | default $catalog.defaultNode }}
{{- if not $node }}
{{-   fail "the machine has no node: the platform's Proxmox catalog has no defaultNode, and neither a disk nor proxmox.node names one" }}
{{- end }}
{{- $sizing := include "virtual-machine.proxmoxSizing" (list $catalog . $node) | fromJson }}
{{- if and $disks.node (ne $node $disks.node) }}
{{-   fail (printf "proxmox.node %q differs from the node of the machine's disks (%q); a machine can only attach disks of its own node" $node $disks.node) }}
{{- end }}
{{- /* Firmware: the user's choice first, the profile's default otherwise. */}}
{{- $fw := .Values.firmware | default dict }}
{{- $bios := $profile.bios | default "seabios" }}
{{- if eq (toString $fw.bootloader) "uefi" }}{{ $bios = "ovmf" }}{{ else if eq (toString $fw.bootloader) "bios" }}{{ $bios = "seabios" }}{{ end }}
{{- $firstDisk := first $disks.disks }}
{{- /* EFI vars and the TPM state live next to the first disk; a machine
       without disks (ISO or PXE boot) takes the storage behind the default
       disk class instead, the same place vm-disk would have put one. */}}
{{- $sysStorage := "" }}
{{- if $firstDisk }}
{{-   $sysStorage = dig "spec" "storage" "" (lookup "proxmox.alperen.cloud/v1alpha1" "VirtualMachineVolume" .Release.Namespace $firstDisk.volume) }}
{{- else }}
{{-   $sysStorage = dig "storageClasses" "replicated" "storage" "" $catalog }}
{{- end }}
{{- if and (or (eq $bios "ovmf") $profile.tpm) (not $sysStorage) }}
{{-   fail "a UEFI or TPM machine without disks needs the platform's catalog to map the storage class \"replicated\" (storageClasses.replicated in the proxmox-vm package), where its EFI vars and TPM state are created" }}
{{- end }}
{{- $secureBoot := $fw.secureBoot | default ($profile.efiPreEnrolledKeys | default false) }}
{{- $catalogNetworks := $catalog.networks | default dict }}
{{- $ports := list }}
{{- range $i, $net := $networks }}
{{-   $entry := index $catalogNetworks (toString $net.name) }}
{{-   if not $entry }}
{{-     fail (printf "network %q is not one of the platform's Proxmox networks (known: %s)" (toString $net.name) (join ", " (keys $catalogNetworks | sortAlpha))) }}
{{-   end }}
{{-   if not $entry.ipPool }}
{{-     fail (printf "network %q has no ipPool in the platform's catalog; every port on this substrate gets a static address from a pool" (toString $net.name)) }}
{{-   end }}
{{-   $ports = append $ports (dict "index" $i "name" (toString $net.name) "bridge" $entry.bridge "vlan" ($entry.vlan | default 0) "ipPool" $entry.ipPool "claim" (printf "%s-net%d" $name $i)) }}
{{- end }}
{{- $hasCloudInit := or .Values.cloudInit .Values.sshKeys }}
{{- range $ports }}
---
# One claim per port; the IPAM provider binds it to an address of the pool
# the platform mapped the network to, and kubemox writes it into the port.
apiVersion: ipam.cluster.x-k8s.io/v1beta1
kind: IPAddressClaim
metadata:
  name: {{ .claim }}
  labels:
    {{- include "virtual-machine.labels" $ | nindent 4 }}
spec:
  poolRef:
    apiGroup: ipam.cluster.x-k8s.io
    kind: InClusterIPPool
    name: {{ .ipPool | quote }}
{{- end }}
{{- if $hasCloudInit }}
---
# The NoCloud datasource: cloudInit as given, with sshKeys appended as
# ssh_authorized_keys for the image's default user, the way the kubevirt
# substrate injects them into the cloud-init disk.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-nocloud
  labels:
    {{- include "virtual-machine.labels" . | nindent 4 }}
stringData:
  user-data: |
    {{- if .Values.cloudInit }}
    {{- .Values.cloudInit | nindent 4 }}
    {{- else }}
    #cloud-config
    {{- end }}
    {{- if .Values.sshKeys }}
    ssh_authorized_keys:
      {{- range .Values.sshKeys }}
      - {{ quote . }}
      {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: proxmox.alperen.cloud/v1alpha1
kind: VirtualMachine
metadata:
  name: {{ $name }}
  labels:
    {{- include "virtual-machine.labels" . | nindent 4 }}
  {{- if .Values.external }}
  # The Service in service.yaml has no pods to select on this substrate;
  # kubemox keeps an EndpointSlice with the machine's addresses for it.
  annotations:
    networking.cozystack.io/service: {{ $name | quote }}
  {{- end }}
spec:
  name: {{ $name }}
  nodeName: {{ $node | quote }}
  connectionRef:
    name: {{ required "the platform's Proxmox catalog has no connection" $catalog.connection | quote }}
  deletionProtection: false
  {{- /* Off, kubemox leaves a new machine stopped and never starts one, but
         it does not stop a running machine either: the stop subresource does
         that, so setting Halted here does not. */}}
  enableAutoStart: {{ $autoStart }}
  {{- if eq $runStrategy "Once" }}
  startOnce: true
  {{- end }}
  tags:
    - cozystack
    - {{ .Release.Namespace }}
  vmSpec:
    cores: {{ $sizing.cores }}
    socket: {{ $sizing.sockets }}
    memory: {{ $sizing.memoryMiB }}
    guestAgent: true
    smbiosUUID: {{ include "virtual-machine.proxmoxStableUuid" . | quote }}
    firmware:
      bios: {{ $bios }}
      machine: {{ $profile.machine | default "q35" }}
      scsiController: {{ $profile.scsiController | default "virtio-scsi-single" }}
      {{- if eq $bios "ovmf" }}
      efiDisk:
        storage: {{ $sysStorage | quote }}
        preEnrolledKeys: {{ $secureBoot }}
      {{- end }}
      {{- if $profile.tpm }}
      tpm:
        storage: {{ $sysStorage | quote }}
        version: v2.0
      {{- end }}
    {{- with $disks.disks }}
    disk:
      {{- range . }}
      - device: {{ .device }}
        volumeRef:
          name: {{ .volume }}
      {{- end }}
    {{- end }}
    network:
      {{- range $ports }}
      - model: virtio
        bridge: {{ .bridge | quote }}
        {{- if .vlan }}
        vlan: {{ .vlan }}
        {{- end }}
        ipAddressClaimRef:
          name: {{ .claim }}
      {{- end }}
    {{- with $gpus }}
    # PCI passthrough by cluster mapping (hostpciN: mapping=<name>); the
    # mapping itself, and the token's Mapping.Use on it, are the platform's.
    pciDevices:
      {{- range . }}
      - type: mapped
        deviceID: {{ .mapping | quote }}
        primaryGPU: {{ .primaryGPU }}
      {{- end }}
    {{- end }}
    {{- if $hasCloudInit }}
    cloudInit:
      secretRef:
        name: {{ $name }}-nocloud
      {{- with $catalog.dnsServers }}
      nameservers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- $extra := $sizing.extra | default dict }}
  {{- $profileExtra := dict }}
  {{- if $profile.ostype }}{{ $_ := set $profileExtra "ostype" $profile.ostype }}{{ end }}
  {{- /* A serial port on a socket is what the dashboard's serial console
         attaches to through the platform's console proxy (termproxy), as it
         attaches to the KubeVirt serial console; cloud images log in on it. */}}
  {{- $_ := set $profileExtra "serial0" "socket" }}
  {{- $additional := merge $profileExtra $extra }}
  {{- with $additional }}
  # qm options the API has no field for: the OS type of the profile, the
  # serial console, the CPU model (cpuModel, or the instance type's), NUMA,
  # hugepages, balloon, and the affinity of a realtime type.
  additionalConfig:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | toString | quote }}
    {{- end }}
  {{- end }}
{{- end }}
