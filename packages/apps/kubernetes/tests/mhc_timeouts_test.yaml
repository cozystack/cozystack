suite: MachineHealthCheck timeouts

# Each entry pairs a Node condition with the time that condition may hold
# before the Machine is remediated, and the two entries are not
# interchangeable: `Ready=Unknown` is a worker that stopped answering, and
# `Ready=False` is a worker that answered and said it is not ready. Asserting
# the whole entry rather than an indexed timeout is what makes a swapped pair
# fail here instead of on a live cluster.
#
# Both timeouts pass through the same render guard as maxNodeProvisionTime,
# and they need it for a different reason than the annotation does: the CAPI
# webhook validates nodeStartupTimeout but not unhealthyConditions timeouts, so
# a zero or negative timeout applies silently and remediates a Machine the
# moment its condition flips. The reject cases pin the guard on each field by
# its own name, so wiring one field through the other's check fails here.
#
# `nodeStartupTimeout` bounds the phase before any of that: it is the window a
# Machine has to produce a Node at all, and the unhealthyConditions entries are
# evaluated only once one exists. Its default is pinned here because the parity
# gate compares this chart against its counterpart, so a default moved in both
# at once passes there and only fails on this assertion.

templates:
  - templates/cluster.yaml

values:
  - values/common.yaml

release:
  name: test-k8s
  namespace: tenant-test

tests:
  - it: renders both chart-default condition timeouts
    documentSelector:
      path: kind
      value: MachineHealthCheck
    asserts:
      - contains:
          path: spec.unhealthyConditions
          content:
            type: Ready
            status: Unknown
            timeout: "5m"
      - contains:
          path: spec.unhealthyConditions
          content:
            type: Ready
            status: "False"
            timeout: "10m"
      - lengthEqual:
          path: spec.unhealthyConditions
          count: 2

  - it: passes configured condition timeouts through verbatim
    set:
      nodeHealthCheck:
        maxUnhealthy: "50%"
        nodeStartupTimeout: "20m"
        readyUnknownTimeout: "90s"
        readyFalseTimeout: "25m"
    documentSelector:
      path: kind
      value: MachineHealthCheck
    asserts:
      - contains:
          path: spec.unhealthyConditions
          content:
            type: Ready
            status: Unknown
            timeout: "90s"
      - contains:
          path: spec.unhealthyConditions
          content:
            type: Ready
            status: "False"
            timeout: "25m"

  - it: renders the chart-default nodeStartupTimeout
    documentSelector:
      path: kind
      value: MachineHealthCheck
    asserts:
      - equal:
          path: spec.nodeStartupTimeout
          value: "20m"

  - it: accepts the canonical Go rendering of a condition timeout
    set:
      nodeHealthCheck:
        readyUnknownTimeout: "20m0s"
        readyFalseTimeout: "1h0m0s"
    documentSelector:
      path: kind
      value: MachineHealthCheck
    asserts:
      - contains:
          path: spec.unhealthyConditions
          content:
            type: Ready
            status: Unknown
            timeout: "20m0s"
      - contains:
          path: spec.unhealthyConditions
          content:
            type: Ready
            status: "False"
            timeout: "1h0m0s"

  - it: rejects a condition timeout carrying no unit
    set:
      nodeHealthCheck:
        readyUnknownTimeout: "90"
    asserts:
      - failedTemplate:
          errorMessage: 'nodeHealthCheck.readyUnknownTimeout must be a whole number of s, m or h (e.g. 30m, 1h30m), got "90"'

  - it: rejects a zero condition timeout, which would remediate instantly
    set:
      nodeHealthCheck:
        readyFalseTimeout: "0s"
    asserts:
      - failedTemplate:
          errorMessage: 'nodeHealthCheck.readyFalseTimeout must be a whole number of s, m or h (e.g. 30m, 1h30m), got "0s"'

  - it: rejects a negative condition timeout, which would remediate instantly
    set:
      nodeHealthCheck:
        readyUnknownTimeout: "-5m"
    asserts:
      - failedTemplate:
          errorMessage: 'nodeHealthCheck.readyUnknownTimeout must be a whole number of s, m or h (e.g. 30m, 1h30m), got "-5m"'
