suite: worker pod CPU limit

# `podCpuLimit` is the only knob that sets `domain.resources.limits.cpu` on a
# worker VM. KubeVirt otherwise derives that limit from the guest vCPU count
# whenever the namespace carries a ResourceQuota that limits CPU, and it stops
# deriving as soon as the VMI declares the limit itself, so the value rendered
# here is what the compute container gets. It is not only the ceiling that
# moves: KubeVirt copies a declared CPU limit into an undeclared CPU request,
# so a group that sets this field alone requests its whole ceiling.

templates:
  - templates/cluster.yaml

kubernetesProvider:
  scheme:
    "instancetype.kubevirt.io/v1beta1/VirtualMachineClusterInstancetype":
      gvr:
        group: instancetype.kubevirt.io
        version: v1beta1
        resource: virtualmachineclusterinstancetypes
      namespaced: false
    "cluster.x-k8s.io/v1beta1/MachineSet":
      gvr:
        group: cluster.x-k8s.io
        version: v1beta1
        resource: machinesets
      namespaced: true
    "infrastructure.cluster.x-k8s.io/v1alpha1/KubevirtMachineTemplate":
      gvr:
        group: infrastructure.cluster.x-k8s.io
        version: v1alpha1
        resource: kubevirtmachinetemplates
      namespaced: true
  objects:
    - kind: VirtualMachineClusterInstancetype
      apiVersion: instancetype.kubevirt.io/v1beta1
      metadata:
        name: u1.medium
    - kind: MachineSet
      apiVersion: cluster.x-k8s.io/v1beta1
      metadata:
        name: ignored-ms
        namespace: tenant-test
      spec:
        template:
          spec:
            infrastructureRef:
              kind: Other
              name: ignored
    - kind: KubevirtMachineTemplate
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      metadata:
        name: ignored-kmt
        namespace: tenant-test

tests:
  - it: renders the CPU limit a node group asks for onto the worker VM
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      _namespace:
        etcd: etcd
        ingress: nginx
        host: example.com
      _cluster:
        cluster-domain: cozy.local
      nodeGroups:
        worker0:
          minReplicas: 1
          maxReplicas: 3
          instanceType: "u1.medium"
          diskSize: 20Gi
          roles:
          - worker
          resources:
            cpu: 2
            memory: 4Gi
          podCpuLimit: 3
    asserts:
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.resources.limits.cpu
          value: "3"
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      # This field renders one key. What the container ends up requesting is
      # then KubeVirt's copy of the limit rather than anything the chart wrote,
      # which is why moving the request needs a field of its own.
      - notExists:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.resources.requests.cpu
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      # The ephemeral-storage pair the block carried before this field existed
      # survives on both sides, request still divided by the cluster
      # ephemeral-storage allocation ratio.
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.resources.limits.ephemeral-storage
          value: "2Gi"
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.resources.requests.ephemeral-storage
          value: "53687091"
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate

  - it: accepts a fractional quantity
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      _namespace:
        etcd: etcd
        ingress: nginx
        host: example.com
      _cluster:
        cluster-domain: cozy.local
      nodeGroups:
        worker0:
          minReplicas: 1
          maxReplicas: 3
          instanceType: "u1.medium"
          diskSize: 20Gi
          roles:
          - worker
          resources:
            cpu: 1
            memory: 2Gi
          podCpuLimit: 1500m
    asserts:
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.resources.limits.cpu
          value: "1500m"
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate

  # KubeVirt's instancetype applier reports domain.resources.limits.cpu as a
  # conflict instead of resolving it, so a VM carrying both is refused at
  # admission with no Machine and no explanation on the Kubernetes CR. Sizing a
  # group by resources is what drops the instancetype from the VM, which is why
  # the limit is only usable there. Failing at render time is the same trade the
  # neighbouring resources.cpu / resources.memory guard makes.
  - it: refuses the limit on a group still sized by its instancetype
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      _namespace:
        etcd: etcd
        ingress: nginx
        host: example.com
      _cluster:
        cluster-domain: cozy.local
      nodeGroups:
        worker0:
          minReplicas: 1
          maxReplicas: 3
          instanceType: "u1.medium"
          diskSize: 20Gi
          roles:
          - worker
          podCpuLimit: 3
    asserts:
      # Matched on the message, not on "some render error": a group carrying
      # half a size trips the neighbouring resources.cpu / resources.memory
      # guard first, so a bare failedTemplate here would pass on the wrong
      # error.
      - failedTemplate:
          errorPattern: 'nodeGroup worker0: podCpuLimit cannot be combined with instanceType sizing'

  - it: leaves the limit to KubeVirt when the node group sets none
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      _namespace:
        etcd: etcd
        ingress: nginx
        host: example.com
      _cluster:
        cluster-domain: cozy.local
      nodeGroups:
        worker0:
          minReplicas: 1
          maxReplicas: 3
          instanceType: "u1.medium"
          diskSize: 20Gi
          roles:
          - worker
          resources:
            cpu: 2
            memory: 4Gi
    asserts:
      # Absent, not empty. The enclosing KubevirtMachineTemplate is named by a
      # hash of its content, so a `cpu:` key rendered for a group that asked
      # for nothing would rename the template and roll every live worker VM of
      # every cluster on upgrade.
      - notExists:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.resources.limits.cpu
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.resources.limits.ephemeral-storage
          value: "2Gi"
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
      - equal:
          path: spec.template.spec.virtualMachineTemplate.spec.template.spec.domain.resources.requests.ephemeral-storage
          value: "53687091"
        documentSelector:
          path: kind
          value: KubevirtMachineTemplate
