suite: monitoring-agents HelmRelease values match the monitoring-agents chart

# The values below are consumed by packages/system/monitoring-agents, which
# reads vmagent.remoteWrite.urls as a list and the tenant label from
# vmagent.externalLabels.tenant. A key the chart does not read is dropped in
# silence, and the chart then falls back to cozy-monitoring defaults that do
# not resolve inside a tenant cluster. Its counterpart is
# packages/system/monitoring-agents/tests/vmagent_remote_write_test.yaml.
templates:
  - templates/helmreleases/monitoring-agents.yaml

values:
  - values/common.yaml

release:
  name: kubernetes-clusterprod
  namespace: tenant-a

set:
  addons.monitoringAgents.enabled: true
  _namespace.monitoring: tenant-root
  _cluster:
    cluster-domain: cozy.local

tests:
  - it: sends metrics to the shortterm vminsert of the monitoring tenant as a urls list
    asserts:
      - equal:
          path: spec.values.vmagent.remoteWrite
          value:
            urls:
              - http://vminsert-shortterm.tenant-root.svc.cozy.local:8480/insert/0/prometheus

  - it: labels series with the tenant that owns the cluster, not the monitoring tenant
    asserts:
      - equal:
          path: spec.values.vmagent.externalLabels
          value:
            cluster: kubernetes-clusterprod
            tenant: tenant-a
      - notExists:
          path: spec.values.global

  - it: applies valuesOverride on top of the defaults instead of dropping it
    set:
      addons.monitoringAgents.valuesOverride:
        vmagent:
          remoteWrite:
            urls:
              - http://vminsert-shortterm.tenant-root.svc.cozy.local:8480/insert/0/prometheus
              - https://metrics.example.org/api/v1/write
        fluent-bit:
          config:
            outputs: |
              [OUTPUT]
                  Name stdout
                  Match *
    asserts:
      - equal:
          path: spec.values.vmagent.remoteWrite.urls
          value:
            - http://vminsert-shortterm.tenant-root.svc.cozy.local:8480/insert/0/prometheus
            - https://metrics.example.org/api/v1/write
      - equal:
          path: spec.values.fluent-bit.config.outputs
          value: |
            [OUTPUT]
                Name stdout
                Match *
      - equal:
          path: spec.values.vmagent.externalLabels
          value:
            cluster: kubernetes-clusterprod
            tenant: tenant-a
      - matchRegex:
          path: spec.values.fluent-bit.config.filters
          pattern: Add cluster kubernetes-clusterprod
      - equal:
          path: spec.values.fluent-bit.daemonSetVolumes[0].name
          value: varlog

  - it: adds extra destinations through valuesOverride without dropping the tenant ones
    set:
      addons.monitoringAgents.valuesOverride:
        vmagent:
          extraRemoteWrite:
            - url: https://metrics.example.org/api/v1/write
        fluent-bit:
          config:
            extraOutputs: |
              [OUTPUT]
                  Name stdout
                  Match *
    asserts:
      - equal:
          path: spec.values.vmagent.remoteWrite.urls
          value:
            - http://vminsert-shortterm.tenant-root.svc.cozy.local:8480/insert/0/prometheus
      - equal:
          path: spec.values.vmagent.extraRemoteWrite
          value:
            - url: https://metrics.example.org/api/v1/write
      - matchRegex:
          path: spec.values.fluent-bit.config.outputs
          pattern: 'Host vlinsert-generic\.tenant-root\.svc\.cozy\.local'
      # The outputs string is rendered again by the fluent-bit subchart,
      # which is where extraOutputs gets appended.
      - matchRegex:
          path: spec.values.fluent-bit.config.outputs
          pattern: '\{\{- with \.Values\.config\.extraOutputs \}\}\n\{\{ \. \}\}\n\{\{- end \}\}'

  - it: refuses extraOutputs when valuesOverride replaces outputs without the hook
    set:
      addons.monitoringAgents.valuesOverride:
        fluent-bit:
          config:
            outputs: |
              [OUTPUT]
                  Name http
                  Host logs-a.example.org
            extraOutputs: |
              [OUTPUT]
                  Name http
                  Host logs-b.example.org
    asserts:
      - failedTemplate:
          errorPattern: 'overrides fluent-bit\.config\.outputs without a hook that emits it'

  - it: passes both destinations through when valuesOverride replaces outputs and keeps the hook
    set:
      addons.monitoringAgents.valuesOverride:
        fluent-bit:
          config:
            outputs: |
              [OUTPUT]
                  Name http
                  Host logs-a.example.org
              {{- with .Values.config.extraOutputs }}
              {{ . }}
              {{- end }}
            extraOutputs: |
              [OUTPUT]
                  Name http
                  Host logs-b.example.org
    asserts:
      - matchRegex:
          path: spec.values.fluent-bit.config.outputs
          pattern: 'Host logs-a\.example\.org\n\{\{- with \.Values\.config\.extraOutputs \}\}'
      - matchRegex:
          path: spec.values.fluent-bit.config.extraOutputs
          pattern: 'Host logs-b\.example\.org'

  - it: accepts an outputs override whose hook emits extraOutputs through if
    set:
      addons.monitoringAgents.valuesOverride:
        fluent-bit:
          config:
            outputs: |
              [OUTPUT]
                  Name http
                  Host logs-a.example.org
              {{- if .Values.config.extraOutputs }}
              {{ .Values.config.extraOutputs }}
              {{- end }}
            extraOutputs: |
              [OUTPUT]
                  Name http
                  Host logs-b.example.org
    asserts:
      - matchRegex:
          path: spec.values.fluent-bit.config.extraOutputs
          pattern: 'Host logs-b\.example\.org'
