suite: stored Kubernetes specs that still carry a talos block

# The chart declares no `talos` key: worker pools are KubernetesNodes releases
# and read their own `talos`, and the Talos to Kubernetes support matrix is
# checked there. A Kubernetes spec stored before that still carries the block,
# and both the values schema (no additionalProperties: false at the root) and
# the aggregated API accept it, so the chart has to keep rendering it as if it
# were absent.

templates:
  - templates/cluster.yaml

values:
  - values/common.yaml

release:
  name: test-k8s
  namespace: tenant-test

tests:
  - it: renders the same control plane for a stored spec carrying every talos key the chart used to declare
    set:
      talos:
        version: "v1.13.6"
        schematicID: "ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515"
        imageFactoryURL: "https://factory.example.com"
        installerRepository: "registry.example.com/installer"
        registryMirrors:
          ghcr.io:
            endpoints:
              - https://registry.example.com
      version: "v1.31"
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Cluster
        documentIndex: 0
      - isKind:
          of: KamajiControlPlane
        documentIndex: 1
