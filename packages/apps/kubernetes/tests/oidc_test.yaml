  - it: does not read a mixed-case gate value as an opt-out from v1.33 on
    # strconv.ParseBool rejects fAlSe, so the apiserver never disables the gate
    # on it. Folding case before the match would read it as an opt-out and
    # withhold the header flag.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
