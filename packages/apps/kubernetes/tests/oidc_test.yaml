            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: does not refuse a patch-level element inside a quoted value
    # The apiserver strips the quotes and reads the whole value as one element
    # naming wardle, while splitting it unquoted leaves a kube element 1.32.4"
    # that the version pattern still matches. The chart withholds a reading of
    # a quoted value here as it does for the version, and the apiserver keeps
    # the last word.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
