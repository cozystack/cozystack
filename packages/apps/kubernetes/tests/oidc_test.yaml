        documentIndex: 1

  - it: fails on a patch-level --emulated-version and names the entry
    # toVersionMap refuses a non-zero patch component, so the apiserver exits
    # before it reads anything else. Reading the minor and rendering past it
    # would hand the operator a crash loop instead of this message.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
