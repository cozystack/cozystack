      version: "v1.34"
      controlPlane.apiServer.extraArgs:
        - "--emulated-version=1.32.4"
    asserts:
      - failedTemplate:
          errorMessage: 'controlPlane.apiServer.extraArgs contains "--emulated-version=1.32.4" while spec.oidc.mode is "System" — the kube-apiserver refuses an --emulated-version with a non-zero patch component (patch version not allowed), so the control plane would refuse to start. Emulation takes major.minor: write 1.32 instead of 1.32.4.'

  - it: fails on a patch-level kube element of a component-prefixed value
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
