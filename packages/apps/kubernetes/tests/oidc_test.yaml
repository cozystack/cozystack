            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: reads a suffixed --emulated-version as the minor it names
    # version.Parse ignores whatever follows the numeric run, so 1.32-rc
    # emulates 1.32. Skipping it would render the header flag for the image
    # tag on an apiserver emulating a version that refuses it.
    release:
      name: kubernetes-app
