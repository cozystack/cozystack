          errorMessage: 'controlPlane.apiServer.extraArgs contains "--emulated-version=kube=1.33.1" while spec.oidc.mode is "System" — the kube-apiserver refuses an --emulated-version with a non-zero patch component (patch version not allowed), so the control plane would refuse to start. Emulation takes major.minor: write 1.33 instead of 1.33.1.'

  - it: fails on a patch-level --emulated-version below the floor too
    # The refusal is the apiserver's on every version, so it does not wait for
    # the UID flags to be rendered.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
