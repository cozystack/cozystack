            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: keeps the last non-empty --emulated-version when a later one is empty
    # An empty value parses to an empty slice and emulates nothing, so an
    # apiserver handed both entries still emulates 1.32, below the floor.
    # Reading the empty entry as the operative one would drop the emulation and
    # render the header flag for the image tag instead.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.34"
      controlPlane.apiServer.extraArgs:
        - "--emulated-version=1.32"
        - "--emulated-version="
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--emulated-version=1.32"
            - "--emulated-version="
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: splits a component element at its first equals sign only
    # toVersionMap splits with SplitN(compVer, "=", 2) and version.Parse ignores
    # what follows the numbers, so kube=1.32=x emulates 1.32. Requiring exactly
    # two parts would skip the element and render the header flag for v1.34.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.34"
      controlPlane.apiServer.extraArgs:
        - "--emulated-version=kube=1.32=x"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--emulated-version=kube=1.32=x"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: ignores an --emulated-version entry naming another component
    # Emulating an aggregated apiserver's version says nothing about the gate on the
    # tenant kube-apiserver.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.34"
      controlPlane.apiServer.extraArgs:
        - "--emulated-version=wardle=1.2"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--emulated-version=wardle=1.2"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: does not let --emulated-version raise the version the chart renders for
    # Emulation only moves the effective version down. Reading a higher one would
    # render the header flag on a binary whose gate is still alpha.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.32"
      controlPlane.apiServer.extraArgs:
        - "--emulated-version=1.35"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--emulated-version=1.35"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: ignores an --emulated-version whose minor is not a number
    # The numeric run here is 1 alone, one component where version.Parse needs
    # two, so the apiserver rejects the value and fails either way. Reading the
    # minor as 0 would suppress the header flag on an opinion nobody expressed.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.34"
      controlPlane.apiServer.extraArgs:
        - "--emulated-version=1.garbage"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--emulated-version=1.garbage"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: ignores an --emulated-version value it cannot parse
    # Same treatment as an unreadable gate value: the apiserver rejects it on its own
    # terms, and the chart does not guess.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
