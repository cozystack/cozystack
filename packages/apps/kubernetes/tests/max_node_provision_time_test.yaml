suite: cluster-autoscaler maxNodeProvisionTime annotation

# The autoscaler reads its per-node-group option overrides off the same object
# as the min/max-size annotations, under the key
# `<CAPI group>/autoscaling-options-<lowercased option name>`. Both halves are
# easy to get wrong and neither fails loudly: a misspelled key is simply not an
# option the autoscaler knows, and a duration it cannot parse is discarded in
# favour of its own default. Either way the node group silently keeps the
# built-in provision timeout instead of the configured one.

templates:
  - templates/cluster.yaml

values:
  - values/common.yaml

tests:
  - it: annotates the MachineDeployment with the chart-default provision time
    release:
      name: test-k8s
      namespace: tenant-test
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: metadata.annotations["cluster.x-k8s.io/autoscaling-options-maxnodeprovisiontime"]
          value: "30m"

  - it: passes a configured provision time through verbatim
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "45m"
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: metadata.annotations["cluster.x-k8s.io/autoscaling-options-maxnodeprovisiontime"]
          value: "45m"

  - it: accepts a compound Go duration
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "1h30m"
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: metadata.annotations["cluster.x-k8s.io/autoscaling-options-maxnodeprovisiontime"]
          value: "1h30m"

  - it: accepts the canonical Go rendering of a duration
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "1h0m0s"
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: metadata.annotations["cluster.x-k8s.io/autoscaling-options-maxnodeprovisiontime"]
          value: "1h0m0s"

  - it: accepts a zero tail segment, which metav1.Duration serializes
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "20m0s"
    documentSelector:
      path: kind
      value: MachineDeployment
    asserts:
      - equal:
          path: metadata.annotations["cluster.x-k8s.io/autoscaling-options-maxnodeprovisiontime"]
          value: "20m0s"

  - it: rejects a provision time carrying no unit
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "30"
    asserts:
      - failedTemplate:
          errorMessage: 'maxNodeProvisionTime must be a whole number of s, m or h (e.g. 30m, 1h30m), got "30"'

  - it: rejects a unit the Go duration parser does not know
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "30min"
    asserts:
      - failedTemplate:
          errorMessage: 'maxNodeProvisionTime must be a whole number of s, m or h (e.g. 30m, 1h30m), got "30min"'

  - it: rejects a negative provision time
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "-30m"
    asserts:
      - failedTemplate:
          errorMessage: 'maxNodeProvisionTime must be a whole number of s, m or h (e.g. 30m, 1h30m), got "-30m"'

  - it: rejects a zero provision time, which the duration parser accepts
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "0s"
    asserts:
      - failedTemplate:
          errorMessage: 'maxNodeProvisionTime must be a whole number of s, m or h (e.g. 30m, 1h30m), got "0s"'

  - it: rejects a duration too large for the parser to represent
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "9999999h"
    asserts:
      - failedTemplate:
          errorMessage: 'maxNodeProvisionTime must be a whole number of s, m or h (e.g. 30m, 1h30m), got "9999999h"'

  - it: rejects a fraction that the parser rounds down to zero
    release:
      name: test-k8s
      namespace: tenant-test
    set:
      maxNodeProvisionTime: "0.1ns"
    asserts:
      - failedTemplate:
          errorMessage: 'maxNodeProvisionTime must be a whole number of s, m or h (e.g. 30m, 1h30m), got "0.1ns"'
