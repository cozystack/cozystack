suite: csi-proxmox.yaml install retry strategy

# The Proxmox counterpart of csi_install_retry_test.yaml. helmreleases/
# csi-proxmox.yaml sets the same strategy as csi.yaml for the same reason, and
# the e2e HelmRelease guard in hack/e2e-chainsaw/_lib/run-kubernetes.sh names
# the pins on cilium and csi as load-bearing: take RetryOnFailure away and a
# failed action on the release turns from a failed run into a note. This file
# holds the Proxmox release to the same pin.

templates:
  - templates/helmreleases/csi-proxmox.yaml

values:
  - values/common.yaml

set:
  _namespace:
    etcd: etcd-test
  substrate: proxmox
  proxmox:
    dnsServers: ["192.0.2.53"]
    allowedNodes: [pve-1]
    ipv4Config:
      addresses: ["192.0.2.10-192.0.2.20"]
      gateway: "192.0.2.1"
      prefix: 24
    csi:
      enabled: true
      credentialsSecretName: proxmox-csi-creds
      storageClasses:
        - name: proxmox
          storage: local-lvm
    ccm:
      credentialsSecretName: proxmox-ccm-creds

tests:
  # Install remediation is an uninstall in every case Flux offers, so under the
  # default strategy an install that misses its budget takes the tenant's CSI
  # node plugin and storage classes away until a later attempt lands them
  # again. RetryOnFailure keeps the manifests applied and retries instead.
  - it: retries a failed install instead of uninstalling the tenant CSI
    release:
      name: kubernetes-test
      namespace: tenant-test
    asserts:
      - equal:
          path: spec.install.strategy.name
          value: RetryOnFailure
      - equal:
          path: spec.install.strategy.retryInterval
          value: 30s

  # The controller performs the retry of a failed install as an upgrade, so
  # without a strategy here that retry's own failure falls through to upgrade
  # remediation instead of retrying again.
  - it: carries the strategy on the upgrade action the retry runs as
    release:
      name: kubernetes-test
      namespace: tenant-test
    asserts:
      - equal:
          path: spec.upgrade.strategy.name
          value: RetryOnFailure
      - equal:
          path: spec.upgrade.strategy.retryInterval
          value: 30s

  # The strategy governs a failed release. An absent release and an out-of-sync
  # one take different branches, which consult the retry count instead and stop
  # acting once it is exhausted.
  - it: keeps unlimited retries for the branches the strategy does not reach
    release:
      name: kubernetes-test
      namespace: tenant-test
    asserts:
      - equal:
          path: spec.install.remediation.retries
          value: -1
      - equal:
          path: spec.upgrade.remediation.retries
          value: -1
