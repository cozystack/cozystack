{{- /* KubeVirt-only: the cloud-controller-manager and the CSI driver here
      exist to reach the workers' VirtualMachines and their DataVolumes in
      THIS cluster. On the proxmox substrate the VMs are on an external
      hypervisor and the equivalents are separate packages
      (proxmox-ccm, proxmox-csi), so rendering these would leave a
      controller in the tenant reconciling objects that do not exist. */}}
{{- if ne (.Values.substrate | default "kubevirt") "proxmox" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kccm
rules:
- apiGroups: 
  - kubevirt.io
  resources: 
  - virtualmachines
  verbs: 
  - get
  - watch
  - list
- apiGroups: 
  - kubevirt.io
  resources: 
  - virtualmachineinstances
  verbs: 
  - get
  - watch
  - list
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - "*"
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - "endpointslices"
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
{{- end }}
