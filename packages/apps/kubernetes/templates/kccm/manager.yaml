{{- /* KubeVirt-only: the cloud-controller-manager and the CSI driver here
      exist to reach the workers' VirtualMachines and their DataVolumes in
      THIS cluster. On the proxmox substrate the VMs are on an external
      hypervisor and the equivalents are separate packages
      (proxmox-ccm, proxmox-csi), so rendering these would leave a
      controller in the tenant reconciling objects that do not exist. */}}
{{- if ne (.Values.substrate | default "kubevirt") "proxmox" }}
{{- if .Values._namespace.etcd }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kccm
  labels:
    k8s-app: {{ .Release.Name }}-kccm
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: {{ .Release.Name }}-kccm
  template:
    metadata:
      labels:
        k8s-app: {{ .Release.Name }}-kccm
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      enableServiceLinks: false
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: "NoSchedule"
      initContainers:
      {{- include "kubernetes.waitForAdminKubeconfig" $ | nindent 6 }}
      containers:
      - name: kubevirt-cloud-controller-manager
        args:
        - --cloud-provider=kubevirt
        - --cloud-config=/etc/cloud/cloud-config
        - --kubeconfig=/etc/kubernetes/kubeconfig/super-admin.svc
        - --cluster-name={{ .Release.Name }}
        command:
        - /bin/kubevirt-cloud-controller-manager
        image: "{{ $.Files.Get "images/kubevirt-cloud-provider.tag" | trim }}"
        imagePullPolicy: Always
        #securityContext:
        #  privileged: true
        resources:
          limits:
            cpu: 512m
            memory: 512Mi
          requests:
            cpu: 125m
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/kubernetes/kubeconfig
          name: kubeconfig
          readOnly: true
        - mountPath: /etc/cloud
          name: cloud-config
          readOnly: true
      volumes:
      - configMap:
          name: {{ .Release.Name }}-cloud-config
        name: cloud-config
      - secret:
          secretName: {{ .Release.Name }}-admin-kubeconfig
          optional: true
        name: kubeconfig
      serviceAccountName: {{ .Release.Name }}-kccm
{{- end }}
{{- end }}
