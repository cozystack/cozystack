apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-metrics-server
  labels:
    cozystack.io/repository: system
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: metrics-server
  chartRef:
    kind: ExternalArtifact
    name: cozystack-kubernetes-application-kubevirt-kubernetes-metrics-server
    namespace: cozy-system
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: cozy-monitoring
  storageNamespace: cozy-monitoring
  interval: 5m
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  {{- /* metrics-server needs about 1 millicore and 2 MB per node, so the
         system chart's 100m / 200Mi, its upstream default, reserves enough
         for a 100-node cluster. 20m / 64Mi covers a tenant cluster of a few
         dozen nodes plus the process itself; the limits are unchanged. */}}
  values:
    metrics-server:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 500Mi
  dependsOn:
  - name: {{ .Release.Name }}-cilium
    namespace: {{ .Release.Namespace }}
  - name: {{ .Release.Name }}-prometheus-operator-crds
    namespace: {{ .Release.Namespace }}
