{{- if not (include "kubernetes.etcd.sharedDataStore" .) }}
{{- $replicas := int .Values.etcd.replicas }}
{{- if not (has $replicas (list 1 3)) }}
{{- fail (printf "etcd.replicas must be 1 or 3, got %d: an even member count tolerates no more failures than the odd count below it" $replicas) }}
{{- end }}
{{- $name := include "kubernetes.etcd.name" . }}
{{- $values := dict
      "version" (include "cozy-lib.etcd.defaultVersion" .)
      "replicas" $replicas
      "size" "4Gi"
      "storageClass" (include "kubernetes.etcd.storageClass" .)
      "resources" (dict "cpu" "1000m" "memory" "512Mi") }}
{{- $etcd := dict "name" $name "values" $values "root" $ }}
{{- $clientLabels := dict "policy.cozystack.io/allow-to-etcd-cluster" $name }}
---
{{ include "cozy-lib.etcd.cluster" (merge (dict "labels" (dict "cozystack.io/service" "kubernetes-etcd")) $etcd) }}
---
{{ include "cozy-lib.etcd.certificates" (merge (dict "extraDNSNames" (list (printf "%s-client" $name) (printf "%s-client.%s.svc" $name .Release.Namespace))) $etcd) }}
---
{{ include "cozy-lib.etcd.workloadMonitor" $etcd }}
---
{{ include "cozy-lib.etcd.datastore" (dict "name" $name "dataStoreName" (include "kubernetes.etcd.dataStoreName" .) "root" $) }}
---
{{ include "cozy-lib.etcd.defrag" (dict "name" $name "root" $ "podLabels" $clientLabels) }}
{{- if .Capabilities.APIVersions.Has "autoscaling.k8s.io/v1/VerticalPodAutoscaler" }}
---
{{ include "cozy-lib.etcd.vpa" $etcd }}
{{- end }}
{{- if .Capabilities.APIVersions.Has "operator.victoriametrics.com/v1beta1/VMPodScrape" }}
---
{{ include "cozy-lib.etcd.podScrape" (dict "name" $name "selector" (dict "app.kubernetes.io/instance" $name)) }}
{{- end }}
{{- if .Capabilities.APIVersions.Has "cilium.io/v2/CiliumNetworkPolicy" }}
{{- /* The tenant namespace lets every pod in it, and every pod in an ancestor
       tenant's namespace, reach every other. etcd authenticates its clients
       by certificate either way; this keeps the tenant's own workloads,
       worker VMs included, from reaching the ports at all. Only the members,
       this cluster's control plane, its defrag Job and the platform
       namespaces (Kamaji, etcd-operator) get through. Deny rules win over
       the tenant's allow rules, which an allow rule here could not. */}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      etcd-operator.cozystack.io/cluster: {{ $name }}
  ingressDeny:
  - fromEndpoints:
    - matchExpressions:
      - key: etcd-operator.cozystack.io/cluster
        operator: NotIn
        values: [{{ $name | quote }}]
      - key: policy.cozystack.io/allow-to-etcd-cluster
        operator: NotIn
        values: [{{ $name | quote }}]
    toPorts:
    - ports:
      - port: "2379"
        protocol: TCP
      - port: "2380"
        protocol: TCP
  - fromEndpoints:
    - matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [{{ .Release.Namespace | quote }}, "kube-system"]
      - key: k8s:io.cilium.k8s.namespace.labels.cozystack.io/system
        operator: NotIn
        values: ["true"]
    toPorts:
    - ports:
      - port: "2379"
        protocol: TCP
      - port: "2380"
        protocol: TCP
{{- end }}
{{- end }}
