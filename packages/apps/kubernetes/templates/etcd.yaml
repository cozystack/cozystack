{{- if not (include "kubernetes.etcd.sharedDataStore" .) }}
{{- $replicas := int .Values.etcd.replicas }}
{{- if not (has $replicas (list 1 3)) }}
{{- fail (printf "etcd.replicas must be 1 or 3, got %d: an even member count tolerates no more failures than the odd count below it" $replicas) }}
{{- end }}
{{- $name := include "kubernetes.etcd.name" . }}
{{- with lookup "etcd-operator.cozystack.io/v1alpha2" "EtcdCluster" .Release.Namespace $name }}
{{- /* The StorageClass stays the one the etcd was created with, so dropping
       to one member keeps the volumes three members were given. A local class
       then leaves that member's data on a single node with nothing to recover
       it from. */}}
{{- $liveClass := dig "spec" "storage" "storageClassName" "" . }}
{{- $localClass := index ($.Values._cluster | default dict) "etcd-storage-class-local" | default "" }}
{{- $replicatedClass := index ($.Values._cluster | default dict) "etcd-storage-class-replicated" | default "" }}
{{- if and (eq $replicas 1) (gt (int (dig "spec" "replicas" 1 .)) 1) (or (and $localClass (eq $liveClass $localClass)) (and $replicatedClass (ne $liveClass $replicatedClass))) }}
{{- fail (printf "etcd.replicas cannot drop to 1: the etcd of %s keeps the StorageClass %q it was created with, so a single member would hold the only copy of the control-plane state on a volume the platform does not count as replicated. Keep 3 members." $.Release.Name $liveClass) }}
{{- end }}
{{- end }}
{{- $values := dict
      "version" (include "cozy-lib.etcd.defaultVersion" .)
      "replicas" $replicas
      "size" "4Gi"
      "storageClass" (include "kubernetes.etcd.storageClass" .)
      "resources" (dict "cpu" "1000m" "memory" "512Mi") }}
{{- $etcd := dict "name" $name "values" $values "root" $ }}
{{- $clientLabels := dict "policy.cozystack.io/allow-to-etcd-cluster" $name }}
---
{{- /* The operator merges additionalMetadata onto the member Pods and both
       etcd Services, so one annotation puts the members in the control
       plane's VPC and attaches the Services the apiserver dials. */}}
{{- $etcdMetadata := dict "labels" (dict "cozystack.io/service" "kubernetes-etcd") }}
{{- with include "kubernetes.vpc" . }}
{{- $_ := set $etcdMetadata "annotations" (dict "sdn.cozystack.io/vpc" .) }}
{{- end }}
{{ include "cozy-lib.etcd.cluster" (merge $etcdMetadata $etcd) }}
---
{{ include "cozy-lib.etcd.certificates" (merge (dict "extraDNSNames" (list (printf "%s-client" $name) (printf "%s-client.%s.svc" $name .Release.Namespace))) $etcd) }}
---
{{ include "cozy-lib.etcd.workloadMonitor" $etcd }}
---
{{ include "cozy-lib.etcd.datastore" (dict "name" $name "dataStoreName" (include "kubernetes.etcd.dataStoreName" .) "root" $) }}
---
{{ include "cozy-lib.etcd.defrag" (dict "name" $name "values" $values "root" $ "podLabels" $clientLabels) }}
{{- if .Capabilities.APIVersions.Has "autoscaling.k8s.io/v1/VerticalPodAutoscaler" }}
---
{{ include "cozy-lib.etcd.vpa" $etcd }}
{{- end }}
{{- if .Capabilities.APIVersions.Has "operator.victoriametrics.com/v1beta1/VMPodScrape" }}
---
{{ include "cozy-lib.etcd.podScrape" (dict "name" $name "selector" (dict "app.kubernetes.io/instance" $name)) }}
{{- end }}
{{- if .Capabilities.APIVersions.Has "cilium.io/v2/CiliumNetworkPolicy" }}
{{- /* The tenant namespace admits every pod in it, every pod in an ancestor
       tenant's namespace and the world entity. etcd authenticates its clients
       by certificate either way; this keeps the tenant's own workloads and
       anything off the cluster, such as Proxmox workers, from reaching the
       client and peer ports at all. Only the members, this cluster's control
       plane, its defrag and backup Jobs and the platform namespaces (Kamaji,
       etcd-operator) get through. Deny rules win over the tenant's allow
       rules, which an allow rule here could not. The node's own host and
       remote-node traffic is not denied. */}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      etcd-operator.cozystack.io/cluster: {{ $name }}
  ingressDeny:
  - fromEndpoints:
    - matchExpressions:
      - key: etcd-operator.cozystack.io/cluster
        operator: NotIn
        values: [{{ $name | quote }}]
      - key: policy.cozystack.io/allow-to-etcd-cluster
        operator: NotIn
        values: [{{ $name | quote }}]
    toPorts:
    - ports:
      - port: "2379"
        protocol: TCP
      - port: "2380"
        protocol: TCP
  - fromEndpoints:
    - matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [{{ .Release.Namespace | quote }}, "kube-system"]
      - key: k8s:io.cilium.k8s.namespace.labels.cozystack.io/system
        operator: NotIn
        values: ["true"]
    toPorts:
    - ports:
      - port: "2379"
        protocol: TCP
      - port: "2380"
        protocol: TCP
  - fromEntities:
    - world
    toPorts:
    - ports:
      - port: "2379"
        protocol: TCP
      - port: "2380"
        protocol: TCP
{{- end }}
{{- end }}
