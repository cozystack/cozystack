{{- /* KubeVirt-only: the cloud-controller-manager and the CSI driver here
      exist to reach the workers' VirtualMachines and their DataVolumes in
      THIS cluster. On the proxmox substrate the VMs are on an external
      hypervisor: the CSI node plugin comes from the proxmox-csi package and
      its controller, with the cloud-controller-manager, runs in this cluster
      (templates/csi-proxmox/, templates/ccm-proxmox/). Rendering these would
      leave a controller in the tenant reconciling objects that do not exist. */}}
{{- if ne (.Values.substrate | default "kubevirt") "proxmox" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-kcsi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kcsi
rules:
- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes"]
  verbs: ["get", "create", "delete"]
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachineinstances", "virtualmachines"]
  verbs: ["list", "get"]
# virtualmachineinstances/removevolume: the driver's fallback for a volume
# missing from the VM spec. Without the HotplugVolumes gate virt-api accepts
# it only on a VMI no VM owns, e.g. after an orphan-propagation delete.
- apiGroups: ["subresources.kubevirt.io"]
  resources: ["virtualmachines/addvolume", "virtualmachines/removevolume", "virtualmachineinstances/removevolume"]
  verbs: ["update"]
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "patch"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumnetworkpolicies"]
  verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kcsi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-kcsi
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-kcsi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-kcsi
rules:
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-kcsi-binding
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-kcsi
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-kcsi
  namespace: {{ .Release.Namespace }}
{{- end }}
