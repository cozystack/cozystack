{{- /*
  Talos -> Kubernetes support matrix. Each Talos minor release supports a
  bounded window of Kubernetes minor versions; running a kubelet outside
  that window produces a silently broken Talos+kubelet combination that
  HelmRelease cannot detect. Fail the chart render instead, so the operator
  sees the mismatch in Flux/dashboards before workers roll over.

  Upstream declares the window per Talos *minor* release, and patch releases
  never move it, so the lookup key is the minor derived from talos.version.
  Keying on the full patch version would silently disable this guard on every
  patch bump — exactly the mismatch it exists to catch.

  The matrix only fires for Talos minors it knows about; operators who
  override talos.version to something outside this list take responsibility
  for compatibility themselves (extend the dict or upstream a PR).
  Source: https://docs.siderolabs.com/talos/v1.13/getting-started/support-matrix
*/}}
{{- $talosK8sSupportMatrix := dict
      "v1.13" (list "v1.31" "v1.32" "v1.33" "v1.34" "v1.35" "v1.36")
}}
{{- $talosMinor := regexFind "^v[0-9]+\\.[0-9]+" .Values.talos.version }}
{{- with index $talosK8sSupportMatrix $talosMinor }}
{{-   if not (has $.Values.version .) }}
{{-     fail (printf "Kubernetes %s is not supported by Talos %s. Supported versions: %v. Bump tenant 'version' or set talos.version explicitly." $.Values.version $.Values.talos.version .) }}
{{-   end }}
{{- end }}
{{- $etcd := .Values._namespace.etcd }}
{{- /*
  When $etcd is empty, the parent Tenant application has not populated
  _namespace.etcd in cozystack-values yet - either the operator forgot to
  set etcd: true on an ancestor Tenant, or the Tenant HelmRelease is still
  reconciling. Either way, rendering a KamajiControlPlane with an empty
  dataStoreName would be rejected by Kamaji's admission webhook and the
  HelmRelease would fail to install, triggering remediation. Instead, emit
  a single ConfigMap as a user-visible status beacon and skip the rest so
  flux marks the HelmRelease Ready and retries its 5m reconcile loop until
  the Tenant chart catches up.
*/}}
{{- /* Worker node pools (KubevirtMachineTemplate, MachineDeployment,
       MachineHealthCheck, worker WorkloadMonitor) and the Talos
       reconcile Job that produces each pool's TalosConfigTemplate now
       live in the separate `kubernetes-nodes` chart (one HelmRelease
       per pool). This chart renders the control plane only. The
       reconcile Job in the kubernetes-nodes release still re-patches
       this KamajiControlPlane's apiserver-Service ClusterIP-SAN and
       owns each TalosConfigTemplate via an ownerReference to this KCP,
       so garbage collection on control-plane uninstall is unchanged. */}}
{{- /*
  Cluster pod/service CIDRs MUST match between the CAPI Cluster
  spec.clusterNetwork below and the Talos worker machineconfig's
  cluster.network — Talos surfaces overlaps against the host pod CIDR
  as a diagnostic at boot, and divergence between CAPI and Talos would
  manifest as silently broken kube-proxy / Cilium routing. Keep them
  in one place here.
*/}}
{{- $podCIDR := "10.243.0.0/16" }}
{{- $serviceCIDR := "10.95.0.0/16" }}
{{- $ingress := .Values._namespace.ingress }}
{{- $host := .Values._namespace.host }}
{{- if not $etcd }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-awaiting-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  status: "awaiting-etcd"
  message: |
    No DataStore is available for this tenant Kubernetes cluster. The parent
    Tenant application has not populated _namespace.etcd. Set spec.etcd: true
    on an ancestor Tenant (usually tenant-root) and wait for its HelmRelease
    to reconcile - this HelmRelease will pick up the DataStore on its next
    5m reconcile loop and provision the cluster.
{{- else }}
{{- /* Phase 2 worker-pool adoption guard. Worker pools now live in per-pool
       kubernetes-nodes releases; the platform migration adopts each pre-split
       pool's live objects onto its child release (re-annotating
       meta.helm.sh/release-name, pinning helm.sh/resource-policy=keep) as a
       pre-upgrade hook, BEFORE this control-plane-only chart reconciles. If
       that migration never processed a pool (its version slot was already
       stamped, or it was renumbered out on a merge/backport), a live worker
       MachineDeployment for this cluster is NOT owned by its kubernetes-nodes
       child release AND carries no keep pin, and Helm's control-plane-only
       re-render would prune it and cascade-delete the tenant's worker VMs.
       Refuse to render instead: the upgrade blocks with a legible reason and
       the workers keep running on the prior release until the migration runs.

       Exempt pools carrying helm.sh/resource-policy=keep. The migration pins
       keep on every pool it touches: on the ones it fully adopts (release-name
       rewritten to the child) and, deliberately, on the ones it cannot adopt
       but must keep prune-proof (documented skip branches: non-object
       nodeGroups, invalid rfc-1123 child name, child name over 53 chars,
       non-object group value). Those skipped pools keep the parent release-name
       by design, so keep is the migration's "processed, made prune-proof"
       signature. A pinned MachineDeployment is already safe from Helm prune, so
       flagging it here would convert that documented degraded-but-running state
       into a permanent upgrade deadlock. The exemption keys on OWNERSHIP BY THE
       CHILD RELEASE (release-name starts with kubernetes-nodes-<cluster>-), not
       on "owned by this parent release": Helm's prune gates on resource-policy
       alone and never consults the live release-name (see migration 56's
       foreign-owner branch), so a same-cluster unpinned MD whose release-name is
       empty or foreign (Helm annotations stripped out-of-band, or a DR restore
       of the CAPI objects) is ALSO in the parent's prune set and ALSO lost.
       Firing on "not child-owned AND unpinned" catches those alongside the
       parent-owned case; only a pool already adopted or natively created by its
       child release (child release-name) is exempt.

       Fail-closed like system/seaweedfs naming-guard: the release Namespace is
       a canary that always exists for a live install/upgrade, so an empty
       canary means a client-side render (helm template / unittest / CI lint,
       where lookup returns nil) that never prunes live objects: skip there.
       Discriminate on the adoption annotation, never on mere existence: the
       MachineDeployment always exists at render time, so an existence-only
       guard would deadlock the routine upgrade (see helmreleases/ouroboros.yaml).

       Scope: this guard lives in the etcd-present branch (the else of
       `if not $etcd`), so it does NOT run during the awaiting-etcd window,
       where the chart renders only the status beacon above. An owned+unpinned
       MD is therefore not refused in that transient window. This is a
       pre-existing narrow exposure, not introduced by the split (the pre-split
       chart also rendered pools only in this same else branch), and it closes
       as soon as etcd resolves and a real control-plane upgrade re-renders. */}}
{{- if .Release.IsUpgrade }}
{{-   if lookup "v1" "Namespace" "" .Release.Namespace }}
{{-     $unadopted := list }}
{{-     $childPrefix := printf "kubernetes-nodes-%s-" (trimPrefix "kubernetes-" $.Release.Name) }}
{{-     range $md := (lookup "cluster.x-k8s.io/v1beta1" "MachineDeployment" $.Release.Namespace "").items }}
{{-       if and (eq (dig "spec" "clusterName" "" $md) $.Release.Name) (not (hasPrefix $childPrefix (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $md))) (ne (dig "metadata" "annotations" "helm.sh/resource-policy" "" $md) "keep") }}
{{-         $unadopted = append $unadopted (dig "metadata" "name" "" $md) }}
{{-       end }}
{{-     end }}
{{-     if $unadopted }}
{{-       fail (printf "kubernetes: refusing to render cluster %q control-plane-only: worker MachineDeployment(s) %v are not owned by their kubernetes-nodes child release and are not pinned with helm.sh/resource-policy=keep, so the Phase 2 worker-pool adoption migration never processed them. Helm prunes on resource-policy alone (not on the live release-name), so rendering now would let Helm prune them and delete the tenant's worker VMs. Recover by one of two paths depending on why the migration missed this pool: if the worker-adoption migration has not run yet, re-run the platform upgrade; if it already ran and stamped (its version slot was renumbered out on a backport, or this parent HelmRelease predates the apps.cozystack.io/application.kind=Kubernetes label the migration selects on and was skipped), then manually annotate helm.sh/resource-policy=keep on those MachineDeployment(s) so this render stops pruning them, and stamp the cozystack-version ConfigMap in cozy-system back below the worker-adoption migration version so it re-runs and adopts them on the next upgrade. A pool the migration deliberately left pinned-but-unadopted already carries helm.sh/resource-policy=keep and is intentionally exempt from this guard." $.Release.Name $unadopted) }}
{{-     end }}
{{-   end }}
{{- end }}
{{- /* Validate user-supplied apiServer.extraVolumes / extraVolumeMounts before
       they are wired into the control-plane Deployment and apiserver container.

       The KamajiControlPlane -> TenantControlPlane Deployment runs on the
       MANAGEMENT cluster (in the tenant namespace), so volumes declared here
       land on a management-cluster pod. To preserve tenant<->management
       isolation we deny by default and allow only the ConfigMap/Secret sources
       that satisfy the intended use case (mounting an AuthenticationConfiguration
       file). Host-reaching sources (hostPath, csi, nfs, persistentVolumeClaim)
       and token-projection sources (projected) are rejected — a tenant with
       self-service access to the Kubernetes CR must not be able to mount
       management-node paths or project arbitrary service-account tokens into
       the apiserver pod.

       Names must be unique and non-empty: the chart injects two reserved
       volumes (talos-ca, talos-tls-cert), and a duplicate or empty volume name
       would render an invalid podspec the apiserver rejects with an opaque,
       apply-time error invisible to GitOps. Mounts may only reference a volume
       the user declared in extraVolumes — the chart-managed talos secret
       volumes are deliberately not mountable. */}}
{{- $allowedVolumeSources := list "configMap" "secret" }}
{{- $reservedVolumeNames := list "talos-ca" "talos-tls-cert" }}
{{- $userVolumeNames := list }}
{{- range $i, $vol := .Values.controlPlane.apiServer.extraVolumes }}
{{-   $volName := $vol.name | default "" | toString }}
{{-   if eq $volName "" }}
{{-     fail (printf "controlPlane.apiServer.extraVolumes[%d]: every volume must set a non-empty name" $i) }}
{{-   end }}
{{-   if has $volName $reservedVolumeNames }}
{{-     fail (printf "controlPlane.apiServer.extraVolumes: volume name %q is reserved by the chart for the talos control-plane secrets — rename your volume to avoid a duplicate volume name in the control-plane Deployment" $volName) }}
{{-   end }}
{{-   if has $volName $userVolumeNames }}
{{-     fail (printf "controlPlane.apiServer.extraVolumes: duplicate volume name %q — each extra volume must have a unique name" $volName) }}
{{-   end }}
{{-   $userVolumeNames = append $userVolumeNames $volName }}
{{-   $sources := without (keys $vol) "name" | sortAlpha }}
{{-   if ne (len $sources) 1 }}
{{-     fail (printf "controlPlane.apiServer.extraVolumes: volume %q must declare exactly one volume source, got %d (%v)" $volName (len $sources) $sources) }}
{{-   end }}
{{-   range $source := $sources }}
{{-     if not (has $source $allowedVolumeSources) }}
{{-       fail (printf "controlPlane.apiServer.extraVolumes: volume %q uses a %q source, which is not permitted on a management-cluster control-plane pod — only configMap and secret sources are allowed" $volName $source) }}
{{-     end }}
{{-   end }}
{{- end }}
{{- range $i, $mount := .Values.controlPlane.apiServer.extraVolumeMounts }}
{{-   $mountName := $mount.name | default "" | toString }}
{{-   if eq $mountName "" }}
{{-     fail (printf "controlPlane.apiServer.extraVolumeMounts[%d]: every mount must set a non-empty name" $i) }}
{{-   end }}
{{-   if not (has $mountName $userVolumeNames) }}
{{-     fail (printf "controlPlane.apiServer.extraVolumeMounts: mount %q references no volume declared in controlPlane.apiServer.extraVolumes — the chart-managed talos volumes cannot be mounted" $mountName) }}
{{-   end }}
{{- end }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - {{ $podCIDR }}
    services:
      cidrBlocks:
      - {{ $serviceCIDR }}
  controlPlaneRef:
    namespace: {{ .Release.Namespace }}
    apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
    kind: KamajiControlPlane
    name: {{ .Release.Name }}
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: KubevirtCluster
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
kind: KamajiControlPlane
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    cluster.x-k8s.io/role: control-plane
  annotations:
    kamaji.clastix.io/kubeconfig-secret-key: "super-admin.svc"
{{- /*
  OIDC wiring for `spec.oidc.mode` ≠ None:
    - Inject `--authentication-config=/etc/kubernetes/authentication-config/config.yaml`
      into the kube-apiserver extraArgs.
    - Mount the per-release Secret carrying the structured
      AuthenticationConfiguration at that path.
    - Add the Secret as an extraVolume on the KCP Deployment.

  The OIDC-managed flag and volume are kept ORTHOGONAL to the
  user-supplied controlPlane.apiServer.extraArgs / extraVolumes /
  extraVolumeMounts knobs — the user fields are preserved verbatim
  and the OIDC additions are appended. The OIDC mount name
  `authentication-config` is reserved by the chart; a user-supplied
  volume reusing it would conflict in the rendered podSpec.

  For mode=CustomConfig+secretRef, the user-owned Secret is mounted
  directly (the chart does not copy the contents). Otherwise the
  chart-owned `<release>-oidc-authn-config` Secret is mounted.
*/}}
{{- $oidcEnabled := ne .Values.oidc.mode "None" }}
{{- $oidcAuthnSecret := printf "%s-oidc-authn-config" .Release.Name }}
{{- $customSecretRefName := dig "customConfig" "secretRef" "name" "" .Values.oidc }}
{{- if and (eq .Values.oidc.mode "CustomConfig") (ne $customSecretRefName "") }}
{{-   $oidcAuthnSecret = $customSecretRefName }}
{{- end }}
{{- if and $oidcEnabled (has "authentication-config" $userVolumeNames) }}
{{-   fail "controlPlane.apiServer.extraVolumes: volume name \"authentication-config\" is reserved by the chart for OIDC AuthenticationConfiguration when spec.oidc.mode is not None — rename your volume." }}
{{- end }}
{{- /*
  Aggregation-layer UID plumbing. What is rendered per version, why an
  opt-out renders nothing rather than failing, and the migration note live
  in docs/oidc-tenant.md. That table is the one to update; there is
  deliberately no copy of it here.

  Anchors for the split, read at v1.32.13 and v1.35.6:
  staging/src/k8s.io/apiserver/pkg/features/kube_features.go for the gate's
  versioned spec, and .../server/options/authentication.go Validate() for
  the two refusals the guards below mirror. The version that decides is the
  EFFECTIVE one, which --emulated-version moves down.

  The merged gate entry carries the operator's own value, in their own
  prefix spelling, because that is correct whether duplicate flags collapse
  by name (it is last and wins) or are preserved (featureGate.Set() merges
  it into the earlier one).

  Two things do depend on the collapse, pinned by packages/system/kamaji,
  whose Makefile takes the newest -edge tag on `make update`. Reading only
  the LAST entry of each flag cuts both ways: handed every copy the apiserver
  merges them, so an earlier explicit setting the chart never saw would reach
  the gate. Failing on a uid-headers list without X-Remote-Uid is the other:
  handed both copies pflag appends, and the union passes caseInsensitiveHas.
  The opt-out path is unaffected, since the chart emits nothing there.

  Ownership is resolved after the arg loop because the last entry of each
  flag, and the interaction between them, are known only once every arg has
  been seen.
*/}}
{{- $uidHeaderUnsupported := false }}
{{- $uidGateRequired := false }}
{{- $emulatedKubeVersion := "" }}
{{- $uidGateOptedOut := false }}
{{- $uidHeaderArgSeen := "" }}
{{- $uidQuotedInput := false }}
{{- $uidHeaderConforms := false }}
{{- $gateArgValue := "" }}
{{- $gateUsesKubePrefix := false }}
{{- $gateArgSeen := "" }}
{{- $uidGateSetting := "" }}
{{- $allBetaSetting := "" }}
{{- $allAlphaSetting := "" }}
{{- $uidArgs := list }}
{{- /*
  Legacy `--oidc-*` flags in the user-supplied extraArgs are mutually
  exclusive with `--authentication-config`. The kube-apiserver refuses
  to boot when both are set (`--authentication-config cannot be used with
  any of --oidc-*`), so an existing cluster that previously configured
  OIDC by hand via the user extra*-passthrough would BOOT-FAIL on upgrade
  as soon as `spec.oidc.mode` is toggled to `System` or `CustomConfig`.
  Fail the chart render with an actionable message instead.

  When `spec.oidc.mode: None`, the user is free to keep --oidc-* flags
  in their extraArgs (the chart does not touch them) — that path is
  preserved for backward compatibility.
*/}}
{{- if $oidcEnabled }}
{{-   range $arg := (.Values.controlPlane.apiServer.extraArgs | default list) }}
{{-     if hasPrefix "--oidc-" $arg }}
{{-       fail (printf "controlPlane.apiServer.extraArgs contains %q while spec.oidc.mode is %q — the kube-apiserver refuses to boot with both --authentication-config (injected by spec.oidc) and legacy --oidc-* flags. Remove the --oidc-* flags from controlPlane.apiServer.extraArgs and use spec.oidc.mode: CustomConfig with a customConfig.config carrying the same issuer/audience if you need to override, or spec.oidc.mode: System for the platform cozy default." $arg $.Values.oidc.mode) }}
{{-     end }}
{{-     if hasPrefix "--authentication-config" $arg }}
{{-       fail (printf "controlPlane.apiServer.extraArgs contains %q while spec.oidc.mode is %q — the chart already injects --authentication-config= for OIDC. Drop your explicit flag and let spec.oidc.mode: CustomConfig own the AuthenticationConfiguration (customConfig.config or customConfig.secretRef.name), or leave spec.oidc.mode: None and keep managing the flag yourself." $arg $.Values.oidc.mode) }}
{{-     end }}
{{-     if hasPrefix "--requestheader-uid-headers=" $arg }}
{{- /*
  An empty value is not an opinion: readAsCSV returns an empty slice and
  Validate() only inspects a non-empty list, so the chart reads the last
  entry carrying one. Where the chart renders nothing for that flag the
  operator's empty value survives the collapse and reaches the apiserver as
  a BARE flag, which pflag refuses to start on: not this code's to repair,
  and why docs tell operators to delete such an entry rather than empty it.

  Only --flag=value is matched, and the space-separated spelling does not
  survive the collapse, which keys on "=". Written as two elements the flag
  comes back bare and takes whichever argument sorts after it as its value;
  written as one element the whole string becomes the key and reaches pflag
  as an unknown flag. The apiserver refuses to start either way.

  Match whole ELEMENTS and do NOT trim them: caseInsensitiveHas compares with
  strings.EqualFold and pflag's CSV reader keeps surrounding spaces, so
  "X-Remote-Uid-Extra" and "X-Remote-Uid " both fail there. Being more
  permissive than upstream would skip the chart's flag for a list the
  apiserver rejects.
*/}}
{{-       $headerValue := trimPrefix "--requestheader-uid-headers=" $arg }}
{{- /*
  Both flags this block reads are pflag StringSlice values, whose CSV reader
  strips a pair of surrounding double quotes before the apiserver sees them.
  Reproducing CSV here would be a second parser to keep correct, so a quoted
  value means the chart cannot know what the apiserver will read and renders
  nothing at all, which is what it did before these flags existed.

  That split is the rule for the whole block: fail only where the operator's
  own entry would stop the apiserver from starting, and withhold silently
  where the cluster keeps running and only misses the fix.
*/}}
{{-       if contains "\"" $headerValue }}
{{-         $uidQuotedInput = true }}
{{-       end }}
{{-       if ne $headerValue "" }}
{{-         $uidHeaders := list }}
{{-         range $h := splitList "," $headerValue }}
{{-           $uidHeaders = append $uidHeaders (lower $h) }}
{{-         end }}
{{-         $uidHeaderArgSeen = $arg }}
{{-         $uidHeaderConforms = has "x-remote-uid" $uidHeaders }}
{{-       end }}
{{-     end }}
{{-     if hasPrefix "--feature-gates=" $arg }}
{{- /*
  Values resolve as strconv.ParseBool resolves them (0/f/F, 1/t/T), names
  compare exactly, and both only after the component prefix is off: the flag
  is a colon-separated multimap parsed above featureGate.Set(), which is the
  layer `known[Feature(k)]` belongs to.

  A blanket AllAlpha/AllBeta counts: setUnsetAlphaGates and setUnsetBetaGates
  skip a key an explicit entry already wrote, so the explicit one wins in
  either map-iteration order.
*/}}
{{-       $gateValue := trimPrefix "--feature-gates=" $arg }}
{{-       if ne $gateValue "" }}
{{- /*
  Per ARGUMENT, not per element: only the surviving --feature-gates entry
  decides the spelling, so a prefix seen in an earlier entry must not leak
  into a merge onto a later unprefixed one.
*/}}
{{-         $gateUsesKubePrefix = false }}
{{-         $gateValues := dict }}
{{-         range $g := splitList "," $gateValue }}
{{- /*
  --feature-gates is a colon-separated multimap: each element is
  component:name=value, and an element with no component belongs to kube.
  Reading the whole "kube:Name" as the gate name misses every prefixed
  spelling, and appending an unprefixed term next to a prefixed one is
  rejected outright -- componentGlobalsRegistry.Set() refuses a mix of the
  empty prefix and kube: in one flag (registry.go, read at v1.35.6).
*/}}
{{-           $element := $g }}
{{-           if contains ":" $element }}
{{-             $component := trim (index (splitList ":" $element) 0) }}
{{- /*
  Only a literal "kube" keys under the kube component. An empty component,
  as in ":Foo=true", keys under "" exactly like an unprefixed element, so
  answering it with a kube:-prefixed term would create the mix the registry
  rejects. A foreign component keeps its prefix and so never matches one of
  the gate names below.
*/}}
{{-             if eq $component "kube" }}
{{-               $gateUsesKubePrefix = true }}
{{-             end }}
{{-             if or (eq $component "kube") (eq $component "") }}
{{-               $element = trimPrefix (printf "%s:" (index (splitList ":" $element) 0)) $element }}
{{-             end }}
{{-           end }}
{{-           $kv := splitList "=" $element }}
{{-           if eq (len $kv) 2 }}
{{-             $gname := trim (index $kv 0) }}
{{-             $gval := lower (trim (index $kv 1)) }}
{{-             if has $gval (list "true" "t" "1") }}
{{-               $gateValues = set $gateValues $gname "true" }}
{{-             else if has $gval (list "false" "f" "0") }}
{{-               $gateValues = set $gateValues $gname "false" }}
{{-             end }}
{{-           end }}
{{-         end }}
{{-         $gateArgSeen = $arg }}
{{-         $gateArgValue = $gateValue }}
{{-         $uidGateSetting = dig "RemoteRequestHeaderUID" "" $gateValues }}
{{-         $allBetaSetting = dig "AllBeta" "" $gateValues }}
{{-         $allAlphaSetting = dig "AllAlpha" "" $gateValues }}
{{-       end }}
{{-     end }}
{{-     if hasPrefix "--emulated-version=" $arg }}
{{- /*
  Emulation moves the version the gate resolves at, and the flags below have
  to follow it rather than the image tag. featureSpecAtEmulationVersion walks
  the versioned specs down to the emulated version, so RemoteRequestHeaderUID
  is alpha-and-off at an emulated 1.32 on any binary, and PreAlpha below that,
  where featureGate.Set() refuses to enable it at all.

  The value is a CSV of component=version, and an element naming no component
  is kube's. Anything else names another component and is none of our
  business. An unparseable version is left alone, the way an unparseable gate
  value is: the apiserver rejects it on its own terms.
*/}}
{{-       $emulatedValue := trimPrefix "--emulated-version=" $arg }}
{{-       if contains "\"" $emulatedValue }}
{{-         $uidQuotedInput = true }}
{{-       end }}
{{-       if ne $emulatedValue "" }}
{{- /*
  Reset per argument, for the reason given at the --feature-gates parser.
*/}}
{{-         $emulatedKubeVersion = "" }}
{{-         range $e := splitList "," $emulatedValue }}
{{-           $parts := splitList "=" (trim $e) }}
{{-           if eq (len $parts) 1 }}
{{-             $emulatedKubeVersion = trim (index $parts 0) }}
{{-           else if and (eq (len $parts) 2) (eq (trim (index $parts 0)) "kube") }}
{{-             $emulatedKubeVersion = trim (index $parts 1) }}
{{-           end }}
{{-         end }}
{{-       end }}
{{-     end }}
{{-   end }}
{{- /*
  Emulation can only move the effective version down, so the lower of the two
  decides. A tenant asking to emulate something newer than its own image is
  rejected by the apiserver; reading the lower one keeps the chart from
  rendering a flag that version cannot take.
*/}}
{{-   $chartMinorParts := splitList "." (trimPrefix "v" .Values.version) }}
{{-   $chartMinor := atoi (index $chartMinorParts 1) }}
{{-   $effectiveMinor := $chartMinor }}
{{-   if ne $emulatedKubeVersion "" }}
{{-     $emulatedParts := splitList "." (trimPrefix "v" $emulatedKubeVersion) }}
{{-     if and (ge (len $emulatedParts) 2) (regexMatch "^[0-9]+$" (index $emulatedParts 1)) }}
{{-       $emulatedMinor := atoi (index $emulatedParts 1) }}
{{-       if lt $emulatedMinor $effectiveMinor }}
{{-         $effectiveMinor = $emulatedMinor }}
{{-       end }}
{{-     end }}
{{-   end }}
{{- /*
  The fail messages are migration instructions, so they name the version the
  decision was taken at, which is not the image tag when emulation moved it.
*/}}
{{-   $versionForMessage := .Values.version }}
{{-   if and (ne $emulatedKubeVersion "") (ne $effectiveMinor $chartMinor) }}
{{-     $versionForMessage = printf "%s emulating %s" .Values.version $emulatedKubeVersion }}
{{-   end }}
{{-   $uidHeaderUnsupported = le $effectiveMinor 31 }}
{{-   $uidGateRequired = eq $effectiveMinor 32 }}
{{-   if eq $uidGateSetting "false" }}
{{-     $uidGateOptedOut = true }}
{{-   else if ne $uidGateSetting "true" }}
{{-     if $uidGateRequired }}
{{-       if eq $allAlphaSetting "false" }}
{{-         $uidGateOptedOut = true }}
{{-       end }}
{{-     else if eq $allBetaSetting "false" }}
{{-       $uidGateOptedOut = true }}
{{-     end }}
{{-   end }}
{{-   if and (not $uidHeaderUnsupported) (not $uidQuotedInput) }}
{{-     if $uidGateOptedOut }}
{{-       if ne $uidHeaderArgSeen "" }}
{{-         fail (printf "controlPlane.apiServer.extraArgs contains %q alongside %q, while spec.oidc.mode is %q on Kubernetes %s — the kube-apiserver rejects a --requestheader-uid-headers list while RemoteRequestHeaderUID is disabled, so the control plane would refuse to start. Drop one of the two: your header flag, or the gate setting that turns RemoteRequestHeaderUID off." $uidHeaderArgSeen $gateArgSeen $.Values.oidc.mode $versionForMessage) }}
{{-       end }}
{{-     else }}
{{-       if and (ne $uidHeaderArgSeen "") (not $uidHeaderConforms) }}
{{-         fail (printf "controlPlane.apiServer.extraArgs contains %q while spec.oidc.mode is %q — the chart injects --requestheader-uid-headers=X-Remote-Uid so the authenticated user UID survives the aggregation layer, and the kube-apiserver rejects a uid-headers list that omits X-Remote-Uid. Add X-Remote-Uid to your entry, or drop the entry and let the chart render the flag." $uidHeaderArgSeen $.Values.oidc.mode) }}
{{-       end }}
{{- /* The fail above leaves only conforming entries, so a non-empty one is yielded to. */}}
{{-       if eq $uidHeaderArgSeen "" }}
{{-         $uidArgs = append $uidArgs "--requestheader-uid-headers=X-Remote-Uid" }}
{{-       end }}
{{-       if and $uidGateRequired (not (or (eq $uidGateSetting "true") (eq $allAlphaSetting "true"))) }}
{{-         if ne $gateArgValue "" }}
{{- /*
  Match the operator's spelling: a prefixed value must get a prefixed term,
  or the apiserver rejects the mixed flag before any gate is read.
*/}}
{{-           $ownTerm := "RemoteRequestHeaderUID=true" }}
{{-           if $gateUsesKubePrefix }}
{{-             $ownTerm = "kube:RemoteRequestHeaderUID=true" }}
{{-           end }}
{{-           $uidArgs = append $uidArgs (printf "--feature-gates=%s,%s" $gateArgValue $ownTerm) }}
{{-         else }}
{{-           $uidArgs = append $uidArgs "--feature-gates=RemoteRequestHeaderUID=true" }}
{{-         end }}
{{-       end }}
{{-     end }}
{{-   end }}
{{- end }}
spec:
  apiServer:
    resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.controlPlane.apiServer.resourcesPreset .Values.controlPlane.apiServer.resources $) | nindent 6 }}
    {{- /*
      extraArgs and extraVolumeMounts are ALWAYS emitted (empty array when
      nothing to inject). Kamaji's KamajiControlPlane is a CRD and Helm
      applies JSON-merge-patch to CRDs, which for arrays REPLACES the whole
      value. If we omitted the field for `oidc.mode: None` after previously
      rendering it under `System`, JSON-merge-patch would leave the live
      array untouched — the tenant apiserver would keep the stale
      --authentication-config flag pointing at a Secret that no longer
      exists, and would refuse to start on the next kubelet restart.
      Rendering the empty array on the "off" path forces Helm to send a
      REPLACE patch that clears the stale value.
    */}}
    extraArgs:
      {{- with .Values.controlPlane.apiServer.extraArgs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $oidcEnabled }}
      - --authentication-config=/etc/kubernetes/authentication-config/config.yaml
      {{- with $uidArgs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- if not (or .Values.controlPlane.apiServer.extraArgs $oidcEnabled) }} []{{ end }}
    extraVolumeMounts:
      {{- with .Values.controlPlane.apiServer.extraVolumeMounts }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $oidcEnabled }}
      - name: authentication-config
        mountPath: /etc/kubernetes/authentication-config
        readOnly: true
      {{- end }}
      {{- if not (or .Values.controlPlane.apiServer.extraVolumeMounts $oidcEnabled) }} []{{ end }}
  controllerManager:
    resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.controlPlane.controllerManager.resourcesPreset .Values.controlPlane.controllerManager.resources $) | nindent 6 }}
  scheduler:
    resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.controlPlane.scheduler.resourcesPreset .Values.controlPlane.scheduler.resources $) | nindent 6 }}
  dataStoreName: "{{ $etcd }}"
  addons:
    konnectivity:
      {{- $konnVersion := include "kubernetes.konnectivityVersion" $ | trim }}
      {{- if $konnVersion }}
      agent:
        version: {{ $konnVersion }}
      {{- end }}
      server:
        port: 8132
        {{- if $konnVersion }}
        version: {{ $konnVersion }}
        {{- end }}
        resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.controlPlane.konnectivity.server.resourcesPreset .Values.controlPlane.konnectivity.server.resources $) | nindent 10 }}
  kubelet:
    cgroupfs: systemd
    preferredAddressTypes:
    - InternalIP
    - ExternalIP
  network:
    serviceType: ClusterIP
    ingress:
      extraAnnotations:
        nginx.ingress.kubernetes.io/ssl-passthrough: "true"
      hostname: {{ .Values.host | default (printf "%s.%s" .Release.Name $host) }}:443
      className: "{{ $ingress }}"
    additionalServicePorts:
      - name: talos-trustd
        port: 50001
        targetPort: 50001
        protocol: TCP
    {{- /* Initial render lists only the DNS SANs because the apiserver
           Service ClusterIP is not yet allocated when Helm executes the
           template. Since the worker split, the talos-reconcile Job that
           re-patches certSANs with the live ClusterIP (after which Kamaji
           re-issues the apiserver TLS cert) runs in each kubernetes-nodes
           pool release, not in this chart: a cluster with at least one pool
           gains the ClusterIP SAN once Kamaji emits the Service, while a
           pool-less cluster keeps DNS SANs only. That is a best-effort
           extra, not a dependency -- workers dial the apiserver by DNS name
           via extraHostEntries, so nothing requires the IP SAN. */}}
    certSANs:
      - {{ printf "%s.%s.svc" .Release.Name .Release.Namespace }}
      - {{ printf "%s.%s.svc.%s" .Release.Name .Release.Namespace (include "kubernetes.tenantClusterDomain" .) }}
  deployment:
    podAdditionalMetadata:
      labels:
        policy.cozystack.io/allow-to-etcd: "true"
    extraContainers:
      - name: talos-csr-signer
        image: "{{ default (.Files.Get "images/talos-csr-signer.tag" | trim) .Values.images.talosCsrSigner }}"
        imagePullPolicy: IfNotPresent
        ports:
          - name: trustd
            containerPort: 50001
            protocol: TCP
        env:
          - name: TALOS_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-talos-secrets
                key: token
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: talos-ca
            mountPath: /etc/talos-ca
            readOnly: true
          - name: talos-tls-cert
            mountPath: /etc/talos-server-crt
            readOnly: true
    extraVolumes:
      - name: talos-ca
        secret:
          secretName: {{ .Release.Name }}-talos-ca
      - name: talos-tls-cert
        secret:
          secretName: {{ .Release.Name }}-talos-tls-cert
      {{- with .Values.controlPlane.apiServer.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $oidcEnabled }}
      - name: authentication-config
        secret:
          secretName: {{ $oidcAuthnSecret }}
          items:
          - key: config.yaml
            path: config.yaml
      {{- end }}
  replicas: {{ .Values.controlPlane.replicas }}
  version: {{ include "kubernetes.versionMap" $ }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 2
  minReplicas: 1
  kind: kubernetes
  type: control-plane
  selector:
    kamaji.clastix.io/component: deployment
    kamaji.clastix.io/name: {{ .Release.Name }}
  version: {{ $.Chart.Version }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtCluster
metadata:
  annotations:
    cluster.x-k8s.io/managed-by: kamaji
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
