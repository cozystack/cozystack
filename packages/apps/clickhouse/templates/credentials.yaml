{{- /*
  One CredentialTemplate per user: the account the Cozystack credentials API
  mints and revokes through. The operator reads no Secret, so the template
  asks for a valuesPath: cozystack-controller adds a valuesFrom entry that
  pulls the account Secret's SHA-256 into the release values, and the label
  makes Flux upgrade the release when a mint or a revoke changes the Secret.
  clickhouse.yaml renders the verifier into the ClickHouseInstallation. The
  chart renders no tenant password.
*/ -}}
{{- include "clickhouse.accountsGuard" $ }}
{{- range $user, $_ := .Values.users }}
---
apiVersion: cozystack.io/v1alpha1
kind: CredentialTemplate
metadata:
  name: {{ printf "%s.%s" $.Release.Name (include "clickhouse.accountName" $user) | quote }}
spec:
  username: {{ $user | quote }}
  format:
    name: sha256
  secret:
    labels:
      reconcile.fluxcd.io/watch: Enabled
  valuesPath: _accounts
{{- end }}
