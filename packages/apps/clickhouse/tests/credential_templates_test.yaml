suite: one CredentialTemplate per user, with the verifier delivered through values

# The template is the account the credentials API mints through. The operator
# reads no Secret, so the template asks for a valuesPath, and the chart reads
# the stored SHA-256 back from _accounts.u<sha256 of the user name>.

templates:
  - templates/credentials.yaml

release:
  name: ch-test
  namespace: tenant-test

set:
  _cluster: {}

tests:
  - it: renders nothing without users
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a template per user, named for the account Secret's mapping
    set:
      users:
        web: {}
        Bob.Smith:
          readonly: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: CredentialTemplate
      - equal:
          path: apiVersion
          value: cozystack.io/v1alpha1
      - equal:
          path: metadata.name
          value: ch-test.bob-smith
        documentIndex: 0
      - equal:
          path: spec.username
          value: Bob.Smith
        documentIndex: 0
      - equal:
          path: metadata.name
          value: ch-test.web
        documentIndex: 1

  - it: stores SHA-256 verifiers, asks for the Flux watch label and a values path
    set:
      users:
        web: {}
    asserts:
      - equal:
          path: spec.format.name
          value: sha256
      - equal:
          path: spec.secret.labels
          value:
            reconcile.fluxcd.io/watch: Enabled
      - equal:
          path: spec.valuesPath
          value: _accounts

  - it: refuses two users that map to one account
    set:
      users:
        web: {}
        Web: {}
    asserts:
      - failedTemplate:
          errorPattern: map to

  - it: refuses a user whose name maps to no valid account name
    set:
      users:
        "-web": {}
    asserts:
      - failedTemplate:
          errorPattern: must start and end

  - it: refuses the backup platform account as a tenant user
    set:
      users:
        backup: {}
    asserts:
      - failedTemplate:
          errorPattern: reserved

  - it: refuses the default user
    set:
      users:
        default: {}
    asserts:
      - failedTemplate:
          errorPattern: reserved

  - it: refuses the operator's user
    set:
      users:
        clickhouse_operator: {}
    asserts:
      - failedTemplate:
          errorPattern: reserved
