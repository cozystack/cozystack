suite: tenant passwords stay out of the chart; backup stays a hidden platform account

# The ClickHouseInstallation gets each tenant user's SHA-256 from the values
# the HelmRelease pulls from the account Secret, and leaves out a user with no
# verifier yet, since the operator would give it the password "default".
# <release>-credentials keeps only the platform's backup account and is never
# tenant visible.

templates:
  - templates/clickhouse.yaml
  - templates/dashboard-resourcemap.yaml

release:
  name: ch-test
  namespace: tenant-test

set:
  _cluster: {}

tests:
  - it: renders the verifier a user has in values and leaves out one without
    template: templates/clickhouse.yaml
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    set:
      users:
        web:
          readonly: true
        reports: {}
      _accounts:
        u4b5e57f6eb2f42b9039b3d1e13929295f231749c510cbe341cd68036d9af97e2: ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb
    asserts:
      - equal:
          path: spec.configuration.users["web/password_sha256_hex"]
          value: ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb
      - equal:
          path: spec.configuration.users["web/profile"]
          value: readonly
      - notExists:
          path: spec.configuration.users["reports/password_sha256_hex"]
      - notExists:
          path: spec.configuration.users["reports/profile"]
      - notExists:
          path: spec.configuration.users["reports/networks/ip"]
      - exists:
          path: spec.configuration.users["backup/password_sha256_hex"]

  - it: ignores a leftover users.<name>.password
    template: templates/clickhouse.yaml
    set:
      users:
        web:
          password: leftover-plaintext
    asserts:
      - notExists:
          path: spec.configuration.users["web/password_sha256_hex"]
        documentSelector:
          path: kind
          value: ClickHouseInstallation
      - notExists:
          path: stringData.web
        documentSelector:
          path: kind
          value: Secret

  - it: leaves out a value that is not a SHA-256 hex
    template: templates/clickhouse.yaml
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    set:
      users:
        web: {}
      _accounts:
        u4b5e57f6eb2f42b9039b3d1e13929295f231749c510cbe341cd68036d9af97e2: "*0123456789ABCDEF0123456789ABCDEF01234567"
    asserts:
      - notExists:
          path: spec.configuration.users["web/password_sha256_hex"]

  - it: keeps only backup in <release>-credentials, labelled not tenant visible
    template: templates/clickhouse.yaml
    documentSelector:
      path: kind
      value: Secret
    set:
      users:
        web: {}
    asserts:
      - equal:
          path: metadata.name
          value: ch-test-credentials
      - equal:
          path: metadata.labels["internal.cozystack.io/tenantresource"]
          value: "false"
      - exists:
          path: stringData.backup
      - notExists:
          path: stringData.web

  - it: preserves the backup password and keys a sidecar restart on its rotation
    template: templates/clickhouse.yaml
    set:
      backup:
        enabled: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ch-test-credentials
            namespace: tenant-test
            annotations:
              credentials.cozystack.io/rotated: "2026-11-21T00:00:00Z"
          data:
            # base64 of "platform-backup"
            backup: cGxhdGZvcm0tYmFja3Vw
    asserts:
      - equal:
          path: stringData.backup
          value: platform-backup
        documentSelector:
          path: kind
          value: Secret
      - equal:
          path: spec.configuration.users["backup/password_sha256_hex"]
          value: dde39b6ad76cd9704ad0f6c554950b313995547e4df6513f909ed693d5c73450
        documentSelector:
          path: kind
          value: ClickHouseInstallation
      - equal:
          path: spec.templates.podTemplates[0].metadata.annotations["credentials.cozystack.io/backup-rotated"]
          value: "2026-11-21T00:00:00Z"
        documentSelector:
          path: kind
          value: ClickHouseInstallation

  - it: adds no restart annotation before a rotation
    template: templates/clickhouse.yaml
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    set:
      backup:
        enabled: true
    asserts:
      - notExists:
          path: spec.templates.podTemplates[0].metadata.annotations

  - it: grants no Secret to the dashboard
    template: templates/dashboard-resourcemap.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            resourceNames: [ch-test-credentials]
            verbs: ["get", "list", "watch"]
      - lengthEqual:
          path: rules
          count: 2
