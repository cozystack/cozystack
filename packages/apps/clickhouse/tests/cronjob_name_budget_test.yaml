suite: clickhouse legacy backup CronJob name budget

# The API refuses a CronJob name over 52 characters, because the controller
# names each Job it starts <name>-<timestamp>, while a release name may take 53.
# Cutting the release name alone would give two long names one CronJob, so a
# name that does not fit is the release name cut to 38 characters, a hash of
# the full release name and -backup.

templates:
  - templates/backup-cronjob.yaml
  - templates/backup-script.yaml
  - templates/backup-secret.yaml

set:
  _cluster: {}
  backup:
    enabled: true
    schedule: "0 2 * * *"

tests:
  - it: keeps <release>-backup for a short release name
    release:
      name: ch-test
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: ch-test-backup

  - it: keeps the name when it lands exactly on 52 characters
    release:
      name: clickhouse-abcdefghijklmnopqrstuvwxyz01234567
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: clickhouse-abcdefghijklmnopqrstuvwxyz01234567-backup

  - it: shortens the name one character past the budget
    release:
      name: clickhouse-abcdefghijklmnopqrstuvwxyz012345678
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: clickhouse-abcdefghijklmnopqrstuvwxyz0-bec95e-backup

  - it: fits a 53-character release name into 52 characters
    release:
      name: clickhouse-abcdefghijklmnopqrstuvwxyz0123456789abcdef
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: clickhouse-abcdefghijklmnopqrstuvwxyz0-3e8cf9-backup
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9]([-a-z0-9]{0,50}[a-z0-9])?$

  - it: gives a release name differing only in its last character another CronJob
    release:
      name: clickhouse-abcdefghijklmnopqrstuvwxyz0123456789abcdex
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: clickhouse-abcdefghijklmnopqrstuvwxyz0-bd3283-backup

  - it: does not end the cut release name with a dash
    release:
      name: clickhouse-abcdefghijklmnopqrstuvwxyz-0123456789
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: clickhouse-abcdefghijklmnopqrstuvwxyz-07ba9e-backup
