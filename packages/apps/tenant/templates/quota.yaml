{{- /* Keys in the gpuclass.cozystack.io domain are GPU budgets, not pod
       resources; model.IsGPUQuotaKey in internal/gpu decides the same. */}}
{{- $resourceQuotas := dict }}
{{- range $key, $value := .Values.resourceQuotas }}
{{-   $domain := index (splitList "/" $key) 0 }}
{{-   if not (or (eq $domain "gpuclass.cozystack.io") (hasSuffix ".gpuclass.cozystack.io" $domain)) }}
{{-     $_ := set $resourceQuotas $key $value }}
{{-   end }}
{{- end }}
{{- if $resourceQuotas }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: {{ include "tenant.name" . }}
spec:
  hard:
    {{- include "cozy-lib.resources.flatten" (list $resourceQuotas $) | nindent 6 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-range-limits
  namespace: {{ include "tenant.name" . }}
spec:
  limits:
    - default:
        cpu: "250m"
        memory: "128Mi"
        ephemeral-storage: "2Gi"
      defaultRequest:
        cpu: "25m"
        memory: "128Mi"
        ephemeral-storage: "50Mi"
      type: Container
{{- end }}
