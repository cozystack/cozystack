{{- /* gpu.cozystack.io/* keys are GPUClaim budgets, not pod resources. */}}
{{- $resourceQuotas := dict }}
{{- range $key, $value := .Values.resourceQuotas }}
{{-   if not (hasPrefix "gpu.cozystack.io/" $key) }}
{{-     $_ := set $resourceQuotas $key $value }}
{{-   end }}
{{- end }}
{{- if $resourceQuotas }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: {{ include "tenant.name" . }}
spec:
  hard:
    {{- include "cozy-lib.resources.flatten" (list $resourceQuotas $) | nindent 6 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-range-limits
  namespace: {{ include "tenant.name" . }}
spec:
  limits:
    - default:
        cpu: "250m"
        memory: "128Mi"
        ephemeral-storage: "2Gi"
      defaultRequest:
        cpu: "25m"
        memory: "128Mi"
        ephemeral-storage: "50Mi"
      type: Container
{{- end }}
