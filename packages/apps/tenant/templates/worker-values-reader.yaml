{{- if eq (toString (index (.Values._cluster | default dict) "worker-classes-enabled" | default false)) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cozy:worker-values-reader
  namespace: {{ include "tenant.name" . }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cozy:worker-values-reader
  namespace: {{ include "tenant.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cozy:worker-values-reader
subjects:
  - kind: ServiceAccount
    name: kubernetes-worker-classes
    namespace: cozy-system
{{- end }}
