suite: tenant Cilium policies follow the platform variant's CNI
templates:
  - templates/networkpolicy.yaml
release:
  name: tenant-ktj
  namespace: tenant-root
tests:
  - it: renders no Cilium objects on isp-hosted without the cilium.io API
    set:
      _cluster:
        bundle-name: isp-hosted
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Cilium objects on isp-hosted-slim without the cilium.io API
    set:
      _cluster:
        bundle-name: isp-hosted-slim
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Cilium objects on isp-hosted when only one Cilium kind is served
    set:
      _cluster:
        bundle-name: isp-hosted
    capabilities:
      apiVersions:
        - cilium.io/v2/CiliumNetworkPolicy
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Cilium policies on isp-hosted when the host runs Cilium
    set:
      _cluster:
        bundle-name: isp-hosted
    capabilities:
      apiVersions:
        - cilium.io/v2/CiliumNetworkPolicy
        - cilium.io/v2/CiliumClusterwideNetworkPolicy
    asserts: &policiesRendered
      - template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: allow-internal-communication
        isKind:
          of: CiliumNetworkPolicy
      - template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: tenant-ktj-ingress
        isKind:
          of: CiliumClusterwideNetworkPolicy

  - it: renders the Cilium policies on a Cilium variant even when the API is not discoverable
    set:
      _cluster:
        bundle-name: isp-full
    asserts: *policiesRendered

  - it: renders the Cilium policies when the platform injected no bundle-name
    set:
      _cluster: {}
    asserts: *policiesRendered
