suite: tenant quota render with GPU budget keys
# Keys in the gpuclass.cozystack.io domain are GPU budgets checked when a VM
# or a worker pool is written, not pod resources, so they never reach the
# namespace ResourceQuota, and a tenant whose only keys are GPU budgets gets
# neither a ResourceQuota nor the default LimitRange that comes with it.
templates:
  - templates/quota.yaml
release:
  name: tenant-acme
  namespace: tenant-root
tests:
  - it: renders nothing for a tenant with only GPU budget keys
    set:
      resourceQuotas:
        l40s-24c.gpuclass.cozystack.io/devices: 2
        gpuclass.cozystack.io/devices: 4
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the GPU budget keys out of a ResourceQuota rendered for other keys
    set:
      resourceQuotas:
        cpu: "4"
        h100.gpuclass.cozystack.io/devices: 2
        gpuclass.cozystack.io/devices: 4
    asserts:
      - hasDocuments:
          count: 2
      - documentSelector:
          path: kind
          value: ResourceQuota
        equal:
          path: spec.hard
          value:
            limits.cpu: "4"
            requests.cpu: "0.4"
      - documentSelector:
          path: kind
          value: LimitRange
        equal:
          path: metadata.name
          value: tenant-range-limits

  # A malformed key in the budget domain is still a budget, never a pod
  # resource.
  - it: keeps a malformed budget-domain key out of the ResourceQuota
    set:
      resourceQuotas:
        a.b.gpuclass.cozystack.io/units: 1
    asserts:
      - hasDocuments:
          count: 0

  # A domain that only ends like the budget domain is not one.
  - it: renders a key in a look-alike domain into the ResourceQuota
    set:
      resourceQuotas:
        xgpuclass.cozystack.io/devices: 1
    asserts:
      - hasDocuments:
          count: 2

  # A raw resource-name key is a pod quota and stays one.
  - it: renders a tenant with a raw GPU resource-name key a ResourceQuota
    set:
      resourceQuotas:
        nvidia.com/AD102GL_L40S: 1
    asserts:
      - hasDocuments:
          count: 2
      - documentSelector:
          path: kind
          value: ResourceQuota
        matchRegex:
          path: metadata.name
          pattern: ^tenant-quota$

  - it: renders nothing without resourceQuotas
    asserts:
      - hasDocuments:
          count: 0
