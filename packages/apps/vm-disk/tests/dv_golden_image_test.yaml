suite: vm-disk refuses to clone a golden image that is missing, failed or stuck
# A golden that is missing, whose import Failed, or whose importer keeps
# crashing is not populated, and CDI holds a clone of it until it is, so a new
# disk on it would sit pending with nothing pointing at the image. A golden
# still importing is safe to clone because CDI waits for it, and helm template
# has no cluster to look it up in.
release:
  name: test-vm-disk
  namespace: tenant-test
templates:
  - templates/dv.yaml
tests:
  - it: refuses a new disk on a golden whose import Failed
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: &scheme
        "cdi.kubevirt.io/v1beta1/DataVolume":
          gvr: {group: cdi.kubevirt.io, version: v1beta1, resource: datavolumes}
          namespaced: true
        "v1/Namespace":
          gvr: {group: "", version: v1, resource: namespaces}
          namespaced: false
        "v1/PersistentVolumeClaim":
          gvr: {group: "", version: v1, resource: persistentvolumeclaims}
          namespaced: true
      objects:
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status: {phase: Failed}
    asserts:
      - failedTemplate:
          errorPattern: 'golden DataVolume "vm-default-images-ubuntu" in cozy-public failed to import \(phase Failed\)'

  - it: clones a golden whose import Succeeded
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status: {phase: Succeeded}
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
    asserts:
      - equal:
          path: spec.source.pvc
          value: {name: vm-default-images-ubuntu, namespace: cozy-public}

  - it: clones a golden that is still importing
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status: {phase: ImportInProgress}
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
    asserts:
      - equal:
          path: spec.source.pvc
          value: {name: vm-default-images-ubuntu, namespace: cozy-public}

  - it: renders without a cluster to look the golden up in
    set:
      source: {image: {name: ubuntu}}
    asserts:
      - equal:
          path: spec.source.pvc
          value: {name: vm-default-images-ubuntu, namespace: cozy-public}

  - it: leaves an existing disk alone when its golden later Failed
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status: {phase: Failed}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata:
            name: test-vm-disk
            namespace: tenant-test
            annotations:
              vm-disk.cozystack.io/source: '{"image":{"name":"ubuntu"}}'
              vm-disk.cozystack.io/storage-class: replicated
          spec:
            source: {pvc: {name: vm-default-images-ubuntu, namespace: cozy-public}}
            storage: {resources: {requests: {storage: 5Gi}}, storageClassName: replicated}
    asserts:
      - notFailedTemplate: {}

  - it: refuses a new disk on a golden that does not exist
    set:
      source: {image: {name: nosuch}}
    kubernetesProvider:
      scheme: *scheme
      objects: &releaseNamespace
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
    asserts:
      - failedTemplate:
          errorPattern: 'source.image "nosuch": golden image "vm-default-images-nosuch" not found in cozy-public'

  - it: clones a golden PVC that has no DataVolume
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
    asserts:
      - equal:
          path: spec.source.pvc
          value: {name: vm-default-images-ubuntu, namespace: cozy-public}

  - it: leaves an existing disk alone when its golden was later removed
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata:
            name: test-vm-disk
            namespace: tenant-test
            annotations:
              vm-disk.cozystack.io/source: '{"image":{"name":"ubuntu"}}'
              vm-disk.cozystack.io/storage-class: replicated
          spec:
            source: {pvc: {name: vm-default-images-ubuntu, namespace: cozy-public}}
            storage: {resources: {requests: {storage: 5Gi}}, storageClassName: replicated}
    asserts:
      - notFailedTemplate: {}

  - it: does not look the golden up for a source other than an image
    set:
      source: {http: {url: "https://example.com/disk.img"}}
    kubernetesProvider:
      scheme: *scheme
      objects: *releaseNamespace
    asserts:
      - notFailedTemplate: {}

  - it: clones a golden whose DataVolume exists before CDI created its PVC
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status: {phase: ImportScheduled}
    asserts:
      - equal:
          path: spec.source.pvc
          value: {name: vm-default-images-ubuntu, namespace: cozy-public}

  - it: refuses a new disk on a golden whose importer keeps failing
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status: &stuck
            phase: ImportInProgress
            # A string: helm-unittest's lookup cannot deep-copy an int, and | int takes either.
            restartCount: "3"
            conditions:
              - {type: Bound, status: "True"}
              - {type: Running, status: "False", reason: Error}
    asserts:
      - failedTemplate:
          errorPattern: 'golden DataVolume "vm-default-images-ubuntu" in cozy-public keeps failing to import \(3 importer restarts\).*lifts by itself.*a recreated importer pod counts as not running until its container starts'

  - it: clones a golden that restarted but is downloading again
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status:
            phase: ImportInProgress
            restartCount: "5"
            conditions:
              - {type: Running, status: "True", reason: Pod is running}
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
    asserts:
      - notFailedTemplate: {}

  - it: clones a golden whose importer failed fewer than three times
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status:
            phase: ImportInProgress
            restartCount: "2"
            conditions:
              - {type: Running, status: "False", reason: Error}
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
    asserts:
      - notFailedTemplate: {}

  - it: clones a golden that Succeeded after its importer restarted
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status:
            phase: Succeeded
            restartCount: "4"
            conditions:
              - {type: Running, status: "False", reason: Completed}
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
    asserts:
      - notFailedTemplate: {}

  - it: leaves an existing disk alone when its golden is stuck
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status: *stuck
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata:
            name: test-vm-disk
            namespace: tenant-test
            annotations:
              vm-disk.cozystack.io/source: '{"image":{"name":"ubuntu"}}'
              vm-disk.cozystack.io/storage-class: replicated
          spec:
            source: {pvc: {name: vm-default-images-ubuntu, namespace: cozy-public}}
            storage: {resources: {requests: {storage: 5Gi}}, storageClassName: replicated}
    asserts:
      - notFailedTemplate: {}

  - it: clones a golden whose importer restarted and reports no Running condition
    set:
      source: {image: {name: ubuntu}}
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: {name: tenant-test}
        - kind: DataVolume
          apiVersion: cdi.kubevirt.io/v1beta1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
          status: {phase: ImportInProgress, restartCount: "3"}
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata: {name: vm-default-images-ubuntu, namespace: cozy-public}
    asserts:
      - notFailedTemplate: {}
