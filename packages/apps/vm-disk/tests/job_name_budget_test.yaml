suite: vm-disk resize Job name budget

# The API server copies a Job's name into the job-name label of its pods, and a
# label value takes 63 characters at most, while a release name may take 53.
# The hook renders only when an existing PVC grows, so each release below gets
# a smaller PVC to look up. The ServiceAccount, Role and RoleBinding have no
# such limit and keep the full name, so the ones an earlier resize left behind
# are replaced, not orphaned.

templates:
  - templates/pvc-resize-hook.yaml

set:
  storage: 2Gi

kubernetesProvider:
  scheme:
    "v1/PersistentVolumeClaim":
      gvr:
        group: ""
        version: "v1"
        resource: "persistentvolumeclaims"
      namespaced: true
  objects:
    - kind: PersistentVolumeClaim
      apiVersion: v1
      metadata:
        name: test-vm-disk
        namespace: tenant-test
      spec:
        resources:
          requests:
            storage: 1Gi
    - kind: PersistentVolumeClaim
      apiVersion: v1
      metadata:
        name: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789
        namespace: tenant-test
      spec:
        resources:
          requests:
            storage: 1Gi
    - kind: PersistentVolumeClaim
      apiVersion: v1
      metadata:
        name: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcd
        namespace: tenant-test
      spec:
        resources:
          requests:
            storage: 1Gi
    - kind: PersistentVolumeClaim
      apiVersion: v1
      metadata:
        name: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcdefghi
        namespace: tenant-test
      spec:
        resources:
          requests:
            storage: 1Gi

tests:
  - it: keeps <release>-volume-resize-hook for a short release name
    release:
      name: test-vm-disk
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: test-vm-disk-volume-resize-hook

  - it: keeps the name when it lands exactly on 63 characters
    release:
      name: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789-volume-resize-hook

  - it: does not end the cut name with a dash
    release:
      name: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcd
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcd-volume-resize

  - it: cuts the name to 63 characters for a 53-character release name
    release:
      name: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcdefghi
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcdefghi-volume-re
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
      - equal:
          path: spec.template.spec.serviceAccountName
          value: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcdefghi-volume-resize-hook

  - it: leaves the ServiceAccount on the full name for a 53-character release name
    release:
      name: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcdefghi
      namespace: tenant-test
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: vm-disk-abcdefghijklmnopqrstuvwxyz0123456789abcdefghi-volume-resize-hook
