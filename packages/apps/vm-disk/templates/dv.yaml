{{- $existingDV := lookup "cdi.kubevirt.io/v1beta1" "DataVolume" .Release.Namespace .Release.Name }}
{{- $sourceAnnotation := "vm-disk.cozystack.io/source" }}
{{- $storageClassAnnotation := "vm-disk.cozystack.io/storage-class" }}
{{- $requestedSource := toJson (.Values.source | default dict) }}
{{- $requestedSC := (.Values.storageClass | default "") | toString }}
{{- /* Build the desired source spec from .Values so it can be both rendered and compared. */}}
{{- $desiredSource := dict }}
{{- if .Values.source }}
  {{- if gt (len .Values.source) 1 }}
    {{- fail "Exactly one type of source is expected!" }}
  {{- end }}
  {{- if hasKey .Values.source "image" }}
    {{- $desiredSource = dict "pvc" (dict "name" (printf "vm-default-images-%s" (required "A valid .Values.source.image.name entry required!" .Values.source.image.name)) "namespace" "cozy-public") }}
    {{- /* Refuse a golden that is missing or whose import Failed: CDI never
           populates it, so the clone would wait forever. A golden still importing
           is left alone because CDI holds the clone until the source is populated.
           Missing means neither the DataVolume nor the PVC CDI clones exists, as
           the DataVolume can precede its PVC, and counts only when the release
           namespace is visible: helm template has no cluster and every lookup
           comes back empty. An existing disk is exempt: its DataVolume spec is
           immutable, so failing the render cannot rescue it and would only block
           this release's upgrades. Its PVC alone counts as existing, since CDI
           can garbage-collect a completed DataVolume and leave the PVC. */}}
    {{- if not (or $existingDV (lookup "v1" "PersistentVolumeClaim" .Release.Namespace .Release.Name)) }}
      {{- $golden := lookup "cdi.kubevirt.io/v1beta1" "DataVolume" "cozy-public" $desiredSource.pvc.name }}
      {{- $goldenPVC := lookup "v1" "PersistentVolumeClaim" "cozy-public" $desiredSource.pvc.name }}
      {{- if eq (dig "status" "phase" "" $golden | toString) "Failed" }}
        {{- fail (printf "source.image %q: golden DataVolume %q in cozy-public failed to import (phase Failed), so a clone of it would never complete. Ask the platform administrator to check the importer pod in cozy-public, then delete that DataVolume to retry the import." .Values.source.image.name $desiredSource.pvc.name) }}
      {{- else if and (not $golden) (not $goldenPVC) (lookup "v1" "Namespace" "" .Release.Namespace) }}
        {{- fail (printf "source.image %q: golden image %q not found in cozy-public, so a clone of it would never start. Check the image name, or ask the platform administrator to add cozystack.vm-default-images to bundles.enabledPackages." .Values.source.image.name $desiredSource.pvc.name) }}
      {{- end }}
      {{- /* Refuse a clone into a class other than the golden's that CDI would
             attempt as an advanced clone (csi-clone, or snapshot with a usable
             snapshot class): nothing on that path compares class names,
             so a target class of the same provisioner gets no fallback. LINSTOR
             creates the clone where the source data is and then needs it
             reachable from the node the claim is placed on, which only a class
             allowing remote access from anywhere guarantees; otherwise the
             clone PVC may never bind. The golden PVC carries the class CDI
             resolved for it; without one (no cluster, or the PVC not created
             yet) nothing is compared. An empty storageClass is resolved the
             way CDI resolves it for a kubevirt DataVolume: the default virt
             class, else the Kubernetes default class. CDI breaks a tie between
             several defaults by creation time; that is not reproduced, so a
             tie compares nothing. */}}
      {{- $goldenSC := dig "spec" "storageClassName" "" ($goldenPVC | default dict) | toString }}
      {{- $targetSC := $requestedSC }}
      {{- if and $goldenSC (not $targetSC) }}
        {{- $classes := (lookup "storage.k8s.io/v1" "StorageClass" "" "").items | default list }}
        {{- $resolved := false }}
        {{- range $annotation := list "storageclass.kubevirt.io/is-default-virt-class" "storageclass.kubernetes.io/is-default-class" }}
          {{- if not $resolved }}
            {{- $defaults := list }}
            {{- range $classes }}
              {{- if eq (dig "metadata" "annotations" $annotation "" . | toString) "true" }}
                {{- $defaults = append $defaults .metadata.name }}
              {{- end }}
            {{- end }}
            {{- if $defaults }}
              {{- $resolved = true }}
              {{- if eq (len $defaults) 1 }}{{- $targetSC = first $defaults }}{{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if and $goldenSC $targetSC (ne $goldenSC $targetSC) }}
        {{- /* Mirror CDI's planner (pkg/controller/clone/planner.go at
               v1.66.1): the strategy is the CDI CR's override, else the target
               StorageProfile's, else snapshot. snapshot falls back to a
               host-assisted copy when no VolumeSnapshotClass serves the
               driver (the one both StorageProfiles name, else any), fails
               outright when the one both name does not exist, and otherwise
               goes on like csi-clone. csi-clone falls back on a driver or
               volume mode mismatch, or on a larger target in a class without
               expansion; sizes are not compared, so a class without expansion
               is left alone. A host-assisted copy completes, so every fallback
               renders. Anything else not found compares nothing. */}}
        {{- $cdi := lookup "cdi.kubevirt.io/v1beta1" "CDI" "" "cdi" }}
        {{- $profile := lookup "cdi.kubevirt.io/v1beta1" "StorageProfile" "" $targetSC | default dict }}
        {{- $goldenClass := lookup "storage.k8s.io/v1" "StorageClass" "" $goldenSC | default dict }}
        {{- $targetClass := lookup "storage.k8s.io/v1" "StorageClass" "" $targetSC | default dict }}
        {{- $strategy := "" }}
        {{- if $cdi }}
          {{- $strategy = dig "spec" "cloneStrategyOverride" "" $cdi | default (dig "status" "cloneStrategy" "snapshot" $profile) | toString }}
        {{- end }}
        {{- /* CDI reads the source's driver from its bound PV first. */}}
        {{- $goldenProvisioner := dig "provisioner" "" $goldenClass | toString }}
        {{- with dig "spec" "volumeName" "" $goldenPVC }}
          {{- with dig "spec" "csi" "driver" "" (lookup "v1" "PersistentVolume" "" . | default dict) }}
            {{- $goldenProvisioner = . | toString }}
          {{- end }}
        {{- end }}
        {{- $sameProvisioner := and $goldenProvisioner (eq $goldenProvisioner (dig "provisioner" "" $targetClass | toString)) }}
        {{- $advanced := eq $strategy "csi-clone" }}
        {{- /* Gated on the API being served: a lookup of a kind the cluster
               does not know fails the render instead of returning nothing. */}}
        {{- if and (eq $strategy "snapshot") (.Capabilities.APIVersions.Has "snapshot.storage.k8s.io/v1/VolumeSnapshotClass") }}
          {{- $goldenProfile := lookup "cdi.kubevirt.io/v1beta1" "StorageProfile" "" $goldenSC | default dict }}
          {{- $commonSnapshotClass := dig "status" "snapshotClass" "" $goldenProfile | toString }}
          {{- if ne $commonSnapshotClass (dig "status" "snapshotClass" "" $profile | toString) }}
            {{- $commonSnapshotClass = "" }}
          {{- end }}
          {{- if $commonSnapshotClass }}
            {{- $snapshotClass := lookup "snapshot.storage.k8s.io/v1" "VolumeSnapshotClass" "" $commonSnapshotClass }}
            {{- if and $sameProvisioner (not $snapshotClass) }}
              {{- fail (printf "source.image %q: VolumeSnapshotClass %q, named by the StorageProfiles of both %q and %q, does not exist, so CDI cannot plan a clone of golden image %q into StorageClass %q. Set storageClass to %q, or ask the platform administrator to fix the StorageProfiles' snapshotClass." .Values.source.image.name $commonSnapshotClass $goldenSC $targetSC $desiredSource.pvc.name $targetSC $goldenSC) }}
            {{- end }}
            {{- $advanced = eq (dig "driver" "" ($snapshotClass | default dict) | toString) $goldenProvisioner }}
          {{- else }}
            {{- range (lookup "snapshot.storage.k8s.io/v1" "VolumeSnapshotClass" "" "").items | default list }}
              {{- if eq (dig "driver" "" . | toString) $goldenProvisioner }}{{- $advanced = true }}{{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- $propertySets := dig "status" "claimPropertySets" list $profile }}
        {{- $targetMode := "" }}
        {{- if $propertySets }}
          {{- $targetMode = dig "volumeMode" "Filesystem" (first $propertySets) | toString }}
        {{- end }}
        {{- /* linstor-csi takes the parameter with or without its prefix and
               the key in any case, parses the value with strconv.ParseBool, and
               without it allows remote access when the layer list (DRBD and
               storage by default) has a DRBD or NVMe layer. Any other value is
               a list of rules, and a rule naming no fromSame label allows
               access from anywhere. */}}
        {{- $remoteAccess := "" }}
        {{- $layerList := "drbd storage" }}
        {{- range $key, $value := dig "parameters" dict $targetClass }}
          {{- $parts := splitn "/" 2 $key }}
          {{- $name := $parts._0 }}
          {{- if $parts._1 }}
            {{- $name = ternary $parts._1 "" (eq $parts._0 "linstor.csi.linbit.com") }}
          {{- end }}
          {{- if eq (lower $name) "allowremotevolumeaccess" }}{{- $remoteAccess = $value | toString }}{{- end }}
          {{- if eq (lower $name) "layerlist" }}{{- $layerList = $value | toString }}{{- end }}
        {{- end }}
        {{- $layers := splitList " " (lower $layerList) }}
        {{- $remoteFromAnywhere := or (has "drbd" $layers) (has "nvme" $layers) }}
        {{- if $remoteAccess }}
          {{- $remoteFromAnywhere = has $remoteAccess (list "1" "t" "T" "TRUE" "true" "True") }}
          {{- range fromYamlArray $remoteAccess }}
            {{- if and (kindIs "map" .) (not (get . "fromSame")) }}{{- $remoteFromAnywhere = true }}{{- end }}
          {{- end }}
        {{- end }}
        {{- if and $advanced $sameProvisioner (eq $goldenProvisioner "linstor.csi.linbit.com") (not $remoteFromAnywhere) (eq $targetMode (dig "spec" "volumeMode" "Filesystem" $goldenPVC | toString)) (dig "allowVolumeExpansion" false $targetClass) }}
          {{- fail (printf "source.image %q: golden image %q lives in StorageClass %q, and a clone into StorageClass %q of the same provisioner gets no host-assisted fallback from CDI. LINSTOR creates the clone next to the source data, and StorageClass %q does not allow remote volume access from every node, so the clone may never bind. Set storageClass to %q, or ask the platform administrator to set cloneStrategyOverride to copy in the kubevirt-cdi package." .Values.source.image.name $desiredSource.pvc.name $goldenSC $targetSC $targetSC $goldenSC) }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- else if hasKey .Values.source "http" }}
    {{- $desiredSource = dict "http" (dict "url" (required "A valid .Values.source.http.url entry required!" .Values.source.http.url)) }}
  {{- else if hasKey .Values.source "upload" }}
    {{- $desiredSource = dict "upload" dict }}
  {{- else if hasKey .Values.source "disk" }}
    {{- $desiredSource = dict "pvc" (dict "name" (printf "vm-disk-%s" (required "A valid .Values.source.disk.name entry required!" .Values.source.disk.name)) "namespace" .Release.Namespace) }}
  {{- else }}
    {{- fail (printf "Unknown source type: %s. Expected one of: image, http, upload, disk." (keys .Values.source | join ", ")) }}
  {{- end }}
{{- else }}
  {{- $desiredSource = dict "blank" dict }}
{{- end }}
{{- /*
  DataVolume.spec is immutable in CDI, so editing storageClass/source on an
  existing disk is a silent no-op that diverges the CR from the cluster (#2985);
  fail instead. Both are compared against the operator input recorded in an
  annotation at creation (legacy disks fall back to stored spec.source). Full
  contract + caveats: docs/storage-immutability.md. Size growth: pvc-resize-hook.
*/}}
{{- if $existingDV }}
  {{- $existingAnnotations := $existingDV.metadata.annotations | default dict }}
  {{- if hasKey $existingAnnotations $storageClassAnnotation }}
    {{- $recordedSC := (index $existingAnnotations $storageClassAnnotation) | toString }}
    {{- if ne $recordedSC $requestedSC }}
      {{- fail (printf "VMDisk storageClass is immutable after creation (current: %q, requested: %q). Delete and recreate the disk to change it." $recordedSC $requestedSC) }}
    {{- end }}
  {{- end }}
  {{- $recordedSource := (index $existingAnnotations $sourceAnnotation) | default "" }}
  {{- if $recordedSource }}
    {{- if ne $recordedSource $requestedSource }}
      {{- fail (printf "VMDisk source is immutable after creation (current: %s, requested: %s). Delete and recreate the disk to change it." $recordedSource $requestedSource) }}
    {{- end }}
  {{- else }}
    {{- $storedSource := $existingDV.spec.source | default dict }}
    {{- /* Legacy disk (no annotation): compare only chart-producible stored
           shapes; anything else (sourceRef, non-map, foreign source) is left
           alone, never crashed or deadlocked. Vars are declared before the map
           guards so they stay in scope below. See docs/storage-immutability.md. */}}
    {{- $storedType := "" }}
    {{- $chartShaped := false }}
    {{- $storedIsImageClone := false }}
    {{- if kindIs "map" $storedSource }}
      {{- if eq (len (keys $storedSource)) 1 }}{{- $storedType = first (keys $storedSource) }}{{- end }}
      {{- $storedBody := index $storedSource $storedType }}
      {{- if kindIs "map" $storedBody }}
        {{- if or (eq $storedType "blank") (eq $storedType "upload") }}
          {{- $chartShaped = true }}
        {{- else if eq $storedType "http" }}
          {{- if eq (keys $storedBody | sortAlpha | join ",") "url" }}{{- $chartShaped = true }}{{- end }}
        {{- else if eq $storedType "pvc" }}
          {{- /* The chart only ever clones a pvc from cozy-public (image) or the
                 release namespace (disk); a pvc in any other namespace is a
                 foreign source with no chart-producible provenance. */}}
          {{- if eq (keys $storedBody | sortAlpha | join ",") "name,namespace" }}
            {{- if or (eq ($storedBody.namespace | toString) "cozy-public") (eq ($storedBody.namespace | toString) .Release.Namespace) }}
              {{- $chartShaped = true }}
            {{- end }}
            {{- if eq ($storedBody.namespace | toString) "cozy-public" }}{{- $storedIsImageClone = true }}{{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- /* The image-clone exemption applies only when the request is ALSO an
           image: the vm-image- -> vm-default-images- prefix drift is
           indistinguishable from a real image-name change only then. A change
           away from an image source to another type is a different shape and is
           still caught. */}}
    {{- $exemptImage := and $storedIsImageClone (hasKey (.Values.source | default dict) "image") }}
    {{- if and $chartShaped (not $exemptImage) }}
      {{- if ne (toYaml $storedSource) (toYaml $desiredSource) }}
        {{- fail (printf "VMDisk source is immutable after creation (current: %s, requested: %s). Delete and recreate the disk to change it." (toJson $storedSource) $requestedSource) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    {{- /* A `#` comment here would be part of the rendered DataVolume, so the
           explanation lives in a template comment and the operator-facing half
           in README.md.

           On by default, for every source type, and on the existing-DV path as
           well: a VMDisk is a standalone object populated before any VM consumes
           it, so on a WaitForFirstConsumer class a disk nothing has attached
           would never populate at all. CDI reads the annotation by presence.

           Off is the placement-correct path for a disk a VMInstance will
           consume: KubeVirt renders a temporary launcher pod carrying the VM's
           own affinity and nodeSelector, so the volume binds where the VM can
           actually run. The two cases want opposite defaults and only the
           operator knows which one a given disk is. `replicated`, the chart
           default, binds Immediate either way, so neither setting moves it. */}}
    {{- if .Values.bindImmediately }}
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
    {{- end }}
    {{- if $existingDV }}
    {{- if hasKey ($existingDV.metadata.annotations | default dict) $sourceAnnotation }}
    {{ $sourceAnnotation }}: {{ index ($existingDV.metadata.annotations | default dict) $sourceAnnotation | quote }}
    {{- end }}
    {{- if hasKey ($existingDV.metadata.annotations | default dict) $storageClassAnnotation }}
    {{ $storageClassAnnotation }}: {{ index ($existingDV.metadata.annotations | default dict) $storageClassAnnotation | quote }}
    {{- end }}
    {{- else }}
    {{ $sourceAnnotation }}: {{ $requestedSource | quote }}
    {{ $storageClassAnnotation }}: {{ $requestedSC | quote }}
    {{- end }}
    vm-disk.cozystack.io/optical: "{{ .Values.optical }}"
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ .Release.Name }}
spec:
  {{- if $existingDV }}
    {{- toYaml $existingDV.spec | nindent 2 }}
  {{- else }}
  contentType: kubevirt
  source:
    {{- toYaml $desiredSource | nindent 4 }}
  storage:
    resources:
      requests:
        storage: {{ .Values.storage }}
    {{- with .Values.storageClass }}
    storageClassName: {{ . }}
    {{- end }}
  {{- end }}
