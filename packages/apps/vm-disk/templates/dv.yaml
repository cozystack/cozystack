{{- $existingDV := lookup "cdi.kubevirt.io/v1beta1" "DataVolume" .Release.Namespace .Release.Name }}
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    {{- if hasKey .Values.source "upload" }}
    cdi.kubevirt.io/storage.bind.immediate.requested: ""
    {{- end }}
    vm-disk.cozystack.io/optical: "{{ .Values.optical }}"
    {{- /* A Velero restore deletes the DataVolume and recreates the PVC under
           its name, so the next Helm upgrade creates this DataVolume over a
           claim CDI did not make for it. CDI v1.66 accepts that only with this
           annotation on the DataVolume or with the DataVolumeClaimAdoption
           feature gate; the same annotation on the PVC is never read. It cannot
           capture a claim CDI created for this very DataVolume, whose
           createdForDataVolume is the DataVolume's uid, so a fresh import is
           unchanged. */}}
    cdi.kubevirt.io/allowClaimAdoption: "true"
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ .Release.Name }}
spec:
  {{- if $existingDV }}
    {{- toYaml $existingDV.spec | nindent 2 }}
  {{- else }} 
  contentType: kubevirt
  {{- if .Values.source }}
  {{- if gt (len .Values.source) 1 }}
    {{- fail "Exactly one type of source is expected!" }}
  {{- end }}
  source:
    {{- if hasKey .Values.source "image" }}
    pvc:
      name: vm-default-images-{{ required "A valid .Values.source.image.name entry required!" .Values.source.image.name }}
      namespace: cozy-public
    {{- else if hasKey .Values.source "http" }}
    http:
      url: {{ required "A valid .Values.source.http.url entry required!" .Values.source.http.url }}
    {{- else if hasKey .Values.source "upload" }}
    upload: {}
    {{- else if hasKey .Values.source "disk" }}
    pvc:
      name: vm-disk-{{ required "A valid .Values.source.disk.name entry required!" .Values.source.disk.name }}
      namespace: {{ $.Release.Namespace }}
    {{- end }}
  {{- else }}
  source:
    blank: {}
  {{- end }}
  storage:
    resources:
      requests:
        storage: {{ .Values.storage }}
    {{- with .Values.storageClass }}
    storageClassName: {{ . }}
    {{- end }}
  {{- end }}
