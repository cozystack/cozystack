apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dashboard-resources
rules:
{{- if eq (include "vm-disk.substrate" .) "proxmox" }}
- apiGroups:
  - proxmox.alperen.cloud
  resources:
  - virtualmachinevolumes
  resourceNames:
  - {{ .Release.Name }}
  verbs: ["get", "list", "watch"]
{{- else }}
- apiGroups:
  - cdi.kubevirt.io
  resources:
  - datavolumes
  resourceNames:
  - {{ .Release.Name }}
  verbs: ["get", "list", "watch"]
{{- end }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-dashboard-resources
subjects:
{{ include "cozy-lib.rbac.subjectsForTenantAndAccessLevel" (list "use" .Release.Namespace) }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dashboard-resources
  apiGroup: rbac.authorization.k8s.io
