{{- /*
TODO: remove this file once Cozystack has an interface that serves
application ConfigMaps to tenants, the way tenantsecrets serves Secrets.
Until then it is the only way a tenant can read the FoundationDB cluster
file in <release>-config. It grants ConfigMaps only, never Secrets.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-resourcemap
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.cozystack.io/type: dashboard-resourcemap
data:
  resources: |
    - apiVersion: v1
      kind: ConfigMap
      name: {{ .Release.Name }}-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dashboard-resources
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - {{ .Release.Name }}-config
  - {{ .Release.Name }}-resourcemap
  verbs: ["get", "list", "watch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-dashboard-resources
subjects:
{{ include "cozy-lib.rbac.subjectsForTenantAndAccessLevel" (list "use" .Release.Namespace) }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dashboard-resources
  apiGroup: rbac.authorization.k8s.io
