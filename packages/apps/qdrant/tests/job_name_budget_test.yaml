suite: qdrant cleanup Job name budget

# The API server copies a Job's name into the job-name label of its pods, and a
# label value takes 63 characters at most, while a release name may take 53.
# The ServiceAccount, Role and RoleBinding have no such limit and keep the full
# name.

templates:
  - templates/hooks/cleanup-pvc.yaml

tests:
  - it: keeps <release>-qdrant-cleanup for a short release name
    release:
      name: qdrant-test
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: qdrant-test-qdrant-cleanup

  - it: keeps the name when it lands exactly on 63 characters
    release:
      name: qdrant-abcdefghijklmnopqrstuvwxyz0123456789abcde
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: qdrant-abcdefghijklmnopqrstuvwxyz0123456789abcde-qdrant-cleanup

  - it: cuts the name to 63 characters for a 53-character release name
    release:
      name: qdrant-abcdefghijklmnopqrstuvwxyz0123456789abcdefghij
      namespace: tenant-test
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: qdrant-abcdefghijklmnopqrstuvwxyz0123456789abcdefghij-qdrant-cl
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
      - equal:
          path: spec.template.spec.serviceAccountName
          value: qdrant-abcdefghijklmnopqrstuvwxyz0123456789abcdefghij-qdrant-cleanup

  - it: leaves the ServiceAccount on the full name for a 53-character release name
    release:
      name: qdrant-abcdefghijklmnopqrstuvwxyz0123456789abcdefghij
      namespace: tenant-test
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: qdrant-abcdefghijklmnopqrstuvwxyz0123456789abcdefghij-qdrant-cleanup
