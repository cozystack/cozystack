suite: qdrant data PVC cleanup on delete

# Guards the fix for issue #3059: the upstream Qdrant chart does NOT support
# persistentVolumeClaimRetentionPolicy, so its StatefulSet-templated data PVC
# (qdrant-storage-<release>-0) is orphaned when the StatefulSet is deleted.
#
# A post-delete hook reclaims the data by deleting PVCs whose name matches the
# deterministic StatefulSet template prefix (qdrant-storage-<release>-). A
# name-prefix scheme is used instead of a label because volumeClaimTemplates
# labels are immutable on an existing StatefulSet — routing a release-unique
# label through the subchart would break reconciliation for already-deployed
# instances and still would not match their pre-existing PVCs.

release:
  name: qdrant-test
  namespace: tenant-test

tests:
  #####################################################
  # post-delete cleanup hook                          #
  #####################################################

  - it: "renders a post-delete Job that deletes the data PVC by anchored name"
    templates:
      - templates/hooks/cleanup-pvc.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-delete
      - equal:
          path: spec.template.spec.serviceAccountName
          value: qdrant-test-qdrant-cleanup
      # The script exits non-zero when a delete or a listing failed, so the Job
      # can now fail. Under the Kubernetes default of 6 it would back off across
      # seven pods for about ten minutes and outlast the hook timeout, and Helm
      # would report that timeout instead of the hook's own error.
      - equal:
          path: spec.backoffLimit
          value: 1
      # Pinned exactly, because the whole point of the non-zero exit is that the
      # failed Job survives to be read. Adding hook-failed here hands the Job
      # straight back to Helm to delete on failure, destroying the only account
      # of what was left behind — and until this assert existed, that one-line
      # reversal left this chart's whole suite green, because nothing else here
      # read the annotation.
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "kubectl get pvc -n tenant-test -o name"
      # The ordinal MUST be anchored ("-[0-9]+$"). Without it, deleting release
      # "qdrant-test" would also match a sibling "qdrant-test-2"'s PVCs
      # (qdrant-storage-qdrant-test-2-0) and irreversibly delete its data.
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'grep -E "\^persistentvolumeclaim/qdrant-storage-qdrant-test-\[0-9\]\+\$"'
      # Guard against regressing to the unanchored prefix (plain grep, no $).
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'grep "\^persistentvolumeclaim/qdrant-storage-qdrant-test-"'

  - it: "creates qdrant-scoped RBAC for the cleanup hook"
    templates:
      - templates/hooks/cleanup-pvc.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.name
          value: qdrant-test-qdrant-cleanup
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["get", "list", "delete"]
