suite: qdrant removes the Secrets cert-manager wrote once the release is deleted

release:
  name: qdrant-test
  namespace: tenant-test

set:
  _cluster:
    cluster-domain: cozy.local

tests:
  - it: grants delete on exactly the Secrets its Certificates write
    templates:
      - templates/hooks/cleanup-secrets.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules[0].resourceNames
          value:
            - qdrant-test-ca
            - qdrant-test-tls

  - it: deletes them from a post-delete Job that fails when a delete fails
    templates:
      - templates/hooks/cleanup-secrets.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-delete
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.template.spec.serviceAccountName
          value: qdrant-test-secrets-cleanup
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl delete secret --namespace tenant-test --ignore-not-found "qdrant-test-ca" "qdrant-test-tls"; then'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'exit 1'
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^clastix/kubectl:v[0-9]+\.[0-9]+(\.[0-9]+)?@sha256:[0-9a-f]{64}$'

  - it: still renders when the release no longer issues certificates, since an earlier revision may have
    templates:
      - templates/hooks/cleanup-secrets.yaml
    set:
      tls:
        enabled: false
    asserts:
      - hasDocuments:
          count: 4

  - it: lists the Secret of Certificate 1 of 2 among those it deletes
    templates:
      - templates/certmanager.yaml
    set:
      tls:
        enabled: true
    documentSelector:
      path: spec.secretName
      value: qdrant-test-ca
    asserts:
      - isKind:
          of: Certificate

  - it: lists the Secret of Certificate 2 of 2 among those it deletes
    templates:
      - templates/certmanager.yaml
    set:
      tls:
        enabled: true
    documentSelector:
      path: spec.secretName
      value: qdrant-test-tls
    asserts:
      - isKind:
          of: Certificate

  - it: issues no Certificate beyond the 2 the cleanup covers
    templates:
      - templates/certmanager.yaml
    set:
      tls:
        enabled: true
    documentSelector:
      path: kind
      value: Certificate
      matchMany: true
    asserts:
      - hasDocuments:
          count: 2
          filterAware: true
