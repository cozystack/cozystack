suite: the default account is a CredentialTemplate whose account Secret the operator reads

# The template is the account the credentials API mints through; its name plus
# ".account" must be the auth.secretPath of the RedisFailover, or the operator
# reads a Secret nobody writes. The chart itself renders no password.

release:
  name: my-valkey
  namespace: tenant-test

tests:
  - it: renders the default account while authentication is on
    templates:
      - templates/credentials.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CredentialTemplate
      - equal:
          path: apiVersion
          value: cozystack.io/v1alpha1
      - equal:
          path: metadata.name
          value: my-valkey.default
      - equal:
          path: spec.username
          value: default
      # The operator reads the password itself from the account Secret.
      - equal:
          path: spec.format.name
          value: plaintext
      # The operator re-reads the Secret on its own resync and watches nothing
      # a label would select.
      - notExists:
          path: spec.secret
      - notExists:
          path: spec.valuesPath

  - it: renders no account without authentication
    templates:
      - templates/credentials.yaml
    set:
      authEnabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: points the operator at the account Secret
    templates:
      - templates/valkeyfailover.yaml
    documentSelector:
      path: kind
      value: RedisFailover
    asserts:
      - equal:
          path: spec.auth.secretPath
          value: my-valkey.default.account

  - it: gives the operator no Secret without authentication
    templates:
      - templates/valkeyfailover.yaml
    set:
      authEnabled: false
    documentSelector:
      path: kind
      value: RedisFailover
    asserts:
      - notExists:
          path: spec.auth

  - it: renders no password Secret
    templates:
      - templates/valkeyfailover.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: my-valkey-auth
        not: true

  - it: grants the tenant no Secret
    templates:
      - templates/dashboard-resourcemap.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - lengthEqual:
          path: rules
          count: 2
      - equal:
          path: rules[0].resources
          value:
            - services
      - equal:
          path: rules[1].resources
          value:
            - workloadmonitors
