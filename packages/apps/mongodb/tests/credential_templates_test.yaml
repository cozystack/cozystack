suite: one CredentialTemplate per user, naming the account Secret the CR reads

# The template is the account the credentials API mints through; its name plus
# ".account" must be the passwordSecretRef mongodb.yaml gives the user, or the
# operator reads a Secret nobody writes.

templates:
  - templates/accounts.yaml

release:
  name: test-mongodb
  namespace: tenant-test

set:
  _cluster:
    cluster-domain: cozy.local
  databases:
    app:
      roles:
        admin:
          - web
          - Bob.Smith

tests:
  - it: renders nothing without users
    set:
      databases: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a template per user, named for the account Secret's mapping
    set:
      users:
        web: {}
        Bob.Smith: {}
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: CredentialTemplate
      - equal:
          path: apiVersion
          value: cozystack.io/v1alpha1
      - equal:
          path: metadata.name
          value: test-mongodb.bob-smith
        documentIndex: 0
      - equal:
          path: spec.username
          value: Bob.Smith
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-mongodb.web
        documentIndex: 1

  - it: stores the plaintext, with no label and no valuesPath
    set:
      users:
        web: {}
    asserts:
      - equal:
          path: spec.format.name
          value: plaintext
      - notExists:
          path: spec.secret
      - notExists:
          path: spec.valuesPath

  - it: refuses two users that map to one account
    set:
      users:
        web: {}
        Web: {}
    asserts:
      - failedTemplate:
          errorPattern: map to

  - it: refuses a user named like a system user
    set:
      users:
        databaseAdmin: {}
    asserts:
      - failedTemplate:
          errorPattern: reserved

  - it: refuses a user whose account name cannot be a Secret name
    set:
      users:
        _web: {}
    asserts:
      - failedTemplate:
          errorPattern: must start and end
