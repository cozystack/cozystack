suite: credentials tests

templates:
  - templates/credentials.yaml

release:
  name: test-mongodb
  namespace: tenant-test

set:
  _cluster:
    cluster-domain: cozy.local

tests:
  - it: renders the operator users Secret and the dashboard Secret
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: test-mongodb-percona-server-mongodb-users
          any: true
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: test-mongodb-credentials
          any: true

  - it: gives the dashboard a usable password on a first install
    asserts:
      - matchRegex:
          path: stringData.password
          pattern: ^[A-Za-z0-9]{24}$
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: builds a complete replica-set uri on a first install
    asserts:
      - matchRegex:
          path: stringData.uri
          pattern: ^mongodb://databaseAdmin:[A-Za-z0-9]{24}@test-mongodb-rs0\.tenant-test\.svc\.cozy\.local:27017/admin\?replicaSet=rs0$
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: sets username to databaseAdmin
    asserts:
      - equal:
          path: stringData.username
          value: databaseAdmin
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: sets port to 27017
    asserts:
      - equal:
          path: stringData.port
          value: "27017"
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: uses rs0 service for replica set mode
    set:
      sharding: false
    asserts:
      - equal:
          path: stringData.host
          value: test-mongodb-rs0.tenant-test.svc.cozy.local
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: uses mongos service and a uri without replicaSet for sharded mode
    set:
      sharding: true
    asserts:
      - equal:
          path: stringData.host
          value: test-mongodb-mongos.tenant-test.svc.cozy.local
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials
      - matchRegex:
          path: stringData.uri
          pattern: ^mongodb://databaseAdmin:[A-Za-z0-9]{24}@test-mongodb-mongos\.tenant-test\.svc\.cozy\.local:27017/admin$
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: uses custom cluster domain
    set:
      _cluster:
        cluster-domain: custom.domain
      sharding: false
    asserts:
      - equal:
          path: stringData.host
          value: test-mongodb-rs0.tenant-test.svc.custom.domain
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: defaults to cozy.local when cluster domain not set
    set:
      _cluster: {}
      sharding: false
    asserts:
      - equal:
          path: stringData.host
          value: test-mongodb-rs0.tenant-test.svc.cozy.local
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: fills every system user the operator expects
    asserts:
      - equal:
          path: stringData.MONGODB_BACKUP_USER
          value: backup
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
      - equal:
          path: stringData.MONGODB_CLUSTER_ADMIN_USER
          value: clusterAdmin
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
      - equal:
          path: stringData.MONGODB_CLUSTER_MONITOR_USER
          value: clusterMonitor
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
      - equal:
          path: stringData.MONGODB_DATABASE_ADMIN_USER
          value: databaseAdmin
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
      - equal:
          path: stringData.MONGODB_USER_ADMIN_USER
          value: userAdmin
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users

  - it: generates a password for every system user
    asserts:
      - matchRegex:
          path: stringData.MONGODB_BACKUP_PASSWORD
          pattern: ^[A-Za-z0-9]{24}$
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
      - matchRegex:
          path: stringData.MONGODB_CLUSTER_ADMIN_PASSWORD
          pattern: ^[A-Za-z0-9]{24}$
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
      - matchRegex:
          path: stringData.MONGODB_CLUSTER_MONITOR_PASSWORD
          pattern: ^[A-Za-z0-9]{24}$
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
      - matchRegex:
          path: stringData.MONGODB_DATABASE_ADMIN_PASSWORD
          pattern: ^[A-Za-z0-9]{24}$
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
      - matchRegex:
          path: stringData.MONGODB_USER_ADMIN_PASSWORD
          pattern: ^[A-Za-z0-9]{24}$
        documentSelector:
          path: metadata.name
          value: test-mongodb-percona-server-mongodb-users
