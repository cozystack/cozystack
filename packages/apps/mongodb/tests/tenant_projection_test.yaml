suite: mongodb TenantProjection sentinel

# The chart renders one TenantProjection per release: the declaration that tells
# the CA-extraction controller to lift ca.crt out of the key-bearing
# <release>-ssl into the tenant-readable <release>.tenant-ca projection.
#
# The load-bearing invariant is the ABSENCE of ownerReferences. The sentinel must
# carry none — it owns the projection, and it is itself owned only through the
# helm.toolkit.fluxcd.io/name label Flux stamps, which is how the lineage webhook
# resolves the application. An ownerReference here would short-circuit that walk
# and silently break the tenant's read path (pkg/lineage/lineage.go).

release:
  name: test-mongodb
  namespace: tenant-test

templates:
  - templates/tenant-projection.yaml

tests:
  - it: renders exactly one TenantProjection named after the release
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: TenantProjection
      - equal:
          path: apiVersion
          value: internal.cozystack.io/v1alpha1
      - equal:
          path: metadata.name
          value: test-mongodb-ca

  # The source is the leaf Secret, not the operator's <release>-ca-cert. That
  # one exists only on the cert-manager path and holds a single CA rather than
  # the merged old+new bundle the operator maintains through a rotation.
  #
  # This name is only correct because the CR asks the operator for that same
  # Secret. The other half is pinned in tls_test.yaml ("spec.secrets.ssl
  # references the operator-managed leaf secret by default"); rename one without
  # the other and the projection never becomes ready.
  - it: declares a CACert projection of the operator-issued leaf Secret
    asserts:
      - equal:
          path: spec.projections[0].type
          value: CACert
      - equal:
          path: spec.projections[0].sourceSecretName
          value: test-mongodb-ssl
      - equal:
          path: spec.projections[0].sourceKey
          value: ca.crt

  # THE invariant, and the only one here that breaks something. The controller
  # resolves the owning application by walking to the sentinel's
  # helm.toolkit.fluxcd.io/name label; an ownerReference short-circuits that
  # walk, and the tenant silently stops receiving the anchor.
  - it: carries no ownerReferences, so the lineage walk reaches the release
    asserts:
      - notExists:
          path: metadata.ownerReferences

  # Conformance to the shape Flux and the controller expect, not an invariant:
  # an explicit namespace or a chart-added label does not break the walk by
  # itself. Kept separate so the test above keeps its meaning — a single test
  # named for three unrelated properties reads as though all three were
  # load-bearing.
  - it: sets no namespace and adds no labels of its own
    asserts:
      - notExists:
          path: metadata.namespace
      - notExists:
          path: metadata.labels

  # Unlike qdrant, the sentinel is ungated: the operator mints the CA whatever
  # the chart asks for, so there is no plaintext release to skip.
  #
  # This is the only case that catches a gate keyed on `external` being TRUE —
  # every other test here renders with the default `external: false` and stays
  # green through one. Engines that do gate derive the condition from external
  # access, so that is the shape a gate copied from one of them would take.
  - it: renders regardless of external access or sharding
    set:
      external: true
      sharding: true
    asserts:
      - hasDocuments:
          count: 1

  - it: renders the source name from the release, not a fixed string
    release:
      name: other-mongodb
    asserts:
      - equal:
          path: metadata.name
          value: other-mongodb-ca
      - equal:
          path: spec.projections[0].sourceSecretName
          value: other-mongodb-ssl
