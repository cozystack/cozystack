suite: users read their passwords from the account Secrets

# mongodb.yaml must name the Secret accounts.yaml's template gets, and nothing
# a value can set.

templates:
  - templates/mongodb.yaml

release:
  name: test-mongodb
  namespace: tenant-test

set:
  _cluster:
    cluster-domain: cozy.local
  databases:
    app:
      roles:
        admin:
          - web
          - Bob.Smith

tests:
  - it: points each user's passwordSecretRef at its account Secret
    documentSelector:
      path: kind
      value: PerconaServerMongoDB
    set:
      users:
        Bob.Smith: {}
    asserts:
      - equal:
          path: spec.users[0].name
          value: Bob.Smith
      - equal:
          path: spec.users[0].passwordSecretRef
          value:
            name: test-mongodb.bob-smith.account
            key: password

  - it: ignores a password left in values
    documentSelector:
      path: kind
      value: PerconaServerMongoDB
    set:
      users:
        web:
          password: leftover-from-values
    asserts:
      - equal:
          path: spec.users[0].passwordSecretRef.name
          value: test-mongodb.web.account
      - notMatchRegex:
          path: spec.users[0].passwordSecretRef.name
          pattern: leftover

