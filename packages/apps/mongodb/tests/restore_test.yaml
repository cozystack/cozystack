suite: restore tests

templates:
  - templates/restore.yaml

tests:
  #####################
  # Rendering         #
  #####################

  - it: does not render when bootstrap is disabled
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders PerconaServerMongoDBRestore CR when enabled
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "my-backup-2025-01-07"
      backup:
        destinationPath: "s3://bucket/backups/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PerconaServerMongoDBRestore

  #####################
  # Validation        #
  #####################

  - it: fails when backupName is missing
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: ""
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: "bootstrap.backupName is required when bootstrap.enabled is true"

  - it: fails when destinationPath is missing
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "my-backup"
      backup:
        destinationPath: ""
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: "backup.destinationPath is required when bootstrap.enabled is true"

  - it: fails when endpointURL is missing
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "my-backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: ""
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: "backup.endpointURL is required when bootstrap.enabled is true"

  #####################
  # CR metadata       #
  #####################

  - it: uses correct restore CR name
    release:
      name: mydb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup-2025"
      backup:
        destinationPath: "s3://bucket/backups/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: metadata.name
          value: mydb-restore

  - it: references correct cluster name
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup-2025"
      backup:
        destinationPath: "s3://bucket/backups/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.clusterName
          value: test-mongodb

  #####################
  # Backup source     #
  #####################

  - it: sets backupSource type to logical
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup-2025"
      backup:
        destinationPath: "s3://bucket/backups/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.type
          value: logical

  - it: constructs destination from destinationPath and backupName
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "daily-backup-2025-01-07"
      backup:
        destinationPath: "s3://mybucket/mongodb/prod/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.destination
          value: s3://mybucket/mongodb/prod/daily-backup-2025-01-07

  - it: trims trailing slash from destinationPath
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.destination
          value: s3://bucket/path/backup

  #####################
  # S3 configuration  #
  #####################

  - it: references s3-creds secret
    release:
      name: mydb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.s3.credentialsSecret
          value: mydb-s3-creds

  - it: sets S3 endpoint URL
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "https://s3.amazonaws.com"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.s3.endpointUrl
          value: "https://s3.amazonaws.com"

  - it: disables insecureSkipTLSVerify
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.s3.insecureSkipTLSVerify
          value: false

  - it: enables forcePathStyle
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.s3.forcePathStyle
          value: true

  - it: sets bucket and prefix from destinationPath
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://mybucket/mongodb/prod/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.s3.bucket
          value: mybucket
      - equal:
          path: spec.backupSource.s3.prefix
          value: mongodb/prod/

  - it: keeps a prefix without a trailing slash as given
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://mybucket/mongodb/prod"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.s3.prefix
          value: mongodb/prod
      - equal:
          path: spec.backupSource.destination
          value: s3://mybucket/mongodb/prod/backup

  - it: sets an empty prefix when destinationPath is the bucket root
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://mybucket"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.s3.bucket
          value: mybucket
      - equal:
          path: spec.backupSource.s3.prefix
          value: ""
      - equal:
          path: spec.backupSource.destination
          value: s3://mybucket/backup

  - it: keeps a numeric bucket and prefix as strings
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://2024/10"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.backupSource.s3.bucket
          value: "2024"
      - equal:
          path: spec.backupSource.s3.prefix
          value: "10"

  - it: fails when destinationPath names no bucket
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: "backup.destinationPath must name a bucket (s3://bucket/path/) when bootstrap.enabled is true"

  - it: does not check the bucket when bootstrap is disabled
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: false
      backup:
        destinationPath: "s3://"
    asserts:
      - hasDocuments:
          count: 0

  #####################
  # PITR              #
  #####################

  - it: does not set pitr when recoveryTime not specified
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - notExists:
          path: spec.pitr

  - it: configures PITR when recoveryTime is set
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "my-backup"
        recoveryTime: "2025-01-07 14:30:00"
      backup:
        destinationPath: "s3://bucket/backups/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.pitr.type
          value: date
      - equal:
          path: spec.pitr.date
          value: "2025-01-07 14:30:00"

  #####################
  # S3 credentials    #
  #####################

  - it: fails when s3AccessKey is missing
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: ""
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3AccessKey is required when bootstrap.enabled is true"

  - it: fails when s3SecretKey is missing
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "backup.s3SecretKey is required when bootstrap.enabled is true"

  #####################
  # Selective restore #
  #####################

  - it: restores only the listed databases and keeps the application's users
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - shop
          - crm
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PerconaServerMongoDBRestore
      - equal:
          path: spec.selective
          value:
            withUsersAndRoles: false
            namespaces:
              - shop.*
              - crm.*

  - it: restores the whole backup when databases is empty
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases: []
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PerconaServerMongoDBRestore
      - notExists:
          path: spec.selective
        documentSelector:
          path: kind
          value: PerconaServerMongoDBRestore

  - it: restores the whole backup when databases is null
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases: null
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PerconaServerMongoDBRestore
      - notExists:
          path: spec.selective
        documentSelector:
          path: kind
          value: PerconaServerMongoDBRestore

  - it: fails on an empty database name
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - ""
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases has "", which is not a database name. A name cannot be empty or contain whitespace or any of / \ . " $ *'

  - it: fails on a database name with a dot
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - shop.orders
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases has "shop.orders", which is not a database name. A name cannot be empty or contain whitespace or any of / \ . " $ *'

  - it: fails on a wildcard, which would restore the whole backup with its users
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - "*"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases has "*", which is not a database name. A name cannot be empty or contain whitespace or any of / \ . " $ *'

  - it: fails on a database name with a dollar sign
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - shop$
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases has "shop$", which is not a database name. A name cannot be empty or contain whitespace or any of / \ . " $ *'

  - it: fails on a database name with whitespace
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - "my shop"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases has "my shop", which is not a database name. A name cannot be empty or contain whitespace or any of / \ . " $ *'

  - it: fails on a database name with a slash
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - shop/orders
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases has "shop/orders", which is not a database name. A name cannot be empty or contain whitespace or any of / \ . " $ *'

  - it: fails on the admin database, which holds the application's users
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - shop
          - admin
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases cannot list "admin", the admin, config and local databases belong to the application itself and are not restored selectively'

  - it: fails on the config database
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - config
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases cannot list "config", the admin, config and local databases belong to the application itself and are not restored selectively'

  - it: fails on the local database
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - local
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: 'bootstrap.databases cannot list "local", the admin, config and local databases belong to the application itself and are not restored selectively'

  - it: does not check databases when bootstrap is disabled
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: false
        databases:
          - shop.orders
    asserts:
      - hasDocuments:
          count: 0

  - it: restores selected databases to a point in time on a replica set
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      bootstrap:
        enabled: true
        backupName: "backup"
        recoveryTime: "2025-01-07 14:30:00"
        databases:
          - shop
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.pitr
          value:
            type: date
            date: "2025-01-07 14:30:00"
      - equal:
          path: spec.selective.namespaces
          value:
            - shop.*

  - it: fails on selected databases with a point in time on a sharded cluster
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      sharding: true
      bootstrap:
        enabled: true
        backupName: "backup"
        recoveryTime: "2025-01-07 14:30:00"
        databases:
          - shop
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - failedTemplate:
          errorMessage: "bootstrap.databases cannot be combined with bootstrap.recoveryTime when sharding is enabled, percona-backup-mongodb restores selected databases to a point in time on replica sets only"

  - it: restores selected databases on a sharded cluster without a point in time
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      sharding: true
      bootstrap:
        enabled: true
        backupName: "backup"
        databases:
          - shop
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.selective.namespaces
          value:
            - shop.*
      - notExists:
          path: spec.pitr
        documentSelector:
          path: kind
          value: PerconaServerMongoDBRestore

  - it: keeps a point-in-time restore of the whole backup on a sharded cluster
    release:
      name: test-mongodb
      namespace: tenant-test
    set:
      sharding: true
      bootstrap:
        enabled: true
        backupName: "backup"
        recoveryTime: "2025-01-07 14:30:00"
      backup:
        destinationPath: "s3://bucket/path/"
        endpointURL: "http://minio:9000"
        s3AccessKey: "access"
        s3SecretKey: "secret"
    asserts:
      - equal:
          path: spec.pitr.date
          value: "2025-01-07 14:30:00"
      - notExists:
          path: spec.selective
        documentSelector:
          path: kind
          value: PerconaServerMongoDBRestore
