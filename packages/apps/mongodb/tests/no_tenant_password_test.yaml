suite: no tenant password is rendered and the platform Secret is hidden

# Tenant passwords come from mints only. A value left under users.<name>.password
# must not reach any rendered object, and no per-user Secret is rendered.

templates:
  - templates/accounts.yaml
  - templates/credentials.yaml
  - templates/mongodb.yaml

release:
  name: test-mongodb
  namespace: tenant-test

set:
  _cluster:
    cluster-domain: cozy.local
  users:
    web:
      password: leftover-from-values
  databases:
    app:
      roles:
        admin:
          - web

tests:
  - it: renders no per-user Secret
    template: templates/credentials.yaml
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: test-mongodb-user-web
        not: true

  - it: keeps the leftover password out of the platform Secrets
    template: templates/credentials.yaml
    asserts:
      - notMatchRegex:
          path: stringData.password
          pattern: leftover
        documentSelector:
          path: metadata.name
          value: test-mongodb-credentials

  - it: renders the databaseAdmin copy as not tenant-visible
    template: templates/credentials.yaml
    documentSelector:
      path: metadata.name
      value: test-mongodb-credentials
    asserts:
      - equal:
          path: metadata.labels
          value:
            internal.cozystack.io/tenantresource: "false"
