{{- /*
  On the useSystemBucket flow the driver injects a storage that references the
  platform-projected cozy-backups-creds, so this chart-emitted Secret is skipped
  and tenants do not supply inline keys. Only the legacy flow (own S3, inline
  keys) materialises it.
*/}}
{{- if and (or .Values.backup.enabled .Values.bootstrap.enabled) (not .Values.backup.useSystemBucket) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-s3-creds
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "backup.s3AccessKey is required when backup or bootstrap is enabled without useSystemBucket" .Values.backup.s3AccessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "backup.s3SecretKey is required when backup or bootstrap is enabled without useSystemBucket" .Values.backup.s3SecretKey | quote }}
{{- end }}
