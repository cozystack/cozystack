{{- $clusterDomain := (index .Values._cluster "cluster-domain") | default "cozy.local" }}
{{- $usersSecretName := printf "%s-percona-server-mongodb-users" .Release.Name }}
{{- $existingUsers := lookup "v1" "Secret" .Release.Namespace $usersSecretName }}
{{- $operatorCopy := lookup "v1" "Secret" .Release.Namespace (printf "internal-%s-users" .Release.Name) }}

{{- $chartOwnsUsers := true }}
{{- if $existingUsers }}
  {{- $annotations := $existingUsers.metadata.annotations | default dict }}
  {{- if ne (index $annotations "meta.helm.sh/release-name" | default "") .Release.Name }}
    {{- $chartOwnsUsers = false }}
  {{- end }}
{{- end }}

{{- $systemUsers := list
      (dict "userKey" "MONGODB_BACKUP_USER" "passwordKey" "MONGODB_BACKUP_PASSWORD" "name" "backup")
      (dict "userKey" "MONGODB_CLUSTER_ADMIN_USER" "passwordKey" "MONGODB_CLUSTER_ADMIN_PASSWORD" "name" "clusterAdmin")
      (dict "userKey" "MONGODB_CLUSTER_MONITOR_USER" "passwordKey" "MONGODB_CLUSTER_MONITOR_PASSWORD" "name" "clusterMonitor")
      (dict "userKey" "MONGODB_DATABASE_ADMIN_USER" "passwordKey" "MONGODB_DATABASE_ADMIN_PASSWORD" "name" "databaseAdmin")
      (dict "userKey" "MONGODB_USER_ADMIN_USER" "passwordKey" "MONGODB_USER_ADMIN_PASSWORD" "name" "userAdmin") }}

{{- $resolved := dict }}
{{- range $user := $systemUsers }}
  {{- $name := $user.name }}
  {{- $password := "" }}
  {{- $fromChart := dict }}
  {{- if $existingUsers }}{{ $fromChart = $existingUsers.data | default dict }}{{ end }}
  {{- $fromOperator := dict }}
  {{- if $operatorCopy }}{{ $fromOperator = $operatorCopy.data | default dict }}{{ end }}
  {{- if hasKey $fromChart $user.passwordKey }}
    {{- $password = index $fromChart $user.passwordKey | b64dec }}
    {{- if hasKey $fromChart $user.userKey }}
      {{- $name = index $fromChart $user.userKey | b64dec }}
    {{- end }}
  {{- else if hasKey $fromOperator $user.passwordKey }}
    {{- $password = index $fromOperator $user.passwordKey | b64dec }}
    {{- if hasKey $fromOperator $user.userKey }}
      {{- $name = index $fromOperator $user.userKey | b64dec }}
    {{- end }}
  {{- else }}
    {{- $password = randAlphaNum 24 }}
  {{- end }}
  {{- $_ := set $resolved $user.userKey $name }}
  {{- $_ := set $resolved $user.passwordKey $password }}
{{- end }}

{{- $adminUser := index $resolved "MONGODB_DATABASE_ADMIN_USER" }}
{{- $adminPassword := index $resolved "MONGODB_DATABASE_ADMIN_PASSWORD" }}
{{- $host := printf "%s-rs0.%s.svc.%s" .Release.Name .Release.Namespace $clusterDomain }}
{{- $uri := printf "mongodb://%s:%s@%s:27017/admin?replicaSet=rs0" $adminUser (urlquery $adminPassword) $host }}
{{- if .Values.sharding }}
  {{- $host = printf "%s-mongos.%s.svc.%s" .Release.Name .Release.Namespace $clusterDomain }}
  {{- $uri = printf "mongodb://%s:%s@%s:27017/admin" $adminUser (urlquery $adminPassword) $host }}
{{- end }}

{{- if $chartOwnsUsers }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $usersSecretName }}
type: Opaque
stringData:
  {{- range $key := (keys $resolved | sortAlpha) }}
  {{ $key }}: {{ index $resolved $key | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
type: Opaque
stringData:
  username: {{ $adminUser | quote }}
  password: {{ $adminPassword | quote }}
  host: {{ $host | quote }}
  port: "27017"
  uri: {{ $uri | quote }}
