apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dashboard-resources
rules:
- apiGroups:
  - ""
  resources:
  - services
  resourceNames:
  - {{ .Release.Name }}-rs0
  - {{ .Release.Name }}-mongos
  - {{ .Release.Name }}-external
  verbs: ["get", "list", "watch"]
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - {{ .Release.Name }}-credentials
  verbs: ["get", "list", "watch"]
- apiGroups:
  - cozystack.io
  resources:
  - workloadmonitors
  resourceNames:
  - {{ .Release.Name }}
  verbs: ["get", "list", "watch"]
{{- /*
  Read on the application's own operator objects, so the tenant sees the
  cluster state, the backup names bootstrap.backupName takes, and how the
  bootstrap restore went. Backups get generated names and cannot be granted
  by name, so that rule covers the namespace, which holds only this tenant's
  applications.
*/}}
- apiGroups:
  - psmdb.percona.com
  resources:
  - perconaservermongodbs
  resourceNames:
  - {{ .Release.Name }}
  verbs: ["get", "list", "watch"]
- apiGroups:
  - psmdb.percona.com
  resources:
  - perconaservermongodbrestores
  resourceNames:
  - {{ .Release.Name }}-restore
  verbs: ["get", "list", "watch"]
- apiGroups:
  - psmdb.percona.com
  resources:
  - perconaservermongodbbackups
  verbs: ["get", "list", "watch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-dashboard-resources
subjects:
{{ include "cozy-lib.rbac.subjectsForTenantAndAccessLevel" (list "use" .Release.Namespace) }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dashboard-resources
  apiGroup: rbac.authorization.k8s.io
