{{- if .Values.bootstrap.enabled }}
{{- if .Values.backup.useSystemBucket }}
{{- fail "mongodb: bootstrap.enabled=true is incompatible with backup.useSystemBucket=true. bootstrap.enabled is not reset after a bootstrap restore completes, so set bootstrap.enabled=false before opting in; to restore from the system bucket use a backups.cozystack.io/RestoreJob against the cozy-default BackupClass instead. See docs/operations/backup-classes.md." }}
{{- end }}
{{- if not .Values.bootstrap.backupName }}
{{- fail "bootstrap.backupName is required when bootstrap.enabled is true" }}
{{- end }}
{{- if not .Values.backup.destinationPath }}
{{- fail "backup.destinationPath is required when bootstrap.enabled is true" }}
{{- end }}
{{- if not (include "mongodb.backup.bucket" .) }}
{{- fail "backup.destinationPath must name a bucket (s3://bucket/path/) when bootstrap.enabled is true" }}
{{- end }}
{{- with .Values.bootstrap.destinationPath }}
{{- if not (and (hasPrefix "s3://" .) (include "mongodb.s3.bucket" .)) }}
{{- fail "bootstrap.destinationPath must be an s3 path that names a bucket, like s3://bucket/path/" }}
{{- end }}
{{- end }}
{{- if not .Values.backup.endpointURL }}
{{- fail "backup.endpointURL is required when bootstrap.enabled is true" }}
{{- end }}
{{- if not .Values.backup.s3AccessKey }}
{{- fail "backup.s3AccessKey is required when bootstrap.enabled is true" }}
{{- end }}
{{- if not .Values.backup.s3SecretKey }}
{{- fail "backup.s3SecretKey is required when bootstrap.enabled is true" }}
{{- end }}
{{- /*
  The operator passes spec.selective to percona-backup-mongodb without the
  checks the pbm CLI makes on --ns, so the chart makes them. A "*" turns the
  restore back into a full one, users included.
*/}}
{{- range .Values.bootstrap.databases }}
{{- if not (regexMatch `^[^/\\. "$*[:space:]]+$` .) }}
{{- fail (printf "bootstrap.databases has %q, which is not a database name. A name cannot be empty or contain whitespace or any of / \\ . \" $ *" .) }}
{{- end }}
{{- if has . (list "admin" "config" "local") }}
{{- fail (printf "bootstrap.databases cannot list %q, the admin, config and local databases belong to the application itself and are not restored selectively" .) }}
{{- end }}
{{- end }}
{{- if and .Values.bootstrap.databases .Values.bootstrap.recoveryTime .Values.sharding }}
{{- fail "bootstrap.databases cannot be combined with bootstrap.recoveryTime when sharding is enabled, percona-backup-mongodb restores selected databases to a point in time on replica sets only" }}
{{- end }}
{{- /*
  The operator fails a restore for good when it is created before the cluster
  is ready and reports its backup version (percona-server-mongodb-operator#2243),
  so the restore is held back until then. The HelmRelease retries the failed
  render and it goes through once the cluster is ready. Backups must already
  be enabled on the live cluster, or that failed render would prevent its
  agents from starting. An existing restore is left alone, so later upgrades
  never wait here. Offline renders have no psmdb API and skip the check.
*/}}
{{- if .Capabilities.APIVersions.Has "psmdb.percona.com/v1" }}
{{- if not (lookup "psmdb.percona.com/v1" "PerconaServerMongoDBRestore" .Release.Namespace (printf "%s-restore" .Release.Name)) }}
{{- if not .Values.backup.enabled }}
{{- fail "bootstrap.enabled needs backup.enabled set to true, the restore runs in the backup agents that the operator starts only while backups are enabled" }}
{{- end }}
{{- $cluster := lookup "psmdb.percona.com/v1" "PerconaServerMongoDB" .Release.Namespace .Release.Name }}
{{- if not $cluster }}
{{- fail "bootstrap.enabled cannot be set while the application is being created. Create it with backup.enabled=true and bootstrap.enabled=false, wait until the database and its backup agents are ready, then set bootstrap.enabled=true" }}
{{- end }}
{{- if not (dig "spec" "backup" "enabled" false $cluster) }}
{{- fail "backups are not enabled on the existing cluster. First apply backup.enabled=true with bootstrap.enabled=false, wait until the database and its backup agents are ready, then set bootstrap.enabled=true" }}
{{- end }}
{{- $state := dig "status" "state" "" $cluster }}
{{- $backupVersion := dig "status" "backupVersion" "" $cluster }}
{{- if eq $state "error" }}
{{- fail "the bootstrap restore waits for a ready cluster, and the cluster state is error now. Check the cluster, the restore starts by itself once it is ready again" }}
{{- end }}
{{- if not (and (eq $state "ready") $backupVersion) }}
{{- $now := printf "the cluster state is %s now" $state }}
{{- if not $state }}
{{- $now = "the cluster has not reported a state yet" }}
{{- else if eq $state "ready" }}
{{- $now = "the backup agents have not reported their version yet" }}
{{- end }}
{{- fail (printf "the bootstrap restore waits until the database and its backup agents are ready, %s. It starts by itself once they are, nothing has to be changed" $now) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBRestore
metadata:
  name: {{ .Release.Name }}-restore
spec:
  clusterName: {{ .Release.Name }}
  {{- if .Values.bootstrap.recoveryTime }}
  pitr:
    type: date
    date: {{ .Values.bootstrap.recoveryTime | quote }}
  {{- end }}
  {{- with .Values.bootstrap.databases }}
  selective:
    withUsersAndRoles: false
    namespaces:
      {{- range . }}
      - {{ printf "%s.*" . | quote }}
      {{- end }}
  {{- end }}
  {{- $source := include "mongodb.bootstrap.path" . }}
  backupSource:
    type: logical
    destination: {{ $source | trimSuffix "/" }}/{{ .Values.bootstrap.backupName }}
    s3:
      bucket: {{ include "mongodb.s3.bucket" $source | quote }}
      prefix: {{ include "mongodb.s3.prefix" $source | quote }}
      credentialsSecret: {{ .Release.Name }}-s3-creds
      endpointUrl: {{ .Values.backup.endpointURL }}
      insecureSkipTLSVerify: {{ .Values.backup.insecureSkipTLSVerify | default false }}
      forcePathStyle: true
{{- end }}
