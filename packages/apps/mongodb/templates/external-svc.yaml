{{- /*
  External access for non-sharded replica sets is handled by the Percona
  MongoDB operator via `replsets[].expose` in mongodb.yaml: the operator
  creates one LoadBalancer per pod and rewrites rs.conf so the driver can
  discover the primary from outside the cluster (issue #2514). For sharded
  mode we still expose mongos through a single LoadBalancer because mongos
  is stateless and any router can route writes to the right shard primary.
*/}}
{{- /* Validated unconditionally: externalIPs without external: true is a
     configuration mistake worth reporting, and this file is the only place in
     the chart that consumes the value.

     Only the sharded path can be pinned. A replica set is exposed as one
     LoadBalancer per pod and the operator takes a single serviceAnnotations map
     for the whole replset, so one claim would be handed to every pod Service at
     once — the pins would collide instead of giving each pod its own address.
     That is the discovery-engine case community#45 defers; refuse it here
     rather than render a configuration that cannot work. */}}
{{- if and .Values.externalIPs (not .Values.sharding) }}
{{-   fail "externalIPs is only supported with sharding: true. A MongoDB replica set is published as one LoadBalancer per pod and the operator applies one annotation map to all of them, so a single claim cannot give each pod its own reserved address." }}
{{- end }}
{{- $externalIPs := include "cozy-lib.externalIP.claims" (list .Values.externalIPs .Values.external "mongos" (list "mongos") $) | fromYaml }}
{{- if and .Values.external .Values.sharding }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-external
  {{- with (include "cozy-lib.externalIP.annotations" (list $externalIPs "mongos" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  {{- if (include "cozy-lib.network.disableLoadBalancerNodePorts" $ | fromYaml) }}
  allocateLoadBalancerNodePorts: false
  {{- end }}
  ports:
  - name: mongodb
    port: 27017
  selector:
    app.kubernetes.io/name: percona-server-mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mongos
{{- end }}
