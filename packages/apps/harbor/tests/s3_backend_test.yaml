suite: harbor needs an S3 backend in its tenant chain
templates:
  - templates/bucket.yaml

release:
  name: harbor
  namespace: tenant-demo

tests:
  - it: claims the registry bucket from the nearest tenant with SeaweedFS
    set:
      _namespace:
        seaweedfs: tenant-root
    asserts:
      - equal:
          path: spec.bucketClassName
          value: tenant-root
        documentIndex: 0

  - it: refuses to render when no tenant up the chain runs SeaweedFS
    set:
      _namespace:
        seaweedfs: ""
    asserts:
      - failedTemplate:
          errorPattern: "harbor keeps images in S3, and neither this tenant nor a tenant above it runs SeaweedFS"
