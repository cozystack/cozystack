suite: per-release inner registry credential

# The inner registry authenticates core and jobservice with htpasswd basic
# auth. The vendored chart's default credential is published, so every release
# must carry its own, and it must survive upgrades unchanged: a new bcrypt
# hash on every render would restart the registry on every reconcile.

templates:
  - templates/harbor.yaml

release:
  name: harbor-test
  namespace: tenant-test

set:
  _namespace:
    host: example.org
    ingress: nginx
    gateway: ""
    seaweedfs: seaweedfs
  _cluster:
    solver: http01

tests:
  - it: generates a random password and a matching htpasswd line
    documentSelector:
      path: metadata.name
      value: harbor-test-registry-credentials
    asserts:
      - matchRegex:
          path: stringData.password
          pattern: ^[A-Za-z0-9]{32}$
      - matchRegex:
          path: stringData.htpasswd
          pattern: ^harbor_registry_user:\$2[aby]\$
      - notEqual:
          path: stringData.password
          value: harbor_registry_password

  - it: keeps the registry credential out of the tenant-visible secrets
    documentSelector:
      path: metadata.name
      value: harbor-test-registry-credentials
    asserts:
      - notExists:
          path: metadata.labels

  - it: passes the credential to the inner chart through valuesFrom
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - contains:
          path: spec.valuesFrom
          content:
            kind: Secret
            name: harbor-test-registry-credentials
            valuesKey: password
            targetPath: harbor.registry.credentials.password
      - contains:
          path: spec.valuesFrom
          content:
            kind: Secret
            name: harbor-test-registry-credentials
            valuesKey: htpasswd
            targetPath: harbor.registry.credentials.htpasswdString
      - equal:
          path: spec.values.harbor.registry.credentials.username
          value: harbor_registry_user
      - notExists:
          path: spec.values.harbor.registry.credentials.password

  - it: preserves an existing password and htpasswd pair
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: harbor-test-registry-credentials
            namespace: tenant-test
          data:
            password: a2VwdC1wYXNzd29yZA==
            htpasswd: aGFyYm9yX3JlZ2lzdHJ5X3VzZXI6JDJhJDEwJGtlcHRrZXB0a2VwdGtlcHRrZXB0a08=
    documentSelector:
      path: metadata.name
      value: harbor-test-registry-credentials
    asserts:
      - equal:
          path: stringData.password
          value: kept-password
      - equal:
          path: stringData.htpasswd
          value: harbor_registry_user:$2a$10$keptkeptkeptkeptkeptkO

  - it: regenerates both keys when the htpasswd line is missing
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: harbor-test-registry-credentials
            namespace: tenant-test
          data:
            password: a2VwdC1wYXNzd29yZA==
    documentSelector:
      path: metadata.name
      value: harbor-test-registry-credentials
    asserts:
      - notEqual:
          path: stringData.password
          value: kept-password
      - matchRegex:
          path: stringData.htpasswd
          pattern: ^harbor_registry_user:\$2[aby]\$
