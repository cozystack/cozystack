suite: nginx proxy and portal resources

release:
  name: harbor
  namespace: tenant-test

set:
  _namespace:
    host: example.org
    ingress: nginx
    gateway: ""
    seaweedfs: seaweedfs
  _cluster:
    solver: http01

tests:
  - it: sizes the nginx proxy with t1.small instead of leaving it to the namespace LimitRange
    template: templates/harbor.yaml
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - equal:
          path: spec.values.harbor.nginx.resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.values.harbor.nginx.resources.limits.cpu
          value: "1"
      - exists:
          path: spec.values.harbor.nginx.resources.requests.memory

  - it: sizes the portal with t1.micro
    template: templates/harbor.yaml
    documentSelector:
      path: kind
      value: HelmRelease
    asserts:
      - equal:
          path: spec.values.harbor.portal.resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.values.harbor.portal.resources.limits.cpu
          value: 500m
      - exists:
          path: spec.values.harbor.portal.resources.requests.memory

  - it: keeps both sizes when the other components are resized
    template: templates/harbor.yaml
    documentSelector:
      path: kind
      value: HelmRelease
    set:
      core:
        resourcesPreset: t1.nano
      registry:
        resources:
          cpu: "2"
          memory: 1Gi
      jobservice:
        resourcesPreset: t1.medium
    asserts:
      - equal:
          path: spec.values.harbor.core.resources.limits.memory
          value: 128Mi
      - equal:
          path: spec.values.harbor.registry.registry.resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.values.harbor.jobservice.resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.values.harbor.nginx.resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.values.harbor.portal.resources.limits.memory
          value: 256Mi
