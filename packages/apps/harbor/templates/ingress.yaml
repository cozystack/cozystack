{{- define "harbor.ingress.proxyAnnotations" -}}
nginx.ingress.kubernetes.io/proxy-body-size: "0"
nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
nginx.ingress.kubernetes.io/ssl-redirect: "true"
nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
{{- end }}
{{- $ingress := .Values._namespace.ingress }}
{{- $gateway := .Values._namespace.gateway | default "" }}
{{- $host := .Values._namespace.host }}
{{- $harborHost := .Values.host | default (printf "%s.%s" .Release.Name $host) }}
{{- $solver := (index .Values._cluster "solver") | default "http01" }}
{{- $clusterIssuer := (index .Values._cluster "issuer-name") | default "letsencrypt-prod" }}
{{- $wildcardSecret := (index .Values._cluster "wildcard-secret-name") | default "" }}
{{- if not $gateway }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    {{- include "harbor.ingress.proxyAnnotations" . | nindent 4 }}
    {{- with .Values.managementWhitelist }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," . | quote }}
    {{- end }}
    {{- /* Operator wildcard mode: nginx serves the default SSL cert, so skip per-host ACME. */}}
    {{- if not $wildcardSecret }}
    {{- if eq $solver "http01" }}
    acme.cert-manager.io/http01-ingress-ingressclassname: {{ $ingress }}
    {{- end }}
    cert-manager.io/cluster-issuer: {{ $clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ $ingress }}
  tls:
    - hosts:
        - {{ $harborHost | quote }}
      {{- /* Operator wildcard mode: no per-host secret — ingress-nginx falls
             back to the default SSL certificate while the tls section keeps
             the HTTP-to-HTTPS redirect enforced. */}}
      {{- if not $wildcardSecret }}
      secretName: {{ .Release.Name }}-ingress-tls
      {{- end }}
  rules:
    - host: {{ $harborHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 80
{{- /* whitelist-source-range is scoped to the locations of the Ingress that
       carries it, so the registry API and its token endpoint stay open on a
       second Ingress for the same host. /service/notifications is left behind
       the whitelist: it only takes internal job callbacks. The certificate is
       shared without the cert-manager annotations, otherwise ingress-shim
       sees two owners for one Certificate. */}}
{{- if .Values.managementWhitelist }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-registry-ingress
  annotations:
    {{- include "harbor.ingress.proxyAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ $ingress }}
  tls:
    - hosts:
        - {{ $harborHost | quote }}
      {{- if not $wildcardSecret }}
      secretName: {{ .Release.Name }}-ingress-tls
      {{- end }}
  rules:
    - host: {{ $harborHost | quote }}
      http:
        paths:
          {{- range list "/v2" "/service/token" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: 80
          {{- end }}
{{- end }}
{{- end }}
