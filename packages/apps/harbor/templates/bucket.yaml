{{- $seaweedfs := .Values._namespace.seaweedfs }}
{{- if not $seaweedfs }}
{{- fail "harbor keeps images in S3, and neither this tenant nor a tenant above it runs SeaweedFS" }}
{{- end }}
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: {{ .Release.Name }}-registry
spec:
  bucketClassName: {{ $seaweedfs }}
  protocols:
    - s3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: {{ .Release.Name }}-registry
spec:
  bucketAccessClassName: {{ $seaweedfs }}
  bucketClaimName: {{ .Release.Name }}-registry
  credentialsSecretName: {{ .Release.Name }}-registry-bucket
  protocol: s3
