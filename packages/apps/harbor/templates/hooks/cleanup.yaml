{{- $sharedTLS := eq (printf "%s-ingress-tls" .Release.Name) (index (.Values._cluster | default dict) "wildcard-secret-name" | default "") -}}
{{- $harborHost := .Values.host | default (printf "%s.%s" .Release.Name .Values._namespace.host) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Retry a transient API failure once, within the hook deadline.
  backoffLimit: 1
  activeDeadlineSeconds: 270
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          # Digest-pinned (immutable) and routed through the cluster images
          # registry via cozy-lib.image, so mirrored / air-gapped installs
          # resolve it and an upstream retag cannot change what runs at
          # uninstall. The tag+digest is refreshed by the "clastix/kubectl"
          # custom Renovate manager in .github/renovate.json (the helm-values
          # manager is disabled repo-wide), so this pin does not silently age.
          image: {{ include "cozy-lib.image" (list "clastix/kubectl:v1.32@sha256:b9ef7d8dbe65bcc81a46c09b8dc7543103055021c4f43287bf59e92a8f4fe05c" $) }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -u
              # Keep the failed Job and log; a missing object is already clean.
              failures=0
              fail() {
                failures=$((failures + 1))
                echo "ERROR: $*" >&2
              }

              # Both kept PVCs use release; trivy lacks app.kubernetes.io/instance.
              echo "Deleting orphaned PVCs for {{ .Release.Name }}-system..."
              kubectl delete pvc -n {{ .Release.Namespace }} \
                -l release={{ .Release.Name }}-system --ignore-not-found --wait=true --timeout=120s \
                || fail "failed to delete PVCs matching release={{ .Release.Name }}-system in {{ .Release.Namespace }}; orphaned PVCs may remain"

{{- if not $sharedTLS }}
{{ include "cozy-lib.hooks.deleteIngressTLS" (dict "key" (printf "%s-ingress-tls" .Release.Name) "host" $harborHost "namespace" .Release.Namespace) | indent 14 }}
              cleanup_ingress_tls || fail "TLS cleanup failed for {{ .Release.Name }}"
{{- end }}
              # Scope orphaned solvers to this host, not sibling apps.
              HOST="{{ $harborHost }}"
              echo "Sweeping orphaned ACME http01 solvers for host $HOST..."
              # A failed listing must not look like an empty result.
              if challenges=$(kubectl get challenge -n {{ .Release.Namespace }} \
                -o jsonpath="{range .items[?(@.spec.dnsName=='$HOST')]}{.metadata.name} {end}"); then
                for ch in $challenges; do
                  kubectl delete challenge -n {{ .Release.Namespace }} "$ch" --ignore-not-found \
                    || fail "failed to delete Challenge {{ .Release.Namespace }}/$ch for host $HOST; orphaned solver may remain"
                done
              else
                fail "failed to list Challenges in {{ .Release.Namespace }} for host $HOST; orphaned ACME solvers may remain"
              fi
              if solvers=$(kubectl get ingress -n {{ .Release.Namespace }} \
                -l acme.cert-manager.io/http01-solver=true \
                -o jsonpath="{range .items[?(@.spec.rules[0].host=='$HOST')]}{.metadata.name} {end}"); then
                for ing in $solvers; do
                  kubectl delete ingress -n {{ .Release.Namespace }} "$ing" --ignore-not-found \
                    || fail "failed to delete solver Ingress {{ .Release.Namespace }}/$ing for host $HOST; orphaned solver may remain"
                done
              else
                fail "failed to list solver Ingresses in {{ .Release.Namespace }} for host $HOST; orphaned ACME solvers may remain"
              fi

              if [ "$failures" -ne 0 ]; then
                echo "Cleanup FAILED for {{ .Release.Name }}: $failures operation(s) did not complete; see the errors above." >&2
                exit 1
              fi
              echo "Cleanup complete."
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-delete
    helm.sh/hook-weight: "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cleanup
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "delete"]
{{- if not $sharedTLS }}
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "delete"]
  # The TLS Secret of the Ingress Certificate, by name only, so the hook cannot
  # reach any other Secret in the tenant namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Release.Name }}-ingress-tls"]
    verbs: ["get", "delete"]
{{- end }}
  # Only Challenges are touched directly (the host-scoped sweep lists and
  # deletes them); Orders are cascade-deleted by cert-manager itself when the
  # Certificate is removed, so the hook needs no RBAC for them.
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["challenges"]
    verbs: ["get", "list", "watch", "delete"]
  # We list ACME http01 solver Ingresses (filtered by this release's host)
  # and delete the orphaned ones by name.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-delete
    helm.sh/hook-weight: "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cleanup
