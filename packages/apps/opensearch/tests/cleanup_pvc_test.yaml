suite: post-delete PVC cleanup hook

release:
  name: os-test
  namespace: tenant-test

templates:
  - templates/hooks/cleanup-pvc.yaml

tests:
  - it: renders a post-delete Job that deletes the PVCs labelled with the release's OpenSearchCluster
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: os-test-cleanup
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-delete
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.backoffLimit
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: os-test-cleanup
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl delete pvc -n tenant-test -l opster\.io/opensearch-cluster=os-test --ignore-not-found'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'exit 1'

  - it: pins the cleanup image by digest and routes it through the images registry
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^clastix/kubectl:v[0-9]+\.[0-9]+(\.[0-9]+)?@sha256:[0-9a-f]{64}$

  - it: prefixes the cleanup image with the cluster images registry when set
    documentSelector:
      path: kind
      value: Job
    set:
      _cluster:
        images-registry: registry.example.com
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^registry\.example\.com/clastix/kubectl:v[0-9]+\.[0-9]+(\.[0-9]+)?@sha256:[0-9a-f]{64}$

  - it: runs the cleanup container non-root with a restricted securityContext
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: grants get/list/watch/delete on persistentvolumeclaims and nothing else
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["persistentvolumeclaims"]
              verbs: ["get", "list", "watch", "delete"]

  - it: binds the cleanup ServiceAccount to the cleanup Role
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: roleRef.name
          value: os-test-cleanup
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: os-test-cleanup
