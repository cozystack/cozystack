{{- /*
Secrets cert-manager writes for the Certificates in certmanager.yaml. The
Dashboards one is listed even when dashboards.enabled is false, since it may
have been true earlier in the life of the release.
*/}}
{{- include "cozy-lib.hooks.deleteSecrets" (dict
      "root" .
      "secrets" (list
        (printf "%s.http-ca" .Release.Name)
        (printf "%s-http-server" .Release.Name)
        (printf "%s-dashboards-server" .Release.Name))) }}
