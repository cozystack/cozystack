{{- /*
Gated on the same condition as certmanager.yaml: the source Secret is minted by
the CA Certificate there, so it only exists under the cert-manager issuer. An
ungated sentinel would sit Ready=False/SourceNotFound on every operator-issued
release.

The source is the cert-manager CA Secret rather than a leaf: it is the anchor a
client needs, and the controller copies ca.crt alone, so the CA private key
stored alongside it under tls.key never leaves this namespace.

The version floor lives in opensearch.tls.certManagerIssued, not here, but Helm names this
file when it fires: of the three templates that call the helper, this is the one
it evaluates first, so the failure is reported against the line below.
*/}}
{{- if eq (include "opensearch.tls.certManagerIssued" .) "true" }}
---
apiVersion: internal.cozystack.io/v1alpha1
kind: TenantProjection
metadata:
  name: {{ .Release.Name }}-ca
spec:
  projections:
    - type: CACert
      sourceSecretName: {{ .Release.Name }}.http-ca
      sourceKey: ca.crt
{{- end }}
