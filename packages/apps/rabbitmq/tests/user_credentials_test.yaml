suite: RabbitMQ user credentials Secrets

templates:
  - templates/rabbitmq.yaml

release:
  name: myrabbitmq
  namespace: tenant-test

# messaging-topology-operator >= 1.20 caches only Secrets labelled
# rabbitmq.com/topology-operator=true, and its User admission webhook rejects an
# importCredentialsSecret that lacks the label. Losing it rejects every User the
# chart renders.

set:
  users:
    alice:
      password: alicepassword
    bobSmith:
      password: bobpassword

tests:
  - it: points each User at its own credentials Secret
    documentSelector:
      path: metadata.name
      value: myrabbitmq-bob-smith
    asserts:
      - isKind:
          of: User
      - equal:
          path: spec.importCredentialsSecret.name
          value: myrabbitmq-bob-smith-credentials

  - it: labels every credentials Secret for the topology operator's Secret cache
    documentSelector:
      path: kind
      value: Secret
      matchMany: true
    asserts:
      - equal:
          path: metadata.labels["rabbitmq.com/topology-operator"]
          value: "true"

