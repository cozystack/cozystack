suite: RabbitMQ users read their password from the account Secret

templates:
  - templates/rabbitmq.yaml

release:
  name: myrabbitmq
  namespace: tenant-test

# messaging-topology-operator re-imports importCredentialsSecret whenever the
# Secret changes, so pointing each User at the account Secret the credentials
# API writes is what makes a mint reach the broker. The User keeps its
# pre-conversion name: renaming it would make the operator delete the broker
# user and create it again.

set:
  users:
    alice: {}
    bobSmith: {}

tests:
  - it: points each User at its account Secret and keeps its name
    documentSelector:
      path: metadata.name
      value: myrabbitmq-bob-smith
    asserts:
      - isKind:
          of: User
      - equal:
          path: spec.importCredentialsSecret.name
          value: myrabbitmq.bobsmith.account
      - notExists:
          path: metadata.annotations

  - it: renders no Secret, so no password reaches the release
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
        not: true

  - it: ignores a password left in values
    set:
      users:
        alice:
          password: alicepassword
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
        not: true
      - notExists:
          path: metadata.annotations.config
        documentSelector:
          path: metadata.name
          value: myrabbitmq-alice

  - it: refuses two users that map to one account
    set:
      users:
        web: {}
        Web: {}
    asserts:
      - failedTemplate:
          errorPattern: map to
