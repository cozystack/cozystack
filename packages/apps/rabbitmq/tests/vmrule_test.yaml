suite: RabbitMQ alerts for the tenant vmalert

# One VMRule per release, in the release namespace where the tenant vmalert
# selects it. The release's VMServiceScrape stamps job=rabbitmq and
# service=<release> on every series, `up` included.

templates:
  - templates/vmrule.yaml

release:
  name: rabbitmq-test
  namespace: tenant-test

set:
  _cluster: {}

tests:
  - it: renders one VMRule for the release with the alert labels the portal expects
    documentSelector:
      path: kind
      value: VMRule
    asserts:
      - equal:
          path: metadata.name
          value: rabbitmq-test
      - equal:
          path: spec.groups[0].name
          value: rabbitmq.rabbitmq-test
      - lengthEqual:
          path: spec.groups[0].rules
          count: 3
      - equal:
          path: spec.groups[0].rules[0].alert
          value: RabbitMQNodeDown
      - equal:
          path: spec.groups[0].rules[0].labels
          value:
            namespace: tenant-test
            service: rabbitmq-test
            severity: critical
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'up\{\ namespace="tenant\-test",\ service="rabbitmq\-test",\ job="rabbitmq"\}\ ==\ 0'
      - equal:
          path: spec.groups[0].rules[1].alert
          value: RabbitMQMemoryAlarm
      - equal:
          path: spec.groups[0].rules[1].labels
          value:
            namespace: tenant-test
            service: rabbitmq-test
            severity: warning
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'rabbitmq_alarms_memory_used_watermark\{\ namespace="tenant\-test",\ service="rabbitmq\-test"\}\ ==\ 1'
      - equal:
          path: spec.groups[0].rules[2].alert
          value: RabbitMQUnroutableMessages
      - equal:
          path: spec.groups[0].rules[2].labels
          value:
            namespace: tenant-test
            service: rabbitmq-test
            severity: warning
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: 'rabbitmq_channel_messages_unroutable_dropped_total\{\ namespace="tenant\-test",\ service="rabbitmq\-test"\}\[10m\]\)\ or\ vector\(0\)\)'
