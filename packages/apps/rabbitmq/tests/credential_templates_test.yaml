suite: one CredentialTemplate per user, naming the account Secret the User imports

# The template is the account the credentials API mints through; its name plus
# ".account" must be the importCredentialsSecret rabbitmq.yaml gives the User,
# or the topology operator reads a Secret nobody writes.

templates:
  - templates/credentials.yaml

release:
  name: rabbitmq-test
  namespace: tenant-test

tests:
  - it: renders nothing without users
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a template per user, named for the account Secret's mapping
    set:
      users:
        web: {}
        Bob.Smith: {}
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: CredentialTemplate
      - equal:
          path: apiVersion
          value: cozystack.io/v1alpha1
      - equal:
          path: metadata.name
          value: rabbitmq-test.bob-smith
        documentIndex: 0
      - equal:
          path: spec.username
          value: Bob.Smith
        documentIndex: 0
      - equal:
          path: metadata.name
          value: rabbitmq-test.web
        documentIndex: 1

  - it: stores the plaintext the operator hashes, labelled for its Secret cache
    set:
      users:
        web: {}
    asserts:
      - equal:
          path: spec.format.name
          value: plaintext
      - equal:
          path: spec.secret.labels
          value:
            rabbitmq.com/topology-operator: "true"
      - notExists:
          path: spec.valuesPath

  - it: refuses two users that map to one account
    set:
      users:
        web: {}
        Web: {}
    asserts:
      - failedTemplate:
          errorPattern: map to

  - it: refuses a user that maps to no valid account name
    set:
      users:
        "-web": {}
    asserts:
      - failedTemplate:
          errorPattern: must start and end
