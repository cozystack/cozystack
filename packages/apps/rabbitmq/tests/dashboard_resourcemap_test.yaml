suite: RabbitMQ dashboard Role resource access

templates:
  - templates/dashboard-resourcemap.yaml

release:
  name: myrabbitmq
  namespace: tenant-test

# The Role grants no Secret in any state. The tenant accounts live in account
# Secrets that only the credentials API writes, <release>-default-user is the
# platform administrator messaging-topology-operator logs in with, and the TLS
# Secrets carry private keys (the key-free trust anchor goes through
# core.cozystack.io/tenantsecrets). Pinning the complete rule list, rather than
# the absence of known names, keeps a future Secret from slipping in.

tests:
  - it: grants the Service and the WorkloadMonitor only, TLS off
    set:
      tls.enabled: false
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [services]
              resourceNames: [myrabbitmq]
              verbs: ["get", "list", "watch"]
            - apiGroups: [cozystack.io]
              resources: [workloadmonitors]
              resourceNames: [myrabbitmq]
              verbs: ["get", "list", "watch"]

  - it: grants no Secret with TLS on, external and users defined
    set:
      tls.enabled: true
      external: true
      _namespace.host: example.com
      users:
        alice: {}
    documentIndex: 0
    asserts:
      - lengthEqual:
          path: rules
          count: 2
      - notContains:
          path: rules[0].resources
          content: secrets
      - notContains:
          path: rules[1].resources
          content: secrets

  - it: RoleBinding is rendered as second document
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.name
          value: myrabbitmq-dashboard-resources
