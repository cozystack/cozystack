{{- /*
  One CredentialTemplate per user: the account the Cozystack credentials API
  mints and revokes through. cozystack-controller keeps its account Secret,
  <release>.<account>.account, which the User's importCredentialsSecret names
  in rabbitmq.yaml. messaging-topology-operator watches that Secret and puts
  the password to the broker again whenever it changes, so a mint applies
  without a Helm run. The operator reads the plaintext and hashes it itself,
  hence the plaintext format; the label is the one its Secret cache and its
  User admission webhook require. The chart renders no password.
*/ -}}
{{- include "rabbitmq.accountsGuard" $ }}
{{- range $user, $_ := .Values.users }}
---
apiVersion: cozystack.io/v1alpha1
kind: CredentialTemplate
metadata:
  name: {{ printf "%s.%s" $.Release.Name (include "rabbitmq.accountName" $user) | quote }}
spec:
  username: {{ $user | quote }}
  format:
    name: plaintext
  secret:
    labels:
      rabbitmq.com/topology-operator: "true"
{{- end }}
