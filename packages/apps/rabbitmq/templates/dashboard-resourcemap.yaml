apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dashboard-resources
rules:
{{- /* No Secret is granted here. The tenant accounts live in account Secrets
     that only the credentials API writes and no role reads; a password is
     shown once, in the response of the mint that issued it. The operator's
     <release>-default-user is the platform's administrator, which
     messaging-topology-operator logs in with, so it is not the tenant's to
     read. No TLS Secret is granted either: both objects carrying ca.crt also
     carry a private key, and the tenant reads the key-free
     <release>.tenant-ca projection through core.cozystack.io/tenantsecrets. */}}
- apiGroups:
  - ""
  resources:
  - services
  resourceNames:
  - {{ .Release.Name }}
  verbs: ["get", "list", "watch"]
- apiGroups:
  - cozystack.io
  resources:
  - workloadmonitors
  resourceNames:
  - {{ .Release.Name }}
  verbs: ["get", "list", "watch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-dashboard-resources
subjects:
{{ include "cozy-lib.rbac.subjectsForTenantAndAccessLevel" (list "use" .Release.Namespace) }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dashboard-resources
  apiGroup: rbac.authorization.k8s.io
