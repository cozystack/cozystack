suite: kube-ovn Subnet rendering

templates:
  - templates/vpc.yaml

release:
  name: virtualprivatecloud-myvpc
  namespace: tenant-test

tests:
  - it: renders no allowSubnets on a subnet that declares none
    set:
      subnets:
        - name: plain
          cidr: "172.16.0.0/24"
    asserts:
      - notExists:
          path: spec.allowSubnets
        documentSelector:
          path: spec.cidrBlock
          value: "172.16.0.0/24"
      - equal:
          path: spec.private
          value: true
        documentSelector:
          path: spec.cidrBlock
          value: "172.16.0.0/24"

  - it: admits the declared CIDRs into the subnet while keeping it private
    set:
      subnets:
        - name: gateway
          cidr: "172.16.1.0/24"
          allowSubnets:
            - "192.168.1.0/24"
            - "10.20.0.0/16"
    asserts:
      - equal:
          path: spec.allowSubnets
          value:
            - "192.168.1.0/24"
            - "10.20.0.0/16"
        documentSelector:
          path: spec.cidrBlock
          value: "172.16.1.0/24"
      - equal:
          path: spec.private
          value: true
        documentSelector:
          path: spec.cidrBlock
          value: "172.16.1.0/24"

  - it: scopes allowSubnets to the subnet that declares it
    set:
      subnets:
        - name: plain
          cidr: "172.16.0.0/24"
        - name: gateway
          cidr: "172.16.1.0/24"
          allowSubnets:
            - "192.168.1.0/24"
    asserts:
      - notExists:
          path: spec.allowSubnets
        documentSelector:
          path: spec.cidrBlock
          value: "172.16.0.0/24"
      - equal:
          path: spec.allowSubnets
          value:
            - "192.168.1.0/24"
        documentSelector:
          path: spec.cidrBlock
          value: "172.16.1.0/24"

  - it: treats an empty allowSubnets list as unset
    set:
      subnets:
        - name: plain
          cidr: "172.16.0.0/24"
          allowSubnets: []
    asserts:
      - notExists:
          path: spec.allowSubnets
        documentSelector:
          path: spec.cidrBlock
          value: "172.16.0.0/24"

  # Kube-OVN parses localConnectIP as a CIDR (util.CheckCidrs) and fails the
  # whole Vpc reconcile, static and policy routes included, on a bare address.
  # Both ends of a pair land in the same /30: vpc-37739d sorts first and takes
  # .245, vpc-a0c9fc takes .246.
  - it: gives each end of a peering its address on a shared /30
    set:
      subnets:
        - name: plain
          cidr: "172.16.0.0/24"
      peers:
        - vpcName: other
          tenantNamespace: tenant-other
    documentSelector:
      path: kind
      value: Vpc
    asserts:
      - equal:
          path: spec.vpcPeerings
          value:
            - remoteVpc: vpc-37739d
              localConnectIP: "169.254.19.246/30"

  - it: gives the remote end of the same peering the other address of the /30
    release:
      name: virtualprivatecloud-other
      namespace: tenant-other
    set:
      subnets:
        - name: plain
          cidr: "172.17.0.0/24"
      peers:
        - vpcName: myvpc
          tenantNamespace: tenant-test
    documentSelector:
      path: kind
      value: Vpc
    asserts:
      - equal:
          path: spec.vpcPeerings
          value:
            - remoteVpc: vpc-a0c9fc
              localConnectIP: "169.254.19.245/30"
