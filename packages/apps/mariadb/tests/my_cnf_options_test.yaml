suite: MariaDB my.cnf server options

# Every shipped server version logs a "MySQL 5.6 / 5.7 compatible option"
# warning for the three MySQL-only options below. innodb_flush_method is
# deprecated from 11.8, where the default already is O_DIRECT, and a future
# release that removes it would refuse to start on an unknown variable.

templates:
  - templates/config.yaml

tests:
  - it: omits MySQL-only options on every version
    release:
      name: mariadb-test
      namespace: tenant-test
    asserts:
      - notMatchRegex:
          path: data["my.cnf"]
          pattern: default_authentication_plugin
      - notMatchRegex:
          path: data["my.cnf"]
          pattern: master_info_repository
      - notMatchRegex:
          path: data["my.cnf"]
          pattern: relay_log_info_repository

  - it: omits the deprecated flush method on v11.8
    release:
      name: mariadb-test
      namespace: tenant-test
    set:
      version: v11.8
    asserts:
      - notMatchRegex:
          path: data["my.cnf"]
          pattern: innodb_flush_method

  - it: keeps the flush method on versions that still need it
    release:
      name: mariadb-test
      namespace: tenant-test
    set:
      version: v10.6
    asserts:
      - matchRegex:
          path: data["my.cnf"]
          pattern: (?m)^innodb_flush_method=O_DIRECT_NO_FSYNC$
