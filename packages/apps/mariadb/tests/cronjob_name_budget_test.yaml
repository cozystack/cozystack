suite: mariadb backup CronJob name budget

# The API refuses a CronJob name over 52 characters, because the controller
# names each Job it starts <name>-<timestamp>, while a release name may take 53.
# Cutting the release name alone would give two long names one CronJob, so a
# name that does not fit is the release name cut to 38 characters, a hash of
# the full release name and -backup.

templates:
  - templates/backup-cronjob.yaml
  - templates/backup-script.yaml
  - templates/backup-secret.yaml

set:
  backup:
    enabled: true

tests:
  - it: keeps <release>-backup for a short release name
    release:
      name: mariadb-test
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: mariadb-test-backup

  - it: keeps the name when it lands exactly on 52 characters
    release:
      name: mariadb-abcdefghijklmnopqrstuvwxyz0123456789a
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: mariadb-abcdefghijklmnopqrstuvwxyz0123456789a-backup

  - it: shortens the name one character past the budget
    release:
      name: mariadb-abcdefghijklmnopqrstuvwxyz0123456789ab
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: mariadb-abcdefghijklmnopqrstuvwxyz0123-57a159-backup

  - it: fits a 53-character release name into 52 characters
    release:
      name: mariadb-abcdefghijklmnopqrstuvwxyz0123456789abcdefghi
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: mariadb-abcdefghijklmnopqrstuvwxyz0123-b5132c-backup
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9]([-a-z0-9]{0,50}[a-z0-9])?$

  - it: gives a release name differing only in its last character another CronJob
    release:
      name: mariadb-abcdefghijklmnopqrstuvwxyz0123456789abcdefghx
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: mariadb-abcdefghijklmnopqrstuvwxyz0123-a49389-backup

  - it: does not end the cut release name with a dash
    release:
      name: mariadb-abcdefghijklmnopqrstuvwxyz012-3456789abc
      namespace: tenant-test
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: mariadb-abcdefghijklmnopqrstuvwxyz012-2985e6-backup
