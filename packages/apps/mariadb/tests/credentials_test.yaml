suite: MariaDB credentials generation

# Passwords (including root) are always chart-generated (no plaintext input) and
# preserved across reconciles by the lookup in secret.yaml. This suite renders
# without a kubernetesProvider, so lookup() returns nothing and every render
# generates fresh passwords; the lookup-backed preserve path is covered in
# credentials_lookup_test.yaml.

release:
  name: mariadb-test
  namespace: tenant-test

templates:
  - templates/secret.yaml

tests:
  - it: always generates a root password even with no users
    asserts:
      - matchRegex:
          path: stringData.root
          pattern: ^[a-zA-Z0-9]{16}$
      - equal:
          # The watch label makes mariadb-operator react to a change on this
          # Secret (e.g. a newly added user's generated password) promptly rather
          # than on its --requeue-sql tick.
          path: metadata.labels["k8s.mariadb.com/watch"]
          value: ""

  - it: generates a 16-char alphanumeric password for each defined user
    set:
      users:
        testuser:
          maxUserConnections: 1000
    asserts:
      - matchRegex:
          path: stringData.testuser
          pattern: ^[a-zA-Z0-9]{16}$
      - matchRegex:
          path: stringData.root
          pattern: ^[a-zA-Z0-9]{16}$

  - it: ignores a value-supplied password and generates one instead
    # Pins the breaking-change contract: the schema no longer declares
    # `password`, but nothing rejects a leftover key, so prove it is dropped
    # rather than honoured.
    set:
      users:
        testuser:
          maxUserConnections: 1000
          password: value-supplied-secret
    asserts:
      - matchRegex:
          path: stringData.testuser
          pattern: ^[a-zA-Z0-9]{16}$
      - notMatchRegex:
          path: stringData.testuser
          pattern: value-supplied-secret
