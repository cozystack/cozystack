suite: MariaDB credentials Secret holds only root

# root is the platform's own account: mariadb-operator logs in with it, and
# rootPasswordSecretKeyRef cannot change once set, so it stays chart-generated
# in <release>-credentials. Tenant users have no password in this chart; each
# is a CredentialTemplate whose account Secret the platform keeps. This suite
# renders without a kubernetesProvider, so lookup() returns nothing; the
# preserve path is covered in credentials_lookup_test.yaml.

release:
  name: mariadb-test
  namespace: tenant-test

templates:
  - templates/secret.yaml

tests:
  - it: generates a root password even with no users
    asserts:
      - matchRegex:
          path: stringData.root
          pattern: ^[a-zA-Z0-9]{16}$

  - it: renders no tenant user's password
    set:
      users:
        testuser:
          maxUserConnections: 1000
    asserts:
      - notExists:
          path: stringData.testuser

  - it: ignores a value-supplied password
    set:
      users:
        testuser:
          maxUserConnections: 1000
          password: value-supplied-secret
    asserts:
      - notExists:
          path: stringData.testuser
      - notMatchRegex:
          path: stringData.root
          pattern: value-supplied-secret

  # The Secret is platform-only: the explicit "false" closes the tenantsecrets
  # route for a Secret the lineage webhook stamped "true" at first admission
  # and skips since, and nothing in it needs mariadb-operator's watch label,
  # since no User reads it.
  - it: is hidden from tenants and carries no watch label
    asserts:
      - equal:
          path: metadata.labels["internal.cozystack.io/tenantresource"]
          value: "false"
      - notExists:
          path: metadata.labels["k8s.mariadb.com/watch"]
