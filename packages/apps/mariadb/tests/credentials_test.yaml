suite: MariaDB credentials generation and rotation

# Passwords (including root) are always chart-generated (no plaintext input) and
# preserved across reconciles by the lookup in secret.yaml. Rotation is a
# data-driven trigger: the `mariadb.cozystack.io/password-rotation` annotation on
# the credentials Secret tracks .Values.passwordRotation.
#
# lookup() returns nothing under helm-unittest (no cluster), so every render here
# generates fresh passwords and writes the marker equal to the requested counter.
# The idempotent-preserve and counter-bump-regenerate paths both depend on a live
# lookup of an existing Secret, which helm-unittest cannot mock, so they are NOT
# exercised here and are not yet covered by an e2e assertion either — verify them
# manually against a cluster until such coverage exists.

release:
  name: mariadb-test
  namespace: tenant-test

templates:
  - templates/secret.yaml

tests:
  - it: always generates a root password even with no users
    asserts:
      - matchRegex:
          path: stringData.root
          pattern: ^[a-zA-Z0-9]{16}$

  - it: generates a 16-char alphanumeric password for each defined user
    set:
      users:
        testuser:
          maxUserConnections: 1000
    asserts:
      - matchRegex:
          path: stringData.testuser
          pattern: ^[a-zA-Z0-9]{16}$
      - matchRegex:
          path: stringData.root
          pattern: ^[a-zA-Z0-9]{16}$

  - it: ignores a value-supplied password and generates one instead
    # Pins the breaking-change contract: the schema no longer declares
    # `password`, but nothing rejects a leftover key, so prove it is dropped
    # rather than honoured.
    set:
      users:
        testuser:
          maxUserConnections: 1000
          password: value-supplied-secret
    asserts:
      - matchRegex:
          path: stringData.testuser
          pattern: ^[a-zA-Z0-9]{16}$
      - notMatchRegex:
          path: stringData.testuser
          pattern: value-supplied-secret

  - it: writes the rotation marker defaulting to "0"
    asserts:
      - equal:
          path: metadata.annotations["mariadb.cozystack.io/password-rotation"]
          value: "0"

  - it: reflects an explicit passwordRotation counter in the marker
    set:
      passwordRotation: 5
    asserts:
      - equal:
          path: metadata.annotations["mariadb.cozystack.io/password-rotation"]
          value: "5"
