suite: MariaDB root password preserved across renders, tenant keys dropped
release:
  name: mariadb-test
  namespace: tenant-test
templates:
  - templates/secret.yaml
tests:
  - it: preserves root and renders no key for a tenant user the old Secret held
    # The lookup in secret.yaml reads back root only. A tenant key left from
    # before the conversion is not rendered again; the conversion's finish Job
    # removes it from the live Secret's data.
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-test-credentials
            namespace: tenant-test
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
            root: ZXhpc3Rpbmdyb290
    set:
      users:
        testuser:
          maxUserConnections: 1000
    documentSelector:
      path: metadata.name
      value: mariadb-test-credentials
    asserts:
      - equal:
          path: stringData.root
          value: existingroot
      - notExists:
          path: stringData.testuser
