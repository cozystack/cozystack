suite: MariaDB credentials lookup-backed rotation paths
release:
  name: mariadb-test
  namespace: tenant-test
templates:
  - templates/secret.yaml
tests:
  - it: preserves existing passwords when the counter is unchanged
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-test-credentials
            namespace: tenant-test
            annotations:
              mariadb.cozystack.io/password-rotation: "0"
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
            root: ZXhpc3Rpbmdyb290
    set:
      users:
        testuser:
          maxUserConnections: 1000
      passwordRotation: 0
    documentSelector:
      path: metadata.name
      value: mariadb-test-credentials
    asserts:
      - equal:
          path: stringData.testuser
          value: existingpassword
      - equal:
          path: stringData.root
          value: existingroot
  - it: regenerates the app-user password on a bump while leaving root untouched
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-test-credentials
            namespace: tenant-test
            annotations:
              mariadb.cozystack.io/password-rotation: "0"
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
            root: ZXhpc3Rpbmdyb290
    set:
      users:
        testuser:
          maxUserConnections: 1000
      passwordRotation: 1
    documentSelector:
      path: metadata.name
      value: mariadb-test-credentials
    asserts:
      - notEqual:
          path: stringData.testuser
          value: existingpassword
      - matchRegex:
          path: stringData.testuser
          pattern: ^[a-zA-Z0-9]{16}$
      - equal:
          path: stringData.root
          value: existingroot
      - equal:
          path: metadata.annotations["mariadb.cozystack.io/password-rotation"]
          value: "1"
  - it: legacy secret without marker adopts baseline even when the counter is bumped
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-test-credentials
            namespace: tenant-test
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
            root: ZXhpc3Rpbmdyb290
    set:
      users:
        testuser:
          maxUserConnections: 1000
      passwordRotation: 1
    documentSelector:
      path: metadata.name
      value: mariadb-test-credentials
    asserts:
      - equal:
          path: stringData.testuser
          value: existingpassword
      - equal:
          path: stringData.root
          value: existingroot
      - equal:
          path: metadata.annotations["mariadb.cozystack.io/password-rotation"]
          value: "1"
