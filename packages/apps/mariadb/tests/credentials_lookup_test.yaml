suite: MariaDB credentials lookup-backed preservation
release:
  name: mariadb-test
  namespace: tenant-test
templates:
  - templates/secret.yaml
tests:
  - it: preserves existing passwords (including root) across renders
    # The lookup in secret.yaml reads back the current Secret, so each user keeps
    # the password already stored rather than getting a fresh one on every
    # reconcile. kubernetesProvider mocks that existing Secret.
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-test-credentials
            namespace: tenant-test
          data:
            testuser: ZXhpc3RpbmdwYXNzd29yZA==
            root: ZXhpc3Rpbmdyb290
    set:
      users:
        testuser:
          maxUserConnections: 1000
    documentSelector:
      path: metadata.name
      value: mariadb-test-credentials
    asserts:
      - equal:
          path: stringData.testuser
          value: existingpassword
      - equal:
          path: stringData.root
          value: existingroot
