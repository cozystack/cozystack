suite: one CredentialTemplate per tenant user, naming the account Secret the User reads

# The template is the account the credentials API mints through; its name plus
# ".account" must be the Secret user.yaml's passwordHashSecretKeyRef names, or
# mariadb-operator reads a Secret nobody writes and the User stays Ready=False.

templates:
  - templates/credentials.yaml
  - templates/user.yaml

release:
  name: mariadb-test
  namespace: tenant-test

tests:
  - it: renders nothing without users
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a template per user, named for the account Secret's mapping
    template: templates/credentials.yaml
    set:
      users:
        web: {maxUserConnections: 10}
        app.v2: {maxUserConnections: 10}
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: CredentialTemplate
      - equal:
          path: apiVersion
          value: cozystack.io/v1alpha1
      - equal:
          path: metadata.name
          value: mariadb-test.app-v2
        documentIndex: 0
      - equal:
          path: spec.username
          value: app.v2
        documentIndex: 0
      - equal:
          path: metadata.name
          value: mariadb-test.web
        documentIndex: 1

  - it: points each User at its template's account Secret
    template: templates/user.yaml
    set:
      users:
        app.v2: {maxUserConnections: 10}
    asserts:
      - equal:
          path: spec.passwordHashSecretKeyRef
          value:
            name: mariadb-test.app-v2.account
            key: password
      # Exactly one credential reference, from the first reconcile: the
      # operator's webhook refuses two, and a User with none is created
      # ACCOUNT LOCK PASSWORD EXPIRE for good.
      - notExists:
          path: spec.passwordSecretKeyRef
      - notExists:
          path: spec.passwordPlugin

  - it: stores the mysql_native_password hash and asks for the watch label
    template: templates/credentials.yaml
    set:
      users:
        web: {maxUserConnections: 10}
    asserts:
      - equal:
          path: spec.format.name
          value: mysql-native
      - equal:
          path: spec.secret.labels
          value:
            k8s.mariadb.com/watch: ""
      - notExists:
          path: spec.valuesPath

  - it: renders no template and no User for root, the platform's account
    set:
      users:
        root: {maxUserConnections: 10}
        web: {maxUserConnections: 10}
    asserts:
      - hasDocuments:
          count: 1
        template: templates/credentials.yaml
      - equal:
          path: spec.username
          value: web
        template: templates/credentials.yaml
      - hasDocuments:
          count: 1
        template: templates/user.yaml
      - equal:
          path: spec.name
          value: web
        template: templates/user.yaml

  - it: refuses two users that map to one account
    template: templates/credentials.yaml
    set:
      users:
        a.b: {maxUserConnections: 10}
        a-b: {maxUserConnections: 10}
    asserts:
      - failedTemplate:
          errorPattern: both map to the account name "a-b"

  - it: refuses a user whose account name is longer than a DNS label
    template: templates/credentials.yaml
    set:
      users:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {maxUserConnections: 10}
    asserts:
      - failedTemplate:
          errorPattern: at most 63 characters

  # "a_b" and "a-b" also share one User resource name. The pair fails on
  # upgrade as well as on install: such a release keeps its previous revision,
  # and the conversion leaves it out until one user is renamed.
  - it: refuses the "_"/"-" pair on upgrade too
    template: templates/credentials.yaml
    release:
      upgrade: true
    set:
      users:
        a_b: {maxUserConnections: 10}
        a-b: {maxUserConnections: 10}
    asserts:
      - failedTemplate:
          errorMessage: 'users "a-b" and "a_b" both map to the account name "a-b"; rename one of them'
