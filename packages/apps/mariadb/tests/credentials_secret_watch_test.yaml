suite: MariaDB credentials Secret is watched by mariadb-operator

templates:
  - templates/secret.yaml

tests:
  - it: labels the credentials Secret so a changed user password is re-applied
    release:
      name: mariadb-test
      namespace: tenant-test
    set:
      users:
        alice:
          password: rotated-password
          maxUserConnections: 10
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.labels["k8s.mariadb.com/watch"]
          value: ""
      - equal:
          path: stringData.alice
          value: rotated-password
