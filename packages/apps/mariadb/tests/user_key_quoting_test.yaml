suite: MariaDB User CR quotes a YAML-special username

# A username that is a bare YAML scalar — a number like `123`, or
# `true`/`false`/`no` — would render unquoted to a non-string, so spec.name
# would no longer be the account the CredentialTemplate names. It must be
# quoted.

release:
  name: mariadb-test
  namespace: tenant-test

templates:
  - templates/user.yaml

tests:
  - it: renders a numeric username as a string and reads the account Secret's hash
    set:
      users:
        "123":
          maxUserConnections: 10
    asserts:
      - equal:
          path: spec.name
          value: "123"
      - equal:
          path: spec.passwordHashSecretKeyRef
          value:
            name: mariadb-test.123.account
            key: password
