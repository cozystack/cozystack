suite: root password is always chart-generated, never taken from values

# root is special: the operator applies it once at datadir bootstrap via
# rootPasswordSecretKeyRef, so a value-supplied root password would be a
# plaintext credential in tenant values that cannot even be rotated. The chart
# forces root to a chart-generated password by overwriting any supplied entry
# (`set $usersWithRoot "root" dict`). Two independent facts are pinned. (1) A value
# that tries to set root's password is ignored and the Secret carries a freshly
# generated one; this holds because the generation loop never reads a supplied
# password for ANY user, so a mutation that only restores root's pass-through
# (guarding `set ... dict`) does not redden it -- that half is the general rule
# credentials_test.yaml covers. (2) The `set $usersWithRoot "root" dict` line's own
# job is to force root into the generated set even when the tenant never declares
# it: the second test declares no root and asserts the Secret still carries a
# generated root, so deleting that line drops root from the Secret and reddens it.

templates:
  - templates/secret.yaml

release:
  name: mdb-test
  namespace: tenant-test

tests:
  - it: ignores a value-supplied root password and generates one instead
    set:
      users:
        root:
          maxUserConnections: 10
          password: this-is-a-supplied-root-password-not-generated
    asserts:
      - matchRegex:
          path: stringData.root
          pattern: ^[a-zA-Z0-9]{16}$
      - notMatchRegex:
          path: stringData.root
          pattern: supplied

  # The `set $usersWithRoot "root" dict` line forces root into the generated set
  # even when the tenant never declares it. Declare no root and pin that the Secret
  # still carries a generated root password; deleting the line drops root from the
  # Secret entirely, reddening this — the specific mutation the header credits.
  - it: generates a root password even when root is not declared in users
    set:
      users:
        app:
          maxUserConnections: 10
    asserts:
      - matchRegex:
          path: stringData.root
          pattern: ^[a-zA-Z0-9]{16}$
