suite: secret rejects a username outside the safe charset

# A MariaDB username becomes a Kubernetes Secret data key, the spec.name of a
# mariadb-operator User CR, and (with "_" mapped to "-") the User CR's own
# metadata.name. A name outside the Secret-key charset renders a Secret and a
# User the apiserver later rejects with an opaque error; ".", ".." and names
# over 253 chars match the charset yet k8s IsConfigMapKey still rejects them.
# Postgres already guards this at render time; MariaDB must too, for parity and
# to name the offending username instead of failing opaquely at apply. There is
# no shell interpolation here (the operator applies the SQL), so this is a
# diagnosability guard, not an injection fix. Reverting the guard in secret.yaml
# lets the render succeed, so the first test fails.

templates:
  - templates/secret.yaml

release:
  name: mdb-test
  namespace: tenant-test

tests:
  - it: fails the render for a username with a space
    set:
      users:
        'a b':
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "a b": a username may contain only letters, digits and the characters -._ , must not be "." or start with "..", and must be at most 80 characters (the mariadb-operator User resource caps its name at 80, and the name also becomes a Kubernetes Secret key)'

  - it: fails the render for a username with a slash
    set:
      users:
        'a/b':
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "a/b": a username may contain only letters, digits and the characters -._ , must not be "." or start with "..", and must be at most 80 characters (the mariadb-operator User resource caps its name at 80, and the name also becomes a Kubernetes Secret key)'

  - it: fails the render for the reserved name "."
    set:
      users:
        '.':
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username ".": a username may contain only letters, digits and the characters -._ , must not be "." or start with "..", and must be at most 80 characters (the mariadb-operator User resource caps its name at 80, and the name also becomes a Kubernetes Secret key)'

  - it: fails the render for the reserved name ".."
    set:
      users:
        '..':
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "..": a username may contain only letters, digits and the characters -._ , must not be "." or start with "..", and must be at most 80 characters (the mariadb-operator User resource caps its name at 80, and the name also becomes a Kubernetes Secret key)'

  # IsConfigMapKey rejects ANY name starting with ".." (hasChDirPrefix), not just
  # the literal "..", so "..foo" is charset-legal yet cannot install.
  - it: fails the render for a name starting with ".."
    set:
      users:
        '..foo':
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "..foo": a username may contain only letters, digits and the characters -._ , must not be "." or start with "..", and must be at most 80 characters (the mariadb-operator User resource caps its name at 80, and the name also becomes a Kubernetes Secret key)'

  # The username names a mariadb-operator User, whose CRD caps spec.name at 80, so a
  # longer name is rejected by the apiserver at apply; cap it here (81 chars)
  # to name it at render. Reverting the cap to 253 lets this through.
  - it: fails the render for a username of 81 characters (past the User CRD limit)
    set:
      users:
        'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa':
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa": a username may contain only letters, digits and the characters -._ , must not be "." or start with "..", and must be at most 80 characters (the mariadb-operator User resource caps its name at 80, and the name also becomes a Kubernetes Secret key)'


  # The username also names the User CR (<release>-<name>, "_"->"-"), which k8s
  # requires to be a DNS-1123 subdomain: lowercase, alnum start/end. These pass
  # the Secret-key charset but the User CR name is invalid, so they cannot install
  # and must be named at render time rather than failing opaquely at apply.
  - it: fails the render for an uppercase username (invalid User CR name)
    set:
      users:
        Bob:
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "Bob": it also names the mariadb-operator User resource "mdb-test-Bob", which Kubernetes requires to be a DNS-1123 subdomain (lowercase letters, digits, "-" and ".", starting and ending with a letter or digit); use a lowercase name without a leading or trailing "-" or "."'

  - it: fails the render for a username with a trailing "-" (invalid User CR name)
    set:
      users:
        'foo-':
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "foo-": it also names the mariadb-operator User resource "mdb-test-foo-", which Kubernetes requires to be a DNS-1123 subdomain (lowercase letters, digits, "-" and ".", starting and ending with a letter or digit); use a lowercase name without a leading or trailing "-" or "."'

  - it: fails the render for a username with a trailing "." (invalid User CR name)
    set:
      users:
        'foo.':
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "foo.": it also names the mariadb-operator User resource "mdb-test-foo.", which Kubernetes requires to be a DNS-1123 subdomain (lowercase letters, digits, "-" and ".", starting and ending with a letter or digit); use a lowercase name without a leading or trailing "-" or "."'

  # "a_b" and "a-b" both render the User CR name <release>-a-b ("_" -> "-"), so
  # one silently overwrites the other on apply. The guard must reject the pair.
  - it: fails the render when two usernames collide after the "_"->"-" mapping
    set:
      users:
        a_b:
          maxUserConnections: 10
        a-b:
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'usernames "a-b" and "a_b" both map to the User resource name "mdb-test-a-b" ("_" renders as "-"); rename one of them'

  - it: renders normally for names using the full safe charset (root always added)
    set:
      users:
        a-b.c_1:
          maxUserConnections: 10
    asserts:
      - matchRegex:
          path: stringData["a-b.c_1"]
          pattern: ^[a-zA-Z0-9]{16}$

  # The "_"/"-" collision guard is gated to install. An existing release that
  # already carries the pair took the silent overwrite when it was first applied;
  # a platform-driven chart upgrade must not then wedge it into a failed reconcile
  # it cannot clear without editing users. On upgrade the colliding pair renders
  # instead of failing. Dropping ".Release.IsInstall" from the guard turns this
  # test red (the render fails on upgrade), the mutation signal that the gate is
  # load-bearing.
  - it: renders on upgrade for a colliding pair the install path rejects
    release:
      name: mdb-test
      namespace: tenant-test
      upgrade: true
    # A real upgrade finds the credentials Secret, so seed it: otherwise the
    # upgrade-with-missing-Secret guard fires first and this would not exercise the
    # collision gate at all.
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: mdb-test-credentials
            namespace: tenant-test
          data:
            root: cm9vdHNlZWRwYXNzd29yZDA=
    set:
      users:
        a_b:
          maxUserConnections: 10
        a-b:
          maxUserConnections: 10
    asserts:
      - matchRegex:
          path: stringData["a-b"]
          pattern: ^[a-zA-Z0-9]{16}$

  # On a first install there is no credentials Secret yet, so minting fresh
  # passwords is correct and the render succeeds (lookup returns nothing here).
  - it: mints on a first install when no credentials Secret exists
    set:
      users:
        app:
          maxUserConnections: 10
    asserts:
      - matchRegex:
          path: stringData.root
          pattern: ^[a-zA-Z0-9]{16}$

  # On an upgrade the Secret must exist; a lookup that finds nothing means it was
  # deleted or the release renamed, and re-minting would rotate every account (root
  # unrecoverable after bootstrap), so the render fails loudly. Removing the
  # .Release.IsUpgrade guard lets it mint instead — the mutation signal.
  - it: fails an upgrade when the credentials Secret is missing
    release:
      name: mdb-test
      namespace: tenant-test
      upgrade: true
    set:
      users:
        app:
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'mdb-test-credentials Secret not found while upgrading: refusing to mint fresh passwords, which would rotate every account and, because mariadb-operator applies root only at datadir bootstrap, leave the cluster advertising a root password it never set. If the Secret was deleted, restore it before upgrading (a first install does not hit this path).'

  # A charset/DNS-invalid name never applied at all, so its guard stays on the
  # upgrade path too: gating it would only defer the same failure to the apiserver
  # as an opaque error rather than naming the offending username here.
  - it: still fails on upgrade for an invalid User CR name
    release:
      name: mdb-test
      namespace: tenant-test
      upgrade: true
    set:
      users:
        Bob:
          maxUserConnections: 10
    asserts:
      - failedTemplate:
          errorMessage: 'invalid username "Bob": it also names the mariadb-operator User resource "mdb-test-Bob", which Kubernetes requires to be a DNS-1123 subdomain (lowercase letters, digits, "-" and ".", starting and ending with a letter or digit); use a lowercase name without a leading or trailing "-" or "."'
