{{- /*
  One CredentialTemplate per tenant user: the account the Cozystack
  credentials API mints and revokes through. cozystack-controller keeps its
  account Secret, <release>.<account>.account, holding the user name and the
  mysql_native_password hash; the User in user.yaml reads the hash through
  passwordHashSecretKeyRef, and the k8s.mariadb.com/watch label makes
  mariadb-operator re-run ALTER USER as soon as a mint rewrites the Secret.
  The chart renders no tenant password. root is a platform account and gets
  no template.
*/ -}}
{{- include "mariadb.accountsGuard" $ }}
{{- range $user, $_ := (include "mariadb.tenantUsers" $ | fromJson) }}
---
apiVersion: cozystack.io/v1alpha1
kind: CredentialTemplate
metadata:
  name: {{ printf "%s.%s" $.Release.Name (include "mariadb.accountName" $user) | quote }}
spec:
  username: {{ $user | quote }}
  format:
    name: mysql-native
  secret:
    labels:
      k8s.mariadb.com/watch: ""
{{- end }}
