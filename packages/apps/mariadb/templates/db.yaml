{{/*
  A database name also names Kubernetes resources: the Database CR
  {{ .Release.Name }}-{{ replace "_" "-" $name }} and, under it, each Grant. So
  the same DNS-1123 rule and "_"/"-" collision that the username guard enforces
  apply here — a name like "My.Db" or "foo-" renders but the apiserver rejects
  the Database CR with an opaque error, and two names differing only in "_" vs
  "-" collide on one Database CR (one silently overwrites the other). Reject both
  at render time, mirroring the username guard in secret.yaml. Database names are
  not Secret keys, so the DNS-1123 name is the binding rule.
*/}}
{{- $seenDBDNS := dict }}
{{- range $name, $db := .Values.databases }}
  {{- $crName := printf "%s-%s" $.Release.Name (replace "_" "-" $name) }}
  {{- if or (gt (len $crName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $crName)) }}
    {{- fail (printf "invalid database name %q: it also names the Database resource %q, which Kubernetes requires to be a DNS-1123 subdomain (lowercase letters, digits, \"-\" and \".\", starting and ending with a letter or digit); use a lowercase name without a leading or trailing \"-\" or \".\"" $name $crName) }}
  {{- end }}
  {{- $dbDNS := replace "_" "-" $name }}
  {{- if hasKey $seenDBDNS $dbDNS }}
    {{- fail (printf "database names %q and %q both map to the Database resource name %q (\"_\" renders as \"-\"); rename one of them" (index $seenDBDNS $dbDNS) $name (printf "%s-%s" $.Release.Name $dbDNS)) }}
  {{- end }}
  {{- $_ := set $seenDBDNS $dbDNS $name }}
{{- end }}

{{/*
  The Grant CR name is the join <release>-<dbDNS>-<userDNS>-<role>, so two
  DIFFERENT (database, user) pairs whose "-"/"_" split differently collide on one
  Grant even when each database and each username is individually unique and
  valid — e.g. (database "a", user "b-c") and (database "a-b", user "c") both
  render <release>-a-b-c-admin, and one silently overwrites the other at apply,
  dropping a privilege the tenant configured. The per-field guards above cannot
  see this; track the whole rendered Grant name and reject a collision.
*/}}
{{- $seenGrant := dict }}
{{- range $name, $db := .Values.databases }}
  {{- $dbDNS := replace "_" "-" $name }}
  {{- range $user := $db.roles.admin }}
    {{- $g := printf "%s-%s-%s-admin" $.Release.Name $dbDNS (replace "_" "-" $user) }}
    {{- $desc := printf "(database %q, user %q, admin)" $name $user }}
    {{- if hasKey $seenGrant $g }}
      {{- fail (printf "the Grant resource name %q is produced by both %s and %s (\"_\" renders as \"-\"); rename a database or user so their Grants do not collide" $g (index $seenGrant $g) $desc) }}
    {{- end }}
    {{- $_ := set $seenGrant $g $desc }}
  {{- end }}
  {{- range $user := $db.roles.readonly }}
    {{- $g := printf "%s-%s-%s-readonly" $.Release.Name $dbDNS (replace "_" "-" $user) }}
    {{- $desc := printf "(database %q, user %q, readonly)" $name $user }}
    {{- if hasKey $seenGrant $g }}
      {{- fail (printf "the Grant resource name %q is produced by both %s and %s (\"_\" renders as \"-\"); rename a database or user so their Grants do not collide" $g (index $seenGrant $g) $desc) }}
    {{- end }}
    {{- $_ := set $seenGrant $g $desc }}
  {{- end }}
{{- end }}
{{- range $name, $db := .Values.databases }}
{{ $dbDNSName := replace "_" "-" $name }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: {{ $.Release.Name }}-{{ $dbDNSName }}
spec:
  name: {{ $name | quote }}
  mariaDbRef:
    name: {{ $.Release.Name }}
  characterSet: utf8
  collate: utf8_general_ci
{{- range $user := $db.roles.admin }}
{{ $userDNSName := replace "_" "-" $user }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  # Scope the name by role: a user in both admin and readonly of one database
  # would otherwise render two Grant CRs under one metadata.name, and one would
  # silently overwrite the other on apply.
  name: {{ $.Release.Name }}-{{ $dbDNSName }}-{{ $userDNSName }}-admin
spec:
  mariaDbRef:
    name: {{ $.Release.Name }}
  privileges: ['ALL']
  database: {{ $name | quote }}
  table: "*"
  username: {{ $user | quote }}
  grantOption: true
{{- end }}
{{- range $user := $db.roles.readonly }}
{{ $userDNSName := replace "_" "-" $user }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: {{ $.Release.Name }}-{{ $dbDNSName }}-{{ $userDNSName }}-readonly
spec:
  mariaDbRef:
    name: {{ $.Release.Name }}
  privileges: ['SELECT']
  database: {{ $name | quote }}
  table: "*"
  username: {{ $user | quote }}
  grantOption: true
{{- end }}

{{- end }}
