apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dashboard-resources
rules:
- apiGroups:
  - ""
  resources:
  - services
  resourceNames:
  # The bare <name> service exists in both topologies; -primary/-secondary
  # only when replication is on (replicas>1). Grant exactly what exists so the
  # RBAC matches the services the ApplicationDefinition (mariadb-rd) lists.
  - {{ .Release.Name }}
  {{- if gt (int .Values.replicas) 1 }}
  - {{ .Release.Name }}-primary
  - {{ .Release.Name }}-secondary
  {{- end }}
  verbs: ["get", "list", "watch"]
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - {{ .Release.Name }}-credentials
  verbs: ["get", "list", "watch"]
# The TLS Secrets are deliberately NOT granted here, key-bearing or not.
# .ca-tls and the operator's own -ca hold the CA private key, .tls holds the
# server private key, and -ca-bundle — while key-free — is still an operator
# Secret exposed by name rather than through the platform-vouched-for path.
#
# The trust anchor reaches the tenant as the key-free <release>.tenant-ca
# projection instead, through core.cozystack.io/tenantsecrets — which the base
# tenant roles already grant and which gates on the internal.cozystack.io/
# tenantresource label the lineage webhook stamps. Granting that projection by
# NAME here would be wrong too: a name grant conveys whatever occupies the
# name, whereas the label path conveys only what the platform vouched for. A
# name grant is gated on a string; the label path is gated on provenance.
- apiGroups:
  - cozystack.io
  resources:
  - workloadmonitors
  resourceNames:
  - {{ .Release.Name }}
  verbs: ["get", "list", "watch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-dashboard-resources
subjects:
{{ include "cozy-lib.rbac.subjectsForTenantAndAccessLevel" (list "use" .Release.Namespace) }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dashboard-resources
  apiGroup: rbac.authorization.k8s.io
