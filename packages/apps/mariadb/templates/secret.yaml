{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $passwords := dict }}

{{- with (index $existingSecret "data") }}
  {{- range $k, $v := . }}
    {{- $_ := set $passwords $k (b64dec $v) }}
  {{- end }}
{{- end }}

{{/*
  Reject a username outside the Secret-key charset before it becomes a Secret
  data key, the spec.name of a mariadb-operator User CR and (with "_" mapped to
  "-") that User's metadata.name. The apiserver would reject such a name later
  as an invalid Secret key or resource name, but only once Flux applies the
  render, as an opaque error; failing here names the offending username. The
  check mirrors k8s IsConfigMapKey (the charset plus its rejection of ".", of any
  name starting with ".."). The length cap is 80 because the mariadb-operator
  User CRD caps spec.name at 80 (the server itself allows 128): the apiserver
  rejects a longer User at apply, so capping here names it at render instead. So
  it rejects nothing that could otherwise install. There is no shell interpolation here (the operator
  applies the SQL), so this is a diagnosability guard, not an injection fix;
  postgres carries the analogous guard in its init-script.
*/}}
{{- range $user, $u := .Values.users }}
  {{- if or (not (regexMatch "^[-._a-zA-Z0-9]+$" $user)) (eq $user ".") (hasPrefix ".." $user) (gt (len $user) 80) }}
    {{- fail (printf "invalid username %q: a username may contain only letters, digits and the characters -._ , must not be \".\" or start with \"..\", and must be at most 80 characters (the mariadb-operator User resource caps its name at 80, and the name also becomes a Kubernetes Secret key)" $user) }}
  {{- end }}
{{- end }}

{{/*
  The username also names the User CR: user.yaml renders
  {{ .Release.Name }}-{{ replace "_" "-" $name }} as metadata.name, and Kubernetes
  requires that to be a DNS-1123 subdomain (lowercase, alnum start/end) — a
  stricter charset than the Secret key above, which permits uppercase and a
  leading/trailing "-"/".". A name like "Bob", "foo-" or "foo." passes the Secret
  charset yet renders an invalid User name that the apiserver rejects at apply with
  an opaque error. Validate the rendered User name against the DNS-1123 subdomain
  rule so such a username is named here instead. Checked on the full rendered name
  so the "-" join to the release prefix (e.g. a leading-dot username) is covered.
*/}}
{{- range $user, $u := .Values.users }}
  {{- $crName := printf "%s-%s" $.Release.Name (replace "_" "-" $user) }}
  {{- if or (gt (len $crName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $crName)) }}
    {{- fail (printf "invalid username %q: it also names the mariadb-operator User resource %q, which Kubernetes requires to be a DNS-1123 subdomain (lowercase letters, digits, \"-\" and \".\", starting and ending with a letter or digit); use a lowercase name without a leading or trailing \"-\" or \".\"" $user $crName) }}
  {{- end }}
{{- end }}

{{/*
  user.yaml renders each User CR as {{ .Release.Name }}-{{ replace "_" "-" $name }},
  so two usernames that differ only in "_" vs "-" (e.g. "a_b" and "a-b") collide on
  one User resource name. range sorts keys, so the later one silently overwrites the
  earlier User CR on apply — one user ends up with a credentials-Secret entry but no
  backing mariadb-operator User (no error, no warning). Reject the collision on a
  fresh install, naming both offenders, rather than create a half-configured user.
  Gated to install: an existing release that already carries the pair took the
  overwrite when it was first applied, so a platform-driven chart upgrade must not
  wedge it into a failed reconcile it cannot clear without editing users — blocking
  the upgrade would only make a running release worse, since one of the two Users is
  live. The charset and DNS-1123 guards above stay on both paths because an invalid
  name never applied at all.
*/}}
{{- $seenDNS := dict }}
{{- range $user, $u := .Values.users }}
  {{- $dns := replace "_" "-" $user }}
  {{- if and $.Release.IsInstall (hasKey $seenDNS $dns) }}
    {{- fail (printf "usernames %q and %q both map to the User resource name %q (\"_\" renders as \"-\"); rename one of them" (index $seenDNS $dns) $user (printf "%s-%s" $.Release.Name $dns)) }}
  {{- end }}
  {{- $_ := set $seenDNS $dns $user }}
{{- end }}

{{/*
  Distinguish a first install from an upgrade whose lookup came back empty. Every
  password below (root included) is minted only when the lookup did not already
  carry it, so an upgrade that finds NO credentials Secret at all -- deleted, or
  the release renamed out from under it -- would silently re-mint all of them.
  Helm's lookup returns empty only on a genuine NotFound, so a normal upgrade finds
  the Secret and this never fires; when it does, the Secret is really gone and
  re-minting would rotate every account. root is the sharp edge: mariadb-operator
  writes rootPasswordSecretKeyRef only at datadir bootstrap, so a fresh root value
  on an existing cluster is advertised but never applied and the real root password
  is lost for good. Fail instead, and let a first install (no Secret expected)
  through.
*/}}
{{- if and .Release.IsUpgrade (not $existingSecret) }}
  {{- fail (printf "%s-credentials Secret not found while upgrading: refusing to mint fresh passwords, which would rotate every account and, because mariadb-operator applies root only at datadir bootstrap, leave the cluster advertising a root password it never set. If the Secret was deleted, restore it before upgrading (a first install does not hit this path)." .Release.Name) }}
{{- end }}

{{/* root is always chart-managed and never accepts a value-supplied password. */}}
{{- $usersWithRoot := deepCopy .Values.users }}
{{- $_ := set $usersWithRoot "root" dict }}

{{/*
  Passwords (root included) are always chart-generated and preserved across
  reconciles via the lookup above: a user keeps whatever password is already
  stored in the Secret, and only a user without one yet gets a freshly generated
  value.
*/}}
{{- range $user, $u := $usersWithRoot }}
  {{- if not (index $passwords $user) }}
    {{- $_ := set $passwords $user (randAlphaNum 16) }}
  {{- end }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- /*
      mariadb-operator only re-applies a User password from its
      passwordSecretKeyRef when the referenced Secret carries this label; without
      it a change to this Secret (e.g. a newly added user's generated password)
      reaches the server only on the operator's --requeue-sql tick (10h + up to 1h
      of jitter) instead of promptly. (root is not indexed on the Secret at all -
      MariaDB.spec.rootPasswordSecretKeyRef lands only at datadir bootstrap.)
    */}}
    k8s.mariadb.com/watch: ""
stringData:
  {{- range $name, $u := $usersWithRoot }}
  {{ $name | quote }}: {{ index $passwords $name | quote }}
  {{- end }}
