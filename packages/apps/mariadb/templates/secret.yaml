{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $passwords := dict }}

{{- with (index $existingSecret "data") }}
  {{- range $k, $v := . }}
    {{- $_ := set $passwords $k (b64dec $v) }}
  {{- end }}
{{- end }}

{{/* root is always chart-managed and never accepts a value-supplied password. */}}
{{- $usersWithRoot := deepCopy .Values.users }}
{{- $_ := set $usersWithRoot "root" dict }}

{{/*
  Passwords are always chart-generated and preserved across reconciles via the
  lookup above. Rotation is an explicit, data-driven trigger: the counter is
  persisted in the Secret's annotation (kept out of stringData so it can never
  collide with a user named after the marker) and compared with
  .Values.passwordRotation. A missing marker (pre-rotation releases) is treated
  as "adopt current baseline", so an in-place upgrade never regenerates a live
  password on its own — only a counter bump does.
*/}}
{{- $rotationAnnotation := "mariadb.cozystack.io/password-rotation" }}
{{- $existingMeta := (index $existingSecret "metadata") | default dict }}
{{- $existingAnnotations := (index $existingMeta "annotations") | default dict }}
{{- $storedRotation := index $existingAnnotations $rotationAnnotation | default "" }}
{{- $wantRotation := .Values.passwordRotation | toString }}
{{- $rotate := and (ne $storedRotation "") (ne $wantRotation $storedRotation) }}

{{- range $user, $u := $usersWithRoot }}
  {{/*
    root is auto-generated but never rotated by the counter: mariadb-operator
    only applies MariaDB.spec.rootPasswordSecretKeyRef at datadir bootstrap, so
    changing it in the Secret afterwards would desync the advertised password
    from the live grant and lock root out. Only the application users, which the
    operator reconciles through their User CRs, take part in rotation.
  */}}
  {{- $rotateThis := and $rotate (ne $user "root") }}
  {{- if or (not (index $passwords $user)) $rotateThis }}
    {{- $_ := set $passwords $user (randAlphaNum 16) }}
  {{- end }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  annotations:
    {{ $rotationAnnotation }}: {{ $wantRotation | quote }}
stringData:
  {{- range $name, $u := $usersWithRoot }}
  {{ $name | quote }}: {{ index $passwords $name | quote }}
  {{- end }}
