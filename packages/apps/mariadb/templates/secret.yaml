{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $existingRoot := "" }}
{{- with (index $existingSecret "data") }}
  {{- with .root }}
    {{- $existingRoot = b64dec . }}
  {{- end }}
{{- end }}

{{/*
  Reject a username outside the safe charset before it becomes the spec.name
  of a mariadb-operator User CR and (with "_" mapped to "-") that User's
  metadata.name. The apiserver would reject such a name later as an invalid
  resource name, but only once Flux applies the render, as an opaque error;
  failing here names the offending username. The check mirrors k8s
  IsConfigMapKey (the charset plus its rejection of ".", of any
  name starting with ".."). The length cap is 80 because the mariadb-operator
  User CRD caps spec.name at 80 (the server itself allows 128): the apiserver
  rejects a longer User at apply, so capping here names it at render instead. So
  it rejects nothing that could otherwise install. There is no shell interpolation here (the operator
  applies the SQL), so this is a diagnosability guard, not an injection fix;
  postgres carries the analogous guard in its init-script.
*/}}
{{- range $user, $u := .Values.users }}
  {{- if or (not (regexMatch "^[-._a-zA-Z0-9]+$" $user)) (eq $user ".") (hasPrefix ".." $user) (gt (len $user) 80) }}
    {{- fail (printf "invalid username %q: a username may contain only letters, digits and the characters -._ , must not be \".\" or start with \"..\", and must be at most 80 characters (the mariadb-operator User resource caps its name at 80)" $user) }}
  {{- end }}
{{- end }}

{{/*
  The username also names the User CR: user.yaml renders
  {{ .Release.Name }}-{{ replace "_" "-" $name }} as metadata.name, and Kubernetes
  requires that to be a DNS-1123 subdomain (lowercase, alnum start/end) — a
  stricter charset than the one above, which permits uppercase and a
  leading/trailing "-"/".". A name like "Bob", "foo-" or "foo." passes that
  charset yet renders an invalid User name that the apiserver rejects at apply with
  an opaque error. Validate the rendered User name against the DNS-1123 subdomain
  rule so such a username is named here instead. Checked on the full rendered name
  so the "-" join to the release prefix (e.g. a leading-dot username) is covered.
*/}}
{{- range $user, $u := .Values.users }}
  {{- $crName := printf "%s-%s" $.Release.Name (replace "_" "-" $user) }}
  {{- if or (gt (len $crName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $crName)) }}
    {{- fail (printf "invalid username %q: it also names the mariadb-operator User resource %q, which Kubernetes requires to be a DNS-1123 subdomain (lowercase letters, digits, \"-\" and \".\", starting and ending with a letter or digit); use a lowercase name without a leading or trailing \"-\" or \".\"" $user $crName) }}
  {{- end }}
{{- end }}

{{/*
  Two usernames that differ only in "_" vs "-" (e.g. "a_b" and "a-b") would
  also share one User resource name; they map to one account name as well, so
  mariadb.accountsGuard (credentials.yaml) refuses the pair on every path.
*/}}

{{/*
  Distinguish a first install from an upgrade whose lookup came back empty.
  root is minted only when the lookup did not already carry it, so an upgrade
  that finds NO credentials Secret at all -- deleted, or the release renamed
  out from under it -- would silently re-mint it. Helm's lookup returns empty
  only on a genuine NotFound, so a normal upgrade finds the Secret and this
  never fires. mariadb-operator applies rootPasswordSecretKeyRef only at
  datadir bootstrap, so a fresh root value on an existing cluster is
  advertised but never applied and the real root password is lost for good.
  Fail instead, and let a first install (no Secret expected) through.
*/}}
{{- if and .Release.IsUpgrade (not $existingSecret) }}
  {{- fail (printf "%s-credentials Secret not found while upgrading: refusing to mint a fresh root password, which mariadb-operator applies only at datadir bootstrap, so the cluster would advertise a root password it never set. If the Secret was deleted, restore it before upgrading (a first install does not hit this path)." .Release.Name) }}
{{- end }}

{{/*
  root is the platform's own account: mariadb-operator logs in with it on
  every SQL reconcile, and rootPasswordSecretKeyRef cannot change once set,
  so it stays here, chart-generated and preserved across reconciles by the
  lookup above. Tenant users have no password in this chart: each one is an
  account Secret the credentials API mints into (credentials.yaml).
*/}}
{{- $rootPassword := $existingRoot | default (randAlphaNum 16) }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- /*
      Platform-only. The ApplicationDefinition no longer selects this Secret
      and no Role grants it; the explicit "false" also closes the
      tenantsecrets route for a Secret the lineage webhook stamped "true" at
      first admission and skips since.
    */}}
    internal.cozystack.io/tenantresource: "false"
stringData:
  root: {{ $rootPassword | quote }}
