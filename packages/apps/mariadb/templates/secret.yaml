{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $passwords := dict }}

{{- with (index $existingSecret "data") }}
  {{- range $k, $v := . }}
    {{- $_ := set $passwords $k (b64dec $v) }}
  {{- end }}
{{- end }}

{{- $usersWithRoot := .Values.users }}
{{- if not (and .Values.users.root .Values.users.root.password) }}
  {{- $_ := set $usersWithRoot "root" dict }}
{{- end }}

{{- range $user, $u := $usersWithRoot }}
  {{- if $u.password }}
    {{- $_ := set $passwords $user $u.password }}
  {{- else if not (index $passwords $user) }}
    {{- $_ := set $passwords $user (randAlphaNum 16) }}
  {{- end }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- /*
      mariadb-operator reconciles a User when its passwordSecretKeyRef Secret
      changes only if that Secret carries this label. Without it, a password
      changed in users.<name>.password reaches the server only on the operator's
      periodic SQL requeue (10h plus up to 1h of jitter), and the previous
      password stays valid until then.
    */}}
    k8s.mariadb.com/watch: ""
stringData:
  {{- range $name, $u := $usersWithRoot }}
  {{ $name }}: {{ index $passwords $name }}
  {{- end }}
