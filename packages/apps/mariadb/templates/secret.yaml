{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $passwords := dict }}

{{- with (index $existingSecret "data") }}
  {{- range $k, $v := . }}
    {{- $_ := set $passwords $k (b64dec $v) }}
  {{- end }}
{{- end }}

{{/*
  Reject a username outside the Secret-key charset before it becomes a Secret
  data key, the spec.name of a mariadb-operator User CR and (with "_" mapped to
  "-") that User's metadata.name. The apiserver would reject such a name later
  as an invalid Secret key or resource name, but only once Flux applies the
  render, as an opaque error; failing here names the offending username. The
  check mirrors k8s IsConfigMapKey in full — the charset plus its rejection of
  "." / ".." and of names over 253 chars — so it rejects nothing that could
  otherwise install. root is chart-injected below and always valid, so only the
  value-supplied names are checked. There is no shell interpolation here (the
  operator applies the SQL), so this is a diagnosability guard, not an injection
  fix; postgres carries the analogous guard in its init-script.
*/}}
{{- range $user, $u := .Values.users }}
  {{- if or (not (regexMatch "^[-._a-zA-Z0-9]+$" $user)) (eq $user ".") (eq $user "..") (gt (len $user) 253) }}
    {{- fail (printf "invalid username %q: a username may contain only letters, digits and the characters -._ , must not be \".\" or \"..\", and must be at most 253 characters (it becomes a Kubernetes Secret key and the name of a mariadb-operator User resource)" $user) }}
  {{- end }}
{{- end }}

{{/* root is always chart-managed and never accepts a value-supplied password. */}}
{{- $usersWithRoot := deepCopy .Values.users }}
{{- $_ := set $usersWithRoot "root" dict }}

{{/*
  Passwords (root included) are always chart-generated and preserved across
  reconciles via the lookup above: a user keeps whatever password is already
  stored in the Secret, and only a user without one yet gets a freshly generated
  value.
*/}}
{{- range $user, $u := $usersWithRoot }}
  {{- if not (index $passwords $user) }}
    {{- $_ := set $passwords $user (randAlphaNum 16) }}
  {{- end }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    # mariadb-operator only re-applies a User password from its
    # passwordSecretKeyRef when the referenced Secret carries this label;
    # without it a change to this Secret (e.g. a newly added user's generated
    # password) reaches the server only on the operator's --requeue-sql tick
    # (10h + up to 1h of jitter) instead of promptly. (root is not indexed on
    # the Secret at all — MariaDB.spec.rootPasswordSecretKeyRef lands only at
    # datadir bootstrap.)
    k8s.mariadb.com/watch: ""
stringData:
  {{- range $name, $u := $usersWithRoot }}
  {{ $name | quote }}: {{ index $passwords $name | quote }}
  {{- end }}
