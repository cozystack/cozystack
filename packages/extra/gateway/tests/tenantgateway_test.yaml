suite: tenant gateway CR rendering
templates:
  - templates/tenantgateway.yaml

release:
  name: gateway
  namespace: tenant-root

tests:
  - it: defaults to certMode=http01 with the apex from _namespace.host
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: TenantGateway
      - equal:
          path: apiVersion
          value: gateway.cozystack.io/v1alpha1
      - equal:
          path: metadata.name
          value: cozystack
      - equal:
          path: spec.apex
          value: example.org
      - equal:
          path: spec.certMode
          value: http01
      - equal:
          path: spec.gatewayClassName
          value: cilium
      - notExists:
          path: spec.dns01

  - it: child tenant carries its own apex (host inherited from parent)
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: alice.example.org
    release:
      namespace: tenant-alice
    asserts:
      - equal:
          path: spec.apex
          value: alice.example.org

  - it: empty _namespace.host fails with explicit error
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
      _namespace:
        host: ""
    asserts:
      - failedTemplate:
          errorMessage: "_namespace.host is empty — the tenant has no apex domain. Either set tenant.spec.host on this tenant or inherit it from a parent that has host set."

  - it: dns01 mode renders dns01.cloudflare with default secret refs
    set:
      _cluster:
        solver: dns01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.certMode
          value: dns01
      - equal:
          path: spec.dns01.provider
          value: cloudflare
      - equal:
          path: spec.dns01.cloudflare.apiTokenSecretRef.name
          value: cloudflare-api-token-secret
      - equal:
          path: spec.dns01.cloudflare.apiTokenSecretRef.key
          value: api-token

  - it: dns01-provider=cloudflare with custom secret refs
    set:
      _cluster:
        solver: dns01
        dns01-provider: cloudflare
        dns01-cloudflare-secret-name: my-cf-secret
        dns01-cloudflare-secret-key: token
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.dns01.cloudflare.apiTokenSecretRef.name
          value: my-cf-secret
      - equal:
          path: spec.dns01.cloudflare.apiTokenSecretRef.key
          value: token

  - it: dns01-provider=route53 renders route53 block
    set:
      _cluster:
        solver: dns01
        dns01-provider: route53
        dns01-route53-region: us-east-1
        dns01-route53-access-key-id: AKIAEXAMPLE
        dns01-route53-secret-name: route53-creds
        dns01-route53-secret-key: secret-access-key
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.dns01.provider
          value: route53
      - equal:
          path: spec.dns01.route53.region
          value: us-east-1
      - equal:
          path: spec.dns01.route53.accessKeyID
          value: AKIAEXAMPLE
      - equal:
          path: spec.dns01.route53.secretAccessKeySecretRef.name
          value: route53-creds

  - it: dns01-provider=digitalocean
    set:
      _cluster:
        solver: dns01
        dns01-provider: digitalocean
        dns01-digitalocean-secret-name: do-token
        dns01-digitalocean-secret-key: access-token
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.dns01.provider
          value: digitalocean
      - equal:
          path: spec.dns01.digitalocean.tokenSecretRef.name
          value: do-token

  - it: dns01-provider=rfc2136 renders TSIG block with default algorithm
    set:
      _cluster:
        solver: dns01
        dns01-provider: rfc2136
        dns01-rfc2136-nameserver: 192.0.2.53:53
        dns01-rfc2136-tsig-key-name: cozystack-acme
        dns01-rfc2136-secret-name: rfc2136-tsig
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.dns01.rfc2136.nameserver
          value: 192.0.2.53:53
      - equal:
          path: spec.dns01.rfc2136.tsigKeyName
          value: cozystack-acme
      - equal:
          path: spec.dns01.rfc2136.tsigAlgorithm
          value: HMACSHA256

  - it: route53 fails clearly when required region is empty
    set:
      _cluster:
        solver: dns01
        dns01-provider: route53
        dns01-route53-access-key-id: AKIAEXAMPLE
        dns01-route53-secret-name: route53-creds
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - failedTemplate:
          errorMessage: "packages/extra/gateway: _cluster.dns01-route53-region is required when dns01-provider=route53"

  - it: rfc2136 fails clearly when nameserver is empty
    set:
      _cluster:
        solver: dns01
        dns01-provider: rfc2136
        dns01-rfc2136-tsig-key-name: cozystack-acme
        dns01-rfc2136-secret-name: rfc2136-tsig
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - failedTemplate:
          errorMessage: "packages/extra/gateway: _cluster.dns01-rfc2136-nameserver is required when dns01-provider=rfc2136"

  - it: unknown dns01-provider fails chart render
    set:
      _cluster:
        solver: dns01
        dns01-provider: oraclednslol
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - failedTemplate:
          errorMessage: 'packages/extra/gateway: unsupported _cluster.dns01-provider="oraclednslol". Supported values: cloudflare, route53, digitalocean, rfc2136.'

  - it: unknown solver fails chart render
    set:
      _cluster:
        solver: tls-alpn-01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - failedTemplate:
          errorMessage: 'packages/extra/gateway: unsupported _cluster.solver="tls-alpn-01". Supported values: http01, dns01.'

  - it: unknown issuer-name fails chart render
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: my-custom-ca
      _namespace:
        host: example.org
    asserts:
      - failedTemplate:
          errorMessage: 'packages/extra/gateway currently supports publishing.certificates.issuerName=letsencrypt-prod or letsencrypt-stage (got "my-custom-ca"). For other issuers, extend the controller to map the name to the corresponding ACME server URL.'

  - it: attachedNamespaces propagates from _cluster.gateway-attached-namespaces
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-attached-namespaces: "cozy-cert-manager,cozy-dashboard,cozy-keycloak"
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.attachedNamespaces
          value:
            - cozy-cert-manager
            - cozy-dashboard
            - cozy-keycloak

  - it: tlsPassthroughServices defaults to api,vm-exportproxy,cdi-uploadproxy
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.tlsPassthroughServices
          value:
            - api
            - vm-exportproxy
            - cdi-uploadproxy

  - it: wildcard-secret-name switches to certMode=existingSecret with wildcardSecretRef
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        wildcard-secret-name: wildcard-tls
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.certMode
          value: existingSecret
      - equal:
          path: spec.wildcardSecretRef.name
          value: wildcard-tls
      - notExists:
          path: spec.dns01
      - notExists:
          path: spec.issuerName

  - it: wildcard-secret-name takes precedence over solver=dns01
    set:
      _cluster:
        solver: dns01
        dns01-provider: cloudflare
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        wildcard-secret-name: wildcard-tls
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.certMode
          value: existingSecret
      - equal:
          path: spec.wildcardSecretRef.name
          value: wildcard-tls
      - notExists:
          path: spec.dns01

  - it: wildcard mode skips ACME validations (custom issuer-name ignored)
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: my-custom-ca
        wildcard-secret-name: wildcard-tls
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.certMode
          value: existingSecret
      - notExists:
          path: spec.issuerName

  - it: tlsPassthroughServices still render in wildcard mode
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        wildcard-secret-name: wildcard-tls
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.tlsPassthroughServices
          value:
            - api
            - vm-exportproxy
            - cdi-uploadproxy

  - it: gateway-class-name from _cluster is the default when the tenant picks none
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cloudflare-tunnel
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: cloudflare-tunnel

  - it: the tenant's own class wins over the platform default
    release:
      namespace: tenant-alice
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-tenant-classes: cloudflare-tunnel
      _namespace:
        host: example.org
      gatewayClassName: cloudflare-tunnel
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: cloudflare-tunnel

  - it: falls back to cilium against a platform that predates gateway.className
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: cilium

  - it: a class listed as edge-terminated switches the tenant to certMode=edge
    release:
      namespace: tenant-alice
    set:
      _cluster:
        solver: dns01
        dns01-provider: cloudflare
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-edge-classes: cloudflare-tunnel,some-other-tunnel
        gateway-tenant-classes: cloudflare-tunnel
      _namespace:
        host: alice.example.org
      gatewayClassName: cloudflare-tunnel
    asserts:
      - equal:
          path: spec.certMode
          value: edge
      - equal:
          path: spec.gatewayClassName
          value: cloudflare-tunnel
      - notExists:
          path: spec.dns01
      - notExists:
          path: spec.issuerName
      - notExists:
          path: spec.wildcardSecretRef

  - it: the same tenant on a class that is not listed keeps issuing certificates
    set:
      _cluster:
        solver: dns01
        dns01-provider: cloudflare
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-edge-classes: cloudflare-tunnel
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.certMode
          value: dns01
      - equal:
          path: spec.gatewayClassName
          value: cilium
      - exists:
          path: spec.dns01.cloudflare

  - it: the platform default class being edge-terminated reaches a tenant that picks nothing
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cloudflare-tunnel
        gateway-edge-classes: cloudflare-tunnel
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.certMode
          value: edge

  - it: a padded platform default class still matches the edge list and renders trimmed
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: "  cloudflare-tunnel  "
        gateway-edge-classes: cloudflare-tunnel
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: cloudflare-tunnel
      - equal:
          path: spec.certMode
          value: edge

  - it: a padded tenant-selected class passes the allowlist and renders trimmed
    release:
      namespace: tenant-alice
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-edge-classes: cloudflare-tunnel
        gateway-tenant-classes: cloudflare-tunnel
      _namespace:
        host: alice.example.org
      gatewayClassName: "  cloudflare-tunnel  "
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: cloudflare-tunnel
      - equal:
          path: spec.certMode
          value: edge

  - it: an unset platform default falls back to the bundled class
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: cilium

  - it: a whitespace-only platform default is refused rather than resolved
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: "   "
      _namespace:
        host: example.org
    asserts:
      - failedTemplate:
          errorMessage: 'packages/extra/gateway: _cluster.gateway-class-name is only whitespace. The platform writes this from gateway.className; leave that unset for the bundled cilium class rather than blank.'

  - it: a whitespace-only tenant class is refused rather than silently defaulted
    release:
      namespace: tenant-alice
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
      _namespace:
        host: alice.example.org
      gatewayClassName: "   "
    asserts:
      - failedTemplate:
          errorMessage: 'packages/extra/gateway: gatewayClass is only whitespace. Leave tenant.spec.gatewayClass unset to take the platform default, or name a class the operator lists in gateway.tenantSelectableClasses.'

  - it: an edge class wins over wildcard-secret-name
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        wildcard-secret-name: wildcard-tls
        gateway-class-name: cloudflare-tunnel
        gateway-edge-classes: cloudflare-tunnel
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.certMode
          value: edge
      - notExists:
          path: spec.wildcardSecretRef

  - it: an edge class skips the ACME validations (custom issuer-name ignored)
    set:
      _cluster:
        solver: bogus
        expose-ingress: tenant-root
        issuer-name: my-corp-ca
        gateway-class-name: cloudflare-tunnel
        gateway-edge-classes: cloudflare-tunnel
      _namespace:
        host: example.org
    asserts:
      - equal:
          path: spec.certMode
          value: edge

  - it: a tenant cannot select a class the operator did not allow
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-tenant-classes: cloudflare-tunnel
      _namespace:
        host: example.org
      gatewayClassName: admin-internal
    asserts:
      - failedTemplate:
          errorPattern: 'gatewayClass="admin-internal" is not selectable by tenants'

  - it: a tenant may always select the platform default explicitly
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
      _namespace:
        host: example.org
      gatewayClassName: cilium
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: cilium

  - it: the publishing tenant cannot select a class that terminates TLS differently
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-edge-classes: cloudflare-tunnel
        gateway-tenant-classes: cloudflare-tunnel
      _namespace:
        host: example.org
      gatewayClassName: cloudflare-tunnel
    asserts:
      - failedTemplate:
          errorPattern: 'the publishing tenant \(tenant-root\) cannot select gatewayClass="cloudflare-tunnel"'

  - it: a non-publishing tenant may select that same class
    release:
      namespace: tenant-alice
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-edge-classes: cloudflare-tunnel
        gateway-tenant-classes: cloudflare-tunnel
      _namespace:
        host: alice.example.org
      gatewayClassName: cloudflare-tunnel
    asserts:
      - equal:
          path: spec.certMode
          value: edge

  - it: the publishing tenant may select a class that matches the default's termination
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-edge-classes: cloudflare-tunnel
        gateway-tenant-classes: another-terminating-class
      _namespace:
        host: example.org
      gatewayClassName: another-terminating-class
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: another-terminating-class
      - equal:
          path: spec.certMode
          value: http01

  - it: the publishing tenant may select another edge class when the default is edge too
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cloudflare-tunnel
        gateway-edge-classes: cloudflare-tunnel,some-other-tunnel
        gateway-tenant-classes: some-other-tunnel
      _namespace:
        host: example.org
      gatewayClassName: some-other-tunnel
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: some-other-tunnel
      - equal:
          path: spec.certMode
          value: edge

  - it: an edge tenant advertises no tlsPassthroughServices in its CR
    release:
      namespace: tenant-alice
    set:
      _cluster:
        solver: http01
        expose-ingress: tenant-root
        issuer-name: letsencrypt-prod
        gateway-class-name: cilium
        gateway-edge-classes: cloudflare-tunnel
        gateway-tenant-classes: cloudflare-tunnel
      _namespace:
        host: alice.example.org
      gatewayClassName: cloudflare-tunnel
    asserts:
      - equal:
          path: spec.certMode
          value: edge
      - notExists:
          path: spec.tlsPassthroughServices

