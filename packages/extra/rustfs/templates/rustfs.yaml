{{- $ingress := (.Values._namespace | default dict).ingress }}
{{- $clusterDomain := (index (.Values._cluster | default dict) "cluster-domain") | default "cozy.local" }}
{{- $host := include "cozy-lib.ns-host-required" . }}
{{- $s3Host := .Values.host | default (printf "s3.%s" $host) }}
{{- if lt (int .Values.replicas) 2 }}
{{-   fail "Invalid value for .Values.replicas. RustFS distributed mode needs at least 2 nodes." }}
{{- end }}

{{- /* The StatefulSet and the erasure-coded drive layout are fixed at first deploy. */}}
{{- $existing := lookup "apps/v1" "StatefulSet" .Release.Namespace .Release.Name }}
{{- if and $existing (ne (int $existing.spec.replicas) (int .Values.replicas)) }}
{{-   fail (printf "Not allowed to change replicas after the first deployment: %d" (int $existing.spec.replicas)) }}
{{- end }}

{{- /* Keep the credentials already issued: the nodes read them at start and nothing restarts them on a Secret change. */}}
{{- $name := printf "%s-credentials" .Release.Name }}
{{- $accessKey := randAlphaNum 20 | b64enc }}
{{- $secretKey := randAlphaNum 40 | b64enc }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{-   $accessKey = dig "data" "RUSTFS_ACCESS_KEY" $accessKey . }}
{{-   $secretKey = dig "data" "RUSTFS_SECRET_KEY" $secretKey . }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  RUSTFS_ACCESS_KEY: {{ $accessKey }}
  RUSTFS_SECRET_KEY: {{ $secretKey }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-system
  labels:
    sharding.fluxcd.io/key: tenants
spec:
  chartRef:
    kind: ExternalArtifact
    name: cozystack-rustfs-application-default-rustfs-system
    namespace: cozy-system
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    force: true
    remediation:
      retries: -1
  valuesFrom:
  - kind: Secret
    name: cozystack-values
  values:
    rustfs:
      fullnameOverride: {{ .Release.Name }}
      replicaCount: {{ .Values.replicas }}
      clusterDomain: {{ $clusterDomain }}
      secret:
        existingSecret: {{ $name }}
      # One drive per node, so `size` is the capacity of a node.
      drivesPerNode: 1
      storageclass:
        # An empty name selects the cluster default StorageClass.
        name: {{ .Values.storageClass }}
        dataStorageSize: {{ .Values.size | quote }}
        logStorageSize: 1Gi
      resources: {{- include "cozy-lib.resources.defaultingSanitize" (list .Values.resourcesPreset .Values.resources $) | nindent 8 }}
      ingress:
        enabled: {{ not (empty $ingress) }}
        className: {{ $ingress }}
        annotations:
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
          nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          acme.cert-manager.io/http01-ingress-class: {{ $ingress }}
          cert-manager.io/cluster-issuer: letsencrypt-prod
        # Only the S3 endpoint is exposed; the console stays in-cluster.
        hosts:
        - host: {{ $s3Host }}
          paths:
          - path: /
            pathType: Prefix
            servicePort: endpoint
        tls:
          enabled: true
          existingSecret:
            enabled: true
            name: {{ .Release.Name }}-s3-ingress-tls
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  minReplicas: {{ div .Values.replicas 2 | add1 }}
  kind: rustfs
  type: rustfs
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: {{ .Release.Name }}-system
  version: {{ .Chart.Version }}
