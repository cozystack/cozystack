##
## @section Common parameters
##

## @param {string} [host] - The hostname used to access the S3 endpoint externally (defaults to 's3' subdomain for the tenant host).
host: ""

## @param {int} replicas - Number of RustFS nodes. Distributed mode needs at least 2; the node count cannot be changed after the first deployment.
replicas: 4

## @param {quantity} size - Persistent Volume size of each node.
size: 10Gi

## @param {string} [storageClass] - StorageClass used to store the data.
storageClass: ""

## @typedef {struct} Resources - Resource configuration.
## @field {quantity} [cpu] - Number of CPU cores allocated.
## @field {quantity} [memory] - Amount of memory allocated.

## @enum {string} ResourcesPreset - Default sizing preset.
