{{- /* The matchbox Ingress asks cert-manager's ingress-shim for bootbox-tls.
       The Certificate it gets is owned by the Ingress rather than by this
       release, so the hook deletes it before the Secret it writes. */}}
{{- include "cozy-lib.hooks.deleteSecrets" (dict
      "root" .
      "certificates" (list "bootbox-tls")
      "secrets" (list "bootbox-tls")) }}
