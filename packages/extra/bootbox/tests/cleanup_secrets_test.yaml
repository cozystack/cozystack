suite: bootbox removes the TLS Secret cert-manager wrote for its Ingress once the release is deleted

release:
  name: bootbox
  namespace: tenant-root

set:
  _namespace:
    host: example.org
    ingress: tenant-root
  _cluster:
    issuer-name: letsencrypt-prod
    solver: http01

tests:
  - it: grants delete on exactly that Secret and on the Certificate ingress-shim created for it
    templates:
      - templates/hooks/cleanup-secrets.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "delete"]
              resourceNames: ["bootbox-tls"]
            - apiGroups: ["cert-manager.io"]
              resources: ["certificates"]
              verbs: ["get", "delete"]
              resourceNames: ["bootbox-tls"]

  - it: deletes the Certificate first and leaves the Secret when that fails
    templates:
      - templates/hooks/cleanup-secrets.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-delete
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'if ! kubectl delete certificates\.cert-manager\.io --namespace tenant-root --ignore-not-found "bootbox-tls"; then\s+echo "ERROR: [^"]*" >&2\s+exit 1\s+fi\s+echo "Deleting Secrets bootbox-tls left by bootbox"\s+if kubectl delete secret --namespace tenant-root --ignore-not-found "bootbox-tls"; then'

  - it: still renders in wildcard mode, where the Ingress names no Secret of its own
    templates:
      - templates/hooks/cleanup-secrets.yaml
    set:
      _cluster:
        wildcard-secret-name: wildcard-tls
    asserts:
      - hasDocuments:
          count: 4

  # The names above are only right while the chart asks ingress-shim for this
  # Secret and for no other.
  - it: lists the Secret the matchbox Ingress asks cert-manager for
    templates:
      - templates/matchbox/ingress.yaml
    documentSelector:
      path: spec.tls[0].secretName
      value: bootbox-tls
    asserts:
      - isKind:
          of: Ingress
      - exists:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]

  - it: renders no other Ingress that could ask cert-manager for a Secret
    templates:
      - templates/matchbox/ingress.yaml
      - templates/matchbox/service.yaml
      - templates/matchbox/deployment.yaml
      - templates/matchbox/configmaps.yaml
      - templates/matchbox/machines.yaml
    documentSelector:
      path: kind
      value: Ingress
      matchMany: true
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true
