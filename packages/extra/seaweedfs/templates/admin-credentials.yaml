{{- if and .Values.lifecycle.enabled (ne .Values.topology "Client") }}
{{- $name := printf "%s-admin-credentials" .Release.Name }}
{{- /* The admin reads these into its environment when it starts and nothing
       restarts it on a Secret change, so a password regenerated on every render
       would leave the Secret holding one the running server does not accept.
       Keep the one already issued. */}}
{{- $password := randAlphaNum 40 | b64enc }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{-   with (dig "data" "adminPassword" "" .) }}
{{-     $password = . }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  adminUser: {{ "admin" | b64enc }}
  adminPassword: {{ $password }}
{{- end }}
