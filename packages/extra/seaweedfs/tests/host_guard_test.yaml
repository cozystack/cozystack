suite: seaweedfs S3 endpoint fails on an empty apex

templates:
  - templates/seaweedfs.yaml

release:
  name: seaweedfs
  namespace: tenant-root

# The S3 endpoint is s3.<_namespace.host> on the non-Client topology path.
# cozy-lib.ns-host-required guards the apex, so an empty apex fails the render.

tests:
  - it: fails when the apex is empty and no host override
    set:
      topology: Simple
      replicationFactor: 2
      _namespace:
        host: ""
        ingress: tenant-root
      _cluster:
        issuer-name: letsencrypt-prod
        solver: http01
    asserts:
      - failedTemplate:
          errorMessage: "the tenant apex (_namespace.host) is empty and this app sets no host override, so its ingress hostname would be malformed. Set tenant.spec.host on this tenant, inherit it from a parent that has host set, or set this app's host value."

  - it: renders the HelmRelease when the apex is set
    documentSelector:
      path: kind
      value: HelmRelease
    set:
      topology: Simple
      replicationFactor: 2
      _namespace:
        host: example.org
        ingress: tenant-root
      _cluster:
        issuer-name: letsencrypt-prod
        solver: http01
    asserts:
      - equal:
          path: kind
          value: HelmRelease
