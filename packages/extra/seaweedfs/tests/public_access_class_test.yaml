suite: seaweedfs public-read BucketAccessClass
release:
  name: seaweedfs
  namespace: tenant-root

set:
  filer:
    grpcHost: seaweedfs-filer.tenant-other.svc
  _namespace:
    host: example.org
    ingress: tenant-root
  _cluster:
    issuer-name: letsencrypt-prod
    solver: http01

tests:
  - it: offers a -public access class to a Client instance
    template: templates/client/cosi-bucket-class.yaml
    set:
      topology: Client
    documentSelector:
      path: metadata.name
      value: tenant-root-public
    asserts:
      - isKind:
          of: BucketAccessClass
      - equal:
          path: parameters.accessPolicy
          value: public-read
      - equal:
          path: driverName
          value: tenant-root.seaweedfs.objectstorage.k8s.io

  - it: offers a -public access class per storage pool
    template: templates/storage-pool-bucket-classes.yaml
    set:
      topology: Simple
      volume:
        pools:
          fast:
            diskType: ssd
    documentSelector:
      path: metadata.name
      value: tenant-root-fast-public
    asserts:
      - isKind:
          of: BucketAccessClass
      - equal:
          path: parameters.accessPolicy
          value: public-read

  # Only an actual clash between rendered class names is refused, so a pool
  # suffix is free to use unless another pool owns the base name.
  - it: accepts a pool name ending in -public when no pool owns the base name
    template: templates/storage-pool-bucket-classes.yaml
    set:
      topology: Simple
      volume:
        pools:
          cdn-public:
            diskType: ssd
    documentSelector:
      path: metadata.name
      value: tenant-root-cdn-public-public
    asserts:
      - isKind:
          of: BucketAccessClass
      - equal:
          path: parameters.accessPolicy
          value: public-read

  - it: accepts -public, -lock and -readonly pool names without their base pool
    template: templates/seaweedfs.yaml
    set:
      volume:
        pools:
          cdn-public:
            diskType: ssd
          cdn-lock:
            diskType: hdd
          cdn-readonly:
            diskType: nvme
    asserts:
      - notFailedTemplate: {}

  - it: accepts a zone pool name ending in -public
    template: templates/seaweedfs.yaml
    set:
      topology: MultiZone
      replicationFactor: 1
      volume:
        zones:
          a:
            pools:
              cdn-public:
                diskType: ssd
    asserts:
      - notFailedTemplate: {}

  - it: refuses a pool whose base class is another pool's -public class
    template: templates/seaweedfs.yaml
    set:
      volume:
        pools:
          fast:
            diskType: ssd
          fast-public:
            diskType: nvme
    asserts:
      - failedTemplate:
          errorMessage: "storage pool 'fast-public' renders BucketAccessClass tenant-root-fast-public, also rendered by storage pool 'fast'; rename the pool."

  - it: refuses a pool whose base class is another pool's -readonly class
    template: templates/seaweedfs.yaml
    set:
      volume:
        pools:
          fast:
            diskType: ssd
          fast-readonly:
            diskType: nvme
    asserts:
      - failedTemplate:
          errorMessage: "storage pool 'fast-readonly' renders BucketAccessClass tenant-root-fast-readonly, also rendered by storage pool 'fast'; rename the pool."

  - it: refuses a pool whose base class is another pool's -lock class
    template: templates/seaweedfs.yaml
    set:
      volume:
        pools:
          fast:
            diskType: ssd
          fast-lock:
            diskType: nvme
    asserts:
      - failedTemplate:
          errorMessage: "storage pool 'fast-lock' renders BucketClass tenant-root-fast-lock, also rendered by storage pool 'fast'; rename the pool."

  - it: refuses a pool named public
    template: templates/seaweedfs.yaml
    set:
      volume:
        pools:
          public:
            diskType: ssd
    asserts:
      - failedTemplate:
          errorMessage: "storage pool 'public' renders BucketAccessClass tenant-root-public, also rendered by the base classes; rename the pool."
