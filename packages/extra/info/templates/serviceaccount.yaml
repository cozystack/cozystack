{{- $oidcEnabled := index .Values._cluster "oidc-enabled" }}
{{- if ne $oidcEnabled "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ .Release.Namespace }}
type: kubernetes.io/service-account-token
{{- end }}
