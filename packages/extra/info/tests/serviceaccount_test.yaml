suite: info tenant ServiceAccount token
templates:
  - templates/serviceaccount.yaml

release:
  name: info
  namespace: tenant-root

# The Info application selects this Secret for the tenantsecrets API, and
# cozy:tenant:use can read tenantsecrets. Rendering a live ServiceAccount token
# under OIDC therefore hands the token, and the rights bound to that
# ServiceAccount, to every member of the use tier. Under OIDC the dashboard
# signs in with the user's own ID token, so nothing needs the token there.
# _cluster.oidc-enabled arrives as the string "true" or "false", never a bool.

tests:
  - it: renders no token Secret when OIDC is enabled
    set:
      _cluster:
        oidc-enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the token Secret when OIDC is disabled
    set:
      _cluster:
        oidc-enabled: "false"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: type
          value: kubernetes.io/service-account-token
      - equal:
          path: metadata.name
          value: tenant-root
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: tenant-root
