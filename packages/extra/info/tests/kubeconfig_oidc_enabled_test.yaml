suite: info kubeconfig respects oidc-enabled

# _cluster.oidc-enabled always arrives as the string "true" or "false" (see
# packages/core/platform/templates/apps.yaml, which sends it through |quote),
# never as a native bool. `if $oidcEnabled` treats any non-empty string as
# truthy, so it rendered the kubeconfig Secret even when oidc-enabled was the
# string "false". dashboard-resourcemap.yaml in this same chart already uses
# `eq $oidcEnabled "true"` and only grants RBAC access to this Secret in that
# case, so the bug also left a Secret nothing could read.

templates:
  - templates/kubeconfig.yaml

release:
  name: info-test
  namespace: tenant-test

tests:
  - it: renders nothing when oidc-enabled is the string "false"
    set:
      _cluster:
        oidc-enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a kubeconfig Secret when oidc-enabled is the string "true"
    set:
      _cluster:
        oidc-enabled: "true"
        root-host: example.com
        api-server-endpoint: https://api.example.com:6443
        kube-root-ca: abc123
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kubeconfig-tenant-test
      - matchRegex:
          path: stringData.kubeconfig
          pattern: "server: https://api\\.example\\.com:6443"
