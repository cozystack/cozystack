suite: info kubeconfig OIDC issuer realm
templates:
  - templates/kubeconfig.yaml

release:
  name: info
  namespace: tenant-root

# The generated user kubeconfig runs kubectl oidc-login against
# keycloak.<host>/realms/<realm>. The realm segment is driven by
# _cluster.oidc-realm-name (authentication.oidc.realmName in the platform), so a
# renamed realm must reach the issuer here too — the token this kubeconfig mints
# is rejected by the apiserver unless its issuer matches the apiserver OIDC
# issuer, which the operator points at the same custom realm via talm.

tests:
  - it: defaults the issuer realm to cozy
    set:
      _cluster:
        root-host: example.org
        oidc-enabled: "true"
        api-server-endpoint: https://api.example.org:6443
        kube-root-ca: dGVzdA==
    asserts:
      - matchRegex:
          path: stringData.kubeconfig
          pattern: '--oidc-issuer-url=https://keycloak\.example\.org/realms/cozy'

  - it: threads a custom realm name into the issuer
    set:
      _cluster:
        root-host: example.org
        oidc-enabled: "true"
        oidc-realm-name: acme
        api-server-endpoint: https://api.example.org:6443
        kube-root-ca: dGVzdA==
    asserts:
      - matchRegex:
          path: stringData.kubeconfig
          pattern: '--oidc-issuer-url=https://keycloak\.example\.org/realms/acme'
      - notMatchRegex:
          path: stringData.kubeconfig
          pattern: '/realms/cozy'

  - it: points the issuer at a custom keycloak-host
    set:
      _cluster:
        root-host: example.org
        oidc-enabled: "true"
        keycloak-host: auth.example.org
        api-server-endpoint: https://api.example.org:6443
        kube-root-ca: dGVzdA==
    asserts:
      - matchRegex:
          path: stringData.kubeconfig
          pattern: '--oidc-issuer-url=https://auth\.example\.org/realms/cozy'
      - notMatchRegex:
          path: stringData.kubeconfig
          pattern: 'keycloak\.example\.org'
