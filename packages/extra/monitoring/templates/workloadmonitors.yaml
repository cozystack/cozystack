{{- range (include "monitoring.metricsStorages" $ | fromYamlArray) }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ .name }}-vmstorage
spec:
  replicas: {{ include "monitoring.replicas" (list $ .replicas 2 1) }}
  minReplicas: 1
  kind: monitoring
  type: vmstorage
  selector:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/instance: {{ .name }}
    app.kubernetes.io/name: vmstorage
  version: {{ $.Chart.Version }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ .name }}-vmselect
spec:
  replicas: {{ include "monitoring.replicas" (list $ .replicas 2 1) }}
  minReplicas: 1
  kind: monitoring
  type: vmselect
  selector:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/instance: {{ .name }}
    app.kubernetes.io/name: vmselect
  version: {{ $.Chart.Version }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ .name }}-vminsert
spec:
  replicas: {{ include "monitoring.replicas" (list $ .replicas 2 1) }}
  minReplicas: 1
  kind: monitoring
  type: vminsert
  selector:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/instance: {{ .name }}
    app.kubernetes.io/name: vminsert
  version: {{ $.Chart.Version }}
{{- end }}
{{- range (include "monitoring.metricsStorages" $ | fromYamlArray) }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: vmalert-{{ .name }}
spec:
  replicas: 1
  minReplicas: 1
  kind: monitoring
  type: vmalert
  selector:
    app.kubernetes.io/instance: vmalert-{{ .name }}
    app.kubernetes.io/name: vmalert
  version: {{ $.Chart.Version }}
{{- break }}
{{- end }}
{{- range .Values.logsStorages }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ .name }}-vlstorage
spec:
  replicas: {{ include "monitoring.replicas" (list $ .replicas 2 1) }}
  minReplicas: 1
  kind: monitoring
  type: vlstorage
  selector:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/instance: {{ .name }}
    app.kubernetes.io/name: vlstorage
  version: {{ $.Chart.Version }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ .name }}-vlselect
spec:
  replicas: {{ include "monitoring.replicas" (list $ .replicas 2 1) }}
  minReplicas: 1
  kind: monitoring
  type: vlselect
  selector:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/instance: {{ .name }}
    app.kubernetes.io/name: vlselect
  version: {{ $.Chart.Version }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: {{ .name }}-vlinsert
spec:
  replicas: {{ include "monitoring.replicas" (list $ .replicas 2 1) }}
  minReplicas: 1
  kind: monitoring
  type: vlinsert
  selector:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/instance: {{ .name }}
    app.kubernetes.io/name: vlinsert
  version: {{ $.Chart.Version }}
{{- end }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: grafana
spec:
  replicas: {{ include "monitoring.replicas" (list $ (dig "replicas" nil (.Values.grafana | default dict)) 2 1) }}
  minReplicas: 1
  kind: monitoring
  type: grafana
  selector:
    app: grafana
  version: {{ $.Chart.Version }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: grafana-db
spec:
  replicas: {{ include "monitoring.replicas" (list $ (dig "db" "instances" nil (.Values.grafana | default dict)) 2 1) }}
  minReplicas: 1
  kind: monitoring
  type: postgres
  selector:
    cnpg.io/cluster: grafana-db
    cnpg.io/podRole: instance
  version: {{ $.Chart.Version }}
{{- if include "monitoring.alertaEnabled" . }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: alerta-db
spec:
  replicas: {{ ternary 2 1 (eq (include "monitoring.isRoot" $) "true") }}
  minReplicas: 1
  kind: monitoring
  type: postgres
  selector:
    cnpg.io/cluster: alerta-db
    cnpg.io/podRole: instance
  version: {{ $.Chart.Version }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: alerta
spec:
  replicas: 1
  minReplicas: 1
  kind: monitoring
  type: alerta
  selector:
    app: alerta
    release: alerta
  version: {{ $.Chart.Version }}
{{- end }}
{{- $alertmanagerReplicas := include "monitoring.replicas" (list $ (dig "replicas" nil (.Values.alertmanager | default dict)) 3 1) | int }}
---
apiVersion: cozystack.io/v1alpha1
kind: WorkloadMonitor
metadata:
  name: alertmanager
spec:
  replicas: {{ $alertmanagerReplicas }}
  minReplicas: {{ ternary 2 1 (ge $alertmanagerReplicas 2) }}
  kind: monitoring
  type: alertmanager
  selector:
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/name: vmalertmanager
  version: {{ $.Chart.Version }}
