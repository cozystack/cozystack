suite: OTLP trace collector is accounted for in tenant workload monitoring
# Every workload the monitoring chart ships is enumerated in workloadmonitors.yaml
# (so tenant workload health is tracked) and whitelisted in the dashboard-resources
# Role (so the tenant dashboard may read its WorkloadMonitor). The OTLP collector
# must be covered the same way — under the same gate it renders on
# (tracingCollector.enabled AND a configured tracingStorages backend) and not when
# tracing is off.
templates:
  - templates/workloadmonitors.yaml
  - templates/dashboard-resourcemap.yaml

release:
  name: monitoring
  namespace: tenant-test

tests:
  - it: renders a WorkloadMonitor for the collector when enabled with a backend
    template: templates/workloadmonitors.yaml
    set:
      tracingCollector:
        enabled: true
        replicas: 2
        samplingPercentage: 10
      tracingStorages:
        - name: generic
          mode: cluster
          retentionPeriod: "14d"
          storage: 10Gi
          storageClassName: replicated
    documentSelector:
      path: metadata.name
      value: otel-traces
    asserts:
      - equal:
          path: kind
          value: WorkloadMonitor
      - equal:
          path: spec.type
          value: otel-collector
      # expectedReplicas tracks the configured replica count, minReplicas 1.
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: otel-traces

  - it: whitelists the collector WorkloadMonitor in the dashboard-resources Role
    template: templates/dashboard-resourcemap.yaml
    set:
      tracingCollector:
        enabled: true
        replicas: 1
        samplingPercentage: 10
      tracingStorages:
        - name: generic
          mode: cluster
          retentionPeriod: "14d"
          storage: 10Gi
          storageClassName: replicated
    documentSelector:
      path: kind
      value: Role
    asserts:
      - contains:
          path: rules[3].resourceNames
          content: otel-traces
      # The Role must whitelist each WorkloadMonitor by its real name. Guard the
      # alertmanager entry, which shipped misspelled ("alermanager") so the
      # alertmanager WorkloadMonitor was silently not RBAC-covered for the
      # dashboard — a defect in the exact resourceNames list this PR edits.
      - contains:
          path: rules[3].resourceNames
          content: alertmanager
      - notContains:
          path: rules[3].resourceNames
          content: alermanager

  # Absence is asserted on the resourcemap Role (a single deterministic document)
  # via notContains rather than on workloadmonitors.yaml: that template emits a
  # leading `---`, which makes containsDocument+not a no-op (an empty lead doc).
  # Both templates gate the collector on the identical condition, so the Role's
  # resourceNames list is a faithful proxy for whether the WorkloadMonitor renders.
  - it: does not whitelist the collector when tracing is off (empty tracingStorages)
    template: templates/dashboard-resourcemap.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - notContains:
          path: rules[3].resourceNames
          content: otel-traces

  - it: does not whitelist the collector when the collector is disabled
    template: templates/dashboard-resourcemap.yaml
    set:
      tracingCollector:
        enabled: false
        replicas: 1
        samplingPercentage: 10
      tracingStorages:
        - name: generic
          mode: cluster
          retentionPeriod: "14d"
          storage: 10Gi
          storageClassName: replicated
    documentSelector:
      path: kind
      value: Role
    asserts:
      - notContains:
          path: rules[3].resourceNames
          content: otel-traces
