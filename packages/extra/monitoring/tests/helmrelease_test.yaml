suite: monitoring-system HelmRelease readiness gate
templates:
  - templates/helmrelease.yaml

release:
  name: monitoring
  namespace: tenant-root

# The monitoring-system HelmRelease owns the VLCluster(s) rendered from
# logsStorages. Without a health gate it flips Ready as soon as helm applies the
# CR, so a missing or broken VictoriaLogs stays invisible while fluent-bit drops
# logs at a dead-end vlinsert-generic (issue #3181). A `poller` waitStrategy plus
# a VLCluster healthCheckExpr makes that failure surface as not-ready.
tests:
  - it: names the child release <release>-system
    asserts:
      - containsDocument:
          kind: HelmRelease
          apiVersion: helm.toolkit.fluxcd.io/v2
          name: monitoring-system

  - it: uses the poller waitStrategy so healthCheckExprs are evaluated
    asserts:
      - equal:
          path: spec.waitStrategy.name
          value: poller

  - it: passes tenant-set oidc values through to the inner chart
    set:
      oidc.mode: System
      oidc.users:
        - email: alice@example.com
          role: Admin
    asserts:
      - equal:
          path: spec.values.oidc.mode
          value: System
      - equal:
          path: spec.values.oidc.users[0].email
          value: alice@example.com
      - equal:
          path: spec.values.oidc.users[0].role
          value: Admin

  - it: gates readiness on the VLCluster status.updateStatus
    asserts:
      - equal:
          path: spec.healthCheckExprs[0].apiVersion
          value: operator.victoriametrics.com/v1
      - equal:
          path: spec.healthCheckExprs[0].kind
          value: VLCluster
      - equal:
          path: spec.healthCheckExprs[0].current
          value: "has(status.updateStatus) && status.updateStatus == 'operational'"
      - equal:
          path: spec.healthCheckExprs[0].inProgress
          value: "has(status.updateStatus) && status.updateStatus == 'expanding'"
      - equal:
          path: spec.healthCheckExprs[0].failed
          value: "has(status.updateStatus) && status.updateStatus != 'operational' && status.updateStatus != 'expanding'"

  # The traces backend (VTCluster/VTSingle from tracingStorages) is gated the
  # same way and by the same operator status contract. tracingStorages is empty
  # by default, so these exprs are usually inert (no CR to match); when a backend
  # is configured they gate readiness on it. Pin both entries so a
  # dropped/reordered block or a typo'd CEL expression fails a test rather than
  # silently regressing the gate.
  - it: gates readiness on the VTCluster status.updateStatus
    asserts:
      - equal:
          path: spec.healthCheckExprs[1].apiVersion
          value: operator.victoriametrics.com/v1
      - equal:
          path: spec.healthCheckExprs[1].kind
          value: VTCluster
      - equal:
          path: spec.healthCheckExprs[1].current
          value: "has(status.updateStatus) && status.updateStatus == 'operational'"
      - equal:
          path: spec.healthCheckExprs[1].inProgress
          value: "has(status.updateStatus) && status.updateStatus == 'expanding'"
      - equal:
          path: spec.healthCheckExprs[1].failed
          value: "has(status.updateStatus) && status.updateStatus != 'operational' && status.updateStatus != 'expanding'"

  - it: gates readiness on the VTSingle status.updateStatus
    asserts:
      - equal:
          path: spec.healthCheckExprs[2].apiVersion
          value: operator.victoriametrics.com/v1
      - equal:
          path: spec.healthCheckExprs[2].kind
          value: VTSingle
      - equal:
          path: spec.healthCheckExprs[2].current
          value: "has(status.updateStatus) && status.updateStatus == 'operational'"
      - equal:
          path: spec.healthCheckExprs[2].inProgress
          value: "has(status.updateStatus) && status.updateStatus == 'expanding'"
      - equal:
          path: spec.healthCheckExprs[2].failed
          value: "has(status.updateStatus) && status.updateStatus != 'operational' && status.updateStatus != 'expanding'"

  - it: also gates on the metrics VM* CRs, Grafana and the CNPG Cluster
    asserts:
      - lengthEqual:
          path: spec.healthCheckExprs
          count: 9
      - equal:
          path: spec.healthCheckExprs[3].kind
          value: VMCluster
      - equal:
          path: spec.healthCheckExprs[3].apiVersion
          value: operator.victoriametrics.com/v1beta1
      - equal:
          path: spec.healthCheckExprs[7].kind
          value: Grafana
      - equal:
          path: spec.healthCheckExprs[7].current
          value: "has(status.stage) && has(status.stageStatus) && status.stage == 'complete' && status.stageStatus == 'success'"
      - equal:
          path: spec.healthCheckExprs[8].apiVersion
          value: postgresql.cnpg.io/v1
      - equal:
          path: spec.healthCheckExprs[8].kind
          value: Cluster
      - notExists:
          path: spec.healthCheckExprs[8].inProgress
      - notExists:
          path: spec.healthCheckExprs[8].failed

  - it: keeps the timeout aligned with the outer release and OIDC job
    asserts:
      - equal:
          path: spec.timeout
          value: 15m

  - it: retries failed installs and upgrades without uninstalling database owners
    asserts:
      - equal:
          path: spec.install.strategy
          value: {name: RetryOnFailure, retryInterval: 30s}
      - equal:
          path: spec.upgrade.strategy
          value: {name: RetryOnFailure, retryInterval: 30s}
      - equal:
          path: spec.install.remediation.retries
          value: -1
      - equal:
          path: spec.upgrade.remediation.retries
          value: -1
      - notExists:
          path: spec.install.disableHooks
      - notExists:
          path: spec.upgrade.disableHooks
