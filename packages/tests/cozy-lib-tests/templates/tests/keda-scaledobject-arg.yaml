{{- if .Values.omit -}}
{{- /* Build a fully-valid argument dict, then drop exactly one required field
       named by .Values.omit, to exercise each fail-closed guard in isolation. */ -}}
{{- $ref := dict "apiVersion" "postgresql.cnpg.io/v1" "kind" "Cluster" "name" "db" -}}
{{- if eq .Values.omit "kind" }}{{- $_ := unset $ref "kind" }}{{- end -}}
{{- if eq .Values.omit "apiVersion" }}{{- $_ := unset $ref "apiVersion" }}{{- end -}}
{{- $arg := dict "name" "db" "scaleTargetRef" $ref "minReplicaCount" 2 "maxReplicaCount" 6 "serverAddress" "http://vmselect.example.svc:8481/select/0/prometheus" "query" "sum(x) + 150" "threshold" "150" -}}
{{- $arg = unset $arg .Values.omit -}}
{{ include "cozy-lib.keda.scaledObject" $arg }}
{{- end -}}
