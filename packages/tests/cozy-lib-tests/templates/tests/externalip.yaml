{{- $targets := .Values.targets | default (list "rw" "ro") }}
{{- $claims := include "cozy-lib.externalIP.claims" (list .Values.externalIPs .Values.external (.Values.defaultTarget | default "rw") $targets $) | fromYaml }}
{{- range $t := $targets }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $t }}
  {{- with (include "cozy-lib.externalIP.annotations" (list $claims $t $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
{{- end }}
