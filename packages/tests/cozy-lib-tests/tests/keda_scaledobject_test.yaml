# ./tests/keda_scaledobject_test.yaml
suite: keda scaledObject helper

templates:
  - templates/tests/keda-scaledobject.yaml
  - templates/tests/keda-scaledobject-nondict.yaml
  - templates/tests/keda-scaledobject-params.yaml
  - templates/tests/keda-scaledobject-bounds.yaml

release:
  name: postgres-db
  namespace: tenant-acme
  revision: 1
  isUpgrade: false

tests:
  - it: renders a KEDA ScaledObject with the given target, bounds and prometheus trigger
    templates:
      - templates/tests/keda-scaledobject.yaml
    values:
      - keda_scaledobject_values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledObject
      - equal:
          path: apiVersion
          value: keda.sh/v1alpha1
      - equal:
          path: metadata.name
          value: postgres-db
      - equal:
          path: metadata.namespace
          value: tenant-acme
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: postgres-db
      - equal:
          path: spec.scaleTargetRef.apiVersion
          value: postgresql.cnpg.io/v1
      - equal:
          path: spec.scaleTargetRef.kind
          value: Cluster
      - equal:
          path: spec.scaleTargetRef.name
          value: postgres-db
      - equal:
          path: spec.minReplicaCount
          value: 3
      - equal:
          path: spec.maxReplicaCount
          value: 6
      - equal:
          path: spec.triggers[0].type
          value: prometheus
      # AverageValue is load-bearing: desired = ceil(query / threshold) only holds
      # for an AverageValue external metric. Pinned explicitly, not left to KEDA's default.
      - equal:
          path: spec.triggers[0].metricType
          value: AverageValue
      - equal:
          path: spec.triggers[0].metadata.serverAddress
          value: http://vmselect-shortterm.tenant-root.svc:8481/select/0/prometheus
      - equal:
          path: spec.triggers[0].metadata.query
          value: 'sum(cnpg_backends_total{state="active"}) + 150'
      - equal:
          path: spec.triggers[0].metadata.threshold
          value: "150"
      # scale-down pacing is carried through verbatim into the HPA behavior
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[0].type
          value: Pods
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[0].value
          value: 1
      # not paused by default
      - notExists:
          path: metadata.annotations["autoscaling.keda.sh/paused"]

  - it: stamps the KEDA pause annotation in dry-run / recommendation mode
    templates:
      - templates/tests/keda-scaledobject.yaml
    values:
      - keda_scaledobject_values.yaml
    set:
      paused: true
    asserts:
      - equal:
          path: metadata.annotations["autoscaling.keda.sh/paused"]
          value: "true"

  - it: fails closed when the argument is not a dict
    templates:
      - templates/tests/keda-scaledobject-nondict.yaml
    set:
      nonDict: true
    asserts:
      - failedTemplate:
          errorMessage: "cozy-lib.keda.scaledObject: expected a single dict argument"

  - it: fails closed when scaleTargetRef is missing
    templates:
      - templates/tests/keda-scaledobject-params.yaml
    set:
      useParams: true
    asserts:
      - failedTemplate:
          errorMessage: "cozy-lib.keda.scaledObject: scaleTargetRef.name is required"

  - it: fails closed when maxReplicaCount is below minReplicaCount
    templates:
      - templates/tests/keda-scaledobject-bounds.yaml
    set:
      useBounds: true
    asserts:
      - failedTemplate:
          errorMessage: "cozy-lib.keda.scaledObject: maxReplicaCount must be >= minReplicaCount"
