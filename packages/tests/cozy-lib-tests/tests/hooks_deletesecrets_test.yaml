# ./tests/hooks_deletesecrets_test.yaml
suite: hooks deleteSecrets helper

# Direct coverage for the post-delete hook the app charts call. Each app suite
# pins the names its chart passes. This one pins what the helper makes of any
# names it is given, which is the RBAC it grants, the order its Job deletes in
# and the input it refuses.

templates:
  - templates/tests/hooks-deletesecrets.yaml

release:
  name: myapp
  namespace: tenant-acme

tests:
  - it: grants get and delete on the listed Secrets by name and nothing on Certificates when none are listed
    set:
      deleteSecrets:
        secrets: [myapp-ca, myapp-tls]
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "delete"]
              resourceNames: ["myapp-ca", "myapp-tls"]

  - it: deletes only the Secrets when no Certificates are listed
    set:
      deleteSecrets:
        secrets: [myapp-ca, myapp-tls]
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: certificates\.cert-manager\.io
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl delete secret --namespace tenant-acme --ignore-not-found "myapp-ca" "myapp-tls"; then'

  - it: grants get and delete on the listed Certificates by name as well
    set:
      deleteSecrets:
        secrets: [myapp-tls]
        certificates: [myapp-tls]
    documentSelector:
      path: kind
      value: Role
    asserts:
      - lengthEqual:
          path: rules
          count: 2
      - equal:
          path: rules[1]
          value:
            apiGroups: ["cert-manager.io"]
            resources: ["certificates"]
            verbs: ["get", "delete"]
            resourceNames: ["myapp-tls"]

  # A Secret deleted while its Certificate still exists is issued again, so a
  # Certificate delete that failed has to stop the Job before the Secrets.
  - it: deletes the Certificates first and exits before the Secrets when that fails
    set:
      deleteSecrets:
        secrets: [myapp-tls]
        certificates: [myapp-tls]
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'if ! kubectl delete certificates\.cert-manager\.io --namespace tenant-acme --ignore-not-found "myapp-tls"; then\s+echo "ERROR: [^"]*" >&2\s+exit 1\s+fi\s+echo "Deleting Secrets myapp-tls left by myapp"\s+if kubectl delete secret'

  # The apps API admits release names of up to 53 characters, and a Job name
  # goes into the job-name label of its pods, which takes at most 63.
  - it: keeps the Job name within 63 characters for a 53-character release name
    release:
      name: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    set:
      deleteSecrets:
        secrets: [myapp-tls]
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,63}$
      - equal:
          path: metadata.name
          value: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-c
      - equal:
          path: spec.template.spec.serviceAccountName
          value: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-c

  - it: gives the ServiceAccount, Role and RoleBinding the same cut name as the Job
    release:
      name: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    set:
      deleteSecrets:
        secrets: [myapp-tls]
    documentSelector:
      path: metadata.name
      value: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-c
      matchMany: true
    asserts:
      - hasDocuments:
          count: 4
          filterAware: true

  - it: binds the cut Role name to the cut ServiceAccount name
    release:
      name: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    set:
      deleteSecrets:
        secrets: [myapp-tls]
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: roleRef.name
          value: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-c
      - equal:
          path: subjects[0].name
          value: redis-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-c

  - it: pulls the pinned kubectl image from its own registry when the cluster sets none
    set:
      deleteSecrets:
        secrets: [myapp-tls]
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^clastix/kubectl:v[0-9]+\.[0-9]+(\.[0-9]+)?@sha256:[0-9a-f]{64}$

  - it: pulls the pinned kubectl image through the cluster images registry
    set:
      _cluster:
        images-registry: registry.example.com
      deleteSecrets:
        secrets: [myapp-tls]
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^registry\.example\.com/clastix/kubectl:v[0-9]+\.[0-9]+(\.[0-9]+)?@sha256:[0-9a-f]{64}$

  - it: refuses an empty Secret list, whose RBAC rule would have no resourceNames
    set:
      deleteSecrets:
        secrets: []
    asserts:
      - failedTemplate:
          errorPattern: secrets is empty, and an RBAC rule with no resourceNames grants delete on every Secret in the namespace

  - it: refuses a blank Secret name
    set:
      deleteSecrets:
        secrets: [myapp-tls, ""]
    asserts:
      - failedTemplate:
          errorPattern: every entry of secrets must be a non-empty string

  - it: refuses a blank Certificate name
    set:
      deleteSecrets:
        secrets: [myapp-tls]
        certificates: [""]
    asserts:
      - failedTemplate:
          errorPattern: every entry of certificates must be a non-empty string

  - it: refuses Secrets given as one string rather than a list
    set:
      deleteSecrets:
        secrets: myapp-tls
    asserts:
      - failedTemplate:
          errorPattern: secrets must be a list, got string

  - it: refuses Certificates given as one string rather than a list
    set:
      deleteSecrets:
        secrets: [myapp-tls]
        certificates: myapp-tls
    asserts:
      - failedTemplate:
          errorPattern: certificates must be a list, got string

  # The names are written into the Job's shell script inside double quotes,
  # where $ and a backquote are still expanded.
  - it: refuses a Secret name that is not a Kubernetes resource name
    set:
      deleteSecrets:
        secrets: [myapp-tls, "$(id)"]
    asserts:
      - failedTemplate:
          errorPattern: every entry of secrets must be a Kubernetes resource name, got "\$\(id\)"

  - it: refuses a Certificate name that is not a Kubernetes resource name
    set:
      deleteSecrets:
        secrets: [myapp-tls]
        certificates: ["myapp`id`"]
    asserts:
      - failedTemplate:
          errorPattern: every entry of certificates must be a Kubernetes resource name

  - it: refuses a name one character longer than a Kubernetes resource name may be
    set:
      deleteSecrets:
        secrets: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa]
    asserts:
      - failedTemplate:
          errorPattern: every entry of secrets must be a Kubernetes resource name

  - it: accepts a name of the longest length a Kubernetes resource name may have
    set:
      deleteSecrets:
        secrets: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa]
    asserts:
      - hasDocuments:
          count: 4

  - it: accepts the dotted names cert-manager Secrets often have
    set:
      deleteSecrets:
        secrets: [myapp.ca-tls, myapp.tls]
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: ["myapp.ca-tls", "myapp.tls"]
