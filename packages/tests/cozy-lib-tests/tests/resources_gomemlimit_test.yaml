# ./tests/resources_gomemlimit_test.yaml
suite: resources goMemLimit helper

# The helper turns a memory limit into a GOMEMLIMIT the Go runtime accepts,
# at 75% of the limit. Two properties matter and neither is visible from a
# single value: the result carries the MiB suffix Go parses, and it stays
# strictly under the limit it protects, whatever unit the quantity came in.
# A value that came out at or above the limit would leave the runtime with
# no headroom and the container would still be killed.

templates:
  - templates/tests/resources-gomemlimit.yaml

tests:
  - it: takes 75% of the limit and keeps the unit Go parses
    values:
      - resources_gomemlimit_values.yaml

    release:
      name: myrelease
      namespace: default

    asserts:
      - equal:
          path: data.binaryGi
          value: "6144MiB"

      - equal:
          path: data.binaryMi
          value: "384MiB"

      # A decimal quantity is smaller than its binary lookalike: 1G is
      # 1000000000 bytes, so 75% of it lands below 768MiB.
      - equal:
          path: data.decimalG
          value: "715MiB"

      - equal:
          path: data.bareBytes
          value: "768MiB"

      # The smallest limit that still yields a usable value: 75% of
      # 1398102 bytes (4/3 Mi, rounded up) floors to 1MiB.
      - equal:
          path: data.smallestUsable
          value: "1MiB"

  # Integer division floors, so a limit one byte under 4/3 Mi comes out
  # at 0MiB. Go accepts that and then collects almost without pause,
  # slowing the component instead of protecting it, so the render stops
  # instead.
  - it: refuses a limit too small to leave a Go heap
    values:
      - resources_gomemlimit_values.yaml
    set:
      sanitizedResources:
        belowOneMiB:
          limits:
            memory: "1398101"
    asserts:
      - failedTemplate:
          errorPattern: "leaves no room for a Go heap"
