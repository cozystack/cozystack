suite: storage backend selection reaches the linstor package
templates:
  - templates/bundles/system.yaml
release:
  name: cozystack
  namespace: cozy-system

# The operator picks the storage control plane at install time. The choice has
# to arrive at the linstor package as a value, because that package renders one
# backend or the other from it — a choice that stayed in the platform chart
# would be inert. LINSTOR is the default: every existing cluster runs it, and a
# silent flip would swap the storage control plane under live data.
tests:
  # The default leaves the linstor Package exactly as it was before the choice
  # existed: no components, so the chart default (linstor) applies and an
  # upgrade does not roll a new revision of the release for nothing.
  - it: defaults to the linstor backend without restating it
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  - it: states nothing but the talos override on the generic variant by default
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full-generic
    asserts:
      - equal:
          path: spec.components.linstor.values
          value:
            talos:
              enabled: false
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  - it: passes blockstor through when the operator asks for it
    set:
      storage:
        backend: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - equal:
          path: spec.components.linstor.values.backend
          value: blockstor
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  - it: keeps the generic variant's talos override alongside the backend
    set:
      storage:
        backend: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full-generic
    asserts:
      - equal:
          path: spec.components.linstor.values.backend
          value: blockstor
        documentSelector:
          path: metadata.name
          value: cozystack.linstor
      - equal:
          path: spec.components.linstor.values.talos.enabled
          value: false
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  # A typo must not quietly deploy the wrong storage control plane.
  - it: fails the render on an unrecognised backend
    set:
      storage:
        backend: blockstore
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.backend must be "linstor" or "blockstor", got "blockstore"'

  # Under linstor the API consumers keep their chart defaults, which name the
  # objects piraeus-operator creates. Under blockstor they are told only the
  # backend: where the API is comes from the LinstorCluster the linstor package
  # renders, so the platform names neither blockstor's Service nor its Secret.
  - it: leaves the linstor-scheduler on its defaults under linstor
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-scheduler

  - it: tells the linstor-scheduler only the backend under blockstor
    set:
      storage:
        backend: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - equal:
          path: spec.components.linstor-scheduler.values.linstor-scheduler.linstor
          value:
            backend: blockstor
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-scheduler

  - it: tells linstor-gui only the backend under blockstor
    set:
      storage:
        backend: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages: [cozystack.linstor-gui]
    asserts:
      - equal:
          path: spec.components.linstor-gui.values.linstor
          value:
            backend: blockstor
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-gui

  # During a migration step LINSTOR's state is still the one CSI acts on, and
  # blockstor-apiserver serves Resources it has not adopted, which the
  # scheduler extender cannot read. The consumers move with linstor-csi, when
  # the step is cleared.
  - it: leaves the linstor-scheduler on LINSTOR during a migration step
    set:
      storage:
        backend: blockstor
        blockstorMigration: hold
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-scheduler

  - it: leaves the linstor-scheduler on LINSTOR while adopting on the generic variant
    set:
      storage:
        backend: blockstor
        blockstorMigration: adopt
      bundles:
        system:
          enabled: true
          variant: isp-full-generic
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-scheduler

  - it: leaves linstor-gui on LINSTOR during a migration step
    set:
      storage:
        backend: blockstor
        blockstorMigration: adopt
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages: [cozystack.linstor-gui]
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-gui

  - it: leaves linstor-gui on its defaults under linstor
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages: [cozystack.linstor-gui]
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-gui

  # An empty value is not "unset". `default` would have read each of these as
  # linstor, and on a blockstor cluster that is a switch of control plane.
  - it: fails the render on an empty backend
    set:
      storage:
        backend: ""
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.backend must be "linstor" or "blockstor", got ""'

  - it: fails the render on a false backend
    set:
      storage:
        backend: false
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.backend must be "linstor" or "blockstor", got false'

  - it: fails the render on a numeric backend
    set:
      storage:
        backend: 0
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.backend must be "linstor" or "blockstor", got 0'

  - it: fails the render on a storage key that is not a map
    set:
      storage: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage must be a map with a backend key, got blockstor'

  # A migration step has to reach the linstor package, which renders piraeus
  # unchanged while it is set; left behind in the platform it would deploy the
  # finished switch at once.
  - it: passes the blockstor migration step through
    set:
      storage:
        backend: blockstor
        blockstorMigration: hold
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - equal:
          path: spec.components.linstor.values
          value:
            backend: blockstor
            blockstorMigration: hold
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  - it: passes the blockstor migration step through on the generic variant
    set:
      storage:
        backend: blockstor
        blockstorMigration: adopt
      bundles:
        system:
          enabled: true
          variant: isp-full-generic
    asserts:
      - equal:
          path: spec.components.linstor.values
          value:
            backend: blockstor
            blockstorMigration: adopt
            talos:
              enabled: false
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  # The empty default must not add a key: every blockstor cluster would roll a
  # new revision of the linstor release for nothing.
  - it: states no migration step once it is removed
    set:
      storage:
        backend: blockstor
        blockstorMigration: ""
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - equal:
          path: spec.components.linstor.values
          value:
            backend: blockstor
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  - it: fails the render on an unknown migration step
    set:
      storage:
        backend: blockstor
        blockstorMigration: adopted
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.blockstorMigration must be "", "hold" or "adopt", got "adopted"'

  # The way back to linstor has to drop the step in the same change, or the
  # next switch to blockstor would come up holding.
  - it: fails the render on a migration step under the linstor backend
    set:
      storage:
        backend: linstor
        blockstorMigration: hold
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.blockstorMigration "hold" is only valid with storage.backend: blockstor; remove it together with switching the backend back'

  - it: fails the render on a migration step under linstor on the generic variant
    set:
      storage:
        backend: linstor
        blockstorMigration: adopt
      bundles:
        system:
          enabled: true
          variant: isp-full-generic
    asserts:
      - failedTemplate:
          errorMessage: 'storage.blockstorMigration "adopt" is only valid with storage.backend: blockstor; remove it together with switching the backend back'
