suite: storage backend selection reaches the linstor package
templates:
  - templates/bundles/system.yaml
release:
  name: cozystack
  namespace: cozy-system

# The operator picks the storage control plane at install time. The choice has
# to arrive at the linstor package as a value, because that package renders one
# backend or the other from it — a choice that stayed in the platform chart
# would be inert. LINSTOR is the default: every existing cluster runs it, and a
# silent flip would swap the storage control plane under live data.
tests:
  # The default leaves the linstor Package exactly as it was before the choice
  # existed: no components, so the chart default (linstor) applies and an
  # upgrade does not roll a new revision of the release for nothing.
  - it: defaults to the linstor backend without restating it
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  - it: states nothing but the talos override on the generic variant by default
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full-generic
    asserts:
      - equal:
          path: spec.components.linstor.values
          value:
            talos:
              enabled: false
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  - it: passes blockstor through when the operator asks for it
    set:
      storage:
        backend: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - equal:
          path: spec.components.linstor.values.backend
          value: blockstor
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  - it: keeps the generic variant's talos override alongside the backend
    set:
      storage:
        backend: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full-generic
    asserts:
      - equal:
          path: spec.components.linstor.values.backend
          value: blockstor
        documentSelector:
          path: metadata.name
          value: cozystack.linstor
      - equal:
          path: spec.components.linstor.values.talos.enabled
          value: false
        documentSelector:
          path: metadata.name
          value: cozystack.linstor

  # A typo must not quietly deploy the wrong storage control plane.
  - it: fails the render on an unrecognised backend
    set:
      storage:
        backend: blockstore
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.backend must be "linstor" or "blockstor", got "blockstore"'

  # Under linstor the API consumers keep their chart defaults, which name the
  # objects piraeus-operator creates. Under blockstor piraeus runs external and
  # the linstor package must not render objects under piraeus's names, which
  # Helm refuses to adopt, so the consumers are pointed at blockstor's own.
  - it: leaves the linstor-scheduler on its defaults under linstor
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-scheduler

  - it: points the linstor-scheduler at blockstor-apiserver under blockstor
    set:
      storage:
        backend: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - equal:
          path: spec.components.linstor-scheduler.values.linstor-scheduler.linstor
          value:
            endpoint: https://blockstor-apiserver.cozy-linstor.svc:3371
            clientSecret: blockstor-apiserver-client-tls
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-scheduler

  - it: points linstor-gui at blockstor-apiserver under blockstor
    set:
      storage:
        backend: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages: [cozystack.linstor-gui]
    asserts:
      - equal:
          path: spec.components.linstor-gui.values.linstor
          value:
            endpoint: https://blockstor-apiserver.cozy-linstor.svc:3371
            clientSecret: blockstor-apiserver-client-tls
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-gui

  - it: leaves linstor-gui on its defaults under linstor
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages: [cozystack.linstor-gui]
    asserts:
      - notExists:
          path: spec.components
        documentSelector:
          path: metadata.name
          value: cozystack.linstor-gui

  # An empty value is not "unset". `default` would have read each of these as
  # linstor, and on a blockstor cluster that is a switch of control plane.
  - it: fails the render on an empty backend
    set:
      storage:
        backend: ""
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.backend must be "linstor" or "blockstor", got ""'

  - it: fails the render on a false backend
    set:
      storage:
        backend: false
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.backend must be "linstor" or "blockstor", got false'

  - it: fails the render on a numeric backend
    set:
      storage:
        backend: 0
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage.backend must be "linstor" or "blockstor", got 0'

  - it: fails the render on a storage key that is not a map
    set:
      storage: blockstor
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorMessage: 'storage must be a map with a backend key, got blockstor'
