suite: credentials migration Job renders with the migration hook's gate

# The second part of the credentials conversion is a Job, not a hook: it waits
# for every converted release to be Ready on the switched chart, which may
# outlast an upgrade, and it is re-run by hand once a left-out release is
# fixed. It renders only where migrations run, as the hook does, runs the
# migrations image, and names the migration whose state it continues.
templates:
  - templates/credentials-migration-job.yaml

release:
  name: cozystack-platform
  namespace: cozy-system

tests:
  - it: renders nothing where migrations are disabled
    set:
      migrations:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Job, its ServiceAccount and the cluster-admin binding where migrations run
    set:
      migrations:
        enabled: true
        image: ghcr.io/cozystack/cozystack/platform-migrations:test
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: cozystack-credentials-migration-60
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/cozystack/cozystack/platform-migrations:test
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].command
          content: finish
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].command
          content: --migration=60
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: spec.template.spec.serviceAccountName
          value: cozystack-credentials-migration
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: roleRef.name
          value: cluster-admin
        documentSelector:
          path: kind
          value: ClusterRoleBinding
