suite: credentials migration Job renders with the migration hook's gate

# The Job renders only where migrations run, as the hook does, runs the
# migrations image, and names the migration whose state it continues.
templates:
  - templates/credentials-migration-job.yaml

release:
  name: cozystack-platform
  namespace: cozy-system

tests:
  - it: renders nothing where migrations are disabled
    set:
      migrations:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Job, its ServiceAccount and the cluster-admin binding where migrations run
    set:
      migrations:
        enabled: true
        image: registry.example/platform-migrations:test
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: cozystack-credentials-migration-60
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example/platform-migrations:test
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].command
          content: finish
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].command
          content: --migration=60
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: spec.template.spec.serviceAccountName
          value: cozystack-credentials-migration
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: roleRef.name
          value: cluster-admin
        documentSelector:
          path: kind
          value: ClusterRoleBinding
