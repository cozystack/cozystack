suite: backup framework and strategy sources wait for what they render into
# The base chart creates the cozy-backups Bucket in the tenant-root namespace,
# which cozystack-basics provisions: without that edge the Bucket races
# namespace creation on a fresh install and fails with `namespaces
# "tenant-root" not found`. The other edges guard the `no matches for kind`
# race for the objects each chart renders.
templates:
  - templates/sources.yaml
release:
  name: cozystack
  namespace: cozy-system
tests:
  - it: backupstrategy-controller dependsOn cozystack-basics and the CRD providers
    documentSelector:
      path: metadata.name
      value: cozystack.backupstrategy-controller
    asserts:
      - contains:
          path: spec.variants[0].dependsOn
          content: cozystack.cozystack-basics
      - contains:
          path: spec.variants[0].dependsOn
          content: cozystack.backup-controller
      - contains:
          path: spec.variants[0].dependsOn
          content: cozystack.bucket-application
      - contains:
          path: spec.variants[0].dependsOn
          content: cozystack.objectstorage-controller
      - equal:
          path: spec.sourceRef.name
          value: cozystack-backup-strategies

  # The BackupStorageLocation the Velero strategy renders is a Velero kind,
  # and its BackupClass fragment a backup-controller kind.
  - it: the Velero strategy dependsOn velero, the framework and the core controller
    documentSelector:
      path: metadata.name
      value: cozystack.backup-strategy-velero
    asserts:
      - contains:
          path: spec.variants[0].dependsOn
          content: cozystack.velero
      - contains:
          path: spec.variants[0].dependsOn
          content: cozystack.backupstrategy-controller
      - contains:
          path: spec.variants[0].dependsOn
          content: cozystack.backup-controller
