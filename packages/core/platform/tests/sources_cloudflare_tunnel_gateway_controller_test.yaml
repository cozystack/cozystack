suite: cloudflare-tunnel-gateway-controller PackageSource
# The controller ships its CRDs in crds/ and has added new kinds across minor
# releases (GatewayConfig, ExternalBackend). Helm never touches crds/ on
# upgrade, so the PackageSource opts into CreateReplace; without it a chart
# bump lands the new controller binary on an existing cluster with the old
# CRD set. It also depends on the Gateway API CRDs, which cozystack installs as
# their own package rather than through networking.
templates:
  - templates/sources.yaml
release:
  name: cozystack
  namespace: cozy-system
tests:
  - it: sets upgradeCRDs to CreateReplace and depends on gateway-api-crds
    documentSelector:
      path: metadata.name
      value: cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - equal:
          path: spec.variants[0].components[0].install.upgradeCRDs
          value: CreateReplace
      - contains:
          path: spec.variants[0].dependsOn
          content: cozystack.gateway-api-crds

  # The proxy's topologySpreadConstraints selector in the package values keys on
  # app.kubernetes.io/instance, which the chart fills from .Release.Name, which
  # is this releaseName. The package's own chart test cannot see that coupling
  # because it declares its own release name, so changing this value there would
  # silently select nothing and let both proxy replicas share a node again.
  - it: installs under the release name the proxy spread selector expects
    documentSelector:
      path: metadata.name
      value: cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - equal:
          path: spec.variants[0].components[0].install.releaseName
          value: cloudflare-tunnel-gateway-controller
