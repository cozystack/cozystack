suite: apps.yaml registries.imageOverrides → _cluster.image-overrides wiring

templates:
  - templates/apps.yaml

release:
  name: cozy-platform
  namespace: cozy-system

# The table reaches every release through the cozystack-values Secret, where
# cozystack-operator and cozystack-api read it for the releases they build and
# cozy-lib.postRenderers for the ones charts render. Both Go readers refuse a
# table they cannot apply, so the render must refuse it first, naming the bad
# entry.

tests:
  - it: carries no image-overrides key by default
    asserts:
      - notMatchRegex:
          path: stringData["values.yaml"]
          pattern: 'image-overrides'

  - it: treats a null table as no table
    set:
      registries:
        imageOverrides: null
    asserts:
      - notMatchRegex:
          path: stringData["values.yaml"]
          pattern: 'image-overrides'

  - it: refuses false rather than reading it as an empty table
    set:
      registries:
        imageOverrides: false
    asserts:
      - failedTemplate:
          errorPattern: 'registries.imageOverrides must be a list, got bool'

  - it: refuses 0 rather than reading it as an empty table
    set:
      registries:
        imageOverrides: 0
    asserts:
      - failedTemplate:
          errorPattern: 'registries.imageOverrides must be a list, got (float64|int64)'

  - it: passes the table through under _cluster
    set:
      registries:
        imageOverrides:
          - name: registry.k8s.io/sig-storage/csi-attacher
            newName: registry.example.org/os/external-attacher
            newTag: "4.10.0"
            digest: sha256:f80b60d4523dcdecb225c3113bcbd0eedc45b4d2b46f87c0ccf4f14d09a4a35f
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: '(?m)^  image-overrides:\n    - digest: sha256:f80b60d4523dcdecb225c3113bcbd0eedc45b4d2b46f87c0ccf4f14d09a4a35f\n      name: registry.k8s.io/sig-storage/csi-attacher\n      newName: registry.example.org/os/external-attacher\n      newTag: 4.10.0$'

  - it: keeps a registry port in the name
    set:
      registries:
        imageOverrides:
          - name: registry.example.org:5000/os/kubeovn
            newTag: v2
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: 'name: registry.example.org:5000/os/kubeovn'

  - it: refuses an entry without a name
    set:
      registries:
        imageOverrides:
          - newName: c/d
    asserts:
      - failedTemplate:
          errorPattern: 'registries.imageOverrides\[0\]: name is required'

  - it: refuses a name carrying a tag
    set:
      registries:
        imageOverrides:
          - name: a/b:v1
            newName: c/d
    asserts:
      - failedTemplate:
          errorPattern: 'must not carry a tag or digest'

  - it: refuses an entry that changes nothing
    set:
      registries:
        imageOverrides:
          - name: a/b
    asserts:
      - failedTemplate:
          errorPattern: 'sets none of newName, newTag, digest'

  - it: refuses a malformed digest
    set:
      registries:
        imageOverrides:
          - name: a/b
            digest: sha256:abc
    asserts:
      - failedTemplate:
          errorPattern: 'is not sha256:<64 hex>'

  - it: refuses an unknown field
    set:
      registries:
        imageOverrides:
          - name: a/b
            newImage: c/d
    asserts:
      - failedTemplate:
          errorPattern: 'unknown field "newImage"'

  - it: refuses a name listed twice
    set:
      registries:
        imageOverrides:
          - name: a/b
            newName: c/d
          - name: a/b
            newTag: v2
    asserts:
      - failedTemplate:
          errorPattern: '"a/b" is listed twice'

  - it: refuses a tag YAML read as a number
    set:
      registries:
        imageOverrides:
          - name: a/b
            newTag: 1.20
    asserts:
      - failedTemplate:
          errorPattern: 'registries.imageOverrides\[0\].newTag must be a string, got float64; quote it'
