suite: address-controller and metallb-iad optional packages (opt-in via enabledPackages)
templates:
  - templates/bundles/system.yaml
release:
  name: cozystack
  namespace: cozy-system

# The address substrate (cozystack.address-controller, the core CRDs and
# controller) and its MetalLB driver (cozystack.metallb-iad) ship as system
# packages but are not part of any bundle: a platform turns them on by listing
# them in bundles.enabledPackages, the way the other optional system packages
# work.
tests:
  - it: emits neither package by default
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.address-controller
          any: true
        not: true
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.metallb-iad
          any: true
        not: true

  - it: emits both packages when listed in enabledPackages
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.address-controller
          - cozystack.metallb-iad
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.address-controller
          any: true
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.metallb-iad
          any: true
