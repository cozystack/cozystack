suite: capacity experiment - paas and naas emit nothing
templates:
  - templates/bundles/paas.yaml
  - templates/bundles/naas.yaml
release: {name: cozystack, namespace: cozy-system}
set:
  bundles:
    system: {enabled: true, variant: isp-full}
    iaas: {enabled: true}
    paas: {enabled: false}
    naas: {enabled: false}
    disabledPackages:
      - cozystack.velero
      - cozystack.monitoring-agents
      - cozystack.goldpinger
      - cozystack.backup-controller
tests:
  - it: paas emits nothing
    templates: [templates/bundles/paas.yaml]
    asserts: [{hasDocuments: {count: 0}}]
  - it: naas emits nothing
    templates: [templates/bundles/naas.yaml]
    asserts: [{hasDocuments: {count: 0}}]
