suite: cloudflare-tunnel-gateway-controller is opt-in and gets the cluster domain
# The package cannot become Ready without operator-supplied Cloudflare
# credentials and a tunnel ID, so it must never be emitted by default: a
# default emission would leave every fresh install with a Package stuck on
# a missing Secret. When it is enabled, the bundle threads
# networking.clusterDomain into the component values, because the vendored
# chart bakes that domain into the proxy config-endpoint URL and cannot read
# _cluster.cluster-domain from subchart values.
templates:
  - templates/bundles/system.yaml
release:
  name: cozystack
  namespace: cozy-system
tests:
  - it: is not emitted unless listed in enabledPackages
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.cloudflare-tunnel-gateway-controller
          any: true
        not: true

  - it: is emitted with the platform cluster domain when listed in enabledPackages
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
      networking:
        clusterDomain: example.local
    documentSelector:
      path: metadata.name
      value: cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - equal:
          path: kind
          value: Package
      - equal:
          path: spec.components.cloudflare-tunnel-gateway-controller.values.cloudflare-tunnel-gateway-controller.controller.clusterDomain
          value: example.local

  # An empty override wins over the package's own cozy.local default and sends
  # the vendored chart to its cluster.local fallback, so the empty value must
  # not travel. The controller map around it still has to be rendered: on a
  # client-side release, a key this release rendered before and stops
  # rendering is deleted from the live Package, and the operator's tunnelID is
  # a sibling under the same path.
  - it: carries no cluster domain but keeps the key path when the value is empty
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
      networking:
        clusterDomain: ""
    documentSelector:
      path: metadata.name
      value: cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - exists:
          path: spec.components.cloudflare-tunnel-gateway-controller.values.cloudflare-tunnel-gateway-controller.controller
      - exists:
          path: spec.components.cloudflare-tunnel-gateway-controller.values.cloudflare-tunnel-gateway-controller.controller.clusterDomain
        not: true

  - it: carries no cluster domain but keeps the key path when the value is absent
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
      networking:
        clusterDomain: null
    documentSelector:
      path: metadata.name
      value: cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - exists:
          path: spec.components.cloudflare-tunnel-gateway-controller.values.cloudflare-tunnel-gateway-controller.controller
      - exists:
          path: spec.components.cloudflare-tunnel-gateway-controller.values.cloudflare-tunnel-gateway-controller.controller.clusterDomain
        not: true

  # The two cases above give networking a body; this one takes the whole key
  # away. `networking:` written with nothing under it is YAML null, and the
  # two variant blocks higher in this template already guard for that, so the
  # nil is reachable here too -- reaching it through the unguarded lookup was
  # a render failure for the whole platform rather than for this package.
  - it: still emits this package's Package CR when networking is absent
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
      networking: null
    documentSelector:
      path: metadata.name
      value: cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - exists:
          path: spec.components.cloudflare-tunnel-gateway-controller.values.cloudflare-tunnel-gateway-controller.controller
      - exists:
          path: spec.components.cloudflare-tunnel-gateway-controller.values.cloudflare-tunnel-gateway-controller.controller.clusterDomain
        not: true

  - it: keeps the disabledPackages opt-out working
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
        disabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.cloudflare-tunnel-gateway-controller
          any: true
        not: true

  # helm.sh/resource-policy: keep leaves the Package, its HelmRelease and the
  # controller's cluster-wide RBAC in place once the platform stops rendering
  # it, so a cluster whose values read "disabled" would keep running the
  # controller. The render refuses that state instead of producing it.
  - it: fails the render when the Package is live but no longer in enabledPackages
    kubernetesProvider: &cfTunnelLivePackage
      scheme:
        "cozystack.io/v1alpha1/Package":
          gvr:
            group: "cozystack.io"
            version: "v1alpha1"
            resource: "packages"
          namespaced: false
      objects:
        - kind: Package
          apiVersion: cozystack.io/v1alpha1
          metadata:
            name: cozystack.cloudflare-tunnel-gateway-controller
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - failedTemplate:
          errorPattern: "cozystack.cloudflare-tunnel-gateway-controller is no longer rendered.*still exists on the cluster.*kubectl delete package.cozystack.io cozystack.cloudflare-tunnel-gateway-controller"

  - it: fails the render when the live Package is vetoed through disabledPackages
    kubernetesProvider: *cfTunnelLivePackage
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
        disabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - failedTemplate:
          errorPattern: "cozystack.cloudflare-tunnel-gateway-controller is no longer rendered"

  - it: renders the Package as usual when it is live and still enabled
    kubernetesProvider: *cfTunnelLivePackage
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
    documentSelector:
      path: metadata.name
      value: cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - equal:
          path: kind
          value: Package
