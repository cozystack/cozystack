suite: cloudflare-tunnel-gateway-controller is opt-in and gets the cluster domain
# The package cannot become Ready without operator-supplied Cloudflare
# credentials and a tunnel ID, so it must never be emitted by default: a
# default emission would leave every fresh install with a Package stuck on
# a missing Secret. When it is enabled, the bundle threads
# networking.clusterDomain into the component values, because the vendored
# chart bakes that domain into the proxy config-endpoint URL and cannot read
# _cluster.cluster-domain from subchart values.
templates:
  - templates/bundles/system.yaml
release:
  name: cozystack
  namespace: cozy-system
tests:
  - it: is not emitted unless listed in enabledPackages
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.cloudflare-tunnel-gateway-controller
          any: true
        not: true

  - it: is emitted with the platform cluster domain when listed in enabledPackages
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
      networking:
        clusterDomain: example.local
    documentSelector:
      path: metadata.name
      value: cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - equal:
          path: kind
          value: Package
      - equal:
          path: spec.components.cloudflare-tunnel-gateway-controller.values.cloudflare-tunnel-gateway-controller.controller.clusterDomain
          value: example.local

  - it: keeps the disabledPackages opt-out working
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
        disabledPackages:
          - cozystack.cloudflare-tunnel-gateway-controller
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.cloudflare-tunnel-gateway-controller
          any: true
        not: true
