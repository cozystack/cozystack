suite: GPU controllers follow gpu-operator's VM variants
templates:
  - templates/bundles/system.yaml
release:
  name: cozystack
  namespace: cozy-system
tests:
  - it: enables the GPU controllers when gpu-operator serves GPUs to VMs
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        iaas:
          enabled: true
          gpuOperatorVariant: vgpu
        enabledPackages:
          - cozystack.gpu-operator
      telemetry:
        disabled: true
    documentSelector:
      path: metadata.name
      value: cozystack.cozystack-engine
    asserts:
      - equal:
          path: spec.components.cozystack-controller.values.cozystackController
          value:
            disableTelemetry: true
            gpu:
              enabled: true

  - it: enables them for the default variant on isp-full-generic
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full-generic
        iaas:
          enabled: true
        enabledPackages:
          - cozystack.gpu-operator
    documentSelector:
      path: metadata.name
      value: cozystack.cozystack-engine
    asserts:
      - equal:
          path: spec.components.cozystack-controller.values.cozystackController.gpu.enabled
          value: true

  - it: leaves them off for the container variant
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        iaas:
          enabled: true
          gpuOperatorVariant: container
        enabledPackages:
          - cozystack.gpu-operator
    documentSelector:
      path: metadata.name
      value: cozystack.cozystack-engine
    asserts:
      - notExists:
          path: spec.components

  - it: leaves them off when gpu-operator is disabled
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        iaas:
          enabled: true
        enabledPackages:
          - cozystack.gpu-operator
        disabledPackages:
          - cozystack.gpu-operator
    documentSelector:
      path: metadata.name
      value: cozystack.cozystack-engine
    asserts:
      - notExists:
          path: spec.components

  - it: leaves them off without the iaas bundle
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        enabledPackages:
          - cozystack.gpu-operator
    documentSelector:
      path: metadata.name
      value: cozystack.cozystack-engine
    asserts:
      - notExists:
          path: spec.components

  - it: leaves them off on an iaas cluster without gpu-operator
    set:
      bundles:
        system:
          enabled: true
          variant: isp-full
        iaas:
          enabled: true
    documentSelector:
      path: metadata.name
      value: cozystack.cozystack-engine
    asserts:
      - notExists:
          path: spec.components
