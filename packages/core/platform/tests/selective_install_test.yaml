suite: selective install via disabledPackages

# The platform reduces to exactly the packages a test run needs without a
# dedicated "minimal" variant: the base package helper consults
# bundles.disabledPackages for EVERY package, not only those declared through
# package.optional. tests/bundles_velero_default_test.yaml already pins that
# property for one package; this pins that it holds for a whole install shape.
#
# The list is the real output of `hack/select-install.sh --disabled postgres`,
# the complement of the forward dependency closure the postgres suite needs.
# Regenerate after adding a PackageSource:
#
#   hack/select-install.sh --disabled postgres | tr ' ' '\n' | sed 's/^/    - /'
#
# Held in one YAML anchor rather than repeated per test: it was pasted five times
# before, 450 of 565 lines, with nothing keeping the copies in step.

