templates:
  - templates/bundles/paas.yaml
  - templates/bundles/iaas.yaml
  - templates/bundles/naas.yaml
  - templates/bundles/system.yaml

release:
  name: cozystack
  namespace: cozy-system

tests:
  # The load-bearing case. Mutating the helper to ignore disabledPackages turns
  # exactly this one red, which is why the others below are framed as guards
  # rather than as evidence for the mechanism.
  - it: "drops the app operators the closure does not reach"
    template: templates/bundles/paas.yaml
    set:
      bundles:
        system: {enabled: true, variant: isp-full}
        paas: {enabled: true}
        disabledPackages: *disabled
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.mariadb-operator
          any: true
        not: true
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.kafka-operator
          any: true
        not: true

  - it: "keeps the selected app"
    template: templates/bundles/paas.yaml
    set:
      bundles:
        system: {enabled: true, variant: isp-full}
        paas: {enabled: true}
        disabledPackages: *disabled
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.postgres-application
          any: true

  # postgres-operator comes from the system bundle, not the app catalogue, so
  # this is what shows the closure spans bundles rather than one of them.
  - it: "keeps a closure member emitted by a different bundle"
    template: templates/bundles/system.yaml
    set:
      bundles:
        system: {enabled: true, variant: isp-full}
        disabledPackages: *disabled
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.postgres-operator
          any: true

  # The platform baseline is seeded unconditionally by select-install.sh because
  # nothing declares a dependsOn edge to it, yet the install waits on it and the
  # suites run inside tenant-root. If it ever fell into the complement the
  # reduced platform would have nowhere to install anything.
  - it: "keeps the tenant baseline the install waits for"
    template: templates/bundles/system.yaml
    set:
      bundles:
        system: {enabled: true, variant: isp-full}
        disabledPackages: *disabled
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: Package
          name: cozystack.tenant-application
          any: true

  # iaas and naas carry five fail() guards between them on inconsistent
  # enable/variant combinations. A large disable list is not one of those
  # combinations; this pins that it does not become one.
  - it: "the iaas bundle renders with most packages disabled"
    template: templates/bundles/iaas.yaml
    set:
      bundles:
        system: {enabled: true, variant: isp-full}
        iaas: {enabled: true}
        disabledPackages: *disabled
    asserts:
      - notFailedTemplate: {}

  - it: "the naas bundle renders with most packages disabled"
    template: templates/bundles/naas.yaml
    set:
      bundles:
        system: {enabled: true, variant: isp-full}
        naas: {enabled: true}
        disabledPackages: *disabled
    asserts:
      - notFailedTemplate: {}
