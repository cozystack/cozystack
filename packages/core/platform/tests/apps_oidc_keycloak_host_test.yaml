suite: apps.yaml OIDC keycloak-host platform → tenant value wiring
templates:
  - templates/apps.yaml

release:
  name: cozy-platform
  namespace: cozy-system

# authentication.oidc.keycloakHost is the single source for the host of the
# Keycloak issuer. It rides the _cluster channel as keycloak-host, already
# resolved, so the Keycloak chart and every OIDC consumer agree on it without
# each re-deriving keycloak.<root-host>.

tests:
  - it: defaults the keycloak host to keycloak.<publishing.host>
    set:
      publishing.host: example.org
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: 'keycloak-host:\s*"keycloak\.example\.org"'

  - it: propagates a custom keycloak host onto the _cluster channel
    set:
      publishing.host: example.org
      authentication.oidc.keycloakHost: auth.example.org
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: 'keycloak-host:\s*"auth\.example\.org"'

  # The host is spliced after "https://" and into --whitelist-domain, so a
  # scheme would yield https://https://... and a path would shift the realm.
  - it: rejects a keycloak host carrying a scheme
    set:
      authentication.oidc.keycloakHost: https://auth.example.org
    asserts:
      - failedTemplate:
          errorPattern: 'authentication.oidc.keycloakHost "https://auth.example.org" is invalid'

  - it: rejects a keycloak host carrying a path
    set:
      authentication.oidc.keycloakHost: auth.example.org/realms
    asserts:
      - failedTemplate:
          errorPattern: 'authentication.oidc.keycloakHost "auth.example.org/realms" is invalid'

  - it: rejects a keycloak host carrying a port
    set:
      authentication.oidc.keycloakHost: auth.example.org:8443
    asserts:
      - failedTemplate:
          errorPattern: 'authentication.oidc.keycloakHost "auth.example.org:8443" is invalid'

  # `default` treats false and 0 as unset; checking the kind first keeps a
  # mistyped value from silently falling back to keycloak.<root-host>.
  - it: rejects a non-string keycloak host instead of falling back to the default
    set:
      authentication.oidc.keycloakHost: false
    asserts:
      - failedTemplate:
          errorMessage: 'authentication.oidc.keycloakHost must be a string (got bool)'

  - it: rejects a DNS label longer than 63 characters
    set:
      authentication.oidc.keycloakHost: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.example.org
    asserts:
      - failedTemplate:
          errorPattern: 'authentication.oidc.keycloakHost ".*" is invalid'

  - it: rejects a hostname longer than 253 characters
    set:
      authentication.oidc.keycloakHost: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.org
    asserts:
      - failedTemplate:
          errorPattern: 'authentication.oidc.keycloakHost ".*" is invalid'

  - it: accepts a 63-character label
    set:
      authentication.oidc.keycloakHost: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.example.org
    asserts:
      - matchRegex:
          path: stringData["values.yaml"]
          pattern: 'keycloak-host:\s*"a{63}\.example\.org"'
