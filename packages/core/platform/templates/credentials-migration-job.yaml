{{- if .Values.migrations.enabled }}
{{- /*
  Second part of the credentials conversion of migration 60 (Postgres): a Job
  rather than a hook, because it waits for every converted release to be
  Ready on the switched chart, which may take longer than an upgrade should
  hold, and because it has to be run again by hand once an operator fixes a
  release it left out. It is idempotent: credentials-migrate keeps its state
  in the credentials-migration-60 ConfigMap and acts only on releases the
  hook recorded that are not done. The spec never changes, so the platform
  release re-applies it as a no-op; to run it again, delete the Job and
  reconcile the platform HelmRelease. It exits non-zero while a release is
  left out, so the failed Job is the one place that shows what remains.
  cluster-admin, as the hook: it writes Secrets and HelmRelease values in
  every tenant namespace.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cozystack-credentials-migration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cozystack-credentials-migration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: cozystack-credentials-migration
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cozystack-credentials-migration-60
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      serviceAccountName: cozystack-credentials-migration
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: {{ .Values.migrations.image }}
          command:
            - credentials-migrate
            - finish
            - --migration=60
            - --kind=Postgres
            - --format=scram-sha-256
            - --accounts-path=users
            - --label=cnpg.io/reload=true
            - --timeout=30m
          env:
            - name: CREDENTIALS_MIGRATE_ACTOR
              value: system:serviceaccount:{{ .Release.Namespace }}:cozystack-credentials-migration
{{- end }}
