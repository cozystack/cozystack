---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.vm-default-images
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
    - name: default
      dependsOn:
        - cozystack.networking
        - cozystack.kubevirt-cdi
      libraries:
        - name: cozy-lib
          path: library/cozy-lib
      components:
        - name: vm-default-images
          path: system/vm-default-images
          libraries: ["cozy-lib"]
          install:
            namespace: cozy-system
            releaseName: vm-default-images
            # Ready only once every image has imported, so the status says
            # whether the collection is actually there. Any phase other than
            # Succeeded or Failed matches neither expression and flux keeps
            # waiting. There is no per-component timeout: a download that
            # outlasts the operator-wide install window is retried as an
            # upgrade until it finishes, and nothing is uninstalled in between.
            healthCheckExprs:
              - apiVersion: cdi.kubevirt.io/v1beta1
                kind: DataVolume
                failed: "has(status.phase) && status.phase == 'Failed'"
                current: "has(status.phase) && status.phase == 'Succeeded'"
    # The same collection on an external Proxmox VE cluster: every image is a
    # cloneable VirtualMachineVolume in cozy-public, copied from the Proxmox
    # volume the image names, that a tenant's vm-disk clones in turn. kubemox
    # and the catalog come from cozystack.proxmox-vm. Selected by
    # vmDefaultImages.substrate: proxmox on the platform; the images list has
    # to be overridden there, since the default entries carry only a URL and
    # downloading one is not available on this substrate yet.
    - name: proxmox
      dependsOn:
        - cozystack.networking
        - cozystack.proxmox-vm
      libraries:
        - name: cozy-lib
          path: library/cozy-lib
      components:
        - name: vm-default-images
          path: system/vm-default-images
          libraries: ["cozy-lib"]
          valuesFiles:
            - values.yaml
            - values-proxmox.yaml
          install:
            namespace: cozy-system
            releaseName: vm-default-images
            # Ready only once every image has been copied onto its holder: a
            # VirtualMachineVolume is Ready when it sits there, Failed when
            # Proxmox refused, Pending in between.
            healthCheckExprs:
              - apiVersion: proxmox.alperen.cloud/v1alpha1
                kind: VirtualMachineVolume
                failed: "has(status.phase) && status.phase == 'Failed'"
                current: "has(status.phase) && status.phase == 'Ready'"
