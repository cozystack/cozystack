---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.foundationdb-operator
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
  - name: default
    dependsOn:
    - cozystack.networking
    - cozystack.cert-manager
    components:
    - name: foundationdb-operator
      path: system/foundationdb-operator
      install:
        namespace: cozy-foundationdb-operator
        releaseName: foundationdb-operator
        # helm-controller defaults CRD upgrades to Skip, so a cluster that
        # took an operator bump keeps the old schema: the v2.30.0 operator's
        # status.backupDetails.restorable is pruned and backups never report
        # restorable. The schema diff is additive, so replace is safe.
        upgradeCRDs: CreateReplace
