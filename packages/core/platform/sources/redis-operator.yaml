---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.redis-operator
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
  - name: default
    dependsOn:
    - cozystack.networking
    components:
    - name: redis-operator
      path: system/redis-operator
      install:
        namespace: cozy-redis-operator
        releaseName: redis-operator
        # The freshworks fork ships an engine-aware CRD (spec.engine, for the
        # Valkey follow-up). helm-controller defaults CRD upgrades to Skip, so
        # without this an upgraded cluster keeps the old spotahome schema and
        # prunes spec.engine on admission. Additive schema diff, so replace is
        # safe.
        upgradeCRDs: CreateReplace
