---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.keycloak-operator
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
  - name: default
    dependsOn:
    - cozystack.networking
    - cozystack.keycloak
    components:
    - name: keycloak-operator
      path: system/keycloak-operator
      install:
        namespace: cozy-keycloak
        releaseName: keycloak-operator
        # helm-controller leaves existing CRDs alone on upgrade, so a cluster
        # installed before v1.2.0 keeps the v1.25.0 schema and the apiserver
        # prunes the realm session settings keycloak-configure sets. v1.32.0
        # drops the realm, targetRealm and keycloakOwner fields deprecated in
        # favour of realmRef and keycloakRef. The platform renders only the
        # refs, so replace is safe.
        upgradeCRDs: CreateReplace
