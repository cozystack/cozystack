---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.proxmox-network
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
  # Platform-owned Proxmox bridge, VLANs and IP pools for tenant networks. The
  # IPAM provider owns the InClusterIPPool kind the package renders one of per
  # network; capmox itself is not a dependency, because the zone table and the
  # pools exist before any Proxmox-backed cluster does, and the admission
  # policies judge capmox's kinds only once they are served.
  - name: default
    dependsOn:
    - cozystack.capi-provider-ipam-in-cluster
    components:
    - name: proxmox-network-crds
      path: system/proxmox-network-crds
      install:
        namespace: cozy-proxmox-network
        releaseName: proxmox-network-crds
    - name: proxmox-network
      path: system/proxmox-network
      install:
        privileged: true
        namespace: cozy-proxmox-network
        releaseName: proxmox-network
        dependsOn:
        - proxmox-network-crds
