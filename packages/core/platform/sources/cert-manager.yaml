---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.cert-manager
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
  - name: default
    dependsOn:
    - cozystack.networking
    - cozystack.gateway-api-crds
    components:
    - name: cert-manager-crds
      path: system/cert-manager-crds
      install:
        namespace: cozy-cert-manager
        releaseName: cert-manager-crds
    - name: cert-manager
      path: system/cert-manager
      install:
        namespace: cozy-cert-manager
        releaseName: cert-manager
        dependsOn:
        - cert-manager-crds
    - name: cert-manager-issuers
      path: system/cert-manager-issuers
      install:
        namespace: cozy-cert-manager
        releaseName: cert-manager-issuers
        dependsOn:
        - cert-manager
        # A ClusterIssuer is Ready only after cert-manager has registered an
        # ACME account with the CA. Under kstatus that holds this release, and
        # through dependsOn every package behind cozystack.cert-manager, for as
        # long as the CA is unreachable. Issuance fails and recovers on its own
        # in that window; the platform rollout must not wait for it.
        healthCheckExprs:
        - apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          current: "true"
