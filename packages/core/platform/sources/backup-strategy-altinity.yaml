---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.backup-strategy-altinity
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-backup-strategies
    namespace: cozy-system
    path: /
  variants:
  - name: default
    dependsOn:
    - cozystack.backup-controller
    - cozystack.backupstrategy-controller
    - cozystack.clickhouse-operator
    libraries:
    - name: backup-strategy-lib
      path: library/backup-strategy-lib
    components:
    - name: backup-strategy-altinity
      path: system/backup-strategy-altinity
      libraries: ["backup-strategy-lib"]
      install:
        privileged: true
        namespace: cozy-backup-controller
        releaseName: backup-strategy-altinity
