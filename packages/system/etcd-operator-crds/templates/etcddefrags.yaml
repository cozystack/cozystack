---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
    helm.sh/resource-policy: keep
  name: etcddefrags.etcd-operator.cozystack.io
spec:
  group: etcd-operator.cozystack.io
  names:
    kind: EtcdDefrag
    listKind: EtcdDefragList
    plural: etcddefrags
    singular: etcddefrag
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.defragmented
      name: Defragmented
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          EtcdDefrag is the Schema for the etcddefrags API. It requests a one-shot,
          run-to-completion defragmentation of an EtcdCluster's members. Like
          EtcdSnapshot it is a record: the operator drives it through status.phase and
          it never re-runs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EtcdDefragSpec is the desired state of an EtcdDefrag: a one-shot request to
              defragment an EtcdCluster's members.
            properties:
              clusterRef:
                description: ClusterRef names the EtcdCluster (same namespace) to
                  defragment.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              rule:
                description: |-
                  Rule decides which members this run touches. Absent is equivalent to an
                  empty rule: the default gate (freeSpaceAbove 200Mi). To defragment every
                  member unconditionally, set rule.all: true.
                properties:
                  all:
                    description: |-
                      All defragments every member unconditionally, regardless of size — the
                      explicit "do it now". Mutually exclusive with the threshold fields below.
                    type: boolean
                  freeSpaceAbove:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      FreeSpaceAbove defragments a member whose reclaimable space
                      (DbSize-DbSizeInUse) exceeds this. The primary, always-applied gate.
                      Absent means the built-in default (200Mi).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  minReclaim:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MinReclaim floors the quota arm: even under quota pressure, skip a member
                      that would reclaim less than this. Only meaningful with QuotaUsageAbove,
                      and must not exceed FreeSpaceAbove. Absent means the built-in default
                      (32Mi).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  quotaUsageAbove:
                    description: |-
                      QuotaUsageAbove: when DbSize exceeds this fraction of the backend quota
                      (approaching NOSPACE), lower the reclaimable floor to MinReclaim so small
                      wins are taken under pressure. A member is never defragmented when its
                      reclaimable space is below MinReclaim. Integer percent 1..99 with a "%"
                      suffix, e.g. "80%"; 100% is rejected because a backend never exceeds its
                      quota (etcd raises NOSPACE first), so the arm could never fire.
                    pattern: ^[1-9][0-9]?%$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: rule.all cannot be combined with freeSpaceAbove/quotaUsageAbove/minReclaim
                  rule: '!(has(self.all) && self.all) || (!has(self.freeSpaceAbove)
                    && !has(self.quotaUsageAbove) && !has(self.minReclaim))'
                - message: freeSpaceAbove must be greater than 0
                  rule: '!has(self.freeSpaceAbove) || quantity(string(self.freeSpaceAbove)).isGreaterThan(quantity(''0''))'
                - message: minReclaim must be greater than 0
                  rule: '!has(self.minReclaim) || quantity(string(self.minReclaim)).isGreaterThan(quantity(''0''))'
                - message: minReclaim is only meaningful with quotaUsageAbove
                  rule: '!has(self.minReclaim) || has(self.quotaUsageAbove)'
                - message: minReclaim must not exceed freeSpaceAbove
                  rule: '!(has(self.minReclaim) && has(self.freeSpaceAbove)) || quantity(string(self.minReclaim)).compareTo(quantity(string(self.freeSpaceAbove)))
                    <= 0'
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished records how long after a terminal phase this
                  object should be garbage-collected — meaningful for objects a scheduler
                  stamps out. Acted on by the reconciling controller; the API server does not
                  garbage-collect custom resources on its own. Absent means the record is kept.
                format: int32
                minimum: 0
                type: integer
            required:
            - clusterRef
            type: object
            x-kubernetes-validations:
            - message: spec.clusterRef.name is required
              rule: size(self.clusterRef.name) != 0
          status:
            description: EtcdDefragStatus is the observed state of an EtcdDefrag.
            properties:
              completedAt:
                description: CompletedAt is when the sweep reached a terminal phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations — including why a
                  Pending run is being deferred (e.g. the cluster is not fully healthy).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              defragmented:
                description: Defragmented counts members actually defragmented this
                  run.
                format: int32
                type: integer
              members:
                description: Members holds the per-member outcome of the sweep, keyed
                  by member name.
                items:
                  description: MemberDefragStatus is the outcome of defragmenting
                    a single member.
                  properties:
                    dbSizeAfter:
                      description: DBSizeAfter is the physical backend size after
                        defragmenting.
                      format: int64
                      type: integer
                    dbSizeBefore:
                      description: DBSizeBefore is the member's physical backend size
                        before defragmenting.
                      format: int64
                      type: integer
                    finishedAt:
                      description: FinishedAt is when this member was processed.
                      format: date-time
                      type: string
                    name:
                      description: Name is the EtcdMember this row describes.
                      type: string
                    outcome:
                      description: Outcome is the result of processing this member.
                      type: string
                    reason:
                      description: |-
                        Reason qualifies the outcome (e.g. BelowThreshold, ClusterNotHealthy,
                        RPCError), in condition-reason style.
                      type: string
                    reclaimedBytes:
                      description: ReclaimedBytes is DBSizeBefore-DBSizeAfter for
                        a completed defrag.
                      format: int64
                      type: integer
                    role:
                      description: Role is the member's raft role at the time it was
                        processed.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              phase:
                description: Phase is the high-level lifecycle phase.
                type: string
              startedAt:
                description: StartedAt is when the sweep began.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
