suite: the operator and enable-update-email sign in as the operator client
release:
  name: keycloak-configure
  namespace: cozy-keycloak

# Nothing in the chart signs in with the bootstrap admin once the client exists,
# so the admin can be disabled or deleted. A password sign-in left anywhere
# would break the moment that happens.

tests:
  - it: points ClusterKeycloak at the client with the client credentials grant
    template: templates/configure-kk.yaml
    documentSelector:
      path: kind
      value: ClusterKeycloak
    asserts:
      - equal:
          path: spec.adminType
          value: serviceAccount
      - equal:
          path: spec.secret
          value: keycloak-operator-client

  - it: signs enable-update-email in with the client
    template: templates/enable-update-email.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_CLIENT
            valueFrom:
              secretKeyRef:
                name: keycloak-operator-client
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_SECRET
            valueFrom:
              secretKeyRef:
                name: keycloak-operator-client
                key: password
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '--client "\$KC_CLIENT" --secret "\$KC_SECRET"'
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "--user|--password"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_USER
          any: true
