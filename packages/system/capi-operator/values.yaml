cluster-api-operator:
  # A restarted v0.19 operator ignored the provider Deployments it found
  # running (kubernetes-sigs/cluster-api-operator#1031), so a stale
  # Ready=False on a provider cleared only at the first informer resync,
  # two periods after the restart: ~20 min at the 10m default, ~2 min at
  # 1m (both measured). v0.30 carries the upstream fix, but restart
  # recovery on it has not been measured, so the short period stays until
  # it is. A resync is served from the cache and changes nothing when
  # providers are in sync, so it costs no API writes. Applied through
  # patches/sync-period.diff.
  syncPeriod: 1m
  resources:
    manager:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 100Mi
