cilium:
  # Load-bearing beyond service routing, and pinned for that reason. The
  # admission-webhook deny policy in packages/system/kubeovn-webhook names only
  # its webhook's backend port, which covers a pod dialling the ClusterIP only
  # while Cilium is the thing that performs the service DNAT -- and only this
  # value makes it so, against an upstream chart default of "false". Setting it
  # false does not break that policy visibly; it reopens the ClusterIP path to
  # the webhook while the backend deny keeps working.
  # tests/kube_proxy_replacement_test.yaml asserts the rendered value across the
  # defaults and every variant valuesFiles combination, and carries the whole
  # argument. The policy also carries a target-side rule that does not depend on
  # this value, so losing it degrades the source-side half rather than removing
  # enforcement outright.
  #
  # No test here can observe a live cluster's values, so an operator override in
  # the field is caught only by templates/kube-proxy-replacement-beacon.yaml,
  # which renders a status ConfigMap whenever this is not true. It is a beacon
  # and not a fail() on purpose: whether Cilium without kube-proxy replacement
  # is a supported cozystack configuration is a platform decision, and refusing
  # to render the CNI over a weakened defence-in-depth control is not this
  # chart's call.
  kubeProxyReplacement: true
  # Upstream cilium with hostFirewall enabled and the IPv6 datapath disabled
  # (ipv6.enabled=false, the default here) drops ALL node IPv6 before any
  # policy evaluation ("Unsupported L3 protocol", DROP_UNKNOWN_L3 in
  # bpf/bpf_host.c), breaking ICMPv6 Neighbor Discovery and BGP unnumbered on
  # IPv6/L3 fabrics. The cozystack cilium image carries a BPF patch
  # (images/cilium/patches/) that passes IPv6 to the kernel stack instead.
  # Consequence: Cilium host policies apply to IPv4 only; node IPv6 is not
  # filtered by Cilium.
  hostFirewall:
    enabled: true
  hubble:
    enabled: false
  externalIPs:
    enabled: true
  nodePort:
    enabled: true
  loadBalancer:
    algorithm: maglev
    serviceTopology: true
  ipam:
    mode: "kubernetes"
  image:
    repository: ghcr.io/cozystack/cozystack/cilium
    tag: v1.6.2
    digest: "sha256:136a7dfff4d6adcd448424c2354144160028a8e96eb6558b917fd3ee6d7b39fe"
  envoy:
    enabled: true
    # Upstream default is {} — no requests/limits. The embedded envoy DaemonSet
    # idles at ~100 MB RAM/node and grows under L7 traffic; without requests
    # the DaemonSet schedules onto any node with no reserved headroom, and
    # without a memory limit a runaway listener could OOM the node.
    # The baseline matches the commented-out example in the upstream Helm values.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  gatewayAPI:
    enabled: true
  rollOutCiliumPods: true
  operator:
    rollOutPods: true
    replicas: 1
