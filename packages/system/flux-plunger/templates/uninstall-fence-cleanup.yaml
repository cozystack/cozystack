{{- /*
  flux-plunger sets a finalizer, flux-plunger.cozystack.io/uninstall-fence, on a
  HelmRelease it is recovering, and only flux-plunger removes it. Uninstalling this
  chart would leave any fence in place, and a release deleted meanwhile would stay
  Terminating forever: helm-controller has already dropped its own finalizer on
  the suspended delete, and the fence is held by a controller that is gone. Tenant
  teardown waits on exactly those deletes.

  So, before the chart is removed: stop flux-plunger, so it cannot set a new fence
  behind this sweep; lift any suspension flux-plunger holds, so a release is not
  left suspended by a controller that is going away; give helm-controller a
  bounded chance to uninstall a release that is already being deleted; then
  remove the fence.

  Two bounds apply. helm-controller runs a pre-delete hook under the release's
  uninstall timeout, 300s by default (the operator sets none), counted from when
  helm creates the hook; the Job's activeDeadlineSeconds is counted from the Job's
  start, so it has to end first, with room for the pod to be scheduled and pulled.
  Inside it, all waiting and retrying shares one budget, which leaves the rest of
  the deadline for the few calls each fenced release still needs.

  A helm-controller that does not answer is waited on only within that budget:
  when it runs out the fence is removed anyway, so a stalled helm-controller never
  blocks the uninstall. A fence that cannot be removed, or a listing that never
  succeeds, is different: the script names what it left and exits non-zero. The
  failed hook fails the uninstall before helm records anything, and
  helm-controller retries it, running this hook again; exiting 0 would let the
  chart go and leave the fence with nothing to remove it.
*/ -}}
{{- $img := printf "%s:%s" .Values.kubectlImage.repository .Values.kubectlImage.tag }}
{{- with .Values.kubectlImage.digest }}{{- $img = printf "%s@%s" $img . }}{{- end }}
{{- $deadline := 240 }}
{{- $budget := sub $deadline 90 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-plunger-uninstall-fence-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-plunger-uninstall-fence-cleanup
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-plunger-uninstall-fence-cleanup
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-plunger-uninstall-fence-cleanup
subjects:
  - kind: ServiceAccount
    name: flux-plunger-uninstall-fence-cleanup
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-plunger-uninstall-fence-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
rules:
  # kubectl scale reads the Deployment, then patches its scale subresource.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["flux-plunger"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["flux-plunger"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-plunger-uninstall-fence-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-plunger-uninstall-fence-cleanup
subjects:
  - kind: ServiceAccount
    name: flux-plunger-uninstall-fence-cleanup
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flux-plunger-uninstall-fence-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    # No hook-succeeded: a succeeded Job would go with its pod and the report
    # in its log. helm.sh/hook-output-log-policy cannot stand in for that, since
    # helm-controller calls a nil output writer for it
    # (https://github.com/fluxcd/helm-controller/issues/1562).
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # Under helm's own bound for the hook; see the header.
  activeDeadlineSeconds: {{ $deadline }}
  backoffLimit: 1
  # The finished Job, and the report in its pod's log, outlive the chart this long.
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: flux-plunger-uninstall-fence-cleanup
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # kubectl writes its discovery cache under $HOME; with a read-only root
      # filesystem it aborts before running any subcommand unless HOME points at
      # something writable.
      volumes:
        - name: kube-cache
          emptyDir: {}
      containers:
        - name: cleanup
          image: {{ $img }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: kube-cache
              mountPath: /tmp
          command:
            - sh
            - -c
            - |
              set -u
              fence=flux-plunger.cozystack.io/uninstall-fence
              deploy=flux-plunger
              hr=helmreleases.helm.toolkit.fluxcd.io
              # HR_SCOPE narrows the sweep so the script can be exercised against
              # one namespace; the hook itself always covers the cluster.
              scope="${HR_SCOPE:---all-namespaces}"
              # Seconds all waiting and retrying may take together, counted from
              # here: activeDeadlineSeconds less what the pod start and the calls
              # left after it need.
              budget={{ $budget }}
              wait_until=$(( $(date +%s) + budget ))
              failed=0

              # No per-call --request-timeout: any client override makes kubectl
              # skip the in-cluster config and dial localhost:8080. A wedged call
              # is bounded by activeDeadlineSeconds instead, and a Job killed by
              # it fails the uninstall, which helm-controller then retries.

              # budget_left <attempt>: true while there is budget, and for the first
              # three attempts regardless, so a step that starts after the budget
              # is spent still gets a fair chance.
              budget_left() {
                [ "$(date +%s)" -lt "$wait_until" ] || [ "$1" -lt 3 ]
              }

              # retry <cmd>...: run until it succeeds or budget_left says stop. Each
              # failure's stderr stays in the log.
              retry() {
                attempt=1
                until "$@"; do
                  budget_left "$attempt" || return 1
                  attempt=$((attempt + 1))
                  sleep 2
                done
              }

              # release_fence <ns> <name>: remove the fence at the index it holds
              # now. A failed patch is retried with a fresh read, because
              # helm-controller keeps adding and dropping its own finalizer ahead
              # of the fence while this runs. A release or fence already gone
              # counts as released.
              release_fence() {
                attempt=1
                while :; do
                  if idx=$(kubectl --namespace "$1" get "$hr" "$2" --ignore-not-found --output go-template='{{`{{range $i, $f := .metadata.finalizers}}{{if eq $f "flux-plunger.cozystack.io/uninstall-fence"}}{{$i}}{{end}}{{end}}`}}'); then
                    [ -n "$idx" ] || return 0
                    if kubectl --namespace "$1" patch "$hr" "$2" --type json \
                      --patch "[{\"op\":\"test\",\"path\":\"/metadata/finalizers/$idx\",\"value\":\"$fence\"},{\"op\":\"remove\",\"path\":\"/metadata/finalizers/$idx\"}]"; then
                      return 0
                    fi
                  fi
                  budget_left "$attempt" || return 1
                  attempt=$((attempt + 1))
                  sleep 2
                done
              }

              # A flux-plunger still running could set a fence behind the sweep.
              if ! retry kubectl --namespace "$NAMESPACE" scale deployment "$deploy" --replicas=0; then
                echo "could not scale $deploy down" >&2
                failed=1
              fi
              if ! kubectl --namespace "$NAMESPACE" wait --for=delete pod \
                --selector app.kubernetes.io/name=flux-plunger,app.kubernetes.io/instance={{ .Release.Name }} \
                --timeout=60s; then
                echo "$deploy pods are still running" >&2
                failed=1
              fi

              # An unanswered listing is not an empty one.
              # shellcheck disable=SC2086 # scope is one or two words on purpose
              if ! fenced=$(retry kubectl get "$hr" $scope --output go-template='{{`{{range .items}}{{$ns := .metadata.namespace}}{{$name := .metadata.name}}{{range .metadata.finalizers}}{{if eq . "flux-plunger.cozystack.io/uninstall-fence"}}{{$ns}}/{{$name}}{{"\n"}}{{end}}{{end}}{{end}}`}}'); then
                echo "could not list fenced HelmReleases; no fence was released" >&2
                exit 1
              fi

              total=0
              released=0
              for ref in $fenced; do
                total=$((total + 1))
                hns=${ref%%/*}
                name=${ref#*/}

                # A suspension flux-plunger's own apply holds is lifted.
                if ! owned=$(retry kubectl --namespace "$hns" get "$hr" "$name" --ignore-not-found --output go-template='{{`{{if .spec.suspend}}{{range .metadata.managedFields}}{{if and (eq .manager "flux-plunger") (eq .operation "Apply")}}{{range $k, $v := .fieldsV1}}{{if eq $k "f:spec"}}{{range $k2, $v2 := $v}}{{if eq $k2 "f:suspend"}}yes{{end}}{{end}}{{end}}{{end}}{{end}}{{end}}{{end}}`}}'); then
                  echo "NOT released $ref: it could not be read" >&2
                  continue
                fi
                if [ -n "$owned" ] && ! retry kubectl --namespace "$hns" patch "$hr" "$name" --type merge \
                  --patch '{"spec":{"suspend":false}}' --field-manager flux-plunger; then
                  # Without the fence a deleted release that is still suspended
                  # is removed without an uninstall.
                  echo "NOT released $ref: flux-plunger's suspension could not be lifted" >&2
                  continue
                fi

                # On a release being deleted, helm-controller may already have
                # dropped its own finalizer without an uninstall; wait, within the
                # shared budget, for it to handle the unsuspended generation. A
                # failed read is not an answer. When the budget is spent the fence
                # goes anyway and such a release is deleted without an uninstall:
                # removing the component must not hang on a helm-controller that
                # does not answer.
                while [ "$(date +%s)" -lt "$wait_until" ]; do
                  if state=$(kubectl --namespace "$hns" get "$hr" "$name" --ignore-not-found --output go-template='{{`{{if .metadata.deletionTimestamp}}{{$held := false}}{{range .metadata.finalizers}}{{if eq . "finalizers.fluxcd.io"}}{{$held = true}}{{end}}{{end}}{{if or $held (ne (printf "%v" .status.observedGeneration) (printf "%v" .metadata.generation))}}wait{{end}}{{end}}`}}'); then
                    [ "$state" = wait ] || break
                  fi
                  sleep 2
                done

                if release_fence "$hns" "$name"; then
                  released=$((released + 1))
                  echo "released $fence from $ref"
                else
                  echo "NOT released $ref: the fence could not be removed" >&2
                fi
              done

              echo "released $released of $total fenced HelmReleases"
              if [ "$released" -eq "$total" ] && [ "$failed" -eq 0 ]; then
                exit 0
              fi
              exit 1
