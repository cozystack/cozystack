apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-plunger
  labels:
    app.kubernetes.io/name: flux-plunger
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- /*
  flux-plunger treats a suspension its own field manager owns, seen in a fresh
  reconcile, as its own interrupted run, so exactly one process may act on a
  HelmRelease at a time. --leader-elect defaults to false (cmd/flux-plunger/main.go),
  so only the topology serialises it: replicas must stay 1 and a rollout must not
  briefly run two pods. The default maxSurge rounds up to 1 at replicas 1, which
  would start a second pod able to unsuspend a release the old one is still
  recovering; maxSurge 0 with maxUnavailable 1 stops the old pod first. This stays
  RollingUpdate rather than Recreate because existing installs carry the
  apiserver-defaulted rollingUpdate block (the chart shipped without a strategy),
  and helm-controller applies server-side, where type Recreate over that block is
  rejected on upgrade. It covers voluntary rollouts only; an asymmetric node
  partition, where the old process keeps writing while a replacement starts, needs a
  leader-election Lease, so raising replicas requires enabling leader election first.
  */}}
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-plunger
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flux-plunger
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: flux-plunger
      containers:
      - name: flux-plunger
        image: "{{ .Values.image }}"
        args:
        {{- if .Values.debug }}
        - --zap-log-level=debug
        {{- else }}
        - --zap-log-level=info
        {{- end }}
        - --metrics-bind-address=:8080
        - --metrics-secure=false
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
