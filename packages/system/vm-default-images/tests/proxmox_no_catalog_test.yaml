suite: vm-default-images on the proxmox substrate needs the platform package
release:
  name: vm-default-images
  namespace: cozy-system
templates:
  - templates/proxmox-volume.yaml
set:
  substrate: proxmox
tests:
  - it: fails with the name of the package when the catalog is absent
    asserts:
      - failedTemplate:
          errorPattern: "substrate proxmox needs the platform's proxmox-vm package"
