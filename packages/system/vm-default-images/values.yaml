##
## @section Global Golden Image Collection
##
## The package reports Ready only once every image below has imported. One image
## that cannot be fetched, such as a removed upstream URL, keeps the whole package
## not Ready, retrying with no time limit, until that image imports or its entry
## is removed from the list. An import that reached phase Failed does not start
## again by itself: delete its DataVolume and the next retry recreates it. The
## images that did import stay usable meanwhile.
##

## @param {string} storageClass - Default StorageClass for all images. If empty, uses the cluster default StorageClass.
## NOTE: The default set of images requires approximately 320Gi of storage (16 images × 20Gi each).
## Adjust the image list or per-image storage sizes to match your cluster capacity.
storageClass: "replicated"

## @typedef {struct} ImageOS - Operating system metadata for a Golden Image.
## @field {string} [family] - OS family (e.g. "Linux", "Windows").
## @field {string} [name] - OS distribution name (e.g. "Ubuntu", "Fedora").
## @field {string} [version] - OS version (e.g. "24.04", "40").

## @typedef {struct} ImageProxmox - Where the image comes from on the proxmox substrate. Ignored on kubevirt.
## @field {string} volume - Proxmox volume id the image is copied from: the disk of a template (e.g. "local-zfs:base-9001-disk-0") or a file on a storage with the import content type (e.g. "local:import/noble.qcow2"). Required on the proxmox substrate.
## @field {[]string} [nodes] - Proxmox nodes the image is published on, one VirtualMachineVolume each; a tenant disk on a node copies the image published there. Each has to be a node the platform's catalog allows. Defaults to the catalog's defaultNode.

## @typedef {struct} GlobalImage - A global Golden Image entry.
## @field {string} name - Unique image name used to reference this image in vm-disk (e.g. "ubuntu").
## @field {string} url - HTTP(S) URL to download the image from. Used on the kubevirt substrate.
## @field {ImageProxmox} [proxmox] - Where the image comes from on the proxmox substrate.
## @field {quantity} storage - Storage size to allocate for this image.
## @field {string} storageClass - StorageClass used to store the image (overrides global default).
## @field {ImageOS} [os] - Operating system metadata.
## @field {string} [architecture] - CPU architecture (e.g. "amd64", "arm64").
## @field {string} [description] - Human-readable description.

## @param {[]GlobalImage} images - List of global Golden Images to provision in the cozy-public namespace.
