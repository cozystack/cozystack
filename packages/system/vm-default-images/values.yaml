## @section Substrate

## @param {string} substrate="kubevirt" - Which hypervisor holds the collection. `kubevirt` imports every image from its `url` into a CDI DataVolume in cozy-public. `proxmox` publishes every image as a cloneable VirtualMachineVolume in cozy-public on the external Proxmox VE cluster the platform's proxmox-vm package points at, one per node in the image's `proxmox.nodes`, copied from the Proxmox volume its `proxmox.volume` names; downloading from `url` is not available there yet, so on this substrate `images` has to be overridden with entries that carry `proxmox.volume`. `storageClass` then names an entry of the platform's catalog. A tenant's vm-disk references an image of either kind through `source.image.name`.
substrate: kubevirt
