suite: vm-instance ApplicationDefinition readiness gate
templates:
  - templates/cozyrd.yaml

# A VMInstance is served as a Flux HelmRelease that renders a KubeVirt
# VirtualMachine. From cozystack v1.5.0 (helm-controller v1.4.3 to v1.5.0) the
# generated release is health-assessed by the kstatus poller, which for any
# object carrying status.observedGeneration returns InProgress whenever it
# trails metadata.generation -- a built-in pre-check in
# fluxcd/pkg/runtime/cel that runs before (and cannot be overridden by)
# healthCheckExprs. KubeVirt legitimately runs a VirtualMachine with
# observedGeneration behind generation (a template change pending a restart, a
# stopped VM, or kubevirt/kubevirt#18700), so a healthy VM is read as
# permanently InProgress and the release never converges. Disabling the wait
# restores the pre-1.5.0 behaviour: the release settles once the manifests are
# applied and VM health is observed on the VirtualMachine itself, not on the
# HelmRelease.
tests:
  - it: renders the vm-instance ApplicationDefinition
    asserts:
      - containsDocument:
          apiVersion: cozystack.io/v1alpha1
          kind: ApplicationDefinition
          name: vm-instance

  - it: disables the helm-controller readiness wait for the VMInstance release
    documentSelector:
      path: metadata.name
      value: vm-instance
    asserts:
      - equal:
          path: metadata.annotations["release.cozystack.io/helm-install-disable-wait"]
          value: "true"
