    openAPISchema: |-
      {"properties":{"cloudInit":{"default":"","description":"Cloud-init user data.","type":"string"},"cloudInitSeed":{"default":"","description":"Seed string to generate SMBIOS UUID for the VM.","type":"string"},"cpuModel":{"default":"","description":"Model specifies the CPU model inside the VMI. List of available models https://github.com/libvirt/libvirt/tree/master/src/cpu_map","type":"string"},"disks":{"default":[],"description":"List of disks to attach.","items":{"properties":{"bus":{"description":"Disk bus type (e.g. \"sata\").","type":"string"},"name":{"description":"Disk name.","type":"string","x-cozystack-options":{"source":"vmdisk"}}},"required":["name"],"type":"object"},"type":"array"},"external":{"default":false,"description":"Enable external access from outside the cluster.","type":"boolean"},"externalAllowICMP":{"default":true,"description":"Whether to accept ICMP traffic to the VM in PortList mode (preserves ping and PMTU discovery). No effect in WholeIP mode. Default true so ping behaves as users expect even when port filtering is in effect.","type":"boolean"},"externalMethod":{"default":"PortList","description":"Method to pass through traffic to the VM.","enum":["PortList","WholeIP"],"type":"string"},"externalPorts":{"default":[22],"description":"Ports to forward from outside the cluster.","items":{"type":"integer"},"type":"array"},"gpus":{"default":[],"description":"List of GPUs to attach (NVIDIA driver requires at least 4 GiB RAM).","items":{"properties":{"name":{"description":"The name of the GPU resource to attach.","type":"string","x-cozystack-options":{"source":"gpu"}}},"required":["name"],"type":"object"},"type":"array"},"instanceProfile":{"default":"ubuntu","description":"Virtual Machine preferences profile.","type":"string","x-cozystack-options":{"source":"instanceprofile"}},"instanceType":{"default":"u1.medium","description":"Virtual Machine instance type.","type":"string","x-cozystack-options":{"source":"instancetype"}},"networks":{"default":[],"description":"Networks to attach the VM to.","items":{"properties":{"name":{"description":"Network attachment name.","type":"string","x-cozystack-options":{"source":"network"}}},"type":"object"},"type":"array"},"resources":{"default":{},"description":"Resource configuration for the virtual machine.","properties":{"cpu":{"anyOf":[{"type":"integer"},{"type":"string"}],"description":"Number of CPU cores allocated.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","x-kubernetes-int-or-string":true},"memory":{"anyOf":[{"type":"integer"},{"type":"string"}],"description":"Amount of memory allocated.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","x-kubernetes-int-or-string":true},"sockets":{"anyOf":[{"type":"integer"},{"type":"string"}],"description":"Number of CPU sockets (vCPU topology).","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","x-kubernetes-int-or-string":true}},"type":"object"},"runStrategy":{"default":"Always","description":"Requested running state of the VirtualMachineInstance","enum":["Always","Halted","Manual","RerunOnFailure","Once"],"type":"string"},"sshKeys":{"default":[],"description":"List of SSH public keys for authentication.","items":{"type":"string"},"type":"array"},"subnets":{"default":[],"description":"Deprecated: use networks instead.","items":{"properties":{"name":{"description":"Network attachment name.","type":"string","x-cozystack-options":{"source":"network"}}},"type":"object"},"type":"array"},"terminationGracePeriodSeconds":{"default":30,"description":"Seconds the guest is given to shut down cleanly on an ACPI powerdown before the domain is destroyed. Applies to every shutdown path: an explicit stop, a node drain, an eviction, a workload update.","type":"integer"}},"title":"Chart Values","type":"object"}
