{{- /* Removes identity files left behind by deleted BucketAccesses;
       files/orphan-identities.sh says why and how it decides. Runs on every
       install and upgrade. The script exits 0 whatever it finds, and the Job
       stays behind for its logs. A pod that never runs still fails the hook. */}}
{{- if .Values.seaweedfs.cosi.enabled }}
{{- $name := printf "%s-orphan-identities" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $clusterName := printf "%s-%s-orphan-identities" .Release.Namespace .Release.Name }}
{{- $env := .Values.global.seaweedfs.extraEnvironmentVars }}
{{- $security := .Values.global.seaweedfs.enableSecurity }}
{{- $fullname := include "seaweedfs.fullname" .Subcharts.seaweedfs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  orphan-identities.sh: |
    {{- .Files.Get "files/orphan-identities.sh" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  resourceNames: [{{ .Release.Name | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
{{- /* A tenant's SeaweedFS also serves its child tenants, whose BucketAccesses
       live in their own namespaces. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
- apiGroups: ["objectstorage.k8s.io"]
  resources: ["bucketaccesses"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: weed
          image: {{ include "seaweedfs.s3.image" .Subcharts.seaweedfs }}
          command: ["cp", "/usr/bin/weed", "/opt/weed/weed"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: weed
              mountPath: /opt/weed
      containers:
        - name: cleanup
          image: {{ .Values.seaweedfs.volume.resizeHook.image }}
          command: ["/bin/sh", "/opt/script/orphan-identities.sh"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          env:
            - name: PATH
              value: /opt/weed:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: MASTER
              value: {{ $env.WEED_CLUSTER_SW_MASTER | quote }}
            - name: FILER
              value: {{ $env.WEED_CLUSTER_SW_FILER | quote }}
            - name: RELEASE
              value: {{ .Release.Name | quote }}
            - name: JOB
              value: {{ $name | quote }}
            - name: MODE
              value: {{ .Values.seaweedfs.cosi.orphanIdentities.mode | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: weed
              mountPath: /opt/weed
            - name: script
              mountPath: /opt/script
            {{- if $security }}
            - name: security-config
              mountPath: /etc/seaweedfs/security.toml
              subPath: security.toml
              readOnly: true
            - name: ca-cert
              mountPath: /usr/local/share/ca-certificates/ca/
              readOnly: true
            - name: client-cert
              mountPath: /usr/local/share/ca-certificates/client/
              readOnly: true
            {{- end }}
      volumes:
        - name: weed
          emptyDir: {}
        - name: script
          configMap:
            name: {{ $name }}
        {{- if $security }}
        - name: security-config
          configMap:
            name: {{ $fullname }}-security-config
        - name: ca-cert
          secret:
            secretName: {{ $fullname }}-ca-cert
        - name: client-cert
          secret:
            secretName: {{ $fullname }}-client-cert
        {{- end }}
{{- end }}
