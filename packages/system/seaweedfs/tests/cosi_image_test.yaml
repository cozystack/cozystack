suite: seaweedfs COSI driver image pin

# The vendored chart default is seaweedfs-cosi-driver v0.1.2, which ignores
# accessPolicy, so a -readonly BucketAccessClass would issue read-write keys.
# Upstream v0.3.1 fixes that but lacks later driver fixes and the Object Lock
# actions SeaweedFS 4.48 checks, so the package values.yaml points cosi.image
# at the first-party build in images/seaweedfs-cosi-driver.
# `make update` resets the vendored default; this goes red if the override is
# lost or points back at an upstream image.

templates:
  - charts/seaweedfs/templates/cosi/cosi-deployment.yaml

release:
  name: seaweedfs
  namespace: cozy-seaweedfs

tests:
  - it: runs the first-party cosi-driver build
    template: charts/seaweedfs/templates/cosi/cosi-deployment.yaml
    set:
      seaweedfs.cosi.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: seaweedfs-cosi-driver
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/cozystack/cozystack/seaweedfs-cosi-driver:v0\.3\.1-10-g0df543f-cozystack\.[0-9]+(@sha256:[0-9a-f]{64})?$
