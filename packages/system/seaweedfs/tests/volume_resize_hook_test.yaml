suite: seaweedfs volume resize hook

# The pre-upgrade hook deletes the volume StatefulSet with --cascade=orphan and
# then patches each PVC. Both gates normalise their sizes through
# seaweedfs.resource-quantity: a raw string compare fires the delete on a
# respelling, and a lexicographic gt skips the patch across a decimal exponent.

templates:
  - charts/seaweedfs/templates/volume/volume-resize-hook.yaml

release:
  name: seaweedfs
  namespace: tenant-test

tests:
  - it: patches the PVCs when the grow crosses a decimal exponent (5Gi to 10Gi)
    kubernetesProvider:
      scheme: &scheme
        "apps/v1/StatefulSet":
          gvr:
            group: "apps"
            version: "v1"
            resource: "statefulsets"
          namespaced: true
        "v1/PersistentVolumeClaim":
          gvr:
            group: ""
            version: "v1"
            resource: "persistentvolumeclaims"
          namespaced: true
      objects:
        - kind: StatefulSet
          apiVersion: apps/v1
          metadata:
            name: seaweedfs-volume
            namespace: tenant-test
          spec:
            volumeClaimTemplates:
              - metadata:
                  name: data1
                spec:
                  resources:
                    requests:
                      storage: 5Gi
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata:
            name: data1-seaweedfs-volume-0
            namespace: tenant-test
          spec:
            resources:
              requests:
                storage: 5Gi
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata:
            name: data1-seaweedfs-volume-1
            namespace: tenant-test
          spec:
            resources:
              requests:
                storage: 5Gi
    asserts:
      - documentIndex: 0
        isKind:
          of: Job
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: kubectl delete statefulset seaweedfs-volume --cascade=orphan
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: kubectl patch pvc data1-seaweedfs-volume-0 .*"storage":"10Gi"
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: kubectl patch pvc data1-seaweedfs-volume-1 .*"storage":"10Gi"

  - it: still patches a grow that stays inside one exponent (10Gi to 20Gi)
    set:
      seaweedfs.volume.dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 20Gi
          maxVolumes: 0
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: StatefulSet
          apiVersion: apps/v1
          metadata:
            name: seaweedfs-volume
            namespace: tenant-test
          spec:
            volumeClaimTemplates:
              - metadata:
                  name: data1
                spec:
                  resources:
                    requests:
                      storage: 10Gi
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata:
            name: data1-seaweedfs-volume-0
            namespace: tenant-test
          spec:
            resources:
              requests:
                storage: 10Gi
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata:
            name: data1-seaweedfs-volume-1
            namespace: tenant-test
          spec:
            resources:
              requests:
                storage: 10Gi
    asserts:
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: kubectl patch pvc data1-seaweedfs-volume-0 .*"storage":"20Gi"

  - it: does not shrink a PVC when the desired size is smaller
    set:
      seaweedfs.volume.dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 5Gi
          maxVolumes: 0
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: StatefulSet
          apiVersion: apps/v1
          metadata:
            name: seaweedfs-volume
            namespace: tenant-test
          spec:
            volumeClaimTemplates:
              - metadata:
                  name: data1
                spec:
                  resources:
                    requests:
                      storage: 10Gi
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata:
            name: data1-seaweedfs-volume-0
            namespace: tenant-test
          spec:
            resources:
              requests:
                storage: 10Gi
    asserts:
      - documentIndex: 0
        notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: kubectl patch pvc

  - it: does nothing when the size is respelled but unchanged (10Gi as 10240Mi)
    set:
      seaweedfs.volume.dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 10240Mi
          maxVolumes: 0
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: StatefulSet
          apiVersion: apps/v1
          metadata:
            name: seaweedfs-volume
            namespace: tenant-test
          spec:
            volumeClaimTemplates:
              - metadata:
                  name: data1
                spec:
                  resources:
                    requests:
                      storage: 10Gi
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata:
            name: data1-seaweedfs-volume-0
            namespace: tenant-test
          spec:
            resources:
              requests:
                storage: 10Gi
    asserts:
      - hasDocuments:
          count: 0

  - it: formats a size that was set as a number, not a quantity string
    set:
      seaweedfs.volume.dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 21474836480
          maxVolumes: 0
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: StatefulSet
          apiVersion: apps/v1
          metadata:
            name: seaweedfs-volume
            namespace: tenant-test
          spec:
            volumeClaimTemplates:
              - metadata:
                  name: data1
                spec:
                  resources:
                    requests:
                      storage: 10Gi
        - kind: PersistentVolumeClaim
          apiVersion: v1
          metadata:
            name: data1-seaweedfs-volume-0
            namespace: tenant-test
          spec:
            resources:
              requests:
                storage: 10Gi
    asserts:
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: kubectl patch pvc data1-seaweedfs-volume-0 .*"storage":"2.147483648e\+10"
      - documentIndex: 0
        notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '%!'
