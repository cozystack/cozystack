# RBAC cannot name the caller's node, so every agent may write every
# GPUNode; the agent itself writes only its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cozy-gpu-node-agent
rules:
- apiGroups: [gpu.cozystack.io]
  resources: [gpunodes]
  verbs: [create]
- apiGroups: [gpu.cozystack.io]
  resources: [gpunodes/status]
  verbs: [patch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get]
- apiGroups: [""]
  resources: [pods]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cozy-gpu-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cozy-gpu-node-agent
subjects:
- kind: ServiceAccount
  name: gpu-node-agent
  namespace: {{ .Release.Namespace }}
