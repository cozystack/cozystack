suite: cozystack-basics GPU policies are gated on the ValidatingAdmissionPolicy API
templates:
  - templates/gpu-class-policy.yaml
  - templates/gpu-device-tamper-policy.yaml
  - templates/gpu-usage-monitor-label-policy.yaml
  - templates/gpu-raw-names-policy.yaml
release:
  name: cozystack-basics
  namespace: cozy-system
capabilities:
  apiVersions: []
tests:
  - it: renders no GPU policy when the API is unavailable
    set:
      gpu:
        enabled: true
        rawResourceNames: forbidden
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no label reservation when the API is unavailable and GPUs are off
    template: templates/gpu-usage-monitor-label-policy.yaml
    asserts:
      - hasDocuments:
          count: 0
