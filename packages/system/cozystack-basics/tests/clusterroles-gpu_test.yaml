suite: cozystack-basics GPU access for tenants

templates:
  - templates/clusterroles.yaml

release:
  name: cozystack-basics
  namespace: cozy-system

# Tenants with admin or above manage GPUDevice orders in their namespaces
# where GPUs are on, and lower roles read them. GPUClass is cluster-scoped,
# and tenant roles are bound per namespace, so its read goes to every
# authenticated user through a ClusterRoleBinding. Neither the status of a
# device, which holds its binding, nor GPUNode, which names physical devices,
# is granted to any tenant role.
tests:
  # The filter returns the rule itself when exactly one rule names the group
  # and a list otherwise, so equal pins both the rule and that it is the only
  # one: a resource or verb added anywhere in the group fails here.
  - it: cozy:tenant:view:base grants only read on gpudevices
    documentSelector:
      path: metadata.name
      value: cozy:tenant:view:base
    asserts:
      - equal:
          path: rules[?(@.apiGroups[*] == "gpu.cozystack.io")]
          value:
            apiGroups: ["gpu.cozystack.io"]
            resources: ["gpudevices"]
            verbs: ["get", "list", "watch"]

  - it: cozy:tenant:admin:base grants only write on gpudevices when GPUs are on
    set:
      gpu:
        enabled: true
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    documentSelector:
      path: metadata.name
      value: cozy:tenant:admin:base
    asserts:
      - equal:
          path: rules[?(@.apiGroups[*] == "gpu.cozystack.io")]
          value:
            apiGroups: ["gpu.cozystack.io"]
            resources: ["gpudevices"]
            verbs: ["create", "update", "patch", "delete"]

  # The write ships with the GPU policies that guard it, which render only
  # where GPUs are on.
  - it: cozy:tenant:admin:base grants nothing in gpu.cozystack.io while GPUs are off
    documentSelector:
      path: metadata.name
      value: cozy:tenant:admin:base
    asserts:
      - notExists:
          path: rules[?(@.apiGroups[*] == "gpu.cozystack.io")]

  - it: cozy:tenant:base grants nothing in gpu.cozystack.io
    documentSelector:
      path: metadata.name
      value: cozy:tenant:base
    asserts:
      - notExists:
          path: rules[?(@.apiGroups[*] == "gpu.cozystack.io")]

  - it: cozy:tenant:use:base grants nothing in gpu.cozystack.io
    documentSelector:
      path: metadata.name
      value: cozy:tenant:use:base
    asserts:
      - notExists:
          path: rules[?(@.apiGroups[*] == "gpu.cozystack.io")]

  - it: cozy:tenant:super-admin:base grants nothing in gpu.cozystack.io
    documentSelector:
      path: metadata.name
      value: cozy:tenant:super-admin:base
    asserts:
      - notExists:
          path: rules[?(@.apiGroups[*] == "gpu.cozystack.io")]

  - it: renders a read-only GPUClass role
    documentSelector:
      path: metadata.name
      value: cozy:gpuclasses:view
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: rules
          value:
          - apiGroups: ["gpu.cozystack.io"]
            resources: ["gpuclasses"]
            verbs: ["get", "list", "watch"]

  - it: binds the GPUClass role to every authenticated user
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: metadata.name
          value: cozy:gpuclasses:view:authenticated
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cozy:gpuclasses:view
      - equal:
          path: subjects
          value:
          - apiGroup: rbac.authorization.k8s.io
            kind: Group
            name: system:authenticated
