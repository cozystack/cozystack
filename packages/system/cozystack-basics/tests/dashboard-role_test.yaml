suite: cozystack-basics tenant dashboard Role grants read on cozy-public resources

templates:
  - templates/dashboard-role.yaml

release:
  name: cozystack-basics
  namespace: cozy-system

# The vm-disk source image dropdown reads the image option source from
# cozystack-api, which lists the goldens with its own identity and leaves out
# those whose import failed. Tenants need no read on cozy-public PVCs for it.
tests:
  - it: cozy:tenant:dashboard grants no read on persistentvolumeclaims in cozy-public
    documentSelector:
      path: metadata.name
      value: cozy:tenant:dashboard
    asserts:
      - equal:
          path: metadata.namespace
          value: cozy-public
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
          any: true
