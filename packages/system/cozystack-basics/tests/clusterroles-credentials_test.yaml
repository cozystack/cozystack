suite: cozystack-basics tenant ClusterRoles grant the credentials API

templates:
  - templates/clusterroles.yaml

release:
  name: cozystack-basics
  namespace: cozy-system

# Reading a Credential is a view-tier grant; minting and revoking are admin
# writes, and the tenant ServiceAccount holds both. The subresources are gated
# by verb create on their own resource names, so a grant on credentials alone
# issues nothing.
tests:
  - it: cozy:tenant:view:base grants read on core.cozystack.io credentials
    documentSelector:
      path: metadata.name
      value: cozy:tenant:view:base
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["core.cozystack.io"]
            resources: ["credentials"]
            verbs: ["get", "list"]

  - it: cozy:tenant:view:base does not grant mint or revoke
    documentSelector:
      path: metadata.name
      value: cozy:tenant:view:base
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["core.cozystack.io"]
            resources: ["credentials/mint", "credentials/revoke"]
            verbs: ["create"]

  - it: cozy:tenant:admin:base grants create on credentials/mint and credentials/revoke
    documentSelector:
      path: metadata.name
      value: cozy:tenant:admin:base
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["core.cozystack.io"]
            resources: ["credentials/mint", "credentials/revoke"]
            verbs: ["create"]

  - it: cozy:tenant:base grants read on credentials and create on mint and revoke
    documentSelector:
      path: metadata.name
      value: cozy:tenant:base
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["core.cozystack.io"]
            resources: ["credentials"]
            verbs: ["get", "list"]
      - contains:
          path: rules
          content:
            apiGroups: ["core.cozystack.io"]
            resources: ["credentials/mint", "credentials/revoke"]
            verbs: ["create"]
