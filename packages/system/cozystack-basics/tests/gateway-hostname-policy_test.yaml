suite: gateway-hostname-policy security stack (Layers 1+2+4+5 of the model)
templates:
  - templates/gateway-hostname-policy.yaml

release:
  name: cozystack-basics
  namespace: cozy-system

# After the inheritance refactor: every namespace with the label
# namespace.cozystack.io/gateway=<owner> attaches to that owner's
# Gateway, including tenant-* descendants. The previous render-time
# guard + `cozystack-gateway-attached-namespaces-policy` VAP banned
# `tenant-*` entries in publishing.gateway.attachedNamespaces under
# the assumption that listing a tenant there would let it hijack
# hostnames. That assumption no longer holds — Layer 4 (Tenant.spec.
# host VAP), Layer 5 (namespace label immutability VAP), and Layer
# 7 (HTTPRoute hostname VAP, in route-hostname-policy.yaml) already
# defend against hostname hijack independently of attach-list shape.
# Both gates are dropped; inheritance now flows via the label
# selector on Gateway.spec.listeners[].allowedRoutes.

# The template now gates on the ValidatingAdmissionPolicy API (GA since
# Kubernetes 1.30); helm-unittest's default capability set omits it, so every
# rendering test declares it, exactly as the platform deletion-protection suite.
capabilities:
  apiVersions:
    - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy

tests:
  - it: renders 4 VAPs + 4 Bindings (8 documents total)
    asserts:
      - hasDocuments:
          count: 8

  - it: cozystack-gateway-hostname-policy targets gateway resources
    asserts:
      - documentIndex: 0
        equal:
          path: kind
          value: ValidatingAdmissionPolicy
      - documentIndex: 0
        equal:
          path: metadata.name
          value: cozystack-gateway-hostname-policy
      - documentIndex: 0
        equal:
          path: spec.matchConstraints.resourceRules[0].apiGroups
          value: ["gateway.networking.k8s.io"]
      - documentIndex: 0
        equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: ["gateways"]
      - documentIndex: 0
        equal:
          path: spec.failurePolicy
          value: Fail

  - it: cozystack-gateway-hostname-policy gates on tenant-* namespace prefix
    asserts:
      - documentIndex: 0
        equal:
          path: spec.matchConditions[0].name
          value: tenant-namespace
      - documentIndex: 0
        matchRegex:
          path: spec.matchConditions[0].expression
          pattern: 'object\.metadata\.namespace\.startsWith\("tenant-"\)'

  - it: cozystack-gateway-hostname-policy CEL validates listener hostname against namespace.cozystack.io/host
    asserts:
      - documentIndex: 0
        matchRegex:
          path: spec.variables[?(@.name=="tenantHost")].expression
          pattern: 'namespace\.cozystack\.io/host'
      - documentIndex: 0
        matchRegex:
          path: spec.validations[0].expression
          pattern: 'l\.hostname\.lowerAscii\(\)\.endsWith'
      - documentIndex: 0
        matchRegex:
          path: spec.validations[0].expression
          pattern: 'variables\.tenantHost'
      # Both operands normalized with lowerAscii() — tenantHost comes from
      # the label value, which may carry uppercase even though the listener
      # hostname is lowercase-only. Unlike the Ingress policy this one never
      # compares against the platform root host, so the normalization here
      # only stops a mixed-case apex from wrongly denying a tenant its own
      # listener.
      #
      # Both comparisons are pinned as whole operand PAIRS. This policy has
      # no runtime probe of its own — it relies on these renderings — so a
      # pattern matching a lone `.lowerAscii()` somewhere in the expression
      # would let either operand lose its normalization unnoticed.
      - documentIndex: 0
        matchRegex:
          path: spec.validations[0].expression
          pattern: 'l\.hostname\.lowerAscii\(\) == variables\.tenantHost\.lowerAscii\(\)'
      - documentIndex: 0
        matchRegex:
          path: spec.validations[0].expression
          pattern: 'l\.hostname\.lowerAscii\(\)\.endsWith\("\." \+ variables\.tenantHost\.lowerAscii\(\)\)'

  - it: cozystack-gateway-hostname-policy admits any listener hostname when the host label is absent or empty
    # Pins the documented fail-open exception, so that changing it has to be
    # a deliberate act rather than a silent one. The leading
    # `tenantHost == "" ||` admits a Gateway with any listener hostname when
    # the namespace.cozystack.io/host label is absent or empty — the
    # opposite of the sibling Route and Ingress policies, which fail closed
    # on the same input. docs/security/threat-model.md records this as the
    # platform's one fail-open exception and states that the Gateway-side
    # guarantee is conditional on the label being present; the compensating
    # control is that the platform sets the label at tenant creation and the
    # host-label policy keeps it immutable. This test asserts the shape the
    # threat model describes, so that a change to the posture shows up here
    # and gets made against that document rather than by accident.
    asserts:
      # Anchored: the empty-host short-circuit must be the FIRST operand, and
      # `||` is what makes it admit. Rewriting it to the siblings' fail-closed
      # `tenantHost == "" ? false :` breaks this pattern, which is the point.
      - documentIndex: 0
        matchRegex:
          path: spec.validations[0].expression
          pattern: '^variables\.tenantHost == "" \|\|'

  - it: cozystack-gateway-hostname-policy Binding is fail-closed (validationActions Deny)
    asserts:
      - documentIndex: 1
        equal:
          path: kind
          value: ValidatingAdmissionPolicyBinding
      - documentIndex: 1
        equal:
          path: spec.policyName
          value: cozystack-gateway-hostname-policy
      - documentIndex: 1
        equal:
          path: spec.validationActions
          value: [Deny]

  - it: cozystack-tenant-host-policy targets Tenant CRs and gates on trusted callers
    asserts:
      - documentIndex: 2
        equal:
          path: metadata.name
          value: cozystack-tenant-host-policy
      - documentIndex: 2
        equal:
          path: spec.matchConstraints.resourceRules[0].apiGroups
          value: ["apps.cozystack.io"]
      - documentIndex: 2
        equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: ["tenants"]
      - documentIndex: 2
        matchRegex:
          path: spec.variables[?(@.name=="trustedCaller")].expression
          pattern: 'system:masters'
      - documentIndex: 2
        matchRegex:
          path: spec.variables[?(@.name=="trustedCaller")].expression
          pattern: 'cozy-system'
      - documentIndex: 2
        matchRegex:
          path: spec.variables[?(@.name=="trustedCaller")].expression
          pattern: 'cozy-fluxcd'
      - documentIndex: 2
        matchRegex:
          path: spec.variables[?(@.name=="trustedCaller")].expression
          pattern: 'cozy-cert-manager'

  - it: cozystack-tenant-host-policy Binding is fail-closed
    asserts:
      - documentIndex: 3
        equal:
          path: spec.validationActions
          value: [Deny]

  - it: tenant-host-policy consults the allow-hosts annotation and the reserved list
    set:
      _cluster:
        gateway-reserved-hosts: "hikube.cloud"
    asserts:
      - matchRegex:
          path: spec.variables[?(@.name=="allowedHosts")].expression
          pattern: 'namespace.cozystack.io/allowed-hosts'
        documentIndex: 2
      - matchRegex:
          path: spec.variables[?(@.name=="denied")].expression
          pattern: 'hikube.cloud'
        documentIndex: 2
      # `trustedCaller` must be OR-ed at the top level, evaluated before the
      # denylist/allowlist term, not AND-gated behind `!variables.denied` --
      # otherwise a cluster-admin could no longer set a reserved zone (e.g.
      # hikube.cloud) on tenant-root, which is precisely their job. Anchored
      # on the `|| variables.trustedCaller ||` substring rather than a bare
      # `trustedCaller` search, so a regression like
      # `!hostChanged || (!denied && (trustedCaller || allowed))` -- which an
      # unanchored search for "trustedCaller" would miss -- fails this
      # assertion instead of passing.
      - matchRegex:
          path: spec.validations[0].expression
          pattern: '\|\| variables\.trustedCaller \|\|'
        documentIndex: 2
      - matchRegex:
          path: spec.validations[0].expression
          pattern: 'variables.denied'
        documentIndex: 2
      - matchRegex:
          path: spec.validations[0].expression
          pattern: 'variables.allowed'
        documentIndex: 2

  - it: tenant-host-policy normalizes case on both the denylist and allowlist comparisons
    # Regression guard for the case-sensitivity bypass: newHost, and each
    # entry of the reserved/allowed lists, must all be run through
    # .lowerAscii() before comparison, or a mixed-case host slips past a
    # lowercase reserved entry while still matching a lowercase grant.
    asserts:
      - documentIndex: 2
        matchRegex:
          path: spec.variables[?(@.name=="denied")].expression
          pattern: 'lowerAscii'
      - documentIndex: 2
        matchRegex:
          path: spec.variables[?(@.name=="allowed")].expression
          pattern: 'lowerAscii'

  - it: tenant-host-policy rejects a spec.host entry containing whitespace
    # "b.other.org a.example.com" would pass the allowed check as one
    # opaque string (it ends with .example.com) and then split into two
    # allowlist entries once seeded into a child's annotation. Appended as
    # validations[1] so validations[0]'s pinned trustedCaller ordering is
    # untouched.
    asserts:
      - documentIndex: 2
        matchRegex:
          path: spec.variables[?(@.name=="malformedHost")].expression
          pattern: 'newHost\.contains\(" "\)'
      - documentIndex: 2
        # Anchored on the exact gated prefix, not a bare "malformedHost"
        # substring search: an ungated "!variables.malformedHost" also
        # contains that substring, so a loose pattern would still pass on
        # the regression this guards against -- a spec.host that already
        # carries whitespace bricking every future unrelated update to the
        # Tenant, since malformedHost is computed from the current value
        # and matchConditions fire whenever host is non-empty on either
        # side, not only when it changes.
        matchRegex:
          path: spec.validations[1].expression
          pattern: '!variables\.hostChanged \|\| !variables\.malformedHost'

  - it: tenant-host-policy permits clearing spec.host back to the derived apex
    # Privilege reduction, not a grant: newHost == "" must be an OR-disjunct
    # so an untrusted caller can always clear the field, matching the
    # message's claim that an empty spec.host inherits the parent apex.
    # `|| variables.trustedCaller ||` stays intact regardless of where this
    # disjunct lands, so it does not double as an ordering guard.
    asserts:
      - documentIndex: 2
        matchRegex:
          path: spec.validations[0].expression
          pattern: 'variables\.newHost == ""'

  - it: tenant-host-policy no longer leaks the requesting username
    asserts:
      - matchRegex:
          path: spec.validations[0].messageExpression
          pattern: 'request.userInfo.username'
        not: true
        documentIndex: 2

  - it: cozystack-namespace-host-label-policy targets core/v1 Namespace
    asserts:
      - documentIndex: 4
        equal:
          path: metadata.name
          value: cozystack-namespace-host-label-policy
      - documentIndex: 4
        equal:
          path: spec.matchConstraints.resourceRules[0].apiGroups
          value: [""]
      - documentIndex: 4
        equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: ["namespaces"]
      - documentIndex: 4
        matchRegex:
          path: spec.validations[0].messageExpression
          pattern: 'immutable'

  - it: cozystack-namespace-host-label-policy also gates the allowed-hosts annotation
    # The annotation governs every future host a child namespace may claim,
    # which makes it strictly more powerful than the label it sits beside,
    # so it gets the same immutability guarantee under the same
    # trusted-caller set. matchConditions must catch a write that touches
    # only the annotation, not just the label.
    asserts:
      - documentIndex: 4
        matchRegex:
          path: spec.matchConditions[0].expression
          pattern: 'namespace\.cozystack\.io/allowed-hosts'
      - documentIndex: 4
        matchRegex:
          path: spec.variables[?(@.name=="newAllowedHosts")].expression
          pattern: 'namespace\.cozystack\.io/allowed-hosts'
      - documentIndex: 4
        matchRegex:
          path: spec.validations[1].expression
          pattern: 'variables\.newAllowedHosts == variables\.oldAllowedHosts \|\| variables\.trustedCaller'

  - it: cozystack-namespace-host-label-policy Binding is fail-closed
    asserts:
      - documentIndex: 5
        equal:
          path: spec.validationActions
          value: [Deny]
      - documentIndex: 5
        equal:
          path: spec.policyName
          value: cozystack-namespace-host-label-policy

  - it: render passes when gateway-attached-namespaces contains a tenant-* entry
    # Inheritance refactor: tenant-* in the attach list is no longer
    # a hijack vector — the parent Gateway's allowedRoutes label
    # selector already includes every tenant labelled with
    # namespace.cozystack.io/gateway=<parent>, and hostname VAPs
    # (Layers 4/5/7) defend against any tenant attempting to claim
    # a hostname outside its own apex. Render must NOT fail.
    set:
      _cluster:
        gateway-attached-namespaces: "cozy-cert-manager,tenant-alice"
    asserts:
      - hasDocuments:
          count: 8

  - it: cozystack-gateway-attached-namespaces-policy VAP is no longer rendered
    # Regression guard: the dropped VAP must not reappear in a
    # future refactor that re-introduces the tenant-* ban.
    asserts:
      - notFailedTemplate: {}
      - documentIndex: 0
        notEqual:
          path: metadata.name
          value: cozystack-gateway-attached-namespaces-policy
      - documentIndex: 2
        notEqual:
          path: metadata.name
          value: cozystack-gateway-attached-namespaces-policy
      - documentIndex: 4
        notEqual:
          path: metadata.name
          value: cozystack-gateway-attached-namespaces-policy

  - it: renders cozystack-tenant-allowed-hosts-policy gated on the grant set
    set:
      _cluster:
        gateway-host-grant-groups: "system:serviceaccounts:hikube-api"
        gateway-reserved-hosts: "hikube.cloud"
    asserts:
      - documentIndex: 6
        matchRegex:
          path: metadata.name
          pattern: 'cozystack-tenant-allowed-hosts-policy'
      - documentIndex: 6
        matchRegex:
          path: spec.variables[?(@.name=="grantCaller")].expression
          pattern: 'system:masters'
      - documentIndex: 6
        matchRegex:
          path: spec.variables[?(@.name=="grantCaller")].expression
          pattern: 'cozy-fluxcd'
      - documentIndex: 6
        matchRegex:
          path: spec.variables[?(@.name=="grantCaller")].expression
          pattern: 'system:serviceaccounts:hikube-api'
      - documentIndex: 6
        matchRegex:
          path: spec.variables[?(@.name=="grantsReserved")].expression
          pattern: 'hikube.cloud'
      - documentIndex: 6
        matchRegex:
          path: spec.variables[?(@.name=="grantsReserved")].expression
          pattern: 'lowerAscii'
      - documentIndex: 6
        matchRegex:
          path: spec.validations[0].expression
          pattern: 'grantCaller'
      - documentIndex: 6
        matchRegex:
          path: spec.validations[1].expression
          pattern: 'clusterAdmin'

  - it: cozystack-tenant-allowed-hosts-policy rejects an entry containing whitespace or an empty entry
    # The allowed-hosts annotation is space-separated and split(" ") on read,
    # so a single grant entry containing whitespace becomes two allowlist
    # entries downstream -- one of which never went through grantsReserved
    # above as its own string. Appended as validations[2] so the existing
    # grantCaller (validations[0]) and clusterAdmin (validations[1]) checks
    # above keep their indices.
    asserts:
      - documentIndex: 6
        matchRegex:
          path: spec.variables[?(@.name=="malformedEntries")].expression
          pattern: 'h\.contains\(" "\)'
      - documentIndex: 6
        # Anchored on the exact gated prefix, not a bare "malformedEntries"
        # substring search: an ungated "!variables.malformedEntries" also
        # contains that substring, so a loose pattern would still pass on
        # the regression this guards against -- an allowedHosts list that
        # already carries a malformed entry bricking every future unrelated
        # update to the Tenant, since malformedEntries is computed from the
        # current value and matchConditions fire whenever the list is
        # non-empty on either side, not only when it changes.
        matchRegex:
          path: spec.validations[2].expression
          pattern: '!variables\.changed \|\| !variables\.malformedEntries'

  - it: allowed-hosts Binding is fail-closed
    asserts:
      - documentIndex: 7
        equal:
          path: spec.validationActions
          value: [Deny]
