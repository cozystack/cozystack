suite: tenant admin CDI upload RBAC

templates:
  - templates/clusterroles.yaml

release:
  name: cozystack-basics
  namespace: cozy-system

tests:
  - it: lets tenant admins inspect upload PVCs and create CDI upload tokens
    documentSelector:
      path: metadata.name
      value: cozy:tenant:admin:base
    asserts:
      - equal:
          path: metadata.labels["rbac.cozystack.io/aggregate-to-tenant-admin"]
          value: "true"
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["get"]
      - contains:
          path: rules
          content:
            apiGroups: ["upload.cdi.kubevirt.io"]
            resources: ["uploadtokenrequests"]
            verbs: ["create"]

  - it: does not grant CDI upload permissions to the use tier
    documentSelector:
      path: metadata.name
      value: cozy:tenant:use:base
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["get"]
      - notContains:
          path: rules
          content:
            apiGroups: ["upload.cdi.kubevirt.io"]
            resources: ["uploadtokenrequests"]
            verbs: ["create"]

  - it: aggregates upload permissions through admin into super-admin
    documentSelector:
      path: metadata.name
      value: cozy:tenant:admin
    asserts:
      - equal:
          path: metadata.labels["rbac.cozystack.io/aggregate-to-tenant-super-admin"]
          value: "true"
      - contains:
          path: aggregationRule.clusterRoleSelectors
          content:
            matchLabels:
              rbac.cozystack.io/aggregate-to-tenant-admin: "true"

  - it: selects admin permissions for super-admin
    documentSelector:
      path: metadata.name
      value: cozy:tenant:super-admin
    asserts:
      - contains:
          path: aggregationRule.clusterRoleSelectors
          content:
            matchLabels:
              rbac.cozystack.io/aggregate-to-tenant-super-admin: "true"

  - it: does not grant CDI upload token creation to the view tier
    documentSelector:
      path: metadata.name
      value: cozy:tenant:view:base
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["upload.cdi.kubevirt.io"]
            resources: ["uploadtokenrequests"]
            verbs: ["create"]
