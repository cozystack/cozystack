suite: database external-TLS policy renders with its binding
templates:
  - templates/database-external-tls-policy.yaml
release:
  name: cozystack-basics
  namespace: cozy-system
# The policy's decisions are evaluated by
# pkg/registry/apps/application/external_tls_policy_test.go, which compiles
# this template with the apiserver's own CEL compiler; this suite covers the
# render: both documents come out and the binding denies on this policy.
capabilities:
  apiVersions:
    - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
tests:
  - it: renders the policy and a Deny binding to it
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: kind
          value: ValidatingAdmissionPolicy
      - documentIndex: 0
        equal:
          path: metadata.name
          value: cozystack-database-external-tls-policy
      - documentIndex: 1
        equal:
          path: spec.policyName
          value: cozystack-database-external-tls-policy
      - documentIndex: 1
        equal:
          path: spec.validationActions
          value: [Deny]
