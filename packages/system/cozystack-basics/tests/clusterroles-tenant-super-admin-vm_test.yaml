suite: cozystack-basics tenant super-admin grants no raw-VM write

templates:
  - templates/clusterroles.yaml

release:
  name: cozystack-basics
  namespace: cozy-system

# super-admin:base must grant no write on raw kubevirt.io/virtualmachines: that
# bypasses the apps.cozystack.io wrapper's size/quota. The whole rule set is
# pinned, so broadening this tier is a deliberate test change.
tests:
  - it: cozy:tenant:super-admin:base grants apps.cozystack.io only, never raw kubevirt VMs
    documentSelector:
      path: metadata.name
      value: cozy:tenant:super-admin:base
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: ["apps.cozystack.io"]
              resources: ["*"]
              verbs: ["*"]
