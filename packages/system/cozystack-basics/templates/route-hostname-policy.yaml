{{/*
  cozystack-route-hostname-policy

  Layer 7 of the Gateway API security model (see
  packages/extra/gateway/README.md). The Gateway-side VAPs already in
  this package validate Gateway listener hostnames; this VAP closes
  the same surface at the route level so a tenant carrying RBAC for
  HTTPRoute / TLSRoute in its own namespace cannot publish hostnames
  that fall outside its apex.

  Scope: only routes in tenant-* namespaces are gated. cozy-*
  namespaces are cluster-admin-managed and trusted to publish under
  any apex (they back platform services like dashboard, harbor,
  bucket).

  Two pairs of resources are rendered:
   - VAP + Binding for HTTPRoute, rule naming v1 and v1beta1
   - VAP + Binding for TLSRoute, rule naming v1alpha2

  A rule reaches versions it does not name, but only while one version
  it does name is still served: matchConstraints.matchPolicy defaults
  to Equivalent, and the apiserver converts a request into a listed
  version before the policy sees it. Do not set matchPolicy: Exact
  here. It reads like a tightening and is the opposite: the policy
  would stop seeing every version the rule does not name.

  That condition is load-bearing for TLSRoute, whose rule names only
  v1alpha2. The bundle in packages/system/gateway-api-crds serves
  tlsroutes at v1 (storage), v1alpha2 and v1alpha3, and marks both
  alpha versions deprecated, so the single version this rule names is
  the one scheduled to go away. A bundle that drops v1alpha2 leaves the
  rule matching nothing: requests at v1 meet no policy at all, and
  failurePolicy: Fail does not fire, because there is no failure —
  only an absence of match. Give the TLSRoute rule v1 before taking a
  bundle that drops v1alpha2.

  What that would cost is narrower than it first reads, and narrow in
  the direction that matters. The v1 and v1alpha3 schemas mark
  spec.hostnames required with minItems: 1, so an empty or absent list
  is still rejected without this policy — on v1alpha2, which has
  neither, this policy is the only thing rejecting it. What no schema
  replaces is the apex comparison: without a matching rule, a TLSRoute
  naming someone else's apex is admitted.
*/}}
{{- /*
  CEL safety note: has() only works on field access expressions, not
  on top-level variables. namespaceObject is a top-level var supplied
  by the apiserver, so the nil check uses `!= null` first; the
  nested has() then walks into metadata.labels safely. See the
  feedback memory cel-has-field-only.md.

  Defense-in-depth contract: this VAP is fail-closed. A tenant-*
  namespace without `namespace.cozystack.io/host` is rejected (not
  silently allowed) so a missing or scrubbed Layer-5 label cannot
  open Layer 7 by itself. The only legitimate state where the
  label is absent is an in-flight namespace creation that hasn't
  finished labelling yet — in which case the caller should retry.

  spec.hostnames must be present and non-empty, not waved through when
  missing. A route that names no hostname does not match nothing: under
  Gateway API it inherits the hostnames of every listener it attaches to.
  `all()` over an empty list is vacuously true, so the empty list needs
  the same treatment as the absent field.

  Requiring the route to name its own hostnames is what makes them
  comparable against the tenant apex at all — CEL has no cross-object
  lookup, so a VAP cannot resolve the parent Gateway to learn what would
  otherwise be inherited.
*/}}
{{- /*
  Both operands of the hostname comparison are normalized with
  .lowerAscii() as defense-in-depth: the route hostname is already
  lowercase (the CRD pattern permits nothing else), but the apex operand is the
  namespace.cozystack.io/host label value, which Kubernetes permits to
  carry uppercase.
*/}}
{{- $celValidator := `(namespaceObject == null || !has(namespaceObject.metadata.labels) || !("namespace.cozystack.io/host" in namespaceObject.metadata.labels)) ? false : (has(object.spec.hostnames) && size(object.spec.hostnames) > 0 && object.spec.hostnames.all(h, h.lowerAscii() == namespaceObject.metadata.labels["namespace.cozystack.io/host"].lowerAscii() || h.lowerAscii().endsWith("." + namespaceObject.metadata.labels["namespace.cozystack.io/host"].lowerAscii())))` -}}
{{- /* Render only where the ValidatingAdmissionPolicy API is served (GA since Kubernetes 1.30; the management cluster requires 1.33+). Same guard as packages/core/platform/templates/deletion-protection.yaml. */}}
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cozystack-route-hostname-policy
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["gateway.networking.k8s.io"]
      apiVersions: ["v1", "v1beta1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["httproutes"]
  matchConditions:
  - name: tenant-namespace
    expression: object.metadata.namespace.startsWith("tenant-")
  validations:
  - expression: >-
      {{ $celValidator }}
    messageExpression: >-
      "HTTPRoute must declare spec.hostnames, and each hostname must equal the namespace's namespace.cozystack.io/host label or be a subdomain of it (namespace " + object.metadata.namespace + ")"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cozystack-route-hostname-policy
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  policyName: cozystack-route-hostname-policy
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cozystack-route-hostname-policy-tls
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["gateway.networking.k8s.io"]
      apiVersions: ["v1alpha2"]
      operations: ["CREATE", "UPDATE"]
      resources: ["tlsroutes"]
  matchConditions:
  - name: tenant-namespace
    expression: object.metadata.namespace.startsWith("tenant-")
  validations:
  - expression: >-
      {{ $celValidator }}
    messageExpression: >-
      "TLSRoute must declare spec.hostnames, and each hostname must equal the namespace's namespace.cozystack.io/host label or be a subdomain of it (namespace " + object.metadata.namespace + ")"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cozystack-route-hostname-policy-tls
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  policyName: cozystack-route-hostname-policy-tls
  validationActions: [Deny]
{{- end }}
