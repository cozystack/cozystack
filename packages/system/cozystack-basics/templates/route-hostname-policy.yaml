{{/*
  cozystack-route-hostname-policy

  Layer 7 of the Gateway API security model (see
  packages/extra/gateway/README.md). The Gateway-side VAPs already in
  this package validate Gateway listener hostnames; these VAPs close
  the same surface at the route level so a tenant carrying RBAC for
  HTTPRoute, TLSRoute or GRPCRoute in its own namespace cannot publish
  hostnames that fall outside its apex.

  Scope: only routes in tenant-* namespaces are gated. cozy-*
  namespaces are cluster-admin-managed and trusted to publish under
  any apex (they back platform services like dashboard, harbor,
  bucket).

  Three pairs of resources are rendered: a VAP + Binding each for
  HTTPRoute, TLSRoute and GRPCRoute. Which API versions each one matches
  is stated once, in the rule itself, rather than restated here.

  GRPCRoute is gated for the same reason as the other two. The port-443
  listeners the tenant gateway controller renders pin
  allowedRoutes.kinds to HTTPRoute and TLSRoute, but the port-80
  listener leaves kinds unset, and an unset kinds list resolves to
  whatever the listener protocol supports -- for HTTP that includes
  GRPCRoute, which carries spec.hostnames of its own.

  Each rule names every version the vendored bundle serves for its
  resource. hack/route-hostname-policy-version-coverage.bats pins those
  lists to the bundle and carries the reason a shorter one is unsafe.
*/}}
{{- /*
  CEL safety note: has() only works on field access expressions, not
  on top-level variables. namespaceObject is a top-level var supplied
  by the apiserver, so the nil check uses `!= null` first; the
  nested has() then walks into metadata.labels safely. See the
  feedback memory cel-has-field-only.md.

  Defense-in-depth contract: this VAP is fail-closed. A tenant-*
  namespace without `namespace.cozystack.io/host` is rejected (not
  silently allowed) so a missing or scrubbed Layer-5 label cannot
  open Layer 7 by itself. The only legitimate state where the
  label is absent is an in-flight namespace creation that hasn't
  finished labelling yet — in which case the caller should retry.
*/}}
{{- /*
  Both operands of the hostname comparison are normalized with
  .lowerAscii() as defense-in-depth: the route hostname is already
  lowercase (the CRD pattern permits nothing else), but the apex operand is the
  namespace.cozystack.io/host label value, which Kubernetes permits to
  carry uppercase.
*/}}
{{- $celValidator := `(namespaceObject == null || !has(namespaceObject.metadata.labels) || !("namespace.cozystack.io/host" in namespaceObject.metadata.labels)) ? false : (!has(object.spec.hostnames) || object.spec.hostnames.all(h, h.lowerAscii() == namespaceObject.metadata.labels["namespace.cozystack.io/host"].lowerAscii() || h.lowerAscii().endsWith("." + namespaceObject.metadata.labels["namespace.cozystack.io/host"].lowerAscii())))` -}}
{{- /* Render only where the ValidatingAdmissionPolicy API is served (GA since Kubernetes 1.30; the management cluster requires 1.33+). Same guard as packages/core/platform/templates/deletion-protection.yaml. */}}
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cozystack-route-hostname-policy
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["gateway.networking.k8s.io"]
      apiVersions: ["v1", "v1beta1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["httproutes"]
  matchConditions:
  - name: tenant-namespace
    expression: object.metadata.namespace.startsWith("tenant-")
  validations:
  - expression: >-
      {{ $celValidator }}
    messageExpression: >-
      "HTTPRoute hostnames must equal the namespace's namespace.cozystack.io/host label or be subdomains of it (namespace " + object.metadata.namespace + ")"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cozystack-route-hostname-policy
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  policyName: cozystack-route-hostname-policy
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cozystack-route-hostname-policy-tls
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["gateway.networking.k8s.io"]
      apiVersions: ["v1", "v1alpha2", "v1alpha3"]
      operations: ["CREATE", "UPDATE"]
      resources: ["tlsroutes"]
  matchConditions:
  - name: tenant-namespace
    expression: object.metadata.namespace.startsWith("tenant-")
  validations:
  - expression: >-
      {{ $celValidator }}
    messageExpression: >-
      "TLSRoute hostnames must equal the namespace's namespace.cozystack.io/host label or be subdomains of it (namespace " + object.metadata.namespace + ")"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cozystack-route-hostname-policy-tls
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  policyName: cozystack-route-hostname-policy-tls
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cozystack-route-hostname-policy-grpc
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["gateway.networking.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["grpcroutes"]
  matchConditions:
  - name: tenant-namespace
    expression: object.metadata.namespace.startsWith("tenant-")
  validations:
  - expression: >-
      {{ $celValidator }}
    messageExpression: >-
      "GRPCRoute hostnames must equal the namespace's namespace.cozystack.io/host label or be subdomains of it (namespace " + object.metadata.namespace + ")"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cozystack-route-hostname-policy-grpc
  labels:
    internal.cozystack.io/managed-by-cozystack: ""
spec:
  policyName: cozystack-route-hostname-policy-grpc
  validationActions: [Deny]
{{- end }}
