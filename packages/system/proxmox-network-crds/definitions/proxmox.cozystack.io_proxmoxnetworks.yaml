metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: proxmoxnetworks.proxmox.cozystack.io
spec:
  group: proxmox.cozystack.io
  names:
    kind: ProxmoxNetwork
    listKind: ProxmoxNetworkList
    plural: proxmoxnetworks
    shortNames:
    - pxnet
    singular: proxmoxnetwork
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .status.vlan
      name: VLAN
      type: integer
    - jsonPath: .status.bridge
      name: Bridge
      type: string
    - jsonPath: .status.cidr
      name: CIDR
      type: string
    - jsonPath: .status.ipPool.used
      name: Used
      type: integer
    - jsonPath: .status.ipPool.free
      name: Free
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProxmoxNetwork maps one VPC subnet onto a Proxmox VLAN.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProxmoxNetworkSpec binds one VPC subnet to a zone. The vpc chart writes it;
              tenants only read it.
            properties:
              ipPool:
                description: |-
                  IPPool is the InClusterIPPool in this namespace that Proxmox VMs on the
                  subnet draw addresses from. Its addresses must lie inside the subnet CIDR
                  and inside the subnet's excludeIps, so Kube-OVN never hands them to pods.
                minLength: 1
                type: string
              subnet:
                description: |-
                  Subnet is the Kube-OVN Subnet this network extends onto Proxmox. Its
                  spec.vlan must name a Vlan with the same name as the Subnet, which the
                  controller creates.
                minLength: 1
                type: string
              zone:
                description: Zone is the ProxmoxNetworkZone the VLAN is allocated
                  from.
                minLength: 1
                type: string
            required:
            - ipPool
            - subnet
            - zone
            type: object
            x-kubernetes-validations:
            - message: zone is immutable
              rule: self.zone == oldSelf.zone
            - message: subnet is immutable
              rule: self.subnet == oldSelf.subnet
          status:
            description: ProxmoxNetworkStatus is what a consumer needs to attach a
              VM.
            properties:
              bridge:
                description: Bridge is the Proxmox bridge VM NICs attach to.
                type: string
              cidr:
                description: CIDR, Gateway and Prefix of the subnet.
                type: string
              conditions:
                description: |-
                  Conditions: VLANAllocated, SubnetReady, IPPoolReady, GatewayReady,
                  Ready, and SwitchDeleted while the network is being deleted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gateway:
                type: string
              ipPool:
                description: IPPool usage.
                properties:
                  free:
                    format: int32
                    type: integer
                  total:
                    format: int32
                    type: integer
                  used:
                    format: int32
                    type: integer
                required:
                - free
                - total
                - used
                type: object
              mtu:
                description: MTU for VM NICs, when the zone sets one.
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
              prefix:
                format: int32
                type: integer
              vlan:
                description: VLAN is the allocated 802.1Q tag.
                format: int32
                type: integer
              vlanName:
                description: VLANName is the Kube-OVN Vlan object that carries the
                  tag.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
