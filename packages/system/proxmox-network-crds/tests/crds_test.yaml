suite: proxmox-network CRD survives a release uninstall
templates:
  - templates/crds.yaml
tests:
  - it: renders the ProxmoxNetworkZone CRD, kept on uninstall
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: CustomResourceDefinition
      - equal:
          path: metadata.name
          value: proxmoxnetworkzones.proxmox.cozystack.io
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - notExists:
          path: spec.versions[0].subresources
