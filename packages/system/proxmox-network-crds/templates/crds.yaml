{{- /* The definitions are generated by controller-gen (hack/update-codegen.sh).
      They ship as a component of their own, installed before the controller
      package, so the package's ProxmoxNetworkZones render on its first install.
      helm.sh/resource-policy: keep stops an uninstall of this release from
      deleting the CRDs, which would delete every ProxmoxNetwork with them and
      skip the finalizers that hold VLANs until their VMs are gone. */}}
{{- range $path, $_ := .Files.Glob "definitions/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $ann := $crd.metadata.annotations | default dict }}
{{- $_ := set $ann "helm.sh/resource-policy" "keep" }}
{{- $_ := set $crd.metadata "annotations" $ann }}
---
{{ toYaml $crd }}
{{- end }}
