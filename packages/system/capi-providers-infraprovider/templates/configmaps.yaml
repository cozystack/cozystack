apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capi-providers-infraprovider.version" . }}
  labels:
    provider.cluster.x-k8s.io/version: {{ include "capi-providers-infraprovider.version" . }}
    infraprovider-components: cozy
  annotations:
    provider.cluster.x-k8s.io/compressed: "true"
binaryData:
  components: {{ .Files.Get "files/components.gz" | b64enc | quote }}
data:
  metadata: {{ .Files.Get "files/metadata.yaml" | quote }}
