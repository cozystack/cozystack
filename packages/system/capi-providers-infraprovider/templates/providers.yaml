apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: kubevirt
spec:
  # https://github.com/kubernetes-sigs/cluster-api-provider-kubevirt
  version: {{ include "capi-providers-infraprovider.version" . }}
  fetchConfig:
    selector:
      matchLabels:
        provider.cluster.x-k8s.io/version: {{ include "capi-providers-infraprovider.version" . }}
        infraprovider-components: cozy
  deployment:
    containers:
    - name: manager
      imageUrl: {{ .Files.Get "images/cluster-api-provider-kubevirt.tag" | trim | quote }}
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
