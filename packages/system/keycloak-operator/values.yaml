keycloak-operator:
  image:
    # The host stays inside `repository`: the nightly mirror's host rewrite
    # cannot reach a build registry whose `registry` key holds only part of it.
    registry: ""
    repository: ghcr.io/cozystack/cozystack/keycloak-operator
    tag: "v1.7.0-alpha.3@sha256:658921476e43e48afa63a43709a07042b7b7640af03316ae0d782fd37dc966cf"
  clusterReconciliationEnabled: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
