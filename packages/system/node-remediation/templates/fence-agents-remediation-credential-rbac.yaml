# The namespaced half of the fence-agents operator's safety-mode grants, from
# config/rbac/safety/credential_role.yaml in the patched upstream tree with
# the namespace set to the one the operator is started for. The cluster half
# and the operator's own namespace come from templates/fence-agents-remediation.yaml.
# Events are this chart's addition: the operator records them on the
# remediation CRs, which live here rather than next to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fence-agents-remediation-safety
  namespace: cozy-node-remediation-bmc
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["fence-agents-remediation.medik8s.io"]
    resources: ["fenceagentsremediations", "fenceagentsremediationtemplates"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["fence-agents-remediation.medik8s.io"]
    resources: ["fenceagentsremediations/status", "fenceagentsremediationtemplates/status", "fenceagentsremediations/finalizers"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fence-agents-remediation-safety
  namespace: cozy-node-remediation-bmc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fence-agents-remediation-safety
subjects:
  - kind: ServiceAccount
    name: fence-agents-remediation-controller-manager
    namespace: {{ .Release.Namespace }}
