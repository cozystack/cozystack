# templates/node-healthcheck-operator.yaml is written by `make update` from
# upstream's kustomize config through kustomize/nhc. These cases pin what the
# overlay and the filter in the Makefile are for.
suite: node-healthcheck operator serves its webhook with a cert-manager certificate
templates:
  - templates/node-healthcheck-operator.yaml
release:
  name: node-remediation
  namespace: cozy-node-remediation
set:
  bmc:
    caBundle: |
      -----BEGIN CERTIFICATE-----
      MIIB
      -----END CERTIFICATE-----
tests:
  - it: runs two replicas of the image from values with the webhook certificate mounted
    documentSelector:
      path: kind
      value: Deployment
    set:
      nodeHealthcheck:
        image: registry.example/node-healthcheck-operator:test
    asserts:
      - equal:
          path: metadata.name
          value: node-healthcheck-controller-manager
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example/node-healthcheck-operator:test
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9443
            name: webhook-server
            protocol: TCP
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cert
            secret:
              defaultMode: 420
              secretName: node-healthcheck-webhook-cert

  # The service account name is what the fence-agents operator trusts as the
  # only creator of remediation CRs; a rename here silently refuses every
  # remediation there.
  - it: keeps the service account the fence-agents operator trusts
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: node-healthcheck-controller-manager
      - equal:
          path: metadata.namespace
          value: cozy-node-remediation

  - it: lets cert-manager inject the serving CA into the webhook configuration
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: cozy-node-remediation/node-healthcheck-serving-cert
      - equal:
          path: webhooks[0].clientConfig.service.namespace
          value: cozy-node-remediation

  - it: renders neither the CRD nor a Namespace
    asserts:
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          any: true
        not: true
      - containsDocument:
          apiVersion: v1
          kind: Namespace
          any: true
        not: true
