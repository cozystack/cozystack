kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: apps.cozystack.io:site-router-controller
rules:
# Discover and reconcile SiteRouter instances. They are Flux HelmReleases
# labeled apps.cozystack.io/application.kind=SiteRouter, spread across tenant
# namespaces (hence cluster-wide). The controller reads spec.values and patches
# the instance's finalizer + status; it never rewrites the HelmRelease spec
# (that would fight Flux's helm-controller).
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["get", "list", "watch", "patch"]
# Discover the gateway VM's virt-launcher pod (via lineage labels) and, in T07,
# relax ovn.kubernetes.io/port_security on it with a single-key merge patch.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "patch"]
# Program the kube-ovn return routes: the controller patches
# ovn.kubernetes.io/routes on the tenant namespace and the kube-ovn webhook
# propagates it to pods (T07). Namespaces are read one at a time through the
# uncached reader and are not in CacheByObject, so list/watch is not granted;
# `patch` must stay cluster-wide because tenant namespaces are created
# dynamically and RBAC cannot scope a verb by label or name pattern.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "patch"]
# Read the per-instance PSK / api-key Secrets (VyOS HTTPS API token).
#
# `get` ONLY, deliberately. Secrets are read one object at a time through the
# uncached APIReader and are not in CacheByObject, so list/watch would grant
# nothing the controller uses — and a cluster-wide Secret `list` returns object
# contents, turning an unused verb into a cross-tenant credential-exfiltration
# surface. Keep it off.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
# Resolve allocated LoadBalancer/external service IPs for the remote-CIDR
# deny-set and list tenant-local ClusterIPs for the guest source filter. This is
# a separate rule from Secrets so the controller never gains Secret list access.
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
# Resolve every live node address as a protected /32 in the remote-CIDR deny-set.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
# Read the gateway VirtualMachineInstance for NIC MAC discovery (resolving the
# kernel device the tunnel/source-filter bind to); a single get, best-effort.
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachineinstances"]
  verbs: ["get"]
# Read the cozy-system/cozystack ConfigMap for the cluster network CIDRs used by
# the remote-CIDR deny-set validation. `get` only — a single uncached read of one
# well-known object; see the Secret/Service rule above for why the unused
# list/watch is not granted.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
# Leader election (--leader-elect).
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
