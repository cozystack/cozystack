## @section Proxmox CSI
##
## The upstream chart ships a values.talos.yaml preset that does not fit a
## Cozystack tenant, and the two differences are not cosmetic:
##
##   - it selects the controller onto `node-role.kubernetes.io/control-plane`.
##     A Kamaji tenant has no control-plane nodes at all — the control plane is
##     a Deployment in the management cluster — so that selector leaves the
##     controller Pending forever.
##   - it selects the node plugin onto
##     `node.cloudprovider.kubernetes.io/platform: nocloud`, a label a
##     cloud-controller-manager running inside the cluster applies. The CCM for
##     this substrate runs in the management cluster and applies no such label,
##     so that DaemonSet would schedule nowhere.
##
## Both are dropped here. This release is the tenant-side half only: the node
## plugin, the CSIDriver object and the storage classes. The controller — the
## half that authenticates to the hypervisor — runs in the management cluster,
## in templates/csi-proxmox/controller.yaml of the kubernetes chart, and that
## chart sets replicaCount to 0 for the controller Deployment this one still
## renders. `config.clusters` stays empty on purpose: the chart's Secret
## template renders only for a non-empty list, and an empty one is what keeps
## every credential out of the tenant.

proxmox-csi-plugin:
  createNamespace: false

  config:
    clusters: []

  storageClass: []

  node:
    tolerations:
      - operator: Exists
    plugin:
      # The chart's default is its appVersion as a bare tag, and tags in this
      # registry have been re-pushed. The digest is the pin; the version must
      # stay the chart's appVersion and the one in the kubernetes chart's
      # images/proxmox-csi-controller.tag, since node and controller are two
      # halves of one driver release (hack/proxmox-csi-driver-pin_test.bats).
      # The repository repeats the chart default so that hack/lib/image-refs.sh,
      # which does not read under charts/, sees a complete reference here.
      image:
        repository: ghcr.io/sergelogvinov/proxmox-csi-node
        tag: v0.20.0@sha256:e0151137a1c5fa4faea9b4622436b203f1dc246ea37a3a77d09d3855c70aabd1
