apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proxmoxconnections.proxmox.alperen.cloud
spec:
  group: proxmox.alperen.cloud
  names:
    kind: ProxmoxConnection
    listKind: ProxmoxConnectionList
    plural: proxmoxconnections
    shortNames:
    - pxc
    singular: proxmoxconnection
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProxmoxConnection is the Schema for the proxmoxconnections API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProxmoxConnectionSpec defines the desired state of ProxmoxConnection.
            properties:
              endpoint:
                description: Endpoint is the address of the Proxmox cluster endpoint
                type: string
              insecureSkipVerify:
                default: false
                description: InsecureSkipVerify skips the verification of the server's
                  certificate chain and host name
                type: boolean
              password:
                description: Password to authenticate with the Proxmox cluster
                type: string
              passwordFrom:
                description: |-
                  PasswordFrom reads the password from a key of a Secret, instead of
                  storing it in Password.
                properties:
                  key:
                    description: Key within the Secret's data.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the Secret.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
              secret:
                description: Secret to authenticate with the Proxmox cluster
                type: string
              secretFrom:
                description: |-
                  SecretFrom reads the API token secret from a key of a Secret, instead of
                  storing it in Secret.
                properties:
                  key:
                    description: Key within the Secret's data.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the Secret.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
              tokenID:
                description: TokenID to authenticate with the Proxmox cluster
                type: string
              username:
                description: Username to authenticate with the Proxmox cluster
                type: string
            required:
            - endpoint
            type: object
            x-kubernetes-validations:
            - message: Specify either username with one of password or passwordFrom,
                or tokenID with one of secret or secretFrom
              rule: (has(self.username) && (has(self.password) != has(self.passwordFrom))
                && !has(self.tokenID) && !has(self.secret) && !has(self.secretFrom))
                || (!has(self.username) && !has(self.password) && !has(self.passwordFrom)
                && has(self.tokenID) && (has(self.secret) != has(self.secretFrom)))
          status:
            description: ProxmoxConnectionStatus defines the observed state of ProxmoxConnection.
            properties:
              conditions:
                description: |-
                  INSERT ADDITIONAL STATUS FIELD - define observed state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectionStatus:
                type: string
              observedSecrets:
                description: |-
                  ObservedSecrets are the Secrets this connection reads credentials from,
                  each with the resourceVersion the controller last read them at. A value
                  that differs from the Secret's current resourceVersion means the
                  credential was rotated and has not been picked up yet.
                items:
                  description: |-
                    ObservedSecret is a Secret a connection reads a credential from, together
                    with the resourceVersion it had when that credential was last read.
                  properties:
                    name:
                      description: Name of the Secret.
                      type: string
                    namespace:
                      description: Namespace of the Secret.
                      type: string
                    resourceVersion:
                      description: ResourceVersion the Secret had when its credential
                        was read.
                      type: string
                  required:
                  - name
                  - namespace
                  - resourceVersion
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              version:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
