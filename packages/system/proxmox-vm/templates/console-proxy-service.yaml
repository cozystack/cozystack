apiVersion: v1
kind: Service
metadata:
  name: proxmox-console-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: proxmox-console-proxy
    app.kubernetes.io/part-of: proxmox-vm
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    app.kubernetes.io/name: proxmox-console-proxy
