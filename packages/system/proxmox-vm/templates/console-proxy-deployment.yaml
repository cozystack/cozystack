apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxmox-console-proxy
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxmox-console-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: proxmox-console-proxy
    app.kubernetes.io/part-of: proxmox-vm
spec:
  replicas: {{ .Values.consoleProxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: proxmox-console-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxmox-console-proxy
        app.kubernetes.io/part-of: proxmox-vm
        # Like kubemox: the proxy reads VirtualMachines and asks the apiserver
        # whether a caller may, and lives in a namespace whose policy admits
        # pods to the apiserver by this label only.
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      serviceAccountName: proxmox-console-proxy
      {{- with .Values.consoleProxy.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The serving certificate is read by the group the secret volume
        # gets, so the process needs no root for it.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: console-proxy
        image: "{{ .Values.consoleProxy.image }}"
        args:
        - --listen=:8443
        - --tls-cert-file=/etc/console-proxy/tls/tls.crt
        - --tls-private-key-file=/etc/console-proxy/tls/tls.key
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
        livenessProbe:
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        {{- with .Values.consoleProxy.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: tls
          mountPath: /etc/console-proxy/tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: proxmox-console-proxy-cert
          defaultMode: 0440
