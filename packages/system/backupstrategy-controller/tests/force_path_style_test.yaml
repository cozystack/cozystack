suite: forcePathStyle — one normalised boolean for every consumer

# backupStorage.forcePathStyle reaches drivers that read it differently: the
# controller and Velero parse it with strconv.ParseBool, the etcd and MongoDB
# strategies write it into a boolean field Helm decodes as YAML 1.1, and the
# Kafka and RabbitMQ scripts compare the string with "false". The chart accepts
# the spellings of both strconv.ParseBool and YAML 1.1, hands each consumer
# "true" or "false", and refuses anything else, so a spelling cannot mean path
# style to one driver and not to another.

templates:
  - templates/deployment.yaml
  - templates/strategy-etcd-default.yaml
  - templates/strategy-mongodb-default.yaml
  - templates/strategy-kafka-default.yaml
  - templates/strategy-rabbitmq-default.yaml
  - templates/velero-bsl.yaml

release:
  name: t
  namespace: cozy-backup-controller

set:
  backupStorage.bucketNameOverride: test-bucket

tests:
  - it: "forcePathStyle '1' reaches the controller as true"
    set:
      backupStorage.forcePathStyle: "1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_STORAGE_FORCE_PATH_STYLE
            value: "true"
        template: templates/deployment.yaml

  - it: "forcePathStyle 't' reaches the controller as true"
    set:
      backupStorage.forcePathStyle: "t"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_STORAGE_FORCE_PATH_STYLE
            value: "true"
        template: templates/deployment.yaml

  - it: "forcePathStyle 'T' reaches every consumer as true"
    set:
      backupStorage.forcePathStyle: "T"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_STORAGE_FORCE_PATH_STYLE
            value: "true"
        template: templates/deployment.yaml
      - equal:
          path: spec.template.destination.s3.forcePathStyle
          value: true
        template: templates/strategy-etcd-default.yaml
      - equal:
          path: spec.template.s3.forcePathStyle
          value: true
        template: templates/strategy-mongodb-default.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_FORCE_PATH_STYLE
            value: "true"
        template: templates/strategy-kafka-default.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_FORCE_PATH_STYLE
            value: "true"
        template: templates/strategy-rabbitmq-default.yaml
      - equal:
          path: spec.config.s3ForcePathStyle
          value: "true"
        template: templates/velero-bsl.yaml

  - it: "forcePathStyle 'true' reaches the controller as true"
    set:
      backupStorage.forcePathStyle: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_STORAGE_FORCE_PATH_STYLE
            value: "true"
        template: templates/deployment.yaml

  - it: "forcePathStyle 'True' reaches the controller as true"
