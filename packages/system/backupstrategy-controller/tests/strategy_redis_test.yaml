suite: Redis strategy — CA/TLS wiring, deadline, and fail-loud S3 refs

# These pin the Redis Strategy CR's render-time LOGIC — the decisions the chart
# makes, not the script text (whose contract is the backup/restore roundtrip
# e2e). The load-bearing one is TLS: the default must not skip verification, an
# opt-in must, and a private-CA Secret must be required rather than optional.

templates:
  - templates/strategy-redis-default.yaml

release:
  name: t
  namespace: cozy-backup-controller

set:
  # a resolvable bucket name so the gated strategy renders at all
  backupStorage.bucketNameOverride: test-bucket

tests:
  - it: "default: app CA mounted optionally (server-TLS auto-detect), no S3 CA, skip-verify off, deadline set, S3 refs optional"
    asserts:
      # The Redis app's CA is always mounted, but optionally: ca.crt lands only
      # for a TLS-enabled app, and the script keys its server-TLS path off that
      # file's presence. Its absence must not fail the Pod.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: redis-ca
            secret:
              secretName: "redis-{{ .Release.Name }}.ca-cert"
              optional: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-ca
            mountPath: /etc/redis-ca
            readOnly: true
      # No S3-endpoint CA volume unless endpointCASecretName is set.
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: s3-ca
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_INSECURE_SKIP_VERIFY
            value: "false"
      - equal:
          path: spec.template.spec.activeDeadlineSeconds
          value: 3600
      # Every S3 coordinate ref is optional so a missing key fails the script
      # loudly instead of wedging the Pod in CreateContainerConfigError.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: cozy-backups-creds
                key: endpoint
                optional: true

  - it: "endpointCASecretName set: CA volume mounted at /etc/s3-ca, optional so a missing Secret does not wedge the Pod"
    set:
      backupStorage.endpointCASecretName: my-s3-ca
    asserts:
      # Optional, because nothing projects this Secret into the app namespace:
      # a required mount would wedge the Pod on FailedMount (never a Failed Job)
      # until the deadline when the admin has not created it. A missing ca.crt
      # falls through to the system CA store and fails the handshake fast; it
      # does not skip verification.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: s3-ca
            secret:
              secretName: my-s3-ca
              optional: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: s3-ca
            mountPath: /etc/s3-ca
            readOnly: true

  - it: "insecureSkipTLSVerify=true is threaded to the Pod as an explicit opt-in"
    set:
      backupStorage.insecureSkipTLSVerify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_INSECURE_SKIP_VERIFY
            value: "true"
