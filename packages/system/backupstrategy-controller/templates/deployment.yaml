apiVersion: apps/v1
kind: Deployment
metadata:
  name: backupstrategy-controller
  labels:
    app: backupstrategy-controller
spec:
  replicas: {{ .Values.backupStrategyController.replicas }}
  selector:
    matchLabels:
      app: backupstrategy-controller
  template:
    metadata:
      labels:
        app: backupstrategy-controller
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      serviceAccountName: backupstrategy-controller
      containers:
      - name: backupstrategy-controller
        image: "{{ .Values.backupStrategyController.image }}"
        args:
        - --leader-elect
        {{- if .Values.backupStrategyController.metrics.enabled }}
        - --metrics-bind-address={{ .Values.backupStrategyController.metrics.bindAddress }}
        {{- end }}
        {{- if .Values.backupStrategyController.debug }}
        - --zap-log-level=debug
        {{- else }}
        - --zap-log-level=info
        {{- end }}
        env:
        - name: BACKUP_STORAGE_SECRET_NAMESPACE
          value: {{ .Values.backupStorage.namespace | quote }}
        - name: BACKUP_STORAGE_SECRET_NAME
          value: {{ .Values.backupStorage.systemSecretName | quote }}
        - name: BACKUP_STORAGE_CREDS_SECRET_NAME
          value: cozy-backups-creds
        - name: BACKUP_STORAGE_ENDPOINT
          value: {{ include "backupstrategy-controller.endpoint" . | quote }}
        - name: BACKUP_STORAGE_REGION
          value: {{ .Values.backupStorage.region | quote }}
        - name: BACKUP_STORAGE_FORCE_PATH_STYLE
          value: {{ .Values.backupStorage.forcePathStyle | quote }}
        - name: BACKUP_STORAGE_SYSTEM_NAMESPACES
          value: {{ .Values.backupStorage.systemNamespaces | join "," | quote }}
        {{- if .Values.backupStorage.reconcileDefaultObjects }}
        # DefaultObjectsGate: the Strategy CRs and the Velero BSL are gated
        # on a `lookup` of the BucketClaim this same chart creates, so a
        # fresh install renders them empty — permanently, because
        # helm-controller does not re-render an unchanged, successful
        # release. The gate detects the missing objects once the bucket name
        # is resolvable and forces exactly one real Helm upgrade on THIS
        # release, which is the only thing that re-runs the lookups.
        - name: BACKUP_DEFAULT_OBJECTS_BACKUPCLASS
          value: cozy-default
        - name: BACKUP_DEFAULT_OBJECTS_HELMRELEASE_NAME
          value: {{ .Release.Name | quote }}
        - name: BACKUP_DEFAULT_OBJECTS_HELMRELEASE_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        {{- if .Values.velero.bslEnabled }}
        - name: BACKUP_DEFAULT_OBJECTS_VELERO_NAMESPACE
          value: {{ .Values.velero.namespace | quote }}
        {{- end }}
        {{- end }}
        ports:
        {{- if .Values.backupStrategyController.metrics.enabled }}
        - name: metrics
          containerPort: {{ splitList ":" .Values.backupStrategyController.metrics.bindAddress | mustLast }}
        {{- end }}
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        {{- with .Values.backupStrategyController.resources }}
        resources: {{- . | toYaml | nindent 10 }}
        {{- end }}
