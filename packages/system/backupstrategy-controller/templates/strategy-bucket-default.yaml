{{- $endpoint := include "backupstrategy-controller.endpoint" . -}}
{{- $bucketName := include "backupstrategy-controller.bucketName" . -}}
{{- /*
  Gate on the Bucket CRD being Established, not just a resolved $bucketName:
  this chart ships its own strategy.backups.cozystack.io CRDs as templates, and
  Helm resolves every document in a release manifest through the RESTMapper
  before applying any of them. On an upgrade that first ships this kind the
  bucket name resolved releases ago, so a bucket-name-only gate would render the
  CR alongside its still-absent CRD and wedge the whole release (see the mongodb
  default for the same trap). */ -}}
{{- $crdEstablished := include "backupstrategy-controller.crdEstablished" (dict "root" . "crd" "buckets.strategy.backups.cozystack.io") -}}
{{- if and $bucketName $crdEstablished -}}
apiVersion: strategy.backups.cozystack.io/v1alpha1
kind: Bucket
metadata:
  name: cozy-default-bucket
spec:
  template:
    destination:
      bucket: {{ $bucketName | quote }}
      endpoint: {{ $endpoint | quote }}
      prefix: {{ printf "{{ .Application.metadata.namespace }}/{{ .Application.metadata.name }}/" | quote }}
      region: {{ .Values.backupStorage.region | quote }}
      accessKeyIdSecretKeyRef:
        name: cozy-backups-creds
        key: AWS_ACCESS_KEY_ID
      secretAccessKeySecretKeyRef:
        name: cozy-backups-creds
        key: AWS_SECRET_ACCESS_KEY
    image: {{ .Values.backupStrategyController.image | quote }}
{{- end -}}
