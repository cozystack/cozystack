{{/*
  Two-layer templating (see strategy-altinity-default.yaml for the rationale):
  Helm renders this file at chart install time (the $bucketName gate, the
  endpoint/bucket/region); the backupstrategy-controller re-renders the
  resulting Kafka Strategy CR per BackupJob/RestoreJob/cleanup, expanding
  `{{ .Mode | .Release | .BackupName | .ArtifactURI | .Backup }}`. A literal
  `{{ .Foo }}` that must survive Helm is passed as the string argument of `printf`.

  Kafka topic-METADATA backup. Strimzi ships no backup CR and this strategy does
  not touch message data: it exports every non-internal topic's definition
  (partition count, replication factor, non-default configs) through the Kafka
  Admin API and restores it. Consumer offsets, ACLs, quotas and KafkaUsers are
  out of scope. Restored topics are created directly through the Admin API, so
  on the target they are unmanaged (no KafkaTopic CR) — and for a topic that IS
  owned by a KafkaTopic CR, the Strimzi Topic Operator reconciles its configs
  from the CR, so an in-place config restore of such a topic is transient. See
  docs/operations/backup-classes.md and the example README.
*/}}
{{- $bucketName := include "backupstrategy-controller.bucketName" . -}}
{{- if $bucketName -}}
apiVersion: strategy.backups.cozystack.io/v1alpha1
kind: Kafka
metadata:
  name: cozy-default-kafka
spec:
  artifactURITemplate: {{ printf "s3://%s/{{ .Release.Namespace }}/{{ .Release.Name }}/{{ .BackupName }}/kafka-metadata.txt" $bucketName | quote }}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-backup
          image: "{{ .Values.backupStrategyController.kafkaBackupClientImage }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: {{ printf "{{ .Mode }}" | quote }}
            # The chart names the Strimzi cluster kafka-<app>; its plaintext
            # bootstrap Service is kafka-<app>-kafka-bootstrap:9092 (no TLS/auth
            # on the internal plain listener). On restore .Release is the TARGET.
            - name: BOOTSTRAP
              value: {{ printf "kafka-{{ .Release.Name }}-kafka-bootstrap.{{ .Release.Namespace }}.svc:9092" | quote }}
            # ARTIFACT_URI is the single source of truth for the object
            # location: rendered from spec.artifactURITemplate, recorded on the
            # Backup's status.artifact.uri, and read back on restore/cleanup so
            # those fetch or delete the exact object this backup wrote — a later
            # change to the key layout cannot orphan older backups.
            - name: ARTIFACT_URI
              value: {{ printf "{{ .ArtifactURI }}" | quote }}
            # S3 coordinates from the projected cozy-backups-creds Secret.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cozy-backups-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cozy-backups-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: {{ include "backupstrategy-controller.endpoint" . | quote }}
            - name: S3_REGION
              value: {{ .Values.backupStorage.region | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.backupStorage.forcePathStyle | quote }}
          command: ["/usr/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              BIN=/opt/kafka/bin
              TAB=$(printf '\t')
              file=/tmp/kafka-metadata.txt

              case "${S3_ENDPOINT}" in
                http://*|https://*) base="${S3_ENDPOINT}" ;;
                *) base="https://${S3_ENDPOINT}" ;;
              esac
              # ARTIFACT_URI is s3://<bucket>/<key>. Split it and build the HTTP
              # object URL, honouring path-style vs virtual-hosted addressing so
              # this works against both SeaweedFS (path-style) and an external S3
              # configured for virtual-hosted-style. The whole base URL is kept
              # for path-style, so a host carrying a path prefix or an IPv6
              # literal survives (mirrors strategy-rabbitmq-default.yaml).
              case "${ARTIFACT_URI}" in
                s3://*) rest="${ARTIFACT_URI#s3://}"; bucket="${rest%%/*}"; key="${rest#*/}" ;;
                *) echo "expected an s3:// artifact URI, got '${ARTIFACT_URI}' (set spec.artifactURITemplate)" >&2; exit 1 ;;
              esac
              if [ "${S3_FORCE_PATH_STYLE}" = "false" ]; then
                scheme="${base%%://*}"; host="${base#*://}"
                obj_url="${scheme}://${bucket}.${host}/${key}"
              else
                obj_url="${base}/${bucket}/${key}"
              fi
              # No -k: the platform endpoint helper returns the ACME-valid
              # external S3 ingress, so curl --aws-sigv4 verifies TLS against the
              # image's ca-certificates - matching strategy-rabbitmq-default.yaml.
              # This image's curl (7.76.1) signs an empty-body payload hash on
              # --upload-file and omits x-amz-content-sha256, so its S3 envelope
              # is narrower than the sibling drivers' (see kafkaBackupClientImage
              # in ../values.yaml): SeaweedFS and MinIO accept it, backends that
              # recompute the body hash may not.
              s3() { curl -fsS --aws-sigv4 "aws:amz:${S3_REGION}:s3" \
                --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" "$@"; }

              # Cleanup runs when the owning Backup is deleted: delete the object
              # and exit before any broker access (the source may already be
              # gone). A missing object is success (delete is idempotent), so a
              # non-2xx/404 exits non-zero and the controller retries rather than
              # orphaning the object.
              if [ "${MODE}" = cleanup ]; then
                echo "deleting ${ARTIFACT_URI}"
                code=$(curl -sS -o /dev/null -w '%{http_code}' \
                  --aws-sigv4 "aws:amz:${S3_REGION}:s3" \
                  --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
                  -X DELETE "${obj_url}" || true)
                case "${code}" in
                  2*|404) echo "deleted (HTTP ${code})"; exit 0 ;;
                  *) echo "delete failed: HTTP ${code}" >&2; exit 1 ;;
                esac
              fi

              # Extract PartitionCount / ReplicationFactor from a --describe
              # summary line; empty output means an unparsable describe.
              describe_field() { printf '%s' "$1" | grep -oE "$2: [0-9]+" | awk '{print $2}'; }

              if [ "${MODE}" = backup ]; then
                echo "exporting Kafka topic metadata from ${BOOTSTRAP}"
                # Fail closed: a failed --list must abort, not read as "no topics"
                # and upload an empty backup that reports success. An empty list
                # after a SUCCESSFUL call is a legitimate "no user topics" state.
                if ! all=$("${BIN}"/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --list --exclude-internal); then
                  echo "cannot list topics on ${BOOTSTRAP}" >&2; exit 1
                fi
                : > "${file}"
                # Topic names cannot contain whitespace, so word-splitting is safe
                # and keeps the loop in the current shell (a piped while would
                # swallow exits into a subshell).
                for t in ${all}; do
                  [ -n "${t}" ] || continue
                  # kafka-topics --topic is a Java REGEX filter, not a literal
                  # name: "audit.events" would also match "audit-events". Wrap
                  # the name in \Q...\E so it matches exactly the one topic
                  # (a missing topic still yields exit 1 / empty, preserved).
                  if ! desc=$("${BIN}"/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --describe --topic "\Q${t}\E"); then
                    echo "cannot describe topic ${t}" >&2; exit 1
                  fi
                  line=${desc%%$'\n'*}
                  parts=$(describe_field "${line}" PartitionCount)
                  rf=$(describe_field "${line}" ReplicationFactor)
                  { [ -n "${parts}" ] && [ -n "${rf}" ]; } || { echo "unparsable describe for ${t}: ${line}" >&2; exit 1; }
                  printf 'T%s%s%s%s%s%s\n' "${TAB}" "${t}" "${TAB}" "${parts}" "${TAB}" "${rf}" >> "${file}"
                  # Non-default configs, ONE per line from kafka-configs --describe
                  # ("  key=value sensitive=... synonyms=..."), so a value that
                  # contains a comma stays in its own tab-separated field — the
                  # comma-joined "Configs:" summary cannot be split unambiguously.
                  if ! cfgout=$("${BIN}"/kafka-configs.sh --bootstrap-server "${BOOTSTRAP}" --describe --entity-type topics --entity-name "${t}"); then
                    echo "cannot describe configs for ${t}" >&2; exit 1
                  fi
                  # Fail closed like the --list guard: grep exit 1 is "no
                  # non-default configs" (fine); any other exit is an I/O error
                  # and must abort, not silently drop the topic's configs.
                  if cfglines=$(printf '%s\n' "${cfgout}" | grep -E '^[[:space:]]+[^[:space:]=]+='); then :; else
                    rc=$?; [ "${rc}" -eq 1 ] || { echo "cannot parse configs for ${t}" >&2; exit 1; }
                    cfglines=""
                  fi
                  if [ -n "${cfglines}" ]; then
                    printf '%s\n' "${cfglines}" | while read -r cl; do
                      kv=${cl%% sensitive=*}
                      k=${kv%%=*}
                      v=${kv#*=}
                      printf 'C%s%s%s%s%s%s\n' "${TAB}" "${t}" "${TAB}" "${k}" "${TAB}" "${v}" >> "${file}"
                    done
                  fi
                  echo "  ${t}: partitions=${parts} rf=${rf}"
                done
                s3 -X PUT --upload-file "${file}" "${obj_url}"
                echo "uploaded ${ARTIFACT_URI}"
              else
                echo "restoring Kafka topic metadata into ${BOOTSTRAP} from ${ARTIFACT_URI}"
                s3 -o "${file}" "${obj_url}"
                # Probe existence with --list, fail closed: a --describe under
                # 2>/dev/null cannot tell "topic absent" from "broker
                # unreachable" (Kafka 3.9.1 exits 1 for both, and the
                # distinguishing text goes to stdout). --list instead fails the
                # whole restore when the broker is unreachable, so a transient
                # outage is never misread as "absent" and routed into --create.
                if ! live=$("${BIN}"/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --list); then
                  echo "cannot list topics on ${BOOTSTRAP}" >&2; exit 1
                fi
                # Redirect (not a pipe) so an exit inside aborts the whole script.
                while IFS="${TAB}" read -r kind a b c; do
                  case "${kind}" in
                  T)
                    t=$a; parts=$b; rf=$c
                    # grep -F -x: literal whole-line match against the live list.
                    if printf '%s\n' "${live}" | grep -qxF -- "${t}"; then
                      if ! desc=$("${BIN}"/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --describe --topic "\Q${t}\E"); then
                        echo "cannot describe existing topic ${t}" >&2; exit 1
                      fi
                      line=${desc%%$'\n'*}
                      lp=$(describe_field "${line}" PartitionCount)
                      lrf=$(describe_field "${line}" ReplicationFactor)
                      # A restore that cannot reach the recorded shape must fail
                      # loudly, not report success against a divergent topic.
                      if [ "${lrf}" != "${rf}" ]; then
                        echo "topic ${t}: replication factor differs (live=${lrf} backup=${rf}); cannot reconcile" >&2; exit 1
                      fi
                      if [ "${lp}" -lt "${parts}" ]; then
                        "${BIN}"/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --alter --topic "\Q${t}\E" --partitions "${parts}"
                      elif [ "${lp}" -gt "${parts}" ]; then
                        echo "topic ${t}: live has ${lp} partitions, backup ${parts}; Kafka cannot decrease partitions" >&2; exit 1
                      fi
                    else
                      "${BIN}"/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --create --topic "${t}" --partitions "${parts}" --replication-factor "${rf}"
                    fi
                    echo "  topic ${t}: partitions=${parts} rf=${rf}"
                    ;;
                  C)
                    t=$a; k=$b; v=$c
                    # Bracket-group only when the value contains a comma, so
                    # kafka-configs does not split it into bogus key=val tokens.
                    case "${v}" in
                      *,*) add="${k}=[${v}]" ;;
                      *)   add="${k}=${v}" ;;
                    esac
                    "${BIN}"/kafka-configs.sh --bootstrap-server "${BOOTSTRAP}" --alter --entity-type topics --entity-name "${t}" --add-config "${add}"
                    echo "    config ${t}: ${k}"
                    ;;
                  esac
                done < "${file}"
                echo "restore complete"
              fi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
{{- end -}}
