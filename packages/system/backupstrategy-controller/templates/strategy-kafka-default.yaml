{{/*
  Two-layer templating (see strategy-altinity-default.yaml for the rationale):
  Helm renders this file at chart install time (the $bucketName gate, the
  endpoint/bucket/region); the backupstrategy-controller re-renders the
  resulting Kafka Strategy CR per BackupJob/RestoreJob/cleanup, expanding
  `{{ .Mode | .Release | .BackupName | .ArtifactURI | .Backup }}`. A literal
  `{{ .Foo }}` that must survive Helm is passed as the string argument of `printf`.

  Kafka topic-METADATA backup. Strimzi ships no backup CR and this strategy does
  not touch message data: it exports every non-internal topic's definition
  (partition count, replication factor, non-default configs) through the Kafka
  Admin API and restores it. Consumer offsets, ACLs, quotas and KafkaUsers are
  out of scope. Restored topics are created directly through the Admin API, so
  on the target they are unmanaged (no KafkaTopic CR) — and for a topic that IS
  owned by a KafkaTopic CR, the Strimzi Topic Operator reconciles its configs
  from the CR, so an in-place config restore of such a topic is transient. See
  docs/operations/backup-classes.md and the example README.
*/}}
{{- $bucketName := include "backupstrategy-controller.bucketName" . -}}
{{- if $bucketName -}}
apiVersion: strategy.backups.cozystack.io/v1alpha1
kind: Kafka
metadata:
  name: cozy-default-kafka
spec:
  artifactURITemplate: {{ printf "s3://%s/{{ .Release.Namespace }}/{{ .Release.Name }}/{{ .BackupName }}/kafka-metadata.txt" $bucketName | quote }}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-backup
          image: "{{ .Values.backupStrategyController.kafkaBackupClientImage }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: {{ printf "{{ .Mode }}" | quote }}
            # The chart names the Strimzi cluster kafka-<app>; its plaintext
            # bootstrap Service is kafka-<app>-kafka-bootstrap:9092 (no TLS/auth
            # on the internal plain listener). On restore .Release is the TARGET.
            - name: BOOTSTRAP
              value: {{ printf "kafka-{{ .Release.Name }}-kafka-bootstrap.{{ .Release.Namespace }}.svc:9092" | quote }}
            # ARTIFACT_URI is the single source of truth for the object
            # location: rendered from spec.artifactURITemplate, recorded on the
            # Backup's status.artifact.uri, and read back on restore/cleanup so
            # those fetch or delete the exact object this backup wrote — a later
            # change to the key layout cannot orphan older backups.
            - name: ARTIFACT_URI
              value: {{ printf "{{ .ArtifactURI }}" | quote }}
            # S3 coordinates from the projected cozy-backups-creds Secret.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cozy-backups-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cozy-backups-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: {{ include "backupstrategy-controller.endpoint" . | quote }}
            - name: S3_REGION
              value: {{ .Values.backupStorage.region | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.backupStorage.forcePathStyle | quote }}
          command: ["/usr/bin/bash", "-c"]
          # The driver script is kept as a standalone shell file and
          # embedded verbatim so hack/kafka-backup-script.bats can execute
          # it against stubbed kafka CLIs + S3 (the shell logic is otherwise
          # untestable at the chart layer). It reads only env vars, never
          # Helm/controller values, so no tpl is applied.
          args:
            - |
{{ .Files.Get "files/kafka-backup.sh" | indent 14 }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
{{- end -}}
