{{- $endpoint := include "backupstrategy-controller.endpoint" . -}}
{{- $endpointHost := $endpoint | trimPrefix "https://" | trimPrefix "http://" -}}
{{- $secureConn := ternary "1" "0" (hasPrefix "https://" $endpoint) -}}
{{- $bucketName := include "backupstrategy-controller.bucketName" . -}}
{{- if $bucketName -}}
apiVersion: strategy.backups.cozystack.io/v1alpha1
kind: FoundationDB
metadata:
  name: cozy-default-foundationdb
spec:
  template:
    blobStoreConfiguration:
      # The operator requires an "@" in accountName. With nothing before it
      # FDB reads both the API key and the secret from the credentials file,
      # under the account "@<host>" (port excluded) that the projector
      # writes, so the api_key never lands in Strategy spec or Backup.status.
      accountName: {{ printf "@%s" $endpointHost | quote }}
      bucket: {{ $bucketName | quote }}
      # BackupName is left to the driver — it picks the BackupJob name so
      # each Cozystack BackupJob writes to a discrete S3 directory.
      # secure_connection is computed from the endpoint scheme so an admin
      # switching backupStorage.endpoint to https:// does NOT silently
      # downgrade FDB to plaintext.
      urlParameters:
        - {{ printf "secure_connection=%s" $secureConn | quote }}
        - {{ printf "region=%s" .Values.backupStorage.region | quote }}
        - {{ printf "bucket_path={{ .Application.metadata.namespace }}/{{ .Application.metadata.name }}" | quote }}
    snapshotPeriodSeconds: 3600
    # FDB sends TLS SNI only from 7.3.78 / 7.4.6, and SNI-routed S3 endpoints
    # abort the handshake without it, so agents of older clusters run the
    # same minor's SNI-capable patch. Keep in step with the initContainers
    # tags in the foundationdb-operator package values.
    minimumAgentVersions:
      - "7.3.79"
      - "7.4.8"
    backupDeploymentPodTemplateSpec:
      spec:
        containers:
          - name: foundationdb
            # Credentials go through the environment rather than
            # customParameters: the operator prefixes every custom parameter
            # with "--", so a "--blob_credentials" entry would reach FDB as
            # "----blob_credentials" and be rejected.
            env:
              - name: FDB_BLOB_CREDENTIALS
                value: /var/fdb-blob-credentials/blob_credentials.json
              {{- if eq $secureConn "1" }}
              # FDB never loads the OS trust store: without FDB_TLS_CA_FILE
              # every TLS handshake to the blob store fails. Point it at the
              # image's system bundle so the endpoint's certificate verifies.
              - name: FDB_TLS_CA_FILE
                value: /etc/pki/tls/certs/ca-bundle.crt
              {{- end }}
            volumeMounts:
              - name: blob-credentials
                mountPath: /var/fdb-blob-credentials
                readOnly: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            securityContext:
              runAsUser: 4059
              runAsGroup: 4059
        volumes:
          - name: blob-credentials
            secret:
              secretName: cozy-backups-creds
              items:
                - key: blob_credentials.json
                  path: blob_credentials.json
{{- end -}}
