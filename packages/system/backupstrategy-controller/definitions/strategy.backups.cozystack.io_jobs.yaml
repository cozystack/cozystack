  names:
    kind: Job
    listKind: JobList
    plural: jobs
    singular: job
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Job defines a backup strategy using a one-shot Job
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: JobSpec specifies the desired behavior of a backup job.
            properties:
              template:
                description: |-
                  Template holds a PodTemplateSpec with the right shape to run a single
                  pod to completion and create (or restore) a backup of a given app's
                  data. Helm-like Go templates are supported in every string field and
                  are rendered against the following context:
                    - `.Application` — the live application object (e.g.
                      `.Application.spec.replicas`).
                    - `.Release.Name` and `.Release.Namespace` — the application's name
                      and namespace.
                    - `.Mode` — `"backup"` or `"restore"`, identifying the run.
                    - `.Parameters` — the resolved BackupClass strategy parameters.
                    - `.Backup` — only on restore runs: `.Backup.Name`, `.Backup.Namespace`
                      and `.Backup.ApplicationRef` describing the source backup.

                  Stored schemaless: the apiserver keeps it as written rather than
                  checking it against the pod schema, and it is validated when the
                  driver creates the workload from it.
                x-kubernetes-preserve-unknown-fields: true
            required:
