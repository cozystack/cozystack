---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: redis.strategy.backups.cozystack.io
spec:
  group: strategy.backups.cozystack.io
  names:
    kind: Redis
    listKind: RedisList
    plural: redis
    singular: redis
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Redis defines a backup strategy for a spotahome RedisFailover app. The
          spotahome operator ships no backup CRD, so the strategy runs a one-shot Job
          that dumps an RDB snapshot to object storage (and replays it on restore) -
          the same PodTemplateSpec model as the Job/Altinity strategies rather than an
          operator-CR delegation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RedisSpec specifies the desired behavior of a Redis backup
              strategy.
            properties:
              template:
                description: |-
                  Template holds a PodTemplateSpec with the right shape to run a single
                  pod to completion and dump (or restore) a Redis RDB snapshot to object
                  storage. Helm-like Go templates are supported in every string field and
                  are rendered against the following context:
                    - `.Application` — the live application object (e.g.
                      `.Application.spec.replicas`).
                    - `.Release.Name` and `.Release.Namespace` — the application's name
                      and namespace.
                    - `.Mode` — `"backup"`, `"restore"`, or `"cleanup"` (delete the object
                      of a removed Backup), identifying the run.
                    - `.ObjectKey` — the object-storage key for this run: unique per backup,
                      and on restore/cleanup the exact key recorded on the Backup, so a Plan
                      keeps one object per run and a restore reads back the one it names
                      rather than whatever last overwrote a shared path.
                    - `.Parameters` — the resolved BackupClass strategy parameters.
                    - `.Backup` — only on restore runs: `.Backup.Name`, `.Backup.Namespace`
                      and `.Backup.ApplicationRef` describing the source backup, so a
                      to-copy restore reads the SOURCE release's object-storage prefix.

                  Stored schemaless (content preserved, not validated by the apiserver): the
                  driver renders and validates the pod spec, and generating the full
                  PodTemplateSpec OpenAPI schema here would add ~590 KB to this CRD. The
                  backupstrategy-controller chart inlines every definitions/*.yaml into one
                  Helm release whose state Secret is capped at 1 MiB, so a full
                  PodTemplateSpec schema here (a fifth after Altinity, Job, FoundationDB and
                  Redis's own siblings) pushes that Secret over the cap and fails install.
                  Same reason as rabbitmq_types.go.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - template
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
