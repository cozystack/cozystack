---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: etcds.strategy.backups.cozystack.io
spec:
  group: strategy.backups.cozystack.io
  names:
    kind: Etcd
    listKind: EtcdList
    plural: etcds
    singular: etcd
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              template:
                properties:
                  destination:
                    properties:
                      s3:
                        properties:
                          bucket:
                            minLength: 1
                            type: string
                          credentialsSecretRef:
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          endpoint:
                            minLength: 1
                            type: string
                          forcePathStyle:
                            type: boolean
                          key:
                            type: string
                          region:
                            type: string
                        required:
                        - bucket
                        - credentialsSecretRef
                        - endpoint
                        type: object
                    required:
                    - s3
                    type: object
                    x-kubernetes-validations:
                    - message: s3 destination is required (PVC is intentionally not
                        supported by this strategy until upstream restore-agent reads
                        the same path the backup-agent writes; see the strategy comments)
                      rule: has(self.s3)
                required:
                - destination
                type: object
            required:
            - template
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
