{{- $host := index .Values._cluster "root-host" }}
{{- $realm := index .Values._cluster "oidc-realm-name" | default "cozy" }}
{{- $oidcEnabled := index .Values._cluster "oidc-enabled" }}
{{- $oidcInsecureSkipVerify := index .Values._cluster "oidc-insecure-skip-verify" }}
{{- $keycloakInternalUrl := index .Values._cluster "keycloak-internal-url" | default "" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: incloud-web-gatekeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: incloud-web
      app.kubernetes.io/name: gatekeeper
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      {{- if eq $oidcEnabled "true" }}
      annotations:
        checksum/gatekeeper-config: {{ include (print $.Template.BasePath "/gatekeeper-config.yaml") . | sha256sum }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: incloud-web
        app.kubernetes.io/name: gatekeeper
    spec:
      serviceAccountName: incloud-web-gatekeeper
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - appSpec
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - incloud-web
                topologyKey: kubernetes.io/hostname
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      priorityClassName: system-cluster-critical
      containers:
        {{- if eq $oidcEnabled "true" }}
        - name: auth-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
          imagePullPolicy: IfNotPresent
          # Provider, upstream, listen address and injected headers are in
          # gatekeeper-config.yaml; oauth2-proxy refuses them as flags next to
          # --alpha-config.
          args:
            - --alpha-config=/etc/oauth2-proxy/config/alpha-config.yaml
            - --redirect-url=https://dashboard.{{ $host }}/oauth2/callback
            - --whitelist-domain=keycloak.{{ $host }}
            - --email-domain=*
            - --api-route=^/api(/|$)
            - --api-route=^/apis(/|$)
            - --cookie-refresh=3m
            - --cookie-name=kc-access
            - --cookie-secure=true
            - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
            - --skip-provider-button
            {{- if eq $oidcInsecureSkipVerify "true" }}
            - --ssl-insecure-skip-verify=true
            {{- end }}
          volumeMounts:
            - name: gatekeeper-config
              mountPath: /etc/oauth2-proxy/config
              readOnly: true
            - name: client-secret
              mountPath: /etc/oauth2-proxy/client
              readOnly: true
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth-config
                  key: cookieSecret
          livenessProbe:
            httpGet:
              path: /ping
              port: proxy
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: proxy
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
        {{- else }}
        - name: token-proxy
          image: {{ .Values.tokenProxy.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --upstream=http://cozy-dashboard-console.{{ .Release.Namespace }}.svc:8080
            - --http-address=0.0.0.0:8000
            - --cookie-refresh=1h
            - --cookie-name=kc-access
            - --cookie-secure=true
            - --cookie-secret=$(TOKEN_PROXY_COOKIE_SECRET)
          env:
            - name: TOKEN_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth-config
                  key: cookieSecret
          # /healthz/live: process is up; /healthz/ready: JWK cache populated.
          # Splitting them lets a permanent JWKS misconfig surface as 0/1 Ready
          # (pod stays out of service endpoints) instead of being indistinguishable
          # from "user pasted a bad token" at the sign-in handler.
          #
          # startupProbe is the backstop for the genuinely-stuck case: a
          # permanently broken JWKS (wrong URL, missing RBAC, DNS that never
          # resolves) leaves /healthz/ready returning 503 forever, but
          # readiness failures alone never restart the pod. After ~5 minutes
          # of consecutive failures the startupProbe restarts the container
          # and surfaces the problem as RestartCount/CrashLoopBackOff so an
          # operator sees something instead of a silently NotReady pod.
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: proxy
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: proxy
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: proxy
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          # The branding config.json the SPA reads via the kube-api is mounted
          # here so the pre-auth login page can render the same title and logo.
          volumeMounts:
            - name: branding
              mountPath: /etc/cozystack/branding
              readOnly: true
        {{- end }}
          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        {{- if eq $oidcEnabled "true" }}
        - name: gatekeeper-config
          configMap:
            name: incloud-web-gatekeeper-config
        - name: client-secret
          secret:
            secretName: dashboard-client
            items:
              - key: client-secret-key
                path: client-secret
        {{- else }}
        # optional: the login page degrades to its unbranded default if the
        # ConfigMap is missing, so a start-up dependency is not worth failing on.
        - name: branding
          configMap:
            name: cozy-dashboard-console-config
            optional: true
        {{- end }}
