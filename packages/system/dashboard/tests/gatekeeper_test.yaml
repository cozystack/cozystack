suite: gatekeeper container and probes per OIDC mode
templates:
  - templates/gatekeeper.yaml
  - templates/gatekeeper-config.yaml

release:
  name: dashboard
  namespace: cozy-dashboard

# gatekeeper.yaml selects between two completely different containers
# depending on _cluster.oidc-enabled: the OIDC-enabled branch runs
# oauth2-proxy (image quay.io/oauth2-proxy/oauth2-proxy) which serves
# /ping as a health endpoint, and the OIDC-disabled branch runs the
# in-tree token-proxy which serves /healthz/live + /healthz/ready.
# Each branch has its own probes; a refactor that collapses the
# if/else differently (e.g. shared probes on /ping) would silently
# break the OIDC-disabled deployment because token-proxy does not
# answer /ping with a 2xx. Pin both branches so structural drift is
# a test failure.

tests:
  - it: oidc-enabled=false renders token-proxy with /healthz probes
    template: templates/gatekeeper.yaml
    set:
      _cluster:
        root-host: example.org
        oidc-enabled: "false"
      tokenProxy:
        image: example.invalid/token-proxy:test
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: token-proxy
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.invalid/token-proxy:test
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz/ready
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz/live
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz/ready
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000
      # The pre-auth login page reads its branding from the same
      # cozy-dashboard-console-config ConfigMap the SPA consumes, mounted
      # read-only. The volume is optional so a cluster without branding still
      # starts and renders the historical unbranded page.
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: branding
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/cozystack/branding
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: branding
            configMap:
              name: cozy-dashboard-console-config
              optional: true

  # The OIDC branch runs oauth2-proxy, whose login is served by Keycloak (already
  # branded via the realm theme), so the branding ConfigMap must not be mounted
  # there — pin its absence so a refactor that hoists the volume out of the
  # non-OIDC guard is a test failure.
  - it: oidc-enabled=true does not mount the branding config
    template: templates/gatekeeper.yaml
    set:
      _cluster:
        root-host: example.org
        oidc-enabled: "true"
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: branding
            configMap:
              name: cozy-dashboard-console-config
              optional: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: branding
            mountPath: /etc/cozystack/branding
            readOnly: true

  # authentication.oidc.enabled defaults to false while keycloakInternalUrl now
  # defaults to the in-cluster Service, so THIS pair — OIDC off, internal URL
  # set — is what most clusters actually render. The internal-URL block is
  # nested inside the oidc-enabled guard, so it cannot leak into the
  # token-proxy branch today; pin that, because a refactor which hoists the
  # block out would otherwise ship silently.
  - it: oidc-enabled=false ignores a set keycloak-internal-url
    template: templates/gatekeeper.yaml
    set:
      _cluster:
        root-host: example.org
        oidc-enabled: "false"
        keycloak-internal-url: http://keycloak-http.cozy-keycloak.svc:8080/realms/cozy
      tokenProxy:
        image: example.invalid/token-proxy:test
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: token-proxy
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --skip-oidc-discovery
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --redeem-url=http://keycloak-http.cozy-keycloak.svc:8080/realms/cozy/protocol/openid-connect/token
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --oidc-jwks-url=http://keycloak-http.cozy-keycloak.svc:8080/realms/cozy/protocol/openid-connect/certs

  - it: oidc-enabled=true renders auth-proxy with /ping probes and no startupProbe
    template: templates/gatekeeper.yaml
    set:
      _cluster:
        root-host: example.org
        oidc-enabled: "true"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: auth-proxy
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^quay\\.io/oauth2-proxy/oauth2-proxy:"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /ping
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ping
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000
