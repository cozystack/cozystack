apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: site-router
spec:
  application:
    kind: SiteRouter
    plural: siterouters
    singular: siterouter
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"tunnel":{"description":"Site-to-site tunnel configuration.","type":"object","default":{},"required":["type"],"properties":{"type":{"description":"Tunnel protocol used to connect to the remote peer.","type":"string","default":"ipsec","enum":["ipsec"]}}},"peer":{"description":"Remote peer this router builds a tunnel to.","type":"object","default":{},"required":["address"],"properties":{"address":{"description":"Public address (IP or hostname) of the remote peer. Responder model: the remote peer dials in.","type":"string","default":"","pattern":"^[A-Za-z0-9.:-]*$"},"auth":{"description":"IPsec authentication material for the tunnel.","type":"object","default":{},"properties":{"existingSecret":{"description":"Name of an existing Secret in the tenant namespace holding the pre-shared key (key `psk`). Takes precedence over `psk` when set.","type":"string"},"psk":{"description":"IPsec pre-shared key. Autogenerated and stored in a Secret when omitted. Mutually exclusive with `existingSecret`.","type":"string"}}}}},"remoteCIDRs":{"description":"Remote networks reachable over the tunnel. Must be disjoint from cluster pod/service/join networks, live node addresses, and allocated LoadBalancer/external service addresses (validated at admission and by the controller).","type":"array","default":[],"items":{"type":"string"}},"staticRoutes":{"description":"Optional extra static routes programmed on the router.","type":"array","default":[],"items":{"type":"object","required":["destination","nextHop"],"properties":{"destination":{"description":"Destination network in CIDR notation.","type":"string","pattern":"^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$"},"nextHop":{"description":"Next-hop IP address for the destination.","type":"string","pattern":"^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$"}}}},"bgp":{"description":"Optional BGP peering over the tunnel. Disabled by default.","type":"object","default":{},"required":["enabled"],"properties":{"enabled":{"description":"Enable BGP peering.","type":"boolean","default":false},"localASN":{"description":"Local autonomous system number. Required when `enabled` is true; must be a valid ASN (1..4294967295).","type":"integer","maximum":4294967295,"minimum":1},"neighbors":{"description":"BGP neighbors to peer with.","type":"array","items":{"type":"object","required":["address","remoteASN"],"properties":{"address":{"description":"Neighbor IP address.","type":"string","pattern":"^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$"},"remoteASN":{"description":"Remote autonomous system number of the neighbor. Must be a valid ASN (1..4294967295).","type":"integer","maximum":4294967295,"minimum":1}}}}}},"security":{"description":"Platform-owned network security guards for the gateway VM.","type":"object","default":{},"properties":{"egressDenyCIDRs":{"description":"Extra destination CIDRs the gateway is denied egress to, on top of the built-in link-local `169.254.0.0/16` deny (which always applies and covers the cloud metadata endpoint `169.254.169.254`). Use for management or node ranges that do not overlap tenant workloads; do NOT list the cluster pod/service/join ranges (the gateway must reach tenant workloads). Empty by default.","type":"array","default":[],"items":{"type":"string"}}}},"resources":{"description":"Explicit CPU and memory sizing for the router VM.","type":"object","default":{},"required":["cpu","memory"],"properties":{"cpu":{"description":"CPU topology cores allocated to the router VM. Whole cores only; a fractional quantity (e.g. \"1500m\", \"0.5\") is rejected at admission rather than silently truncated to zero. At least one core: `cpu: 0` and negative values otherwise pass admission and render an unusable KubeVirt CPU topology.","type":"integer","default":2,"minimum":1},"memory":{"description":"Memory (RAM) allocated to the router VM.","default":"2Gi","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}},"managementCIDR":{"description":"Source CIDR allowed to reach the VyOS management API (HTTPS 443) through the first-boot firewall. This value and the controller's --management-cidr flag (T05/T06) must agree: both default to the cluster pod CIDR (10.244.0.0/16, the kube-ovn default) and must be kept consistent. On a cluster with a non-default `networking.podCIDR`, set this (and the controller's managementCidr) to that pod CIDR, or the firewall will reject the real controller source. An empty value requires `allowOpenManagement=true` (fail-closed). Constrained to a strict IPv4 CIDR (or empty) so a tenant value cannot inject arbitrary text into the VyOS first-boot config.","type":"string","default":"10.244.0.0/16","pattern":"^(((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9]))?$"},"allowOpenManagement":{"description":"Permit an empty `managementCIDR`, leaving the VyOS management API unrestricted (no first-boot firewall). Fail-closed by default: an empty `managementCIDR` with this false aborts rendering.","type":"boolean","default":false},"cloudInitSeed":{"description":"Opaque seed mixed into the VM firmware UUID. Change it to force a first-boot cloud-init re-run; clear it to preserve an existing VM's UUID across re-renders.","type":"string","default":""}}}
  release:
    prefix: site-router-
    labels:
      sharding.fluxcd.io/key: tenants
    chartRef:
      kind: ExternalArtifact
      name: cozystack-site-router-application-default-site-router
      namespace: cozy-system
  dashboard:
    category: NaaS
    singular: SiteRouter
    plural: SiteRouter
    tags:
      - network
    description: Managed site-to-site router
    icon: 
    keysOrder: [["apiVersion"], ["appVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "tunnel"], ["spec", "tunnel", "type"], ["spec", "peer"], ["spec", "peer", "address"], ["spec", "peer", "auth"], ["spec", "remoteCIDRs"], ["spec", "staticRoutes"], ["spec", "bgp"], ["spec", "bgp", "enabled"], ["spec", "security"], ["spec", "security", "egressDenyCIDRs"], ["spec", "resources"], ["spec", "resources", "cpu"], ["spec", "resources", "memory"], ["spec", "managementCIDR"], ["spec", "allowOpenManagement"], ["spec", "cloudInitSeed"]]
  secrets:
    exclude: []
    include:
      - resourceNames:
          - site-router-{{ .name }}-psk
  services:
    exclude: []
    include:
      - resourceNames:
          - site-router-{{ .name }}-tunnel
