# Container image (shared with the cozyplane chart — the apiserver binary lives
# in the same image). Digest-pinned (no floating tag); keep it equal to
# chart/cozyplane/values.yaml's pin. See docs/packaging.md.
image: ghcr.io/lllamnyp/cozyplane@sha256:133c1e1c95e28f4a857288c3a58aca592de7e2a0d91c689cd99382f61ec1805c
imagePullPolicy: IfNotPresent
imagePullSecrets: []

replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

etcd:
  # Operator-managed etcd (the aenix-io etcd-operator; Cozystack ships it):
  # replicated, PVC-backed, TLS end to end. The production path, and the default
  # — the Cozystack install this chart is packaged for always has the operator
  # (packages/packagesources/apiserver.yaml dependsOn cozystack.etcd-operator).
  # Turn it off for a standalone/kind install with no operator: the chart then
  # falls back to the built-in single-pod etcd below, which is one pod holding
  # every sdn.cozystack.io object in the cluster.
  operator:
    enabled: true
    replicas: 3
    size: 4Gi
    # etcd version the operator runs (required by the EtcdCluster schema).
    version: "3.6.11"
    # persistent: PVC-backed (durable) vs tmpfs. The aggregated API's objects
    # are cluster state; a memory-backed etcd loses all of them on a
    # full-cluster restart, which is what a node reboot is. Requires a storage
    # layer, so the component must be sequenced after it.
    persistent: true
    # StorageClass for the members' PVCs ("" = cluster default). Replicated, so
    # a member's data survives losing the node it was scheduled on. Cozystack's
    # storage layers (linstor, blockstor) both provide a "replicated" class.
    storageClass: "replicated"
  # Built-in single-pod etcd (dev/evaluation only).
  image: registry.k8s.io/etcd:3.5.16-0
  # Storage for the built-in single-pod etcd. Default is a PVC — the aggregated
  # API's objects (VPCs, Ports, policies) are cluster state, and an emptyDir
  # loses them on a pod move. Set `emptyDir: {}` explicitly for a throwaway
  # cluster with no storage class.
  storage:
    persistentVolumeClaim:
      claimName: cozyplane-etcd-data
  # The PVC the chart creates when storage above references it.
  persistence:
    enabled: true
    storageClassName: ""   # "" = the cluster default
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
