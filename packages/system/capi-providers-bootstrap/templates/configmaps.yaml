apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.AppVersion }}-bootstrap
  labels:
    provider.cluster.x-k8s.io/version: {{ .Chart.AppVersion }}-bootstrap
    bootstrap-components: cozy
    bootstrap-provider: kubeadm
  annotations:
    provider.cluster.x-k8s.io/compressed: "true"
binaryData:
  components: {{ .Files.Get "files/components.gz" | b64enc | quote }}
data:
  metadata: {{ .Files.Get "files/metadata.yaml" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capi-providers-bootstrap.talosVersion" . }}
  labels:
    provider.cluster.x-k8s.io/version: {{ include "capi-providers-bootstrap.talosVersion" . }}
    bootstrap-components: cozy
    bootstrap-provider: talos
  annotations:
    provider.cluster.x-k8s.io/compressed: "true"
binaryData:
  components: {{ .Files.Get "files/components-talos.gz" | b64enc | quote }}
data:
  metadata: {{ .Files.Get "files/metadata-talos.yaml" | quote }}
