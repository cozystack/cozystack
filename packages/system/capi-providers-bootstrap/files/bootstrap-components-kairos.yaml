                        type: object
                      controlPlaneRole:
                        allOf:
                        - enum:
                          - single
                          - init
                          - join
                        - enum:
                          - single
                          - init
                          - join
                        description: |-
                          ControlPlaneRole is the init/join/single discriminator for this
                          control-plane machine. Set by the KairosControlPlane controller;
