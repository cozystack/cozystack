    app.kubernetes.io/name: capi-kairos-bootstrap
    cluster.x-k8s.io/provider: bootstrap-kairos-io
  name: capi-kairos-bootstrap-webhook-service
  namespace: capi-kairos-bootstrap-system
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    cluster.x-k8s.io/provider: bootstrap-kairos-io
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/name: capi-kairos-bootstrap
    cluster.x-k8s.io/provider: bootstrap-kairos-io
  name: capi-kairos-bootstrap-controller-manager
  namespace: capi-kairos-bootstrap-system
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: bootstrap-kairos-io
      control-plane: controller-manager
  template:
    metadata:
      labels:
        cluster.x-k8s.io/provider: bootstrap-kairos-io
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        - --controllers=bootstrap
        command:
        - /manager
        image: ghcr.io/cozystack/cozystack/cluster-api-provider-kairos:v0.2.1-cozystack.0@sha256:f46e4d94647aa7545a4009be40ce46f79945c3d13d98791de06d1e236d747415
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      securityContext:
        runAsNonRoot: true
      serviceAccountName: capi-kairos-bootstrap-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: capi-kairos-bootstrap-webhook-server-cert
