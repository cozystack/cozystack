---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    helm.sh/resource-policy: keep
  name: gpuclaims.gpu.cozystack.io
spec:
  group: gpu.cozystack.io
  names:
    kind: GPUClaim
    listKind: GPUClaimList
    plural: gpuclaims
    singular: gpuclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.className
      name: Class
      type: string
    - jsonPath: .spec.count
      name: Count
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .status.attachedTo.vmi
      name: VMI
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GPUClaim is a tenant's GPU, or a set of GPUs of one class used together
          on one node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'GPUClaimSpec is immutable: a change is a new order.'
            properties:
              className:
                description: ClassName is the GPUClass the claim is ordered against.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              count:
                description: Count is the number of GPUs of the class, always on one
                  node.
                format: int32
                minimum: 1
                type: integer
            required:
            - className
            - count
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; order a new GPUClaim instead
              rule: self == oldSelf
          status:
            description: |-
              GPUClaimStatus is written by the controller and the admission webhook;
              tenants cannot write it.
            properties:
              attachedTo:
                description: GPUClaimAttachment names the VMI a claim is attached
                  to.
                properties:
                  vmi:
                    description: |-
                      VMI is the name of the VirtualMachineInstance in the claim's namespace.
                      For a held claim it is recorded at admission, before the VMI exists.
                    minLength: 1
                    type: string
                required:
                - vmi
                type: object
              boundAt:
                description: BoundAt is when the claim was last bound to a node.
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodeName:
                description: NodeName is the node the claim holds its units on.
                type: string
              phase:
                description: |-
                  GPUClaimPhase decides what a claim holds and costs: a Bound or Attached
                  claim holds units on its node, and a Lost one still counts against
                  budgets.
                enum:
                - Pending
                - Bound
                - Attached
                - Lost
                type: string
              rejectedNodes:
                description: RejectedNodes are not picked for the claim's set until
                  their Until.
                items:
                  description: |-
                    RejectedNode is a node that refused the launcher pod of the claim's set
                    after the controller pinned it there.
                  properties:
                    nodeName:
                      minLength: 1
                      type: string
                    reason:
                      description: Reason is the scheduler's message for the refusal.
                      type: string
                    until:
                      description: |-
                        Until is when the node may be picked for the set again, unless the
                        node changes first.
                      format: date-time
                      type: string
                  required:
                  - nodeName
                  - until
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - nodeName
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .status.nodeName
    served: true
    storage: true
    subresources:
      status: {}
