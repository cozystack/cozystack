---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    helm.sh/resource-policy: keep
  name: gpudevices.gpu.cozystack.io
spec:
  group: gpu.cozystack.io
  names:
    kind: GPUDevice
    listKind: GPUDeviceList
    plural: gpudevices
    singular: gpudevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.className
      name: Class
      type: string
    - jsonPath: .spec.count
      name: Count
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .status.attachedTo.vmi
      name: VMI
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GPUDevice is a tenant's GPU, or a set of GPUs of one class used together
          on one node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'GPUDeviceSpec is immutable: a change is a new order.'
            properties:
              className:
                description: ClassName is the GPUClass the device is ordered against.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              count:
                description: Count is the number of GPUs of the class, always on one
                  node.
                format: int32
                minimum: 1
                type: integer
            required:
            - className
            - count
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; order a new GPUDevice instead
              rule: self == oldSelf
          status:
            description: |-
              GPUDeviceStatus is written by the controller and the admission webhook;
              tenants cannot write it.
            properties:
              attachedTo:
                description: GPUDeviceAttachment names the VMI a device is attached
                  to.
                properties:
                  vmi:
                    description: |-
                      VMI is the name of the VirtualMachineInstance in the device's namespace.
                      It is recorded at admission, before the VMI exists.
                    minLength: 1
                    type: string
                required:
                - vmi
                type: object
              bindRequest:
                description: |-
                  BindRequest asks the binder to place a set of devices onto one node. The
                  admission webhook writes ID, VMI and Devices; the binder writes Result and
                  Message. internal/gpu/doc.go carries the full contract.
                properties:
                  devices:
                    description: |-
                      Devices names every device of the set, in the device's namespace,
                      this one included.
                    items:
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  id:
                    description: ID is shared by every device of one request and is
                      unique per request.
                    minLength: 1
                    type: string
                  message:
                    description: Message explains a refusal and names each device
                      and its node.
                    type: string
                  requestedAt:
                    description: RequestedAt lets the controller expire a request
                      whose VMI never appears.
                    format: date-time
                    type: string
                  result:
                    description: BindResult is the binder's answer to a BindRequest.
                    enum:
                    - Succeeded
                    - Refused
                    type: string
                  vmi:
                    description: VMI is the VirtualMachineInstance the set is gathered
                      for.
                    minLength: 1
                    type: string
                required:
                - devices
                - id
                - requestedAt
                - vmi
                type: object
              boundAt:
                description: BoundAt is when the device was last bound to a node.
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodeName:
                description: NodeName is the node the device holds its units on.
                type: string
              phase:
                description: |-
                  GPUDevicePhase decides what a device holds and costs; the shared model
                  package carries the table.
                enum:
                - Pending
                - Bound
                - Attached
                - Lost
                type: string
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .status.nodeName
    served: true
    storage: true
    subresources:
      status: {}
