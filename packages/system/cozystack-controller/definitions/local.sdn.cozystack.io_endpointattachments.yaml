---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: endpointattachments.local.sdn.cozystack.io
spec:
  group: local.sdn.cozystack.io
  names:
    kind: EndpointAttachment
    listKind: EndpointAttachmentList
    plural: endpointattachments
    singular: endpointattachment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.applicationRef.name
      name: Application
      type: string
    - jsonPath: .spec.endpoint.serviceName
      name: Endpoint
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.addresses
      name: Addresses
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EndpointAttachment attaches an external address to one tenant-facing
          endpoint of one managed application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EndpointAttachmentSpec defines the desired state of EndpointAttachment.

              The mechanism is a union with loadBalancer as its only member today. A
              future member is added by extending the list in the exactly-one rule.
            properties:
              applicationRef:
                description: ApplicationRef names the application in this namespace.
                  Immutable.
                properties:
                  group:
                    default: apps.cozystack.io
                    description: Group of the application's API.
                    type: string
                  kind:
                    description: Kind of the application, e.g. Postgres.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the application instance in this namespace.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: applicationRef is immutable
                  rule: self == oldSelf
              endpoint:
                description: |-
                  Endpoint selects which tenant-facing Service of the application to
                  attach the address to.
                properties:
                  serviceName:
                    description: |-
                      ServiceName is a tenant-facing Service of the application, in the
                      attachment's namespace.
                    minLength: 1
                    type: string
                required:
                - serviceName
                type: object
              loadBalancer:
                description: |-
                  LoadBalancer attaches a dedicated address through an additive
                  LoadBalancer Service.
                properties:
                  allowICMP:
                    description: AllowICMP lets ICMP through in PortList mode.
                    type: boolean
                  claimName:
                    description: |-
                      ClaimName binds a pre-reserved IPAddressClaim in this namespace instead
                      of minting one. The claim outlives the attachment.
                    type: string
                  className:
                    description: |-
                      ClassName mints a fresh IPAddressClaim from this IPAddressClass. Empty
                      with no claimName mints from the default class.
                    type: string
                  family:
                    description: |-
                      Family is passed to a minted claim and validated against a referenced
                      one.
                    enum:
                    - IPv4
                    - IPv6
                    - Dual
                    type: string
                  method:
                    description: |-
                      Method selects a VM datapath mode. WholeIP renders 1:1 NAT of every
                      port to a single backend; PortList renders the listed ports.
                    enum:
                    - WholeIP
                    - PortList
                    type: string
                  ports:
                    description: |-
                      Ports is a subset of the endpoint's ports to publish. It is the only
                      port source when the endpoint has nothing meaningful to mirror (a VM's
                      sentinel-port Service).
                    items:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                type: object
                x-kubernetes-validations:
                - message: className and claimName are mutually exclusive
                  rule: '!(has(self.className) && has(self.claimName))'
                - message: className is immutable
                  rule: '(has(self.className) ? self.className : '''') == (has(oldSelf.className)
                    ? oldSelf.className : '''')'
                - message: claimName is immutable
                  rule: '(has(self.claimName) ? self.claimName : '''') == (has(oldSelf.claimName)
                    ? oldSelf.claimName : '''')'
                - message: family is immutable
                  rule: '(has(self.family) ? self.family : '''') == (has(oldSelf.family)
                    ? oldSelf.family : '''')'
                - message: allowICMP applies to method PortList only
                  rule: '!has(self.allowICMP) || (has(self.method) && self.method
                    == ''PortList'')'
                - message: method PortList requires ports
                  rule: '!(has(self.method) && self.method == ''PortList'') || (has(self.ports)
                    && size(self.ports) > 0)'
            required:
            - applicationRef
            - endpoint
            type: object
            x-kubernetes-validations:
            - message: exactly one mechanism member must be set
              rule: '[has(self.loadBalancer)].filter(m, m).size() == 1'
            - message: the mechanism member is immutable
              rule: has(self.loadBalancer) == has(oldSelf.loadBalancer)
          status:
            description: EndpointAttachmentStatus defines the observed state of EndpointAttachment.
            properties:
              addresses:
                description: Addresses mirrors the claim's bound addresses.
                items:
                  type: string
                type: array
              claimName:
                description: |-
                  ClaimName is the IPAddressClaim the rendered Service consumes, minted
                  or referenced.
                type: string
              conditions:
                description: Conditions follow metav1.Condition semantics.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: Phase summarises the conditions.
                enum:
                - Pending
                - Attached
                - Detached
                type: string
              serviceName:
                description: ServiceName is the rendered LoadBalancer Service.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
