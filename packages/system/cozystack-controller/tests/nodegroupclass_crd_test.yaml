suite: NodeGroupClass CRD
templates:
  - templates/crds/crds.yaml

# Uninstalling the release would otherwise delete the CRD and every class with
# it, and every pool on a hoster class would fail its next render. The
# annotation comes from the kubebuilder:metadata marker on the API type.
tests:
  - it: survives a release uninstall
    documentSelector:
      path: metadata.name
      value: nodegroupclasses.cozystack.io
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
