cozystackController:
  image: ghcr.io/cozystack/cozystack/cozystack-controller:v1.7.0-rc.1@sha256:a8dd6d74b79ac1339a512ecfac60c9aa4d9735a1e49644683c3abb7c7c7b1fea
  debug: false
  disableTelemetry: false
  # Base URL of a Prometheus-compatible query API to fetch SeaweedFS bucket
  # size metrics from, for deployments where SeaweedFS and the monitoring
  # stack that scrapes it run in a separate cluster. Empty keeps discovery
  # via the namespace.cozystack.io/monitoring label.
  seaweedfsMetricsEndpoint: ""
  # Raising this gives the reconciliation loop a standby, not a second writer:
  # the chart always passes --leader-elect, so exactly one manager holds the
  # Lease and runs the reconcilers. With the default of 1 the extra Lease is
  # the only difference from the previous hardcoded value.
  replicas: 1
  # Empty by default: no resources block is rendered, so requests and limits are
  # opt-in. Idle usage (measured) is ~69Mi — keep a limit above that.
  resources: {}
