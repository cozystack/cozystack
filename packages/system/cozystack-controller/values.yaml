cozystackController:
  image: ghcr.io/cozystack/cozystack/cozystack-controller:v1.6.0@sha256:b01f6fe6e8fe6426b112fbda2b4abac946b4e45cd118137c9001c9e6ee784b3d
  debug: false
  disableTelemetry: false
  # Base URL of a Prometheus-compatible query API to fetch SeaweedFS bucket
  # size metrics from, for deployments where SeaweedFS and the monitoring
  # stack that scrapes it run in a separate cluster. Empty keeps discovery
  # via the namespace.cozystack.io/monitoring label.
  seaweedfsMetricsEndpoint: ""
  # EndpointAttachment rendering.
  endpointAttachments:
    # Declares that a service proxy answering to the cozy-proxy
    # service-proxy-name is deployed, so attachments may render
    # method: WholeIP|PortList Services. The platform sets it wherever it
    # deploys cozy-proxy. Left false, such attachments render no Service
    # and report DatapathContractUnavailable instead of attracting an
    # address nothing would serve.
    cozyProxyContractImplemented: false
    # Allocate node ports on rendered LoadBalancer Services. Off unless the
    # load balancer forwards through node ports (Hetzner RobotLB), matching
    # the cozy-lib convention the charts follow.
    allocateLoadBalancerNodePorts: false
