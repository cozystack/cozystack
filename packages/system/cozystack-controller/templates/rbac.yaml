kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cozystack-controller
rules:
- apiGroups: ['cozystack.io', 'gateway.cozystack.io']
  resources: ['*']
  verbs: ['*']
# TenantGatewayReconciler renders Gateway / HTTPRoute / TLSRoute and
# reads back their status to populate TenantGateway.Status.
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "httproutes", "tlsroutes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "httproutes/status", "tlsroutes/status"]
  verbs: ["get", "update", "patch"]
# Read-only, to report a class whose supportedFeatures leave out a
# route kind the tenant Gateway renders listeners for.
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gatewayclasses"]
  verbs: ["get", "list", "watch"]
# TenantGatewayReconciler renders the per-tenant Issuer and the
# wildcard / per-listener Certificates the Gateway listeners reference.
- apiGroups: ["cert-manager.io"]
  resources: ["issuers", "certificates"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# TenantLogRoutingReconciler patches the forced-upgrade request annotations on
# cozy-monitoring/monitoring-agents when a namespace monitoring label changes.
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["get", "list", "watch", "patch", "update"]
# TapMaterializerReconciler manages the finalizer and materialized-revision
# annotation on a community tap's OCIRepository. Read (get/list/watch) is
# covered by the catch-all rule below; the update/patch it needs are scoped to a
# namespaced Role in cozy-system (see tap-source-role.yaml), since the
# materializer only ever touches tap sources there. PackageSource writes it
# performs are already covered by the cozystack.io:*/* rule above.
# CACertReconciler reconciles TenantProjection sentinels a chart renders and
# writes their Ready status. It never creates or deletes a sentinel; that is
# the chart's (helm-controller's) job. No tenant role grants any verb on
# internal.cozystack.io, which is what keeps sentinels out of tenant reach.
- apiGroups: ["internal.cozystack.io"]
  resources: ["tenantprojections"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["internal.cozystack.io"]
  resources: ["tenantprojections/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "patch", "update"]
# TenantQuotaReconciler manages the per-namespace "tenant-quota-allocated"
# ResourceQuota that enforces each tenant's share of its parent pool, and emits
# events on the tenant namespace when sub-tenant quotas overcommit the budget.
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Two reconcilers share this one Secret write grant on the platform controller's
# own ServiceAccount; it widens no tenant's RBAC. WildcardSecretReconciler
# replicates the operator wildcard TLS Secret into each tenant namespace;
# CACertReconciler writes — and withdraws — the key-free "<release>.tenant-ca"
# projection, deleting only a projection it owns by owner reference, never a
# foreign Secret. Read was already covered by the catch-all rule below;
# create/update/patch/delete are the new grants.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# The GPU binder adds finalizers and places claims. The create right is for
# the template claims made for a VMI's claimTemplate entries, which the
# controller deletes with their VMI.
- apiGroups: ["gpu.cozystack.io"]
  resources: ["gpuclasses", "gpuclaims"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: ["gpu.cozystack.io"]
  resources: ["gpuclaims"]
  verbs: ["create", "delete"]
- apiGroups: ["gpu.cozystack.io"]
  resources: ["gpuclasses/status", "gpuclaims/status", "gpunodes/status"]
  verbs: ["get", "update", "patch"]
# The GPU controller releases a gated virt-launcher pod by pinning it to the
# node of its claims and removing the gate in one update, and deletes a
# pinned launcher pod its node refuses, since a pin cannot be undone. RBAC
# cannot narrow this to launcher pods; the reads come from the rule below.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["update", "delete"]
# The GPU controller reports on a VMI why its launcher pod stays gated.
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
# The GPU controller deletes the unscheduled VMI of a claim that has to
# leave its node once the VMI's pod is pinned, so the claim becomes
# unattached and can move; a VMI whose pod is still gated is left alone.
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachineinstances"]
  verbs: ["delete"]
# --metrics-secure authenticates and authorizes each scrape through the API
# server.
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
# Leader election (--leader-elect) is granted by a namespaced Role in cozy-system
# (see leader-election-role.yaml): the Lease lives in the controller's own
# namespace, so the write does not need to reach every namespace.
- apiGroups: ['*']
  resources: ['*']
  verbs: ["get", "list", "watch"]
---
# The GPU controller writes one ConfigMap, the GPU settings in cozy-system.
# create cannot be scoped by name, so it is scoped by namespace instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cozystack-controller-gpu-settings
  namespace: cozy-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["cozystack-gpu-settings"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cozystack-controller-gpu-settings
  namespace: cozy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cozystack-controller-gpu-settings
subjects:
- kind: ServiceAccount
  name: cozystack-controller
  namespace: cozy-system
