# The tap materializer updates a community tap's OCIRepository (its finalizer and
# materialized-revision annotation), but only ever in cozy-system. Keep those
# write verbs in a namespaced Role here rather than granting them cluster-wide;
# get/list/watch stay cluster-wide (the catch-all rule in rbac.yaml) for the
# controller-runtime informer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cozystack-controller-tap-sources
  namespace: cozy-system
rules:
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources: ["ocirepositories"]
  verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cozystack-controller-tap-sources
  namespace: cozy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cozystack-controller-tap-sources
subjects:
- kind: ServiceAccount
  name: cozystack-controller
  namespace: cozy-system
