suite: fluent-bit routes tenant logs to the tenant VictoriaLogs

# fluent-bit ships every container log to the root VictoriaLogs. A tenant
# that runs its own Monitoring application gets a VictoriaLogs of its own that
# would otherwise receive nothing. The routes are discovered from the
# namespace.cozystack.io/monitoring label the tenant chart stamps on every
# tenant namespace (its value names the tenant whose Monitoring collects the
# namespace): each routed namespace gets a rewrite_tag filter that re-emits its
# records under tenant.<namespace>.* (keeping the original, so the root still
# sees them) and one HTTP output shipping the copy to that tenant's vlinsert.
# `fluent-bit.tenantLogRouting` overrides or adds routes explicitly.

release:
  name: monitoring-agents
  namespace: cozy-monitoring

set:
  global:
    target: tenant-root

templates:
  - charts/fluent-bit/templates/configmap.yaml

kubernetesProvider:
  scheme:
    "v1/Namespace":
      gvr:
        group: ""
        version: v1
        resource: namespaces
      namespaced: false
  objects:
    # a tenant with its own Monitoring
    - kind: Namespace
      apiVersion: v1
      metadata:
        name: tenant-a
        labels:
          namespace.cozystack.io/monitoring: tenant-a
    # its sub-tenant without one: collected by the parent
    - kind: Namespace
      apiVersion: v1
      metadata:
        name: tenant-a-child
        labels:
          namespace.cozystack.io/monitoring: tenant-a
    # a tenant collected by the root Monitoring: nothing to add
    - kind: Namespace
      apiVersion: v1
      metadata:
        name: tenant-b
        labels:
          namespace.cozystack.io/monitoring: tenant-root
    # a namespace the tenant chart never labelled
    - kind: Namespace
      apiVersion: v1
      metadata:
        name: kube-system

tests:
  - it: routes every namespace labelled with a tenant Monitoring to that tenant's vlinsert
    asserts:
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '\[FILTER\]\n\s+Name rewrite_tag\n\s+Match kube\.\*\n\s+Rule \$kubernetes_namespace_name \^tenant-a\$ tenant\.tenant-a\.\$TAG true'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '\[OUTPUT\]\n\s+Name http\n\s+Match tenant\.tenant-a\.\*\n\s+Host vlinsert-generic\.tenant-a\.svc\n\s+port 9481\n'
      # the sub-tenant is shipped to its parent's store under its own tag
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Rule \$kubernetes_namespace_name \^tenant-a-child\$ tenant\.tenant-a-child\.\$TAG true'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.tenant-a-child\.\*\n\s+Host vlinsert-generic\.tenant-a\.svc\n'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.tenant-a\.\*\n(.*\n){2,6}\s+Retry_Limit 5\n'

  - it: leaves namespaces collected by the root, and unlabelled ones, to the root output alone
    asserts:
      - notMatchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'tenant-b'
      - notMatchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'kube-system'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match kube\.\*\n\s+Host vlinsert-generic\.tenant-root\.svc'

  - it: the explicit list overrides a discovered route and adds any other
    set:
      fluent-bit:
        tenantLogRouting:
          - namespace: tenant-a
            host: vlinsert-custom.tenant-a.svc
            port: 9999
          - namespace: tenant-c
    asserts:
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.tenant-a\.\*\n\s+Host vlinsert-custom\.tenant-a\.svc\n\s+port 9999\n'
      - notMatchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.tenant-a\.\*\n\s+Host vlinsert-generic\.tenant-a\.svc'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.tenant-c\.\*\n\s+Host vlinsert-generic\.tenant-c\.svc\n\s+port 9481\n'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Rule \$kubernetes_namespace_name \^tenant-a-child\$ tenant\.tenant-a-child\.\$TAG true'
