suite: fluent-bit routes tenant logs to the tenant VictoriaLogs

# fluent-bit ships every container log to the root VictoriaLogs. A tenant
# that runs its own Monitoring application gets a VictoriaLogs of its own that
# receives nothing. `fluent-bit.tenantLogRouting` fixes that per namespace: a
# rewrite_tag filter re-emits the records of the namespace under
# tenant.<namespace>.* (keeping the original, so the root still sees them) and
# one HTTP output per entry ships the copy to the tenant's vlinsert.
release:
  name: monitoring-agents
  namespace: cozy-monitoring
templates:
  - charts/fluent-bit/templates/configmap.yaml
tests:
  - it: renders no tenant routing by default
    asserts:
      - notMatchRegex:
          path: data["fluent-bit.conf"]
          pattern: rewrite_tag
      - notMatchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match kube\.\*\n\s+Host vlinsert-generic\.cozy-monitoring\.svc'

  - it: one entry adds a rewrite_tag filter and an output to the tenant vlinsert, root keeps everything
    set:
      fluent-bit:
        tenantLogRouting:
          - namespace: tenant-example
    asserts:
      # the copy: re-tagged from the namespace field, original record kept
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '\[FILTER\]\n\s+Name rewrite_tag\n\s+Match kube\.\*\n\s+Rule \$kubernetes_namespace_name \^tenant-example\$ tenant\.tenant-example\.\$TAG true'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '\[FILTER\]\n\s+Name modify\n\s+Match tenant\.tenant-example\.\*\n\s+Set tenant tenant-example'
      # the tenant output, defaulting to the tenant's own vlinsert
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: '\[OUTPUT\]\n\s+Name http\n\s+Match tenant\.tenant-example\.\*\n\s+Host vlinsert-generic\.tenant-example\.svc\n\s+port 9481\n'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.tenant-example\.\*\n(.*\n){2}.*\n\s+uri /insert/jsonline\?_stream_fields=log_source,stream,kubernetes_pod_name,kubernetes_container_name,kubernetes_namespace_name&_msg_field=log&_time_field=date'
      # the root output is untouched and still matches every container log
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match kube\.\*\n\s+Host vlinsert-generic\.cozy-monitoring\.svc'

  - it: host and port can be overridden per entry, and entries are independent
    set:
      fluent-bit:
        tenantLogRouting:
          - namespace: tenant-a
            host: vlinsert-custom.tenant-a.svc
            port: 9999
          - namespace: tenant-b
    asserts:
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.tenant-a\.\*\n\s+Host vlinsert-custom\.tenant-a\.svc\n\s+port 9999\n'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Match tenant\.tenant-b\.\*\n\s+Host vlinsert-generic\.tenant-b\.svc\n\s+port 9481\n'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Rule \$kubernetes_namespace_name \^tenant-a\$ tenant\.tenant-a\.\$TAG true'
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Rule \$kubernetes_namespace_name \^tenant-b\$ tenant\.tenant-b\.\$TAG true'
