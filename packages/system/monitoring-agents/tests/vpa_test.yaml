suite: the VPA is recorded only when its CRD is served

# A release manifest that records a VPA whose CRD is gone cannot be built, and
# the uninstall fails on it.
release:
  name: cozy-monitoring-agents
  namespace: cozy-monitoring
templates:
  - templates/vpa.yaml
tests:
  - it: the VPA is rendered when its CRD is served
    capabilities:
      apiVersions:
        - autoscaling.k8s.io/v1/VerticalPodAutoscaler
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: VerticalPodAutoscaler

  - it: the VPA stays out of the release manifest when its CRD is not served
    asserts:
      - hasDocuments:
          count: 0
