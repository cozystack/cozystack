{{- define "monitoring-agents.vmagent.defaultExtraArgs" }}
promscrape.streamParse: "true"
promscrape.maxScrapeSize: 32MB
{{- end }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: vmagent
spec:
  shardCount: 1
  externalLabels:
    cluster: {{ .Values.vmagent.externalLabels.cluster }}
    tenant: {{ .Values.global.target }}
  extraArgs:
    {{- toYaml (deepCopy .Values.vmagent.extraArgs | mergeOverwrite (fromYaml (include "monitoring-agents.vmagent.defaultExtraArgs" .))) | nindent 4 }}
  remoteWrite:
  {{- range .Values.vmagent.remoteWrite.urls }}
  - url: {{ tpl . $ | quote }}
  {{- end }}

  scrapeInterval: 30s
  selectAllByDefault: true
  # The target always carries all three identity labels, "-" when the pod
  # has no lineage ("-" is not a valid Kubernetes label value, so it never
  # collides with a real one). That makes every exporter-supplied copy
  # collide and be renamed to exported_* (honorLabels false), where it is
  # dropped; the placeholder itself is removed before storage.
  scrapeClasses:
  - name: application-identity
    default: true
    relabelConfigs:
    {{- range list "group" "kind" "name" }}
    - targetLabel: apps_cozystack_io_application_{{ . }}
      replacement: "-"
    - sourceLabels: [__meta_kubernetes_pod_label_apps_cozystack_io_application_{{ . }}]
      regex: (.+)
      targetLabel: apps_cozystack_io_application_{{ . }}
    {{- end }}
    metricRelabelConfigs:
    - action: labeldrop
      regex: (exported_)+apps_cozystack_io_application_(group|kind|name)
    {{- range list "group" "kind" "name" }}
    - sourceLabels: [apps_cozystack_io_application_{{ . }}]
      regex: "-"
      targetLabel: apps_cozystack_io_application_{{ . }}
      replacement: ""
    {{- end }}
  additionalScrapeConfigs:
    name: additional-scrape-configs
    key: prometheus-additional.yaml
  resources: {}
  configReloaderResources: {}
  #statefulMode: true
  #statefulStorage:
  #  volumeClaimTemplate:
  #    spec:
  #      resources:
  #          requests:
  #            storage: 20Gi
