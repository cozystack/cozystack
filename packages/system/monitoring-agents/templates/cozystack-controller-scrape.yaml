{{- if (.Values.gpu).enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cozystack-controller
  namespace: cozy-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cozystack-controller
  namespaceSelector:
    matchNames:
    - cozy-system
  endpoints:
  - port: metrics
    scheme: https
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    # The controller serves metrics on a self-signed certificate.
    tlsConfig:
      insecureSkipVerify: true
    relabelConfigs:
    - action: labeldrop
      regex: (endpoint|pod|container)
    - replacement: cozystack-controller
      targetLabel: job
    - targetLabel: tier
      replacement: cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cozystack-controller-metrics-reader
rules:
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cozystack-controller-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cozystack-controller-metrics-reader
subjects:
- kind: ServiceAccount
  name: vmagent-vmagent
  namespace: cozy-monitoring
{{- end }}
