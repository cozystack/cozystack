apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: alerts-cozystack-credentials
spec:
  groups:
  - name: cozystack-credentials
    params: {}
    rules:
    - alert: CredentialsMigrationIncomplete
      annotations:
        description: The credentials conversion recorded in ConfigMap {{ $labels.namespace
          }}/{{ $labels.configmap }} left one or more releases unconverted, so their
          tenant passwords may still be readable through the old <release>-credentials
          Secret until the conversion is finished. Read the credentials-migration state
          ConfigMap in cozy-system for the releases left out and the finish Job's log
          for why, fix the cause, then delete the Job and re-apply its manifest from
          the migration. This alert clears when the next finish run leaves none out.
        summary: A credentials conversion left releases with tenant-readable passwords.
      expr: kube_configmap_labels{job="kube-state-metrics", namespace="cozy-system", configmap=~"credentials-migration-.+", label_credentials_cozystack_io_incomplete="true"}  > 0
      for: 15m
      labels:
        severity: warning
        exported_instance: '{{ $labels.namespace }}/{{ $labels.configmap }}'
        service: cozystack-credentials
