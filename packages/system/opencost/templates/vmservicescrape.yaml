apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: opencost
spec:
  endpoints:
    - port: http
      path: /metrics
      # Cost metrics carry the namespace/pod of the measured workload, not of
      # the exporter; without honorLabels they all collapse onto cozy-opencost.
      honorLabels: true
  selector:
    matchLabels:
      app.kubernetes.io/instance: opencost
