apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cozy:observability-proxy
rules:
# Every request is authenticated and authorized against the API server.
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
# Maps an application plural in the path to its Kind.
- apiGroups: ["cozystack.io"]
  resources: ["applicationdefinitions"]
  verbs: ["get", "list", "watch"]
# The namespace.cozystack.io/monitoring label names the logs store.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cozy:observability-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cozy:observability-proxy
subjects:
- kind: ServiceAccount
  name: observability-proxy
  namespace: {{ .Release.Namespace }}
