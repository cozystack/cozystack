{{- $clusterDomain := index (.Values._cluster | default dict) "cluster-domain" | default "cozy.local" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-proxy
  labels:
    app.kubernetes.io/name: observability-proxy
spec:
  replicas: {{ .Values.observabilityProxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-proxy
    spec:
      serviceAccountName: observability-proxy
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: observability-proxy
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: observability-proxy
        image: {{ .Values.observabilityProxy.image | quote }}
        args:
        - --listen-address=:8080
        - --probe-address=:8081
        - --cluster-domain={{ $clusterDomain }}
        - --root-tenant={{ .Values.observabilityProxy.rootTenant }}
        - --auth-cache-ttl={{ .Values.observabilityProxy.authCacheTTL }}
        - --metrics-shortterm-store={{ .Values.observabilityProxy.metrics.shorttermStore }}
        - --metrics-longterm-store={{ .Values.observabilityProxy.metrics.longtermStore }}
        - --metrics-shortterm-retention={{ .Values.observabilityProxy.metrics.shorttermRetention }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: probes
          containerPort: 8081
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        {{- with .Values.observabilityProxy.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
