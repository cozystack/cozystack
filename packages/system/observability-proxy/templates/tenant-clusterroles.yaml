# Aggregated into cozy-tenant-view (and consequently use, admin, super-admin).
# No API server serves cozystack.io logs or metrics: the rule exists only for
# the SubjectAccessReview the observability proxy asks before it answers a
# read under /apis/cozystack.io/v1alpha1/namespaces/<ns>/{logs,metrics}/.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cozy:observability:view
  labels:
    rbac.cozystack.io/aggregate-to-tenant-view: "true"
rules:
- apiGroups: ["cozystack.io"]
  resources: ["logs", "metrics"]
  verbs: ["list"]
