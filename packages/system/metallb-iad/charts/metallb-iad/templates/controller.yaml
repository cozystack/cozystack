{{- /* The ClusterRole lives in templates/role.yaml, GENERATED by controller-gen
       from the +kubebuilder:rbac markers (make manifests). Everything
       deployment-shaped is hand-written here. */ -}}
{{- if ne (include "metallb-iad.placeholderNamespace" .) .Release.Namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "metallb-iad.placeholderNamespace" . }}
  labels:
    {{- include "metallb-iad.labels" . | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metallb-iad
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metallb-iad.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metallb-iad
  labels:
    {{- include "metallb-iad.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metallb-iad
subjects:
  - kind: ServiceAccount
    name: metallb-iad
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metallb-iad
  namespace: {{ .Release.Namespace }}
  labels:
    app: metallb-iad
    {{- include "metallb-iad.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app: metallb-iad
  template:
    metadata:
      labels:
        app: metallb-iad
    spec:
      serviceAccountName: metallb-iad
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "metallb-iad.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: driver
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --metallb-namespace={{ .Values.metallbNamespace }}
            - --placeholder-namespace={{ include "metallb-iad.placeholderNamespace" . }}
            - --leader-elect={{ .Values.controller.leaderElect }}
            - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
            - --health-probe-bind-address=:8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
