suite: Grafana may reach the plugin server on its own

# Grafana exits when a plugin download fails, so a pod that cannot reach the
# grafana-dashboards server in cozy-grafana-operator never becomes Ready and
# the Deployment rollout stalls with the old ReplicaSet still serving. The
# chart carries its own egress rule for its Grafana pods so it does not depend
# on the tenant chart shipping one.

release:
  name: monitoring-system
  namespace: tenant-test

templates:
  - templates/grafana/networkpolicy.yaml

tests:
  - it: opens egress from the Grafana pods to the plugin server only
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: spec.endpointSelector.matchLabels
          value:
            app: grafana
      - equal:
          path: spec.egress[0].toEndpoints[0].matchLabels
          value:
            k8s:io.kubernetes.pod.namespace: cozy-grafana-operator
            k8s:app.kubernetes.io/name: grafana-dashboards
      - equal:
          path: spec.egress[0].toPorts[0].ports[0].port
          value: "8080"
