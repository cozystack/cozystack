suite: alerta is given its own signing key and admin login, decoupled from Grafana
templates:
  - templates/alerta/alerta.yaml

release:
  name: monitoring
  namespace: tenant-root

set:
  _cluster:
    issuer-name: letsencrypt-prod
    solver: http01
    gateway-enabled: "false"
  _namespace:
    host: example.org
    ingress: tenant-root

tests:
  - it: renders a 64-char SECRET_KEY for Alerta into a mounted alertad.conf
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: alerta
      - isNotNullOrEmpty:
          path: data.secret-key
      - notExists:
          path: stringData
      - notExists:
          path: data.admin-password

  - it: keeps Alerta's login in its own Secret, apart from the signing key
    documentSelector:
      path: metadata.name
      value: alerta-admin-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.user
          value: YWRtaW4=
      - isNotNullOrEmpty:
          path: data.password
      - notExists:
          path: data.secret-key
      - notExists:
          path: data.alerta-api-key

  - it: mounts the server config so Alerta reads the generated key at runtime
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: alerta-server-config
            mountPath: /app/alertad.conf
            subPath: alertad.conf
      - contains:
          path: spec.template.spec.volumes
          content:
            name: alerta-server-config
            secret:
              secretName: alerta
              items:
                - key: alertad.conf
                  path: alertad.conf

  - it: gives Alerta its own admin login instead of reusing Grafana's
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: alerta-admin-password
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_USERS
            valueFrom:
              secretKeyRef:
                name: alerta-admin-password
                key: user
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin-password
                key: password
