suite: alerta is given its own signing key and admin password, decoupled from Grafana
templates:
  - templates/alerta/alerta.yaml

release:
  name: monitoring
  namespace: tenant-root

set:
  _cluster:
    issuer-name: letsencrypt-prod
    solver: http01
    gateway-enabled: "false"
  _namespace:
    host: example.org
    ingress: tenant-root

tests:
  - it: renders a 64-char SECRET_KEY for Alerta into a mounted alertad.conf
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: alerta
      - matchRegex:
          path: stringData["alertad.conf"]
          pattern: 'SECRET_KEY = "[A-Za-z0-9]{64}"'

  - it: persists the signing key and admin password in the alerta Secret
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: alerta
      - isNotNullOrEmpty:
          path: data.secret-key
      - isNotNullOrEmpty:
          path: data.admin-password

  - it: mounts the server config so Alerta reads the generated key at runtime
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: alerta-server-config
            mountPath: /app/alertad.conf
            subPath: alertad.conf
      - contains:
          path: spec.template.spec.volumes
          content:
            name: alerta-server-config
            secret:
              secretName: alerta
              items:
                - key: alertad.conf
                  path: alertad.conf

  - it: gives Alerta its own admin password instead of reusing Grafana's
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: alerta
                key: admin-password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin-password
                key: password
