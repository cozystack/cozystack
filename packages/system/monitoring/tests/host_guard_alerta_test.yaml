suite: alerta guards an empty apex in isolation
templates:
  - templates/alerta/alerta.yaml

release:
  name: monitoring
  namespace: tenant-root

tests:
  - it: fails when _namespace is injected with an empty host and no host override
    set:
      _namespace:
        host: ""
        ingress: tenant-root
      _cluster:
        issuer-name: letsencrypt-prod
        solver: http01
        gateway-enabled: "false"
    asserts:
      - failedTemplate:
          errorMessage: "the tenant apex (_namespace.host) is empty and this app sets no host override, so its ingress hostname would be malformed. Set tenant.spec.host on this tenant, inherit it from a parent that has host set, or set this app's host value."

  - it: renders the alerta ingress host from the apex when it is set
    set:
      _namespace:
        host: example.org
        ingress: tenant-root
      _cluster:
        issuer-name: letsencrypt-prod
        solver: http01
        gateway-enabled: "false"
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules[0].host
          value: alerta.example.org
