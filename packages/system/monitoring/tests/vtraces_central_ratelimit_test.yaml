suite: shared-central tracing holds each tenant to a write rate
# A store sharing one disk among tenants is protected by its disk cap only as
# long as no tenant writes faster than the cap can absorb: VictoriaTraces always
# keeps the last two days, so a tenant that fills the cap within two days fills
# the disk for all of them. The platform sets the rate, it reaches every tenant
# in _cluster, and each central tenant's collector enforces it.
templates:
  - templates/vtraces/collector.yaml

release:
  name: monitoring
  namespace: tenant-foo

tests:
  - it: limits a central tenant's collector to the rate the platform sets
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "100000"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^  ratelimit/tenant:\\n    strategy: bytes\\n    rate: 100000\\n    burst: 4194304\\n    throttle_behavior: error$"
      # Before batch: the batch processor sends asynchronously, so a refusal
      # behind it would never reach the application and its spans would be
      # dropped without the sender knowing.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors: \\[memory_limiter, resource/tenant, probabilistic_sampler, ratelimit/tenant, batch\\]"

  - it: splits the tenant rate across collector replicas
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "100000"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 3
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 33334$"

  # A request larger than burst can never pass the limiter, so burst never
  # drops below what one second of the rate needs.
  - it: raises burst to one second of a rate above 4 MiB per second
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "200000000"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 200000000\\n    burst: 200000000$"

  # Without a rate from the platform, and on one that is not a positive number,
  # the collector holds the tenant to the default: floor(2 vtstorage replicas *
  # 80% of a 10Gi volume / 172800 s), never to no limit.
  - it: falls back to the default rate when the platform sets none
    template: templates/vtraces/collector.yaml
    set:
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 99420$"

  - it: falls back to the default rate on a value that is not a positive number
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "fast"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 99420$"

  - it: falls back to the default rate on 0
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "0"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 99420$"

  - it: falls back to the default rate on -1
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "-1"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 99420$"

  # The limiter sees requests the receiver admits, so the receiver caps them at
  # the 4 MiB burst floor, decompressed for HTTP; a larger request would never
  # pass the limiter, and a larger floor would be what each new pod lets
  # through above the rate.
  - it: caps a central collector's requests at the burst floor
    template: templates/vtraces/collector.yaml
    set:
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^      grpc:\\n        endpoint: 0\\.0\\.0\\.0:4317\\n        max_recv_msg_size_mib: 4$"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^      http:\\n        endpoint: 0\\.0\\.0\\.0:4318\\n        max_request_body_size: 4194304$"

  - it: leaves a local collector's request size at the receiver defaults
    template: templates/vtraces/collector.yaml
    set:
      tracingStorages:
        - name: generic
          mode: cluster
          storage: 10Gi
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "max_recv_msg_size_mib|max_request_body_size"

  - it: sets no rate limit on a collector writing to its own store
    template: templates/vtraces/collector.yaml
    set:
      tracingStorages:
        - name: generic
          mode: cluster
          storage: 10Gi
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "ratelimit"
