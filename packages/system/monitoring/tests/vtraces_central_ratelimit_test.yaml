suite: shared-central tracing holds each tenant to a write rate
# A store sharing one disk among tenants is protected by its disk cap only as
# long as no tenant writes faster than the cap can absorb: VictoriaTraces always
# keeps the last two days, so a tenant that fills the cap within two days fills
# the disk for all of them. The platform sets the rate, it reaches every tenant
# in _cluster, and each central tenant's collector enforces it.
templates:
  - templates/vtraces/collector.yaml
  - templates/vtraces/vmauth.yaml

release:
  name: monitoring
  namespace: tenant-foo

tests:
  - it: limits a central tenant's collector to the rate the platform sets
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "100000"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^  ratelimit/tenant:\\n    strategy: bytes\\n    rate: 100000\\n    burst: 67108864\\n    throttle_behavior: error$"
      # Before batch: the batch processor sends asynchronously, so a refusal
      # behind it would never reach the application and its spans would be
      # dropped without the sender knowing.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "processors: \\[memory_limiter, resource/tenant, probabilistic_sampler, ratelimit/tenant, batch\\]"

  - it: splits the tenant rate across collector replicas
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "100000"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 3
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 33334$"

  # A request larger than burst can never pass the limiter, so burst never
  # drops below what one second of the rate needs.
  - it: raises burst to one second of a rate above 64 MiB per second
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "200000000"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 200000000\\n    burst: 200000000$"

  # Without a rate from the platform, and on one that is not a positive number,
  # the collector holds the tenant to the default: floor(2 vtstorage replicas *
  # 80% of a 10Gi volume / 172800 s), never to no limit.
  - it: falls back to the default rate when the platform sets none
    template: templates/vtraces/collector.yaml
    set:
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 99420$"

  - it: falls back to the default rate on a value that is not a positive number
    template: templates/vtraces/collector.yaml
    set:
      _cluster:
        tracing-central-tenant-bytes-per-second: "fast"
      _namespace:
        tracingCentral: true
      tracingCollector:
        replicas: 1
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    rate: 99420$"

  - it: sets no rate limit on a collector writing to its own store
    template: templates/vtraces/collector.yaml
    set:
      tracingStorages:
        - name: generic
          mode: cluster
          storage: 10Gi
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "ratelimit"

  # The rate used to be published on tenant-root's vmauth and read back with
  # lookup, which never re-renders an in-sync tenant release. Nothing may read
  # it from there any more.
  - it: publishes no rate on tenant-root's vmauth
    template: templates/vtraces/vmauth.yaml
    release:
      namespace: tenant-root
    set:
      tracingCentralHost: true
      tracingStorages:
        - name: generic
          mode: cluster
          storage: 10Gi
    asserts:
      - notExists:
          path: metadata.annotations["tracing.cozystack.io/tenant-bytes-per-second"]
