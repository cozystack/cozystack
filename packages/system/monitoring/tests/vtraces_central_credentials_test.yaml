suite: shared-central traces credentials
templates:
  - templates/vtraces/central-credentials.yaml

# The collector writes and Grafana reads through the tenant-root vmauth, each
# with a login of its own, so the one Grafana holds cannot write past the
# collector's rate limit. The chart owns them rather than the operator, which creates a
# VMUser's Secret only while some VMAuth selects that user: without a central
# store the collector would wait on a Secret that never appears.
release:
  name: monitoring
  namespace: tenant-foo

tests:
  - it: generates the credentials for a central tenant
    set:
      _namespace:
        tracingCentral: true
    documentIndex: 0
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: traces-central-credentials
      - equal:
          path: stringData.username
          value: tenant-foo
      # Random by design; only its presence is the contract.
      - matchRegex:
          path: stringData.password
          pattern: "^.+$"

  - it: generates a separate read-only login for Grafana
    set:
      _namespace:
        tracingCentral: true
    documentIndex: 1
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: traces-central-reader-credentials
      - equal:
          path: stringData.username
          value: tenant-foo.reader
      - matchRegex:
          path: stringData.password
          pattern: "^.+$"

  - it: preserves the existing password rather than rotating it
    set:
      _namespace:
        tracingCentral: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: traces-central-credentials
            namespace: tenant-foo
          data:
            # base64 of "tenant-foo" and "preserved-password"
            username: dGVuYW50LWZvbw==
            password: cHJlc2VydmVkLXBhc3N3b3Jk
    asserts:
      - documentIndex: 0
        equal:
          path: stringData.password
          value: preserved-password
      # Each login keeps its own password: the write password must never
      # reach the Secret Grafana reads.
      - documentIndex: 1
        notEqual:
          path: stringData.password
          value: preserved-password

  - it: preserves the read-only password rather than rotating it
    set:
      _namespace:
        tracingCentral: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: traces-central-reader-credentials
            namespace: tenant-foo
          data:
            # base64 of "tenant-foo.reader" and "preserved-reader"
            username: dGVuYW50LWZvby5yZWFkZXI=
            password: cHJlc2VydmVkLXJlYWRlcg==
    asserts:
      - documentIndex: 1
        equal:
          path: stringData.password
          value: preserved-reader
      - documentIndex: 0
        notEqual:
          path: stringData.password
          value: preserved-reader

  - it: renders no credentials outside central mode
    asserts:
      - hasDocuments:
          count: 0
