{{- $solver := (index .Values._cluster "solver") | default "http01" }}
{{- $clusterIssuer := (index .Values._cluster "issuer-name") | default "letsencrypt-prod" }}
{{- $ingress := .Values._namespace.ingress }}
{{- $host := .Values._namespace.host }}
{{- $exposeIngress := (index .Values._cluster "expose-ingress") | default "tenant-root" }}
{{- $gatewayEnabled := (index .Values._cluster "gateway-enabled") | default "false" }}
{{- $wildcardSecret := (index .Values._cluster "wildcard-secret-name") | default "" }}

{{- $email := ((.Values.alerta.alerts).email) | default dict }}
{{- $emailAlertnames := $email.alertnames | default list }}
{{- $emailSeverities := $email.severities | default (list "critical" "major") }}
{{- $emailPasswordSecret := "alertmanager-email-password" }}
{{- $emailSet := list }}
{{- range $field := list "to" "from" "smarthost" "authUsername" "repeatInterval" "alertnames" "severities" }}
{{- if index $email $field }}{{ $emailSet = append $emailSet $field }}{{ end }}
{{- end }}
{{- $emailEnabled := gt (len $emailSet) 0 }}
{{- if $emailEnabled }}
{{- if not (and $email.to $email.smarthost $email.from) }}
{{- fail (printf "alerta.alerts.email: to, from and smarthost must all be set to enable email alerts; to turn email off, clear every field under alerta.alerts.email (still set: %s)" (join ", " $emailSet)) }}
{{- end }}
{{- $smarthost := toString $email.smarthost }}
{{- if not (regexMatch "^(\\[[0-9A-Fa-f:.]+\\]|[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*):[0-9]{1,5}$" $smarthost) }}
{{- fail (printf "alerta.alerts.email.smarthost must be host:port, such as smtp.example.com:587, got %q" $smarthost) }}
{{- end }}
{{- $smtpPort := regexReplaceAll "^.*:" $smarthost "" | int }}
{{- if or (lt $smtpPort 1) (gt $smtpPort 65535) }}
{{- fail (printf "alerta.alerts.email.smarthost port must be between 1 and 65535, got %q" $smarthost) }}
{{- end }}
{{- if $email.repeatInterval }}
{{- $repeat := toString $email.repeatInterval }}
{{- if not (regexMatch "^([0-9]{1,8}y)?([0-9]{1,8}w)?([0-9]{1,8}d)?([0-9]{1,8}h)?([0-9]{1,8}m)?([0-9]{1,8}s)?([0-9]{1,8}ms)?$" $repeat) }}
{{- fail (printf "alerta.alerts.email.repeatInterval must be an Alertmanager duration with units in descending order, each at most once, such as 30s, 5m, 12h or 1h30m, got %q" $repeat) }}
{{- end }}
{{- $repeatMs := int64 0 }}
{{- $unitMs := dict "y" 31536000000 "w" 604800000 "d" 86400000 "h" 3600000 "m" 60000 "s" 1000 "ms" 1 }}
{{- range $part := regexFindAll "[0-9]+(ms|[ywdhms])" $repeat -1 }}
{{- $repeatMs = add $repeatMs (mul (int64 (regexReplaceAll "[a-z]+$" $part "")) (index $unitMs (regexReplaceAll "^[0-9]+" $part ""))) }}
{{- end }}
{{- if eq (int64 $repeatMs) (int64 0) }}
{{- fail (printf "alerta.alerts.email.repeatInterval cannot be zero, got %q" $repeat) }}
{{- end }}
{{- if gt (int64 $repeatMs) (int64 9223372036854) }}
{{- fail (printf "alerta.alerts.email.repeatInterval is out of range for Alertmanager, got %q" $repeat) }}
{{- end }}
{{- end }}
{{- range $name := $emailAlertnames }}
{{- if not (regexMatch "^[a-zA-Z_:][a-zA-Z0-9_:]*$" (toString $name)) }}
{{- fail (printf "alerta.alerts.email.alertnames entries must be Prometheus alert names, got %q" (toString $name)) }}
{{- end }}
{{- end }}
{{- range $severity := $emailSeverities }}
{{- if not (regexMatch "^[a-zA-Z0-9_-]+$" (toString $severity)) }}
{{- fail (printf "alerta.alerts.email.severities entries must be plain severity names, got %q" (toString $severity)) }}
{{- end }}
{{- end }}
{{- end }}

{{- $apiKey := randAlphaNum 32 }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "alerta" }}
{{- if $existingSecret }}
{{- $apiKey = index $existingSecret.data "alerta-api-key" | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alerta
  labels:
    app: alerta
type: Opaque
data:
  alerta-api-key: {{ $apiKey | b64enc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alerta
  labels:
    app: alerta
data:
  config.js: |
    // contents of config.js
    'use strict';
    angular.module('config', [])
      .constant('config', {
        'endpoint'    : "/api",
        'provider'    : "basic"
      })
      .constant('colors', {});
---
apiVersion: v1
kind: Service
metadata:
  name: alerta
  labels:
    app: alerta
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: alerta
    release: alerta
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerta
  labels:
    app: alerta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alerta
      release: alerta
  template:
    metadata:
      labels:
        app: alerta
        release: alerta
    spec:
      containers:
        - name: alerta
          image: "alerta/alerta-web:9.1.0"
          imagePullPolicy: IfNotPresent
          resources: {{- toYaml .Values.alerta.resources | nindent 12 }}
          env:
            - name: ADMIN_USERS
              valueFrom:
                secretKeyRef:
                  key: user
                  name: grafana-admin-password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: grafana-admin-password
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: alerta-api-key
            - name: ALERTA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: alerta-api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: alerta-db-app
                  key: uri
            - name: SIGNUP_ENABLED
              value: "False"
            - name: AUTH_REQUIRED
              value: "True"

            {{- $plugins := list }}
            {{- if and .Values.alerta.alerts.telegram.chatID .Values.alerta.alerts.telegram.token }}
              {{- $plugins = append $plugins "telegram" }}
            {{- end }}
            {{- if .Values.alerta.alerts.slack.url }}
              {{- $plugins = append $plugins "slack" }}
            {{- end }}

            {{- if gt (len $plugins) 0 }}
            - name: "PLUGINS"
              value: "{{ default "" (join "," $plugins) }}"
            {{- end }}

            {{- if and .Values.alerta.alerts.telegram.chatID .Values.alerta.alerts.telegram.token }}
            - name: TELEGRAM_CHAT_ID
              value: "{{ .Values.alerta.alerts.telegram.chatID }}"
            - name: TELEGRAM_TOKEN
              value: "{{ .Values.alerta.alerts.telegram.token }}"
            - name: TELEGRAM_WEBHOOK_URL
              value: "https://{{ printf "alerta.%s" (.Values.host | default $host) }}/api/webhooks/telegram?api-key={{ $apiKey }}"
            {{- if .Values.alerta.alerts.telegram.disabledSeverity }}
            - name: TELEGRAM_DISABLE_NOTIFICATION_SEVERITY
              value: {{ .Values.alerta.alerts.telegram.disabledSeverity | toJson | quote }}
            {{- end }}
            {{- end }}

            {{- if .Values.alerta.alerts.slack.url }}
            - name: "SLACK_WEBHOOK_URL"
              value: "{{ .Values.alerta.alerts.slack.url }}"
            {{- if .Values.alerta.alerts.slack.disabledSeverity }}
            - name: SLACK_SEVERITY_FILTER
              value: {{ .Values.alerta.alerts.slack.disabledSeverity | toJson | quote }}
            {{- end }}
            {{- if .Values.alerta.alerts.slack.dashboardUrl }}
            - name: DASHBOARD_URL
              value: {{ .Values.alerta.alerts.slack.dashboardUrl | quote }}
            {{- end }}
            {{- if .Values.alerta.alerts.slack.summaryFmt }}
            - name: SLACK_SUMMARY_FMT
              value: {{ .Values.alerta.alerts.slack.summaryFmt | quote }}
            {{- end }}
            {{- end }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: alerta-config
              mountPath: /app/config.js
              subPath: config.js
      volumes:
        - name: alerta-config
          configMap:
            name: alerta
{{- if ne $gatewayEnabled "true" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alerta
  labels:
    app: alerta
  {{- /* Operator wildcard mode: nginx serves the default SSL cert, so skip per-host ACME. */}}
  {{- if not $wildcardSecret }}
  annotations:
    {{- if eq $solver "http01" }}
    acme.cert-manager.io/http01-ingress-ingressclassname: {{ $ingress }}
    {{- end }}
    cert-manager.io/cluster-issuer: {{ $clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ $ingress }}
  tls:
    - hosts:
        - "{{ printf "alerta.%s" (.Values.host | default $host) }}"
      {{- /* Operator wildcard mode: no per-host secret — ingress-nginx falls
             back to the default SSL certificate while the tls section keeps
             the HTTP-to-HTTPS redirect enforced. */}}
      {{- if not $wildcardSecret }}
      secretName: alerta-tls
      {{- end }}
  rules:
    - host: "{{ printf "alerta.%s" (.Values.host | default $host) }}"
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: alerta
                port:
                  name: http
{{- else }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alerta
  labels:
    app: alerta
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cozystack
    namespace: {{ $exposeIngress }}
  hostnames:
  - {{ printf "alerta.%s" (.Values.host | default $host) | quote }}
  rules:
  - backendRefs:
    - name: alerta
      port: 80
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager
  labels:
    app: alertmanager
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, namespace, cluster]
      group_wait: 15s
      group_interval: 15s
      repeat_interval: 1h
      receiver: 'alerta'
      routes:
      - receiver: alerta_no_resolve
        repeat_interval: 1m
        matchers:
        - 'event="Heartbeat"'
      - receiver: blackhole
        matchers:
        - 'severity="none"'
      - receiver: blackhole
        matchers:
        - 'alertname=~"CDIDefaultStorageClassDegraded|CDINoDefaultStorageClass"'
      {{- if $emailEnabled }}
      - receiver: alerta
        continue: true
        matchers:
        - 'severity=~"{{ join "|" $emailSeverities }}"'
        - 'notify_email="true"'
      - receiver: email
        group_wait: 1m
        group_interval: 5m
        repeat_interval: {{ $email.repeatInterval | default "12h" | quote }}
        matchers:
        - 'severity=~"{{ join "|" $emailSeverities }}"'
        - 'notify_email="true"'
      {{- if $emailAlertnames }}
      - receiver: alerta
        continue: true
        matchers:
        - 'alertname=~"^({{ join "|" $emailAlertnames }})$"'
      - receiver: email
        group_wait: 1m
        group_interval: 5m
        repeat_interval: {{ $email.repeatInterval | default "12h" | quote }}
        matchers:
        - 'alertname=~"^({{ join "|" $emailAlertnames }})$"'
      {{- end }}
      {{- end }}
    receivers:
    - name: blackhole
    - name: "alerta"
      webhook_configs:
      - url: 'http://alerta/api/webhooks/prometheus?api-key={{ $apiKey }}'
        send_resolved: true
    - name: "alerta_no_resolve"
      webhook_configs:
      - url: 'http://alerta/api/webhooks/prometheus?api-key={{ $apiKey }}'
        send_resolved: false
    {{- if $emailEnabled }}
    - name: email
      email_configs:
      - to: {{ $email.to | quote }}
        from: {{ $email.from | quote }}
        smarthost: {{ $email.smarthost | quote }}
        {{- if $email.authUsername }}
        auth_username: {{ $email.authUsername | quote }}
        auth_password_file: {{ printf "/etc/vm/secrets/%s/password" $emailPasswordSecret | quote }}
        {{- end }}
        send_resolved: true
    {{- end }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: alertmanager
spec:
  managedMetadata:
    labels:
      apps.cozystack.io/application.group: apps.cozystack.io
      apps.cozystack.io/application.kind: Monitoring
      apps.cozystack.io/application.name: {{ $.Release.Name }}
  replicaCount: 3
  configSecret: alertmanager
  {{- if and $emailEnabled $email.authUsername }}
  secrets:
  - {{ $emailPasswordSecret | quote }}
  {{- end }}
  podMetadata:
    labels:
      policy.cozystack.io/allow-to-apiserver: "true"
