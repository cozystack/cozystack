apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-grafana-readiness
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-grafana-readiness
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [grafana.integreatly.org]
    resources: [grafanas]
    resourceNames: [grafana]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [grafana-deployment]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-grafana-readiness
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-grafana-readiness
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-grafana-readiness
    namespace: {{ .Release.Namespace }}
