{{- /*
  VictoriaTraces serves a Jaeger Query Service API on its select component, so
  each entry gets a built-in Grafana `jaeger` datasource — no plugin install,
  unlike the logs datasource. Service names follow the operator's vt-prefix
  convention (as vlselect-* for VLCluster); ports and paths are per upstream
  docs (https://docs.victoriametrics.com/victoriatraces/querying/grafana/):
    cluster -> vtselect  :10471/select/jaeger
    single  -> vtsingle  :10428/select/jaeger
  A Tempo Query API (/select/tempo, Grafana `tempo` datasource, richer TraceQL)
  also exists but is upstream-experimental, so the stable Jaeger API is default.
*/ -}}
{{- range .Values.tracingStorages }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: vtraces-{{ .name }}
spec:
  datasource:
    access: proxy
    type: jaeger
    name: vtraces-{{ .name }}
    {{- if eq (.mode | default "cluster") "single" }}
    url: http://vtsingle-{{ .name }}.{{ $.Release.Namespace }}.svc:10428/select/jaeger
    {{- else }}
    url: http://vtselect-{{ .name }}.{{ $.Release.Namespace }}.svc:10471/select/jaeger
    {{- end }}
  instanceSelector:
    matchLabels:
      dashboards: grafana
{{- end }}
