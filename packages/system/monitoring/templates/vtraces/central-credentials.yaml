{{- /*
  The central tenant's logins at the tenant-root vmauth: one the collector
  writes with, one the Grafana datasource reads with, each referenced by its
  VMUser. Grafana's must not be able to write, or a write sent through its
  datasource proxy would pass the collector's rate limit. Owned here because
  the operator publishes a VMUser's generated Secret only while some VMAuth
  selects that user, so the collector would otherwise wait on a Secret that
  never appears when tenant-root has no central store. Each password is kept
  across renders (monitoring.tracingCentralPassword).
*/ -}}
{{- if include "monitoring.tracingCentral" . }}
{{- range $secret, $username := dict "traces-central-credentials" $.Release.Namespace "traces-central-reader-credentials" (printf "%s.reader" $.Release.Namespace) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    apps.cozystack.io/application.name: {{ $.Release.Name }}
type: Opaque
stringData:
  username: {{ $username | quote }}
  password: {{ include "monitoring.tracingCentralPassword" (list $ $secret) | quote }}
{{- end }}
{{- end }}
