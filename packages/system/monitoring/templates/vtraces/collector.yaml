{{- /*
  Per-tenant OpenTelemetry Collector — the app-facing OTLP ingest gateway for
  traces (design-proposals/distributed-tracing, phase 2). It lives in the tenant
  namespace (like a per-tenant vmagent), so app -> collector traffic is
  intra-namespace and never crosses the tenant boundary. It applies head
  sampling and optional attribute redaction, then exports over OTLP/HTTP to the
  tracingStorages backend. No OpenTelemetry operator exists in the platform, so
  this is a plain Deployment + ConfigMap + Service (the fluent-bit pattern).

  Trust boundary: the collector is the place where sampling/redaction (and, in
  the shared-central topology, tenant-header injection) are enforced, but its
  OTLP receiver is unauthenticated and the Service is a plain ClusterIP — actual
  tenant isolation is provided by the tenant NetworkPolicies, not by this
  manifest alone.

  Off by default: tracingStorages is empty out of the box, so the collector
  renders only once a backend is configured (local) or central mode is selected
  — there is no producer/backend to wire otherwise. Gating on that, rather than
  failing on empty, keeps "no backend" a clean off-state (an app's OTLP exporter
  simply finds no collector Service and retries harmlessly) instead of aborting
  the whole monitoring release.

  Backend topology (`tracingCollector.backend`):
    - local (default): the exporter targets the tenant's own tracingStorages[0]
      in this namespace. A collector fronting more than one local backend is
      rejected below rather than silently writing to only the first.
    - central (shared-central topology): the exporter targets the shared
      VictoriaTraces backend in tenant-root via the vtinsert-generic ExternalName
      alias in cozy-monitoring, and a resource processor stamps the tenant name
      (this namespace) so spans of every tenant are distinguishable in the one
      account-0 store. The cross-boundary hop is allowed by the tenant's
      collector-scoped Cilium egress rule. Both write- and read-side isolation
      on the shared account-0 store are weak (the `tenant` attribute is a label,
      not an enforced boundary, and egress is selected by pod label); a real
      boundary needs an authenticating proxy (vmauth) deriving the tenant from
      identity — deferred future work per the design. Use the default per-tenant
      backend for hard isolation.
*/ -}}
{{- define "monitoring.tracingCollectorConfig" -}}
{{- $c := .Values.tracingCollector -}}
{{- $central := eq ($c.backend | default "local") "central" -}}
{{- $endpoint := "" -}}
{{- if $central -}}
{{- $endpoint = "http://vtinsert-generic.cozy-monitoring.svc:10481/insert/opentelemetry/v1/traces" -}}
{{- else -}}
{{- $backend := index .Values.tracingStorages 0 -}}
{{- $mode := $backend.mode | default "cluster" -}}
{{- $endpoint = ternary (printf "http://vtsingle-%s.%s.svc:10428/insert/opentelemetry/v1/traces" $backend.name .Release.Namespace) (printf "http://vtinsert-%s.%s.svc:10481/insert/opentelemetry/v1/traces" $backend.name .Release.Namespace) (eq $mode "single") -}}
{{- end -}}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  probabilistic_sampler:
    sampling_percentage: {{ $c.samplingPercentage }}
  batch: {}
{{- if $central }}
  # Shared-central topology: stamp the tenant (this namespace) so spans from
  # every tenant remain distinguishable in the single account-0 store. Sourced
  # from the collector's own namespace, not from tenant-controlled input.
  resource/tenant:
    attributes:
      - key: tenant
        value: {{ .Release.Namespace }}
        action: upsert
{{- end }}
{{- if $c.redactAttributes }}
  attributes/redact:
    actions:
{{- range $c.redactAttributes }}
      - key: {{ . }}
        action: delete
{{- end }}
{{- end }}
exporters:
  # vtinsert (cluster) / VTSingle accept OTLP/HTTP natively; gRPC would require
  # -otlpGRPCListenAddr on the backend, so export over HTTP.
  otlphttp/victoriatraces:
    traces_endpoint: {{ $endpoint }}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, {{ if $central }}resource/tenant, {{ end }}probabilistic_sampler, {{ if $c.redactAttributes }}attributes/redact, {{ end }}batch]
      exporters: [otlphttp/victoriatraces]
{{- end -}}
{{- if and .Values.tracingCollector.enabled (or (eq (.Values.tracingCollector.backend | default "local") "central") (not (empty .Values.tracingStorages))) }}
{{- if and (ne (.Values.tracingCollector.backend | default "local") "central") (gt (len .Values.tracingStorages) 1) }}
{{- fail "monitoring: tracingCollector fronts a single traces backend, but tracingStorages has more than one entry — the collector would export to the first and leave the rest empty. Reduce tracingStorages to one entry or set tracingCollector.enabled=false (apps then send OTLP straight to each backend)." }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-traces
  labels:
    app.kubernetes.io/name: otel-traces
    apps.cozystack.io/application.name: {{ .Release.Name }}
data:
  config.yaml: |
{{ include "monitoring.tracingCollectorConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-traces
  labels:
    app.kubernetes.io/name: otel-traces
    apps.cozystack.io/application.name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.tracingCollector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-traces
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-traces
      annotations:
        checksum/config: {{ include "monitoring.tracingCollectorConfig" . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ include "cozy-lib.image" (list .Values.tracingCollector.image $) }}
          args:
            - --config=/etc/otel-traces/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          resources: {{ .Values.tracingCollector.resources | toYaml | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel-traces
      volumes:
        - name: config
          configMap:
            name: otel-traces
---
apiVersion: v1
kind: Service
metadata:
  name: otel-traces
  labels:
    app.kubernetes.io/name: otel-traces
    apps.cozystack.io/application.name: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: otel-traces
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
{{- end }}
