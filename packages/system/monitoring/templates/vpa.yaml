{{- /*
  updateMode is Initial, not Auto. In Auto mode the VPA Updater evicts running
  pods to apply new recommendations. During install that eviction churn
  recreates pods faster than Cilium releases their endpoint IPs, tripping the
  cluster-pool IPAM "IP already in use" (putEndpointIdInvalid) leak: a pod gets
  wedged in ContainerCreating and the install stalls (e.g. vmstorage/vmagent
  evictions wedging vmalertmanager / fluent-bit). Initial sets requests at pod
  creation without ever evicting, which removes the trigger. Do not switch back
  to Auto without first fixing the underlying Cilium IP-reuse race.
*/ -}}
{{- range .Values.metricsStorages }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-vminsert-{{ .name }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vminsert-{{ .name }}
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: vminsert
        minAllowed: {{- include "monitoring.vpaBound" (list $ "vminsert" "minAllowed" (dig "minAllowed" nil (.vminsert | default dict)) (dict "cpu" "25m" "memory" "64Mi")) | nindent 10 }}
        maxAllowed: {{- include "monitoring.vpaBound" (list $ "vminsert" "maxAllowed" (dig "maxAllowed" nil (.vminsert | default dict)) (dict "cpu" "2000m" "memory" "4Gi")) | nindent 10 }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-vmselect-{{ .name }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: vmselect-{{ .name }}
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: vmselect
        minAllowed: {{- include "monitoring.vpaBound" (list $ "vmselect" "minAllowed" (dig "minAllowed" nil (.vmselect | default dict)) (dict "cpu" "200m" "memory" "512Mi")) | nindent 10 }}
        maxAllowed: {{- include "monitoring.vpaBound" (list $ "vmselect" "maxAllowed" (dig "maxAllowed" nil (.vmselect | default dict)) (dict "cpu" "4000m" "memory" "8Gi")) | nindent 10 }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-vmstorage-{{ .name }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: vmstorage-{{ .name }}
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: vmstorage
        minAllowed: {{- include "monitoring.vpaBound" (list $ "vmstorage" "minAllowed" (dig "minAllowed" nil (.vmstorage | default dict)) (dict "cpu" "200m" "memory" "512Mi")) | nindent 10 }}
        maxAllowed: {{- include "monitoring.vpaBound" (list $ "vmstorage" "maxAllowed" (dig "maxAllowed" nil (.vmstorage | default dict)) (dict "cpu" "4000m" "memory" "8Gi")) | nindent 10 }}
{{- end }}
{{- range .Values.logsStorages }}
