{{- if and (ne .Release.Namespace "tenant-root") (ne .Release.Namespace "cozy-monitoring") }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: vmagent
spec:
  podMetadata:
    labels:
      policy.cozystack.io/allow-to-apiserver: "true"
  shardCount: 1
  externalLabels:
    cluster: {{ .Values.vmagent.externalLabels.cluster }}
    tenant: {{ .Release.Namespace }}
    {{- if .Values.vmagent.externalLabels.environment }}
    environment: {{ .Values.vmagent.externalLabels.environment | quote }}
    {{- end }}
  extraArgs:
    promscrape.maxScrapeSize: "32MB"
    promscrape.streamParse: "true"
  remoteWrite:
  {{- /* One target per metrics store this instance renders, unless the
       values name the targets themselves. */}}
  {{- $urls := dig "remoteWrite" "urls" list (.Values.vmagent | default dict) }}
  {{- if not $urls }}
  {{- range (include "monitoring.metricsStorages" $ | fromYamlArray) }}
  {{- $urls = append $urls (printf "http://vminsert-%s:8480/insert/0/prometheus" .name) }}
  {{- end }}
  {{- end }}
  {{- range $urls }}
  - url: {{ . | quote }}
  {{- end }}

  {{- $r := include "monitoring.componentResources" (list $ "vmagent" (dig "resources" nil (.Values.vmagent | default dict))) }}
  resources: {{ if eq $r "{}" }}{}{{ else }}{{ $r | nindent 4 }}{{ end }}
  scrapeInterval: 30s
  selectAllByDefault: false
  {{- with .Values.vmagent.inlineScrapeConfig }}
  inlineScrapeConfig: |
    {{- . | nindent 4 }}
  {{- end }}
  podScrapeNamespaceSelector:
    matchLabels:
      namespace.cozystack.io/monitoring: {{ .Release.Namespace }}
  serviceScrapeNamespaceSelector:
    matchLabels:
      namespace.cozystack.io/monitoring: {{ .Release.Namespace }}
{{- end }}
