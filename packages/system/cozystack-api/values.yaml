# Injected by the platform from the cozystack-values Secret. The empty
# default keeps the chart renderable on its own, outside a cluster.
_cluster: {}

cozystackAPI:
  image: ghcr.io/cozystack/cozystack/cozystack-api:v1.6.0@sha256:c4d374a9bc5e6f6e66d24b29396f1eae9d7f06fd268ff767d05c45ca35e84e2e
  replicas: 2
  # Empty by default: no resources block is rendered, so requests and limits are
  # opt-in. Idle usage (measured) is ~130-143Mi — keep a limit above that.
  resources: {}
  # Serve and aggregate the sdn.cozystack.io group (Cozystack-native
  # SecurityGroup over CiliumNetworkPolicy) through cozystack-api. The platform
  # bundle turns this off for the cozyplane networking variant, where cozyplane
  # owns the group; off drops both the APIService and the group itself
  # (--serve-sdn=false), so cozystack-api stops publishing its OpenAPI.
  serveSDN: true
  # Check every application write of a kind whose ApplicationDefinition
  # declares its consumption against its tenant pool's budget, and count tenant
  # pools in declared reservations instead of ResourceQuota usage
  # (--tenant-quota-reservation). Off until every kind declares its
  # consumption.
  tenantQuotaReservation: false
