apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  annotations:
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/cozystack-api"
  name: v1alpha1.apps.cozystack.io
spec:
  group: apps.cozystack.io
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: cozystack-api
    namespace: cozy-system
  version: v1alpha1
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  annotations:
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/cozystack-api"
  name: v1alpha1.core.cozystack.io
spec:
  group: core.cozystack.io
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: cozystack-api
    namespace: cozy-system
  version: v1alpha1
{{- if .Values.cozystackAPI.serveSDN }}
---
# The sdn.cozystack.io group (SecurityGroup projected over CiliumNetworkPolicy).
# Off in the cozyplane networking variant, where cozyplane is the group's only
# server — see the platform bundle (templates/bundles/system.yaml).
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  annotations:
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/cozystack-api"
  name: v1alpha1.sdn.cozystack.io
spec:
  group: sdn.cozystack.io
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: cozystack-api
    namespace: cozy-system
  version: v1alpha1
{{- end }}
