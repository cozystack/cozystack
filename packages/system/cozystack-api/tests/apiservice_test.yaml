suite: sdn APIService gate
templates:
  - templates/apiservice.yaml
release:
  name: cozystack-api
  namespace: cozy-system
tests:
  - it: serves apps, core and sdn by default
    asserts:
      - hasDocuments:
          count: 3
      - containsDocument:
          apiVersion: apiregistration.k8s.io/v1
          kind: APIService
          name: v1alpha1.apps.cozystack.io
          any: true
      - containsDocument:
          apiVersion: apiregistration.k8s.io/v1
          kind: APIService
          name: v1alpha1.sdn.cozystack.io
          any: true

  # The cozyplane networking variant owns sdn.cozystack.io; the toggle must
  # remove that APIService and nothing else.
  - it: serveSDN off removes only the sdn APIService
    set:
      cozystackAPI:
        serveSDN: false
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          apiVersion: apiregistration.k8s.io/v1
          kind: APIService
          name: v1alpha1.apps.cozystack.io
          any: true
      - containsDocument:
          apiVersion: apiregistration.k8s.io/v1
          kind: APIService
          name: v1alpha1.sdn.cozystack.io
          any: true
        not: true
