suite: cozystack-api ClusterRole read sources
templates:
  - templates/rbac.yaml

release:
  name: cozystack-api
  namespace: cozy-system

# The Option (dropdown) providers run with the cozystack-api ServiceAccount's
# privileged client, so every GVR a provider lists must be granted on this
# ClusterRole. The plan/backup providers list namespaced plans/backups in the
# backups.cozystack.io group; without read access there the apiserver returns
# forbidden and List silently drops those dropdowns (Get returns 500). The
# bare cozystack.io grant does NOT cover backups.cozystack.io — RBAC matches
# the API group string exactly.
#
# The last two tests bound the role from two directions, and neither covers the
# other. The count bound pins the list at exactly seventeen: templates/rbac.yaml
# carries no template directives, so anything appended makes rules[17] exist and
# anything dropped takes rules[16] away, whatever the rule is called. It says
# nothing about a grant swapped in for an existing one, because the count does
# not move under a swap. The spelling assert catches that case for the one rule
# it names, and misses every other wording of it, because helm-unittest compares
# each field it is handed by value equality and `any: true` only selects which
# fields are compared. Changing the rule count on purpose means moving both
# indices below, which is the review this role should get.

tests:
  - it: grants SiteRouter admission read access to Services and Nodes
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["namespaces", "secrets", "services"]
            verbs: ["get", "watch", "list"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes", "persistentvolumeclaims"]
            verbs: ["get", "watch", "list"]

  - it: grants SiteRouter deny-set admission a name-scoped read of the cozystack ConfigMap
    # The deny-set resolves the cluster networks a tenant's remoteCIDRs are
    # validated against from this one ConfigMap; without the grant every
    # SiteRouter declaring remoteCIDRs is rejected with Forbidden. Pinned with
    # resourceNames and verbs spelled out so widening it to every ConfigMap, or
    # to list/watch, has to move this assert rather than passing under it.
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get"]
            resourceNames: ["cozystack"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "watch", "list"]

  - it: grants read on backups.cozystack.io plans and backups for the plan/backup providers
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["backups.cozystack.io"]
            resources: ["backupclasses", "plans", "backups"]
            verbs: ["get", "watch", "list"]

  - it: grants full access on cilium.io ciliumnetworkpolicies for SecurityGroup storage
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["cilium.io"]
            resources: ["ciliumnetworkpolicies"]
            verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]

  - it: does not grant objectstorage.k8s.io bucketclasses (no provider reads it)
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["objectstorage.k8s.io"]
            resources: ["bucketclasses"]
            verbs: ["get", "watch", "list"]

  - it: ships exactly the seventeen rules this role is pinned to
    asserts:
      # Both directions. A dropped grant is the failure this suite is about:
      # the apiserver returns forbidden and List silently drops the dropdown.
      - exists:
          path: rules[16]
      - notExists:
          path: rules[17]
