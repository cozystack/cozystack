suite: cozystack-api ClusterRole read sources
templates:
  - templates/rbac.yaml

release:
  name: cozystack-api
  namespace: cozy-system

# The Option (dropdown) providers run with the cozystack-api ServiceAccount's
# privileged client, so every GVR a provider lists must be granted on this
# ClusterRole. The plan/backup providers list namespaced plans/backups in the
# backups.cozystack.io group; without read access there the apiserver returns
# forbidden and List silently drops those dropdowns (Get returns 500). The
# bare cozystack.io grant does NOT cover backups.cozystack.io — RBAC matches
# the API group string exactly.
#
# The last two tests bound the role from two directions, and neither covers the
# other. The count bound pins the list at exactly twenty-one: templates/rbac.yaml
# carries no template directives, so anything appended makes rules[21] exist and
# anything dropped takes rules[20] away, whatever the rule is called. It says
# nothing about a grant swapped in for an existing one, because the count does
# not move under a swap. The spelling assert catches that case for the one rule
# it names, and misses every other wording of it, because helm-unittest compares
# each field it is handed by value equality and `any: true` only selects which
# fields are compared. Changing the rule count on purpose means moving both
# indices below, which is the review this role should get.

tests:
  - it: grants SiteRouter admission read access to Services and Nodes
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["namespaces", "secrets", "services"]
            verbs: ["get", "watch", "list"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes", "persistentvolumeclaims"]
            verbs: ["get", "watch", "list"]

  - it: grants SiteRouter deny-set admission a name-scoped read of the cozystack ConfigMap
    # The deny-set resolves the cluster networks a tenant's remoteCIDRs are
    # validated against from this one ConfigMap; without a grant every SiteRouter
    # declaring remoteCIDRs is rejected with Forbidden.
    #
    # The role separately carries a BROAD configmaps read for package sources, so
    # this narrow rule grants no capability the role does not already have. It is
    # kept deliberately rather than deleted as redundant: it records what this
    # admission path actually needs, and it survives the broad grant being scoped
    # down or removed with the feature that introduced it. That also means this
    # suite cannot pin "the role cannot read every ConfigMap" — an assert to that
    # effect lived here and became false the moment the broad grant landed,
    # having caught an unrelated rule rather than a widening of this one.
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get"]
            resourceNames: ["cozystack"]

  - it: grants read on backups.cozystack.io plans and backups for the plan/backup providers
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["backups.cozystack.io"]
            resources: ["backupclasses", "plans", "backups"]
            verbs: ["get", "watch", "list"]

  - it: grants full access on cilium.io ciliumnetworkpolicies for SecurityGroup storage
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["cilium.io"]
            resources: ["ciliumnetworkpolicies"]
            verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]

  # The marketplace tap flow: disconnecting a tap deletes its cluster-scoped
  # PackageSource, and the tap's Flux OCIRepository is read to report status.
  # Both grants live on this ClusterRole because the tap handler runs with the
  # cozystack-api ServiceAccount's client.
  - it: grants delete on cozystack.io packagesources for tap disconnect
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["cozystack.io"]
            resources: ["packagesources"]
            verbs: ["delete"]

  - it: grants read on source.toolkit.fluxcd.io ocirepositories for tap status
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["source.toolkit.fluxcd.io"]
            resources: ["ocirepositories"]
            verbs: ["get", "list", "watch"]

  - it: does not grant objectstorage.k8s.io bucketclasses (no provider reads it)
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["objectstorage.k8s.io"]
            resources: ["bucketclasses"]
            verbs: ["get", "watch", "list"]

  - it: ships exactly the twenty-one rules this role is pinned to
    asserts:
      # Both directions. A dropped grant is the failure this suite is about:
      # the apiserver returns forbidden and List silently drops the dropdown.
      - exists:
          path: rules[20]
      - notExists:
          path: rules[21]
