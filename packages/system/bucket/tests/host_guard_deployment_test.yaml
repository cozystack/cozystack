suite: bucket deployment guards an empty apex in isolation
templates:
  - templates/deployment.yaml

release:
  name: bucket
  namespace: tenant-root

tests:
  - it: fails when _namespace is injected with an empty host
    set:
      _namespace:
        host: ""
        ingress: tenant-root
    asserts:
      - failedTemplate:
          errorMessage: "the tenant apex (_namespace.host) is empty and this app sets no host override, so its ingress hostname would be malformed. Set tenant.spec.host on this tenant, inherit it from a parent that has host set, or set this app's host value."

  - it: renders the S3 endpoint from the apex when it is set
    set:
      _namespace:
        host: example.org
        ingress: tenant-root
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENDPOINT
            value: s3.example.org
