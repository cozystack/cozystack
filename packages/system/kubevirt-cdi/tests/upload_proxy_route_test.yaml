suite: CDI upload proxy TLS passthrough routes
templates:
  - templates/cdi-uploadproxy-ingress.yaml

release:
  name: kubevirt-cdi
  namespace: cozy-kubevirt-cdi

tests:
  - it: renders an unlimited TLS-passthrough Ingress in ingress mode
    set:
      _cluster:
        root-host: example.org
        expose-services: "cdi-uploadproxy"
        expose-ingress: tenant-root
        gateway-enabled: "false"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Ingress
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: "0"
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-passthrough"]
          value: "true"
      - equal:
          path: spec.tls[0].hosts[0]
          value: cdi-uploadproxy.example.org

  - it: renders no Ingress in Gateway mode
    set:
      _cluster:
        root-host: example.org
        expose-services: "cdi-uploadproxy"
        expose-ingress: tenant-root
        gateway-enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no route without a publication hostname
    set:
      _cluster:
        root-host: ""
        expose-services: "cdi-uploadproxy"
        gateway-enabled: "false"
    asserts:
      - hasDocuments:
          count: 0
