suite: CDI certificate ownership across publication modes
release:
  name: kubevirt-cdi
  namespace: cozy-kubevirt-cdi
tests:
- it: keeps CDI certificate ownership by default
  asserts:
  - containsDocument:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      any: true
    not: true
  - template: templates/cdi-cr.yaml
    documentSelector:
      path: kind
      value: CDI
    notExists:
      path: spec.customizeComponents
- it: does not require ACME for an exposed proxy
  set:
    _cluster:
      root-host: example.org
      expose-services: cdi-uploadproxy
      issuer-name: unavailable
  asserts:
  - containsDocument:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      any: true
    not: true
  - template: templates/cdi-cr.yaml
    documentSelector:
      path: kind
      value: CDI
    notExists:
      path: spec.customizeComponents
- it: does not consume a platform wildcard
  set:
    _cluster:
      root-host: example.org
      expose-services: cdi-uploadproxy
      wildcard-secret-name: missing-wildcard
  asserts:
  - containsDocument:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      any: true
    not: true
  - template: templates/cdi-cr.yaml
    documentSelector:
      path: kind
      value: CDI
    notExists:
      path: spec.customizeComponents
- it: leaves external TLS alone with exposure enabled
  set:
    uploadProxyURL: https://uploads.example.net
    _cluster:
      root-host: example.org
      expose-services: cdi-uploadproxy
  asserts:
  - containsDocument:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      any: true
    not: true
  - template: templates/cdi-cr.yaml
    documentSelector:
      path: kind
      value: CDI
    notExists:
      path: spec.customizeComponents
- it: leaves external TLS alone in Gateway wildcard mode
  set:
    uploadProxyURL: https://uploads.example.net
    _cluster:
      root-host: example.org
      expose-services: cdi-uploadproxy
      gateway-enabled: 'true'
      wildcard-secret-name: missing-wildcard
  asserts:
  - containsDocument:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      any: true
    not: true
  - template: templates/cdi-cr.yaml
    documentSelector:
      path: kind
      value: CDI
    notExists:
      path: spec.customizeComponents
- it: leaves external TLS alone without exposure
  set:
    uploadProxyURL: https://uploads.example.net
  asserts:
  - containsDocument:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      any: true
    not: true
  - template: templates/cdi-cr.yaml
    documentSelector:
      path: kind
      value: CDI
    notExists:
      path: spec.customizeComponents
