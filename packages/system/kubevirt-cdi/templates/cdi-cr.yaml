apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  cloneStrategyOverride: {{ quote .Values.cloneStrategyOverride }}
  config:
    {{- with .Values.uploadProxyURL }}
    uploadProxyURLOverride: {{ quote . }}
    {{- end }}
    featureGates:
    - HonorWaitForFirstConsumer
    - ExpandDisks
    # Resources for every worker pod CDI creates -- importer, uploader and
    # host-assisted cloner alike, not only the importer the name suggests. The
    # default below restates CDI's own built-in values, so an unset
    # importerResources changes nothing; it exists so a lane or an operator can
    # raise the ceiling where a specific import needs it. Note this has to be set
    # here on the CDI CR: the operator reconciles CDIConfig.spec from this
    # resource, so patching CDIConfig directly is silently reverted.
    podResourceRequirements:
      {{- toYaml .Values.importerResources | nindent 6 }}
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  workload:
    nodeSelector:
      kubernetes.io/os: linux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdi-copy-dv
rules:
- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes/source"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cdi-clone-dv
  namespace: cozy-public
subjects:
- kind: Group
  name: system:serviceaccounts
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cdi-copy-dv
  apiGroup: rbac.authorization.k8s.io
