{{- $cluster := .Values._cluster | default dict -}}
{{- $rootHost := (index $cluster "root-host") | default "" -}}
{{- $exposeServices := splitList "," ((index $cluster "expose-services") | default "") -}}
{{- $wildcardSecret := (index $cluster "wildcard-secret-name") | default "" -}}
{{- $proxyExposed := and $rootHost (has "cdi-uploadproxy" $exposeServices) -}}
{{- $publicCertSecret := $wildcardSecret | default "cdi-uploadproxy-public-cert" -}}
{{- $uploadProxyURL := .Values.uploadProxyURL | default "" -}}
{{- if and (not $uploadProxyURL) $proxyExposed -}}
{{- $uploadProxyURL = printf "https://cdi-uploadproxy.%s" $rootHost -}}
{{- end -}}
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  cloneStrategyOverride: {{ quote .Values.cloneStrategyOverride }}
  config:
    {{- with $uploadProxyURL }}
    uploadProxyURLOverride: {{ quote . }}
    {{- end }}
    featureGates:
    - HonorWaitForFirstConsumer
    - ExpandDisks
  {{- if $proxyExposed }}
  # CDI supports replacing the upload proxy's serving certificate. Keep the
  # operator-managed service certificate intact and patch only the Deployment
  # mount so CDI's rotation controller cannot overwrite the public certificate.
  customizeComponents:
    patches:
    - resourceName: cdi-uploadproxy
      resourceType: Deployment
      type: strategic
      patch: |
        {"spec":{"template":{"spec":{"volumes":[{"name":"server-cert","secret":{"secretName":{{ $publicCertSecret | quote }}}}]}}}}
  {{- end }}
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  workload:
    nodeSelector:
      kubernetes.io/os: linux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdi-copy-dv
rules:
- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes/source"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cdi-clone-dv
  namespace: cozy-public
subjects:
- kind: Group
  name: system:serviceaccounts
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cdi-copy-dv
  apiGroup: rbac.authorization.k8s.io
