{{- $host := index .Values._cluster "root-host" }}
{{- $exposeServices := splitList "," ((index .Values._cluster "expose-services") | default "") }}
{{- $exposeIngress := (index .Values._cluster "expose-ingress") | default "tenant-root" }}
{{- $gatewayEnabled := (index .Values._cluster "gateway-enabled") | default "false" }}
{{- /* The platform always writes the mode, so an absent one is a values
       channel from before it: no route until it is written. */}}
{{- $passthroughMode := (index .Values._cluster "gateway-passthrough-mode") | default "" }}
{{- if and (has "cdi-uploadproxy" $exposeServices) (eq $gatewayEnabled "true") (eq $passthroughMode "singleAddress") }}
{{- /* The proxy authenticates a bearer upload token rather than a client
       certificate, so the Gateway can terminate TLS on 443 beside the
       other HTTPS listeners and re-encrypt to it. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cdi-uploadproxy
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cozystack
    namespace: {{ $exposeIngress }}
  hostnames:
  - {{ printf "cdi-uploadproxy.%s" $host | quote }}
  rules:
  - backendRefs:
    - name: cdi-uploadproxy
      port: 443
    {{- /* The proxy answers an upload once the image is written. Gateway
           API leaves the default request timeout to the implementation,
           so it is disabled here rather than left to one; zero disables
           it per the spec. */}}
    timeouts:
      request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: cdi-uploadproxy
  annotations:
    gateway.cozystack.io/ca-bundle-from: cdi-uploadproxy-signer-bundle/ca-bundle.crt
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: cdi-uploadproxy
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: cdi-uploadproxy-ca
    hostname: {{ printf "cdi-uploadproxy.%s.svc" .Release.Namespace | quote }}
{{- end }}
