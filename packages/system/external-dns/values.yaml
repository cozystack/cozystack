external-dns:
    # -- How DNS records are synchronized between sources and providers; available values are `sync` & `upsert-only`.
  policy: upsert-only
  # -- Specify the registry for storing ownership and labels.
  # Valid values are `txt`, `aws-sd`, `dynamodb` & `noop`.
  registry: txt
  # -- (string) Specify an identifier for this instance of _ExternalDNS_ wWhen using a registry other than `noop`.
  txtOwnerId:
  # -- (string) Specify a prefix for the domain names of TXT records created for the `txt` registry.
  # Mutually exclusive with `txtSuffix`.
  txtPrefix:
  # -- (string) Specify a suffix for the domain names of TXT records created for the `txt` registry.
  # Mutually exclusive with `txtPrefix`.
  txtSuffix:

    ## - Limit possible target zones by domain suffixes.
  domainFilters: []
  ## -- Intentionally exclude domains from being managed.
  excludeDomains: []

  # -- Specify the DNS provider (e.g., "aws", "google", "azure", etc.)
  provider:
    name: ""

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Startup probe for the `external-dns` container. Gives a slow first start
  # (informer source-cache sync under CI-cluster load) a grace period before the
  # liveness probe begins evaluating, so a healthy-but-slow start is not SIGKILLed
  # into a restart loop. Budget = periodSeconds * failureThreshold = 5 * 45 = 225s;
  # comfortably clears the single-digit-second healthy bind time while staying well
  # inside the operator's default 10m HelmRelease install timeout. Requires the
  # cozystack `patches/deployment-startup-probe.diff` template patch to render.
  # See cozystack/cozystack#3459.
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
    failureThreshold: 45
