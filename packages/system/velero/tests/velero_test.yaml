suite: cozy-velero chart rendering invariants
release:
  name: velero
  namespace: cozy-velero
tests:
  - it: renders the velero server Deployment on the pinned upstream image
    template: charts/velero/templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: velero
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/velero/velero:v1.18.1

  - it: pins the backup-plugin initContainers to velero-1.18-compatible releases
    template: charts/velero/templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: velero
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: velero/velero-plugin-for-aws:v1.14.1
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: quay.io/kubevirt/kubevirt-velero-plugin:v0.9.0

  # Cozystack disables the upgrade-crds Job (upgradeCRDs: false): CRD lifecycle
  # is owned by the generated HelmRelease (upgradeCRDs: CreateReplace on the
  # velero PackageSource), making the Job redundant. Pin that invariant — it
  # silently regressed once.
  - it: does not emit the upgrade-crds Job when upgradeCRDs is disabled
    template: charts/velero/templates/upgrade-crds/upgrade-crds.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Velero binds :8085 (http-monitoring) late under a heavy parallel install, so
  # the upstream liveness probe (initialDelaySeconds 10, ~130s total budget) would
  # kill it mid-startup and crashloop it out of the install-gate window. A
  # startupProbe (patched into the upstream chart, which omits one) holds liveness
  # and readiness off until the server is up, granting 30 * 10s = 300s of startup
  # grace while leaving steady-state liveness at the tight upstream default. Pin
  # the startupProbe budget AND that liveness was NOT loosened, so neither
  # silently regresses.
  - it: gates startup with a startupProbe and keeps liveness tight
    template: charts/velero/templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: velero
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].startupProbe.successThreshold
          value: 1
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /metrics
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: http-monitoring
      # No initialDelaySeconds: the first startup check fires immediately, so the
      # full 300s budget is spent probing. Pin its absence so a future change
      # cannot silently re-introduce a delay that eats into the grace window.
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
      # Liveness stays at the tight upstream default — the startupProbe owns the
      # grace, so loosening liveness would only weaken steady-state crash
      # detection. Pin the full budget (initialDelay/period/failureThreshold) so a
      # future change cannot silently re-delay or loosen liveness.
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5

  # All three probes live behind {{- if .Values.metrics.enabled }} — :8085 only
  # exists when metrics are on. Pin that the startupProbe follows the same gate as
  # liveness/readiness, so disabling metrics drops all probes together and never
  # leaves a startupProbe pointed at an unbound port.
  - it: omits all probes (including the startupProbe) when metrics are disabled
    template: charts/velero/templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: velero
    set:
      velero.metrics.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  # node-agent is a DaemonSet and ran BestEffort. A memory limit is what sets
  # memory.max on the pod cgroup, and the Talos userspace OOM handler (v1.12+)
  # only ever selects cgroups that lack it — so node-agent was an eviction
  # candidate on every node whatever caused the pressure, and killing it
  # mid-backup fails the backup.
  #
  # The limit is deliberately loose rather than fitted: measured usage is at
  # idle, and the agent streams volume data during a backup, which is exactly
  # when it must not be killed. Set from the umbrella values against the
  # vendored subchart, so an upstream bump that moves the key would render
  # nothing and leave no other trace; that is what this pins against.
  - it: node-agent declares a memory limit and request
    template: charts/velero/templates/node-agent-daemonset.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="node-agent")].resources.limits.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.containers[?(@.name=="node-agent")].resources.requests.memory
          value: 128Mi
