suite: piraeus webhooks on the way back from a migration

# The way back from hold or adopt is backend linstor with piraeus-operator
# still stopped, so the release still has to pass its webhooks. blockstor's
# CRDs carry helm.sh/resource-policy keep and stay when the release stops
# rendering them, which tells such a cluster apart from one blockstor never
# reached.

templates:
  - templates/piraeus-webhooks.yaml
release:
  name: linstor
  namespace: cozy-linstor
set:
  backend: linstor
kubernetesProvider:
  scheme:
    "apiextensions.k8s.io/v1/CustomResourceDefinition":
      gvr:
        group: apiextensions.k8s.io
        version: v1
        resource: customresourcedefinitions
      namespaced: false
  objects:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: controllerconfigs.blockstor.org

tests:
  - it: "carries the hooks under the LINSTOR backend for the way back"
    asserts:
      - hasDocuments:
          count: 7
      - isKind:
          of: Job
        documentSelector:
          path: metadata.name
          value: piraeus-webhooks-relax
      - isKind:
          of: Job
        documentSelector:
          path: metadata.name
          value: piraeus-webhooks-restore
