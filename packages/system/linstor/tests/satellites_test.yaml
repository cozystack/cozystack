suite: satellite pod resource limits

# The satellite DaemonSet ran BestEffort, which made it a standing victim for the
# Talos userspace OOM handler (v1.12+): that handler only ever kills cgroups with
# no memory.max, and picks its victim by QoS class rather than by what caused the
# pressure. A tenant workload thrashing against its own limit would get the
# satellite killed, taking DRBD connections on that node down with it.
#
# Every container in the pod needs a limit for the pod cgroup to get memory.max,
# so the plunger sidecars are pinned alongside the satellite itself — one
# limit-free sidecar is enough to put the whole pod back in the victim set.
#
# Note this is the opposite call from linstor-controller, which cluster_test.yaml
# pins as deliberately limit-free (a JVM that must not be OOM-killed mid-operation).

templates:
  - templates/satellites-cozy.yaml
  - templates/satellites-no-drbd.yaml
  - templates/satellites-plunger.yaml

tests:
  - it: satellite declares a memory limit and request
    template: templates/satellites-cozy.yaml
    asserts:
      - equal:
          path: spec.podTemplate.spec.containers[?(@.name=="linstor-satellite")].resources.limits.memory
          value: 2Gi
      - equal:
          path: spec.podTemplate.spec.containers[?(@.name=="linstor-satellite")].resources.requests.memory
          value: 128Mi

  - it: plunger sidecars declare memory limits
    template: templates/satellites-plunger.yaml
    asserts:
      - equal:
          path: spec.podTemplate.spec.containers[?(@.name=="plunger")].resources.limits.memory
          value: 128Mi
      - equal:
          path: spec.podTemplate.spec.containers[?(@.name=="drbd-logger")].resources.limits.memory
          value: 128Mi

  # `drbd.enabled: false` is the difference between working storage and NO
  # storage on a substrate without DRBD, not a logging preference: the sidecar
  # exits immediately when the module is absent, the satellite pod is then never
  # Ready, and piraeus consequently registers zero nodes — so every PVC hangs
  # Pending behind a cluster that otherwise looks healthy.
  #
  # Asserted by container count and name rather than a negated `contains`: a
  # negation against a path that no longer resolves passes vacuously, so it would
  # go on passing if the containers list vanished entirely.
  - it: both plunger sidecars are present by default
    template: templates/satellites-plunger.yaml
    asserts:
      - lengthEqual:
          path: spec.podTemplate.spec.containers
          count: 2
      - equal:
          path: spec.podTemplate.spec.containers[0].name
          value: plunger
      - equal:
          path: spec.podTemplate.spec.containers[1].name
          value: drbd-logger

  - it: drbd-logger is omitted when the substrate cannot run DRBD
    template: templates/satellites-plunger.yaml
    set:
      drbd.enabled: false
    asserts:
      - lengthEqual:
          path: spec.podTemplate.spec.containers
          count: 1
      - equal:
          path: spec.podTemplate.spec.containers[0].name
          value: plunger
      # the surviving sidecar must keep its limit, or the whole pod re-enters the
      # Talos OOM handler's victim set that this suite exists to guard
      - equal:
          path: spec.podTemplate.spec.containers[0].resources.limits.memory
          value: 128Mi

  - it: no DaemonSet deletion patch is emitted on a DRBD-capable substrate
    template: templates/satellites-no-drbd.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: drbd-logger is deleted from the effective DaemonSet without DRBD
    template: templates/satellites-no-drbd.yaml
    set:
      drbd.enabled: false
    asserts:
      - isKind:
          of: LinstorSatelliteConfiguration
      - equal:
          path: metadata.name
          value: cozystack-no-drbd
      - equal:
          path: spec.patches[0].target
          value:
            group: apps
            version: v1
            kind: DaemonSet
            name: linstor-satellite
      - matchRegex:
          path: spec.patches[0].patch
          pattern: '(?s)containers:\s*- name: drbd-logger\s*\$patch: delete'
