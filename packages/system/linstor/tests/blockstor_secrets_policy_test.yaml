# RBAC cannot limit a Secret create by name, so this policy is what keeps a
# compromised blockstor pod from minting a token Secret for one of piraeus's
# ServiceAccounts under a name its get already covers. It must reach nothing
# but blockstor's own creates in its own namespace.
suite: blockstor Secret create policy
templates:
  - templates/blockstor-secrets-policy.yaml
release:
  name: linstor
  namespace: cozy-linstor
# helm unittest's default API versions do not include it, and the template
# renders only where the cluster serves it.
capabilities:
  apiVersions:
    - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
set:
  backend: blockstor
tests:
  - it: renders nothing under the LINSTOR backend
    set:
      backend: linstor
    asserts:
      - hasDocuments:
          count: 0

  - it: matches only Secret creates in the release namespace
    documentSelector:
      path: kind
      value: ValidatingAdmissionPolicy
    asserts:
      - equal:
          path: spec.matchConstraints
          value:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: cozy-linstor
            resourceRules:
              - apiGroups: [""]
                apiVersions: [v1]
                operations: [CREATE]
                resources: [secrets]
      - equal:
          path: spec.failurePolicy
          value: Fail

  - it: applies only to the blockstor ServiceAccounts of the release namespace
    documentSelector:
      path: kind
      value: ValidatingAdmissionPolicy
    asserts:
      - lengthEqual:
          path: spec.matchConditions
          count: 1
      - equal:
          path: spec.matchConditions[0].expression
          value: >-
            request.userInfo.username in [
              'system:serviceaccount:cozy-linstor:blockstor-apiserver',
              'system:serviceaccount:cozy-linstor:blockstor-controller',
              'system:serviceaccount:cozy-linstor:blockstor-satellite'
            ]

  - it: admits only the keyring and the unlock Secret, each with its type
    documentSelector:
      path: kind
      value: ValidatingAdmissionPolicy
    asserts:
      - lengthEqual:
          path: spec.validations
          count: 1
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "object.metadata.name == 'blockstor-master-key' &&\\s+has\\(object.type\\) && object.type == 'blockstor.org/master-key'"
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "object.metadata.name == 'blockstor-unlock' &&\\s+\\(!has\\(object.type\\) \\|\\| object.type == 'Opaque'\\)"
      - notMatchRegex:
          path: spec.validations[0].expression
          pattern: linstor-passphrase

  - it: denies through a binding without its own selector
    documentSelector:
      path: kind
      value: ValidatingAdmissionPolicyBinding
    asserts:
      - equal:
          path: spec
          value:
            policyName: blockstor-secret-create
            validationActions: [Deny]
