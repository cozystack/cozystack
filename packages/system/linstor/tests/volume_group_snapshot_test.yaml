suite: VolumeGroupSnapshot support for linstor-csi

# piraeus-operator decides FEATURE_GATE_CSI_VOLUME_GROUP_SNAPSHOT for the
# csi-snapshotter sidecar from an API probe it runs only at startup, so an
# operator that started before snapshot-controller served the group snapshot
# API leaves the gate off. The podTemplate always sets it, on only when all
# three groupsnapshot.storage.k8s.io/v1 kinds are served, the version
# csi-snapshotter and snapshot-controller read. The VolumeGroupSnapshotClass
# carries the label Velero selects a group snapshot class by, and is not
# rendered while the API is missing, where it would fail the upgrade.

tests:
  - it: "csi-snapshotter gets the CSIVolumeGroupSnapshot gate once v1 is served"
    template: templates/cluster.yaml
    capabilities: &v1
      apiVersions:
        - groupsnapshot.storage.k8s.io/v1/VolumeGroupSnapshot
        - groupsnapshot.storage.k8s.io/v1/VolumeGroupSnapshotContent
        - groupsnapshot.storage.k8s.io/v1/VolumeGroupSnapshotClass
    asserts:
      - contains:
          path: spec.csiController.podTemplate.spec.containers
          content:
            name: csi-snapshotter
            env:
              - name: FEATURE_GATE_CSI_VOLUME_GROUP_SNAPSHOT
                value: "true"

  - it: "csi-snapshotter gate is kept when strict topology is disabled"
    template: templates/cluster.yaml
    capabilities: *v1
    set:
      linstorCSI:
        strictTopology: false
    asserts:
      - contains:
          path: spec.csiController.podTemplate.spec.containers
          content:
            name: csi-snapshotter
            env:
              - name: FEATURE_GATE_CSI_VOLUME_GROUP_SNAPSHOT
                value: "true"

  - it: "csi-snapshotter gate is off when only VolumeGroupSnapshot serves v1"
    template: templates/cluster.yaml
    capabilities:
      apiVersions:
        - groupsnapshot.storage.k8s.io/v1/VolumeGroupSnapshot
    asserts:
      - contains:
          path: spec.csiController.podTemplate.spec.containers
          content:
            name: csi-snapshotter
            env:
              - name: FEATURE_GATE_CSI_VOLUME_GROUP_SNAPSHOT
                value: "false"

  - it: "csi-snapshotter gate is off when the API is served at v1beta2 only"
    template: templates/cluster.yaml
    capabilities:
      apiVersions:
        - groupsnapshot.storage.k8s.io/v1beta2/VolumeGroupSnapshot
        - groupsnapshot.storage.k8s.io/v1beta2/VolumeGroupSnapshotContent
        - groupsnapshot.storage.k8s.io/v1beta2/VolumeGroupSnapshotClass
    asserts:
      - contains:
          path: spec.csiController.podTemplate.spec.containers
          content:
            name: csi-snapshotter
            env:
              - name: FEATURE_GATE_CSI_VOLUME_GROUP_SNAPSHOT
                value: "false"

  - it: "csi-snapshotter gate is off when the API is not served at all"
    template: templates/cluster.yaml
    asserts:
      - contains:
          path: spec.csiController.podTemplate.spec.containers
          content:
            name: csi-snapshotter
            env:
              - name: FEATURE_GATE_CSI_VOLUME_GROUP_SNAPSHOT
                value: "false"

  - it: "linstor VolumeGroupSnapshotClass is the default class Velero selects"
    template: templates/volumegroupsnapshotclass.yaml
    capabilities: *v1
    asserts:
      - isKind:
          of: VolumeGroupSnapshotClass
      - isAPIVersion:
          of: groupsnapshot.storage.k8s.io/v1
      - equal:
          path: driver
          value: linstor.csi.linbit.com
      - equal:
          path: deletionPolicy
          value: Delete
      - equal:
          path: metadata.labels["velero.io/csi-volumegroupsnapshot-class"]
          value: "true"
      - equal:
          path: metadata.annotations["groupsnapshot.storage.kubernetes.io/is-default-class"]
          value: "true"

  - it: "no VolumeGroupSnapshotClass while v1 is not served"
    template: templates/volumegroupsnapshotclass.yaml
    asserts:
      - hasDocuments:
          count: 0
