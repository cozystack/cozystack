suite: blockstor workloads
release:
  name: linstor
  namespace: cozy-linstor
set:
  backend: blockstor
tests:
  # The plain-HTTP listener authenticates nobody. On the pod network any pod
  # that can route to the apiserver would get the whole LINSTOR API, deletes
  # included, around the mTLS on :3371.
  - it: binds the apiserver's plain-HTTP listener to loopback
    template: templates/blockstor-apiserver.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --rest-bind-address=127.0.0.1:3370
      - notContains:
          path: spec.template.spec.containers[0].ports
          content: {name: rest-debug, containerPort: 3370}

  # The controller runs without leader election, so two pods side by side
  # would both reconcile the same objects.
  - it: never runs two controllers during a rollout
    template: templates/blockstor-controller.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.replicas
          value: 1

  - it: lets the satellite delete nothing but PhysicalDevices
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [blockstor.org]
            resources: [physicaldevices]
            verbs: [create, update, patch, delete]
      - contains:
          path: rules
          content:
            apiGroups: [blockstor.org]
            resources: [nodes, resources, snapshots, storagepools]
            verbs: [update, patch]
      - lengthEqual:
          path: rules
          count: 7

  - it: gives the satellite no Secret or Lease access at cluster scope
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, list, watch]
      - notContains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, list, watch, create, update, patch, delete]

  - it: lets the satellite read only blockstor's Secrets in its own namespace
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: cozy-linstor
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              resourceNames: [blockstor-master-key, blockstor-unlock, linstor-passphrase]
              verbs: [get]

  - it: gives the controller no Secret access at cluster scope
    template: templates/blockstor-controller.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
          any: true

  - it: lets the controller read and write only blockstor's Secrets in its own namespace
    template: templates/blockstor-controller.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: cozy-linstor
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              resourceNames: [blockstor-master-key, blockstor-unlock, linstor-passphrase]
              verbs: [get, update]
            - apiGroups: [""]
              resources: [secrets]
              verbs: [create]

  - it: binds the controller's Secret Role to its ServiceAccount
    template: templates/blockstor-controller.yaml
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: roleRef.name
          value: blockstor-controller-secrets
      - equal:
          path: subjects[0].name
          value: blockstor-controller

  - it: tells the controller its namespace, where the keyring lives
    template: templates/blockstor-controller.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAMESPACE
            valueFrom: {fieldRef: {fieldPath: metadata.namespace}}

  - it: binds the satellite's Secret Role to its ServiceAccount
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: roleRef.name
          value: blockstor-satellite-secrets
      - equal:
          path: subjects[0].name
          value: blockstor-satellite

  - it: gives the controller no Lease access
    template: templates/blockstor-controller.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, list, watch, create, update, patch, delete]

  - it: closes the satellite's ports to the world
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: CiliumClusterwideNetworkPolicy
    asserts:
      - equal:
          path: spec.ingressDeny[0].fromEntities
          value: [world]
      - equal:
          path: spec.ingressDeny[0].toPorts[0].ports
          value:
            - port: "3372"
            - port: "9101"
            - port: "8080"

  # The snapshot stream runs over mutual TLS: without the Secret mounted and
  # the three flags the satellite serves no stream at all.
  - it: gives the satellite the snapshot stream's TLS
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --stream-tls-cert-file=/etc/blockstor/stream-tls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --stream-tls-key-file=/etc/blockstor/stream-tls/tls.key
      - contains:
          path: spec.template.spec.containers[0].args
          content: --stream-tls-ca-file=/etc/blockstor/stream-tls/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: stream-tls, mountPath: /etc/blockstor/stream-tls, readOnly: true}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: stream-tls
            secret:
              secretName: blockstor-satellite-stream-tls

  # The stream CA stays apart from the API CA: a stream certificate is a
  # client certificate the apiserver's mutual-TLS listener would otherwise
  # accept.
  - it: issues the satellite stream certificate from its own CA
    template: templates/blockstor-apiserver-tls.yaml
    documentSelector:
      path: metadata.name
      value: blockstor-satellite-stream
    asserts:
      - equal:
          path: spec.secretName
          value: blockstor-satellite-stream-tls
      - equal:
          path: spec.issuerRef.name
          value: blockstor-stream-ca
      - equal:
          path: spec.dnsNames
          value: [blockstor-satellite]
      - contains:
          path: spec.usages
          content: server auth
      - contains:
          path: spec.usages
          content: client auth

  - it: roots the stream CA in the bootstrapper, not in the API CA
    template: templates/blockstor-apiserver-tls.yaml
    documentSelector:
      path: spec.commonName
      value: blockstor-stream-ca
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.isCA
          value: true
      - equal:
          path: spec.issuerRef.name
          value: ca-bootstrapper

  # A kind added to the group later must not be granted by omission, so the
  # roles are pinned whole: a wildcard or a new kind shows up as a diff here.
  - it: pins the controller ClusterRole rule by rule
    template: templates/blockstor-controller.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: ['']
              resources: [events]
              verbs: [create, patch]
            - apiGroups: [events.k8s.io]
              resources: [events]
              verbs: [create, patch]
            - apiGroups: ['']
              resources: [nodes]
              verbs: [get, list, watch]
            - apiGroups: [blockstor.org]
              resources: [controllerconfigs]
              verbs: [get, list, watch]
            - apiGroups: [blockstor.org]
              resources: [nodes, resourcedefinitions, resourcegroups, resources, snapshots, storagepools]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: [blockstor.org]
              resources: [nodes/finalizers, resourcedefinitions/finalizers, resourcegroups/finalizers,
                resources/finalizers, snapshots/finalizers, storagepools/finalizers]
              verbs: [update]
            - apiGroups: [blockstor.org]
              resources: [nodes/status, resourcedefinitions/status, resourcegroups/status, resources/status,
                snapshots/status, storagepools/status]
              verbs: [get, update, patch]

  - it: pins the satellite ClusterRole rule by rule
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: ['']
              resources: [events]
              verbs: [create, patch]
            - apiGroups: [events.k8s.io]
              resources: [events]
              verbs: [create, patch]
            - apiGroups: ['']
              resources: [nodes]
              verbs: [get, list, watch]
            - apiGroups: [blockstor.org]
              resources: [controllerconfigs, nodes, physicaldevices, resourcedefinitions, resourcegroups,
                resources, snapshots, storagepools]
              verbs: [get, list, watch]
            - apiGroups: [blockstor.org]
              resources: [physicaldevices]
              verbs: [create, update, patch, delete]
            - apiGroups: [blockstor.org]
              resources: [nodes, resources, snapshots, storagepools]
              verbs: [update, patch]
            - apiGroups: [blockstor.org]
              resources: [nodes/status, physicaldevices/status, resources/status, snapshots/status,
                storagepools/status, nodes/finalizers, physicaldevices/finalizers, resources/finalizers,
                snapshots/finalizers, storagepools/finalizers]
              verbs: [get, update, patch]

  # global_common.conf is a subPath mount, which is never refreshed in place.
  - it: rolls the satellites when global_common.conf changes
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/drbd-conf"]
          pattern: '^[0-9a-f]{64}$'

  # The satellite is Ready once its caches sync, minutes before its first
  # adjust pass is done; the Kubernetes default would move to the next node
  # right then.
  - it: rolls the satellites one node at a time with a pause after Ready
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 120
      - equal:
          path: spec.updateStrategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
              maxSurge: 0

  # Two satellites on one node would both drive its DRBD resources.
  - it: never surges a second satellite onto a node
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    set:
      blockstorSatellite:
        minReadySeconds: 0
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 0
      - equal:
          path: spec.updateStrategy.rollingUpdate
          value:
            maxUnavailable: 1
            maxSurge: 0

  - it: refuses a surge pod
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.updateStrategy.rollingUpdate.maxSurge: 1
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.updateStrategy.rollingUpdate.maxSurge can only be 0, got 1'

  # Several nodes at once run their first adjust passes together.
  - it: refuses a rollout wider than one node
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.updateStrategy.rollingUpdate.maxUnavailable: 5
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.updateStrategy.rollingUpdate.maxUnavailable can only be 1, got 5'

  - it: refuses a percentage rollout
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.updateStrategy.rollingUpdate.maxUnavailable: 50%
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.updateStrategy.rollingUpdate.maxUnavailable can only be 1, got "50%"'

  # With maxSurge 0 the apiserver refuses it, after the chart's own checks.
  - it: refuses a rollout that replaces no node
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.updateStrategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.updateStrategy.rollingUpdate.maxUnavailable can only be 1, got 0'

  # OnDelete alone: the API keeps a rollingUpdate block it would ignore.
  - it: replaces a satellite only when its pod is deleted under OnDelete
    template: templates/blockstor-satellite.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    set:
      blockstorSatellite.updateStrategy.type: OnDelete
    asserts:
      - equal:
          path: spec.updateStrategy
          value:
            type: OnDelete

  - it: refuses an update strategy the DaemonSet does not have
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.updateStrategy.type: Recreate
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.updateStrategy.type must be "RollingUpdate" or "OnDelete", got "Recreate"'

  - it: refuses a negative minReadySeconds
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.minReadySeconds: -1
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.minReadySeconds must be a whole number of seconds, 0 or more, got -1'

  - it: refuses a minReadySeconds that is not a number
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.minReadySeconds: 2m
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.minReadySeconds must be a whole number of seconds, 0 or more, got "2m"'

  # --set hands a decimal over as a string; the message must still say
  # what is wrong with it.
  - it: refuses a decimal minReadySeconds given as a string
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.minReadySeconds: "1.5"
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.minReadySeconds must be a whole number of seconds, 0 or more, got "1.5"'

  - it: refuses a decimal minReadySeconds
    template: templates/blockstor-satellite.yaml
    set:
      blockstorSatellite.minReadySeconds: 1.5
    asserts:
      - failedTemplate:
          errorMessage: 'linstor: blockstorSatellite.minReadySeconds must be a whole number of seconds, 0 or more, got 1.5'

  # A SIGTERM must not cut a detached rollback short: the pod outlives the
  # REST server's shutdown window.
  - it: gives the controller time to finish a rollback on shutdown
    template: templates/blockstor-controller.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 21

  - it: gives the apiserver time to finish a rollback on shutdown
    template: templates/blockstor-apiserver.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 21
