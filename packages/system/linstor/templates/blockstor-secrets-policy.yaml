{{- if and (eq .Values.backend "blockstor") (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- $sa := printf "system:serviceaccount:%s:" .Release.Namespace }}
---
{{- /*
   RBAC cannot limit create by name, and the blockstor controller and
   apiserver need it for the keyring and the generated unlock Secret. A
   compromised pod could otherwise create a Secret under a name its
   name-limited get already covers but that does not exist yet, such as
   linstor-passphrase on a cluster that never set one, typed
   kubernetes.io/service-account-token for one of piraeus's ServiceAccounts
   in this namespace, and read the token back. This admits a Secret create
   by a blockstor ServiceAccount only for the two Secrets blockstor creates,
   each with the type blockstor gives it; the passphrase Secret is input
   that blockstor never writes.

   It matches nothing but CREATE of Secrets in this namespace by these
   ServiceAccounts, so piraeus, cert-manager and everyone else are outside
   it, as are updates, which RBAC already limits by name. The satellite
   holds no create; it is listed so a later grant does not reopen the gap. */}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: blockstor-secret-create
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [secrets]
  matchConditions:
    - name: blockstor-service-account
      expression: >-
        request.userInfo.username in [
          '{{ $sa }}blockstor-apiserver',
          '{{ $sa }}blockstor-controller',
          '{{ $sa }}blockstor-satellite'
        ]
  validations:
    - expression: >-
        (object.metadata.name == 'blockstor-master-key' &&
          has(object.type) && object.type == 'blockstor.org/master-key') ||
        (object.metadata.name == 'blockstor-unlock' &&
          (!has(object.type) || object.type == 'Opaque'))
      message: >-
        blockstor may create only the Secrets blockstor-master-key (type
        blockstor.org/master-key) and blockstor-unlock (type Opaque)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blockstor-secret-create
spec:
  policyName: blockstor-secret-create
  validationActions: [Deny]
{{- end }}
