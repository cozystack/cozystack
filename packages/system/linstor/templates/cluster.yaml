{{- if eq .Values.backend "blockstor" }}
apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
  labels:
    platform.cozystack.io/no-delete: "true"
spec:
  #nodeSelector:
  #  node-role.kubernetes.io/linstor: ""
  #
  # External mode: piraeus-operator does NOT run its own in-cluster Java
  # linstor-controller. Instead linstor-csi talks to the blockstor
  # apiserver, which serves the LINSTOR-compatible REST API. The
  # apiserver Service lives in this namespace and exposes ONLY the mTLS
  # port :3371 (RequireAndVerifyClientCert). The externalController.url
  # below MUST match the blockstor-apiserver Service DNS and one of the
  # serving-cert SANs (see blockstor-apiserver-tls.yaml).
  externalController:
    url: https://blockstor-apiserver.cozy-linstor.svc:3371
  # apiTLS.certManager makes the operator issue linstor-csi-{controller,node}-tls
  # client-cert Secrets from the blockstor-api-ca Issuer (created in
  # blockstor-apiserver-tls.yaml). The operator then wires
  # LS_USER_CERTIFICATE / LS_USER_KEY / LS_ROOT_CA onto the CSI pods so
  # they present a client cert chained to blockstor-api-ca to the
  # apiserver's RequireAndVerifyClientCert :3371 listener.
  apiTLS:
    certManager:
      name: blockstor-api-ca
      kind: Issuer
    # The operator ALSO talks to the API itself, to probe
    # /v1/controller/version before every LinstorCluster and
    # LinstorSatellite reconcile, and that client is not one of the ones
    # certManager provisions here: in external mode piraeus-operator
    # returns from kustomizeControllerResources before it emits any
    # controller-side Certificate, so the secret this name points at is
    # the operator's to find, not to create.
    #
    # Left at its default the operator looks for linstor-client-tls,
    # finds nothing, and falls back to a client with the system roots —
    # which cannot verify a serving cert signed by blockstor-api-ca. The
    # probe then fails with "certificate signed by unknown authority",
    # and because it runs first, the reconcile stops there: satellite
    # DaemonSets freeze at whatever spec they last had, keeping volumes
    # and mounts the chart no longer renders. Nothing shows until a pod
    # is recreated, and then that node loses its satellite for good.
    #
    # Point it at the client cert this package already issues from the
    # same CA. Its ca.crt is what the operator validates the apiserver
    # against; the cert itself satisfies the :3371 listener, which is
    # RequireAndVerifyClientCert.
    clientSecretName: blockstor-apiserver-client-tls
  # Controller-level DRBD properties. piraeus-operator applies these to the
  # external controller (the blockstor apiserver) over the LINSTOR REST API,
  # so DRBD tuning is honoured regardless of who serves the API. In external
  # mode there is no in-cluster linstor-controller Deployment (and thus no
  # controller podTemplate / plunger sidecar) — blockstor serves the API.
  properties:
  {{- if .Values.linstor.autoDiskful.enabled }}
  - name: DrbdOptions/auto-diskful
    value: {{ .Values.linstor.autoDiskful.minutes | quote }}
  - name: DrbdOptions/auto-diskful-allow-cleanup
    value: {{ .Values.linstor.autoDiskful.allowCleanup | quote }}
  {{- end }}
  - name: DrbdOptions/Net/verify-alg
    value: "crc32c"
  - name: DrbdOptions/Net/connect-int
    value: "15"
  - name: DrbdOptions/Net/ping-int
    value: "15"
  - name: DrbdOptions/Net/ping-timeout
    value: "20"
  - name: DrbdOptions/Net/timeout
    value: "100"
  csiController:
    podTemplate:
      spec:
        initContainers:
        - name: linstor-wait-api-online
          image: {{ .Values.linstorCSI.image.repository }}:{{ .Values.linstorCSI.image.tag }}
        containers:
        - name: linstor-csi
          image: {{ .Values.linstorCSI.image.repository }}:{{ .Values.linstorCSI.image.tag }}
  csiNode:
    podTemplate:
      spec:
        initContainers:
        - name: linstor-wait-node-online
          image: {{ .Values.linstorCSI.image.repository }}:{{ .Values.linstorCSI.image.tag }}
        containers:
        - name: linstor-csi
          image: {{ .Values.linstorCSI.image.repository }}:{{ .Values.linstorCSI.image.tag }}
  patches:
    - target:
        kind: Deployment
        name: linstor-csi-controller
      patch: |-
        - op: add
          path: /metadata/annotations/reloader.stakater.com~1auto
          value: "true"
    - target:
        kind: DaemonSet
        name: linstor-csi-node
      patch: |-
        - op: add
          path: /metadata/annotations/reloader.stakater.com~1auto
          value: "true"
{{- else }}
apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
  labels:
    platform.cozystack.io/no-delete: "true"
spec:
  #nodeSelector:
  #  node-role.kubernetes.io/linstor: ""
  internalTLS:
    certManager:
      name: linstor-internal-ca
      kind: Issuer
  apiTLS:
    certManager:
      name: linstor-api-ca
      kind: Issuer
  properties:
  {{- if .Values.linstor.autoDiskful.enabled }}
  - name: DrbdOptions/auto-diskful
    value: {{ .Values.linstor.autoDiskful.minutes | quote }}
  - name: DrbdOptions/auto-diskful-allow-cleanup
    value: {{ .Values.linstor.autoDiskful.allowCleanup | quote }}
  {{- end }}
  - name: DrbdOptions/Net/verify-alg
    value: "crc32c"
  - name: DrbdOptions/Net/connect-int
    value: "15"
  - name: DrbdOptions/Net/ping-int
    value: "15"
  - name: DrbdOptions/Net/ping-timeout
    value: "20"
  - name: DrbdOptions/Net/timeout
    value: "100"
  controller:
    enabled: true
    podTemplate:
      spec:
        containers:
        - name: linstor-controller
          image: {{ .Values.piraeusServer.image.repository }}:{{ .Values.piraeusServer.image.tag }}
          # Guarantee CPU/memory so the JVM keeps answering its /health probe
          # under node contention. Requests only — see values.yaml controller.*.
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          # Partial override: piraeus-operator merges podTemplate as a strategic
          # merge patch, so only these timing fields change. The operator's
          # httpGet (GET /health on the api port) is preserved as-is.
          livenessProbe:
            timeoutSeconds: {{ .Values.controller.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.controller.livenessProbe.failureThreshold }}
        - name: plunger
          image: {{ .Values.piraeusServer.image.repository }}:{{ .Values.piraeusServer.image.tag }}
          command:
          - "/scripts/plunger-controller.sh"
          securityContext:
            capabilities:
              drop:
              - ALL
            # make some room for live debugging
            readOnlyRootFilesystem: false
          volumeMounts:
          - mountPath: /etc/linstor/client
            name: client-tls
            readOnly: true
          - mountPath: /etc/linstor
            name: etc-linstor
            readOnly: true
          - mountPath: /scripts
            name: script-volume
            readOnly: true
        volumes:
        - name: script-volume
          configMap:
            name: linstor-plunger
            defaultMode: 0755
  csiController:
    podTemplate:
      spec:
        initContainers:
        - name: linstor-wait-api-online
          image: {{ .Values.linstorCSI.image.repository }}:{{ .Values.linstorCSI.image.tag }}
        containers:
        - name: linstor-csi
          image: {{ .Values.linstorCSI.image.repository }}:{{ .Values.linstorCSI.image.tag }}
  csiNode:
    podTemplate:
      spec:
        initContainers:
        - name: linstor-wait-node-online
          image: {{ .Values.linstorCSI.image.repository }}:{{ .Values.linstorCSI.image.tag }}
        containers:
        - name: linstor-csi
          image: {{ .Values.linstorCSI.image.repository }}:{{ .Values.linstorCSI.image.tag }}
  patches:
    - target:
        kind: Deployment
        name: linstor-controller
      patch: |-
        - op: add
          path: /metadata/annotations/reloader.stakater.com~1auto
          value: "true"
    - target:
        kind: Deployment
        name: linstor-csi-controller
      patch: |-
        - op: add
          path: /metadata/annotations/reloader.stakater.com~1auto
          value: "true"
    - target:
        kind: DaemonSet
        name: linstor-csi-node
      patch: |-
        - op: add
          path: /metadata/annotations/reloader.stakater.com~1auto
          value: "true"
{{- end }}
