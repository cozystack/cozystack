{{- if eq .Values.backend "blockstor" }}
---
{{- /*
   blockstor controller — runs the reconcilers for the blockstor.org
   CRDs (ResourceDefinitions / Resources / Snapshots / StoragePools /
   Nodes). The REST API is split out into the separate apiserver
   Deployment; the controller runs with --enable-rest-api=false. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blockstor-controller
  namespace: {{ .Release.Namespace }}
---
{{- /*
   Cluster-wide read on Kubernetes Nodes and the blockstor.org kinds
   the reconcilers manage, as blockstor's own config/rbac/role.yaml grants
   them, kind by kind so a kind added to the group later is not granted by
   omission. No leases: the controller runs without leader election. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blockstor-controller
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [blockstor.org]
    resources: [controllerconfigs]
    verbs: [get, list, watch]
  - apiGroups: [blockstor.org]
    resources: [nodes, resourcedefinitions, resourcegroups, resources, snapshots, storagepools]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blockstor.org]
    resources:
      - nodes/finalizers
      - resourcedefinitions/finalizers
      - resourcegroups/finalizers
      - resources/finalizers
      - snapshots/finalizers
      - storagepools/finalizers
    verbs: [update]
  - apiGroups: [blockstor.org]
    resources:
      - nodes/status
      - resourcedefinitions/status
      - resourcegroups/status
      - resources/status
      - snapshots/status
      - storagepools/status
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blockstor-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blockstor-controller
subjects:
  - kind: ServiceAccount
    name: blockstor-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockstor-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: blockstor-controller
    app.kubernetes.io/component: blockstor-controller
spec:
  replicas: 1
  {{- /*
     One reconciler at a time. The binary runs without leader election, so a
     rolling update would run the old and the new pod side by side against the
     same CRDs; Recreate stops the old one before the new one starts. */}}
  strategy:
    type: Recreate
  selector: {matchLabels: {app: blockstor-controller}}
  template:
    metadata:
      labels:
        app: blockstor-controller
        app.kubernetes.io/component: blockstor-controller
    spec:
      serviceAccountName: blockstor-controller
      containers:
        - name: manager
          image: {{ .Values.blockstorController.image.repository }}:{{ .Values.blockstorController.image.tag }}
          imagePullPolicy: IfNotPresent
          args:
            {{- /*
               REST API lives in the separate apiserver Deployment —
               controller only runs reconcilers. */}}
            - --enable-rest-api=false
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --leader-elect=false
          ports:
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
{{- end }}
