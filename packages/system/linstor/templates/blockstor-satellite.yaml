{{- define "blockstor.satellite.drbdGlobalConf" -}}
# blockstor satellite — global_common.conf.
# Kept minimal: per-resource tuning lives in the rendered .res
# files, not here. Mirrors the drbd-utils trixie default.
global {
    usage-count no;
    udev-always-use-vnr;
}
common {
    handlers {}
    startup {}
    options {}
    disk {}
    net {}
}
{{- end }}
{{- if eq .Values.backend "blockstor" }}
---
{{- /*
   blockstor-satellite DaemonSet. Runs on every node, drives drbdadm +
   ZFS/LVM reconcile, registers its StoragePools (declared via the
   StoragePool CRDs) and writes node-scoped Status back to the apiserver.

   This DaemonSet loads no kernel module and mounts nothing from
   /run/systemd, so it needs no Talos-specific patch. It expects DRBD to be
   loaded already: on Talos by the siderolabs/drbd extension, on generic
   Linux by the drbd-module-loader init container of piraeus's own
   satellite pod on the same node, which nothing here orders this pod
   after. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blockstor-satellite
  namespace: {{ .Release.Namespace }}
---
{{- /*
   /etc/drbd.d is a hostPath bind (below), which hides the
   global_common.conf baked into the image. drbdadm reads that file on
   every invocation, so it is mounted back on top of the bind by subPath. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: blockstor-satellite-drbd-conf
  namespace: {{ .Release.Namespace }}
data:
  global_common.conf: |
{{ include "blockstor.satellite.drbdGlobalConf" . | indent 4 }}
---
{{- /*
   What the satellite writes, and no more. It creates and deletes only the
   PhysicalDevices it discovers; on Nodes, Resources, Snapshots and
   StoragePools it updates props and finalizers and server-side-applies the
   SkipDisk prop, which is a patch; everything else it reads. Kubernetes
   Nodes are read for their InternalIP. No leases: it runs no leader
   election. Secrets are in the namespaced Role below. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blockstor-satellite
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [blockstor.org]
    resources:
      - controllerconfigs
      - nodes
      - physicaldevices
      - resourcedefinitions
      - resourcegroups
      - resources
      - snapshots
      - storagepools
    verbs: [get, list, watch]
  - apiGroups: [blockstor.org]
    resources: [physicaldevices]
    verbs: [create, update, patch, delete]
  - apiGroups: [blockstor.org]
    resources: [nodes, resources, snapshots, storagepools]
    verbs: [update, patch]
  - apiGroups: [blockstor.org]
    resources:
      - nodes/status
      - physicaldevices/status
      - resources/status
      - snapshots/status
      - storagepools/status
      - nodes/finalizers
      - physicaldevices/finalizers
      - resources/finalizers
      - snapshots/finalizers
      - storagepools/finalizers
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blockstor-satellite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blockstor-satellite
subjects:
  - kind: ServiceAccount
    name: blockstor-satellite
    namespace: {{ .Release.Namespace }}
---
{{- /*
   The satellite reads one Secret, the LUKS passphrase, in its own
   namespace, with a direct GET rather than through a cache, so a
   namespaced get is all it needs. A privileged pod on every node holding
   a token that reads every Secret in the cluster would hand any node
   compromise every tenant's credentials. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blockstor-satellite-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blockstor-satellite-secrets
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blockstor-satellite-secrets
subjects:
  - kind: ServiceAccount
    name: blockstor-satellite
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: blockstor-satellite
  namespace: {{ .Release.Namespace }}
  labels:
    app: blockstor-satellite
    app.kubernetes.io/component: blockstor-satellite
spec:
  selector: {matchLabels: {app: blockstor-satellite}}
  template:
    metadata:
      labels:
        app: blockstor-satellite
        app.kubernetes.io/component: blockstor-satellite
      {{- /* The file is mounted by subPath, which Kubernetes never refreshes,
             so a change to it has to roll the pods. */}}
      annotations:
        checksum/drbd-conf: {{ include "blockstor.satellite.drbdGlobalConf" . | sha256sum }}
    spec:
      serviceAccountName: blockstor-satellite
      hostPID: true
      {{- /*
         hostNetwork so the container's hostname matches the node name
         (drbdadm picks the `on <node>` block by hostname) and the
         advertised endpoint equals the node IP. */}}
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      {{- /*
         Runs on every node, control-plane nodes included, which is what
         the tolerations above are for: storage lives wherever the DRBD
         module and a pool are, not on workers only.
         Short grace and no preStop drain: DRBD state lives in the host
         kernel and survives the pod. On startup the next satellite keeps
         every resource it finds with a usable disk or a live peer, and
         tears down the rest. */}}
      terminationGracePeriodSeconds: 10
      containers:
        - name: satellite
          image: {{ .Values.blockstorSatellite.image.repository }}:{{ .Values.blockstorSatellite.image.tag }}
          imagePullPolicy: IfNotPresent
          args:
            {{- /*
               drbd's /etc/drbd.conf includes /etc/drbd.d/*.res; the
               satellite writes rendered files there. The host backing
               is /var/lib/blockstor-drbd.d (writable on Talos; /etc is
               read-only). */}}
            - --state-dir=/etc/drbd.d
            {{- /*
               Storage pools come from StoragePool objects, not flags. */}}
            - --health-probe-bind-address=:9101
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          livenessProbe:
            httpGet: {path: /healthz, port: 9101}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 9101}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            privileged: true
          volumeMounts:
            {{- /*
               Plain bind of host /dev, no mountPropagation: the
               partitions `zpool create` makes appear in the host's
               devtmpfs, which is where libzfs opens them. */}}
            - {name: dev, mountPath: /dev}
            - {name: modules, mountPath: /lib/modules, readOnly: true}
            - {name: lvm-run, mountPath: /run/lvm}
            {{- /*
               Host udev database, which libzfs and libblkid look devices up in. */}}
            - {name: run-udev, mountPath: /run/udev, readOnly: true}
            - {name: state, mountPath: /var/lib/blockstor-satellite}
            - {name: pool, mountPath: /var/lib/blockstor-pool}
            {{- /*
               The satellite's own DRBD config dir on the host,
               /var/lib/blockstor-drbd.d, so its .res files never mix with
               another DRBD user's /etc/drbd.d. */}}
            - {name: drbd-cfg, mountPath: /etc/drbd.d}
            - name: drbd-global-conf
              mountPath: /etc/drbd.d/global_common.conf
              subPath: global_common.conf
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - {name: dev, hostPath: {path: /dev, type: Directory}}
        - {name: modules, hostPath: {path: /lib/modules}}
        - {name: lvm-run, hostPath: {path: /run/lvm, type: DirectoryOrCreate}}
        - {name: run-udev, hostPath: {path: /run/udev, type: Directory}}
        - {name: state, hostPath: {path: /var/lib/blockstor-satellite, type: DirectoryOrCreate}}
        - {name: pool, hostPath: {path: /var/lib/blockstor-pool, type: DirectoryOrCreate}}
        - {name: drbd-cfg, hostPath: {path: /var/lib/blockstor-drbd.d, type: DirectoryOrCreate}}
        - name: drbd-global-conf
          configMap:
            name: blockstor-satellite-drbd-conf
            items:
              - {key: global_common.conf, path: global_common.conf}
---
{{- /*
   blockstor-satellite runs on host networking and, in this release, listens
   on every address without authentication: 9100 serves snapshot streams to
   other satellites, 9101 its health probes, 8080 controller-runtime's
   metrics. None of them is for anything outside the cluster, so they are
   closed to the world the way restrict-drbd-reactor closes drbd-reactor's. */}}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: restrict-blockstor-satellite
spec:
  ingressDeny:
  - fromEntities:
    - world
    toPorts:
    - ports:
      - port: "9100"
      - port: "9101"
      - port: "8080"
  ingress:
  - fromEntities:
    - world
    - host
    - cluster
  nodeSelector:
    matchLabels: {}
{{- end }}
