# Talos compatibility for the satellite DaemonSet piraeus-operator
# generates. Deliberately NOT gated on .Values.backend: in external mode
# (backend: blockstor) there is no in-cluster linstor-controller, but
# piraeus still creates linstor-satellite.<node> DaemonSets, and on Talos
# they wedge at Init:0/3 without this patch —
#   MountVolume.SetUp failed for volume "run-systemd-system":
#   hostPath type check failed: /run/systemd/system/ is not a directory
# which then churns linstor-csi-node and blocks every PVC attach, while
# every HelmRelease still reports Ready.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: cozystack-talos
spec:
  patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: linstor-satellite
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: linstor-satellite
      spec:
        template:
          spec:
            initContainers:
            - name: drbd-shutdown-guard
              $patch: delete
            - name: drbd-module-loader
              $patch: delete
            volumes:
            - name: run-systemd-system
              $patch: delete
            - name: run-drbd-shutdown-guard
              $patch: delete
            - name: systemd-bus-socket
              $patch: delete
            - name: lib-modules
              $patch: delete
            - name: usr-src
              $patch: delete
            - name: etc-lvm-backup
              hostPath:
                path: /var/etc/lvm/backup
                type: DirectoryOrCreate
            - name: etc-lvm-archive
              hostPath:
                path: /var/etc/lvm/archive
                type: DirectoryOrCreate
