piraeusServer:
  image:
    repository: ghcr.io/cozystack/cozystack/piraeus-server
    tag: v1.6.0@sha256:70ddd1a66fbc1ea58078f4645fc572ab8e2e189dbb4d9a5f9ca43d5663106483
# Talos-specific workarounds (disable for generic Linux like Ubuntu/Debian)
talos:
  enabled: true
linstor:
  autoDiskful:
    enabled: true
    minutes: 30
    allowCleanup: true
linstorCSI:
  image:
    repository: ghcr.io/cozystack/cozystack/linstor-csi
    tag: v1.6.0@sha256:ae854423de62e94fb89b59d92c20da8939196e643e83b2d60d9f6915d5b0e55c
controller:
  # Resources for the linstor-controller JVM. The CPU request guarantees CPU
  # shares so the JVM can answer its GET /health liveness probe under node CPU
  # contention, and CPU is still deliberately left unlimited so a GC pause or a
  # burst of DRBD events is not throttled. The memory request is a conservative
  # starting estimate for the JVM heap + overhead; tune it to observed RSS.
  #
  # The memory limit is stated rather than omitted, and it has to stay above the
  # heap ceiling the image was built with. linstor-server bakes
  # `-Xms256M -Xmx8G -XX:+CrashOnOutOfMemoryError` into the generated
  # bin/Controller (build.gradle, jvmControllerOpts), nothing in this chart or in
  # piraeus-entry.sh overrides it, and a JVM given an explicit -Xmx never consults
  # its cgroup. So the process will grow to 8G of heap whatever memory.max says,
  # and a ceiling below that turns "the JVM crashes itself on OOM, having said so"
  # into "the kernel kills the storage control plane mid-operation". 10Gi is 8G of
  # heap plus room for metaspace, code cache, thread stacks and direct buffers.
  #
  # Leaving it unset is no longer the safer option it once was: cozystack-operator
  # maintains a LimitRange in every system namespace defaulting container memory
  # (cozystackOperator.systemNamespaceMemoryLimit, 4Gi by default), and a container
  # that declares no limit of its own is given that one — half this JVM's own heap
  # ceiling. Declaring the limit here is what keeps that default away from it.
  resources:
    requests:
      cpu: 250m
      memory: 700Mi
    limits:
      memory: 10Gi
  # Liveness-probe timing for the linstor-controller container. Only these timing
  # fields are overridden; the httpGet target (GET /health on the api port) is
  # supplied by piraeus-operator and intentionally left untouched. Relaxed from
  # the operator defaults (timeoutSeconds 1, failureThreshold 3) so a JVM GC
  # pause or CPU contention does not trip a kubelet liveness kill.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
