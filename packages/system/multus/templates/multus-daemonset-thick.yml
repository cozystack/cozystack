# Note:
#   This deployment file is designed for 'quickstart' of multus, easy installation to test it,
#   hence this deployment yaml does not care about following things intentionally.
#     - various configuration options
#     - minor deployment scenario
#     - upgrade/update/uninstall scenario
#   Multus team understand users deployment scenarios are diverse, hence we do not cover
#   comprehensive deployment scenario. We expect that it is covered by each platform deployment.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  scope: Namespaced
  names:
    plural: network-attachment-definitions
    singular: network-attachment-definition
    kind: NetworkAttachmentDefinition
    shortNames:
      - nad
      - net-attach-def
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: 'NetworkAttachmentDefinition is a CRD schema specified by the Network Plumbing
            Working Group to express the intent for attaching pods to one or more logical or physical
            networks. More information available at: https://github.com/k8snetworkplumbingwg/multi-net-spec'
          type: object
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this represen
                tation of an object. Servers should convert recognized schemas to the
                latest internal value, and may reject unrecognized values. More info:
                https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this
                object represents. Servers may infer this from the endpoint the client
                submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: 'NetworkAttachmentDefinition spec defines the desired state of a network attachment'
              type: object
              properties:
                config:
                  description: 'NetworkAttachmentDefinition config is a JSON-formatted CNI configuration'
                  type: string
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: multus
rules:
  - apiGroups: ["k8s.cni.cncf.io"]
    resources:
      - '*'
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/status
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
      - update
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: multus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multus
subjects:
  - kind: ServiceAccount
    name: multus
    namespace: cozy-multus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multus
  namespace: cozy-multus
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: multus-daemon-config
  namespace: cozy-multus
  labels:
    tier: node
    app: multus
data:
  daemon-config.json: |
    {
        "chrootDir": "/hostroot",
        "cniVersion": "0.3.1",
        "logLevel": "verbose",
        "logToStderr": true,
        "cniConfigDir": "/host/etc/cni/net.d",
        "multusAutoconfigDir": "/host/etc/cni/net.d",
        "multusConfigFile": "auto",
        "multusMasterCNI": "05-cilium.conflist",
        "socketDir": "/host/run/multus/"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cozy-multus
  namespace: cozy-multus
  labels:
    tier: node
    app: multus
    name: multus
spec:
  selector:
    matchLabels:
      name: multus
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        tier: node
        app: multus
        name: multus
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      serviceAccountName: multus
      containers:
        - name: kube-multus
          image: ghcr.io/cozystack/cozystack/multus-cni:v1.6.0@sha256:0a92e861ead179dd6b46f475fd8878d44b3cfa40ce4d7a8ff92f790d54250d25
          command: [ "/usr/src/multus-cni/bin/multus-daemon" ]
          # Upstream sets 50Mi for both the request and the limit. This patch
          # already raised the request to 100Mi and DELETED the memory limit
          # outright, leaving only the CPU one -- which left the pod cgroup with
          # no memory.max, and the Talos userspace OOM handler (v1.12+) only
          # ever kills cgroups that lack it. So dropping the limit to survive
          # 50Mi is what made multus an eviction candidate on every node.
          #
          # Restore a limit, sized as a backstop rather than a ceiling: 14d peak
          # is 230Mi on a 3-node dev cluster and this grows with pods per node,
          # so upstream's 50Mi was never survivable and a fitted value would
          # trade a rare pressure-driven kill for a deterministic one.
          #
          # 1Gi rather than a tighter multiple of that peak, because the peak is
          # the part least worth trusting here: multus-daemon holds per-pod
          # state and a 3-node dev cluster understates pods per node more than
          # it understates anything else measured for this change. The scar this
          # avoids is the vertical-pod-autoscaler updater, which OOM-looped at a
          # 110Mi limit for the same reason -- it scaled with pods in the
          # cluster -- and was given a limit 2.5x its measured request to stop
          # it. A limit costs nothing until it is hit; only the request reserves.
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "1Gi"
          securityContext:
            privileged: true
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: cni
              mountPath: /host/etc/cni/net.d
            # multus-daemon expects that cnibin path must be identical between pod and container host.
            # e.g. if the cni bin is in '/opt/cni/bin' on the container host side, then it should be mount to '/opt/cni/bin' in multus-daemon,
            # not to any other directory, like '/opt/bin' or '/usr/bin'.
            - name: cnibin
              mountPath: /opt/cni/bin
            - name: host-run
              mountPath: /host/run
            - name: host-var-lib-cni-multus
              mountPath: /var/lib/cni/multus
            - name: host-var-lib-kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: HostToContainer
            - name: host-run-k8s-cni-cncf-io
              mountPath: /run/k8s.cni.cncf.io
            - name: host-run-netns
              mountPath: /run/netns
              mountPropagation: HostToContainer
            - name: multus-daemon-config
              mountPath: /etc/cni/net.d/multus.d
              readOnly: true
            - name: hostroot
              mountPath: /hostroot
              mountPropagation: HostToContainer
            - mountPath: /etc/cni/multus/net.d
              name: multus-conf-dir
          env:
            - name: MULTUS_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      initContainers:
        - name: install-multus-binary
          image: ghcr.io/cozystack/cozystack/multus-cni:v1.6.0@sha256:0a92e861ead179dd6b46f475fd8878d44b3cfa40ce4d7a8ff92f790d54250d25
          command:
            - "/usr/src/multus-cni/bin/install_multus"
            - "-d"
            - "/host/opt/cni/bin"
            - "-t"
            - "thick"
          # Short-lived, but it still needs a limit for the pod cgroup to get
          # memory.max — the init container counts.
          resources:
            requests:
              cpu: "10m"
              memory: "15Mi"
            limits:
              memory: "128Mi"
          securityContext:
            privileged: true
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
              mountPropagation: Bidirectional
{{- $stageCniPlugins := lower (ternary "false" (printf "%v" .Values.stageCniPlugins) (kindIs "invalid" .Values.stageCniPlugins)) }}
{{- if not (has $stageCniPlugins (list "true" "yes" "on" "1" "false" "no" "off" "0")) }}{{- fail (printf "stageCniPlugins: expected a boolean, got %q" $stageCniPlugins) }}{{- end }}
{{- if has $stageCniPlugins (list "true" "yes" "on" "1") }}
        - name: install-cni-plugins
          image: ghcr.io/cozystack/cozystack/multus-cni:v1.6.0@sha256:0a92e861ead179dd6b46f475fd8878d44b3cfa40ce4d7a8ff92f790d54250d25
          command:
            - "sh"
            - "-c"
            - |
              set -eu
              # cilium and kube-ovn write into this directory too, and a
              # plugin here may be executing, so each install is a rename.
              trap 'rm -rf /host/opt/cni/bin/.tmp-cozystack-multus-* || :' EXIT
              if [ ! -d /cni-plugins ]; then
                echo "no /cni-plugins in this image; skipping staging" >&2
                exit 0
              fi
              failed=
              for plugin in /cni-plugins/*; do
                [ -e "$plugin" ] || continue
                name="${plugin##*/}"
                tmp="/host/opt/cni/bin/.tmp-cozystack-multus-${name}"
                # A directory at either end makes every step succeed while
                # installing nothing.
                rm -rf "$tmp" || { failed="${failed} ${name}"; continue; }
                if [ -d "/host/opt/cni/bin/${name}" ]; then
                  echo "${name} is a directory, not a plugin binary; left as is" >&2
                  failed="${failed} ${name}"
                  continue
                fi
                if cp -f "$plugin" "$tmp" && chmod 0755 "$tmp" &&
                   mv -f "$tmp" "/host/opt/cni/bin/${name}"; then
                  continue
                fi
                rm -rf "$tmp" || :
                failed="${failed} ${name}"
              done
              if [ -n "$failed" ]; then
                echo "failed to install:${failed}" >&2
                echo "those were left as they were" >&2
                echo "the cause for each is earlier in this log" >&2
                echo "failed to install:${failed}" > /dev/termination-log 2>/dev/null || true
              fi
              exit 0
          # Short-lived, but it still needs a limit for the pod cgroup to get
          # memory.max — the init container counts. Same 128Mi as the sibling
          # install-multus-binary above: both only copy binaries to the host.
          resources:
            requests:
              cpu: "10m"
              memory: "15Mi"
            limits:
              memory: "128Mi"
          # cilium's install-cni-binaries copies plugin binaries into this same
          # directory with ALL capabilities dropped, in the spc_t domain, with
          # no privileged flag. On a node with SELinux enforcing, a container
          # that has dropped every capability still cannot write a host-labelled
          # directory without a domain that permits it.
          #
          # mountPropagation is absent: it governs mounts made INSIDE the
          # container, which this script does not make, and the API server
          # rejects Bidirectional unless the container is privileged.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seLinuxOptions:
              level: s0
              type: spc_t
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
{{- end }}
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cni
          hostPath:
            path: /etc/cni/net.d
        - name: cnibin
          hostPath:
            path: /opt/cni/bin
        - name: hostroot
          hostPath:
            path: /
        - name: multus-daemon-config
          configMap:
            name: multus-daemon-config
            items:
            - key: daemon-config.json
              path: daemon-config.json
        - name: host-run
          hostPath:
            path: /run
        - name: host-var-lib-cni-multus
          hostPath:
            path: /var/lib/cni/multus
        - name: host-var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: host-run-k8s-cni-cncf-io
          hostPath:
            path: /run/k8s.cni.cncf.io
        - name: host-run-netns
          hostPath:
            path: /run/netns/
        - name: multus-conf-dir
          hostPath:
            path: /etc/cni/multus/net.d
