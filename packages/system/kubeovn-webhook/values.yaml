portSecurity: true
routes: ""
# Client-certificate verification for callers of the /mutate-pods endpoint.
#
# The handler returns namespace-derived annotations to whoever asks it, so the
# only thing that keeps it from answering an arbitrary in-cluster pod is
# authenticating the caller (GHSA-g883-q79m-8225), or constraining who can
# reach it at all -- see webhookPolicy below, which does the latter. A *core*
# NetworkPolicy is not an option here: packages/system/kubeovn/values.yaml sets
# ENABLE_NP: false, so kube-ovn-controller programs no ACLs and the object would
# be created and never enforced. A CiliumClusterwideNetworkPolicy is enforced
# by Cilium regardless, which is the path webhookPolicy takes.
#
# Empty (the default) = certificates are requested and logged, never required.
# Nothing is rejected, so this cannot break admission. Read the webhook log:
#   "client certificate: presented, issuer ..."  → enforcement is possible
#   "client certificate: none presented"         → it is not, yet
#
# Leave it empty. There is nothing to point it at yet: the pod mounts only its
# own serving secret at /etc/webhook/certs, and the ca.crt in there is this
# webhook's serving CA, not the API server's client CA. A path that does not
# exist aborts startup; that ca.crt starts cleanly and then rejects every
# API-server handshake. Either way this webhook is registered with
# failurePolicy: Fail, so pod creation stops cluster-wide.
#
# Enabling enforcement is the second step, and it lands as one change: a volume
# carrying the API server's client CA, a pool that reloads when that CA rotates,
# and this key pointed at the mounted path. Until then the flag exists so the
# observation above can run, not so it can be switched on.
clientCAFile: ""
image: ghcr.io/cozystack/cozystack/kubeovn-webhook:v1.7.0-alpha.3@sha256:7ee7d74d486bcbb5b5b57569e8dd5a38e84e71244ecd3ca476b6e9f4cdead9e2
# Restrict who may reach the webhook's serving port.
#
# The handler returns namespace-derived annotations to any caller, and only the
# API server should be calling it. clientCAFile above cannot enforce that on a
# stock control plane -- the API server presents no client certificate unless
# its AdmissionConfiguration names a kubeConfigFile for the webhook plugins,
# and a stock Cozystack control plane ships only a PodSecurity block. Until
# that changes, this policy is the enforcement.
#
# Rendered as a CiliumClusterwideNetworkPolicy on purpose: kube-ovn runs with
# ENABLE_NP: false, so a core NetworkPolicy object would be created and never
# enforced. The template renders only when that Cilium API is discoverable; set
# enabled: false to opt out explicitly.
# The port is deliberately not configurable here. It has to agree with the
# container port and the Service targetPort, and because the policy runs with
# default-deny disabled, a disagreement fails open: the policy would deny a port
# nothing serves while the real one stayed reachable, removing this control
# without breaking anything visible. The source-side endpoint deny and the
# target-side world deny both read that one definition -- see
# namespace-annotation-webhook.port in templates/_helpers.tpl. Only the backend
# port is denied; Cilium translates a service to its backends before enforcing
# egress policy, so ClusterIP-addressed traffic is matched there too. That last
# step depends on Cilium owning service load-balancing --
# packages/system/cilium/values.yaml kubeProxyReplacement, true there against an
# upstream default of "false", pinned by
# packages/system/cilium/tests/kube_proxy_replacement_test.yaml, which carries
# the argument. Flip it and the ClusterIP path to /mutate-pods reopens while the
# backend deny keeps working -- except that the policy's target-side rule does
# not depend on that value at all, being evaluated on the webhook's own ingress
# path after whatever DNAT already happened, so the two together degrade rather
# than fail open.
#
# Residual risk worth stating: no test in this repo can observe a live cluster's
# Cilium values, so an operator setting kubeProxyReplacement: false in the field
# is caught only by the status ConfigMap that
# packages/system/cilium/templates/kube-proxy-replacement-beacon.yaml renders.
# Whether that configuration is supported at all is a platform question this
# chart does not answer.
webhookPolicy:
  enabled: true
