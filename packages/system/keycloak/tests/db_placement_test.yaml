suite: keycloak-db placement across failure domains
templates:
  - templates/db.yaml

release:
  name: keycloak
  namespace: cozy-keycloak

set:
  _cluster:
    root-host: example.org
    cluster-domain: cozy.local

tests:
  - it: leaves the database placement to the scheduler by default
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - notExists:
          path: spec.affinity
      - notExists:
          path: spec.topologySpreadConstraints

  - it: renders affinity and spread constraints and adds the cluster label selector
    documentSelector:
      path: kind
      value: Cluster
    set:
      database:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values: [zone-a, zone-b]
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            nodeTaintsPolicy: Honor
    asserts:
      - equal:
          path: spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values
          value: [zone-a, zone-b]
      - equal:
          path: spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.topologySpreadConstraints[0].nodeTaintsPolicy
          value: Honor
      - equal:
          path: spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            cnpg.io/cluster: keycloak-db

  - it: keeps a label selector the operator wrote
    documentSelector:
      path: kind
      value: Cluster
    set:
      database:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                custom: label
    asserts:
      - equal:
          path: spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            custom: label

  - it: falls back to the cluster-wide scheduling constraints when the database sets none
    documentSelector:
      path: kind
      value: Cluster
    set:
      _cluster:
        root-host: example.org
        cluster-domain: cozy.local
        scheduling:
          globalAppTopologySpreadConstraints: |
            topologySpreadConstraints:
              - maxSkew: 2
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname

  - it: prefers the database constraints over the cluster-wide ones
    documentSelector:
      path: kind
      value: Cluster
    set:
      _cluster:
        root-host: example.org
        cluster-domain: cozy.local
        scheduling:
          globalAppTopologySpreadConstraints: |
            topologySpreadConstraints:
              - maxSkew: 2
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
      database:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
    asserts:
      - lengthEqual:
          path: spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
