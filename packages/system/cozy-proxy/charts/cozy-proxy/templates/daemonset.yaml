apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cozy-proxy.fullname" . }}
  labels:
    {{- include "cozy-proxy.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "cozy-proxy.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "cozy-proxy.name" . }}
      annotations:
        {{- toYaml .Values.daemonset.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cozy-proxy.fullname" . }}
      hostNetwork: {{ .Values.daemonset.hostNetwork }}
      containers:
        - name: cozy-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Scopes the nftables rules to the backends hosted on this node.
            # Without it cozy-proxy programs every service on every node, and a
            # node that does not host the backend rewrites the destination of a
            # packet merely leaving it, which desynchronises conntrack on the
            # owning node and gets the reply dropped by port_filter.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
      tolerations:
      - operator: Exists
