apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: IPAMProvider
metadata:
  name: in-cluster
spec:
  # https://github.com/kubernetes-sigs/cluster-api-ipam-provider-in-cluster
  #
  # Who needs this, and why it is not in a KubeVirt install: see the dependsOn
  # edge in packages/core/platform/sources/capi-provider-infra-proxmox.yaml.
  #
  # v1.1.x declares the v1beta2 contract, which capmox v0.9 needs (it is built
  # against v1.1.0). It needs capi-providers-core >= v1.11.
  version: v1.1.1-ipam-in-cluster
  fetchConfig:
    selector:
      matchLabels:
        ipamprovider-provider: in-cluster
  deployment:
    containers:
    - name: manager
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
