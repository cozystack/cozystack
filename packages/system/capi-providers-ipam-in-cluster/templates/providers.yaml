apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: IPAMProvider
metadata:
  name: in-cluster
spec:
  # https://github.com/kubernetes-sigs/cluster-api-ipam-provider-in-cluster
  #
  # Who needs this, and why it is not in a KubeVirt install: see the dependsOn
  # edge in packages/core/platform/sources/capi-provider-infra-proxmox.yaml.
  #
  # v1.0.x, not v1.1: both serve InClusterIPPool v1alpha2, but v1.1 moves to the
  # v1beta2 contract and its IPAddressClaim API, while capmox v0.7, the only
  # consumer here, is a v1beta1-contract provider. Move the two together.
  version: v1.0.3-ipam-in-cluster
  fetchConfig:
    selector:
      matchLabels:
        ipamprovider-provider: in-cluster
  deployment:
    containers:
    - name: manager
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
