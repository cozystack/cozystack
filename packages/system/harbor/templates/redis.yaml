{{- $spreadConstraints := list }}
{{- with dig "scheduling" "globalAppTopologySpreadConstraints" "" (.Values._cluster | default dict) }}
{{-   $policy := fromYaml . }}
{{-   $spreadConstraints = dig "topologySpreadConstraints" (list) $policy }}
{{-   if or (not (kindIs "slice" $spreadConstraints)) (not $spreadConstraints) }}
{{-     fail (trim (printf "harbor: _cluster.scheduling.globalAppTopologySpreadConstraints must be YAML with a non-empty topologySpreadConstraints list. %s" (get $policy "Error"))) }}
{{-   end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.harbor.fullnameOverride }}-redis-auth
stringData:
  password: {{ .Values.redis.password | quote }}
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: {{ .Values.harbor.fullnameOverride }}-redis
  labels:
    app.kubernetes.io/instance: {{ .Values.harbor.fullnameOverride }}-redis
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  sentinel:
    replicas: 3
    {{- if $spreadConstraints }}
    topologySpreadConstraints:
    {{- range $spreadConstraints }}
    - {{- toYaml (ternary . (merge (deepCopy .) (dict "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (printf "%s-redis" $.Values.harbor.fullnameOverride) "app.kubernetes.io/component" "sentinel")))) (hasKey . "labelSelector")) | nindent 6 }}
    {{- end }}
    {{- else }}
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.harbor.fullnameOverride }}-redis
          app.kubernetes.io/component: sentinel
    {{- end }}
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  redis:
    replicas: {{ .Values.redis.replicas }}
    {{- if $spreadConstraints }}
    topologySpreadConstraints:
    {{- range $spreadConstraints }}
    - {{- toYaml (ternary . (merge (deepCopy .) (dict "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (printf "%s-redis" $.Values.harbor.fullnameOverride) "app.kubernetes.io/component" "redis")))) (hasKey . "labelSelector")) | nindent 6 }}
    {{- end }}
    {{- else }}
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.harbor.fullnameOverride }}-redis
          app.kubernetes.io/component: redis
    {{- end }}
    resources:
      limits:
        cpu: "1"
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 256Mi
    storage:
      persistentVolumeClaim:
        metadata:
          name: redisfailover-persistent-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.redis.size }}
          {{- with .Values.redis.storageClass }}
          storageClassName: {{ . }}
          {{- end }}
    exporter:
      enabled: true
      image: oliver006/redis_exporter:v1.55.0-alpine
      args:
        - --web.telemetry-path
        - /metrics
      env:
        - name: REDIS_EXPORTER_LOG_FORMAT
          value: txt
    customConfig:
      - tcp-keepalive 0
      - loglevel notice
  auth:
    secretPath: {{ .Values.harbor.fullnameOverride }}-redis-auth
