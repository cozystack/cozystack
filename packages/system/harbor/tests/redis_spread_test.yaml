suite: Harbor sentinels and Redis pods spread over nodes

release:
  name: harbor
  namespace: tenant-root

set:
  harbor:
    fullnameOverride: harbor-test

templates:
  - templates/redis.yaml

tests:
  - it: requires one sentinel and one Redis pod per node by default
    documentSelector:
      path: kind
      value: RedisFailover
    asserts:
      - equal:
          path: spec.sentinel.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Ignore
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: sentinel
      - equal:
          path: spec.redis.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Ignore
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: redis
      - notExists:
          path: spec.sentinel.affinity
      - notExists:
          path: spec.redis.affinity

  - it: renders a cluster-wide spread policy as written
    set:
      _cluster:
        scheduling:
          globalAppTopologySpreadConstraints: |
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
    documentSelector:
      path: kind
      value: RedisFailover
    asserts:
      - equal:
          path: spec.sentinel.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: sentinel
      - equal:
          path: spec.redis.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: redis

  - it: gives every constraint of a cluster-wide policy the selector
    set:
      _cluster:
        scheduling:
          globalAppTopologySpreadConstraints: |
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
    documentSelector:
      path: kind
      value: RedisFailover
    asserts:
      - equal:
          path: spec.sentinel.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: sentinel
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: sentinel
      - equal:
          path: spec.redis.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: redis
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: redis

  - it: keeps a selector the cluster-wide policy sets itself
    set:
      _cluster:
        scheduling:
          globalAppTopologySpreadConstraints: |
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  example.org/spread: all
    documentSelector:
      path: kind
      value: RedisFailover
    asserts:
      - equal:
          path: spec.sentinel.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: sentinel
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  example.org/spread: all
      - equal:
          path: spec.redis.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: harbor-test-redis
                  app.kubernetes.io/component: redis
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  example.org/spread: all

  - it: fails on a cluster-wide policy with an empty topologySpreadConstraints list
    set:
      _cluster:
        scheduling:
          globalAppTopologySpreadConstraints: |
            topologySpreadConstraints: []
    asserts:
      - failedTemplate:
          errorMessage: "harbor: _cluster.scheduling.globalAppTopologySpreadConstraints must be YAML with a non-empty topologySpreadConstraints list."
