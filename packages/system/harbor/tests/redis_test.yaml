suite: redis sentinel sizing

release:
  name: harbor
  namespace: tenant-root

# templates/redis.yaml renders two documents: doc 0 is the redis-auth Secret,
# doc 1 is the RedisFailover. The sentinels must run at Guaranteed QoS
# (requests == limits): guaranteed CPU shares under node contention and top
# eviction priority. A starved sentinel delays master election and stalls
# harbor convergence.
tests:
  - it: sentinel is sized for contended-node convergence (Guaranteed QoS)
    template: templates/redis.yaml
    documentIndex: 1
    set:
      harbor:
        fullnameOverride: harbor-test
    asserts:
      - equal:
          path: spec.sentinel.resources.requests.cpu
          value: 250m
      - equal:
          path: spec.sentinel.resources.limits.cpu
          value: 250m
      - equal:
          path: spec.sentinel.resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.sentinel.resources.limits.memory
          value: 128Mi

  - it: RedisFailover is adopted by the operator group and pins its engine
    template: templates/redis.yaml
    documentIndex: 1
    set:
      harbor:
        fullnameOverride: harbor-test
    asserts:
      # The label is the ONLY point of contact between the CR and the
      # freshworks operator's group selector. A typo in the key or value
      # produces no admission error and no operator log — just a Redis that
      # never provisions and a harbor-core CrashLoop behind it.
      - equal:
          path: metadata.labels["redis-failover.freshworks.com/operator-group"]
          value: cozystack
      # Pin the engine so an operator-default bump (6.2.6->7.2.4) cannot silently
      # move Harbor's Redis onto an on-disk format a platform rollback cannot load.
      - equal:
          path: spec.redis.image
          value: redis:6.2.6-alpine
      - equal:
          path: spec.sentinel.image
          value: redis:6.2.6-alpine
