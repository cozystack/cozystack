opensearch-operator:
  manager:
    # Number of operator replicas. Leader election is enabled automatically only
    # when this is greater than 1. On a single replica leader election adds no HA
    # value but lets a transient apiserver/etcd lease-renewal blip self-terminate
    # the manager (controller-runtime exits on "leader election lost"), which
    # surfaces at install time as a crashlooping, Failed Deployment.
    replicaCount: 1
    # Enable cluster-wide mode to watch all namespaces
    watchNamespace: ""
    # Built in-tree from images/opensearch-operator, which carries the
    # bootstrap voting-exclusion patch. Without this block the vendored chart
    # falls back to opensearchproject/opensearch-operator at the chart's
    # appVersion, which is the unpatched upstream build, and the reference stays
    # outside the first-party set hack/lib/image-refs.sh collects for promote,
    # retag and mirror. `make image` rewrites both keys on every build.
    image:
      repository: ghcr.io/cozystack/cozystack/opensearch-operator
      tag: v1.6.4-rc.1@sha256:eedd4218844e88cd0e10559a18a97d53b911e1d0f5a5e677b04abb49c68c6607
  kubeRbacProxy:
    image:
      # gcr.io/kubebuilder/kube-rbac-proxy was sunset; use the original upstream
      repository: "quay.io/brancz/kube-rbac-proxy"
