apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: ControlPlaneProvider
metadata:
  name: kamaji
spec:
  # https://github.com/clastix/cluster-api-control-plane-provider-kamaji
  # Upstream release + the v1alpha1 conversion webhook patch
  # (images/cluster-api-control-plane-provider-kamaji/patches/), see the
  # Dockerfile there. Bump along with UPSTREAM_VERSION / COZYSTACK_REV in
  # the package Makefile.
  version: v0.21.0-cozystack.0
  fetchConfig:
    selector:
      matchLabels:
        cp-components: cozy
  deployment:
    containers:
    - name: controller
      resources:
        limits:
          cpu: "1"
          memory: 1024Mi
        requests:
          cpu: "10m"
          memory: 128Mi
