ingress-nginx:
  controller:
    extraArgs:
      enable-ssl-passthrough: ""
    image:
      registry: ghcr.io
      image: cozystack/ingress-nginx-with-protobuf-exporter/controller
      tag: v1.11.5
      digest: sha256:f51c7ee0968ad542d4b77854fc57f68e17b2f6e498bcd168cd5f42b409bf54e6
    allowSnippetAnnotations: true
    replicaCount: 2
    admissionWebhooks:
      certManager:
        enabled: true
    metrics:
      enabled: true
    extraContainers:
    - name: protobuf-exporter
      image: ghcr.io/cozystack/ingress-nginx-with-protobuf-exporter/protobuf-exporter:v1.11.5@sha256:0f981014415e00cfee3bf38f7ca084e6774150d6a57774e73da04acd8b346335
      args:
      - --server.telemetry-address=0.0.0.0:9090
      - --server.exporter-address=0.0.0.0:9091
      resources:
        limits:
          cpu: 100m
          memory: 90Mi
        requests:
          cpu: 100m
          memory: 90Mi
    service:
      #type: NodePort # ClusterIP
      externalTrafficPolicy: "Local"
      #allocateLoadBalancerNodePorts: false
    config:
      ## proxy protocol
      #use-proxy-protocol: "true"
      #use-forwarded-headers: "true"
      #compute-full-forwarded-for: "true"
      #real-ip-header: "proxy_protocol"
      #enable-real-ip: "true"
      # keep-alive
      proxy-connect-timeout: "10"
      proxy-read-timeout: "10"
      keep-alive-requests: "1000000"
      upstream-keepalive-requests: "100000"
      upstream-keepalive-time: '1m'
      upstream-keepalive-timeout: "60"
      upstream-keepalive-connections: "320"
      ssl-session-tickets: "true"
    resources:
      limits:
        cpu: "1"
        memory: 2048Mi
      requests:
        cpu: 100m
        memory: 90Mi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 10
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - '{{ include "ingress-nginx.name" . }}'
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - '{{ .Release.Name }}'
              - key: app.kubernetes.io/component
                operator: In
                values:
                - controller
            topologyKey: kubernetes.io/hostname
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - '{{ include "ingress-nginx.name" . }}'
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - '{{ .Release.Name }}'
              - key: app.kubernetes.io/component
                operator: In
                values:
                - controller
            topologyKey: topology.kubernetes.io/zone

  defaultBackend:
    enabled: true
    # The chart default, defaultbackend-amd64, has no arm64 build. This image
    # is the upstream multi-arch replacement: 404 on :8080, /healthz for probes.
    image:
      registry: registry.k8s.io
      image: ingress-nginx/custom-error-pages
      tag: v1.2.9
      digest: sha256:203d3020005dbdd735c1ad51f238d8663b9851399b52cc0c9c9e3f7273b6b299
    resources:
      limits:
        cpu: 10m
        memory: 20Mi
      requests:
        cpu: 10m
        memory: 20Mi

# Deny Cilium-managed pod traffic to the admission webhook. The API server
# remains reachable directly on a management cluster or through the
# konnectivity-agent ServiceAccount on a Kamaji-hosted tenant cluster;
# host-network workloads remain outside this pod policy.
#
# Rendered as a CiliumClusterwideNetworkPolicy, and the template renders only
# while that Cilium API is discoverable. So `true` is not a promise that a
# policy exists: on a cluster serving no such API the chart emits nothing,
# without an Event or a render-time message to look at. Set enabled: false to
# opt out deliberately, which is what separates "this cluster has no Cilium"
# from "this deny was not wanted here".
#
# The policy denies the webhook's backend port only, which covers a pod dialling
# the Service ClusterIP because Cilium translates a service to its backends
# before it enforces egress policy. That depends on Cilium owning service
# load-balancing -- packages/system/cilium/values.yaml kubeProxyReplacement,
# true there against an upstream default of "false". It is pinned by
# packages/system/cilium/tests/kube_proxy_replacement_test.yaml, which carries
# the argument; flip it and the ClusterIP path to this webhook reopens while the
# backend deny keeps working. The target-side rule in the same policy does not
# depend on that value at all -- it is evaluated on the webhook's own ingress
# path, after whatever DNAT already happened -- so the two together degrade
# rather than fail open.
#
# Residual risk worth stating: no test in this repo can observe a live cluster's
# Cilium values, so an operator setting kubeProxyReplacement: false in the field
# is caught only by the status ConfigMap that
# packages/system/cilium/templates/kube-proxy-replacement-beacon.yaml renders,
# and inside a tenant Kubernetes cluster only by the equivalent beacon in
# packages/apps/kubernetes. Whether that configuration is supported at all is a
# platform question this chart does not answer.
admissionWebhookPolicy:
  enabled: true
