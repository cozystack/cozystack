# cozystack-owned autoscaling observability, rendered by this umbrella chart's
# own templates (templates/alerts.yaml, templates/dashboard.yaml) — NOT passed to
# the vendored KEDA subchart.
databaseAutoscaling:
  alerts:
    enabled: true
  dashboard:
    enabled: true

keda:
  # Cozystack ships a Prometheus (VictoriaMetrics) stack by default, so surface
  # KEDA's operator, metrics-server and webhook metrics through ServiceMonitors.
  prometheus:
    operator:
      enabled: true
      serviceMonitor:
        enabled: true
    metricServer:
      enabled: true
      serviceMonitor:
        enabled: true
    webhooks:
      enabled: true
      serviceMonitor:
        enabled: true
