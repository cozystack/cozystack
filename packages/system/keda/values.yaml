keda:
  # Cozystack ships a Prometheus (VictoriaMetrics) stack by default, so surface
  # KEDA's operator, metrics-server and webhook metrics through ServiceMonitors.
  prometheus:
    operator:
      enabled: true
      serviceMonitor:
        enabled: true
    metricServer:
      enabled: true
      serviceMonitor:
        enabled: true
    webhooks:
      enabled: true
      serviceMonitor:
        enabled: true
