{{- if .Values.databaseAutoscaling.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-autoscaling-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    # Picked up by the Grafana dashboard sidecar (labelKey: grafana_dashboard).
    grafana_dashboard: "1"
    app.kubernetes.io/name: database-autoscaling-dashboard
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  database-autoscaling.json: |-
{{ .Files.Get "dashboards/database-autoscaling.json" | indent 4 }}
{{- end }}
