{{- if .Values.databaseAutoscaling.alerts.enabled }}
{{- /*
Alerts for cozystack managed-database read-replica autoscaling. KEDA names the
HPA it generates "keda-hpa-<scaledobject>", so every rule scopes to
horizontalpodautoscaler=~"keda-hpa-.*". Metric names/labels are calibrated on a
live cluster per the design proposal's PoC; the rule shapes are what this ships.

Scope caveat: these rules match EVERY KEDA-managed HPA / ScaledObject error, not
only database ones, because the underlying kube_horizontalpodautoscaler_* and
keda_scaled_object_errors_total series carry no label identifying the cozystack
app that owns the ScaledObject. This is correct today because database
autoscaling is KEDA's sole consumer in cozystack; if a non-database ScaledObject
is ever added, scope these rules (e.g. by a namespace/label the DB objects carry)
so they stop mis-attributing unrelated autoscaling to "database".
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: database-autoscaling
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: database-autoscaling
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  groups:
  - name: database-autoscaling.rules
    rules:
    {{- /*
    Scale-up genuinely stuck: quota-rejected standby, unbindable PVC, or
    unschedulable pod. desired > current alone would also fire on every healthy
    load-driven scale-up, because a new CNPG standby joins via a full basebackup
    that routinely exceeds 15m while the pod is Running (not Ready) — so intersect
    with an actually-Pending CNPG cluster pod, which a healthy clone is not. The
    Pending term is scoped to CNPG pods via label_cnpg_io_cluster so an unrelated
    Pending pod co-resident in the tenant namespace does not trip it.
    There is no automatic rollback (see the design proposal); this is the operator's
    signal to resolve it.

    NOTE (deliberately no "load metric absent" rule): the ScaledObject pins
    ignoreNullValues=false, so a broken pod-label pipeline (no CNPG kube_pod_labels at all)
    empties the query and surfaces as a KEDA scaler error (caught by
    DatabaseAutoscalerScalerErrors below) with the HPA holding — not a silent drift to the
    floor. The residual gap (kube_pod_labels healthy but the load series itself gone) has
    no clean alert: absent(cnpg_backends_total{state="active"})
    cannot tell a genuinely idle cluster from a broken exporter, and CPU-mode clusters
    do not use that series at all. Operators should instead alert on the CNPG
    podMonitor / cadvisor scrape target being down for autoscaled namespaces.
    */}}
    - alert: DatabaseAutoscalerScaleStuck
      expr: |-
        (
          kube_horizontalpodautoscaler_status_desired_replicas{job="kube-state-metrics",horizontalpodautoscaler=~"keda-hpa-.*"}
          > kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics",horizontalpodautoscaler=~"keda-hpa-.*"}
        )
        and on(namespace) (
          max by (namespace) (
            kube_pod_status_phase{phase="Pending"}
            * on(namespace,pod) group_left() kube_pod_labels{label_cnpg_io_cluster!=""}
          ) > 0
        )
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Database autoscaler cannot reach its desired replica count.
        description: HPA {{ "{{ $labels.horizontalpodautoscaler }}" }} in namespace {{ "{{ $labels.namespace }}" }} has wanted more replicas than are available for 15m while a pod in the namespace is Pending (stuck scale-up — likely quota, unbindable PVC, or unschedulable pod, not a healthy basebackup).
    {{- /*
    Pinned at the configured maximum under sustained load. NOT keyed on the HPA's
    ScalingLimited condition: that is true in BOTH clamp directions (TooManyReplicas at
    max AND TooFewReplicas at min), and this autoscaler's idle desired = 1 + ceil(0/target)
    = 1 clamps UP to the floor, so an idle cluster would report ScalingLimited=true forever
    and this alert would fire on every quiet DB with the wrong "raise maxReplicas" advice.
    Instead compare desired to the HPA's own max: it fires only when the cluster is
    actually at the ceiling. (The render guard rejects a quorum floor above maxReplicas,
    so maxReplicas is the true ceiling.)
    */}}
    - alert: DatabaseAutoscalerAtMax
      expr: |-
        kube_horizontalpodautoscaler_status_desired_replicas{job="kube-state-metrics",horizontalpodautoscaler=~"keda-hpa-.*"}
        >= on(namespace,horizontalpodautoscaler)
        kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics",horizontalpodautoscaler=~"keda-hpa-.*"}
      for: 30m
      labels:
        severity: info
      annotations:
        summary: Database autoscaler has been at maxReplicas for 30m.
        description: HPA {{ "{{ $labels.horizontalpodautoscaler }}" }} in namespace {{ "{{ $labels.namespace }}" }} has wanted its maximum replica count (autoscaling.maxReplicas) for 30m under sustained load — raise maxReplicas if more read capacity is needed.
    {{- /*
    KEDA cannot evaluate the trigger (vmselect unreachable, query invalid, or — with
    ignoreNullValues=false — an empty result from a broken metrics pipeline): scaling
    stops and this fires. Never scale blind.
    */}}
    - alert: DatabaseAutoscalerScalerErrors
      expr: |-
        increase(keda_scaled_object_errors_total[15m]) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: KEDA scaler is erroring for a managed database.
        description: KEDA reported scaler errors over the last 15m for a database ScaledObject (metric source unreachable or query invalid); the desired count is not being updated.
    {{- /*
    KEDA operator down / not reporting: it reconciles ScaledObjects into HPAs, so while
    it is unhealthy (e.g. the leader-election crash-loop the package guards against) the
    desired count stops being actuated. keda_build_info is emitted by the operator; its
    absence means the operator is down or unscraped.
    Cross-tenant scoping: this PrometheusRule becomes a VMRule that EVERY tenant's VMAlert
    evaluates (selectAllByDefault), each against its OWN vmselect. keda_build_info is
    scraped only into the root monitoring stack, so a bare absent(keda_build_info) would
    fire forever in every tenant that runs its own Monitoring app, about a healthy
    platform component the tenant does not operate. Gate it on the presence of keda-hpa-*
    HPA series (kube-state-metrics, root-only, same series the other rules key on): the
    rule then evaluates to nothing in a datasource that has no KEDA HPAs at all, and only
    fires where database autoscaling is actually in use but the operator's series vanished.
    Tradeoff: like ScaleStuck/ScalerErrors it cannot catch "KEDA down with zero HPAs yet"
    — an inherent limit of keying on keda-hpa-* series, accepted over a permanent
    cross-tenant false-fire.
    */}}
    - alert: DatabaseAutoscalerKedaOperatorDown
      expr: |-
        absent(keda_build_info)
        and on() (count(kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics",horizontalpodautoscaler=~"keda-hpa-.*"}) > 0)
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: KEDA operator is not reporting; database autoscaling is not being actuated.
        description: The KEDA operator has emitted no keda_build_info for 10m (down, crash-looping, or unscraped). ScaledObjects are not being reconciled into HPAs, so autoscaled databases stay pinned at their admitted count and requested floors do not materialize.
{{- end }}
