suite: database-autoscaling Grafana dashboard
templates:
  - templates/dashboard.yaml
release:
  name: keda
  namespace: cozy-keda
tests:
  - it: renders a Grafana dashboard ConfigMap picked up by the sidecar
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels["grafana_dashboard"]
          value: "1"
      - isNotNullOrEmpty:
          path: data["database-autoscaling.json"]

  - it: can be disabled
    set:
      databaseAutoscaling:
        dashboard:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
