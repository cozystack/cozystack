# helm-unittest merges per-test capabilities into the suite's rather than
# replacing them, so the absent-API case is its own suite, pinned at suite level.
suite: BMC credentials admission policy is gated on the ValidatingAdmissionPolicy API
templates:
  - templates/bmc-secrets-policy.yaml
capabilities:
  apiVersions: []
tests:
  - it: renders nothing where the policy API is not served
    asserts:
      - hasDocuments:
          count: 0
