suite: BMC credentials admission policy
templates:
  - templates/bmc-secrets-policy.yaml
capabilities:
  apiVersions:
    - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
tests:
  - it: renders the policy and a Deny binding scoped to the BMC namespace
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: kind
          value: ValidatingAdmissionPolicy
      - documentIndex: 0
        equal:
          path: spec.failurePolicy
          value: Fail
      - documentIndex: 0
        equal:
          path: spec.matchConstraints.namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: cozy-node-remediation-bmc
      - documentIndex: 0
        equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [secrets]
      - documentIndex: 0
        equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value: [CREATE, UPDATE]
      - documentIndex: 1
        equal:
          path: kind
          value: ValidatingAdmissionPolicyBinding
      - documentIndex: 1
        equal:
          path: spec.policyName
          value: node-remediation-bmc-credentials
      - documentIndex: 1
        equal:
          path: spec.validationActions
          value: [Deny]

  # The expression is what refuses a Secret: a username key named like a CLI
  # option, a third key, an empty password. Pinning its text keeps a rewording
  # from loosening it without this suite noticing.
  - it: requires exactly a non-empty username and password
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.validations[0].expression
          pattern: variables\.data\.size\(\) == 2
      - matchRegex:
          path: spec.validations[0].expression
          pattern: size\(variables\.data\.username\) > 0
      - matchRegex:
          path: spec.validations[0].expression
          pattern: size\(variables\.data\.password\) > 0
