---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: fenceagentsremediations.fence-agents-remediation.medik8s.io
spec:
  group: fence-agents-remediation.medik8s.io
  names:
    kind: FenceAgentsRemediation
    listKind: FenceAgentsRemediationList
    plural: fenceagentsremediations
    shortNames:
      - far
    singular: fenceagentsremediation
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: FenceAgentsRemediation is the Schema for the fenceagentsremediations API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: FenceAgentsRemediationSpec defines the desired state of FenceAgentsRemediation
              properties:
                agent:
                  description: |-
                    Agent is the name of fence agent that will be used.
                    It should have a fence_ prefix.
                  pattern: fence_.+
                  type: string
                nodeBinding:
                  description: NodeBinding is populated by NHC from the Node selected for remediation, never by a template.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    systemUUID:
                      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                      type: string
                    uid:
                      minLength: 1
                      type: string
                    version:
                      enum:
                        - v1
                      type: string
                  required:
                    - name
                    - systemUUID
                    - uid
                    - version
                  type: object
                  x-kubernetes-validations:
                    - message: node binding is immutable
                      rule: self == oldSelf
                nodeSecretNames:
                  additionalProperties:
                    type: string
                  description: NodeSecretNames maps the node name to the Secret name which contains params relevant for that node.
                  type: object
                nodeparameters:
                  additionalProperties:
                    additionalProperties:
                      type: string
                    type: object
                  description: NodeParameters are passed to the fencing agent according to the node that is fenced, since they are node specific
                  type: object
                remediationStrategy:
                  default: ResourceDeletion
                  description: |-
                    RemediationStrategy is the remediation method for unhealthy nodes.
                    Currently, it could be either "OutOfServiceTaint" or "ResourceDeletion".
                    ResourceDeletion will iterate over all pods related to the unhealthy node and delete them.
                    OutOfServiceTaint will add the out-of-service taint which is a new well-known taint "node.kubernetes.io/out-of-service"
                    that enables automatic deletion of pv-attached pods on failed nodes, "out-of-service" taint is only supported on clusters with k8s version 1.26+ or OCP/OKD version 4.13+.
                  enum:
                    - ResourceDeletion
                    - OutOfServiceTaint
                  type: string
                retrycount:
                  default: 5
                  description: RetryCount is the number of times the fencing agent will be executed
                  type: integer
                retryinterval:
                  default: 5s
                  description: RetryInterval is the interval between each fencing agent execution
                  pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                  type: string
                safetyPolicy:
                  description: SafetyPolicy opts into identity-bound Redfish Off verification.
                  enum:
                    - RedfishOffV1
                  type: string
                sharedSecretName:
                  description: |-
                    SharedSecretName is the name of the Secret which contains shared fence agent parameters.

                    Heads up: in an earlier version this had a default value of "fence-agents-credentials-shared".
                    We removed that default to be able to differentiate during CR validation between using a Secret or not.

                    As a temporary workaround this field will be set with the old default value in case a Secret with the
                    old default of "fence-agents-credentials-shared" is found. Also, in case the field contains the old default
                    value, but the Secret does not exist, the value will be deleted. This workaround will be removed in a future version.
                  type: string
                sharedparameters:
                  additionalProperties:
                    type: string
                  description: SharedParameters are parameters common to all nodes
                  type: object
                timeout:
                  default: 60s
                  description: Timeout is the timeout for each fencing agent execution
                  pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                  type: string
              required:
                - agent
              type: object
            status:
              description: FenceAgentsRemediationStatus defines the observed state of FenceAgentsRemediation
              properties:
                conditions:
                  description: |-
                    Represents the observations of a FenceAgentsRemediation's current state.
                    Known .status.conditions.type are: "Processing", "FenceAgentActionSucceeded", and "Succeeded".
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                lastUpdateTime:
                  description: LastUpdateTime is the last time the status was updated.
                  format: date-time
                  type: string
                offProof:
                  description: OffProof records confirmed same-system Off for the immutable snapshot.
                  properties:
                    confirmedAt:
                      format: date-time
                      type: string
                    snapshot:
                      description: SafetySnapshot is persisted before action and must match every later effect.
                      properties:
                        binding:
                          description: NodeBinding identifies the Node selected by NHC, independently of later name reuse.
                          properties:
                            name:
                              minLength: 1
                              type: string
                            systemUUID:
                              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                              type: string
                            uid:
                              minLength: 1
                              type: string
                            version:
                              enum:
                                - v1
                              type: string
                          required:
                            - name
                            - systemUUID
                            - uid
                            - version
                          type: object
                          x-kubernetes-validations:
                            - message: node binding is immutable
                              rule: self == oldSelf
                        farUID:
                          type: string
                        generation:
                          format: int64
                          type: integer
                        specDigest:
                          type: string
                        target:
                          description: SafetyTarget contains no credential data or credential-derived digest.
                          properties:
                            credential:
                              description: CredentialVersion invalidates evidence on Secret replacement or content updates.
                              properties:
                                name:
                                  type: string
                                namespace:
                                  type: string
                                resourceVersion:
                                  type: string
                                uid:
                                  type: string
                              required:
                                - name
                                - namespace
                                - resourceVersion
                                - uid
                              type: object
                            endpoint:
                              type: string
                            systemURI:
                              type: string
                            trustDigest:
                              type: string
                          required:
                            - credential
                            - endpoint
                            - systemURI
                            - trustDigest
                          type: object
                      required:
                        - binding
                        - farUID
                        - generation
                        - specDigest
                        - target
                      type: object
                  required:
                    - confirmedAt
                    - snapshot
                  type: object
                safetyAttempts:
                  description: SafetyAttempts reserves action attempts before contacting the BMC, including across restarts.
                  minimum: 0
                  type: integer
                safetyLastAttempt:
                  description: SafetyLastAttempt preserves retry spacing across status events and leader restarts.
                  format: date-time
                  type: string
                safetySnapshot:
                  description: SafetySnapshot fixes the target before any safety-mode effects; it is not Off evidence.
                  properties:
                    binding:
                      description: NodeBinding identifies the Node selected by NHC, independently of later name reuse.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        systemUUID:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                          type: string
                        uid:
                          minLength: 1
                          type: string
                        version:
                          enum:
                            - v1
                          type: string
                      required:
                        - name
                        - systemUUID
                        - uid
                        - version
                      type: object
                      x-kubernetes-validations:
                        - message: node binding is immutable
                          rule: self == oldSelf
                    farUID:
                      type: string
                    generation:
                      format: int64
                      type: integer
                    specDigest:
                      type: string
                    target:
                      description: SafetyTarget contains no credential data or credential-derived digest.
                      properties:
                        credential:
                          description: CredentialVersion invalidates evidence on Secret replacement or content updates.
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                            resourceVersion:
                              type: string
                            uid:
                              type: string
                          required:
                            - name
                            - namespace
                            - resourceVersion
                            - uid
                          type: object
                        endpoint:
                          type: string
                        systemURI:
                          type: string
                        trustDigest:
                          type: string
                      required:
                        - credential
                        - endpoint
                        - systemURI
                        - trustDigest
                      type: object
                  required:
                    - binding
                    - farUID
                    - generation
                    - specDigest
                    - target
                  type: object
              type: object
          type: object
          x-kubernetes-validations:
            - message: RedfishOffV1 requires a binding, bounded retries and off-only Redfish OOS remediation
              rule: '!has(self.spec.safetyPolicy) || (has(self.spec.nodeBinding) && self.spec.retrycount >= 1 && self.spec.retrycount <= 5 && self.spec.agent == ''fence_redfish'' && self.spec.remediationStrategy == ''OutOfServiceTaint'')'
            - message: nodeBinding requires a safety policy
              rule: '!has(self.spec.nodeBinding) || has(self.spec.safetyPolicy)'
            - message: safety-mode spec is immutable
              rule: '!has(oldSelf.spec.safetyPolicy) || self.spec == oldSelf.spec'
      served: true
      storage: true
      subresources:
        status: {}
