{{- /* Render only where the ValidatingAdmissionPolicy API is served. Same guard as the hostname policies in cozystack-basics. */}}
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
---
# Refuses a BMC credentials Secret with anything but a non-empty username and
# password, the shape the fence-agents operator requires. The operator's
# template webhook reads every Secret the template names when the template
# is admitted; a Secret written or replaced after that is seen by the
# operator only when a remediation reaches it, and this policy is what
# refuses it at the keyboard. The policy sees Secrets written after it
# exists, so the credentials are created after this release is Ready.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: node-remediation-bmc-credentials
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cozy-node-remediation-bmc
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["secrets"]
  variables:
  - name: data
    expression: >-
      has(object.data) ? object.data : {}
  validations:
  - expression: >-
      variables.data.size() == 2 &&
      has(variables.data.username) && size(variables.data.username) > 0 &&
      has(variables.data.password) && size(variables.data.password) > 0
    message: >-
      a BMC credentials Secret in cozy-node-remediation-bmc holds exactly the keys username and password, both non-empty; the fence agent takes its target from the remediation template, never from the Secret
    reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: node-remediation-bmc-credentials
spec:
  policyName: node-remediation-bmc-credentials
  validationActions: [Deny]
{{- end }}
