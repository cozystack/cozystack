suite: snapshot CRDs and the VolumeGroupSnapshot gate

# The vendored chart renders the snapshot CRDs from a template, so they belong
# to this release: keepCRDs stops an uninstall from taking every VolumeSnapshot
# with them. The group snapshot API is read at v1 by snapshot-controller,
# csi-snapshotter and the linstor gate, and at v1beta2 by Velero 1.18 and the
# vm-instance hook. The controller only acts on group snapshots with the
# CSIVolumeGroupSnapshot gate on.

templates:
  - charts/snapshot-controller/templates/crds.yaml
  - charts/snapshot-controller/templates/deployment_controller.yaml

tests:
  - it: every CRD is kept on uninstall
    template: charts/snapshot-controller/templates/crds.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: the volume snapshot CRDs CDI and the CSI drivers read are rendered
    template: charts/snapshot-controller/templates/crds.yaml
    asserts:
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: volumesnapshots.snapshot.storage.k8s.io
          any: true
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: volumesnapshotcontents.snapshot.storage.k8s.io
          any: true
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: volumesnapshotclasses.snapshot.storage.k8s.io
          any: true

  - it: volumegroupsnapshots serves v1 and v1beta2
    template: charts/snapshot-controller/templates/crds.yaml
    documentSelector:
      path: metadata.name
      value: volumegroupsnapshots.groupsnapshot.storage.k8s.io
    asserts:
      - contains:
          path: spec.versions
          content:
            name: v1
            served: true
          any: true
      - contains:
          path: spec.versions
          content:
            name: v1beta2
            served: true
          any: true

  - it: volumegroupsnapshotcontents serves v1 and v1beta2
    template: charts/snapshot-controller/templates/crds.yaml
    documentSelector:
      path: metadata.name
      value: volumegroupsnapshotcontents.groupsnapshot.storage.k8s.io
    asserts:
      - contains:
          path: spec.versions
          content:
            name: v1
            served: true
          any: true
      - contains:
          path: spec.versions
          content:
            name: v1beta2
            served: true
          any: true

  - it: volumegroupsnapshotclasses serves v1 and v1beta2
    template: charts/snapshot-controller/templates/crds.yaml
    documentSelector:
      path: metadata.name
      value: volumegroupsnapshotclasses.groupsnapshot.storage.k8s.io
    asserts:
      - contains:
          path: spec.versions
          content:
            name: v1
            served: true
          any: true
      - contains:
          path: spec.versions
          content:
            name: v1beta2
            served: true
          any: true

  - it: the controller runs with the CSIVolumeGroupSnapshot gate
    template: charts/snapshot-controller/templates/deployment_controller.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=CSIVolumeGroupSnapshot=true
