installCRDs: true

# Annotate the CRDs with `helm.sh/resource-policy: keep`, so that `helm uninstall` leaves them
# in place instead of deleting them along with every VolumeSnapshot in the cluster. Only takes
# effect when installCRDs is true.
keepCRDs: false

controller:
  enabled: true

  replicaCount: 1

  revisionHistoryLimit: 10

  fullnameOverride: ""

  args:
    leaderElection: true
    leaderElectionNamespace: "$(NAMESPACE)"
    httpEndpoint: ":8080"
    featureGates: CSIVolumeGroupSnapshot=true

  image:
    repository: registry.k8s.io/sig-storage/snapshot-controller
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []

  podAnnotations: {}

  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  resources: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  ##
  pdb: {}

  topologySpreadConstraints: []

  rbac:
    # Specifies whether RBAC resources should be created
    create: true

  serviceAccount:
    # Specifies whether a ServiceAccount should be created
    create: true
    name: ""

  serviceMonitor:
    # Specifies whether a ServiceMonitor should be created
    create: false

  priorityClassName: ""
    # Specifies wether a Priority Class should be attached to deployment pods

  # Change `hostNetwork` to `true` when you want the pod to share its host's network namespace.
  hostNetwork: false

  # DNS settings for the controller pod. https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
  dnsConfig: {}
  # DNS Policy for controller pod. For Pods running with hostNetwork, set to `ClusterFirstWithHostNet`
  # For further reference: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy.
  dnsPolicy: ClusterFirst

webhook:
  # The conversion webhook is only needed for clusters that still hold VolumeGroupSnapshot
  # objects in the v1beta1/v1beta2 API versions. When disabled, the conversion strategy is
  # not injected into the volumegroupsnapshotcontents CRD (it defaults to `None`, matching
  # upstream). Enable this only if you rely on the older group snapshot API versions.
  enabled: false

  replicaCount: 1

  revisionHistoryLimit: 10

  fullnameOverride: ""

  tls:
    certificateSecret: ""
    autogenerate: true
    # Renew the certificate on every request
    renew: false
    # Issuer to pass to the Certificate
    certManagerIssuerRef: {}
    # PEM-Encoded content of ca.crt, tls.crt and tls.key. If set, Helm will not autogenerate the request.
    caBundle: ""
    certificate: ""
    key: ""

  args:
    port: 8443
    tlsCertFile: /etc/webhook/tls.crt
    tlsPrivateKeyFile: /etc/webhook/tls.key

  image:
    repository: registry.k8s.io/sig-storage/snapshot-conversion-webhook
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []

  podAnnotations: {}

  podLabels: {}

  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  resources: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  ##
  pdb: {}

  topologySpreadConstraints: []

  serviceAccount:
    # Specifies whether a ServiceAccount should be created
    create: true
    name: ""

  priorityClassName: ""
  # Specifies wether a Priority Class should be attached to deployment pods

  # Change `hostNetwork` to `true` when you want the pod to share its host's network namespace.
  hostNetwork: false

  # DNS settings for the controller pod. https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
  dnsConfig: {}
  # DNS Policy for controller pod. For Pods running with hostNetwork, set to `ClusterFirstWithHostNet`
  # For further reference: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy.
  dnsPolicy: ClusterFirst


