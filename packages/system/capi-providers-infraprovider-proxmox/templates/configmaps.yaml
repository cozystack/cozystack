apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capi-providers-infraprovider-proxmox.version" . }}
  {{- /*
    NOT 'infraprovider-components: cozy'. That label already identifies the
    KubeVirt provider's ConfigMap, and a shared label would put both in the
    same match. The kubeadm/talos bootstrap packages separate on a
    'bootstrap-provider' key for the same reason; this mirrors that.

    The version label is what keeps a renamed ConfigMap from matching twice.
    capi-operator lists every ConfigMap the selector matches and refuses a
    provider while more than one is returned, before it reads spec.version
    (processProviderConfigMaps). During a Helm upgrade that bumps the version
    the old and the new ConfigMap coexist for the length of the release, so a
    selector without the version matches both and the reconcile fails until
    Helm deletes the old one. With it, each upgrade sees exactly one.
  */}}
  labels:
    provider.cluster.x-k8s.io/version: {{ include "capi-providers-infraprovider-proxmox.version" . }}
    infraprovider-provider: proxmox
  annotations:
    provider.cluster.x-k8s.io/compressed: "true"
binaryData:
  components: {{ .Files.Get "files/components.gz" | b64enc | quote }}
data:
  metadata: {{ .Files.Get "files/metadata.yaml" | quote }}
