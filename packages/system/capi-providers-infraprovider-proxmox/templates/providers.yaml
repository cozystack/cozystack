apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: proxmox
spec:
  # https://github.com/ionos-cloud/cluster-api-provider-proxmox
  #
  # Pinned to the v0.7 series. v0.8 moves capmox to the v1beta2 contract and
  # stores v1alpha2. v1alpha1 is still served through conversion, but that has
  # not been tested with the kubernetes-nodes templates, and in-cluster IPAM
  # should move to v1.1 at the same time. Bump the two together.
  version: v0.7.7-infraprovider-proxmox
  configSecret:
    name: {{ .Values.credentialsSecretName | quote }}
    namespace: {{ .Release.Namespace }}
  fetchConfig:
    selector:
      matchLabels:
        infraprovider-provider: proxmox
  deployment:
    containers:
    - name: manager
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
