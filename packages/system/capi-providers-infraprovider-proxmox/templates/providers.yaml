apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: proxmox
spec:
  # https://github.com/ionos-cloud/cluster-api-provider-proxmox
  #
  # Pinned to the v0.7 series: from v0.8 capmox declares the v1beta2 Cluster API
  # contract, while the core provider shipped here is v1.10.1, which serves
  # v1beta1. Bump this together with capi-providers-core, not on its own.
  version: v0.7.7-infraprovider-proxmox
  configSecret:
    name: {{ .Values.credentialsSecretName | quote }}
    namespace: {{ .Release.Namespace }}
  fetchConfig:
    selector:
      matchLabels:
        infraprovider-provider: proxmox
  deployment:
    containers:
    - name: manager
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
