apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: proxmox
spec:
  # https://github.com/ionos-cloud/cluster-api-provider-proxmox
  #
  # Pinned to the v0.7 series: v0.8 moves capmox to its v1alpha2 API, and the
  # kubernetes-nodes chart still renders ProxmoxMachineTemplate at v1alpha1.
  # Moving past v0.7 means migrating those objects first.
  version: v0.7.7-infraprovider-proxmox
  configSecret:
    name: {{ .Values.credentialsSecretName | quote }}
    namespace: {{ .Release.Namespace }}
  fetchConfig:
    selector:
      matchLabels:
        infraprovider-provider: proxmox
  deployment:
    containers:
    - name: manager
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
